<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
        "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<title>%@</title>
<style type="text/css">
    body {
        background-color: #fff;
        color: black;
    }

    body {
        font-family: sans-serif;
        padding:8px 0;
    }

    tr:nth-child(odd) {
        background: #f4f4f4;
    }
    
    td {
        font-family: sans-serif;
        padding:4px 0.5em;
        text-align:left;
        white-space: nowrap;
    }

    td:nth-child(1) {
        text-align:center;
        padding:4px 0;
        width: 2em;
    }

    td:nth-child(2) {
        max-width: 0;
        overflow:hidden;
    }
    
    td:nth-child(3) {
        text-align:right;
        width: 4em;
    }
       
    td:nth-child(4) {
        text-align:left;
        width: 7em;
    }

    table {
        width:100%% ! important;
    }

        
    a {
        text-decoration:none;
        color:inherit;
    }


    @media (prefers-color-scheme: dark) {
        body {
            background-color: #282828;
            color: #eee;
        }
        tr:nth-child(odd) {
            background: #333;
        }
    }

</style>
</head>
<body>
<h3>%@</h3>
<table>
%@
</table>
</body>
