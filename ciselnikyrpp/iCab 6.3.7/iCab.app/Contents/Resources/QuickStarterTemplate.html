<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
        "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<title>%@</title>
<style type="text/css">
body {
	background-color: #fff;
	color: black;
}
body.dark {
    background-color: #181818;
    color: #eee;
}
body {
	font-family: sans-serif;
	padding:8px 0;
    text-align:center;
}
div.empty {
	padding:18px;
	font-size:larger;
}
.box {
	width: 128px;
	height: 128px;
    float: left;
	padding:2em 2em;
	position:relative;
}
img.thumbnail {
    padding-top:1px;
    padding-bottom:1px;
    border: none;
	display:block;
	width: 64px;
	height: 64px;
	margin: 4px auto;
	-webkit-border-radius: 8px;
}
span.title {
    display:block;
	width: 128px;
    height: 3.8em;
	margin: 8px auto;
	overflow: hidden;
	text-align:center;
    font-size: 0.8em;
    position:relative;
    left:0px;
    
    -webkit-mask-image: -webkit-linear-gradient(top, rgba(0,0,0,1),rgba(0,0,0,1),rgba(0,0,0,1), rgba(0,0,0,0));
}
    
a {
    text-decoration:none;
    color:inherit;
}

.frame {
    text-align:left;
    display:inline-block;
}

@media (prefers-color-scheme: dark) {
    body {
        background-color: #282828;
        color: #eee;
    }
}

</style>
</head>
<body>
<div class="frame" id="frame">
%@
</div>
</body>
