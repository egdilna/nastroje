<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
        "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width" />
<link rel="alternate" type="application/rss+xml" href="%@">
<title>RSS Reader</title>
<style type="text/css">

body {
    font-family: HelveticaNeue-Light, sans-serif;
    margin:0;
    padding:0;
    background-color: white;
}

.date {
    font-size:0.6em;
    font-weight:normal;
    color:#888;
    white-space: nowrap;
}

h2, h1 {
    margin-top: 0.4em;
    margin-bottom: 0.2em;
}


a {
    color : #005;
    text-decoration: none;
}

a:visited {
    color : #505;
}

img {
    margin: 2px 5px;
}

img.logo {
    border: none;
    margin: 5px;
    height: 80px;
}

.subtitle {
    font-size: 1em;
    font-weight: normal;
    margin: 0.3em 0;
}

div.temp {
    position:absolute;
    top: 10000px;
    left: 10000px;
    width: 1px;
    height: 1px;
    visibility: hidden;
}

div.header {
    padding: 2px 10px 10px 10px;
    background-color: #f2f2f2;
    border-bottom: 1px solid #888;
    min-height: 100px;
}

div.item {
    padding: 2px 10px 10px 10px;
    background-color: #fff;
    border-bottom: 1px solid #888;
}

div.item:after {
    display: block;
    content: "\a0";
    height: 1px;
    clear: both;
}

</style>

<script type="text/javascript">

iCabMobileFeedReader = 1;

function LoadRSSFeed(url) {
    var finished = false;
    var isPodcast = false;
    var htmlMode = false;

    var prefix = "";

    function IsEqual(a,b) {
        return (a == b || htmlMode && (a == b.toUpperCase() || a == b+"_" || a == b.toUpperCase()+"_"));
    }
    
    function GetURLForNewTab(url) {
        return url+ "\" target=\"RSS";
    }


    function GetCode(node, onlyChilds) {
        var code = "";
        if (node.nodeType == 3 || node.nodeType == 2) {
            if (node.nodeType == 2) code += "<!--";
            code += node.nodeValue.replace(/</g,"&lt;");
            if (node.nodeType == 2) code += "-->";
        } else {
            if (onlyChilds == false) {
                code = "<" + node.tagName;
                if (node.attributes) {
                    for (i=0; i<node.attributes.length; i++) {
                        code += " " + node.attributes[i].name + "=\"";
                        code += node.attributes[i].nodeValue.replace(/"/g,"&quot;");
                        code += "\"";
                    }
                }
                code += ">";
            }
            var c = node.firstChild;
            while (c) {
                code += GetCode(c, false);
                c = c.nextSibling;
            }
            if (onlyChilds == false && IsEqual(node.tagName,"br") && IsEqual(node.tagName,"img")) {
                code += "<\/" + node.tagName + ">";
            }
        }
        return code;
    }

    function SetResult(code) {
        var destination = document.getElementById("result");
        if (destination) {
            destination.innerHTML = code;
        }
    }

    function getElement(parent, name) {
        var child = parent.firstChild;
        while (child) {
            if (IsEqual(child.tagName, name)) break;
            if (htmlMode) {
                var c = getElement(child, name);
                if (c) return c;
            }
            child = child.nextSibling;
        }
        return child;
    }

    function GetContent(node,name) {
        var code = "";
        if (name) {
            var element = getElement(node,name);
            if (element) {
                var xhtml = false;
                if (prefix) {
                    var a = element.getAttribute("type");
                    if (IsEqual(a, "xhtml")) {
                        xhtml = true;
                    }
                }
                if (xhtml) {
                    code = GetCode(element, true);
                } else if (element.firstChild) {
                    // code = element.firstChild.nodeValue;
                    var child = element.firstChild;
                    while (child) {
                        if (child.nodeType == 3) {
                            code += child.nodeValue;
                        } if (child.nodeType == 4) {
                            code += child.nodeValue
                        }
                        child = child.nextSibling;
                    }
                }
            }
        }
        if (code.indexOf("<![CDATA[") == 0 && code.lastIndexOf("]]>") == code.length-3) {
            code = code.substr(9,code.length-12);
        }
        return code;
    }
    
    function GetLink(node) {
        var code = GetContent(node,"link");
        if (!code || code == "") {
            var element = getElement(node,"link");
            if (element) {
                code = element.getAttribute("href");
            }
        }
        return code;
    }
    
    function GetPodcastCode(node) {
        var code = "";
        var type = "";
        var url = "";
        var length = 0;
        var element = getElement(node,"enclosure");
        if (!element) {
            element = getElement(node,"link");
            if (element) {
                while (element) {
                    if (IsEqual(element.tagName,"link") && IsEqual(element.getAttribute("rel"),"enclosure")) {
                        type = element.getAttribute("type");
                        url = element.getAttribute("href");
                        length = element.getAttribute("length");
                        break;
                    }
                    element = element.nextSibling;
                }
            }
        } else {
            type = element.getAttribute("type");
            url = element.getAttribute("url");
            length = element.getAttribute("length");
        }
        if (url && (!type || type == "" || type.indexOf("audio/") >= 0 || type.indexOf("video/") >= 0 || type.indexOf("image/") >= 0)) {
            isPodcast = true;
            code += "<a href=\"" + GetURLForNewTab(url) + "\">";
            if (type.indexOf("audio/") >= 0) {
                code += " \u266c";
            } else {
                code += " \u27a1";
            }
            if (length) {
                var unit;
                if (length < 1024) {
                    unit = "Bytes";
                } else if (length < 1024 * 1024) {
                    length = Math.round(length / 1024);
                    unit = "KB";
                } else {
                    length = Math.round(length / (1024 * 1024));
                    unit = "MB";
                }
                code += " <small>(" + length + unit + ")<\/small>"
            }
            code += "<\/a>";
        }
        return code;
    }
        
    function GetDescriptionCode(node, details) {
        var code = "";
        var description = GetContent(node,"itunes:subtitle");
        if (description != "") {
            code += "<h2 class='subtitle'>" + description + "<\/h2>";
        }
        description = GetContent(node,"description");
        if (description == "") {
            description = GetContent(node,"subtitle");
        }
        if (description == "") {
            description = GetContent(node,"summary");
        }
        if (description == "") {
            description = GetContent(node,"itunes:summary");
        }
        if (description == "") {
            description = GetContent(node,"content");
        }
        if (details && prefix && description == "") {
            description = GetContent(node,prefix+"content");
        }
        if (description != "") {
            description = description.replace(/<.div>/g, "");
            description = description.replace(/<div.*>/g, "<p>");
            description = description.replace(/<.p>/g, "");
            description = description.replace(/<.span>/g, "");
            description = description.replace(/<span.*>/g, "");
            description = description.replace(/<.fieldset>/g, "");
            description = description.replace(/<fieldset.*>/g, "");
            description = description.replace(/\n/g, " ");
            description = description.replace(/\r/g, " ");
            description = description.replace(/ +/g, " ");
            description = description.replace(/(<p> *)+/g, "<p>");
                                                                     
            if (description.length > 512) {
                description = description.substr(0,512)
                var i = description.length-1;
                while (i > 0) {
                    if (description.charAt(i) == '>') break;
                    if (description.charAt(i) == '<') {
                        description = description.substr(0,i);
                        break;
                    }
                    i--;
                }
                description +=  "</a></i></em></b></u></strong></span>...";
            }

            code += "<div>" + description;
            code += GetPodcastCode(node);
            code += "<\/div>";
        }
        return code;
    }
    
    function intFromString(s) {
        if (s.charAt(0) == '0') s = s.substr(1);
        return parseInt(s);
    }
    
    function GetTitleCode(node) {
        var code = "";
        var title = GetContent(node,"title");
        if (prefix != "" && title == "") {
            title = GetContent(node,prefix+"title");
        }
        var date = GetContent(node,"pubDate");
        if (!date) date = GetContent(node,"lastBuildDate");
        if (!date) date = GetContent(node,"updated");
        if (title != "") {
            var link = GetLink(node);
            if (link != "") {
                navlinks = true;
                code += "<a href=\"" + GetURLForNewTab(link) + "\">";
            }
            code += title;
            if (link != "") {
                code += "<\/a>";
            }
            if (date) {
                if (date.charAt(4) == '-' && date.charAt(7) == '-' && date.charAt(10) == 'T') {
                    var months = new Array("Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec");
                    var y = intFromString(date.substr(0,4));
                    var m = intFromString(date.substr(5,2))-1;
                    var d = intFromString(date.substr(8,2));
                    var h = intFromString(date.substr(11,2));
                    var min = intFromString(date.substr(14,2));
                    var s = intFromString(date.substr(17,2));
                    date = "Sat, "+d+" "+months[m]+" "+y+" "+h+":"+min+":"+s+" GMT";
                }
                var d = new Date(date);
                if (d.toLocaleString() != "Invalid Date") {
                    date = d.toLocaleString();
                }
                code += "<br><span class='date'>("+date+")</span>";
            }
        }
        return code;
    }

    function GetImageCode(node) {
        var code = "";
        var img = node.getElementsByTagName("image");
        if (img && img.length > 0) {
            var i;
            for (i=0; i < img.length; i++) {
                var url = GetContent(img[i],"url");
                if (url != "") {
                    var link = GetContent(img[i],"link");
                    if (link != "") {
                        code += "<a href=\"" + GetURLForNewTab(link) + "\">";
                    }
                    code += "<img class='logo' src=\"" + url + "\" align=\"right\">";
                    if (link != "") {
                        code += "<\/a>";
                    }
                    break;
                }
            }
        } else {
            var url = GetContent(node,"logo");
            if (url != "") {
                var link = GetContent(node,"id");
                if (link != "") {
                    code += "<a href=\"" + GetURLForNewTab(link) + "\">";
                }
                code += "<img class='logo' src=\"" + url + "\" align=\"right\">";
                if (link != "") {
                    code += "<\/a>";
                }
            }
        }
        return code;
    }

    function GetHeaderCode(node) {
        code = "<div class='header'>"
        code += GetImageCode(node);
        code += "<h1>" + GetTitleCode(node) + "<\/h1>";
        code += GetDescriptionCode(node, false);
        code += "<br clear='all'><\/div>";
        return code;
    }

    function GetItemCode(node) {
        var code = "<div class='item'>";
        code += "<h2>" + GetTitleCode(node) + "<\/h2>";
        code += GetDescriptionCode(node, true);
        code += "<\/div>";
        return code;
    }

    function Error() {
        var code = "<div style='border: #bb0 medium solid; padding: 1em; margin: 0.5em; float:left; background-color: #ffd;'>";
        code += "<table><tr><td valign='top'>";
        code += "<div style='font-size:150pt; color:#800; font-face:bold; float:left; margin:5pt 25pt 0 0;'>!</div>";
        code += "<td><h2 style='margin-top:0'>Network Error</h2><p style='margin:0.5em 0'>";
        code += "<b>An error occurred while accessing '%@'!</b><p style='margin:0.5em 0'>%@";
        code += "<p style='margin:0.5em 0'><small>(Network Error #%i)</small></table></div>";
        SetResult(code);
    }


    function ProcessRSSFeed(xml) {
        var code = "";
        var channels = xml.getElementsByTagName("channel");
        if (!channels || channels.length == 0) {
            channels = xml.getElementsByTagName("feed");
        }
        if (!channels || channels.length == 0) {
            for (j=0; j<xml.childNodes.length; j++) {
                n = xml.childNodes[j];
                if (n && n.attributes) {
                    for (i=0; i<n.attributes.length; i++) {
                        if (n.attributes[i].name.indexOf("xmlns:") == 0 && n.attributes[i].nodeValue == "http://www.w3.org/2005/Atom") {
                            prefix = n.attributes[i].name.substring(6)+":";
                        }
                    }
                }
            }
            if (prefix) {
                channels = xml.getElementsByTagName(prefix+"feed");
            }
        }
        if (channels && channels.length > 0) {
            code = GetHeaderCode(channels[0]);
                        
            var items = xml.getElementsByTagName("item");
            if (prefix && (!items || items.length == 0)) {
                items = xml.getElementsByTagName(prefix+"item");
            }
            if (!items || items.length == 0) {
                items = xml.getElementsByTagName("entry");
            }
            if (prefix && (!items || items.length == 0)) {
                items = xml.getElementsByTagName(prefix+"entry");
            }
            if (items && items.length > 0) {
                for (var i=0; i< items.length; i++) {
                    code += GetItemCode(items[i]);
                }
            }
            
            SetResult(code);
        } else {
            Error();
        }
    }

    function RSSFeedStatusChanged(e) {
        if (req.readyState == 4 && finished == false) {
            if (req.status == 200) {
                finished = true;
                if (req.responseXML) {
                    ProcessRSSFeed(req.responseXML);
                } else {
                    htmlMode = true;
                    var temp = document.getElementById("temp");
                    var source = req.responseText.replace(/title\>/g, "title_>");
                    source = source.replace(/link\>/g, "link_>");
                    source = source.replace(/\<\!\[CDATA\[/g, " ");
                    source = source.replace(/\]\]\>/g, " ");
                    temp.innerHTML = source;
                    temp = temp.firstChild;
                    while (temp && temp.nodeType != 1) temp = temp.nextSibling;
                    if (temp) ProcessRSSFeed(temp);
                    temp = document.getElementById("temp");
                    temp.innerHTML = "";
                }
            } else {
                Error();
            }
        }
    }

    try {
        var req = new XMLHttpRequest();
        req.onreadystatechange = RSSFeedStatusChanged;
        req.onload = RSSFeedStatusChanged;
        req.onerror = RSSFeedStatusChanged;
        req.overrideMimeType("text/xml");
        req.open("GET",url);
        req.send(null);
    } catch(e) {
        Error();
    }
}
</script>
</head>
<body onload="LoadRSSFeed('%@')">
<div id="result"></div>
<div id="temp"></div>
</body>
</html>
