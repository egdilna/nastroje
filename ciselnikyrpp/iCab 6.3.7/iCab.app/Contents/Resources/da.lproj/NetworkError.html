<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
        "http://www.w3.org/TR/html4/loose.dtd">
<html>
<meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
<title>Netværksfejl</title>
<style>
body {
    font-family: HelveticaNeue-Light, sans-serif;
    font-size: 16pt;
}
b {
    display:block;
    word-wrap: break-word;
}
.sign {
    font-family: sans-serif;
    font-size:4em;
    color:#fff;
    font-weight:bold;
    text-align: center;

    -webkit-border-radius:0.05em;
    border-radius:0.05em;
    position:relative;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0.75em 1.4em 0.75em;
    border-color: transparent transparent #c00 transparent;
    margin:0.1em 0.2em 0 0;
}
.sign div {
    font-size:0.95em;
    color:#000;
    font-weight:bold;
    text-align: center;
    
    -webkit-border-radius:0.05em;
    border-radius:0.05em;
    
    position:relative;
    top:0.19em;
    left:-0.65em;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0.65em 1.2em 0.65em;
    border-color: transparent transparent #ffc transparent;
    margin:0 0.2em 0 0;
}
.sign span {
    position:relative;
    left:-0.18em;
    top:0.18em;
}

.box {
    border: #dd8 thin solid;
    padding: 1em;
    margin: 0.5em;
    width: 90%%;
    background-color: #ffe;
}
p {
    line-height:1.4em;
}
.main {
    display:absolute;
    margin-left:6.5em;
    margin-top:-6em;
}

</style>

<script type="text/javascript">
var iCabErrorPage = 1;
</script>
<body>
<div class="box">
    <div class="sign"><div><span>!</span></div></div>
    <div class="main">
        <h2 style='margin-top:0'>Netværksfejl</h2>
        <p style='margin:0.5em 0'>
        Der opstod en fejl adgang til<br>
        <b>%@</b>
        </p>
        <p style='margin:0.5em 0'>
        %@
        </p>
        <p style='margin:0.5em 0'>
        <small>(Netværksfejl #%i)</small>
        </p>
    </div>
</div>
</body>
