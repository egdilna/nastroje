<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
"http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Página Filtrada</title>
    <style>
    body {
        font-size:15pt;
        font-family: HelveticaNeue-Light, sans-serif;
    }
    a, a:link, a:visited, a:active {
        text-decoration:none;
        color: #00A;
        display:inline-block;
        text-align: center;
        padding: 0.3em 0.3em;
        width:12em;
        margin:1em 1em 1em 1em;
        border: 1px solid #00A;
        border-radius: 5px;
    }
    a:active {
        background-color: #ddf;
    }
    p {
        line-height:1.4em;
    }
    
    a.filter {
        border: 1px solid #00a;
        background-color: #ddf;
    }
    a.nofilter {
        border: 1px solid #a00;
        background-color: #fdd;
    }

    </style>
</head>
<body>
    <h2>Página Filtrada</h2>
    <p>
    Esta página fue filtrada debido a la configuracion de un filtro. Usted puede activar desactivar o editar los filtros en las preferencias de iCab.
    <hr>
    <p>
    
    <p style='margin:1.5em 0; text-align:center;'>
        
    <a class='nofilter' href='%@'>Abrir página sin <br>aplicar los filtros</a>
</body>
</html>
