<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKM – Dynamický správce znalostí</title>
<style>
:root,:root[data-theme="light"]{--bg:#fafaf9;--sf:#fff;--sf2:#f4f4f3;--bd:#e3e3e1;--bds:#c6c6c3;--tx:#1a1a1a;--mu:#6b6b6b;--ac:#1d4ed8;--ach:#1e40af;--acb:#eff6ff;--acf:#fff;--dg:#b91c1c;--dgb:#fef2f2;--ok:#15803d;--wn:#a16207;--fc:#2563eb;--cma:#dcfce7;--cmat:#14532d;--cmd:#fee2e2;--cmdt:#7f1d1d;--cmm:#fef08a;--cmc:#fef3c7;--cmct:#713f12;--r:6px;--rs:4px;--rl:10px;--ss:0 1px 2px rgba(0,0,0,.04);--sm:0 4px 12px rgba(0,0,0,.06);--tr:150ms ease;--ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* Tmavý */
:root[data-theme="dark"]{--bg:#1a1a1a;--sf:#242424;--sf2:#2e2e2e;--bd:#3a3a3a;--bds:#525252;--tx:#f5f5f5;--mu:#a3a3a3;--ac:#60a5fa;--ach:#93c5fd;--acb:#1e3a8a40;--acf:#0b1220;--dg:#f87171;--dgb:#7f1d1d40;--ok:#4ade80;--wn:#fbbf24;--fc:#60a5fa;--cma:#14532d70;--cmat:#bbf7d0;--cmd:#7f1d1d70;--cmdt:#fecaca;--cmm:#713f1280;--cmc:#713f1280;--cmct:#fde68a;--ss:0 1px 2px rgba(0,0,0,.35);--sm:0 4px 12px rgba(0,0,0,.45)}
/* Papír — teplý sépiový list se serifovým písmem */
:root[data-theme="paper"]{--bg:#f2e9d5;--sf:#fbf4e3;--sf2:#eee3c9;--bd:#dccfae;--bds:#bfa87f;--tx:#3a2f20;--mu:#6b5b43;--ac:#8a5a2b;--ach:#6b4520;--acb:#f0e3c8;--acf:#fdf7ea;--dg:#9b2c2c;--dgb:#f5e2de;--ok:#4a6b2f;--wn:#8a6d1f;--fc:#8a5a2b;--cma:#e2eccd;--cmat:#34461e;--cmd:#f2ddd8;--cmdt:#6b2420;--cmm:#f1e3a6;--cmc:#f4e8c6;--cmct:#5c4718;--ss:0 1px 2px rgba(90,70,40,.10);--sm:0 4px 14px rgba(90,70,40,.16);--ff:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
/* Matrix — zelený text na černém, monospace, decentní záře */
:root[data-theme="matrix"]{--bg:#000600;--sf:#04120a;--sf2:#071c0e;--bd:#12401f;--bds:#1f7a37;--tx:#4dff86;--mu:#2fa85a;--ac:#00ff41;--ach:#8dffb0;--acb:#062b13;--acf:#001a06;--dg:#ff5f56;--dgb:#2a0707;--ok:#00ff41;--wn:#d7ff5c;--fc:#00ff41;--cma:#06301a;--cmat:#7dffa8;--cmd:#3a0d0d;--cmdt:#ffb3ae;--cmm:#3a3a08;--cmc:#2c2c06;--cmct:#e8ff9a;--ss:0 0 0 1px rgba(0,255,65,.10);--sm:0 6px 22px rgba(0,255,65,.14);--ff:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme="matrix"] body{text-shadow:0 0 5px rgba(0,255,65,.20)}
:root[data-theme="matrix"] ::selection{background:#00ff41;color:#000}
:root[data-theme="matrix"] .app-title{letter-spacing:.03em}
:root[data-theme="matrix"] .btn-pri{box-shadow:0 0 10px rgba(0,255,65,.35)}
:root[data-theme="matrix"] .tab[aria-selected=true]{text-shadow:0 0 8px rgba(0,255,65,.55)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ff);font-size:15px;line-height:1.5;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fc);outline-offset:2px;border-radius:var(--rs)}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:0;top:0;background:var(--ac);color:var(--acf);padding:.5rem 1rem;text-decoration:none;transform:translateY(-100%);z-index:1000}
.skip:focus{transform:translateY(0)}
.app-header{background:var(--sf);border-bottom:1px solid var(--bd);padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.app-title{font-size:1.1rem;font-weight:600;margin:0;display:flex;align-items:center;gap:.5rem}
.app-title small{font-weight:400;color:var(--mu);font-size:.85rem}
.app-header-actions{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.unsaved{font-size:.8rem;color:var(--wn);margin-right:.5rem;background:transparent;border:0;cursor:pointer;padding:0;font-family:inherit}
.unsaved:hover{text-decoration:underline}
.unsaved:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.unsaved[hidden]{display:none}
.diff-body{max-height:60vh;overflow:auto}
.diff-sec{margin-bottom:1rem;padding:.4rem .6rem;border-radius:var(--r);border:1px solid var(--bd)}
.diff-sec h3{margin:.2rem 0 .5rem;font-size:1rem}
.diff-added{background:rgba(72,187,120,.08)}
.diff-modified{background:rgba(237,187,72,.08)}
.diff-deleted{background:rgba(229,72,72,.08)}
.diff-row{padding:.3rem 0;border-bottom:1px dashed var(--bd);display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.diff-row:last-child{border-bottom:0}
.diff-modified.diff-row{flex-direction:column;align-items:stretch}
.diff-marker{font-weight:700;font-family:monospace;flex-shrink:0;color:var(--mu)}
.diff-lnk{color:var(--ac);text-decoration:none}
.diff-lnk:hover{text-decoration:underline}
.diff-meta{color:var(--mu);font-size:.85rem}
.diff-changes{list-style:none;margin:.2rem 0 0 1.5rem;padding:0;font-size:.85rem}
.diff-changes li{padding:.1rem 0;color:var(--mu);font-family:'SF Mono',Consolas,monospace}
.btn-mode-on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem}
.kanban-col{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem;min-height:100px}
.kanban-h{margin:0 0 .5rem;font-size:.95rem;color:var(--mu);border-bottom:1px dashed var(--bd);padding-bottom:.3rem}
.kanban-cards{display:flex;flex-direction:column;gap:.4rem}
.kanban-card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem;display:flex;flex-direction:column;gap:.3rem}
.kanban-title{font-weight:600;color:var(--tx);text-decoration:none}
.kanban-title:hover{text-decoration:underline}
.kanban-snip{font-size:.85rem;color:var(--mu);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kanban-mv{display:flex;gap:.3rem;align-items:center;margin-top:.2rem}
.timeline{display:flex;flex-direction:column;gap:.6rem}
.timeline-grp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem .7rem}
.timeline-h{margin:0 0 .4rem;font-size:.95rem;color:var(--mu);border-bottom:1px dashed var(--bd);padding-bottom:.3rem}
.timeline-items{display:flex;flex-direction:column;gap:.2rem}
.timeline-row{display:flex;gap:.6rem;align-items:baseline;padding:.2rem 0}
.timeline-date{font-family:'SF Mono',Consolas,monospace;color:var(--mu);font-size:.85rem;flex-shrink:0;min-width:6rem}
.timeline-date-empty{opacity:.5}
.timeline-title{color:var(--tx);text-decoration:none;flex:1}
.timeline-title:hover{text-decoration:underline}
.timeline-tp{color:var(--mu);font-size:.85rem}
/* Comments */
.cmt-form{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem;margin-bottom:.75rem}
.cmt-form textarea{width:100%;min-height:3rem;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:.4rem;font:inherit}
.cmt-form-act{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;gap:.5rem;flex-wrap:wrap}
.cmt-author-hint{color:var(--mu);font-size:.85rem}
.cmt-list{display:flex;flex-direction:column;gap:.5rem}
.cmt-item{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem .7rem}
.cmt-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem;font-size:.85rem;margin-bottom:.3rem}
.cmt-author{font-weight:600;color:var(--tx)}
.cmt-date{color:var(--mu)}
.cmt-edited{color:var(--mu);font-style:italic}
.cmt-acts{margin-left:auto;display:flex;gap:.3rem}
.cmt-body{color:var(--tx)}
.cmt-body p:first-child{margin-top:0}.cmt-body p:last-child{margin-bottom:0}
.cmt-neigh-h{margin:1rem 0 .3rem;font-size:1rem;color:var(--tx)}
.cmt-neigh-grp{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:.4rem .6rem;margin-bottom:.5rem}
.cmt-neigh-grp-h{margin-bottom:.4rem;padding-bottom:.3rem;border-bottom:1px dashed var(--bd);display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem}
.cmt-neigh-lnk{color:var(--ac);text-decoration:none;font-weight:600}
.cmt-neigh-lnk:hover{text-decoration:underline}
.cmt-neigh-rel{color:var(--mu);font-size:.85rem}
.cmt-neigh-list{display:flex;flex-direction:column;gap:.3rem}
.cmt-neigh-item{background:var(--sf)}
/* Detail responsive two-column layout: comments on the right on wide screens */
.detail-grid{display:grid;gap:1rem;grid-template-columns:1fr}
.detail-main{min-width:0}
.detail-side{min-width:0}
@media (min-width:1200px){
.detail-grid{grid-template-columns:minmax(0,1fr) 380px}
}
@media (min-width:1600px){
.detail-grid{grid-template-columns:minmax(0,1fr) 440px}
}
/* Standalone mode: force single-column since window is narrower */
.standalone-mode .detail-grid{grid-template-columns:1fr}
.cmt-edit-ta{width:100%;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:.4rem;font:inherit}
.cmt-edit-act{display:flex;gap:.4rem;margin-top:.4rem}
/* All-comments view */
.cvw-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}
.cvw-item{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem .7rem}
.cvw-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem;margin-bottom:.3rem}
.cvw-ent{font-weight:600;color:var(--ac);text-decoration:none}
.cvw-ent:hover{text-decoration:underline}
.cvw-meta{color:var(--mu);font-size:.85rem;margin-left:auto}
.cvw-body p:first-child{margin-top:0}.cvw-body p:last-child{margin-bottom:0}
/* Objects */
.obj-list{display:flex;flex-direction:column;gap:.5rem}
.obj-item{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.5rem .7rem}
.obj-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap}
.obj-name{font-weight:600;color:var(--tx);font-family:'SF Mono',Consolas,monospace}
.obj-size{color:var(--mu);font-size:.85rem}
.obj-acts{margin-left:auto;display:flex;gap:.3rem}
.obj-btns{display:flex;gap:.3rem;flex-wrap:wrap}
/* Panels */
.panels-bar{display:flex;flex-wrap:wrap;gap:.3rem;padding:.3rem;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:.6rem;align-items:center}
.panel-tab{display:flex;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.panel-tab-active{background:var(--acb);border-color:var(--ac);box-shadow:inset 0 -2px 0 var(--ac)}
.panel-tab-btn{background:transparent;border:0;padding:.3rem .6rem;color:var(--tx);cursor:pointer;font:inherit;max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:.2rem}
.panel-tab-btn:focus{outline:2px solid var(--ac);outline-offset:-2px}
.panel-tab-x{background:transparent;border:0;padding:.3rem .4rem;color:var(--mu);cursor:pointer;font:inherit;border-left:1px solid var(--bd)}
.panel-tab-x:hover{color:var(--dg);background:var(--acb)}
.panel-tab-add{background:transparent;border:1px dashed var(--bd);border-radius:var(--r);padding:.3rem .6rem;color:var(--mu);cursor:pointer;font:inherit}
.panel-tab-add:hover{color:var(--ac);border-color:var(--ac)}
/* Standalone window mode: hide navigation chrome */
.standalone-mode #tabs,.standalone-mode .panels-bar,.standalone-mode #qa,.standalone-mode .app-title small{display:none !important}
.standalone-mode .app-title{font-size:.85rem;color:var(--mu)}
.standalone-mode .app-header-actions{gap:.3rem}
.standalone-mode #b-imp,.standalone-mode #b-exp{display:none}
.sync-banner{position:fixed;top:.5rem;right:.5rem;background:var(--sf);border:1px solid var(--ac);border-radius:var(--r);padding:.5rem .7rem;display:flex;gap:.4rem;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:150;font-size:.9rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .75rem;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;font-size:.9rem;transition:background var(--tr),border-color var(--tr);text-decoration:none}
.btn:hover{background:var(--sf2)}
.btn-pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.btn-pri:hover{background:var(--ach);border-color:var(--ach)}
.btn-dg{color:var(--dg);border-color:var(--bd)}
.btn-dg:hover{background:var(--dgb);border-color:var(--dg)}
.btn-gh{border-color:transparent;background:transparent}
.btn-gh:hover{background:var(--sf2)}
.btn-sm{padding:.25rem .5rem;font-size:.85rem}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.tabs{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 1rem;display:flex;gap:.25rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:.6rem 1rem;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--mu);font-size:.95rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.4rem;border-radius:0}
.tab:hover{color:var(--tx)}
.tab[aria-selected=true]{color:var(--ac);border-bottom-color:var(--ac);font-weight:500}
.tab-c{background:var(--sf2);padding:.1rem .4rem;border-radius:999px;font-size:.75rem;color:var(--mu)}
/* Záložka, jejíž cíl zmizel — vidět, ale zjevně nefunkční. */
.tab-broken{opacity:.55;text-decoration:line-through}
/* Oddělovač v liště: jen svislá čárka, pro odečítač neexistuje. */
.tab-sep{display:inline-block;width:1px;align-self:center;height:1.4rem;margin:0 .5rem;background:var(--bd)}
.tabs-empty{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .2rem;color:var(--mu);font-size:.9rem}
.zal-vyber{display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin:.2rem 0}
.zal-vyber label{display:inline-flex;align-items:center;gap:.3rem}
main{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 4rem}
.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.toolbar input[type=search]{flex:1;min-width:180px;padding:.45rem .7rem;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf)}
.toolbar select{padding:.45rem .5rem;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf)}
.elist{display:flex;flex-direction:column;gap:.5rem}
.ecard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.75rem .9rem;cursor:pointer;transition:border-color var(--tr),box-shadow var(--tr);display:block;text-decoration:none;color:inherit}
.ecard:hover{border-color:var(--bds);box-shadow:var(--ss)}
.ecard-bulk{position:relative;padding-left:2.4rem}
.ecard-cb{position:absolute;left:.8rem;top:.9rem;width:1.1rem;height:1.1rem;cursor:pointer}
.ecard-sel{background:var(--acb);border-color:var(--ac)}
.ecard-attrs{display:flex;flex-direction:column;gap:.2rem;margin-top:.4rem;font-size:.85rem}
.ecard-attr{display:flex;gap:.4rem;align-items:baseline}
.ecard-attr-l{color:var(--mu);font-weight:500;flex-shrink:0}
.ecard-attr-v{color:var(--tx);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ecard-attr-v .md{white-space:normal}
.ecard-attr-v .md p{margin:0;display:inline}
.advfilter{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:.6rem .8rem;margin-bottom:.75rem}
.advfilter-rows{display:flex;flex-direction:column;gap:.4rem}
.advf-row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;padding:.3rem;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r)}
.advf-row.advf-invalid{border-color:var(--dg)}
.advf-attr{min-width:14rem;flex:1 1 14rem}
.advf-op{min-width:9rem}
.advf-val{min-width:8rem}
.advf-del{margin-left:auto;background:transparent;border-color:var(--bd);color:var(--mu)}
.advf-del:hover{color:var(--dg);border-color:var(--dg)}
.advf-vhost{display:inline-flex;gap:.2rem;align-items:center}
.filter-summary{background:var(--acb);border:1px solid var(--ac);border-radius:var(--r);padding:.4rem .7rem;margin-bottom:.75rem;font-size:.9rem;display:flex;align-items:center;flex-wrap:wrap;gap:.3rem}
.exp-dlg fieldset{margin:0 0 .75rem;border:1px solid var(--bd);border-radius:var(--r);padding:.5rem .7rem;background:var(--sf)}
.exp-dlg fieldset legend{font-weight:600;padding:0 .3rem;color:var(--tx)}
.exp-fmt{margin-top:.75rem;padding:.6rem;background:var(--acb);border:1px solid var(--ac);border-radius:var(--r)}
.back-nav{display:inline-flex;position:relative;gap:0}
.back-nav-dd{padding-left:.4rem;padding-right:.4rem;border-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.back-nav>button:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.back-nav-menu{position:absolute;top:100%;left:0;margin-top:.2rem;min-width:16rem;max-width:22rem;max-height:70vh;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:.2rem}
.back-nav-item{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;width:100%;background:transparent;border:0;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.back-nav-item:hover,.back-nav-item:focus{background:var(--acb);outline:none}
.back-nav-ic{flex-shrink:0;width:1.5rem;text-align:center}
.back-nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-nav-tp{flex-shrink:0;color:var(--mu);font-size:.85rem}
.back-nav-empty{padding:.5rem .7rem;color:var(--mu);font-size:.9rem}
#cmdp{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh}
.cmdp-box{width:min(600px,92vw);background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:70vh;overflow:hidden}
.cmdp-in{border:0;border-bottom:1px solid var(--bd);padding:.75rem 1rem;font-size:1rem;background:var(--sf);color:var(--tx);width:100%}
.cmdp-in:focus{outline:2px solid var(--ac);outline-offset:-2px}
.cmdp-list{list-style:none;margin:0;padding:.3rem;overflow-y:auto;flex:1}
.cmdp-item{display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;border-radius:var(--r);cursor:pointer;font-size:.95rem}
.cmdp-item[aria-selected=true]{background:var(--acb);outline:2px solid var(--ac);outline-offset:-2px}
.cmdp-item:hover{background:var(--acb)}
.cmdp-ic{flex-shrink:0;width:1.5rem;text-align:center}
.cmdp-lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdp-sl{flex-shrink:0;color:var(--mu);font-size:.85rem}
.cmdp-kbd{flex-shrink:0;color:var(--mu);font-size:.75rem;background:var(--sf2);padding:.1rem .4rem;border-radius:3px;border:1px solid var(--bd)}
.cmdp-hint{padding:.4rem .8rem;border-top:1px solid var(--bd);color:var(--mu);font-size:.8rem;background:var(--sf2)}
.wiki-link{color:var(--ac);text-decoration:none;border-bottom:1px dotted var(--ac);padding:0 .1rem}
.wiki-link:hover{background:var(--acb)}
.wiki-type{color:var(--mu);font-size:.9em;margin-left:.15rem}
.wiki-broken{color:var(--dg);text-decoration:none;border-bottom:1px dotted var(--dg);padding:0 .1rem;cursor:help}
.rel-x{background:transparent;border:1px solid var(--bd);border-radius:999px;cursor:pointer;
  margin-left:.35rem;padding:0 .3rem;min-width:1.35rem;line-height:1.35rem;font-size:1rem;
  color:var(--tx)}
.rel-x:hover,.rel-x:focus-visible{background:var(--dgb);border-color:var(--dg)}
.tv-bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}

/* Motiv se stanoví dřív, než se cokoliv vykreslí — jinak by problikl výchozí vzhled.

(function(){try{
var v=localStorage.getItem('dkm-theme');
if(!v)v=(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
document.documentElement.setAttribute('data-theme',v);
}catch(e){document.documentElement.setAttribute('data-theme','light')}})();

const THEME_LBL={light:'themeLight',dark:'themeDark',paper:'themePaper',matrix:'themeMatrix'};
const ATYPES=['text','textarea','date','url','select','yesno','relation','number','tags'];
const RSCOPES=['universal','from','to','specific'];

const SORT_LBL={updated:'sortUpdated',newest:'sortNewest',oldest:'sortOldest',title:'sortTitle',titleDesc:'sortTitleDesc'};

function emptyData(){return{version:1,projectName:'',projectDescription:'',ghPath:'',settings:{tabs:zakladniZalozky()},entityTypes:[],aspects:[],relationTypes:[],selectLists:[],tagSets:[],savedViews:[],jsonExports:[],entities:[]}}

language:localStorage.getItem(SK_LANG)||'cs',
theme:currentTheme(),

};

/* UTILS */
function uid(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function t(k,v){let s=(I18N[state.language]&&I18N[state.language][k])||I18N.en[k]||k;if(v)Object.keys(v).forEach(x=>{s=s.replace('{'+x+'}',v[x])});return s}
function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function announce(m){const lr=document.getElementById('lr');if(lr){lr.textContent='';setTimeout(()=>lr.textContent=m,50)}}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(e._tm);e._tm=setTimeout(()=>{e.hidden=true},2500);announce(m)}
function dbg(m,err){if(!state.showDebug)return;const p=document.getElementById('dbg'),c=document.getElementById('dbg-c');p.hidden=false;const l=document.createElement('div');l.className='dl'+(err?' err':'');l.textContent='['+new Date().toLocaleTimeString()+'] '+(typeof m==='string'?m:JSON.stringify(m));c.appendChild(l);c.scrollTop=c.scrollHeight}
function setDirty(v){state.dirty=v;const i=document.getElementById('ind');i.hidden=!v;i.textContent='● '+t('unsaved');i.title=t('diffOpenHint');if(state.autosave)saveLS();if(v)broadcastDataChange()}
function fmtDate(iso,wt){if(!iso)return'';try{const d=new Date(iso);if(isNaN(d.getTime()))return iso;return wt?d.toLocaleString(state.language,{dateStyle:'medium',timeStyle:'short'}):d.toLocaleDateString(state.language,{dateStyle:'medium'})}catch(e){return iso}}

/* DATA HELPERS */
function findEntity(id){return state.data.entities.find(e=>e.id===id)}
function findEntityByName(name){if(!name)return null;const n=String(name).trim().toLowerCase();if(!n)return null;return state.data.entities.find(e=>!e.archived&&(getTitle(e)||'').toLowerCase()===n)}
function findType(id){return state.data.entityTypes.find(e=>e.id===id)}
function findAspect(id){return state.data.aspects.find(a=>a.id===id)}
function findRT(id){return state.data.relationTypes.find(r=>r.id===id)}
function findList(id){return state.data.selectLists.find(l=>l.id===id)}
/* Přípustné hodnoty výběrového atributu. Kanonický tvar je `a.listId` + `seznam.values`;
   starší data z importu balíčku nesou `a.selectListId` + `seznam.options` (a případně
   hodnoty rovnou na atributu v `a.options`), proto se čte tolerantně. Nová data si
   `mergeEmpty` převede na kanonický tvar, tahle tolerance je jen záchytná síť. */
/* Přenese odkaz na číselník z balíčku na nově vytvořený atribut — v kanonickém tvaru. */
function applyPkgAttrList(na,sa,slIdMap,tsIdMap){
if(sa.type==='tags'){
/* Soustava tagů se při importu přemapuje stejně jako číselník. */
if(sa.tagSetId&&tsIdMap&&tsIdMap[sa.tagSetId])na.tagSetId=tsIdMap[sa.tagSetId];
return;
}
if(sa.type!=='select')return;
const src=sa.listId||sa.selectListId;
if(src&&slIdMap[src])na.listId=slIdMap[src];
if(Array.isArray(sa.options)&&sa.options.length)na.options=sa.options.slice();
}
/* ============================================================
   TAGY
   Soustava tagů je pojmenovaná zásoba značek (`state.data.tagSets`),
   atribut typu `tags` se na jednu naváže přes `tagSetId` a entita si
   z ní zaškrtá, kolik chce — hodnota je vždycky pole řetězců.

   Tag je značka NAPŘÍČ ATRIBUTY: táž hodnota z téže soustavy v atributu
   „Stav schvalování" a v atributu „Projednat" je jeden a týž tag, takže
   proklik i filtr najdou obojí. Totožnost tagu je tedy dvojice
   (soustava, text), ne (atribut, text).
   ============================================================ */

/* Řazení jmen: podle abecedy, bez ohledu na velikost písmen, s citem pro čísla
   („Úkol 2" před „Úkol 10"). Používá se všude, kde se ukazuje víc entit nebo
   tagů pod sebou — ať je pořadí předvídatelné a nezáleží na pořadí zápisu. */
function porovnejNazvy(a,b){
return String(a==null?'':a).localeCompare(String(b==null?'':b),state.language,{sensitivity:'base',numeric:true});
}
function serazPodleNazvu(pole,klic){
return pole.slice().sort((a,b)=>porovnejNazvy(klic(a),klic(b)));
}
function findTagSet(id){return (state.data.tagSets||[]).find(x=>x.id===id)}

/* Tagy soustavy navázané na atribut. */
function attrTagValues(a){
const ts=a&&findTagSet(a.tagSetId);
return ts?(ts.tags||[]).slice():[];
}

/* Hodnota tagového atributu se čte vždycky jako pole — i kdyby v datech
   z cizí ruky přišel jeden řetězec. */
function tagValueArr(v){
if(v==null||v==='')return[];
return(Array.isArray(v)?v:[v]).map(x=>String(x)).filter(x=>x!=='');
}

/* Tagové atributy entity i s hodnotami. */
function entityTagAttrs(e){
if(!e)return[];
const out=getAllAttrDefsForEntity(e).filter(d=>d.type==='tags'&&d.tagSetId)
 .map(d=>({def:d,tagy:tagValueArr(e.attributes&&e.attributes[d.id])}));
/* Vlastní atributy entity nesou soustavu tagů v sobě, ne v modelu. */
(e.customAttributes||[]).forEach(ca=>{
if(ca.type!=='tags'||!ca.tagSetId)return;
out.push({def:{id:ca.id,name:ca.name||t('attributeName'),type:'tags',tagSetId:ca.tagSetId,scopeLabel:t('customAttributes')},tagy:tagValueArr(ca.value)});
});
return out;
}

/* Nese entita tenhle tag — v kterémkoli svém tagovém atributu? */
function entityHasTag(e,tagSetId,tag){
return entityTagAttrs(e).some(x=>x.def.tagSetId===tagSetId&&x.tagy.indexOf(tag)>=0);
}

/* Všechny tagy, které jsou v projektu opravdu použité, i s počtem entit.
   Do nabídky filtru patří jen ty — soustava může mít zásobu, kterou zatím
   nikdo nepoužil, a ta by nabídku jen zaplevelila. */
function collectUsedTags(){
const mapa=new Map();
state.data.entities.forEach(e=>{
if(e.archived)return;
const videne=new Set();
entityTagAttrs(e).forEach(x=>x.tagy.forEach(tg=>{
const k=x.def.tagSetId+'\u0000'+tg;
if(videne.has(k))return;   /* táž entita se přes dva atributy nepočítá dvakrát */
videne.add(k);
if(!mapa.has(k)){const ts=findTagSet(x.def.tagSetId);mapa.set(k,{tagSetId:x.def.tagSetId,setName:ts?ts.name:'?',tag:tg,pocet:0})}
mapa.get(k).pocet++;
}));
});
return Array.from(mapa.values()).sort((a,b)=>
 porovnejNazvy(a.setName,b.setName)||porovnejNazvy(a.tag,b.tag));
}

function getTitle(e){

/* Odchozí protějšek `getRelsTo`. Zpětné odkazy počítají tři zdroje — klasickou
   vazbu, vazební atribut a wiki odkaz —, ale odchozí strana uměla jen ten první.
   Strukturální pohled se kvůli tomu dal projít jen jedním směrem: do entity přes
   atribut ano, z entity ven ne. Tohle to srovnává. */
function getLinksFrom(e){
const out=[];
if(!e)return out;
(e.relations||[]).forEach(r=>{
const tgt=findEntity(r.targetId);
if(tgt&&!tgt.archived)out.push({kind:'relation',relationTypeId:r.relationTypeId,targetId:r.targetId,attrId:null,attrName:null});
});
const pridej=(id,zaznam)=>{const tgt=findEntity(id);if(tgt&&!tgt.archived&&id!==e.id)out.push(Object.assign({targetId:id},zaznam))};
const defs=getAllAttrDefsForEntity(e);
defs.forEach(def=>{
const v=e.attributes&&e.attributes[def.id];
if(def.type==='relation'){
if(v==null||v==='')return;
(Array.isArray(v)?v:[v]).forEach(id=>pridej(id,{kind:'attribute',relationTypeId:null,attrId:def.id,attrName:def.name,scopeLabel:def.scopeLabel}));
}else if(def.type==='textarea'||def.type==='text'){
if(typeof v!=='string'||!v)return;
wikiLinkTargets(v).forEach(id=>pridej(id,{kind:'wikilink',relationTypeId:null,attrId:def.id,attrName:def.name,scopeLabel:def.scopeLabel}));
}
});
(e.customAttributes||[]).forEach(ca=>{
if(ca.type==='relation'){
if(ca.value==null||ca.value==='')return;
(Array.isArray(ca.value)?ca.value:[ca.value]).forEach(id=>pridej(id,{kind:'attribute',relationTypeId:null,attrId:ca.id,attrName:ca.name||'?',scopeLabel:'* '+t('customAttrs')}));
}else if((ca.type==='textarea'||ca.type==='text')&&typeof ca.value==='string'&&ca.value){
wikiLinkTargets(ca.value).forEach(id=>pridej(id,{kind:'wikilink',relationTypeId:null,attrId:ca.id,attrName:ca.name||'?',scopeLabel:'* '+t('customAttrs')}));
}
});
/* Táž dvojice (cíl, zdroj odkazu) se nemá objevit dvakrát. */
const videne=new Set();
return out.filter(x=>{const k=x.kind+'|'+x.targetId+'|'+(x.attrId||'')+'|'+(x.relationTypeId||'');if(videne.has(k))return false;videne.add(k);return true});
}

/* Entity, na které míří wiki odkazy `[[Název]]` v textu. Protějšek `scanForWikiLink`,
   který se ptá opačně — jestli text odkazuje na jednu konkrétní entitu. */
function wikiLinkTargets(text){
const out=[];const re=/\[\[([^\]\n]+)\]\]/g;let m;
while((m=re.exec(text))!==null){
const ent=findEntityByName(m[1].trim());
if(ent)out.push(ent.id);
}
return out;
}

function getRelsTo(eid){
const out=[];
const target=findEntity(eid);
const targetName=target?(getTitle(target)||'').toLowerCase():null;
state.data.entities.forEach(e=>{
if(e.archived)return;
if(e.id===eid)return;
/* Classic relations */
if(e.relations)e.relations.forEach(r=>{if(r.targetId===eid)out.push({kind:'relation',relationTypeId:r.relationTypeId,sourceId:e.id,attrId:null,attrName:null})});
/* Attribute-of-type-relation references */
if(e.attributes){
const defs=getAllAttrDefsForEntity(e);
defs.forEach(def=>{
if(def.type!=='relation')return;
const v=e.attributes[def.id];
if(v==null||v==='')return;
const ids=Array.isArray(v)?v:[v];
if(ids.indexOf(eid)>=0)out.push({kind:'attribute',relationTypeId:null,sourceId:e.id,attrId:def.id,attrName:def.name,scopeLabel:def.scopeLabel});
});
/* Wiki-link backlinks: scan textarea and text values for [[Target name]] */
if(targetName){
defs.forEach(def=>{
if(def.type!=='textarea'&&def.type!=='text')return;
const v=e.attributes[def.id];if(typeof v!=='string'||!v)return;
if(scanForWikiLink(v,targetName))out.push({kind:'wikilink',sourceId:e.id,attrId:def.id,attrName:def.name,scopeLabel:def.scopeLabel});
});
(e.customAttributes||[]).forEach(ca=>{
if(ca.type!=='textarea'&&ca.type!=='text')return;
if(typeof ca.value!=='string'||!ca.value)return;
if(scanForWikiLink(ca.value,targetName))out.push({kind:'wikilink',sourceId:e.id,attrId:null,attrName:ca.name||'?',scopeLabel:'* '+t('customAttributes')});
});
}
}
});
return out;
}
function scanForWikiLink(text,targetNameLower){
const re=/\[\[([^\]\n]+)\]\]/g;let m;
while((m=re.exec(text))!==null){if(m[1].trim().toLowerCase()===targetNameLower)return true}
return false;
}
function getAllAttrDefsForEntity(e){
const out=[];const seen=new Set();
if(e.typeId){const ty=findType(e.typeId);if(ty)(ty.attributes||[]).forEach(a=>{if(seen.has(a.id))return;seen.add(a.id);out.push({id:a.id,name:a.name,type:a.type,listId:a.listId||a.selectListId||null,tagSetId:a.tagSetId||null,scopeLabel:ty.name})})}
(e.aspects||[]).forEach(aid=>{const asp=findAspect(aid);if(!asp)return;(asp.attributes||[]).forEach(a=>{if(seen.has(a.id))return;seen.add(a.id);out.push({id:a.id,name:a.name,type:a.type,listId:a.listId||a.selectListId||null,tagSetId:a.tagSetId||null,scopeLabel:'◎ '+asp.name})})});
return out;
}
function isRelApplicable(rt,fromId,toId){
if(rt.scope==='universal')return true;
if(rt.scope==='from')return!rt.fromTypes||!rt.fromTypes.length||rt.fromTypes.includes(fromId);
if(rt.scope==='to')return!rt.toTypes||!rt.toTypes.length||rt.toTypes.includes(toId);
if(rt.scope==='specific'){const a=!rt.fromTypes||!rt.fromTypes.length||rt.fromTypes.includes(fromId);const b=!rt.toTypes||!rt.toTypes.length||rt.toTypes.includes(toId);return a&&b}
return true;
}
/* ============================================================
   PŘETAHOVÁNÍ MYŠÍ (drag and drop)
   Doplněk k tlačítkům ↑↓, nikdy jejich náhrada: přetahování na
   dotykových zařízeních ani z klávesnice nefunguje, takže tlačítka
   musí u každého přetahovatelného seznamu zůstat.
   Jedna implementace pro záložky i pro seznamy v Nastavení.
   ============================================================ */

/* Co se právě táhne. Skupina brání tomu, aby záložka typu skončila mezi aspekty —
   pořadí se drží ve dvou různých polích a mezi nimi se položka přesunout nedá. */
let _dnd=null;

/* Přesune položku pole před nebo za cílovou pozici.
   Vrací novou pozici, nebo -1, když se nic nezměnilo. */
function presunPolozku(pole,od,cil,pred){
if(od===cil)return -1;
const prvek=pole[od];
pole.splice(od,1);
let ci=cil>od?cil-1:cil;      /* odebráním se indexy nad `od` posunuly */
if(!pred)ci+=1;
if(ci<0)ci=0;
if(ci>pole.length)ci=pole.length;
if(ci===od){pole.splice(od,0,prvek);return -1}
pole.splice(ci,0,prvek);
return ci;
}

function dndUklid(){
document.querySelectorAll('.dnd-before,.dnd-after').forEach(x=>x.classList.remove('dnd-before','dnd-after'));
}

/* opts: {skupina, index, pole, vodorovne, hotovo} */
function povolPretahovani(el,opts){
el.draggable=true;
el.classList.add(opts.vodorovne?'dnd-h':'dnd-v');
const pred=ev=>opts.vodorovne
  ? (ev.clientX < el.getBoundingClientRect().left+el.offsetWidth/2)
  : (ev.clientY < el.getBoundingClientRect().top+el.offsetHeight/2);
el.addEventListener('dragstart',ev=>{
_dnd={skupina:opts.skupina,od:opts.index};
ev.dataTransfer.effectAllowed='move';
/* Bez zapsaných dat některé prohlížeče přetažení vůbec nezahájí. */
try{ev.dataTransfer.setData('text/plain',String(opts.index))}catch(e){}
el.classList.add('dnd-drag');
});
el.addEventListener('dragend',()=>{el.classList.remove('dnd-drag');_dnd=null;dndUklid()});
el.addEventListener('dragover',ev=>{
if(!_dnd||_dnd.skupina!==opts.skupina)return;
ev.preventDefault();ev.dataTransfer.dropEffect='move';
el.classList.remove('dnd-before','dnd-after');
el.classList.add(pred(ev)?'dnd-before':'dnd-after');
});
el.addEventListener('dragleave',()=>el.classList.remove('dnd-before','dnd-after'));
el.addEventListener('drop',ev=>{
if(!_dnd||_dnd.skupina!==opts.skupina)return;
ev.preventDefault();ev.stopPropagation();
const nova=presunPolozku(opts.pole,_dnd.od,opts.index,pred(ev));
_dnd=null;dndUklid();
if(nova<0)return;
setDirty(true);
announce(t('dndMoved',{n:nova+1,z:opts.pole.length}));
opts.hotovo();
});
}

function moveItem(arr,idx,dir){const ni=idx+dir;if(ni<0||ni>=arr.length)return;const x=arr[idx];arr[idx]=arr[ni];arr[ni]=x;setDirty(true);render()}

/* Jméno uživatele pro autorství komentářů.
   Stejně jako GitHub token se drží jen v prohlížeči (per zařízení a per uživatel),
   ne v datech projektu — nad jedním projektem tak může pracovat víc lidí. */

/* Sjednocení číselníků na kanonický tvar (`seznam.values`, `atribut.listId`).
   Starší data z importu balíčku nesla `options` / `selectListId`, což editor ani
   formulář entity nečetly — kanban, filtry a export balíčku kvůli tomu vycházely prázdné. */
function migrateSelectLists(d){

function mergeEmpty(d){const b=emptyData();const st=Object.assign({},b.settings,d.settings||{});
st.tabs=migrujZalozky(st,d);
/* Migrace ze starších dat: jméno uložené v projektu převezmi do prohlížeče (jen když tam ještě žádné není) a z dat ho odstraň. */

return{version:d.version||1,projectName:typeof d.projectName==='string'?d.projectName:'',projectDescription:typeof d.projectDescription==='string'?d.projectDescription:'',ghPath:typeof d.ghPath==='string'?d.ghPath:'',settings:st,entityTypes:Array.isArray(d.entityTypes)?d.entityTypes:[],aspects:Array.isArray(d.aspects)?d.aspects:[],relationTypes:Array.isArray(d.relationTypes)?d.relationTypes:[],selectLists:Array.isArray(d.selectLists)?d.selectLists:[],tagSets:Array.isArray(d.tagSets)?d.tagSets:[],savedViews:Array.isArray(d.savedViews)?d.savedViews:[],jsonExports:Array.isArray(d.jsonExports)?d.jsonExports:[],entities:Array.isArray(d.entities)?d.entities:[]}}
function saveFile(){const data=JSON.stringify(state.data,null,2);const b=new Blob([data],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=(state.data.projectName?state.data.projectName.replace(/[^\w\u00C0-\u017F-]+/g,'_'):'dkm')+'-'+new Date().toISOString().slice(0,10)+'.dkmdata';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);setDirty(false);snapshotBaseline();toast(t('saved'))}
function snapshotBaseline(){try{state.baseline=JSON.parse(JSON.stringify(state.data))}catch(e){dbg('Baseline snapshot failed: '+e.message,true)}}
function hasBaseline(){return !!(state.baseline&&Array.isArray(state.baseline.entities))}

/* Compute diff between baseline and current state */
function computeDiff(){
if(!hasBaseline())return null;
const base=state.baseline;const cur=state.data;
const baseMap=new Map();base.entities.forEach(e=>baseMap.set(e.id,e));
const curMap=new Map();cur.entities.forEach(e=>curMap.set(e.id,e));
const added=[];const deleted=[];const modified=[];
curMap.forEach((e,id)=>{
if(!baseMap.has(id)){added.push(e);return}
const before=baseMap.get(id);
if(JSON.stringify(normalizeEntity(e))!==JSON.stringify(normalizeEntity(before))){
modified.push({before:before,after:e,changes:diffEntityFields(before,e)});
}
});
baseMap.forEach((e,id)=>{if(!curMap.has(id))deleted.push(e)});
return{added:added,deleted:deleted,modified:modified};
}
function normalizeEntity(e){
/* Sort object keys and skip updatedAt for stable comparison */
const c=JSON.parse(JSON.stringify(e));
delete c.updatedAt;/* Skip timestamp — not a real change */
return c;
}
function diffEntityFields(before,after){
const changes=[];
if((before.name||'')!==(after.name||''))changes.push({field:'name',before:before.name,after:after.name});
if(!!before.inInbox!==!!after.inInbox)changes.push({field:'inInbox',before:!!before.inInbox,after:!!after.inInbox});
if(!!before.archived!==!!after.archived)changes.push({field:'archived',before:!!before.archived,after:!!after.archived});
if((before.typeId||'')!==(after.typeId||''))changes.push({field:'typeId',before:before.typeId,after:after.typeId});
const ba=JSON.stringify((before.aspects||[]).slice().sort());const aa=JSON.stringify((after.aspects||[]).slice().sort());
if(ba!==aa)changes.push({field:'aspects',before:before.aspects||[],after:after.aspects||[]});
/* Attributes: per-key diff */
const bAttr=before.attributes||{};const aAttr=after.attributes||{};
const allKeys=new Set([...Object.keys(bAttr),...Object.keys(aAttr)]);
allKeys.forEach(k=>{const bv=bAttr[k];const av=aAttr[k];if(JSON.stringify(bv)!==JSON.stringify(av))changes.push({field:'attr:'+k,before:bv,after:av})});
/* Custom attributes: normalized array compare */
const bCust=JSON.stringify(before.customAttributes||[]);const aCust=JSON.stringify(after.customAttributes||[]);
if(bCust!==aCust)changes.push({field:'customAttributes',before:before.customAttributes||[],after:after.customAttributes||[]});
/* Relations */
const bRel=JSON.stringify((before.relations||[]).map(r=>({t:r.relationTypeId,i:r.targetId})).sort((a,b)=>(a.t+a.i).localeCompare(b.t+b.i)));
const aRel=JSON.stringify((after.relations||[]).map(r=>({t:r.relationTypeId,i:r.targetId})).sort((a,b)=>(a.t+a.i).localeCompare(b.t+b.i)));
if(bRel!==aRel)changes.push({field:'relations',before:before.relations||[],after:after.relations||[]});
return changes;
}

function openDiffDialog(){
if(!hasBaseline()){toast(t('diffNoBaseline'));return}
const diff=computeDiff();if(!diff){toast(t('diffNoBaseline'));return}
if(!diff.added.length&&!diff.deleted.length&&!diff.modified.length){toast(t('diffNoChanges'));return}
const body=document.createElement('div');body.className='diff-body';
const sum=document.createElement('p');sum.innerHTML='<strong>'+t('diffSummary')+':</strong> +'+diff.added.length+' &nbsp; ~'+diff.modified.length+' &nbsp; −'+diff.deleted.length;body.appendChild(sum);
if(diff.added.length){const sec=diffSection(t('diffAdded'),'added',diff.added.length);diff.added.forEach(e=>sec.appendChild(diffEntityRow(e,'added')));body.appendChild(sec)}
if(diff.modified.length){const sec=diffSection(t('diffModified'),'modified',diff.modified.length);diff.modified.forEach(m=>sec.appendChild(diffModifiedRow(m)));body.appendChild(sec)}
if(diff.deleted.length){const sec=diffSection(t('diffDeleted'),'deleted',diff.deleted.length);diff.deleted.forEach(e=>sec.appendChild(diffEntityRow(e,'deleted')));body.appendChild(sec)}
idDialogu('dlgdiff');
showDialog(t('diffTitle'),body,[{label:t('close'),primary:true,action:closeDialog}]);
}
function diffSection(label,cls,count){const sec=document.createElement('section');sec.className='diff-sec diff-'+cls;const h=document.createElement('h3');h.textContent=label+' ('+count+')';sec.appendChild(h);return sec}
function diffEntityRow(e,cls){

if(cls!=='deleted'){
const a=document.createElement('a');a.href='#entity/'+e.id;a.className='diff-lnk';a.addEventListener('click',()=>closeDialog());
appendEntityLabel(a,e);row.appendChild(a);
}else{

}
if(ty){const meta=document.createElement('span');meta.className='diff-meta';meta.textContent=' ('+ty.name+')';row.appendChild(meta)}

}
function diffModifiedRow(m){

m.changes.forEach(ch=>{const li=document.createElement('li');li.textContent=diffFieldLabel(ch.field,m.after)+': '+diffValStr(ch.before)+' → '+diffValStr(ch.after);ul.appendChild(li)});
wrap.appendChild(ul)}
return wrap;
}
function diffFieldLabel(field,entity){
if(field==='name')return t('sysName');
if(field==='typeId')return t('sysType');
if(field==='inInbox')return t('tabInbox');
if(field==='archived')return t('tabArchive');

if(field==='customAttributes')return t('customAttributes');

return field;
}
function diffValStr(v){if(v==null||v==='')return '∅';if(Array.isArray(v))return '['+v.length+']';if(typeof v==='object')return '{…}';const s=String(v);return s.length>60?s.slice(0,57)+'…':s}

/* GITHUB */
function ghEncode(s){return btoa(unescape(encodeURIComponent(s)))}
function ghDecode(s){return decodeURIComponent(escape(atob(s)))}
function ghB64ToText(b64){return decodeURIComponent(escape(atob(b64.replace(/\n/g,''))))}
function ghTextToB64(text){return btoa(unescape(encodeURIComponent(text)))}
function parseGhPath(p){if(!p)return null;const parts=String(p).trim().split('/').filter(Boolean);if(parts.length<3)return null;return{owner:parts[0],repo:parts[1],path:parts.slice(2).join('/')}}
/* Motiv je nastavení prohlížeče, ne dat projektu — stejně jako jazyk a GitHub token.
   Stanoví se už ve skriptu v <head>, tohle je jen čtení a přepínání za běhu. */
function currentTheme(){
const v=document.documentElement.getAttribute('data-theme');
return THEMES.indexOf(v)>=0?v:'light';
}
function setTheme(v){
if(THEMES.indexOf(v)<0)v='light';
state.theme=v;
document.documentElement.setAttribute('data-theme',v);
try{localStorage.setItem(SK_THEME,v)}catch(e){dbg('Theme save failed: '+e.message,true)}
}
/* =============================================================
   ZVUKOVÁ ODEZVA
   Tóny se syntetizují přes Web Audio API — nic se nestahuje,
   nástroj zůstane použitelný offline i bez zvukových souborů.
   ============================================================= */
let audioCtx=null;
function soundEnabled(){return localStorage.getItem(SK_SOUND)!=='false'}
function setSoundEnabled(v){try{localStorage.setItem(SK_SOUND,v?'true':'false')}catch(e){dbg('Sound pref save failed: '+e.message,true)}}
function ensureAudio(){
if(audioCtx)return audioCtx;
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return null;
try{audioCtx=new AC()}catch(e){dbg('Audio init failed: '+e.message,true);return null}
return audioCtx;
}
/* Prohlížeč zvuk povolí až po interakci uživatele. Uložení na GitHub je asynchronní,
   takže v okamžiku přehrání už gesto „nedrží“ — kontext proto probouzíme při prvním
   kliknutí nebo stisku klávesy, dávno předtím. */
function primeAudio(){
const ctx=ensureAudio();
if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});
}
/* Tón = [frekvence v Hz, začátek v s, délka v s, hlasitost, průběh]. */
function playTones(tones){
if(!soundEnabled())return;
const ctx=ensureAudio();
if(!ctx)return;
if(ctx.state==='suspended')ctx.resume().catch(()=>{});
try{
const t0=ctx.currentTime;
tones.forEach(([freq,start,dur,gain,type])=>{
const osc=ctx.createOscillator(),g=ctx.createGain();
osc.type=type||'sine';osc.frequency.value=freq;
const s=t0+start,e=s+dur;
/* Náběh a doznění přes exponenciálu — skokové hlasitosti lupou. */
g.gain.setValueAtTime(0.0001,s);
g.gain.exponentialRampToValueAtTime(gain,s+0.012);
g.gain.exponentialRampToValueAtTime(0.0001,e);
osc.connect(g);g.connect(ctx.destination);
osc.start(s);osc.stop(e+0.02);
});
}catch(e){dbg('Sound playback failed: '+e.message,true)}
}
/* Uloženo: stoupavá kvinta A5 → E6, krátká a nevtíravá. */
function soundSaved(){playTones([[880,0,0.12,0.16],[1318.5,0.10,0.20,0.14]])}
/* Selhalo: klesavá malá tercie Es4 → B3 v trojúhelníku, temnější a delší. */
function soundFailed(){playTones([[311.1,0,0.18,0.17,'triangle'],[233.1,0.16,0.34,0.17,'triangle']])}

function ghToken(){return localStorage.getItem(SK_GHTOKEN)||''}
function ghSetToken(v){if(v)localStorage.setItem(SK_GHTOKEN,v);else localStorage.removeItem(SK_GHTOKEN)}
function ghHeaders(){const h={'Accept':'application/vnd.github.v3+json'};const tk=ghToken();if(tk)h['Authorization']='token '+tk;return h}
function ghErrFromStatus(status){if(status===404)return t('ghErr404');if(status===401)return t('ghErr401');if(status===403)return t('ghErr403');return t('ghErrGeneric')+'HTTP '+status}
function ghShareUrl(ghPath){return location.origin+location.pathname+'?id='+ghEncode(ghPath)}

function loadFromGitHub(ghPath,opts){
opts=opts||{};
const parsed=parseGhPath(ghPath);
if(!parsed){toast(t('ghErrInvalidPath'));return Promise.reject(new Error('invalid path'))}
const apiUrl='https://api.github.com/repos/'+parsed.owner+'/'+parsed.repo+'/contents/'+parsed.path;
toast(t('ghLoading'));dbg('GitHub GET '+apiUrl+(ghToken()?' (with token)':' (no token)'));
return fetch(apiUrl,{headers:ghHeaders()}).then(res=>{
if(!res.ok)throw new Error(ghErrFromStatus(res.status));
return res.json();
}).then(meta=>{
dbg('GH meta: size='+meta.size+' sha='+(meta.sha||'').slice(0,8));
if(meta.content&&meta.encoding==='base64'){return{text:ghB64ToText(meta.content),sha:meta.sha}}
const blobUrl='https://api.github.com/repos/'+parsed.owner+'/'+parsed.repo+'/git/blobs/'+meta.sha;
dbg('Large file, fetching blob: '+blobUrl);
return fetch(blobUrl,{headers:ghHeaders()}).then(res=>{
if(!res.ok)throw new Error(ghErrFromStatus(res.status));
return res.json();
}).then(blob=>{return{text:ghB64ToText(blob.content),sha:meta.sha}});
}).then(({text,sha})=>{
const p=JSON.parse(text);
if(!p||typeof p!=='object'||!Array.isArray(p.entities))throw new Error(t('errLoadInvalid'));
const merged=mergeEmpty(p);merged.ghPath=ghPath;
state.data=merged;
state.ghSha=sha;
state.dirty=false;
state.navHistory=[];
saveLS();
state.view={name:'list',tab:'inbox',entityId:null,settingsTab:'project',settingsItemId:null,edit:null,typeId:null};
location.hash='';render();
toast('✓ '+t('ghLoaded'));
dbg('Loaded from GitHub OK ('+text.length+' B)');
}).catch(err=>{
const msg=err.message||String(err);toast(msg);dbg('GitHub load failed: '+msg,true);throw err;
});
}

function saveToGitHub(){
const ghPath=state.data.ghPath;
if(!ghPath){toast(t('ghErrNoPath'));soundFailed();return Promise.reject(new Error('no path'))}
if(!ghToken()){toast(t('ghErrNoToken'));soundFailed();return Promise.reject(new Error('no token'))}
const parsed=parseGhPath(ghPath);
if(!parsed){toast(t('ghErrInvalidPath'));soundFailed();return Promise.reject(new Error('invalid path'))}
const apiUrl='https://api.github.com/repos/'+parsed.owner+'/'+parsed.repo+'/contents/'+parsed.path;
toast(t('ghSaving'));dbg('GitHub PUT '+apiUrl);
const json=JSON.stringify(state.data,null,2);
const content=ghTextToB64(json);
const doPut=sha=>{
const body={message:t('ghCommitMsg')+(state.data.projectName?' – '+state.data.projectName:''),content:content};
if(sha)body.sha=sha;
return fetch(apiUrl,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)}).then(res=>{
if(!res.ok)return res.json().catch(()=>({})).then(j=>{throw new Error(ghErrFromStatus(res.status)+(j.message?' – '+j.message:''))});
return res.json();
});
};
return fetch(apiUrl,{headers:ghHeaders()}).then(res=>{
if(res.status===404)return null;
if(!res.ok)throw new Error(ghErrFromStatus(res.status));
return res.json();
}).then(meta=>doPut(meta?meta.sha:null)).then(result=>{
state.ghSha=result.content&&result.content.sha;
state.dirty=false;saveLS();snapshotBaseline();
const ind=document.getElementById('ind');if(ind)ind.hidden=true;
toast('✓ '+t('ghSaved'));dbg('GitHub save OK');soundSaved();
return result;
}).catch(err=>{
const msg=err.message||String(err);toast(msg);dbg('GitHub save failed: '+msg,true);soundFailed();throw err;
});
}

/* =============================================================
   NAČTENÍ PROJEKTU Z LIBOVOLNÉ URL  (?open=…)
   Vedle ?id=… (soubor v GitHub repozitáři přes API) umí DKM otevřít
   projekt z jakékoliv adresy — statické hostingy, intranet, GitHub Pages,
   raw.githubusercontent.com. Stahuje se prostým fetch, takže cílový server
   musí povolit čtení z jiné domény (CORS).
   ============================================================= */

/* Adresa se řeší proti aktuální stránce, takže funguje i relativní zápis
   (?open=data/model.dkmdata). Povolené je jen http(s) — nikdy javascript: ani data:. */
function resolveOpenUrl(raw){
let u;
try{u=new URL(String(raw||'').trim(),location.href)}catch(e){return null}
if(u.protocol!=='https:'&&u.protocol!=='http:')return null;
/* Na https stránce by prohlížeč http požadavek stejně zablokoval jako mixed content. */
if(u.protocol==='http:'&&location.protocol==='https:')return null;
return u;
}
function openShareUrl(rawUrl){return location.origin+location.pathname+'?open='+encodeURIComponent(rawUrl)}

function loadFromUrl(rawUrl){
const u=resolveOpenUrl(rawUrl);
if(!u){toast(t('urlErrProtocol'));dbg('Open URL rejected: '+rawUrl,true);return Promise.reject(new Error('bad url'))}
toast(t('urlLoading'));dbg('Open URL GET '+u.href);
return fetch(u.href,{credentials:'omit'}).then(res=>{
if(!res.ok)throw new Error(t('urlErrStatus',{status:res.status}));
return res.text();
},()=>{
/* fetch odmítne jak síťovou chybu, tak zablokované CORS — prohlížeč mezi nimi nerozliší. */
throw new Error(t('urlErrFetch'));
}).then(text=>{
let p;
try{p=JSON.parse(text)}catch(e){throw new Error(t('errLoadInvalid'))}
if(!p||typeof p!=='object'||!Array.isArray(p.entities))throw new Error(t('errLoadInvalid'));
state.data=mergeEmpty(p);
state.ghSha=null;
state.dirty=false;
state.navHistory=[];
saveLS();
state.view={name:'list',tab:'inbox',entityId:null,settingsTab:'project',settingsItemId:null,edit:null,typeId:null};
location.hash='';render();
toast('✓ '+t('urlLoaded',{host:u.host||u.protocol}));
dbg('Loaded from URL OK ('+text.length+' B)');
}).catch(err=>{
const msg=err.message||String(err);toast(msg);dbg('Open URL load failed: '+msg,true);throw err;
});
}

function ghAutoLoadFromUrl(){
try{
const params=new URLSearchParams(location.search);
const idParam=params.get('id');
if(!idParam)return false;
const ghPath=ghDecode(idParam);
dbg('Auto-load from URL: '+ghPath);
if(state.dirty&&!confirm(t('confirmDiscardDirty')))return false;
loadFromGitHub(ghPath).catch(()=>{});
return true;
}catch(e){dbg('URL id decode failed: '+e.message,true);return false}
}

/* Otevře projekt podle parametrů v adrese: ?id=… (GitHub) má přednost před ?open=… */
function autoLoadFromUrlParams(){
if(ghAutoLoadFromUrl())return true;
try{
const raw=new URLSearchParams(location.search).get('open');
if(!raw)return false;
dbg('Auto-load from URL: '+raw);
if(state.dirty&&!confirm(t('confirmDiscardDirty')))return false;
loadFromUrl(raw).catch(()=>{});
return true;
}catch(e){dbg('URL open param failed: '+e.message,true);return false}
}

   ve kterém model zúží `orezProjekt` — stejně jako u balíčku. */
function viewerData(entities){
if(!entities)return JSON.parse(JSON.stringify(state.data));
const o=orezProjekt(entities);
const d=JSON.parse(JSON.stringify(state.data));
d.entities=o.entities;
d.entityTypes=o.model.entityTypes;
d.aspects=o.model.aspects;
d.relationTypes=o.model.relationTypes;
d.selectLists=o.model.selectLists;
d.tagSets=o.model.tagSets;
/* Záložka na typ nebo aspekt, který ve výřezu není, by zůstala prázdná. */
const tIds=new Set(o.model.entityTypes.map(x=>x.id)),aIds=new Set(o.model.aspects.map(x=>x.id));
d.settings=Object.assign({},d.settings);
const eIds=new Set(o.entities.map(x=>x.id));
const tsIds=new Set((o.model.tagSets||[]).map(x=>x.id));
d.settings.tabs=(Array.isArray(d.settings.tabs)?d.settings.tabs:[]).map(z=>JSON.parse(JSON.stringify(z))).filter(z=>{
if(z.kind==='type'){z.typeIds=(z.typeIds||[]).filter(x=>tIds.has(x));return z.typeIds.length>0}
if(z.kind==='aspect')return aIds.has(z.aspectId);
if(z.kind==='entity')return eIds.has(z.entityId);
if(z.kind==='tag')return tsIds.has(z.tagSetId);
/* Prohlížeč neumí uložené pohledy, komentáře ani zakládání entit. */
if(z.kind==='view'||z.kind==='comments'||z.kind==='new')return false;
return true;
});
/* Prohlížeč uložené pohledy ani profily exportu nečte a ve výřezu by jen
   nesly jména filtrů nad daty, která v něm nejsou. */
d.savedViews=[];d.jsonExports=[];
d.__droppedRelations=o.droppedRelations;
return d;
}

function generateStaticViewer(entities){
let tpl;
try{tpl=decodeURIComponent(escape(atob(VIEWER_TPL_B64)))}catch(e){toast('?');dbg('Viewer decode failed: '+e.message,true);return}
const data=viewerData(entities);
const zahozeno=data.__droppedRelations||0;delete data.__droppedRelations;
data.viewerLang=state.language;
delete data.ghPath;
const wrapper={generatedAt:new Date().toISOString(),version:1,data:data};
let safeJson=JSON.stringify(wrapper);
safeJson=safeJson.replace(/<\/script/gi,'<\\/script');
const escHtml=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const title=escHtml((data.projectName||'DKM Viewer').slice(0,200));
const lang=state.language;
const html=tpl.replace(/__LANG__/g,lang).replace(/__TITLE__/g,title).replace('__JSON_DATA__',safeJson);
const blob=new Blob([html],{type:'text/html;charset=utf-8'});
const u=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=u;
const safeName=(data.projectName||'dkm').replace(/[^\w\u00C0-\u017F-]+/g,'_').slice(0,60);
a.download=safeName+'-viewer-'+new Date().toISOString().slice(0,10)+'.html';
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
toast('✓ '+t('viewerGenBtn'));
dbg('Static viewer generated, size='+html.length+' B, entit='+data.entities.length+(entities?', výřez, zahozených vazeb='+zahozeno:', celý projekt'));
}

/* SHEETJS LAZY LOADER */
let _sheetJsPromise=null;
function loadSheetJS(){
if(window.XLSX)return Promise.resolve(window.XLSX);
if(_sheetJsPromise)return _sheetJsPromise;
_sheetJsPromise=new Promise((res,rej)=>{
const sc=document.createElement('script');
sc.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
sc.onload=()=>{if(window.XLSX)res(window.XLSX);else rej(new Error('XLSX missing after load'))};
sc.onerror=()=>rej(new Error('SheetJS load failed (offline?)'));
document.head.appendChild(sc);
});
return _sheetJsPromise;
}

/* EXPORT XLSX */
/* ============================================================
   TABULKOVÝ EXPORT — XLSX, CSV, TSV
   Sloupce i hodnoty jsou společné pro všechny tři formáty;
   liší se jen zápis. Nikdy nepočítej sloupce zvlášť pro jeden z nich.
   ============================================================ */

const TABLE_FORMATS=[
{id:'xlsx',label:'tblFmtXlsx',ext:'xlsx'},
{id:'csv', label:'tblFmtCsv', ext:'csv'},
{id:'tsv', label:'tblFmtTsv', ext:'tsv'}
];

/* Sloupce odvozené z předaných entit. */
function tableColumns(list){
const cols=[];const seen=new Map();
const named=a=>!!(a&&a.name&&String(a.name).trim());
const add=(id,label,group,attr)=>{
if(seen.has(id))return seen.get(id);
const c={id:id,label:label,group:group,attr:attr||null,filled:0};
seen.set(id,c);cols.push(c);return c;
};
add('__id','ID','sys');
add('__name',t('entityName'),'sys');
add('__type',t('type'),'sys');
add('__aspects',t('detailAspects'),'sys');
add('__inbox',t('tabInbox'),'sys');
add('__archive',t('tabArchive'),'sys');
list.forEach(e=>{
if(e.typeId){const ty=findType(e.typeId);if(ty)(ty.attributes||[]).forEach(a=>{if(named(a))add('attr:'+a.id,ty.name+' / '+a.name,'type:'+ty.id,a)})}
(e.aspects||[]).forEach(aid=>{const asp=findAspect(aid);if(asp)(asp.attributes||[]).forEach(a=>{if(named(a))add('attr:'+a.id,asp.name+' / '+a.name,'aspect:'+asp.id,a)})});
/* Vlastní atributy se sdružují podle názvu — id je u nich per entita,
   takže by jinak každá entita přidala vlastní sloupec. */
(e.customAttributes||[]).forEach(a=>{const n=(a.name||'').trim();if(n)add('cattr:'+n,'* '+n,'custom',a)});
});
add('__relations',t('detailRelations'),'meta');
add('__backlinks',t('detailBacklinks'),'meta');
add('__comments',t('detailComments'),'meta');
add('__created',t('created'),'meta');
add('__updated',t('updated'),'meta');
list.forEach(e=>cols.forEach(c=>{const v=tableCellValue(e,c);if(v!==''&&v!=null)c.filled++}));
return cols;
}

function tableCellValue(e,c){
switch(c.id){
case'__id':return e.id;
case'__name':return getTitle(e);
case'__type':{const ty=findType(e.typeId);return ty?ty.name:''}
case'__inbox':return e.inInbox?t('yes'):'';
case'__archive':return e.archived?t('yes'):'';
case'__aspects':return(e.aspects||[]).map(aid=>{const a=findAspect(aid);return a?a.name:aid}).join('; ');
case'__relations':return(e.relations||[]).map(r=>{const rt=findRT(r.relationTypeId),tgt=findEntity(r.targetId);return(rt?rt.name:'?')+' → '+(tgt?getTitle(tgt):r.targetId)}).sort(porovnejNazvy).join('; ');
case'__backlinks':return collectBacklinks(e.id).map(b=>b.relTypeName+' ← '+getTitle(b.from)).sort(porovnejNazvy).join('; ');
case'__comments':return(e.comments||[]).map(k=>(k.author?k.author+': ':'')+(k.text||'')).join('\n');
case'__created':{if(!e.createdAt)return'';const d=new Date(e.createdAt);return isNaN(d)?e.createdAt:d}
case'__updated':{if(!e.updatedAt)return'';const d=new Date(e.updatedAt);return isNaN(d)?e.updatedAt:d}
}
if(c.id.indexOf('attr:')===0){
const aid=c.id.slice(5);
/* Atribut patří tomuto typu nebo jeho aspektu? Jinak sloupec zůstane prázdný. */
return xlsxAttrVal(c.attr,e.attributes&&e.attributes[aid]);
}
if(c.id.indexOf('cattr:')===0){
const nm=c.id.slice(6);
const ca=(e.customAttributes||[]).find(x=>(x.name||'').trim()===nm);
return ca?xlsxAttrVal(ca,ca.value):'';
}
return'';
}

/* Text do CSV/TSV. Datum a čas se liší, proto rozhoduje sloupec. */
function tableCellText(c,v,opt){
if(v==null)return'';
if(v instanceof Date){
if(c.id==='__created'||c.id==='__updated')return v.toISOString();
const p=n=>String(n).padStart(2,'0');
return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
}
if(typeof v==='number')return opt&&opt.decimalComma?String(v).replace('.',','):String(v);
return String(v);
}

function toDelimited(cols,rows,opt){
const sep=opt.sep;
const cell=(c,v)=>{
const s=tableCellText(c,v,opt);
return(s.indexOf(sep)>=0||/["\n\r]/.test(s))?'"'+s.replace(/"/g,'""')+'"':s;
};
const out=[cols.map(c=>cell({id:'__h'},c.label)).join(sep)];
rows.forEach(r=>out.push(r.map((v,i)=>cell(cols[i],v)).join(sep)));
/* BOM: bez něj Excel přečte diakritiku špatně. Import v DKM ho umí přeskočit. */
return(opt.bom?'﻿':'')+out.join('\r\n')+'\r\n';
}

function tableFilename(ext){
return safeFilename(state.data.projectName||'dkm')+'-'+new Date().toISOString().slice(0,10)+'.'+ext;
}

function runTableExport(cfg){
const list=cfg.entities;
const cols=cfg.columns;
if(!list.length){toast(t('emptyList'));return}
if(!cols.length){toast(t('tblNoCols'));return}
if(cfg.format==='xlsx'){exportTableXlsx(cfg);return}
const sep=cfg.format==='tsv'?'\t':cfg.sep;
const rows=list.map(e=>cols.map(c=>tableCellValue(e,c)));
const text=toDelimited(cols,rows,{sep:sep,bom:true,decimalComma:cfg.format!=='tsv'&&cfg.decimalComma});
const ext=cfg.format==='tsv'?'tsv':'csv';
const blob=new Blob([text],{type:(ext==='tsv'?'text/tab-separated-values':'text/csv')+';charset=utf-8'});
const u=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=u;a.download=tableFilename(ext);
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
toast(ext.toUpperCase()+' ✓ ('+list.length+')');
}

function exportTableXlsx(cfg){
toast(t('xlsxLoading'));
loadSheetJS().then(XLSX=>{
const wb=XLSX.utils.book_new();
const used=[];
const sheet=(name,list,cols)=>{
const rows=[cols.map(c=>c.label)].concat(list.map(e=>cols.map(c=>tableCellValue(e,c))));
const ws=XLSX.utils.aoa_to_sheet(rows);
ws['!cols']=cols.map((c,i)=>{
let m=String(c.label).length;
for(let r=1;r<rows.length;r++){const v=rows[r][i];if(v==null)continue;const s=String(v).split(/\r?\n/)[0];if(s.length>m)m=s.length}
return{wch:Math.min(Math.max(m+2,8),60)};
});
const range=XLSX.utils.decode_range(ws['!ref']);
for(let R=range.s.r;R<=range.e.r;R++)for(let C=range.s.c;C<=range.e.c;C++){
const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];if(!cell)continue;
const a=cols[C]&&cols[C].attr;
if(a&&a.type==='textarea'){cell.s=cell.s||{};cell.s.alignment={wrapText:true,vertical:'top'}}
if(R===0){cell.s=cell.s||{};cell.s.font={bold:true};cell.s.fill={fgColor:{rgb:'EEEEEE'}}}
}
ws['!freeze']={xSplit:0,ySplit:1};
if(ws['!ref'])ws['!autofilter']={ref:ws['!ref']};
/* Názvy listů musí být jedinečné a Excel je omezuje na 31 znaků. */
let nm=(name||'Export').replace(/[\\/?*[\]:]/g,' ').slice(0,28).trim()||'Export';

/* ============================================================
   ROZSAH EXPORTU — tři vrstvy nad sebou
   1. rozsah (výběr / zobrazené / vše, u balíčku i okolí),
   2. ručně vyřazené jednotlivé entity,
   3. vynechané aspekty.
   Výsledkem jsou KOPIE entit. Cíle exportu z nich čtou přímo, takže
   se vynechaný aspekt nikam nepropíše — ani do modelu v balíčku
   a v prohlížeči, protože ten se počítá z toho, co entity opravdu
   používají, ne ze `state.data`.
   ============================================================ */

/* Id atributů, které patří vyjmenovaným aspektům. */
function atributyAspektu(aspIds){
const out=new Set();
(state.data.aspects||[]).forEach(a=>{if(aspIds.has(a.id))(a.attributes||[]).forEach(x=>out.add(x.id))});
return out;
}

/* Kopie entit bez vynechaných aspektů a bez jejich hodnot.
   Když se nevynechává nic, vrací původní entity — žádné zbytečné kopírování
   a žádná změna chování proti stavu, kdy tahle volba neexistovala. */
function projekceEntit(entities,bezAspektu){
if(!bezAspektu||!bezAspektu.size)return entities.slice();
const attrIds=atributyAspektu(bezAspektu);
return entities.map(e=>{
const c=JSON.parse(JSON.stringify(e));
c.aspects=(c.aspects||[]).filter(id=>!bezAspektu.has(id));
if(c.attributes)attrIds.forEach(id=>{delete c.attributes[id]});
if(Array.isArray(c.customAttributes))c.customAttributes=c.customAttributes.filter(ca=>!attrIds.has(ca.id));
return c;
});
}

/* Výřez projektu: kopie entit s vazbami omezenými dovnitř výřezu a model
   zúžený na to, co tyhle entity opravdu potřebují. Sdílí ho balíček
   i offline prohlížeč — ať se ty dva nikdy nerozejdou.
   Vazby ven se zahazují včetně hodnot vazebních atributů; jinak by ve výřezu
   zůstal odkaz na entitu, která v něm není. */
function orezProjekt(entities){
const idSet=new Set(entities.map(e=>e.id));
let dropped=0;
const ents=entities.map(e=>{
const c=JSON.parse(JSON.stringify(e));
c.relations=(c.relations||[]).filter(r=>{if(idSet.has(r.targetId))return true;dropped++;return false});
const orezHodnotu=(def,drzak,klic)=>{
if(!def||def.type!=='relation')return;
const v=drzak[klic];
if(Array.isArray(v)){const p=v.filter(x=>idSet.has(x));dropped+=v.length-p.length;drzak[klic]=p}
else if(v&&!idSet.has(v)){dropped++;delete drzak[klic]}
};
getAllAttrDefsForEntity(e).forEach(d=>{if(c.attributes)orezHodnotu(d,c.attributes,d.id)});
(c.customAttributes||[]).forEach(ca=>orezHodnotu(ca,ca,'value'));
return c;
});
const usedTypes=new Set(),usedAspects=new Set(),usedRT=new Set(),usedSL=new Set(),usedTS=new Set();
ents.forEach(e=>{
if(e.typeId)usedTypes.add(e.typeId);
(e.aspects||[]).forEach(a=>usedAspects.add(a));
(e.relations||[]).forEach(r=>usedRT.add(r.relationTypeId));
});
const sberSeznamu=o=>(o.attributes||[]).forEach(a=>{
const l=a.type==='select'&&(a.listId||a.selectListId);if(l)usedSL.add(l);
if(a.type==='tags'&&a.tagSetId)usedTS.add(a.tagSetId);
});
state.data.entityTypes.forEach(ty=>{if(usedTypes.has(ty.id))sberSeznamu(ty)});
state.data.aspects.forEach(asp=>{if(usedAspects.has(asp.id))sberSeznamu(asp)});
const klon=x=>JSON.parse(JSON.stringify(x));
return{
entities:ents,
droppedRelations:dropped,
model:{
entityTypes:state.data.entityTypes.filter(ty=>usedTypes.has(ty.id)).map(klon),
aspects:state.data.aspects.filter(a=>usedAspects.has(a.id)).map(klon),
relationTypes:state.data.relationTypes.filter(rt=>usedRT.has(rt.id)).map(klon),
selectLists:(state.data.selectLists||[]).filter(sl=>usedSL.has(sl.id)).map(klon),
tagSets:(state.data.tagSets||[]).filter(ts=>usedTS.has(ts.id)).map(klon)
}};
}

function xlsxAttrVal(a,v){
if(v==null||v==='')return'';
if(!a)return String(v);
if(a.type==='yesno')return v?t('yes'):t('no');
if(a.type==='date'){const d=new Date(v);return isNaN(d)?String(v):d}
if(a.type==='number'){const n=Number(v);return isNaN(n)?String(v):n}
if(a.type==='relation'){
const ids=Array.isArray(v)?v:[v];
return ids.map(x=>{const z=findEntity(x);return z?getTitle(z):x}).filter(Boolean).sort(porovnejNazvy).join('; ');
}
if(a.type==='tags')return tagValueArr(v).slice().sort(porovnejNazvy).join('; ');
return String(v);
}

function detectDelimiter(firstLine){
const tabs=(firstLine.match(/\t/g)||[]).length;
const semis=(firstLine.match(/;/g)||[]).length;
const commas=(firstLine.match(/,/g)||[]).length;
if(tabs>=semis&&tabs>=commas&&tabs>0)return'\t';
if(semis>=commas&&semis>0)return';';
if(commas>0)return',';
return'\t';
}

function parseDSV(text,delim){
/* Simple DSV parser supporting quoted fields with embedded delimiter and newlines */
const rows=[];let cur=[];let buf='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'){if(text[i+1]==='"'){buf+='"';i++}else{inQ=false}}
else buf+=c;
}else{
if(c==='"'&&buf===''){inQ=true}
else if(c===delim){cur.push(buf);buf=''}
else if(c==='\r'){/* skip */}
else if(c==='\n'){cur.push(buf);rows.push(cur);cur=[];buf=''}
else buf+=c;
}
}
if(buf!==''||cur.length>0){cur.push(buf);rows.push(cur)}
return rows;
}

function processTSVImport(text){
if(!text||!text.trim()){toast(t('importTSVNothingToImport'));return}
if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);/* BOM z Excelu i z našeho CSV exportu */
const lines=text.split(/\r?\n/);
const firstLine=lines.find(l=>l.trim())||'';
const delim=detectDelimiter(firstLine);
dbg('TSV import: detected delimiter '+(delim==='\t'?'TAB':delim)+', '+lines.length+' lines');
const rows=parseDSV(text,delim).filter(r=>r.length>0&&r.some(c=>c&&c.trim()));
if(!rows.length){toast(t('importTSVEmpty'));return}
const headers=rows[0].map(h=>(h||'').trim());
const dataRows=rows.slice(1);
if(!headers.length){toast(t('importTSVEmpty'));return}

/* Map columns:
   - 'Název' or 'Name' or 'Title' → name
   - 'Typ' or 'Type' → type
   - 'Aspekty' or 'Aspects' → aspects (semicolon-separated)
   - Anything else → attribute name (resolved per-row using type info)
*/
const nameAliases=['název','nazev','name','title','jméno','jmeno','titul'];
const typeAliases=['typ','type','kategorie','category'];
const aspectAliases=['aspekty','aspects','aspekt','aspect'];
const archAliases=['archiv','archive','archivováno','archived'];
const inboxAliases=['inbox','schránka','schranka'];
const idAliases=['id','identifikátor','identifikator'];
const idCol={name:-1,type:-1,aspects:-1,archive:-1,inbox:-1,id:-1};
/* attribute candidates: list of {col, attrName, prefix}; resolved per-row */
const attrCols=[];
headers.forEach((h,i)=>{
const lh=h.toLowerCase();
if(idCol.name<0&&nameAliases.includes(lh)){idCol.name=i;return}
if(idCol.type<0&&typeAliases.includes(lh)){idCol.type=i;return}
if(idCol.aspects<0&&aspectAliases.includes(lh)){idCol.aspects=i;return}
if(idCol.archive<0&&archAliases.includes(lh)){idCol.archive=i;return}
if(idCol.inbox<0&&inboxAliases.includes(lh)){idCol.inbox=i;return}
if(idCol.id<0&&idAliases.includes(lh)){idCol.id=i;return}
let prefix='';let attrName=h;
const slash=h.indexOf('/');if(slash>=0){prefix=h.slice(0,slash).trim();attrName=h.slice(slash+1).trim()}
attrName=attrName.replace(/^\*\s*/,'').trim();
attrCols.push({col:i,attrName:attrName.toLowerCase(),prefix:prefix.toLowerCase(),header:h});
});
dbg('Mapped: name='+idCol.name+' type='+idCol.type+' aspects='+idCol.aspects+' archive='+idCol.archive+' inbox='+idCol.inbox+' id='+idCol.id+' attrCandidates='+attrCols.map(x=>x.header).join(', '));
function resolveAttr(attrCand,rowTypeId,rowAspectIds){
const lan=attrCand.attrName;const lap=attrCand.prefix;
if(!lan)return null;
/* If header has prefix matching rowTypeId or rowAspectIds, prefer that scope */
if(lap){
if(rowTypeId){const ty=findType(rowTypeId);if(ty&&(ty.name||'').toLowerCase()===lap){const a=ty.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}}
for(const aid of(rowAspectIds||[])){const asp=findAspect(aid);if(asp&&(asp.name||'').toLowerCase()===lap){const a=asp.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}}
/* Even if prefix doesn't match row, try global by prefix */
for(const ty of state.data.entityTypes){if((ty.name||'').toLowerCase()===lap){const a=ty.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}}
for(const asp of state.data.aspects){if((asp.name||'').toLowerCase()===lap){const a=asp.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}}
}
/* No prefix or prefix didn't match: prefer attribute from rowTypeId */
if(rowTypeId){const ty=findType(rowTypeId);if(ty){const a=ty.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}}
for(const aid of(rowAspectIds||[])){const asp=findAspect(aid);if(asp){const a=asp.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}}
/* Fallback: first match across types and aspects */
for(const ty of state.data.entityTypes){const a=ty.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}
for(const asp of state.data.aspects){const a=asp.attributes.find(x=>(x.name||'').toLowerCase()===lan);if(a)return a}
return null;
}

if(idCol.name<0){toast(t('importTSVNeedNameColumn'));dbg('Import aborted: no name column found in headers: '+headers.join(', '),true);return}

let added=0,updated=0,skipped=0;
const now=new Date().toISOString();
dataRows.forEach(row=>{
const name=(row[idCol.name]||'').trim();
if(!name){skipped++;return}
const typeName=idCol.type>=0?(row[idCol.type]||'').trim():'';
let typeId=null;
if(typeName){const ty=state.data.entityTypes.find(x=>(x.name||'').toLowerCase()===typeName.toLowerCase());if(ty)typeId=ty.id}
const aspectsStr=idCol.aspects>=0?(row[idCol.aspects]||'').trim():'';
const aspectIds=[];
if(aspectsStr){aspectsStr.split(/[;,]/).map(s=>s.trim()).filter(Boolean).forEach(an=>{const asp=state.data.aspects.find(x=>(x.name||'').toLowerCase()===an.toLowerCase());if(asp&&!aspectIds.includes(asp.id))aspectIds.push(asp.id)})}
const wantArch=idCol.archive>=0&&['1','true','ano','yes','x'].includes(((row[idCol.archive]||'').trim().toLowerCase()));
const wantInbox=idCol.inbox>=0&&['1','true','ano','yes','x'].includes(((row[idCol.inbox]||'').trim().toLowerCase()));
const idVal=idCol.id>=0?(row[idCol.id]||'').trim():'';
const attributes={};
attrCols.forEach(ac=>{
let raw=(row[ac.col]||'').trim();
if(raw==='')return;
const a=resolveAttr(ac,typeId,aspectIds);
if(!a)return;
if(a.type==='yesno'){const lr=raw.toLowerCase();if(['1','true','ano','yes','x'].includes(lr))attributes[a.id]=true;else if(['0','false','ne','no'].includes(lr))attributes[a.id]=false}
else if(a.type==='number'){const n=Number(raw.replace(',','.'));if(!isNaN(n))attributes[a.id]=n}
else if(a.type==='relation'){
const titles=raw.split(';').map(s=>s.trim()).filter(Boolean);
const ids=[];
titles.forEach(ttl=>{const ent=state.data.entities.find(x=>!x.archived&&getTitle(x).toLowerCase()===ttl.toLowerCase());if(ent)ids.push(ent.id)});
if(ids.length)attributes[a.id]=a.multi?ids:ids[0];
}
else if(a.type==='tags'){
/* Tagy z tabulky se párují na soustavu bez ohledu na velikost písmen;
   co v soustavě není, se do ní doplní — jinak by se hodnota tiše ztratila. */
const ts=findTagSet(a.tagSetId);
const hodnoty=[];
raw.split(';').map(x=>x.trim()).filter(Boolean).forEach(tg=>{
if(!ts){hodnoty.push(tg);return}
const shoda=(ts.tags||[]).find(x=>x.toLowerCase()===tg.toLowerCase());
if(shoda){if(hodnoty.indexOf(shoda)<0)hodnoty.push(shoda);return}
ts.tags=(ts.tags||[]).concat([tg]);hodnoty.push(tg);
});
if(hodnoty.length)attributes[a.id]=hodnoty;
}
else attributes[a.id]=raw;
});
let target=null;
if(idVal)target=state.data.entities.find(x=>x.id===idVal);
if(!target&&typeId)target=state.data.entities.find(x=>x.typeId===typeId&&getTitle(x).toLowerCase()===name.toLowerCase());
if(target){
target.name=name;
if(typeId)target.typeId=typeId;
target.attributes=Object.assign(target.attributes||{},attributes);
if(aspectIds.length)target.aspects=Array.from(new Set([...(target.aspects||[]),...aspectIds]));
if(wantArch)target.archived=true;
if(wantInbox)target.inInbox=true;
if(typeId&&!wantInbox)target.inInbox=false;
target.updatedAt=now;
updated++;
}else{
const ne={id:uid('e'),name:name,typeId:typeId,inInbox:!typeId||wantInbox,archived:wantArch,attributes:attributes,customAttributes:[],relations:[],aspects:aspectIds,createdAt:now,updatedAt:now};
state.data.entities.push(ne);
added++;
}
});
setDirty(true);closeDialog();render();
toast(t('importTSVResult',{a:added,u:updated,s:skipped}));
dbg('TSV import: added='+added+' updated='+updated+' skipped='+skipped);
}

/* MARKDOWN + CRITICMARKUP */
function renderMD(src){
if(!src)return'';
let text=String(src);
const tokens=[];
const tok=h=>{tokens.push(h);return'\u0001CMTOK'+(tokens.length-1)+'\u0001'};
/* Wiki-links [[Entity name]] — resolved to link (with type in parens) or broken indicator */
text=text.replace(/\[\[([^\]\n]+)\]\]/g,(m,name)=>{
const target=findEntityByName(name.trim());
if(target){const ty=target.typeId?findType(target.typeId):null;const suffix=ty?' ('+ty.name+')':'';return tok('<a class="wiki-link" href="#entity/'+target.id+'">'+esc(name.trim())+'</a>'+(suffix?'<span class="wiki-type">'+esc(suffix)+'</span>':''))}
return tok('<span class="wiki-broken" title="'+esc(t('wikiBrokenHint'))+'">[['+esc(name.trim())+']]</span>');
});
text=text.replace(/\{~~([\s\S]*?)~>([\s\S]*?)~~\}/g,(m,a,b)=>tok('<del class="cm-del">'+esc(a)+'</del><ins class="cm-add">'+esc(b)+'</ins>'));
text=text.replace(/\{>>([\s\S]*?)<<\}/g,(m,a)=>tok('<span class="cm-cm">'+esc(a)+'</span>'));
text=text.replace(/\{==([\s\S]*?)==\}/g,(m,a)=>tok('<mark class="cm-mark">'+esc(a)+'</mark>'));
text=text.replace(/\{\+\+([\s\S]*?)\+\+\}/g,(m,a)=>tok('<ins class="cm-add">'+esc(a)+'</ins>'));
text=text.replace(/\{--([\s\S]*?)--\}/g,(m,a)=>tok('<del class="cm-del">'+esc(a)+'</del>'));
text=esc(text);
text=text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g,(m,l,c)=>'<pre><code>'+c.replace(/^\s+|\s+$/g,'')+'</code></pre>');
text=text.replace(/^#### (.+)$/gm,'<h4>$1</h4>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
text=text.replace(/^---+$/gm,'<hr>');
text=text.replace(/(^&gt; .+(\n&gt; .+)*)/gm,m=>'<blockquote>'+m.replace(/^&gt; ?/gm,'')+'</blockquote>');
text=text.replace(/(^- .+(\n- .+)*)/gm,m=>{const it=m.split(/\n/).map(l=>'<li>'+l.replace(/^- /,'')+'</li>').join('');return'<ul>'+it+'</ul>'});
text=text.replace(/(^\d+\. .+(\n\d+\. .+)*)/gm,m=>{const it=m.split(/\n/).map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('');return'<ol>'+it+'</ol>'});
text=text.replace(/\[([^\]]+)\]\((https?:[^)\s]+|mailto:[^)\s]+|#[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
text=text.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
text=text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
text=text.replace(/`([^`\n]+)`/g,'<code>$1</code>');
text=text.split(/\n{2,}/).map(b=>{if(/^\s*<(h\d|ul|ol|pre|blockquote|hr|table)/.test(b))return b;return'<p>'+b.replace(/\n/g,'<br>')+'</p>'}).join('\n');
text=text.replace(/\u0001CMTOK(\d+)\u0001/g,(m,i)=>tokens[parseInt(i,10)]||'');
return text;
}

/* =============================================================

   Multiple independent working contexts (view+filters+entity) inside a single tab
