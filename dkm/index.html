/* =============================================================
   DATOVÝ MODEL — přehled a export do standardů
   Exportuje se *schéma* (typy, aspekty, atributy, číselníky, vazby),
   ne data. Klíče se odvozují stejně jako u exportu dat (jsonSlug
   + pole „Klíč v JSON"), takže vygenerované schéma sedí na to,
   co vyleze z exportu dat — jinak by obojí žilo vlastním životem.
   ============================================================= */

/* Mapování typů atributů do cílových světů. Jedno místo, ať se to nerozejde. */
const MODEL_TYPES={
text:     {json:{type:'string'},                       xsd:'xsd:string',  sql:'text',             uml:'String'},
textarea: {json:{type:'string'},                       xsd:'xsd:string',  sql:'text',             uml:'String'},
date:     {json:{type:'string',format:'date'},         xsd:'xsd:date',    sql:'date',             uml:'Date'},
url:      {json:{type:'string',format:'uri'},          xsd:'xsd:anyURI',  sql:'text',             uml:'String'},
select:   {json:{type:'string'},                       xsd:'xsd:string',  sql:'text',             uml:'String'},
yesno:    {json:{type:'boolean'},                      xsd:'xsd:boolean', sql:'boolean',          uml:'Boolean'},
number:   {json:{type:'number'},                       xsd:'xsd:decimal', sql:'numeric',          uml:'Real'},
relation: {json:{type:'string'},                       xsd:'xsd:anyURI',  sql:'text',             uml:'String'},
tags:     {json:{type:'string'},                       xsd:'xsd:string',  sql:'text',             uml:'String'}
};

function modelBaseIri(){
const v=(state.data.settings&&state.data.settings.baseIri||'').trim();
return v||('https://example.org/'+(jsonSlug(state.data.projectName,'snake')||'dkm')+'#');
}
/* xsd:date je sémanticky správně, ale leží mimo datovou mapu OWL 2 DL. */
function modelOwlDl(){return !!(state.data.settings&&state.data.settings.owlDlDates)}
function modelSetOwlDl(v){
state.data.settings=state.data.settings||{};
if(v)state.data.settings.owlDlDates=true;else delete state.data.settings.owlDlDates;
setDirty(true);
}
function modelXsd(a){
const x=a.map.xsd;
return (x==='xsd:date'&&modelOwlDl())?'xsd:dateTime':x;
}
function modelSetBaseIri(v){
state.data.settings=state.data.settings||{};
const s=String(v||'').trim();
if(s)state.data.settings.baseIri=s;else delete state.data.settings.baseIri;
setDirty(true);
}

/* Vnitřní reprezentace modelu — všechny generátory čtou jen tohle. */
function buildModelIR(){
const style='snake';
const usedT=new Set(),usedA=new Set(),usedR=new Set(),usedL=new Set();
const warnings=[];
const listById={};
const lists=(state.data.selectLists||[]).map(sl=>{
const key=jsonUniqueKey(sl.jsonKey||jsonSlug(sl.name,style)||'ciselnik',usedL,null);
const o={id:sl.id,key:key,name:sl.name||key,values:(sl.values||sl.options||[]).filter(v=>v!=null&&v!=='')};
listById[sl.id]=o;return o;
});
const usedTS=new Set();
const tagSetById={};
const tagSets=(state.data.tagSets||[]).map(ts=>{
const key=jsonUniqueKey(ts.jsonKey||jsonSlug(ts.name,style)||'tagy',usedTS,null);
const o={id:ts.id,key:key,name:ts.name||key,values:(ts.tags||[]).filter(v=>v!=null&&v!=='')};
tagSetById[ts.id]=o;return o;
});
function attrIR(a,ownerKey,used){
if(!a||!String(a.name||'').trim()){warnings.push(t('modelWarnNoName',{kde:ownerKey}));return null}
const key=jsonUniqueKey(a.jsonKey||jsonSlug(a.name,style)||'pole',used,null);
const list=a.type==='select'?(listById[a.listId||a.selectListId]||null):null;
if(a.type==='select'&&!list)warnings.push(t('modelWarnNoList',{atribut:a.name,kde:ownerKey}));
const soustava=a.type==='tags'?(tagSetById[a.tagSetId]||null):null;
if(a.type==='tags'&&!soustava)warnings.push(t('modelWarnNoTagSet',{atribut:a.name,kde:ownerKey}));
return{
id:a.id,key:key,name:a.name,type:a.type||'text',required:!!a.required,
list:list,tagSet:soustava,
values:a.type==='select'?attrSelectValues(a):(soustava?soustava.values.slice():[]),
targetType:a.type==='relation'?(a.targetType&&a.targetType!=='any'?a.targetType:null):null,
multi:!!a.multi,
map:MODEL_TYPES[a.type||'text']||MODEL_TYPES.text
};
}
const types=(state.data.entityTypes||[]).map(ty=>{
const key=jsonUniqueKey(ty.jsonKey||jsonSlug(ty.name,style)||'typ',usedT,null);
const used=new Set();
const attrs=(ty.attributes||[]).map(a=>attrIR(a,ty.name||key,used)).filter(Boolean);
return{id:ty.id,key:key,name:ty.name||key,icon:ty.icon||'',attrs:attrs};
});
const aspects=(state.data.aspects||[]).map(asp=>{
const key=jsonUniqueKey(asp.jsonKey||jsonSlug(asp.name,style)||'aspekt',usedA,null);
const used=new Set();
const attrs=(asp.attributes||[]).map(a=>attrIR(a,asp.name||key,used)).filter(Boolean);
return{id:asp.id,key:key,name:asp.name||key,attrs:attrs};
});
types.forEach(ty=>ty.attrs.forEach(a=>{a.iri=ty.key+'_'+a.key}));
aspects.forEach(asp=>asp.attrs.forEach(a=>{a.iri='aspekt_'+asp.key+'_'+a.key}));
const typeById={};types.forEach(x=>typeById[x.id]=x);
const rels=(state.data.relationTypes||[]).map(rt=>{
const key=jsonUniqueKey(rt.jsonKey||jsonSlug(rt.name,style)||'vazba',usedR,null);
const scope=rt.scope||'universal';
/* Prázdný seznam typů znamená „cokoliv", ne „nic" — viz isRelApplicable(). */
const from=(scope==='from'||scope==='specific')&&(rt.fromTypes||[]).length?(rt.fromTypes||[]).map(id=>typeById[id]).filter(Boolean):types.slice();
const to=(scope==='to'||scope==='specific')&&(rt.toTypes||[]).length?(rt.toTypes||[]).map(id=>typeById[id]).filter(Boolean):types.slice();
return{id:rt.id,key:key,name:rt.name||key,inverseName:rt.inverseName||'',scope:scope,from:from,to:to,
inverseKey:rt.inverseName?jsonSlug(rt.inverseName,style):''};
});

/* Kontrola soudržnosti — do přehledu i do hlavičky generovaných souborů. */
const typeAttrKeys={};
types.forEach(ty=>ty.attrs.forEach(a=>{(typeAttrKeys[a.key]=typeAttrKeys[a.key]||[]).push(ty.name)}));
aspects.forEach(asp=>asp.attrs.forEach(a=>{
if(typeAttrKeys[a.key])warnings.push(t('modelWarnDupKey',{klic:a.key,aspekt:asp.name,kde:typeAttrKeys[a.key].join(', ')}));
}));
lists.forEach(l=>{
const used=types.concat(aspects).some(o=>o.attrs.some(a=>a.list&&a.list.id===l.id));
if(!used)warnings.push(t('modelWarnUnusedList',{nazev:l.name}));
if(!l.values.length)warnings.push(t('modelWarnEmptyList',{nazev:l.name}));
});
if(!types.length)warnings.push(t('modelWarnNoTypes'));

return{
project:state.data.projectName||t('appName'),
description:state.data.projectDescription||'',
baseIri:modelBaseIri(),
generated:new Date().toISOString(),
types:types,aspects:aspects,lists:lists,tagSets:tagSets,rels:rels,
warnings:warnings.filter((w,i,arr)=>arr.indexOf(w)===i)
};
}

/* Vazby použitelné z daného typu — podle stejného pravidla jako isRelApplicable(). */
function modelRelsFrom(ir,ty){return ir.rels.filter(r=>r.from.some(x=>x.id===ty.id))}

/* Kolik entit daný typ/aspekt v projektu skutečně má — jen pro přehled, ne pro export. */
function modelUsage(ir){
const out={types:{},aspects:{},lists:{},rels:{}};
ir.types.forEach(x=>out.types[x.id]=state.data.entities.filter(e=>e.typeId===x.id).length);
ir.aspects.forEach(x=>out.aspects[x.id]=state.data.entities.filter(e=>(e.aspects||[]).includes(x.id)).length);
ir.rels.forEach(x=>out.rels[x.id]=state.data.entities.reduce((n,e)=>n+(e.relations||[]).filter(r=>r.relationTypeId===x.id).length,0));
ir.lists.forEach(l=>out.lists[l.id]=ir.types.concat(ir.aspects).reduce((n,o)=>n+o.attrs.filter(a=>a.list&&a.list.id===l.id).length,0));
return out;
}

/* ---------- pomocníci pro serializaci ---------- */

/* Minimální YAML pro data, která sami skládáme — OpenAPI se běžně čte v YAML. */
function toYaml(v,indent){
const pad='  '.repeat(indent||0);
if(v===null||v===undefined)return 'null';
if(typeof v==='boolean'||typeof v==='number')return String(v);
if(typeof v==='string')return yamlScalar(v,indent||0);
if(Array.isArray(v)){
if(!v.length)return '[]';
return '\n'+v.map(x=>{
const s=toYaml(x,(indent||0)+1);
/* Blokový uzel (mapa nebo pole) se vykreslí odsazený o dvě mezery navíc; pomlčka
   tedy musí nahradit odsazení prvního řádku, jinak vyjde nevalidní YAML. */
if(s.charAt(0)==='\n')return pad+'- '+s.slice(1+pad.length+2);
return pad+'- '+s;
}).join('\n');
}
const keys=Object.keys(v);
if(!keys.length)return '{}';
return '\n'+keys.map(k=>{
const val=toYaml(v[k],(indent||0)+1);
const sep=(val.charAt(0)==='\n')?'':' ';
return pad+yamlKey(k)+':'+sep+val;
}).join('\n');
}
function yamlKey(k){return /^[A-Za-z_][A-Za-z0-9_.-]*$/.test(k)?k:JSON.stringify(k)}
function yamlScalar(s,indent){
if(s.indexOf('\n')>=0){
const pad='  '.repeat(indent+1);
return '|-\n'+s.split('\n').map(l=>pad+l).join('\n');
}
if(s===''||/^[-?:,[\]{}#&*!|>'"%@`]/.test(s)||/:\s|\s#/.test(s)||/^(true|false|null|yes|no|on|off|~)$/i.test(s)||/^[+-]?[0-9.]+$/.test(s))return JSON.stringify(s);
return s;
}
/* Řetězec do Turtle. */
function ttlStr(s){return '"'+String(s==null?'':s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n')+'"'}
/* Lokální jméno do IRI — Turtle prefixované jméno nesnese ledacos. */
function ttlName(s){return String(s||'x').replace(/[^A-Za-z0-9_-]/g,'_')||'x'}
function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
/* Identifikátor pro SQL — malá písmena, bez diakritiky, vyhýbá se klíčovým slovům. */
const SQL_RESERVED=['user','order','table','group','select','from','where','index','key','check','default','references','primary','unique','constraint','column','type','all','and','or','not','null','true','false'];
function sqlIdent(s){
let x=jsonSlug(s,'snake')||'x';
if(SQL_RESERVED.indexOf(x)>=0)x=x+'_';
if(/^[0-9]/.test(x))x='x'+x;
return x;
}
function sqlStr(s){return "'"+String(s==null?'':s).replace(/'/g,"''")+"'"}

/* ---------- Markdown dokumentace ---------- */
function modelToMarkdown(ir){
const L=[];
const typeLabel={text:'text',textarea:'víceřádkový text',date:'datum',url:'URL',select:'výběr ze seznamu',yesno:'ano/ne',number:'číslo',relation:'vazba na entitu'};
const lbl=a=>t('attrType')+': '+(t(ATYPE_LBL[a.type]||'attrTypeText'));
L.push('# '+ir.project+' — '+t('modelDocTitle'));
L.push('');
if(ir.description){L.push(ir.description);L.push('')}
L.push('- '+t('modelDocGenerated')+': '+fmtDate(ir.generated,true));
L.push('- '+t('modelDocCounts',{t:ir.types.length,a:ir.aspects.length,r:ir.rels.length,l:ir.lists.length}));
L.push('- '+t('modelBaseIri')+': `'+ir.baseIri+'`');
L.push('');
L.push(t('modelDocKeysNote'));
L.push('');

function attrTable(attrs){
if(!attrs.length){L.push('_'+t('modelDocNoAttrs')+'_');L.push('');return}
L.push('| '+t('name')+' | '+t('jsonKeyCol')+' | '+t('attrType')+' | '+t('required')+' | '+t('modelDocNote')+' |');
L.push('|---|---|---|---|---|');
attrs.forEach(a=>{
let note='';
if(a.type==='select')note=a.list?(t('settingsLists')+': **'+a.list.name+'** ('+(a.values.join(', ')||'—')+')'):'⚠ '+t('modelWarnNoListShort');
else if(a.type==='tags')note=a.tagSet?(t('settingsTags')+': **'+a.tagSet.name+'** ('+(a.values.join(', ')||'—')+')'):'⚠ '+t('modelWarnNoTagSetShort');
else if(a.type==='relation')note=(a.targetType?t('attrTargetType')+': '+(ir.types.find(x=>x.id===a.targetType)||{name:'?'}).name:t('any'))+(a.multi?' · '+t('attrMulti'):'');
L.push('| '+a.name+' | `'+a.key+'` | '+t(ATYPE_LBL[a.type]||'attrTypeText')+' | '+(a.required?'✔':'')+' | '+note+' |');
});
L.push('');
}

L.push('## '+t('settingsTypes'));
L.push('');
if(!ir.types.length){L.push('_—_');L.push('')}
ir.types.forEach(ty=>{
L.push('### '+(ty.icon?ty.icon+' ':'')+ty.name+' (`'+ty.key+'`)');
L.push('');
attrTable(ty.attrs);
const rels=modelRelsFrom(ir,ty);
if(rels.length){
L.push('**'+t('detailRelations')+'**');L.push('');
rels.forEach(r=>L.push('- '+r.name+' → '+(r.to.length===ir.types.length?t('any'):r.to.map(x=>x.name).join(', '))+(r.inverseName?' _('+t('modelDocInverse')+': '+r.inverseName+')_':'')));
L.push('');
}
});

if(ir.aspects.length){
L.push('## '+t('settingsAspects'));
L.push('');
L.push(t('modelDocAspectsNote'));
L.push('');
ir.aspects.forEach(asp=>{L.push('### ◎ '+asp.name+' (`'+asp.key+'`)');L.push('');attrTable(asp.attrs)});
}

if(ir.rels.length){
L.push('## '+t('settingsRelations'));
L.push('');
L.push('| '+t('name')+' | `'+t('jsonKeyCol')+'` | '+t('modelDocInverse')+' | '+t('modelDocFrom')+' | '+t('modelDocTo')+' |');
L.push('|---|---|---|---|---|');
ir.rels.forEach(r=>{
const f=r.from.length===ir.types.length?t('any'):r.from.map(x=>x.name).join(', ');
const to=r.to.length===ir.types.length?t('any'):r.to.map(x=>x.name).join(', ');
L.push('| '+r.name+' | `'+r.key+'` | '+(r.inverseName||'—')+' | '+f+' | '+to+' |');
});
L.push('');
}

if(ir.lists.length){
L.push('## '+t('settingsLists'));
L.push('');
ir.lists.forEach(l=>{
L.push('### '+l.name+' (`'+l.key+'`)');
L.push('');
if(l.values.length)l.values.forEach(v=>L.push('- '+v));else L.push('_—_');
L.push('');
});
}

if((ir.tagSets||[]).length){
L.push('## '+t('settingsTags'));
L.push('');
ir.tagSets.forEach(ts=>{
L.push('### '+ts.name+' (`'+ts.key+'`)');
L.push('');
if(ts.values.length)ts.values.forEach(v=>L.push('- '+v));else L.push('_—_');
L.push('');

}

if(ir.warnings.length){
L.push('## '+t('jsonWarnings'));

ir.warnings.forEach(w=>L.push('- '+w));

}
return L.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

/* ---------- JSON Schema 2020-12 ---------- */
/* Aspekt je průřezová sada atributů — v JSON Schema se skládá přes allOf
   a `unevaluatedProperties:false`, což je jediná konstrukce, která kompozici
   snese (additionalProperties by allOf neviděl). */
function modelAttrJsonSchema(a){
const s=Object.assign({},a.map.json);
s.title=a.name;
if(a.type==='select'&&a.values.length)s.enum=a.values.slice();
if(a.type==='tags'){
const it={type:'string'};if(a.values.length)it.enum=a.values.slice();
return{title:a.name,type:'array',items:it,uniqueItems:true};
}
if(a.type==='relation'){
const item={$ref:'#/$defs/_odkaz'};
return a.multi?{title:a.name,type:'array',items:item}:{title:a.name,allOf:[item]};
}
return s;
}
function modelToJsonSchema(ir){
const defs={};
const sys={id:{type:'string'},typ:{type:'string'},nazev:{type:'string'},
aspekty:{type:'array',items:{type:'string'}},vytvoreno:{type:'string'},zmeneno:{type:'string'}};
defs._odkaz={title:t('jsonDefRef'),type:'object',properties:{ref:{type:'string'},typ:{type:'string'},nazev:{type:'string'}},required:['ref']};
ir.aspects.forEach(asp=>{
const props={};asp.attrs.forEach(a=>{props[a.key]=modelAttrJsonSchema(a)});
defs['aspekt_'+asp.key]={title:asp.name,'x-dkm-kind':'aspect',type:'object',properties:props};
});
ir.types.forEach(ty=>{
const props=Object.assign({},sys);
props.typ={type:'string',const:ty.key};
ty.attrs.forEach(a=>{props[a.key]=modelAttrJsonSchema(a)});
const rels=modelRelsFrom(ir,ty);
if(rels.length){
const rp={};
rels.forEach(r=>{rp[r.key]={title:r.name,type:'array',items:{$ref:'#/$defs/_odkaz'}}});
props.vazby={type:'object',properties:rp};
}
const own={type:'object',properties:props,required:['id','nazev'].concat(ty.attrs.filter(a=>a.required).map(a=>a.key))};
defs[ty.key]={title:ty.name,'x-dkm-kind':'type',
allOf:[own].concat(ir.aspects.map(a=>({$ref:'#/$defs/aspekt_'+a.key}))),
unevaluatedProperties:false};
});
return{
'$schema':'https://json-schema.org/draft/2020-12/schema',
'$id':ir.baseIri.replace(/[#/]$/,'')+'/schema.json',
title:ir.project+' — '+t('modelDocTitle'),
description:ir.description||undefined,
type:'object',
properties:ir.types.reduce((o,ty)=>{o[ty.key]={type:'array',items:{$ref:'#/$defs/'+ty.key}};return o},{}),
'$defs':defs
};
}

/* ---------- XSD (celý model) ---------- */
/* Protějšek modelToJsonSchema. Aspekt je xs:group, protože se v XSD 1.0
   skládá do typu stejně, jako ho JSON Schema skládá přes allOf.
   Pořadí prvků drží pořadí, ve kterém je zapisuje export dat. */
function modelXsdType(a){
/* Výběr s číselníkem se vypisuje inline jako výčet; bez číselníku zbývá řetězec. */
return(a.map.xsd||'xsd:string').replace('xsd:','xs:');
}
function modelXsdElem(a,pad){
const min=a.required?'':' minOccurs="0"';
if(a.type==='relation')return[pad+'<xs:element name="'+a.key+'" type="_odkaz"'+min+' maxOccurs="unbounded"/>'];
if(a.type==='tags'){
/* Tagů je víc najednou — v XML se to pozná jen opakováním prvku. */
if(!a.values||!a.values.length)return[pad+'<xs:element name="'+a.key+'" type="xs:string" minOccurs="0" maxOccurs="unbounded"/>'];
const out=[pad+'<xs:element name="'+a.key+'" minOccurs="0" maxOccurs="unbounded">'];
out.push(pad+'  <xs:simpleType><xs:restriction base="xs:string">');
a.values.forEach(v=>out.push(pad+'    <xs:enumeration value="'+xmlEsc(v)+'"/>'));
out.push(pad+'  </xs:restriction></xs:simpleType>');
out.push(pad+'</xs:element>');
return out;
}
if(a.type==='select'&&a.values&&a.values.length){
const out=[pad+'<xs:element name="'+a.key+'"'+min+'>'];
out.push(pad+'  <xs:simpleType><xs:restriction base="xs:string">');
a.values.forEach(v=>out.push(pad+'    <xs:enumeration value="'+xmlEsc(v)+'"/>'));
out.push(pad+'  </xs:restriction></xs:simpleType>');
out.push(pad+'</xs:element>');
return out;
}
return[pad+'<xs:element name="'+a.key+'" type="'+modelXsdType(a)+'"'+min+'/>'];
}
function modelToXsd(ir){
const L=['<?xml version="1.0" encoding="UTF-8"?>'];
L.push('<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema" elementFormDefault="qualified">');
L.push('  <xs:annotation><xs:documentation>'+xmlEsc(ir.project+' — '+t('modelDocTitle'))+(ir.description?' — '+xmlEsc(ir.description):'')+'</xs:documentation></xs:annotation>');
/* Kořen — kolekce po typech, stejně jako u JSON Schema */
L.push('  <xs:element name="data">');
L.push('    <xs:complexType>');
L.push('      <xs:sequence>');
ir.types.forEach(ty=>L.push('        <xs:element name="'+ty.key+'" type="'+ty.key+'" minOccurs="0" maxOccurs="unbounded"/>'));
L.push('      </xs:sequence>');
L.push('    </xs:complexType>');
L.push('  </xs:element>');
L.push('  <xs:complexType name="_odkaz">');
L.push('    <xs:sequence>');
L.push('      <xs:element name="ref" type="xs:string"/>');
L.push('      <xs:element name="typ" type="xs:string" minOccurs="0"/>');
L.push('      <xs:element name="nazev" type="xs:string" minOccurs="0"/>');
L.push('    </xs:sequence>');
L.push('  </xs:complexType>');
ir.aspects.forEach(asp=>{
if(!asp.attrs.length)return;
L.push('  <xs:group name="aspekt_'+asp.key+'">');
L.push('    <xs:annotation><xs:documentation>'+xmlEsc(asp.name+' — '+t('modelOwlAspectNote'))+'</xs:documentation></xs:annotation>');
L.push('    <xs:sequence>');
asp.attrs.forEach(a=>modelXsdElem(Object.assign({},a,{required:false}),'      ').forEach(x=>L.push(x)));
L.push('    </xs:sequence>');
L.push('  </xs:group>');
});
ir.types.forEach(ty=>{
L.push('  <xs:complexType name="'+ty.key+'">');
L.push('    <xs:annotation><xs:documentation>'+xmlEsc(ty.name)+'</xs:documentation></xs:annotation>');
L.push('    <xs:sequence>');
L.push('      <xs:element name="id" type="xs:string"/>');
L.push('      <xs:element name="typ" type="xs:string" fixed="'+ty.key+'" minOccurs="0"/>');
L.push('      <xs:element name="nazev" type="xs:string"/>');
ty.attrs.forEach(a=>modelXsdElem(a,'      ').forEach(x=>L.push(x)));
ir.aspects.forEach(asp=>{if(asp.attrs.length)L.push('      <xs:group ref="aspekt_'+asp.key+'" minOccurs="0"/>')});
L.push('      <xs:element name="aspekty" type="xs:string" minOccurs="0" maxOccurs="unbounded"/>');
const rels=modelRelsFrom(ir,ty);
if(rels.length){
L.push('      <xs:element name="vazby" minOccurs="0">');
L.push('        <xs:complexType><xs:sequence>');
rels.forEach(r=>L.push('          <xs:element name="'+r.key+'" type="_odkaz" minOccurs="0" maxOccurs="unbounded"/>'));
L.push('        </xs:sequence></xs:complexType>');
L.push('      </xs:element>');
}
L.push('      <xs:element name="inbox" type="xs:boolean" minOccurs="0"/>');
L.push('      <xs:element name="archiv" type="xs:boolean" minOccurs="0"/>');
L.push('      <xs:element name="vytvoreno" type="xs:string" minOccurs="0"/>');
L.push('      <xs:element name="zmeneno" type="xs:string" minOccurs="0"/>');
L.push('    </xs:sequence>');
L.push('  </xs:complexType>');
});
L.push('</xs:schema>');
return L.join('\n')+'\n';
}

/* ---------- OpenAPI 3.1 ---------- */
function modelToOpenApi(ir,withPaths){
const schema=modelToJsonSchema(ir);
const comps={};
Object.keys(schema.$defs).forEach(k=>{
/* OpenAPI odkazuje do components/schemas, ne do $defs. */
comps[k]=JSON.parse(JSON.stringify(schema.$defs[k]).replace(/#\/\$defs\//g,'#/components/schemas/'));
});
const doc={
openapi:'3.1.0',
info:{title:ir.project+' — '+t('modelDocTitle'),version:'1.0.0',description:(ir.description||'')+'\n\n'+t('modelDocKeysNote')},
components:{schemas:comps}
};
if(withPaths){
const paths={};
ir.types.forEach(ty=>{
const ref={$ref:'#/components/schemas/'+ty.key};
paths['/'+ty.key]={
get:{summary:t('modelApiList',{typ:ty.name}),operationId:'list_'+ty.key,
responses:{'200':{description:'OK',content:{'application/json':{schema:{type:'array',items:ref}}}}}},
post:{summary:t('modelApiCreate',{typ:ty.name}),operationId:'create_'+ty.key,
requestBody:{required:true,content:{'application/json':{schema:ref}}},
responses:{'201':{description:'Created',content:{'application/json':{schema:ref}}}}}
};
paths['/'+ty.key+'/{id}']={
parameters:[{name:'id','in':'path',required:true,schema:{type:'string'}}],
get:{summary:t('modelApiGet',{typ:ty.name}),operationId:'get_'+ty.key,
responses:{'200':{description:'OK',content:{'application/json':{schema:ref}}},'404':{description:'Not found'}}},
put:{summary:t('modelApiUpdate',{typ:ty.name}),operationId:'update_'+ty.key,
requestBody:{required:true,content:{'application/json':{schema:ref}}},
responses:{'200':{description:'OK',content:{'application/json':{schema:ref}}}}},
'delete':{summary:t('modelApiDelete',{typ:ty.name}),operationId:'delete_'+ty.key,
responses:{'204':{description:'No content'}}}
};
});
doc.paths=paths;
}
return doc;
}

/* ---------- SQL DDL (PostgreSQL) ---------- */
/* Aspekt může viset na entitě libovolného typu, takže relačně to je tabulka
   navázaná na společnou tabulku `entita` — ne sloupce v tabulce typu. */
function modelToSql(ir){
const L=[];
L.push('-- '+ir.project+' — '+t('modelDocTitle'));
L.push('-- '+t('modelDocGenerated')+': '+ir.generated);
L.push('-- '+t('modelSqlNote'));
L.push('');
L.push('CREATE TABLE entita (');
L.push('  id           text PRIMARY KEY,');
L.push('  typ          text NOT NULL,');
L.push('  nazev        text NOT NULL,');
L.push('  inbox        boolean NOT NULL DEFAULT false,');
L.push('  archiv       boolean NOT NULL DEFAULT false,');
L.push('  vytvoreno    timestamptz,');
L.push('  zmeneno      timestamptz');
L.push(');');
L.push('');
ir.lists.forEach(l=>{
const tn='ciselnik_'+sqlIdent(l.key);
L.push('CREATE TABLE '+tn+' (kod text PRIMARY KEY);');
if(l.values.length)L.push('INSERT INTO '+tn+' (kod) VALUES '+l.values.map(v=>'('+sqlStr(v)+')').join(', ')+';');
L.push("COMMENT ON TABLE "+tn+" IS "+sqlStr(l.name)+";");
L.push('');
});
(ir.tagSets||[]).forEach(ts=>{
const tn='tagy_'+sqlIdent(ts.key);
L.push('CREATE TABLE '+tn+' (kod text PRIMARY KEY);');
if(ts.values.length)L.push('INSERT INTO '+tn+' (kod) VALUES '+ts.values.map(v=>'('+sqlStr(v)+')').join(', ')+';');
L.push("COMMENT ON TABLE "+tn+" IS "+sqlStr(ts.name)+";");
L.push('');
});
function cols(o,tn){
const out=[];const post=[];
o.attrs.forEach(a=>{
if(a.type==='relation'&&a.multi)return;/* M:N má vlastní tabulku */
if(a.type==='tags')return;/* tagů je víc najednou — taky vlastní tabulka */
const cn=sqlIdent(a.key);
if(a.type==='relation'){
out.push('  '+cn+' text REFERENCES entita(id)'+(a.required?' NOT NULL':''));
}else if(a.type==='select'&&a.list){
out.push('  '+cn+' text REFERENCES ciselnik_'+sqlIdent(a.list.key)+'(kod)'+(a.required?' NOT NULL':''));
}else{
out.push('  '+cn+' '+a.map.sql+(a.required?' NOT NULL':''));
}
post.push("COMMENT ON COLUMN "+tn+'.'+cn+" IS "+sqlStr(a.name)+";");
});
return{cols:out,post:post};
}
/* Tagový atribut: vazební tabulka entita × tag, s odkazem do soustavy. */
function tagTabulky(o,tn,popis){
o.attrs.filter(a=>a.type==='tags').forEach(a=>{
const jt=tn+'_'+sqlIdent(a.key);
L.push('CREATE TABLE '+jt+' (');
L.push('  '+tn+'_id text NOT NULL REFERENCES '+tn+'(id) ON DELETE CASCADE,');
L.push('  tag text NOT NULL'+(a.tagSet?' REFERENCES tagy_'+sqlIdent(a.tagSet.key)+'(kod)':'')+',');
L.push('  PRIMARY KEY ('+tn+'_id, tag)');
L.push(');');
L.push("COMMENT ON TABLE "+jt+" IS "+sqlStr(popis+' / '+a.name)+";");
});
}
ir.types.forEach(ty=>{
const tn=sqlIdent(ty.key);
const c=cols(ty,tn);
L.push('CREATE TABLE '+tn+' (');
L.push(['  id text PRIMARY KEY REFERENCES entita(id) ON DELETE CASCADE'].concat(c.cols).join(',\n'));
L.push(');');
L.push("COMMENT ON TABLE "+tn+" IS "+sqlStr(ty.name)+";");
c.post.forEach(x=>L.push(x));
tagTabulky(ty,tn,ty.name);
ty.attrs.filter(a=>a.type==='relation'&&a.multi).forEach(a=>{
const jt=tn+'_'+sqlIdent(a.key);
L.push('CREATE TABLE '+jt+' (');
L.push('  '+tn+'_id text NOT NULL REFERENCES '+tn+'(id) ON DELETE CASCADE,');
L.push('  cil_id text NOT NULL REFERENCES entita(id) ON DELETE CASCADE,');
L.push('  PRIMARY KEY ('+tn+'_id, cil_id)');
L.push(');');
L.push("COMMENT ON TABLE "+jt+" IS "+sqlStr(ty.name+' / '+a.name)+";");
});
L.push('');
});
ir.aspects.forEach(asp=>{
const tn='aspekt_'+sqlIdent(asp.key);
const c=cols(asp,tn);
L.push('CREATE TABLE '+tn+' (');
L.push(['  id text PRIMARY KEY REFERENCES entita(id) ON DELETE CASCADE'].concat(c.cols).join(',\n'));
L.push(');');
L.push("COMMENT ON TABLE "+tn+" IS "+sqlStr(t('detailAspect')+': '+asp.name)+";");
c.post.forEach(x=>L.push(x));
tagTabulky(asp,tn,asp.name);
L.push('');
});
if(ir.rels.length){
L.push('CREATE TABLE typ_vazby (kod text PRIMARY KEY, nazev text NOT NULL, opacny_nazev text);');
L.push('INSERT INTO typ_vazby (kod, nazev, opacny_nazev) VALUES');
L.push(ir.rels.map(r=>'  ('+sqlStr(r.key)+', '+sqlStr(r.name)+', '+(r.inverseName?sqlStr(r.inverseName):'NULL')+')').join(',\n')+';');
L.push('');
L.push('CREATE TABLE vazba (');
L.push('  id          text PRIMARY KEY,');
L.push('  typ_vazby   text NOT NULL REFERENCES typ_vazby(kod),');
L.push('  zdroj_id    text NOT NULL REFERENCES entita(id) ON DELETE CASCADE,');
L.push('  cil_id      text NOT NULL REFERENCES entita(id) ON DELETE CASCADE');
L.push(');');
L.push('CREATE INDEX vazba_zdroj_idx ON vazba (zdroj_id);');
L.push('CREATE INDEX vazba_cil_idx ON vazba (cil_id);');
ir.rels.forEach(r=>{
if(r.from.length!==ir.types.length||r.to.length!==ir.types.length){
L.push('-- '+t('modelSqlScopeNote',{vazba:r.name,z:r.from.map(x=>x.key).join(', '),na:r.to.map(x=>x.key).join(', ')}));
}
});
}
return L.join('\n')+'\n';
}

/* ---------- RDFS / OWL + SKOS (Turtle) ---------- */
/* Číselníky jdou jako SKOS schémata — v české veřejné správě je to obvyklý tvar. */
function modelTtlPrefixes(ir){
return['@prefix : <'+ir.baseIri+'> .',
'@prefix owl: <http://www.w3.org/2002/07/owl#> .',
'@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .',
'@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .',
'@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .',
'@prefix skos: <http://www.w3.org/2004/02/skos/core#> .',
'@prefix sh: <http://www.w3.org/ns/shacl#> .',
'@prefix dct: <http://purl.org/dc/terms/> .'];
}
function modelToOwl(ir){
const L=modelTtlPrefixes(ir);
const lang='@'+(state.language==='en'?'en':'cs');
L.push('');
L.push('<'+ir.baseIri.replace(/[#/]$/,'')+'> a owl:Ontology ;');
L.push('  dct:title '+ttlStr(ir.project)+lang+' ;');
if(ir.description)L.push('  dct:description '+ttlStr(ir.description)+lang+' ;');
L.push('  dct:created '+ttlStr(ir.generated)+'^^xsd:dateTime .');
L.push('');
function cls(key,name,note,parent){
const out=[];
out.push('  rdfs:label '+ttlStr(name)+lang);
if(parent)out.push('  rdfs:subClassOf :'+ttlName(parent));
if(note)out.push('  rdfs:comment '+ttlStr(note)+lang);
L.push(':'+ttlName(key)+' a owl:Class ;');
L.push(out.join(' ;\n')+' .');
L.push('');
}
/* Společný předek — stejná role jako tabulka entita v SQL a třída Entita v UML. */
cls('entita','Entita',t('modelEntityNote'));
ir.types.forEach(ty=>cls(ty.key,ty.name,'','entita'));
ir.aspects.forEach(asp=>cls('aspekt_'+asp.key,asp.name,t('modelOwlAspectNote')));
/* Číselníky */
ir.lists.forEach(l=>{
const scheme=':'+ttlName('ciselnik_'+l.key);
L.push(scheme+' a skos:ConceptScheme ;');
L.push('  skos:prefLabel '+ttlStr(l.name)+lang+' .');
l.values.forEach(v=>{
L.push(':'+ttlName('ciselnik_'+l.key+'_'+jsonSlug(v,'snake'))+' a skos:Concept ;');
L.push('  skos:inScheme '+scheme+' ;');
L.push('  skos:prefLabel '+ttlStr(v)+lang+' .');
});
L.push('');
});
/* Soustavy tagů — tentýž tvar jako číselníky, jen se z nich bere víc hodnot najednou. */
(ir.tagSets||[]).forEach(ts=>{
const scheme=':'+ttlName('tagy_'+ts.key);
L.push(scheme+' a skos:ConceptScheme ;');
L.push('  skos:prefLabel '+ttlStr(ts.name)+lang+' .');
ts.values.forEach(v=>{
L.push(':'+ttlName('tagy_'+ts.key+'_'+jsonSlug(v,'snake'))+' a skos:Concept ;');
L.push('  skos:inScheme '+scheme+' ;');
L.push('  skos:prefLabel '+ttlStr(v)+lang+' .');
});
L.push('');
});
/* Datové a objektové vlastnosti z atributů */
function domainOf(owner,isAspect){return ':'+ttlName(isAspect?('aspekt_'+owner.key):owner.key)}
function props(owner,isAspect){
owner.attrs.forEach(a=>{
const p=':'+ttlName(a.iri);
if(a.type==='relation'){
L.push(p+' a owl:ObjectProperty ;');
L.push('  rdfs:label '+ttlStr(a.name)+lang+' ;');
L.push('  rdfs:domain '+domainOf(owner,isAspect)+(a.targetType?' ;':' .'));
if(a.targetType){const tt=ir.types.find(x=>x.id===a.targetType);L.push('  rdfs:range :'+ttlName(tt?tt.key:'entita')+' .')}
}else if((a.type==='select'&&a.list)||(a.type==='tags'&&a.tagSet)){
L.push(p+' a owl:ObjectProperty ;');
L.push('  rdfs:label '+ttlStr(a.name)+lang+' ;');
L.push('  rdfs:domain '+domainOf(owner,isAspect)+' ;');
L.push('  rdfs:range skos:Concept .');
}else{
L.push(p+' a owl:DatatypeProperty ;');
L.push('  rdfs:label '+ttlStr(a.name)+lang+' ;');
L.push('  rdfs:domain '+domainOf(owner,isAspect)+' ;');
L.push('  rdfs:range '+modelXsd(a)+' .');
}
L.push('');
});
}
ir.types.forEach(ty=>props(ty,false));
ir.aspects.forEach(asp=>props(asp,true));
/* Typy vazeb — opačný název dává smysl vyjádřit jako owl:inverseOf */
ir.rels.forEach(r=>{
const p=':'+ttlName('vazba_'+r.key);
L.push(p+' a owl:ObjectProperty ;');
L.push('  rdfs:label '+ttlStr(r.name)+lang+' ;');
L.push('  rdfs:domain '+(r.from.length&&r.from.length<ir.types.length?unionOf(r.from):':entita')+' ;');
L.push('  rdfs:range '+(r.to.length&&r.to.length<ir.types.length?unionOf(r.to):':entita')+' ;');
L.push('  rdfs:isDefinedBy <'+ir.baseIri.replace(/[#/]$/,'')+'> .');
if(r.inverseName){
const ip=':'+ttlName('vazba_'+(r.inverseKey||(r.key+'_inv')));
L.push(ip+' a owl:ObjectProperty ;');
L.push('  rdfs:label '+ttlStr(r.inverseName)+lang+' ;');
L.push('  owl:inverseOf '+p+' .');
}
L.push('');
});
function unionOf(list){
if(list.length===1)return ':'+ttlName(list[0].key);
return '[ a owl:Class ; owl:unionOf ( '+list.map(x=>':'+ttlName(x.key)).join(' ')+' ) ]';
}
return L.join('\n')+'\n';
}

/* ---------- SHACL (Turtle) ---------- */
function modelToShacl(ir){
const L=modelTtlPrefixes(ir);
const lang='@'+(state.language==='en'?'en':'cs');
L.push('');
L.push('# '+ir.project+' — SHACL');
L.push('# '+t('modelShaclNote'));
L.push('');
function propShape(a,indent){
const pad=indent;
const out=[];
out.push(pad+'sh:property [');
out.push(pad+'  sh:path :'+ttlName(a.iri)+' ;');
out.push(pad+'  sh:name '+ttlStr(a.name)+lang+' ;');
if(a.type==='relation'){
out.push(pad+'  sh:nodeKind sh:IRI ;');
if(a.targetType){const tt=ir.types.find(x=>x.id===a.targetType);if(tt)out.push(pad+'  sh:class :'+ttlName(tt.key)+' ;')}
if(!a.multi)out.push(pad+'  sh:maxCount 1 ;');
}else if(a.type==='select'&&a.values.length&&a.list){
/* OWL dělá z hodnot číselníku skos:Concept — tvar musí mluvit o týchž IRI, ne o řetězcích. */
out.push(pad+'  sh:nodeKind sh:IRI ;');
out.push(pad+'  sh:class skos:Concept ;');
out.push(pad+'  sh:in ( '+a.values.map(v=>':'+ttlName('ciselnik_'+a.list.key+'_'+jsonSlug(v,'snake'))).join(' ')+' ) ;');
out.push(pad+'  sh:maxCount 1 ;');
}else if(a.type==='tags'&&a.tagSet&&a.values.length){
/* Tagů může být víc — proto bez sh:maxCount; hodnoty ale jen ze soustavy. */
out.push(pad+'  sh:nodeKind sh:IRI ;');
out.push(pad+'  sh:class skos:Concept ;');
out.push(pad+'  sh:in ( '+a.values.map(v=>':'+ttlName('tagy_'+a.tagSet.key+'_'+jsonSlug(v,'snake'))).join(' ')+' ) ;');
}else if(a.type==='tags'){
out.push(pad+'  sh:nodeKind sh:IRI ;');
}else if(a.type==='number'){
/* sh:datatype je přesný — "2"^^xsd:integer není xsd:decimal, i když je to totéž číslo. */
out.push(pad+'  sh:or ( [ sh:datatype xsd:decimal ] [ sh:datatype xsd:integer ] [ sh:datatype xsd:double ] ) ;');
out.push(pad+'  sh:maxCount 1 ;');
}else{
out.push(pad+'  sh:datatype '+modelXsd(a)+' ;');
out.push(pad+'  sh:maxCount 1 ;');
}
if(a.required)out.push(pad+'  sh:minCount 1 ;');
out[out.length-1]=out[out.length-1].replace(/ ;$/,'');
out.push(pad+'] ;');
return out;
}
function relShape(r,pad){
const out=[];
out.push(pad+'sh:property [');
out.push(pad+'  sh:path :'+ttlName('vazba_'+r.key)+' ;');
out.push(pad+'  sh:name '+ttlStr(r.name)+lang+' ;');
out.push(pad+'  sh:nodeKind sh:IRI ;');
/* Omezení na :entita by po datovém grafu chtělo znát hierarchii tříd — mlčíme raději. */
if(r.to.length&&r.to.length<ir.types.length){
out.push(pad+'  '+(r.to.length===1?'sh:class :'+ttlName(r.to[0].key)
  :'sh:or ( '+r.to.map(x=>'[ sh:class :'+ttlName(x.key)+' ]').join(' ')+' )')+' ;');
}
out[out.length-1]=out[out.length-1].replace(/ ;$/,'');
out.push(pad+'] ;');
return out;
}
ir.types.forEach(ty=>{
L.push(':'+ttlName(ty.key)+'Shape a sh:NodeShape ;');
L.push('  sh:targetClass :'+ttlName(ty.key)+' ;');
L.push('  sh:name '+ttlStr(ty.name)+lang+' ;');
ty.attrs.forEach(a=>propShape(a,'  ').forEach(x=>L.push(x)));
modelRelsFrom(ir,ty).forEach(r=>relShape(r,'  ').forEach(x=>L.push(x)));
L[L.length-1]=L[L.length-1].replace(/ ;$/,' .');
L.push('');
});
ir.aspects.forEach(asp=>{
if(!asp.attrs.length)return;
L.push(':aspekt_'+ttlName(asp.key)+'Shape a sh:NodeShape ;');
L.push('  sh:targetClass :aspekt_'+ttlName(asp.key)+' ;');
L.push('  sh:name '+ttlStr(asp.name)+lang+' ;');
asp.attrs.forEach(a=>propShape(a,'  ').forEach(x=>L.push(x)));
L[L.length-1]=L[L.length-1].replace(/ ;$/,' .');
L.push('');
});
return L.join('\n')+'\n';
}

/* ---------- XMI 2.1 (UML) pro Enterprise Architect ---------- */
/* Soubor je samonosný: primitivní typy si definuje sám, protože UML 2.1 zná jen
   String, Boolean, Integer a UnlimitedNatural — odkaz na #Date nebo #Real by se
   v žádném CASE nástroji nerozřešil. Aspekt je samostatná třída navázaná na
   Entitu, stejně jako je v SQL samostatná tabulka. */
function modelToXmi(ir){
let seq=0;
const idOf={};
function xid(k){if(!idOf[k])idOf[k]='EAID_'+(++seq)+'_'+ttlName(k);return idOf[k]}
const L=[];
const stereo=[];/* pro rozšíření Enterprise Architectu */
L.push('<?xml version="1.0" encoding="UTF-8"?>');
L.push('<xmi:XMI xmi:version="2.1" xmlns:uml="http://schema.omg.org/spec/UML/2.1" xmlns:xmi="http://schema.omg.org/spec/XMI/2.1">');
L.push('  <xmi:Documentation exporter="DKM" exporterVersion="1"/>');
L.push('  <uml:Model xmi:type="uml:Model" name="'+xmlEsc(ir.project)+'" xmi:id="'+xid('model')+'">');
L.push('    <packagedElement xmi:type="uml:Package" xmi:id="'+xid('pkg')+'" name="'+xmlEsc(ir.project)+'">');

/* Primitivní typy */
['String','Boolean','Integer','Real','Date','DateTime'].forEach(x=>
L.push('      <packagedElement xmi:type="uml:PrimitiveType" xmi:id="'+xid('pt_'+x)+'" name="'+x+'"/>'));

/* Číselníky jako výčty */
ir.lists.forEach(l=>{
L.push('      <packagedElement xmi:type="uml:Enumeration" xmi:id="'+xid('enum_'+l.key)+'" name="'+xmlEsc(l.name)+'">');
l.values.forEach(v=>L.push('        <ownedLiteral xmi:type="uml:EnumerationLiteral" xmi:id="'+xid('lit_'+l.key+'_'+jsonSlug(v,'snake'))+'" name="'+xmlEsc(v)+'"/>'));
L.push('      </packagedElement>');
});
(ir.tagSets||[]).forEach(ts=>{
L.push('      <packagedElement xmi:type="uml:Enumeration" xmi:id="'+xid('enumtag_'+ts.key)+'" name="'+xmlEsc(ts.name)+'">');
ts.values.forEach(v=>L.push('        <ownedLiteral xmi:type="uml:EnumerationLiteral" xmi:id="'+xid('littag_'+ts.key+'_'+jsonSlug(v,'snake'))+'" name="'+xmlEsc(v)+'"/>'));
L.push('      </packagedElement>');
});

function mult(pad,key,lo,up){
L.push(pad+'<lowerValue xmi:type="uml:LiteralInteger" xmi:id="'+xid('lo_'+key)+'" value="'+lo+'"/>');
L.push(pad+'<upperValue xmi:type="uml:LiteralUnlimitedNatural" xmi:id="'+xid('up_'+key)+'" value="'+up+'"/>');
}
function attrXml(pad,key,name,typeId,lo,up){
L.push(pad+'<ownedAttribute xmi:type="uml:Property" xmi:id="'+xid('attr_'+key)+'" name="'+xmlEsc(name)+'">');
L.push(pad+'  <type xmi:idref="'+typeId+'"/>');
mult(pad+'  ','attr_'+key,lo,up);
L.push(pad+'</ownedAttribute>');
}
function attrsXml(o,pad){
o.attrs.forEach(a=>{
if(a.type==='relation')return;/* vazby jsou asociace, ne atributy */
if(a.type==='tags'){
/* Tagy jsou vícehodnotové — horní mez je *, ne 1. */
attrXml(pad,o.key+'_'+a.key,a.name,a.tagSet?xid('enumtag_'+a.tagSet.key):xid('pt_String'),a.required?1:0,'*');
return;
}
const ty=(a.type==='select'&&a.list)?xid('enum_'+a.list.key):xid('pt_'+a.map.uml);
attrXml(pad,o.key+'_'+a.key,a.name,ty,a.required?1:0,1);
});
}

/* Společný předek — sloupce odpovídají tabulce entita v SQL exportu. */
const entId=xid('cls_entita');
L.push('      <packagedElement xmi:type="uml:Class" xmi:id="'+entId+'" name="Entita">');
L.push('        <ownedComment xmi:type="uml:Comment" xmi:id="'+xid('cmt_entita')+'" body="'+xmlEsc(t('modelEntityNote'))+'"/>');
[['id','String',1],['nazev','String',1],['inbox','Boolean',1],['archiv','Boolean',1],

/* Asociace. Konce vždy s explicitní násobností — bez ní UML rozumí 1..1,
   což by znamenalo, že vazba je povinná. */
function assoc(key,name,e1Id,e1Name,e1Lo,e1Up,e2Id,e2Name,e2Lo,e2Up){
const aid=xid('assoc_'+key);
const k1='end1_'+key,k2='end2_'+key;
const i1=xid(k1),i2=xid(k2);
L.push('      <packagedElement xmi:type="uml:Association" xmi:id="'+aid+'" name="'+xmlEsc(name)+'">');
L.push('        <memberEnd xmi:idref="'+i1+'"/>');
L.push('        <memberEnd xmi:idref="'+i2+'"/>');
[[i1,k1,e1Id,e1Name,e1Lo,e1Up],[i2,k2,e2Id,e2Name,e2Lo,e2Up]].forEach(([i,k,cls,nm,lo,up])=>{
L.push('        <ownedEnd xmi:type="uml:Property" xmi:id="'+i+'"'+(nm?' name="'+xmlEsc(nm)+'"':'')+' association="'+aid+'">');
L.push('          <type xmi:idref="'+cls+'"/>');
mult('          ',k,lo,up);
L.push('        </ownedEnd>');
});
L.push('      </packagedElement>');
}

/* Aspekt visí na entitě — nejvýš jednou, nezávisle na typu. */
ir.aspects.forEach(asp=>assoc('aspekt_'+asp.key,asp.name,
  entId,'',1,1, xid('cls_aspekt_'+asp.key),asp.key,0,1));

/* Typy vazeb. Neomezená strana se váže na Entitu — jinak by z univerzální vazby
   vznikl kartézský součin všech typů a model by se v nástroji nedal číst. */
ir.rels.forEach(r=>{
const froms=(!r.from.length||r.from.length===ir.types.length)?[{key:'entita',cid:entId}]:r.from.map(x=>({key:x.key,cid:xid('cls_'+x.key)}));
const tos=(!r.to.length||r.to.length===ir.types.length)?[{key:'entita',cid:entId}]:r.to.map(x=>({key:x.key,cid:xid('cls_'+x.key)}));
froms.forEach(f=>tos.forEach(to=>assoc(r.key+'_'+f.key+'_'+to.key,r.name,
  f.cid,r.inverseName||'',0,'*', to.cid,r.name,0,'*')));
});
/* Atributy typu „vazba" jako asociace na cílový typ */
ir.types.forEach(ty=>ty.attrs.filter(a=>a.type==='relation'&&a.targetType).forEach(a=>{
const tt=ir.types.find(x=>x.id===a.targetType);if(!tt)return;
assoc('attr_'+ty.key+'_'+a.key,a.name,
  xid('cls_'+ty.key),'',0,'*', xid('cls_'+tt.key),a.name,0,a.multi?'*':1);
}));

L.push('    </packagedElement>');
L.push('  </uml:Model>');
if(stereo.length){
/* Stereotyp bez profilu se v XMI jinak předat nedá; ostatní nástroje blok ignorují. */
L.push('  <xmi:Extension extender="Enterprise Architect" extenderID="6.5">');
L.push('    <elements>');
stereo.forEach(x=>{
L.push('      <element xmi:idref="'+x.id+'" xmi:type="uml:Class" name="'+xmlEsc(x.name)+'">');
L.push('        <properties stereotype="'+xmlEsc(x.stereotype)+'"/>');
L.push('      </element>');
});
L.push('    </elements>');
L.push('  </xmi:Extension>');
}
L.push('</xmi:XMI>');
return L.join('\n')+'\n';
}

/* ============================================================
   DUPLICITY — entity se shodným názvem, porovnání vedle sebe
   a řešení (sloučit / přejmenovat). Slučuje se stávající cestou
   `bulkMerge` → `doMerge`, žádná druhá implementace.
   ============================================================ */

/* Normalizace názvu. „Praha", „praha" i „Praha " je pro hledání totéž. */
function dupeKey(s,mode){
const v=String(s||'').trim();
if(mode==='exact')return v;
return v.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
}
function findDuplicates(opts){
const list=state.data.entities.filter(e=>opts.includeArchived||!e.archived);
const map=new Map();
list.forEach(e=>{
const base=dupeKey(getTitle(e),opts.mode);
if(!base)return;
const key=base+(opts.sameTypeOnly?('␀'+(e.typeId||'')):'');
if(!map.has(key))map.set(key,[]);
map.get(key).push(e);
});
const out=[];
map.forEach(ents=>{
if(ents.length<2)return;
const exact=new Set(ents.map(e=>String(getTitle(e)).trim())).size===1;
out.push({ents:ents,exact:exact});
});
out.sort((a,b)=>b.ents.length-a.ents.length||String(getTitle(a.ents[0])).localeCompare(String(getTitle(b.ents[0])),'cs'));
return out;
}

/* Řádky porovnání: systémové údaje + sjednocení atributů celé skupiny. */
function dupeCell(v){
if(v==null)return '';
if(v instanceof Date)return fmtDate(v.toISOString(),false);
return String(v);
}
function dupeRows(ents,showEmpty){
const rows=[];
rows.push({label:t('entityName'),vals:ents.map(e=>String(getTitle(e)))});
rows.push({label:t('type'),vals:ents.map(e=>{const ty=e.typeId?findType(e.typeId):null;return ty?ty.name:''})});
rows.push({label:t('detailAspects'),vals:ents.map(e=>(e.aspects||[]).map(id=>{const a=findAspect(id);return a?a.name:id}).join(', '))});
const defs=[];const seen=new Set();
ents.forEach(e=>getAllAttrDefsForEntity(e).forEach(d=>{if(seen.has(d.id))return;seen.add(d.id);defs.push(d)}));
defs.forEach(d=>{
if(!d.name||!String(d.name).trim())return;
const vals=ents.map(e=>dupeCell(xlsxAttrVal(d,e.attributes&&e.attributes[d.id])));
if(!vals.some(v=>v!=='')&&!showEmpty)return;
rows.push({label:(d.scopeLabel?d.scopeLabel+' / ':'')+d.name,vals:vals});
});
const caNames=[];
ents.forEach(e=>(e.customAttributes||[]).forEach(ca=>{const n=(ca.name||'').trim();if(n&&caNames.indexOf(n)<0)caNames.push(n)}));
caNames.forEach(n=>rows.push({label:'* '+n,vals:ents.map(e=>{const ca=(e.customAttributes||[]).find(x=>(x.name||'').trim()===n);return ca?dupeCell(xlsxAttrVal(ca,ca.value)):''})}));
rows.push({label:t('detailRelations'),vals:ents.map(e=>(e.relations||[]).map(r=>{const rt=findRT(r.relationTypeId),tg=findEntity(r.targetId);return(rt?rt.name:'?')+' → '+(tg?getTitle(tg):r.targetId)}).sort(porovnejNazvy).join('; '))});
rows.push({label:t('detailBacklinks'),vals:ents.map(e=>String(collectBacklinks(e.id).length))});
rows.push({label:t('detailComments'),vals:ents.map(e=>String((e.comments||[]).length))});
rows.push({label:t('updated'),vals:ents.map(e=>fmtDate(e.updatedAt,true))});
rows.push({label:'ID',vals:ents.map(e=>e.id)});
rows.forEach(r=>{r.differs=new Set(r.vals.map(v=>String(v==null?'':v))).size>1});
return rows;
}

const ik=zalozkaIkona(z);
return (ik?ik+' ':'')+(z.kind==='sep'?'|':zalozkaNazev(z))+(zalozkaCilOk(z)?'':' ⚠');
}

});

/* Cíl podle druhu */

if(cb.checked){if(z.typeIds.indexOf(ty.id)<0)z.typeIds.push(ty.id)}
else z.typeIds=z.typeIds.filter(x=>x!==ty.id);

box.appendChild(lab);
});

b.appendChild(f);
}
else if(z.kind==='aspect')b.appendChild(zalozkaVyber(t('tabKindAspect'),state.data.aspects.map(a=>[a.id,a.name]),z.aspectId,v=>{z.aspectId=v}));
else if(z.kind==='view')b.appendChild(zalozkaVyber(t('tabKindView'),(state.data.savedViews||[]).map(v=>[v.id,(v.icon?v.icon+' ':'')+v.name]),z.viewId,v=>{z.viewId=v}));
else if(z.kind==='entity')b.appendChild(zalozkaVyberEntity(z));
else if(z.kind==='new')b.appendChild(zalozkaVyber(t('tabKindNew'),state.data.entityTypes.map(ty=>[ty.id,(ty.icon?ty.icon+' ':'')+ty.name]),z.typeId,v=>{z.typeId=v},t('tabNewNoType')));
else if(z.kind==='tag'){
const pouzite=collectUsedTags();
const vsechny=[];
(state.data.tagSets||[]).forEach(ts=>(ts.tags||[]).forEach(tg=>vsechny.push([tagKlic(ts.id,tg),ts.name+' / '+tg])));
pouzite.forEach(x=>{const k=tagKlic(x.tagSetId,x.tag);if(!vsechny.some(v=>v[0]===k))vsechny.push([k,(x.setName||'?')+' / '+x.tag])});

/* Volby */

f.appendChild(i);

b.appendChild(f);
}
if(z.kind!=='sep'){
const vb=document.createElement('div');vb.style.display='flex';vb.style.gap='1rem';vb.style.flexWrap='wrap';vb.style.marginTop='.3rem';
const maPocet=['inbox','all','archive','type','aspect','tag','comments','view'].indexOf(z.kind)>=0;/* u recent je počet vždycky limit, nemá co říct */

zalozky().forEach(x=>{delete x.isDefault});

b.appendChild(vb);
}

return it;
}
/* Jeden cíl z nabídky — společný tvar pro aspekt, pohled, tag i typ nové entity. */
function zalozkaVyber(popisek,dvojice,hodnota,ulozit,prazdnyPopis){
const f=document.createElement('div');f.className='fld';
const l=document.createElement('label');l.textContent=popisek;f.appendChild(l);
const sel=document.createElement('select');sel.setAttribute('aria-label',popisek);
const o0=document.createElement('option');o0.value='';o0.textContent=prazdnyPopis||('— '+t('pleaseChoose')+' —');sel.appendChild(o0);
dvojice.forEach(dv=>{const o=document.createElement('option');o.value=dv[0];o.textContent=dv[1];if(dv[0]===hodnota)o.selected=true;sel.appendChild(o)});
if(hodnota&&!dvojice.some(dv=>dv[0]===hodnota)){const o=document.createElement('option');o.value=hodnota;o.textContent=t('tabBroken');o.selected=true;sel.appendChild(o)}
sel.addEventListener('change',()=>{ulozit(sel.value);setDirty(true);render()});
f.appendChild(sel);return f;
}
/* Entit může být hodně, proto s našeptáváním podle názvu. */
function zalozkaVyberEntity(z){
const f=document.createElement('div');f.className='fld';
const l=document.createElement('label');l.htmlFor='zal-ent-'+z.id;l.textContent=t('tabKindEntity');f.appendChild(l);
const inp=document.createElement('input');inp.id='zal-ent-'+z.id;inp.type='text';inp.setAttribute('list','zal-ent-l-'+z.id);
const cur=findEntity(z.entityId);
inp.value=cur?getTitle(cur):'';
inp.placeholder=t('advFilterPickEntity');
const dl=document.createElement('datalist');dl.id='zal-ent-l-'+z.id;
state.data.entities.forEach(e=>{if(e.archived)return;const o=document.createElement('option');o.value=getTitle(e);dl.appendChild(o)});
inp.addEventListener('change',()=>{
const nazev=inp.value.trim().toLowerCase();
const e=state.data.entities.find(x=>!x.archived&&getTitle(x).toLowerCase()===nazev);
z.entityId=e?e.id:'';
if(!e&&nazev)toast(t('tabEntityNotFound'));
setDirty(true);render();
});
f.appendChild(inp);f.appendChild(dl);
return f;
}
function zalozkaVolba(popisek,zapnuto,ulozit){
const lab=document.createElement('label');lab.className='cb';
const cb=document.createElement('input');cb.type='checkbox';cb.checked=zapnuto;
cb.addEventListener('change',()=>{ulozit(cb.checked);setDirty(true);render()});
lab.appendChild(cb);const sp=document.createElement('span');sp.textContent=popisek;lab.appendChild(sp);
return lab;
}

const wrap=document.getElementById('b-custom-wrap');
if(!btn||!menu||!wrap)return;
const close=focusBack=>{menu.hidden=true;btn.setAttribute('aria-expanded','false');if(focusBack)btn.focus()};
const build=()=>{
menu.innerHTML='';
const section=(label,items,current,onPick)=>{
const h=document.createElement('div');h.className='hdr-menu-h';h.textContent=label;menu.appendChild(h);
items.forEach(([val,lbl])=>{
const mi=document.createElement('button');mi.type='button';mi.className='hdr-menu-i';
mi.setAttribute('role','menuitemradio');mi.setAttribute('aria-checked',val===current?'true':'false');
const ck=document.createElement('span');ck.className='hdr-menu-ck';ck.setAttribute('aria-hidden','true');ck.textContent=val===current?'✓':'';mi.appendChild(ck);
const sp=document.createElement('span');sp.textContent=lbl;mi.appendChild(sp);
mi.addEventListener('click',()=>{onPick(val);close(true);});
menu.appendChild(mi);
});
};
section(t('languageLabel'),[['cs','Čeština'],['en','English']],state.language,v=>{
state.language=v;localStorage.setItem(SK_LANG,v);render();
});
section(t('themeLabel'),THEMES.map(v=>[v,t(THEME_LBL[v])]),currentTheme(),v=>{
setTheme(v);render();
});
};
btn.addEventListener('click',()=>{
if(menu.hidden){build();menu.hidden=false;btn.setAttribute('aria-expanded','true');const f=menu.querySelector('button');if(f)f.focus()}
else close(false);
});
menu.addEventListener('keydown',ev=>{
if(ev.key==='Escape'){ev.preventDefault();close(true);return}
if(ev.key!=='ArrowDown'&&ev.key!=='ArrowUp')return;
ev.preventDefault();
const items=Array.from(menu.querySelectorAll('button'));
const i=items.indexOf(document.activeElement);
const next=ev.key==='ArrowDown'?(i+1)%items.length:(i-1+items.length)%items.length;
items[next].focus();
});
document.addEventListener('click',ev=>{if(!wrap.contains(ev.target))close(false)});
}

const s=document.getElementById('sin');

}

/* =============================================================
   EXPORT DO DATOVÉHO JSON + JSON SCHEMA
   Projekce dat ven z nástroje: klíče odvozené z názvů typů a atributů
   (snake_case bez diakritiky), místo interních ID. K datům se generuje
   JSON Schema, které popisuje *jen to, co se v exportu skutečně objevilo*,
   a mapovací tabulka. Vše se balí do ZIPu přes makeZip.

   Železné pravidlo: schéma musí validovat data, se kterými je zabalené.
   Proto se před zabalením spustí vlastní validátor (jsonValidate) a
   cokoliv, co by schéma rozbilo (hodnota mimo číselník, nevyplněný
   povinný atribut, neplatný formát data), se ve schématu změkčí
   a zapíše jako varování — nikdy se nezabalí nekonzistentní dvojice.
   ============================================================= */

/* Systémová pole — pojmenování podle zvoleného jazyka klíčů. */
const JSON_SYS={
cs:{id:'id',typ:'typ',nazev:'nazev',aspekty:'aspekty',vazby:'vazby',vytvoreno:'vytvoreno',zmeneno:'zmeneno',
archiv:'archiv',inbox:'inbox',komentare:'komentare',objekty:'objekty',vlastni:'vlastni',
ref:'ref',autor:'autor',text:'text',obsah:'obsah',
projekt:'projekt',exportovano:'exportovano',nastroj:'nastroj',verzeFormatu:'verze_formatu',pocty:'pocty'},
en:{id:'id',typ:'type',nazev:'name',aspekty:'aspects',vazby:'relations',vytvoreno:'created',zmeneno:'updated',
archiv:'archived',inbox:'inbox',komentare:'comments',objekty:'objects',vlastni:'custom',
ref:'ref',autor:'author',text:'text',obsah:'content',
projekt:'project',exportovano:'exported',nastroj:'tool',verzeFormatu:'format_version',pocty:'counts'}
};
const JSON_FORMAT_VERSION=1;
const JSON_UNTYPED_KEY='_bez_typu';

/* Název → klíč. snake_case (výchozí) nebo camelCase, vždy bez diakritiky a ASCII. */
function jsonSlug(name,style){
let x=String(name==null?'':name).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
x=x.replace(/[^A-Za-z0-9]+/g,' ').trim();
if(!x)return '';
const parts=x.split(/\s+/).map(p=>p.toLowerCase());
let out=style==='camel'?parts[0]+parts.slice(1).map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(''):parts.join('_');
/* Klíč nesmí začínat číslicí (podtržítko je vyhrazené pro _meta a _bez_typu). */
if(/^[0-9]/.test(out))out='x'+out;
return out;
}
/* Zajistí jedinečnost klíče v dané jmenné oblasti; kolize řeší příponou _2, _3… */
function jsonUniqueKey(base,used,reserved){
let k=base||'pole';
if(reserved&&reserved.has(k))k=k+'_2';
if(!used.has(k)){used.add(k);return k}
let i=2;while(used.has(k+'_'+i))i++;
const r=k+'_'+i;used.add(r);return r;
}
function jsonIsEmpty(v){
if(v==null)return true;
if(typeof v==='string')return v.trim()==='';
if(Array.isArray(v))return v.length===0;
return false;
}
function defaultJsonExportCfg(){
return{scope:'filtered',typeIds:null,keyStyle:'snake',sysLang:'cs',
relMode:'ref',includeComments:false,includeObjects:false,includeCustom:true,
includeEmpty:false,includeUntyped:false,allAttrs:false,splitFiles:false,persistKeys:false,format:'json',
keyOverrides:{}};
}

/* ---------- Sestavení plánu exportu ---------- */

/* Entity podle zvoleného rozsahu. */
function jsonExportEntities(cfg,preset){
let ents;
if(cfg.scope==='selected'&&preset&&preset.length)ents=preset.slice();
else if(cfg.scope==='all')ents=state.data.entities.filter(e=>!e.archived);
else ents=getList();
if(cfg.typeIds&&cfg.typeIds.length){
const set=new Set(cfg.typeIds);
ents=ents.filter(e=>set.has(e.typeId||'__none__'));
}
return ents;
}

/* Globální mapa klíčů pro typy, aspekty a typy vazeb — nezávislá na tom,
   co se zrovna exportuje, aby odkazy ven z exportu pojmenovávaly typ stejně. */
function jsonGlobalKeys(cfg){
const st=cfg.keyStyle;const ov=cfg.keyOverrides||{};
const types=new Map(),aspects=new Map(),rels=new Map();
const usedT=new Set(),usedA=new Set(),usedR=new Set();
const reservedT=new Set(['_meta',JSON_UNTYPED_KEY]);
state.data.entityTypes.forEach(ty=>{
const base=ov['ty:'+ty.id]||ty.jsonKey||jsonSlug(ty.name,st)||'typ';
types.set(ty.id,jsonUniqueKey(base,usedT,reservedT));
});
(state.data.aspects||[]).forEach(asp=>{
const base=ov['as:'+asp.id]||asp.jsonKey||jsonSlug(asp.name,st)||'aspekt';
aspects.set(asp.id,jsonUniqueKey(base,usedA,null));
});
(state.data.relationTypes||[]).forEach(rt=>{
const base=ov['rt:'+rt.id]||rt.jsonKey||jsonSlug(rt.name,st)||'vazba';
rels.set(rt.id,jsonUniqueKey(base,usedR,null));
});
return{types:types,aspects:aspects,rels:rels};
}

/* Plán: pro každý exportovaný typ seznam vlastností s klíči a informací,
   jestli jsou vyplněné u všech / aspoň jedné entity. */
function buildJsonPlan(cfg,preset){
const st=cfg.keyStyle;const sys=JSON_SYS[cfg.sysLang]||JSON_SYS.cs;const ov=cfg.keyOverrides||{};
const gk=jsonGlobalKeys(cfg);
const warnings=[];
const ents=jsonExportEntities(cfg,preset);
const groups=new Map();
ents.forEach(e=>{
const k=e.typeId||'__none__';
if(k==='__none__'&&!cfg.includeUntyped)return;
if(!groups.has(k))groups.set(k,[]);
groups.get(k).push(e);
});
const reservedProps=new Set(Object.keys(sys).map(k=>sys[k]));
const types=[];
groups.forEach((list,typeId)=>{
const ty=typeId==='__none__'?null:findType(typeId);
if(typeId!=='__none__'&&!ty)return;
const key=ty?gk.types.get(ty.id):JSON_UNTYPED_KEY;
const usedKeys=new Set();
const props=[];
const addProp=(a,source,asp)=>{
if(!a||!a.name||!String(a.name).trim()){warnings.push(t('jsonWarnNoName',{typ:ty?ty.name:t('jsonUntyped')}));return}
let filled=0;const carriers=[];
list.forEach(e=>{
if(source==='aspect'&&!(e.aspects||[]).includes(asp.id))return;
carriers.push(e);
if(!jsonIsEmpty(e.attributes&&e.attributes[a.id]))filled++;
});
if(!filled&&!cfg.allAttrs)return;
let base=ov['at:'+a.id]||a.jsonKey||jsonSlug(a.name,st)||'pole';
if(source==='aspect'&&usedKeys.has(base))base=gk.aspects.get(asp.id)+(st==='camel'?base.charAt(0).toUpperCase()+base.slice(1):'_'+base);
const pk=jsonUniqueKey(base,usedKeys,reservedProps);
if(pk!==base)warnings.push(t('jsonWarnKeyCollision',{puvodni:base,novy:pk,typ:ty?ty.name:t('jsonUntyped')}));
props.push({attr:a,source:source,aspect:asp||null,key:pk,
filled:filled,carriers:carriers.length,
allFilled:carriers.length>0&&filled===carriers.length&&carriers.length===list.length});
};
if(ty)(ty.attributes||[]).forEach(a=>addProp(a,'type',null));
/* Aspekty, které se u entit tohoto typu skutečně vyskytly */
const aspIds=[];
list.forEach(e=>(e.aspects||[]).forEach(id=>{if(aspIds.indexOf(id)<0)aspIds.push(id)}));
const aspects=[];
aspIds.forEach(id=>{const asp=findAspect(id);if(!asp)return;aspects.push(asp);(asp.attributes||[]).forEach(a=>addProp(a,'aspect',asp))});
/* Typy vazeb, které se u entit tohoto typu skutečně vyskytly */
const relIds=[];
list.forEach(e=>(e.relations||[]).forEach(r=>{if(r.relationTypeId&&relIds.indexOf(r.relationTypeId)<0)relIds.push(r.relationTypeId)}));
const rels=relIds.map(id=>({rt:findRT(id),key:gk.rels.get(id)})).filter(x=>x.rt&&x.key);
types.push({ty:ty,key:key,ents:list,props:props,aspects:aspects,rels:rels});
});
types.sort((a,b)=>a.key.localeCompare(b.key));
return{cfg:cfg,sys:sys,gk:gk,types:types,entities:ents,warnings:warnings};
}

/* ---------- Data ---------- */

function jsonRefObj(id,plan,cfg){
const sys=plan.sys;
const e=findEntity(id);
if(!e)return null;
const o={};o[sys.ref]=e.id;
const tk=e.typeId?plan.gk.types.get(e.typeId):null;
if(tk)o[sys.typ]=tk;
o[sys.nazev]=getTitle(e);
return o;
}
/* Vnořený objekt = tentýž objekt bez vazeb (hloubka je vždy 1, cykly tak nevzniknou). */
function jsonEmbedObj(id,plan,cfg,warn){
const e=findEntity(id);
if(!e)return null;
const grp=plan.types.find(g=>(g.ty?g.ty.id:'__none__')===(e.typeId||'__none__'));
if(!grp)return jsonRefObj(id,plan,cfg);
return jsonEntityObj(e,grp,plan,cfg,warn,true);
}
function jsonRelValue(ids,plan,cfg,warn){
const out=[];
(Array.isArray(ids)?ids:[ids]).forEach(id=>{
if(!id)return;
if(!findEntity(id)){warn.dangling++;return}
if(cfg.relMode==='id')out.push(id);
else if(cfg.relMode==='embed')out.push(jsonEmbedObj(id,plan,cfg,warn));
else out.push(jsonRefObj(id,plan,cfg));
});
return out.filter(Boolean);
}
function jsonAttrValue(a,v,plan,cfg,warn){
switch(a.type){
case'yesno':return !!v;
case'number':{const n=Number(v);if(!isFinite(n)){warn.nan++;return undefined}return n}
case'relation':return jsonRelValue(v,plan,cfg,warn);
case'tags':return tagValueArr(v);
default:return String(v);
}
}
function jsonEntityObj(e,grp,plan,cfg,warn,embedded){
const sys=plan.sys;const o={};
o[sys.id]=e.id;
if(grp.ty)o[sys.typ]=grp.key;
o[sys.nazev]=getTitle(e);
grp.props.forEach(p=>{
if(p.source==='aspect'&&!(e.aspects||[]).includes(p.aspect.id))return;
if(embedded&&p.attr.type==='relation')return;
const raw=e.attributes&&e.attributes[p.attr.id];
if(jsonIsEmpty(raw)){if(cfg.includeEmpty&&!embedded)o[p.key]=null;return}
const val=jsonAttrValue(p.attr,raw,plan,cfg,warn);
if(val!==undefined)o[p.key]=val;
});
if(embedded)return o;
const asps=(e.aspects||[]).map(id=>plan.gk.aspects.get(id)).filter(Boolean);
if(asps.length)o[sys.aspekty]=asps;
if(grp.rels.length){
const vz={};
grp.rels.forEach(r=>{
const ids=(e.relations||[]).filter(x=>x.relationTypeId===r.rt.id).map(x=>x.targetId);
if(!ids.length)return;
const vals=jsonRelValue(ids,plan,cfg,warn);
if(vals.length)vz[r.key]=vals;
});
if(Object.keys(vz).length)o[sys.vazby]=vz;
}
if(cfg.includeCustom&&(e.customAttributes||[]).length){
const cu={};const used=new Set();
e.customAttributes.forEach(ca=>{
if(jsonIsEmpty(ca.value))return;
const k=jsonUniqueKey(jsonSlug(ca.name,cfg.keyStyle)||'pole',used,null);
const val=jsonAttrValue(ca,ca.value,plan,cfg,warn);
if(val!==undefined)cu[k]=val;
});
if(Object.keys(cu).length)o[sys.vlastni]=cu;
}
if(cfg.includeComments&&(e.comments||[]).length){
o[sys.komentare]=e.comments.map(c=>{const x={};x[sys.autor]=c.author||'';x[sys.text]=c.content||'';x[sys.vytvoreno]=c.createdAt||'';return x});
}
if(cfg.includeObjects&&(e.objects||[]).length){
o[sys.objekty]=e.objects.map(ob=>{const x={};x[sys.nazev]=ob.name||'';x[sys.obsah]=ob.content||'';return x});
}
if(e.inInbox)o[sys.inbox]=true;
if(e.archived)o[sys.archiv]=true;
if(e.createdAt)o[sys.vytvoreno]=e.createdAt;
if(e.updatedAt)o[sys.zmeneno]=e.updatedAt;
return o;
}
function buildJsonData(plan,cfg){
const sys=plan.sys;const warn={dangling:0,nan:0};
const data={};
data['$schema']='schema.json';
const meta={};
meta[sys.projekt]=state.data.projectName||'';
meta[sys.exportovano]=new Date().toISOString();
meta[sys.nastroj]='DKM';
meta[sys.verzeFormatu]=JSON_FORMAT_VERSION;
const pocty={};
data['_meta']=meta;
plan.types.forEach(grp=>{
data[grp.key]=grp.ents.map(e=>jsonEntityObj(e,grp,plan,cfg,warn,false));
pocty[grp.key]=grp.ents.length;
});
meta[sys.pocty]=pocty;
if(warn.dangling)plan.warnings.push(t('jsonWarnDangling',{n:warn.dangling}));
if(warn.nan)plan.warnings.push(t('jsonWarnNaN',{n:warn.nan}));
return data;
}

/* ---------- Schéma ---------- */

function jsonPropSchema(p,plan,cfg,grp){
const a=p.attr;const sys=plan.sys;
const base={};
if(a.name)base.title=a.name;
if(p.source==='aspect')base['x-dkm-aspekt']=plan.gk.aspects.get(p.aspect.id);
switch(a.type){
case'yesno':return Object.assign(base,{type:'boolean'});
case'number':return Object.assign(base,{type:'number'});
case'date':{
const s=Object.assign(base,{type:'string'});
if(jsonAllValuesMatch(p,grp,v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v))))s.format='date';
return s;
}
case'url':{
const s=Object.assign(base,{type:'string'});
if(jsonAllValuesMatch(p,grp,v=>/^[a-z][a-z0-9+.-]*:/i.test(String(v))))s.format='uri';
return s;
}
case'select':{
const s=Object.assign(base,{type:'string'});
const allowed=attrSelectValues(a);
const actual=[];
grp.ents.forEach(e=>{const v=e.attributes&&e.attributes[a.id];if(!jsonIsEmpty(v)&&actual.indexOf(String(v))<0)actual.push(String(v))});
const extra=actual.filter(v=>allowed.indexOf(v)<0);
if(extra.length)plan.warnings.push(t('jsonWarnEnumExtra',{atribut:a.name,hodnoty:extra.join(', ')}));
const en=allowed.concat(extra);
if(en.length)s.enum=en;
return s;
}
case'relation':{
const items=cfg.relMode==='id'?{type:'string'}:(cfg.relMode==='embed'?jsonEmbedItemsSchema(plan):{$ref:'#/$defs/_odkaz'});
return Object.assign(base,{type:'array',items:items});
}
case'tags':{
/* Výčet drží soustava tagů; co je navíc v datech, se přidá, ať schéma sedí. */
const dovolene=attrTagValues(a);
const skutecne=[];
grp.ents.forEach(e=>tagValueArr(e.attributes&&e.attributes[a.id]).forEach(x=>{if(skutecne.indexOf(x)<0)skutecne.push(x)}));
const navic=skutecne.filter(x=>dovolene.indexOf(x)<0);
if(navic.length)plan.warnings.push(t('jsonWarnEnumExtra',{atribut:a.name,hodnoty:navic.join(', ')}));
const en=dovolene.concat(navic);
const it={type:'string'};if(en.length)it.enum=en;
return Object.assign(base,{type:'array',items:it,uniqueItems:true});
}
default:return Object.assign(base,{type:'string'});
}
}
function jsonAllValuesMatch(p,grp,fn){
let any=false;
for(const e of grp.ents){
const v=e.attributes&&e.attributes[p.attr.id];
if(jsonIsEmpty(v))continue;
any=true;
if(!fn(v))return false;
}
return any;
}
function jsonEmbedItemsSchema(plan){
/* Cíl vazby nemusí být v exportu (jiný typ, archiv) — pak se vypíše jako prostý odkaz. */
const refs=plan.types.map(g=>({$ref:'#/$defs/'+g.key+'__vnorene'}));
refs.push({$ref:'#/$defs/_odkaz'});
return{anyOf:refs};
}
function jsonTypeDef(grp,plan,cfg,embedded){
const sys=plan.sys;
const props={};const required=[sys.id,sys.nazev];
props[sys.id]={type:'string'};
if(grp.ty){props[sys.typ]={type:'string',const:grp.key};required.push(sys.typ)}
props[sys.nazev]={type:'string'};
grp.props.forEach(p=>{
if(embedded&&p.attr.type==='relation')return;
const ps=jsonPropSchema(p,plan,cfg,grp);
if(cfg.includeEmpty&&!embedded)props[p.key]={anyOf:[ps,{type:'null'}]};
else props[p.key]=ps;
/* Povinné jen tehdy, když je atribut vyplněný u všech exportovaných entit tohoto typu —
   jinak by schéma neprošlo nad vlastními daty. */
if(p.attr.required&&!embedded){
if(p.allFilled&&!cfg.includeEmpty)required.push(p.key);
else plan.warnings.push(t('jsonWarnRequired',{atribut:p.attr.name,typ:grp.ty?grp.ty.name:t('jsonUntyped')}));
}
});
if(!embedded){
if(grp.aspects.length)props[sys.aspekty]={type:'array',items:{type:'string',enum:grp.aspects.map(a=>plan.gk.aspects.get(a.id))}};
if(grp.rels.length){
const rp={};
grp.rels.forEach(r=>{
const items=cfg.relMode==='id'?{type:'string'}:(cfg.relMode==='embed'?jsonEmbedItemsSchema(plan):{$ref:'#/$defs/_odkaz'});
rp[r.key]={title:r.rt.name,type:'array',items:items};
});
props[sys.vazby]={type:'object',properties:rp,additionalProperties:false};
}
if(cfg.includeCustom)props[sys.vlastni]={type:'object',additionalProperties:true};
if(cfg.includeComments)props[sys.komentare]={type:'array',items:{$ref:'#/$defs/_komentar'}};
if(cfg.includeObjects)props[sys.objekty]={type:'array',items:{$ref:'#/$defs/_objekt'}};
props[sys.inbox]={type:'boolean'};
props[sys.archiv]={type:'boolean'};
props[sys.vytvoreno]={type:'string'};
props[sys.zmeneno]={type:'string'};
}
const def={type:'object',properties:props,required:required,additionalProperties:false};
if(grp.ty)def.title=grp.ty.name;
return def;
}
function buildJsonSchema(plan,cfg){
const sys=plan.sys;
const defs={};
plan.types.forEach(grp=>{defs[grp.key]=jsonTypeDef(grp,plan,cfg,false)});
if(cfg.relMode==='embed')plan.types.forEach(grp=>{defs[grp.key+'__vnorene']=jsonTypeDef(grp,plan,cfg,true)});
if(cfg.relMode==='ref'||cfg.relMode==='embed'){
const rp={};rp[sys.ref]={type:'string'};rp[sys.typ]={type:'string'};rp[sys.nazev]={type:'string'};
defs['_odkaz']={title:t('jsonDefRef'),type:'object',properties:rp,required:[sys.ref],additionalProperties:false};
}
if(cfg.includeComments){const cp={};cp[sys.autor]={type:'string'};cp[sys.text]={type:'string'};cp[sys.vytvoreno]={type:'string'};
defs['_komentar']={type:'object',properties:cp,additionalProperties:false}}
if(cfg.includeObjects){const op={};op[sys.nazev]={type:'string'};op[sys.obsah]={type:'string'};
defs['_objekt']={type:'object',properties:op,additionalProperties:false}}
const mp={};
mp[sys.projekt]={type:'string'};mp[sys.exportovano]={type:'string'};mp[sys.nastroj]={type:'string'};
mp[sys.verzeFormatu]={type:'number'};
const pc={};plan.types.forEach(grp=>{pc[grp.key]={type:'number'}});
mp[sys.pocty]={type:'object',properties:pc,additionalProperties:false};
const props={'$schema':{type:'string'},'_meta':{type:'object',properties:mp,additionalProperties:false}};
plan.types.forEach(grp=>{props[grp.key]={type:'array',items:{$ref:'#/$defs/'+grp.key}}});
return{'$schema':'https://json-schema.org/draft/2020-12/schema','$id':'schema.json',
title:(state.data.projectName||'DKM')+' — '+t('jsonSchemaTitle'),
type:'object',properties:props,required:plan.types.map(g=>g.key),additionalProperties:false,'$defs':defs};
}

/* ============================================================
   XML + XSD
   XML se nestaví z entit, ale z už hotového (a zvalidovaného)
   JSON objektu, a prochází se podle téhož schématu, ze kterého
   se generuje XSD. Pořadí prvků i omezení proto sedí z principu.
   Pravidla převodu:
     objekt   → prvek s podprvky (v pořadí podle schématu)
     pole     → prvek se stejným názvem se opakuje
     skalár   → textový obsah
     null     → xsi:nil="true"
     $schema  → zahazuje se, nahradí ho noNamespaceSchemaLocation
     vlastní atributy → vždy <polozka klic="…">, protože jejich
       názvy si píše uživatel a nemusí být platné XML jméno
   ============================================================ */

const XML_ROOT='data';

function xmlName(k){return /^[A-Za-z_][\w.-]*$/.test(k)?k:null}

function buildXmlData(data,schema,plan,cfg){
const L=['<?xml version="1.0" encoding="UTF-8"?>'];
L.push('<'+XML_ROOT+' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="schema.xsd">');
const resolve=s=>{
if(!s)return{};
if(s.$ref){const m=/^#\/\$defs\/(.+)$/.exec(s.$ref);return(m&&schema.$defs&&schema.$defs[m[1]])||{}}
if(s.anyOf){const nonNull=s.anyOf.filter(x=>x.type!=='null');return nonNull.length===1?resolve(nonNull[0]):{}}
return s;
};
function emit(name,value,sch,pad){
if(value===undefined)return;
const s=resolve(sch);
if(Array.isArray(value)){
const item=s.items||{};
value.forEach(v=>emit(name,v,item,pad));
return;
}
if(value===null){L.push(pad+'<'+name+' xsi:nil="true"/>');return}
if(value&&typeof value==='object'){
const keys=objKeys(value,s);
if(!keys.length){L.push(pad+'<'+name+'/>');return}
L.push(pad+'<'+name+'>');
/* Otevřený objekt (vlastní atributy) — názvy píše uživatel, vždy <polozka klic>. */
const open=s.additionalProperties===true;
keys.forEach(k=>{
const child=(s.properties&&s.properties[k])||{};
const nm=open?null:xmlName(k);
if(nm)emit(nm,value[k],child,pad+'  ');
else emitPolozka(k,value[k],child,pad+'  ');
});
L.push(pad+'</'+name+'>');
return;
}
L.push(pad+'<'+name+'>'+xmlEsc(xmlScalar(value))+'</'+name+'>');
}
function emitPolozka(key,value,sch,pad){
L.push(pad+'<polozka klic="'+xmlEsc(key)+'">'+xmlEsc(xmlScalar(value))+'</polozka>');
}
/* Pořadí bere ze schématu; co ve schématu není, jde nakonec. */
function objKeys(value,s){
const props=(s&&s.properties)?Object.keys(s.properties):[];
const own=Object.keys(value);
const out=props.filter(k=>own.indexOf(k)>=0);
own.forEach(k=>{if(out.indexOf(k)<0)out.push(k)});
return out;
}
const rootProps=schema.properties||{};
Object.keys(rootProps).forEach(k=>{
if(k==='$schema')return;
if(!(k in data))return;
emit(k,data[k],rootProps[k],'  ');
});
L.push('</'+XML_ROOT+'>');
return L.join('\n')+'\n';
}
function xmlScalar(v){
if(v===true)return'true';
if(v===false)return'false';
return String(v);
}

/* ---------- XSD k témuž schématu ---------- */

function xsdType(s){
if(!s)return'xs:string';
if(s.type==='boolean')return'xs:boolean';
if(s.type==='number')return'xs:decimal';
if(s.format==='date')return'xs:date';
if(s.format==='uri')return'xs:anyURI';
return'xs:string';
}
function buildXsd(schema,plan,cfg){
const L=['<?xml version="1.0" encoding="UTF-8"?>'];
L.push('<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema" elementFormDefault="qualified">');
if(schema.title)L.push('  <xs:annotation><xs:documentation>'+xmlEsc(schema.title)+'</xs:documentation></xs:annotation>');
const named={};/* $defs → pojmenované komplexní typy */
const sys=plan.sys;

function elemFor(name,s,indent,extra){
const pad=indent;
const opts=extra||{};
const max=opts.array?' maxOccurs="unbounded"':'';
/* Pole se v XML pozná jen opakováním prvku — prázdné nevypíše nic, proto vždy volitelné. */
const min=(opts.required&&!opts.array)?'':' minOccurs="0"';
const nil=opts.nillable?' nillable="true"':'';
if(s&&s.$ref){
const m=/^#\/\$defs\/(.+)$/.exec(s.$ref);
if(m)return[pad+'<xs:element name="'+name+'" type="'+m[1]+'"'+min+max+nil+'/>'];
}
if(s&&s.anyOf){
const nonNull=s.anyOf.filter(x=>x.type!=='null');
if(nonNull.length===1)return elemFor(name,nonNull[0],indent,Object.assign({},opts,{nillable:true}));
/* Vnořené cíle vazeb — tvar se liší podle typu, XSD to nechává otevřené. */
return[pad+'<xs:element name="'+name+'" type="xs:anyType"'+min+max+nil+'/>'];
}
if(s&&s.type==='array')return elemFor(name,s.items||{},indent,Object.assign({},opts,{array:true}));
if(s&&s.type==='object'){
if(s.additionalProperties===true)return polozkaElem(name,pad,min,max);
const out=[pad+'<xs:element name="'+name+'"'+min+max+nil+'>'];
out.push(pad+'  <xs:complexType>');
out.push.apply(out,seqFor(s,pad+'    '));
out.push(pad+'  </xs:complexType>');
out.push(pad+'</xs:element>');
return out;
}
if(s&&s.enum&&s.enum.length){
const out=[pad+'<xs:element name="'+name+'"'+min+max+nil+'>'];
out.push(pad+'  <xs:simpleType><xs:restriction base="'+xsdType(s)+'">');
s.enum.forEach(v=>out.push(pad+'    <xs:enumeration value="'+xmlEsc(v)+'"/>'));
out.push(pad+'  </xs:restriction></xs:simpleType>');
out.push(pad+'</xs:element>');
return out;
}
const fixed=(s&&typeof s.const==='string')?' fixed="'+xmlEsc(s.const)+'"':'';
return[pad+'<xs:element name="'+name+'" type="'+xsdType(s)+'"'+min+max+nil+fixed+'/>'];
}
/* Otevřený objekt (vlastní atributy, počty) — dvojice klíč/hodnota. */
function polozkaElem(name,pad,min,max){
return[pad+'<xs:element name="'+name+'"'+min+max+'>',
pad+'  <xs:complexType><xs:sequence>',
pad+'    <xs:element name="polozka" minOccurs="0" maxOccurs="unbounded">',
pad+'      <xs:complexType><xs:simpleContent><xs:extension base="xs:string">',
pad+'        <xs:attribute name="klic" type="xs:string" use="required"/>',
pad+'      </xs:extension></xs:simpleContent></xs:complexType>',
pad+'    </xs:element>',
pad+'  </xs:sequence></xs:complexType>',
pad+'</xs:element>'];
}
function seqFor(s,pad){
const out=[pad+'<xs:sequence>'];
const props=s.properties||{};
const req=s.required||[];
Object.keys(props).forEach(k=>{
if(k==='$schema')return;
const nm=xmlName(k);
if(!nm)return;
out.push.apply(out,elemFor(nm,props[k],pad+'  ',{required:req.indexOf(k)>=0}));
});
out.push(pad+'</xs:sequence>');
return out;
}
/* Kořen */
L.push('  <xs:element name="'+XML_ROOT+'">');
L.push('    <xs:complexType>');
L.push.apply(L,seqFor({properties:schema.properties,required:schema.required||[]},'      '));
L.push('    </xs:complexType>');
L.push('  </xs:element>');
/* Pojmenované typy z $defs */
Object.keys(schema.$defs||{}).forEach(k=>{
const d=schema.$defs[k];
L.push('  <xs:complexType name="'+k+'">');
L.push.apply(L,seqFor(d,'    '));
L.push('  </xs:complexType>');
});
L.push('</xs:schema>');
return L.join('\n')+'\n';
}

/* ---------- Validátor (podmnožina draftu 2020-12, přesně to, co generujeme) ---------- */

function jsonValidate(data,schema){
const errs=[];
const root=schema;
function res(s){
if(s&&s.$ref){
const m=/^#\/\$defs\/(.+)$/.exec(s.$ref);
if(m&&root.$defs&&root.$defs[m[1]])return root.$defs[m[1]];
return{};
}
return s||{};
}
function walk(v,s,path){
if(errs.length>=50)return;
s=res(s);
if(s.anyOf){
for(const alt of s.anyOf){const sub=[];if(check(v,alt,path,sub))return;}
errs.push({path:path,msg:'neodpovídá žádné z variant (anyOf)'});return;
}
if(s.type){
const ok=s.type==='array'?Array.isArray(v):
s.type==='object'?(v&&typeof v==='object'&&!Array.isArray(v)):
s.type==='null'?v===null:
s.type==='number'?typeof v==='number':
s.type==='boolean'?typeof v==='boolean':typeof v===s.type;
if(!ok){errs.push({path:path,msg:'očekáván typ '+s.type});return}
}
if(s.const!==undefined&&v!==s.const)errs.push({path:path,msg:'očekávána hodnota '+JSON.stringify(s.const)});
if(s.enum&&s.enum.indexOf(v)<0)errs.push({path:path,msg:'hodnota mimo enum: '+JSON.stringify(v)});
if(Array.isArray(v)&&s.items)v.forEach((it,i)=>walk(it,s.items,path+'['+i+']'));
if(v&&typeof v==='object'&&!Array.isArray(v)){
(s.required||[]).forEach(r=>{if(!(r in v))errs.push({path:path,msg:'chybí povinné pole '+r})});
Object.keys(v).forEach(k=>{
const ps=s.properties&&s.properties[k];
if(ps)walk(v[k],ps,path+'.'+k);
else if(s.additionalProperties===false)errs.push({path:path,msg:'pole navíc: '+k});
else if(s.additionalProperties&&typeof s.additionalProperties==='object')walk(v[k],s.additionalProperties,path+'.'+k);
});
}
}
/* Tichá varianta pro anyOf — vrací jen ano/ne. */
function check(v,s,path,sink){
const save=errs.splice(0,errs.length);
walk(v,s,path);
const bad=errs.length>0;
errs.splice(0,errs.length);
save.forEach(x=>errs.push(x));
return !bad;
}
walk(data,root,'$');
return errs;
}

/* ---------- Doprovodné soubory ---------- */

function buildJsonMapping(plan,cfg){
const typy={},atributy={},aspekty={},vazby={};
plan.types.forEach(grp=>{
if(grp.ty)typy[grp.ty.id]={klic:grp.key,nazev:grp.ty.name};
grp.props.forEach(p=>{atributy[p.attr.id]={klic:p.key,nazev:p.attr.name,typ:p.attr.type,zdroj:p.source,zdrojId:p.source==='aspect'?p.aspect.id:(grp.ty?grp.ty.id:null)}});
grp.aspects.forEach(a=>{aspekty[a.id]={klic:plan.gk.aspects.get(a.id),nazev:a.name}});
grp.rels.forEach(r=>{vazby[r.rt.id]={klic:r.key,nazev:r.rt.name}});
});
return{verzeFormatu:JSON_FORMAT_VERSION,stylKlicu:cfg.keyStyle,jazykSystemovychPoli:cfg.sysLang,
rezimVazeb:cfg.relMode,typy:typy,atributy:atributy,aspekty:aspekty,vazby:vazby};
}
function buildJsonReadme(plan,cfg,errs){
const L=[];
L.push('# '+(state.data.projectName||'DKM')+' — '+t('jsonReadmeTitle'));
L.push('');
L.push(t('jsonReadmeIntro'));
L.push('');
L.push('- '+t('jsonReadmeExported')+': '+new Date().toLocaleString(state.language));
L.push('- '+t('jsonReadmeCount')+': '+plan.types.reduce((a,g)=>a+g.ents.length,0));
L.push('- '+t('jsonKeyStyle')+': '+cfg.keyStyle);
L.push('- '+t('jsonRelMode')+': '+t(cfg.relMode==='id'?'jsonRelModeId':cfg.relMode==='embed'?'jsonRelModeEmbed':'jsonRelModeRef'));
L.push('- '+t('jsonValidation')+': '+(errs.length?t('jsonValidFail',{n:errs.length}):t('jsonValidOk')));
L.push('');
plan.types.forEach(grp=>{
L.push('## `'+grp.key+'` — '+(grp.ty?grp.ty.name:t('jsonUntyped'))+' ('+grp.ents.length+')');
L.push('');
L.push('| '+t('jsonKeyCol')+' | '+t('jsonNameCol')+' | '+t('attrType')+' | '+t('jsonSourceCol')+' |');
L.push('|---|---|---|---|');
grp.props.forEach(p=>{
L.push('| `'+p.key+'` | '+p.attr.name+' | '+t(ATYPE_LBL[p.attr.type]||'attrTypeText')+' | '+(p.source==='aspect'?'◎ '+p.aspect.name:(grp.ty?grp.ty.name:'—'))+' |');
});
if(grp.rels.length){
L.push('');
L.push(t('jsonReadmeRels')+': '+grp.rels.map(r=>'`'+r.key+'` ('+r.rt.name+')').join(', '));
}
L.push('');
});
if(plan.warnings.length){
L.push('## '+t('jsonWarnings'));
L.push('');
plan.warnings.forEach(w=>L.push('- '+w));
L.push('');
}
if(errs.length){
L.push('## '+t('jsonValidation'));
L.push('');
errs.slice(0,20).forEach(e=>L.push('- `'+e.path+'` — '+e.msg));
L.push('');
}
return L.join('\n');
}

/* ---------- Kompletní běh ---------- */

function runJsonExport(cfg,preset){
const plan=buildJsonPlan(cfg,preset);
const data=buildJsonData(plan,cfg);
const schema=buildJsonSchema(plan,cfg);
const errs=jsonValidate(data,schema);
plan.warnings=plan.warnings.filter((w,i,arr)=>arr.indexOf(w)===i);
const mapping=buildJsonMapping(plan,cfg);
const readme=buildJsonReadme(plan,cfg,errs);
const wantXml=cfg.format==='xml'||cfg.format==='both';
const xml=wantXml?buildXmlData(data,schema,plan,cfg):null;
const xsd=wantXml?buildXsd(schema,plan,cfg):null;
return{plan:plan,data:data,schema:schema,mapping:mapping,readme:readme,errors:errs,xml:xml,xsd:xsd};
}
/* Volitelné uložení odvozených klíčů do modelu, aby byl příští export stabilní. */
function persistJsonKeys(plan,cfg){
let n=0;
plan.types.forEach(grp=>{
if(grp.ty&&grp.ty.jsonKey!==grp.key){grp.ty.jsonKey=grp.key;n++}
grp.props.forEach(p=>{if(p.attr.jsonKey!==p.key){p.attr.jsonKey=p.key;n++}});
grp.aspects.forEach(a=>{const k=plan.gk.aspects.get(a.id);if(a.jsonKey!==k){a.jsonKey=k;n++}});
grp.rels.forEach(r=>{if(r.rt.jsonKey!==r.key){r.rt.jsonKey=r.key;n++}});
});
if(n)setDirty(true);
return n;
}
function downloadJsonExportZip(res,cfg){
const files=[];
const data=res.data;
if(cfg.format==='xml'){
/* Jen XML — JSON Schema zůstává, popisuje tentýž obsah a hodí se ke kontrole. */
}else if(cfg.splitFiles){
const head={};head['$schema']='schema.json';head['_meta']=data['_meta'];
files.push({name:'data.json',data:JSON.stringify(head,null,2)});
res.plan.types.forEach(grp=>files.push({name:'data/'+grp.key+'.json',data:JSON.stringify(data[grp.key],null,2)}));
}else{
files.push({name:'data.json',data:JSON.stringify(data,null,2)});
}
files.push({name:'schema.json',data:JSON.stringify(res.schema,null,2)});
if(res.xml){files.push({name:'data.xml',data:res.xml});files.push({name:'schema.xsd',data:res.xsd})}
files.push({name:'mapovani.json',data:JSON.stringify(res.mapping,null,2)});
files.push({name:'README.md',data:res.readme});
const zip=makeZip(files);
const blob=new Blob([zip],{type:'application/zip'});
const u=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=u;
a.download=safeFilename(state.data.projectName||'dkm')+'-json-'+new Date().toISOString().slice(0,10)+'.zip';
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
}
