function getPanelSnapshot(){
return{
view:JSON.parse(JSON.stringify(state.view)),
filters:JSON.parse(JSON.stringify(state.filters))
};
}
function applyPanelSnapshot(snap){
state.view=JSON.parse(JSON.stringify(snap.view));
state.filters=JSON.parse(JSON.stringify(snap.filters));
}
function ensurePanels(){
if(!Array.isArray(state.panels)||!state.panels.length){state.panels=[getPanelSnapshot()];state.activePanel=0}
if(state.activePanel<0||state.activePanel>=state.panels.length)state.activePanel=0;
}
function syncActivePanel(){
if(!Array.isArray(state.panels)||!state.panels.length)return;
state.panels[state.activePanel]=getPanelSnapshot();
}
function panelLabel(snap){
const v=snap.view;
if(v.name==='detail'&&v.entityId){const e=findEntity(v.entityId);return e?(getTitle(e)||'?'):'?'}
if(v.name==='edit'&&v.entityId){const e=findEntity(v.entityId);return '✎ '+(e?getTitle(e):'?')}
if(v.name==='new')return '＋ '+t('cmdNewEntity');
if(v.name==='settings')return '⚙ '+t('btnSettings');
if(v.name==='allComments')return '💬 '+t('viewAllComments');
if(v.name==='list'){
if(v.tab==='inbox')return '📥 '+t('tabInbox');
if(v.tab==='all')return t('tabAll');
if(v.tab==='archive')return '📦 '+t('tabArchive');
if(typeof v.tab==='string'&&v.tab.indexOf('aspect:')===0){const asp=findAspect(v.tab.slice(7));return asp?'◎ '+asp.name:'?'}
const ty=findType(v.tab);return ty?((ty.icon?ty.icon+' ':'')+ty.name):'?';
}
return '?';
}
function panelIcon(snap){
const v=snap.view;
if(v.name==='detail'&&v.entityId){const e=findEntity(v.entityId);if(e&&e.typeId){const ty=findType(e.typeId);return ty?ty.icon||'':''}}
return '';
}
function addPanel(){
ensurePanels();syncActivePanel();
state.panels.push({view:{name:'list',tab:'inbox',entityId:null,settingsTab:'project',settingsItemId:null,edit:null,typeId:null},filters:{search:'',sort:'updated',filterAspect:'',filterType:'',filterUpdated:'',tagFilter:null,attrFilters:[]}});
state.activePanel=state.panels.length-1;
applyPanelSnapshot(state.panels[state.activePanel]);
navigateTo({name:'list',tab:'inbox'});
}
function switchToPanel(idx){
if(!Array.isArray(state.panels))return;
if(idx<0||idx>=state.panels.length)return;
syncActivePanel();
state.activePanel=idx;
applyPanelSnapshot(state.panels[idx]);
navigateTo(state.view);
}
function closePanel(idx){
if(!Array.isArray(state.panels))return;
if(state.panels.length<=1){toast(t('panelCannotCloseLast'));return}
state.panels.splice(idx,1);
if(state.activePanel>=state.panels.length)state.activePanel=state.panels.length-1;
else if(state.activePanel>idx)state.activePanel--;
applyPanelSnapshot(state.panels[state.activePanel]);
navigateTo(state.view);
}
function renderPanelsBar(){
ensurePanels();
if(state.panels.length<=1&&!state.showPanels)return null;/* Hide bar when only 1 panel unless user opened it */
const bar=document.createElement('nav');bar.className='panels-bar';bar.setAttribute('role','tablist');bar.setAttribute('aria-label',t('panelsBar'));
state.panels.forEach((snap,idx)=>{
const tab=document.createElement('div');tab.className='panel-tab'+(idx===state.activePanel?' panel-tab-active':'');tab.setAttribute('role','tab');tab.setAttribute('aria-selected',idx===state.activePanel?'true':'false');tab.tabIndex=idx===state.activePanel?0:-1;
const btn=document.createElement('button');btn.type='button';btn.className='panel-tab-btn';
const ic=panelIcon(snap);if(ic){const s=document.createElement('span');s.setAttribute('aria-hidden','true');s.textContent=ic+' ';btn.appendChild(s)}
const lb=document.createElement('span');lb.className='panel-tab-label';lb.textContent=panelLabel(snap);btn.appendChild(lb);
btn.addEventListener('click',()=>switchToPanel(idx));
tab.appendChild(btn);
if(state.panels.length>1){const x=document.createElement('button');x.type='button';x.className='panel-tab-x';x.textContent='×';x.title=t('panelClose');x.setAttribute('aria-label',t('panelClose')+' '+panelLabel(snap));x.addEventListener('click',ev=>{ev.stopPropagation();closePanel(idx)});tab.appendChild(x)}
bar.appendChild(tab);
});
const add=document.createElement('button');add.type='button';add.className='panel-tab-add';add.textContent='＋';add.title=t('panelAdd');add.setAttribute('aria-label',t('panelAdd'));
add.addEventListener('click',addPanel);
bar.appendChild(add);
return bar;
}

/* Pohled, který jsme právě sestavili a kvůli němuž měníme adresu. Vlastní `hashchange`
   ho jen převezme — kdyby ho skládal znovu z adresy, zahodil by všechno, co v adrese
   není: režim zobrazení, sekce, náhled i vazbu na uložený pohled. */
let _navPohled=null;
function navigateTo(v){
state.view=Object.assign({name:'list',tab:'inbox',entityId:null,settingsTab:'project',settingsItemId:null,edit:null,typeId:null,tabId:null},v);
/* Filtr podle tagu nese adresa, ne pohled — ať je odkaz sdílitelný. */
if(v.tagFilter&&v.tagFilter.tagSetId)state.filters.tagFilter={tagSetId:v.tagFilter.tagSetId,tag:v.tagFilter.tag||''};
delete state.view.tagFilter;
let h='';
if(v.name==='list'){
if(v.tagFilter&&v.tagFilter.tagSetId)h=tagHash(v.tagFilter.tagSetId,v.tagFilter.tag||'');
else if(v.tab==='inbox')h='';
else if(v.tab==='all')h='#all';
else if(v.tab==='archive')h='#archive';
else if(v.tab==='recent')h='#recent';
else if(typeof v.tab==='string'&&v.tab.indexOf('aspect:')===0)h='#aspect/'+v.tab.slice(7);
else if(typeof v.tab==='string'&&v.tab.indexOf('types:')===0)h='#types/'+v.tab.slice(6);
else h='#type/'+v.tab;
}
else if(v.name==='detail')h='#entity/'+v.entityId;
else if(v.name==='allComments')h='#comments';
else if(v.name==='settings'){h='#settings/'+(v.settingsTab||'types');if(v.settingsItemId)h+='/'+v.settingsItemId}
else if(v.name==='edit')h='#entity/'+v.entityId+'/edit';
else if(v.name==='new')h='#new'+(v.typeId?'/'+v.typeId:'');
if(location.hash!==h){_navPohled=state.view;location.hash=h}else render();
}

/* Session-only navigation history: only "landing places" (detail, list, settings), skip edit/new */
if(!state.navHistory)state.navHistory=[];
function pushNav(){
const v=state.view;if(!v)return;
if(v.name==='edit'||v.name==='new')return;
let entry=null;
if(v.name==='detail'&&v.entityId){const e=findEntity(v.entityId);if(!e)return;const ty=e.typeId?findType(e.typeId):null;entry={kind:'entity',id:e.id,label:getTitle(e),icon:ty&&ty.icon?ty.icon:'',typeName:ty?ty.name:'',ts:Date.now()}}
else if(v.name==='list'){
let label=nadpisSeznamu(),icon='';
if(v.tab==='inbox')icon='📥';
else if(v.tab==='archive')icon='📦';
else if(typeof v.tab==='string'&&v.tab.indexOf('aspect:')===0)icon='◎';
else{const ty=findType(v.tab);if(ty)icon=ty.icon||''}
if(state.filters.tagFilter&&state.filters.tagFilter.tagSetId)icon='🏷';
if(v.savedViewId){const sv=findSavedView(v.savedViewId);if(sv)icon=sv.icon||'⭐'}
const zz=aktivniZalozka();if(zz&&zalozkaIkona(zz))icon=zalozkaIkona(zz);
entry={kind:'list',tab:v.tab,savedViewId:v.savedViewId||null,label:label,icon:icon,ts:Date.now()};
}
else if(v.name==='settings'){entry={kind:'settings',settingsTab:v.settingsTab,settingsItemId:v.settingsItemId,label:t('btnSettings')+(v.settingsTab?' · '+t('settings'+v.settingsTab.charAt(0).toUpperCase()+v.settingsTab.slice(1)):''),icon:'⚙',ts:Date.now()}}
if(!entry)return;
const last=state.navHistory[state.navHistory.length-1];
if(last&&last.kind===entry.kind&&last.id===entry.id&&last.tab===entry.tab&&last.savedViewId===entry.savedViewId&&last.settingsTab===entry.settingsTab&&last.settingsItemId===entry.settingsItemId)return;
state.navHistory.push(entry);
if(state.navHistory.length>50)state.navHistory=state.navHistory.slice(-50);
}
function goBackSkipEdits(){
/* Pop until we find a non-current entry */
const cur=state.navHistory[state.navHistory.length-1];
while(state.navHistory.length){
const prev=state.navHistory[state.navHistory.length-2];
if(!prev)break;
if(prev.kind===cur.kind&&prev.id===cur.id&&prev.tab===cur.tab&&prev.savedViewId===cur.savedViewId&&prev.settingsTab===cur.settingsTab){state.navHistory.pop();continue}
state.navHistory.pop();
applyNavEntry(prev);
return;
}
navigateTo({name:'list',tab:'inbox'});
}
function applyNavEntry(entry){
if(!entry)return;
if(entry.kind==='entity')navigateTo({name:'detail',entityId:entry.id});

function parseHash(){
const h=location.hash.replace(/^#/,'');
if(!h)return{name:'list',tab:'inbox'};
const p=h.split('/');
if(p[0]==='all')return{name:'list',tab:'all'};
if(p[0]==='archive')return{name:'list',tab:'archive'};
if(p[0]==='recent')return{name:'list',tab:'recent',recentLimit:Number(p[1])>0?Number(p[1]):RECENT_VYCHOZI};
if(p[0]==='comments')return{name:'allComments'};
if(p[0]==='type'&&p[1])return{name:'list',tab:p[1]};
if(p[0]==='types'&&p[1])return{name:'list',tab:'types:'+decodeURIComponent(p[1])};
if(p[0]==='aspect'&&p[1])return{name:'list',tab:'aspect:'+p[1]};
if(p[0]==='tag'&&p[1]){state.filters.tagFilter={tagSetId:decodeURIComponent(p[1]),tag:p[2]!=null?decodeURIComponent(p[2]):''};return{name:'list',tab:'all'}}
if(p[0]==='entity'&&p[1]){if(p[2]==='edit')return{name:'edit',entityId:p[1]};return{name:'detail',entityId:p[1]}}
if(p[0]==='settings')return{name:'settings',settingsTab:p[1]||'types',settingsItemId:p[2]||null};
if(p[0]==='new')return{name:'new',typeId:p[1]||null};
return{name:'list',tab:'inbox'};
}
window.addEventListener('hashchange',()=>{
if(_navPohled){state.view=_navPohled;_navPohled=null;render();return}
state.view=Object.assign({name:'list',tab:'inbox',entityId:null,settingsTab:'types',settingsItemId:null,edit:null,typeId:null},parseHash());render();
});

/* TABS */
/* =============================================================
   ZÁLOŽKY
   Lišta nahoře je obyčejný seznam položek v `settings.tabs`. Každá říká
   jen dvě věci: co ukazuje (`kind` + cíl) a jak se jmenuje. Inbox, Vše
   i Archiv jsou taky jen položky — nic v liště není napevno.

   Že se dá lišta takhle uvolnit, stojí na paletě příkazů (Ctrl+Shift+P, F1): ta
   dosáhne na každý typ, aspekt, pohled i entitu bez ohledu na záložky,
   takže se nikdo nezamkne ven.

   Druhy a jejich chování popisuje dokumentace, kap. 29.8.
   ============================================================= */
const ZALOZKA_DRUHY=['inbox','all','archive','recent','type','aspect','tag','view','entity','comments','new','sep'];
const ZALOZKA_DRUH_LBL={inbox:'tabKindInbox',all:'tabKindAll',archive:'tabKindArchive',recent:'tabKindRecent',type:'tabKindType',
aspect:'tabKindAspect',tag:'tabKindTag',view:'tabKindView',entity:'tabKindEntity',
comments:'tabKindComments',new:'tabKindNew',sep:'tabKindSep'};

/* Kolik položek ukazuje „Naposledy změněné", když si záložka neřekne jinak. */
const RECENT_VYCHOZI=30;
function zalozky(){const z=state.data.settings&&state.data.settings.tabs;return Array.isArray(z)?z:[]}
/* S čím začíná nový projekt: Inbox, Vše a Archiv, který se schová, dokud je prázdný. */
function zakladniZalozky(){return[novaZalozka('inbox'),novaZalozka('all'),novaZalozka('archive',{hideEmpty:true})]}
function najdiZalozku(id){return zalozky().find(z=>z.id===id)}
/* Uložený pohled se do lišty připíná i mimo nastavení — je to jediné místo,
   kde to má smysl, protože pohled si člověk zrovna vyrobil. */
function zalozkaPohledu(viewId){return zalozky().find(z=>z.kind==='view'&&z.viewId===viewId)}
function prepniZalozkuPohledu(viewId,zapnout){
state.data.settings.tabs=zalozky();
const je=zalozkaPohledu(viewId);
if(zapnout&&!je)state.data.settings.tabs.push(novaZalozka('view',{viewId:viewId}));
else if(!zapnout&&je)state.data.settings.tabs=state.data.settings.tabs.filter(z=>z!==je);
setDirty(true);
}

/* Jedna položka lišty v kanonickém tvaru. */
function novaZalozka(kind,extra){
return Object.assign({id:uid('z'),kind:kind,name:'',icon:'',showCount:kind==='view'?false:true,hideEmpty:false},extra||{});
}
function normalizujZalozku(z){
if(!z||typeof z!=='object')return null;
const kind=ZALOZKA_DRUHY.indexOf(z.kind)>=0?z.kind:null;
if(!kind)return null;
const o=novaZalozka(kind);
o.id=typeof z.id==='string'&&z.id?z.id:o.id;
o.name=typeof z.name==='string'?z.name:'';
o.icon=typeof z.icon==='string'?z.icon:'';
o.showCount=z.showCount!==false&&!(kind==='view'&&z.showCount!==true);
o.hideEmpty=!!z.hideEmpty;
if(z.isDefault)o.isDefault=true;
if(kind==='type')o.typeIds=Array.isArray(z.typeIds)?z.typeIds.filter(x=>typeof x==='string'):(typeof z.typeId==='string'?[z.typeId]:[]);
if(kind==='aspect')o.aspectId=z.aspectId||'';
if(kind==='tag'){o.tagSetId=z.tagSetId||'';o.tag=typeof z.tag==='string'?z.tag:''}
if(kind==='view')o.viewId=z.viewId||'';
if(kind==='entity')o.entityId=z.entityId||'';
if(kind==='new')o.typeId=z.typeId||'';
if(kind==='recent'){const n=Number(z.limit);o.limit=isFinite(n)&&n>0?Math.min(Math.round(n),500):RECENT_VYCHOZI}
return o;
}

/* Starší data měla zaškrtávátka typů a aspektů a „připnuté" pohledy. Lišta se
   z nich složí přesně v pořadí, v jakém byla dosud — uživatel změnu nepozná,
   jen ji teď může přerovnat. Zastaralé klíče se přitom z dat zahodí. */
function migrujZalozky(st,d){
/* Čte se ze vstupních dat, ne ze sloučeného nastavení — prázdný projekt má
   základní lištu už z `emptyData` a ta by starší klíče přebila. */
const vstup=(d&&d.settings)?d.settings:{};
delete st.visibleTypeTabs;delete st.visibleAspectTabs;
if(Array.isArray(vstup.tabs))return vstup.tabs.map(normalizujZalozku).filter(Boolean);
const out=[novaZalozka('inbox'),novaZalozka('all')];
(Array.isArray(vstup.visibleTypeTabs)?vstup.visibleTypeTabs:[]).forEach(id=>out.push(novaZalozka('type',{typeIds:[id]})));
(Array.isArray(vstup.visibleAspectTabs)?vstup.visibleAspectTabs:[]).forEach(id=>out.push(novaZalozka('aspect',{aspectId:id})));
(Array.isArray(d&&d.savedViews)?d.savedViews:[]).forEach(sv=>{if(sv&&sv.pinned)out.push(novaZalozka('view',{viewId:sv.id}))});
out.push(novaZalozka('archive',{hideEmpty:true}));
return out;
}

/* Existuje ještě to, na co záložka ukazuje? */
function zalozkaCilOk(z){
switch(z.kind){
case'type':return (z.typeIds||[]).some(id=>findType(id));
case'aspect':return !!findAspect(z.aspectId);
case'tag':return !!findTagSet(z.tagSetId);
case'view':return !!findSavedView(z.viewId);
case'entity':return !!findEntity(z.entityId);
case'new':return !z.typeId||!!findType(z.typeId);
default:return true;
}
}
/* Typy záložky, které pořád existují — v pořadí, v jakém je uživatel vybral. */
function zalozkaTypy(z){return (z.typeIds||[]).map(findType).filter(Boolean)}

function zalozkaNazev(z){
if(z.name&&String(z.name).trim())return String(z.name).trim();
switch(z.kind){

case'all':return t('tabAll');

case'sep':return '';
case'type':{const ty=zalozkaTypy(z);if(!ty.length)return t('tabBroken');

return t('tabTypesN',{n:ty.length})}

case'tag':{const ts=findTagSet(z.tagSetId);return ts?(z.tag||t('tabBroken')):t('tabBroken')}

}
function zalozkaIkona(z){

switch(z.kind){

case'archive':return '📦';
case'recent':return '🕘';

case'entity':{const e=findEntity(z.entityId);const ty=e&&e.typeId?findType(e.typeId):null;return ty&&ty.icon?ty.icon:'📄'}

/* Popisek druhu i cíle do nastavení („Typ entity: Subjekt + Systém"). */
function zalozkaPopisCile(z){

/* Počet u záložky. `null` = nezobrazovat. U uloženého pohledu se musí projet
   celý filtr, proto je tam počítání dobrovolné. */
function zalozkaPocet(z){
if(z.showCount===false)return null;
const ziva=state.data.entities.filter(e=>!e.archived);
switch(z.kind){
case'inbox':return ziva.filter(e=>e.inInbox).length;
case'all':return ziva.length;
case'archive':return state.data.entities.filter(e=>e.archived).length;
case'type':{const set=new Set((z.typeIds||[]));return ziva.filter(e=>e.typeId&&set.has(e.typeId)&&!e.inInbox).length}
case'aspect':return ziva.filter(e=>(e.aspects||[]).includes(z.aspectId)).length;
case'tag':return ziva.filter(e=>entityHasTag(e,z.tagSetId,z.tag)).length;
case'comments':return state.data.entities.reduce((n,e)=>n+((e.comments||[]).length),0);
case'recent':return null;
case'view':{const sv=findSavedView(z.viewId);return sv?pocetUlozenehoPohledu(sv):null}
default:return null;
}
}
/* Počítá se toutéž cestou jako samotný seznam, ať se počet a obsah nerozejdou. */
function pocetUlozenehoPohledu(sv){
const zF=state.filters,zV=state.view;
try{
state.filters={search:sv.filter.search||'',sort:'updated',filterAspect:sv.filter.filterAspect||'',
filterType:sv.filter.filterType||'',filterUpdated:sv.filter.filterUpdated||'',
tagFilter:sv.filter.tagFilter?JSON.parse(JSON.stringify(sv.filter.tagFilter)):null,
attrFilters:JSON.parse(JSON.stringify(sv.filter.attrFilters||[]))};
state.view=Object.assign({},zV,{name:'list',tab:sv.tab||'all'});
return getList().length;
}catch(e){dbg('Počet uloženého pohledu selhal: '+e.message,true);return null}
finally{state.filters=zF;state.view=zV}
}

/* Ukazuje právě zobrazený pohled totéž co tahle záložka? */
function zalozkaOdpovida(z){
const v=state.view;const f=state.filters.tagFilter;
switch(z.kind){
case'inbox':return v.name==='list'&&v.tab==='inbox';
case'all':return v.name==='list'&&v.tab==='all'&&!v.savedViewId&&!(f&&f.tagSetId);
case'archive':return v.name==='list'&&v.tab==='archive';
case'recent':return v.name==='list'&&v.tab==='recent';
case'comments':return v.name==='allComments';

function ctrlKlavesa(ev,pismeno){

/* LIST */
/* =============================================================
   ADVANCED FILTERS + SAVED VIEWS
   ============================================================= */

/* Return the attribute definition for a rule, or null if invalid */
function resolveRuleAttr(rule){
if(!rule)return null;
if(rule.scope==='system')return{__system:true,key:rule.attrId};
if(rule.scope==='custom')return{__custom:true,name:rule.attrId,type:rule.customType||'text'};
if(rule.scope==='type'){const ty=findType(rule.scopeId);if(!ty)return null;return ty.attributes.find(a=>a.id===rule.attrId)||null}
if(rule.scope==='aspect'){const asp=findAspect(rule.scopeId);if(!asp)return null;return asp.attributes.find(a=>a.id===rule.attrId)||null}
return null;
}

/* Read value from entity per rule scope */
function readRuleValue(entity,rule){
if(rule.scope==='system'){
switch(rule.attrId){
case'name':return getTitle(entity);
case'typeId':return entity.typeId||'';
case'inInbox':return !!entity.inInbox;
case'archived':return !!entity.archived;
case'createdAt':return entity.createdAt||'';
case'updatedAt':return entity.updatedAt||'';
case'aspectsList':return(entity.aspects||[]).slice();
case'relCount':return(entity.relations||[]).length;
case'backlinkCount':return getRelsTo(entity.id).length;
case'hasRelType':return(entity.relations||[]).map(r=>r.relationTypeId);
case'hasRelTo':return(entity.relations||[]).map(r=>r.targetId);
case'hasBacklinkFrom':return getRelsTo(entity.id).map(r=>r.sourceId);
}
return null;
}
if(rule.scope==='custom'){
const ca=(entity.customAttributes||[]).find(a=>(a.name||'').toLowerCase()===String(rule.attrId).toLowerCase());
return ca?ca.value:null;
}
if(rule.scope==='type'||rule.scope==='aspect'){
if(!entity.attributes)return null;
return entity.attributes[rule.attrId];
}
return null;
}

/* Effective datatype of the attribute for operator/UI purposes */
function ruleAttrType(rule){
if(rule.scope==='system'){
switch(rule.attrId){
case'name':return'text';
case'typeId':return'typeRef';
case'inInbox':case'archived':return'yesno';
case'createdAt':case'updatedAt':return'date';
case'aspectsList':return'aspectSet';
case'relCount':case'backlinkCount':return'number';
case'hasRelType':return'relTypeSet';
case'hasRelTo':case'hasBacklinkFrom':return'entitySet';
}
return'text';
}
if(rule.scope==='custom')return rule.customType||'text';
const a=resolveRuleAttr(rule);return a?a.type:null;
}

/* Value coercion helpers */
function _asStr(v){if(v==null)return'';if(Array.isArray(v))return v.join(' ');return String(v)}
function _asNum(v){if(v==null||v==='')return NaN;const n=Number(String(v).replace(',','.'));return n}
function _asDate(v){if(!v)return null;const d=new Date(v);return isNaN(d)?null:d}
function _isEmpty(v){return v==null||v===''||(Array.isArray(v)&&v.length===0)}

/* Evaluate a single rule against an entity. Returns bool. Invalid rule → false. */
function evalRule(entity,rule){
if(!rule||!rule.op)return true;
const def=resolveRuleAttr(rule);if(!def)return false;
const type=ruleAttrType(rule);
const v=readRuleValue(entity,rule);
const rv=rule.value;
const rv2=rule.value2;
switch(rule.op){
case'empty':return _isEmpty(v);
case'notEmpty':return !_isEmpty(v);
case'isTrue':return v===true||v==='true'||v==='1';
case'isFalse':return !(v===true||v==='true'||v==='1');
case'contains':return _asStr(v).toLowerCase().indexOf(_asStr(rv).toLowerCase())>=0;
case'notContains':return _asStr(v).toLowerCase().indexOf(_asStr(rv).toLowerCase())<0;
case'equals':{
if(type==='number'){return _asNum(v)===_asNum(rv)}
if(type==='date'){const a=_asDate(v),b=_asDate(rv);return a&&b&&a.toISOString().slice(0,10)===b.toISOString().slice(0,10)}
return _asStr(v).toLowerCase()===_asStr(rv).toLowerCase();
}
case'notEquals':{
if(type==='number'){return _asNum(v)!==_asNum(rv)}
if(type==='date'){const a=_asDate(v),b=_asDate(rv);if(!a||!b)return true;return a.toISOString().slice(0,10)!==b.toISOString().slice(0,10)}
return _asStr(v).toLowerCase()!==_asStr(rv).toLowerCase();
}
case'startsWith':return _asStr(v).toLowerCase().indexOf(_asStr(rv).toLowerCase())===0;
case'endsWith':{const a=_asStr(v).toLowerCase(),b=_asStr(rv).toLowerCase();return a.length>=b.length&&a.substring(a.length-b.length)===b}
case'regex':{try{const re=new RegExp(_asStr(rv),'i');return re.test(_asStr(v))}catch(e){return false}}
case'greaterThan':{if(type==='date'){const a=_asDate(v),b=_asDate(rv);return a&&b&&a>b}return _asNum(v)>_asNum(rv)}
case'greaterOrEqual':{if(type==='date'){const a=_asDate(v),b=_asDate(rv);return a&&b&&a>=b}return _asNum(v)>=_asNum(rv)}
case'lessThan':{if(type==='date'){const a=_asDate(v),b=_asDate(rv);return a&&b&&a<b}return _asNum(v)<_asNum(rv)}
case'lessOrEqual':{if(type==='date'){const a=_asDate(v),b=_asDate(rv);return a&&b&&a<=b}return _asNum(v)<=_asNum(rv)}
case'between':{if(type==='date'){const a=_asDate(v),b=_asDate(rv),c=_asDate(rv2);return a&&b&&c&&a>=b&&a<=c}const av=_asNum(v),bv=_asNum(rv),cv=_asNum(rv2);return av>=bv&&av<=cv}
case'before':{const a=_asDate(v),b=_asDate(rv);return a&&b&&a<b}
case'after':{const a=_asDate(v),b=_asDate(rv);return a&&b&&a>b}
case'isToday':{const a=_asDate(v);if(!a)return false;const t=new Date();return a.toDateString()===t.toDateString()}
case'isYesterday':{const a=_asDate(v);if(!a)return false;const t=new Date();t.setDate(t.getDate()-1);return a.toDateString()===t.toDateString()}
case'isTomorrow':{const a=_asDate(v);if(!a)return false;const t=new Date();t.setDate(t.getDate()+1);return a.toDateString()===t.toDateString()}
case'isThisWeek':{const a=_asDate(v);if(!a)return false;const now=new Date();const day=now.getDay()||7;const start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-day+1);const end=new Date(start);end.setDate(end.getDate()+7);return a>=start&&a<end}
case'isThisMonth':{const a=_asDate(v);if(!a)return false;const t=new Date();return a.getFullYear()===t.getFullYear()&&a.getMonth()===t.getMonth()}
case'isThisYear':{const a=_asDate(v);if(!a)return false;return a.getFullYear()===new Date().getFullYear()}
case'isPast':{const a=_asDate(v);if(!a)return false;return a.getTime()<Date.now()}
case'isFuture':{const a=_asDate(v);if(!a)return false;return a.getTime()>Date.now()}
case'inLastDays':{const a=_asDate(v);const n=_asNum(rv);if(!a||isNaN(n))return false;const cut=Date.now()-n*86400000;return a.getTime()>=cut&&a.getTime()<=Date.now()}
case'inNextDays':{const a=_asDate(v);const n=_asNum(rv);if(!a||isNaN(n))return false;const cut=Date.now()+n*86400000;return a.getTime()>=Date.now()&&a.getTime()<=cut}
case'olderThanDays':{const a=_asDate(v);const n=_asNum(rv);if(!a||isNaN(n))return false;return a.getTime()<Date.now()-n*86400000}
case'newerThanDays':{const a=_asDate(v);const n=_asNum(rv);if(!a||isNaN(n))return false;return a.getTime()>Date.now()-n*86400000}
/* Relation attribute operators */
case'hasAnyTarget':return !_isEmpty(v);
case'hasNoTarget':return _isEmpty(v);
case'targetIs':{const ids=Array.isArray(v)?v:(v?[v]:[]);return ids.indexOf(rv)>=0}
case'targetIsType':{const ids=Array.isArray(v)?v:(v?[v]:[]);return ids.some(id=>{const ent=findEntity(id);return ent&&ent.typeId===rv})}
case'targetHasAspect':{const ids=Array.isArray(v)?v:(v?[v]:[]);return ids.some(id=>{const ent=findEntity(id);return ent&&(ent.aspects||[]).indexOf(rv)>=0})}
/* Tagové atributy */
case'hasTag':return tagValueArr(v).indexOf(_asStr(rv))>=0;
case'hasNotTag':return tagValueArr(v).indexOf(_asStr(rv))<0;
case'hasAnyTag':return tagValueArr(v).length>0;
case'hasNoTags':return tagValueArr(v).length===0;
/* System: aspect set operators */
case'hasAspect':return Array.isArray(v)&&v.indexOf(rv)>=0;
case'hasNoAspect':return Array.isArray(v)&&v.indexOf(rv)<0;
case'hasAllAspects':{const need=Array.isArray(rv)?rv:[rv];return need.every(x=>Array.isArray(v)&&v.indexOf(x)>=0)}
case'hasAnyOfAspects':{const list=Array.isArray(rv)?rv:[rv];return list.some(x=>Array.isArray(v)&&v.indexOf(x)>=0)}
case'hasNoAspects':return Array.isArray(v)&&v.length===0;
/* System: type set operators */
case'in':{const list=Array.isArray(rv)?rv:[rv];return list.indexOf(v)>=0}
case'notIn':{const list=Array.isArray(rv)?rv:[rv];return list.indexOf(v)<0}
/* System: relation type set */
case'hasRelationType':return Array.isArray(v)&&v.indexOf(rv)>=0;
case'hasNoRelationType':return Array.isArray(v)&&v.indexOf(rv)<0;
}
return true;
}

/* Apply all rules AND-combined */
function applyAttrFilters(list,rules){
if(!rules||!rules.length)return list;
return list.filter(e=>rules.every(r=>evalRule(e,r)));
}

/* List of available operators per data type */
function opsForType(type){
if(type==='text'||type==='textarea'||type==='url')return['contains','notContains','equals','notEquals','startsWith','endsWith','regex','empty','notEmpty'];
if(type==='select')return['equals','notEquals','in','notIn','empty','notEmpty'];
if(type==='number')return['equals','notEquals','greaterThan','greaterOrEqual','lessThan','lessOrEqual','between','empty','notEmpty'];
if(type==='date')return['equals','notEquals','before','after','between','isToday','isYesterday','isTomorrow','isThisWeek','isThisMonth','isThisYear','isPast','isFuture','inLastDays','inNextDays','olderThanDays','newerThanDays','empty','notEmpty'];
if(type==='yesno')return['isTrue','isFalse','empty'];
if(type==='relation')return['hasAnyTarget','hasNoTarget','targetIs','targetIsType','targetHasAspect'];
if(type==='tags')return['hasTag','hasNotTag','hasAnyTag','hasNoTags'];
if(type==='typeRef')return['equals','notEquals','in','notIn','empty','notEmpty'];
if(type==='aspectSet')return['hasAspect','hasNoAspect','hasAllAspects','hasAnyOfAspects','hasNoAspects'];
if(type==='relTypeSet')return['hasRelationType','hasNoRelationType'];
if(type==='entitySet')return['hasAnyTarget','hasNoTarget','targetIs'];
return['equals','notEquals','empty','notEmpty'];
}

/* Whether operator needs a value input */
function opNeedsValue(op){
const none=['empty','notEmpty','isTrue','isFalse','isToday','isYesterday','isTomorrow','isThisWeek','isThisMonth','isThisYear','isPast','isFuture','hasAnyTarget','hasNoTarget','hasNoAspects','hasAnyTag','hasNoTags'];
return none.indexOf(op)<0;
}
function opNeedsSecondValue(op){return op==='between'}

/* Collect all attributes available across the current data model for the picker */
function collectAllRuleTargets(){
const out=[];
/* system properties first */
[['name','● '+t('sysName'),'text'],['typeId','● '+t('sysType'),'typeRef'],['aspectsList','● '+t('sysAspects'),'aspectSet'],['inInbox','● '+t('tabInbox'),'yesno'],['archived','● '+t('tabArchive'),'yesno'],['createdAt','● '+t('created'),'date'],['updatedAt','● '+t('updated'),'date'],['relCount','● '+t('sysRelCount'),'number'],['backlinkCount','● '+t('sysBacklinkCount'),'number'],['hasRelType','● '+t('sysHasRelType'),'relTypeSet']].forEach(([k,lbl,tp])=>out.push({scope:'system',scopeId:null,attrId:k,label:lbl,type:tp}));
/* Type attributes */
state.data.entityTypes.forEach(ty=>ty.attributes.forEach(a=>out.push({scope:'type',scopeId:ty.id,attrId:a.id,label:ty.name+' / '+a.name,type:a.type})));
/* Aspect attributes */
state.data.aspects.forEach(asp=>asp.attributes.forEach(a=>out.push({scope:'aspect',scopeId:asp.id,attrId:a.id,label:asp.name+' / '+a.name,type:a.type})));
return out;
}

/* Human label for a rule (for the summary strip) */
function labelRule(rule){
const opLbl=t('op_'+rule.op)||rule.op;
let attrLbl;
if(rule.scope==='system'){attrLbl=t('sys_'+rule.attrId)||rule.attrId}
else if(rule.scope==='custom'){attrLbl='* '+rule.attrId}
else{const targets=collectAllRuleTargets();const found=targets.find(x=>x.scope===rule.scope&&x.scopeId===rule.scopeId&&x.attrId===rule.attrId);attrLbl=found?found.label:'?'}
let valLbl='';
if(opNeedsValue(rule.op)){
if(rule.scope==='system'&&rule.attrId==='typeId'){const ty=findType(rule.value);valLbl=ty?ty.name:rule.value}
else if(rule.scope==='system'&&(rule.attrId==='aspectsList')){const asp=findAspect(rule.value);valLbl=asp?asp.name:rule.value}
else if(rule.scope==='system'&&rule.attrId==='hasRelType'){const rt=findRT(rule.value);valLbl=rt?rt.name:rule.value}
else if(rule.op==='targetIs'){const ent=findEntity(rule.value);valLbl=ent?getTitle(ent):rule.value}
else if(rule.op==='targetIsType'){const ty=findType(rule.value);valLbl=ty?ty.name:rule.value}
else if(rule.op==='targetHasAspect'){const asp=findAspect(rule.value);valLbl=asp?asp.name:rule.value}
else valLbl=rule.value==null?'':String(rule.value);
if(opNeedsSecondValue(rule.op))valLbl+=' … '+(rule.value2==null?'':String(rule.value2));
}
const invalid=(rule.scope==='type'||rule.scope==='aspect')&&!resolveRuleAttr(rule);
return{attr:attrLbl,op:opLbl,value:valLbl,invalid:invalid};
}

/* Render the advanced-filter panel (inserted below toolbar when open) */
function renderAdvFilterPanel(){
const box=document.createElement('section');box.className='advfilter';box.setAttribute('aria-label',t('advFilter'));
const title=document.createElement('h3');title.textContent='⚙ '+t('advFilter');title.style.margin='0 0 .5rem';title.style.fontSize='1rem';box.appendChild(title);

/* Přepnutí filtru podle tagu. Vede přes adresu, ať je odkaz sdílitelný
   a ať se stejný filtr nastaví i po načtení stránky. */
function nastavTagFiltr(tagSetId,tag){
if(!tagSetId){
state.filters.tagFilter=null;
if(location.hash.indexOf('#tag/')===0){navigateTo({name:'list',tab:'all'});return}
render();return;
}
const h=tagHash(tagSetId,tag);
if(location.hash===h){state.filters.tagFilter={tagSetId:tagSetId,tag:tag};render()}
else location.hash=h;
}

   END ADVANCED FILTERS
   ============================================================= */

function getList(){
let list=state.data.entities.slice();
if(state.view.tab==='archive'){list=list.filter(e=>e.archived)}
else{
list=list.filter(e=>!e.archived);
if(state.view.tab==='inbox')list=list.filter(e=>e.inInbox);
else if(state.view.tab==='recent'){/* všechno, ořez až po seřazení */}
else if(state.view.tab==='all'){/* all */}
else if(typeof state.view.tab==='string'&&state.view.tab.indexOf('aspect:')===0){
const aid=state.view.tab.slice(7);list=list.filter(e=>(e.aspects||[]).includes(aid));
}
else if(typeof state.view.tab==='string'&&state.view.tab.indexOf('types:')===0){
const set=new Set(state.view.tab.slice(6).split(',').filter(Boolean));
list=list.filter(e=>e.typeId&&set.has(e.typeId)&&!e.inInbox);
}
else list=list.filter(e=>e.typeId===state.view.tab&&!e.inInbox);
}
const q=(state.filters.search||'').toLowerCase().trim();
if(q)list=list.filter(e=>{const hay=[getTitle(e),getSnip(e),...Object.values(e.attributes||{}).map(v=>typeof v==='string'?v:''),...((e.customAttributes||[]).map(a=>(a.name||'')+' '+(typeof a.value==='string'?a.value:''))),...entityTagAttrs(e).map(x=>x.tagy.join(' '))].join(' ').toLowerCase();return hay.includes(q)});
if(state.filters.filterAspect)list=list.filter(e=>(e.aspects||[]).includes(state.filters.filterAspect));
if(state.view.tab==='all'&&state.filters.filterType){
if(state.filters.filterType==='__none__')list=list.filter(e=>!e.typeId);
else list=list.filter(e=>e.typeId===state.filters.filterType);
}
if(state.filters.filterUpdated){
const now=Date.now();const day=86400000;
const todayStart=new Date();todayStart.setHours(0,0,0,0);const todayMs=todayStart.getTime();
list=list.filter(e=>{const u=e.updatedAt?new Date(e.updatedAt).getTime():0;
if(state.filters.filterUpdated==='today')return u>=todayMs;
if(state.filters.filterUpdated==='7d')return(now-u)<=7*day;
if(state.filters.filterUpdated==='30d')return(now-u)<=30*day;
if(state.filters.filterUpdated==='older')return(now-u)>30*day;
return true;
});
}
const tf=state.filters.tagFilter;
if(tf&&tf.tagSetId)list=list.filter(e=>entityHasTag(e,tf.tagSetId,tf.tag));
if(state.filters.attrFilters&&state.filters.attrFilters.length)list=applyAttrFilters(list,state.filters.attrFilters);
const s=state.filters.sort||'updated';
list.sort((a,b)=>{
if(s==='newest')return(b.createdAt||'').localeCompare(a.createdAt||'');
if(s==='oldest')return(a.createdAt||'').localeCompare(b.createdAt||'');
if(s==='updated')return(b.updatedAt||'').localeCompare(a.updatedAt||'');
if(s==='title')return getTitle(a).localeCompare(getTitle(b),state.language);
if(s==='titleDesc')return getTitle(b).localeCompare(getTitle(a),state.language);
return 0;
});
/* „Naposledy změněné" je výřez — ořezává se až nakonec, po filtrech i řazení,
   ať sedí s tím, co je vidět. Kolik toho bylo před ořezem, hlásí `_orezano`. */
if(state.view.tab==='recent'){
const limit=Number(state.view.recentLimit)>0?Number(state.view.recentLimit):RECENT_VYCHOZI;
if(list.length>limit){state.view._orezano=list.length;list=list.slice(0,limit)}
else state.view._orezano=0;
}else state.view._orezano=0;
return list;
}

/* Nadpis nad seznamem. Pojmenovaná záložka vyhrává — kdo si lištu pojmenoval
   po svém, chce to jméno vidět i nad seznamem. */
function nadpisSeznamu(){
const z=aktivniZalozka();
if(z&&z.name&&String(z.name).trim())return String(z.name).trim();
const v=state.view;
if(v.savedViewId){const sv=findSavedView(v.savedViewId);if(sv)return sv.name}
const f=state.filters.tagFilter;
if(f&&f.tagSetId){const ts=findTagSet(f.tagSetId);return (ts?ts.name+' / ':'')+f.tag}
const tb=v.tab;
if(tb==='inbox')return t('tabInbox');
if(tb==='all')return t('tabAll');
if(tb==='archive')return t('tabArchive');
if(tb==='recent')return t('tabKindRecent');
if(typeof tb==='string'&&tb.indexOf('aspect:')===0){const a=findAspect(tb.slice(7));return a?a.name:t('tabAll')}
if(typeof tb==='string'&&tb.indexOf('types:')===0){
const ty=tb.slice(6).split(',').map(findType).filter(Boolean);
return ty.length?ty.map(x=>x.name).join(' + '):t('tabAll');
}
const ty=findType(tb);return ty?ty.name:t('tabAll');
}

/* ============================================================
   TABULKA, SEKCE, KALENDÁŘ, NÁHLED
   Nové způsoby, jak se dívat na tatáž data. Výchozí zůstává seznam.
   Sloupce tabulky bere `tableColumns()` — týž zdroj jako export,
   takže co vidíš v tabulce, to i vyexportuješ.
   V tabulce se needituje; je to pohled, ne formulář.
   ============================================================ */

/* ---------- Tabulka ---------- */

function tableViewCols(list){
const all=tableColumns(list);
const chosen=state.view.tableCols;
if(chosen&&chosen.length){
const map=new Map(all.map(c=>[c.id,c]));
const out=chosen.map(id=>map.get(id)).filter(Boolean);
if(out.length)return{all:all,shown:out};
}
/* Výchozí sada: název, typ a atributy, které jsou u něčeho vyplněné. */
const shown=[];
all.forEach(c=>{if(c.id==='__name'||c.id==='__type')shown.push(c)});
all.forEach(c=>{
if(shown.length>=9)return;
if((c.group.indexOf('type:')===0||c.group.indexOf('aspect:')===0)&&c.filled>0)shown.push(c);
});
const upd=all.find(c=>c.id==='__updated');if(upd)shown.push(upd);
return{all:all,shown:shown};
}

function tableSortList(list,cols){
const s=state.view.tableSort;
if(!s||!s.id)return list;
const col=cols.find(c=>c.id===s.id);
if(!col)return list;
const dir=s.dir==='desc'?-1:1;
const key=e=>{
const v=tableCellValue(e,col);
if(v instanceof Date)return v.getTime();
if(typeof v==='number')return v;
return String(v==null?'':v);
};
return list.slice().sort((a,b)=>{
const x=key(a),y=key(b);
if(typeof x==='number'&&typeof y==='number')return(x-y)*dir;
return String(x).localeCompare(String(y),state.language,{numeric:true})*dir;
});
}

const cols=getColumnValuesForAttr(target);
const bucket=new Map();cols.forEach(c=>bucket.set(c.key,{label:c.label,ents:[]}));
list.forEach(e=>{
const k=entityColumnKey(e,target);
if(!bucket.has(k))bucket.set(k,{label:k==='_none'?t('kanbanColNone'):(target.type==='date'?datumPopis(k):String(k)),ents:[]});
bucket.get(k).ents.push(e);
});
/* U dat nemá přihrádka předem dané pořadí — nejnovější nahoře, bez data dospod. */
let poradi=Array.from(bucket.entries());
if(target.type==='date')poradi.sort((a,b)=>{
if(a[0]==='_none')return 1;if(b[0]==='_none')return-1;
return a[0]<b[0]?1:(a[0]>b[0]?-1:0);
});
state.view.groupOpen=state.view.groupOpen||{};
poradi.forEach(([k,v])=>{
if(!v.ents.length)return;
const det=document.createElement('details');det.className='grp-sec';

det.appendChild(sm);
const ul=document.createElement('div');ul.className='elist';ul.setAttribute('role','list');
v.ents.forEach(e=>ul.appendChild(renderCard(e)));
det.appendChild(ul);
w.appendChild(det);
});
return w;
}

}

const d=new Date(y,m-1+delta,1);

refreshList();
}

}

/* KANBAN */
/* Kandidáti na sloupce Kanbanu a na sekce v seznamu. Data se nabízejí jen
   pro sekce (`sDaty`) — v Kanbanu by přetažení karty znamenalo „přepiš datum",
   což nedává smysl, stejně jako u tagů. */
function collectColumnAttrCandidates(sDaty){
const out=[];
state.data.entityTypes.forEach(ty=>ty.attributes.forEach(a=>{if(a.type==='select'||a.type==='yesno')out.push({scope:'type',scopeId:ty.id,attrId:a.id,label:ty.name+' / '+a.name,type:a.type,def:a})}));
state.data.aspects.forEach(asp=>asp.attributes.forEach(a=>{if(a.type==='select'||a.type==='yesno')out.push({scope:'aspect',scopeId:asp.id,attrId:a.id,label:'◎ '+asp.name+' / '+a.name,type:a.type,def:a})}));
out.push({scope:'system',scopeId:null,attrId:'typeId',label:'● '+t('sysType'),type:'typeRef'});
if(sDaty){
out.push({scope:'system',scopeId:null,attrId:'updatedAt',label:'● '+t('updated'),type:'date'});
out.push({scope:'system',scopeId:null,attrId:'createdAt',label:'● '+t('created'),type:'date'});
state.data.entityTypes.forEach(ty=>ty.attributes.forEach(a=>{if(a.type==='date')out.push({scope:'type',scopeId:ty.id,attrId:a.id,label:ty.name+' / '+a.name,type:'date',def:a})}));
state.data.aspects.forEach(asp=>asp.attributes.forEach(a=>{if(a.type==='date')out.push({scope:'aspect',scopeId:asp.id,attrId:a.id,label:'◎ '+asp.name+' / '+a.name,type:'date',def:a})}));
}
return out;
}

/* Přihrádky podle data. Granularitu drží `state.view.groupDate`, klíč nese
   předponu, aby se přihrádky různých granularit nikdy nepotkaly. */
const GROUP_DATE_GRAN=['day','week','month','year'];
const GROUP_DATE_LBL={day:'groupDateDay',week:'groupDateWeek',month:'groupDateMonth',year:'groupDateYear'};
function groupDateGran(){const g=state.view.groupDate;return GROUP_DATE_GRAN.indexOf(g)>=0?g:'day'}
function datumZHodnoty(v){if(v==null||v==='')return null;const d=new Date(v);return isNaN(d.getTime())?null:d}
function dvojcif(n){return String(n).padStart(2,'0')}
function isoDen(d){return d.getFullYear()+'-'+dvojcif(d.getMonth()+1)+'-'+dvojcif(d.getDate())}
function pondeliTydne(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function datumKlic(d,gran){
if(gran==='year')return 'y:'+d.getFullYear();
if(gran==='month')return 'm:'+d.getFullYear()+'-'+dvojcif(d.getMonth()+1);
if(gran==='week')return 'w:'+isoDen(pondeliTydne(d));
return 'd:'+isoDen(d);
}
function locale(){return state.language==='en'?'en-GB':'cs-CZ'}
function datumPopis(klic){
const gran=klic.slice(0,1),v=klic.slice(2);
try{
if(gran==='y')return v;
if(gran==='m'){const p=v.split('-');const d=new Date(Number(p[0]),Number(p[1])-1,1);
return new Intl.DateTimeFormat(locale(),{month:'long',year:'numeric'}).format(d)}
if(gran==='w'){const od=new Date(v+'T00:00:00');const do_=new Date(od);do_.setDate(do_.getDate()+6);
return od.getDate()+'. '+(od.getMonth()+1)+'. – '+do_.getDate()+'. '+(do_.getMonth()+1)+'. '+do_.getFullYear()}
const d=new Date(v+'T00:00:00');
const dnes=new Date();dnes.setHours(0,0,0,0);
const rozdil=Math.round((dnes.getTime()-d.getTime())/86400000);
if(rozdil===0)return t('dateToday');
if(rozdil===1)return t('dateYesterday');
return new Intl.DateTimeFormat(locale(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
}catch(e){return v}
}
function getColumnValuesForAttr(target){
if(!target)return[];
if(target.scope==='system'&&target.attrId==='typeId'){return state.data.entityTypes.map(ty=>({key:ty.id,label:(ty.icon?ty.icon+' ':'')+ty.name}))}
if(target.type==='yesno'){return[{key:'true',label:t('yes')},{key:'false',label:t('no')}]}
if(target.type==='select'){return attrSelectValues(target.def).map(o=>({key:o,label:o}))}
return[];
}
function entityColumnKey(e,target){
if(!target)return'_';
if(target.scope==='system'&&target.attrId==='typeId')return e.typeId||'_none';
if(target.type==='date'){
const raw=target.scope==='system'?e[target.attrId]:(e.attributes&&e.attributes[target.attrId]);
const d=datumZHodnoty(raw);
return d?datumKlic(d,groupDateGran()):'_none';
}
const v=e.attributes&&e.attributes[target.attrId];
if(v==null||v==='')return'_none';
if(target.type==='yesno')return v?'true':'false';
return String(v);
}
function renderKanbanEl(list){
const w=document.createElement('div');
const cands=collectColumnAttrCandidates();
if(!cands.length){const p=document.createElement('p');p.className='empty';p.textContent=t('kanbanNoAttr');w.appendChild(p);return w}
/* Attr picker */
const bar=document.createElement('div');bar.style.marginBottom='.6rem';bar.style.display='flex';bar.style.gap='.4rem';bar.style.alignItems='center';bar.style.flexWrap='wrap';
const lbl=document.createElement('label');lbl.htmlFor='kb-sel';lbl.textContent=t('kanbanColumnAttr')+': ';bar.appendChild(lbl);
const sel=document.createElement('select');sel.id='kb-sel';
cands.forEach(c=>{const o=document.createElement('option');o.value=c.scope+'|'+(c.scopeId||'')+'|'+c.attrId;o.textContent=c.label;if(state.view.kanbanAttr===o.value)o.selected=true;sel.appendChild(o)});
if(!state.view.kanbanAttr)state.view.kanbanAttr=sel.value;
sel.addEventListener('change',()=>{state.view.kanbanAttr=sel.value;refreshList()});
bar.appendChild(sel);
w.appendChild(bar);
const parts=(state.view.kanbanAttr||sel.value).split('|');
const target=cands.find(c=>c.scope===parts[0]&&(c.scopeId||'')===parts[1]&&c.attrId===parts[2])||cands[0];
const cols=getColumnValuesForAttr(target);
/* Add "no value" column at end if any entity has empty */
const bucket={};cols.forEach(c=>bucket[c.key]=[]);bucket['_none']=[];
list.forEach(e=>{const k=entityColumnKey(e,target);if(!(k in bucket))bucket[k]=[];bucket[k].push(e)});
const board=document.createElement('div');board.className='kanban';board.setAttribute('role','list');board.setAttribute('aria-label',t('kanbanBoard'));
const columnsToShow=cols.slice();
if(bucket['_none']&&bucket['_none'].length)columnsToShow.push({key:'_none',label:t('kanbanColNone')});
columnsToShow.forEach(col=>{
const c=document.createElement('div');c.className='kanban-col';c.setAttribute('role','listitem');c.setAttribute('aria-label',col.label+' ('+(bucket[col.key]||[]).length+')');
const h=document.createElement('h3');h.className='kanban-h';h.textContent=col.label+' ('+(bucket[col.key]||[]).length+')';c.appendChild(h);
const inner=document.createElement('div');inner.className='kanban-cards';inner.setAttribute('role','list');
(bucket[col.key]||[]).forEach(e=>inner.appendChild(renderKanbanCard(e,target,columnsToShow,col.key)));
c.appendChild(inner);board.appendChild(c);
});
w.appendChild(board);
return w;
}
function renderKanbanCard(e,target,allCols,curKey){
const wrap=document.createElement('article');wrap.className='kanban-card';wrap.setAttribute('role','listitem');
const a=document.createElement('a');a.className='kanban-title';a.href='#entity/'+e.id;
appendEntityLabel(a,e);wrap.appendChild(a);
const sn=getSnip(e);if(sn){const s=document.createElement('div');s.className='kanban-snip';s.textContent=sn;wrap.appendChild(s)}
if(target.scope!=='system'){
const mv=document.createElement('div');mv.className='kanban-mv';
const mvLbl=document.createElement('span');mvLbl.textContent=t('kanbanMoveTo')+': ';mvLbl.style.fontSize='.8rem';mvLbl.style.color='var(--mu)';mv.appendChild(mvLbl);
const mSel=document.createElement('select');mSel.setAttribute('aria-label',t('kanbanMoveTo'));mSel.style.fontSize='.85rem';
const eo=document.createElement('option');eo.value='';eo.textContent='—';mSel.appendChild(eo);
allCols.forEach(c=>{if(c.key===curKey)return;const o=document.createElement('option');o.value=c.key;o.textContent=c.label;mSel.appendChild(o)});
mSel.addEventListener('change',()=>{if(!mSel.value)return;moveEntityKanban(e,target,mSel.value);refreshList()});
mv.appendChild(mSel);
wrap.appendChild(mv);
}
return wrap;
}
function moveEntityKanban(e,target,newKey){
if(target.scope==='system')return;
e.attributes=e.attributes||{};
if(newKey==='_none'){delete e.attributes[target.attrId]}
else if(target.type==='yesno'){e.attributes[target.attrId]=newKey==='true'}
else{e.attributes[target.attrId]=newKey}
e.updatedAt=new Date().toISOString();setDirty(true);
toast(t('kanbanMoved',{name:getTitle(e)}));
}

state.data.aspects.forEach(asp=>asp.attributes.forEach(a=>{if(a.type==='date')out.push({scope:'aspect',scopeId:asp.id,attrId:a.id,label:'◎ '+asp.name+' / '+a.name})}));

function entityDateValue(e,target){if(!target)return null;if(target.scope==='system')return e[target.attrId]||null;return(e.attributes&&e.attributes[target.attrId])||null}
function renderTimelineEl(list){

function collectCardAttrs(e){
const out=[];const seen=new Set();
if(e.typeId){const ty=findType(e.typeId);if(ty){(ty.attributes||[]).forEach(a=>{if(a.showInList&&!seen.has(a.id)){seen.add(a.id);out.push({attr:a,value:e.attributes&&e.attributes[a.id]})}})}}
(e.aspects||[]).forEach(aid=>{const asp=findAspect(aid);if(!asp)return;(asp.attributes||[]).forEach(a=>{if(a.showInList&&!seen.has(a.id)){seen.add(a.id);out.push({attr:a,value:e.attributes&&e.attributes[a.id]})}})});

   Klik kamkoliv mimo ně otevře detail, název je zároveň skutečný odkaz (nová záložka, klávesnice). */
const a=document.createElement('div');
a.className='ecard'+(bulkActive?' ecard-bulk':'')+(bulkActive&&state.bulk.selected.has(e.id)?' ecard-sel':'')+(jeNahled?' ecard-prev':'');
a.setAttribute('role','listitem');
if(bulkActive){
const cb=document.createElement('input');cb.type='checkbox';cb.className='ecard-cb';cb.checked=state.bulk.selected.has(e.id);
cb.setAttribute('aria-label',t('bulkToggleSelect',{name:getTitle(e)}));
cb.addEventListener('change',()=>{if(cb.checked)state.bulk.selected.add(e.id);else state.bulk.selected.delete(e.id);a.classList.toggle('ecard-sel',cb.checked);const bar=document.querySelector('.bulk-bar');if(bar){const newBar=renderBulkToolbar();bar.parentNode.replaceChild(newBar,bar)}});
cb.addEventListener('click',ev=>ev.stopPropagation());
a.appendChild(cb);
a.style.cursor='pointer';
a.addEventListener('click',ev=>{if(ev.target.tagName==='INPUT')return;cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'))});
}else{

/* DETAIL */
/* Která karta v pravém sloupci detailu je vybraná. Drží se mimo `state.view`,
   protože navigace ho nahrazuje výchozími hodnotami a přepnutá karta má přežít
   i skok na jinou entitu. Do dat projektu to nepatří. */
let _detailTab='rels';

/* Karty pravého sloupce. `karty` je pole {id, popis, ikona, znacka, jmeno, sekce}.
   Sekce si nesou svoje `<h3>` — karty jsou navíc, ne místo nadpisů, aby se po
   detailu dalo dál pohybovat po nadpisech. */
/* Karta Tagy: co tag entity, to sbalitelný seznam ostatních entit se stejným
   tagem. Rozbalí se rovnou na odkazy, plný seznam je pak přes filtr. */
const TAG_KARTA_MAX=15;
function tagySpolecne(e){
const out=[];const videno=new Set();
entityTagAttrs(e).forEach(x=>x.tagy.forEach(tg=>{
const k=x.def.tagSetId+'\u0001'+tg;if(videno.has(k))return;videno.add(k);
out.push({tagSetId:x.def.tagSetId,tag:tg});
}));
return serazPodleNazvu(out,x=>x.tag);
}
function renderTagsSection(e){
const vlastni=tagySpolecne(e);
if(!vlastni.length)return null;
const sec=document.createElement('section');sec.className='dsec';sec.setAttribute('aria-labelledby','h-tags');
const h=document.createElement('h3');h.id='h-tags';h.textContent=t('detailTags');sec.appendChild(h);
vlastni.forEach(v=>{
const ts=findTagSet(v.tagSetId);
const ostatni=serazPodleNazvu(state.data.entities.filter(x=>x.id!==e.id&&!x.archived&&entityHasTag(x,v.tagSetId,v.tag)),getTitle);
const d=document.createElement('details');d.className='tag-grp';
const sum=document.createElement('summary');
const ch=document.createElement('span');ch.className='tag-chip';ch.textContent=v.tag;sum.appendChild(ch);
const meta=document.createElement('span');meta.className='tag-grp-m';
meta.textContent=(ts?ts.name+' · ':'')+t('tagOthers',{n:ostatni.length});
sum.appendChild(meta);d.appendChild(sum);
const body=document.createElement('div');body.className='tag-grp-b';
if(!ostatni.length){const p=document.createElement('p');p.className='aempty';p.textContent=t('tagNoOthers');body.appendChild(p)}
else ostatni.slice(0,TAG_KARTA_MAX).forEach(x=>{const a=document.createElement('a');a.className='rch';a.href='#entity/'+x.id;appendEntityLabel(a,x);body.appendChild(a)});
const vse=document.createElement('a');vse.className='tag-grp-all';vse.href=tagHash(v.tagSetId,v.tag);
vse.textContent=ostatni.length>TAG_KARTA_MAX?t('tagShowAllMore',{n:ostatni.length}):t('tagShowAll');
body.appendChild(vse);
d.appendChild(body);sec.appendChild(d);
});
return sec;
}

function renderDetailTabs(karty){
if(!karty.some(k=>k.id===_detailTab))_detailTab=karty[0].id;
const w=document.createElement('div');
const strip=document.createElement('div');strip.className='dtabs';
strip.setAttribute('role','tablist');strip.setAttribute('aria-label',t('detailTabsLabel'));
const tlacitka=[];
karty.forEach(k=>{
const vybrana=k.id===_detailTab;
const b=document.createElement('button');b.type='button';b.className='dtab';
b.setAttribute('role','tab');b.id='dtab-'+k.id;b.setAttribute('aria-controls','dpan-'+k.id);
b.setAttribute('aria-selected',vybrana?'true':'false');
b.tabIndex=vybrana?0:-1;
b.appendChild(document.createTextNode((k.ikona?k.ikona+' ':'')+k.popis));
if(k.znacka){const c=document.createElement('span');c.className='dtab-c';c.textContent=k.znacka;c.setAttribute('aria-hidden','true');b.appendChild(c)}
/* Značka je jen pro oči; odečítači se počty řeknou slovy. */
if(k.jmeno)b.setAttribute('aria-label',k.jmeno);
b.addEventListener('click',()=>prepni(k.id));
tlacitka.push(b);strip.appendChild(b);
});
w.appendChild(strip);
const panely={};
karty.forEach(k=>{
const pan=document.createElement('div');pan.className='dpanel';pan.id='dpan-'+k.id;
pan.setAttribute('role','tabpanel');pan.setAttribute('aria-labelledby','dtab-'+k.id);
pan.tabIndex=0;
k.sekce.forEach(x=>pan.appendChild(x));
pan.hidden=k.id!==_detailTab;
panely[k.id]=pan;w.appendChild(pan);
});
function prepni(id,fokus){
_detailTab=id;
tlacitka.forEach(b=>{
const vyb=b.id==='dtab-'+id;
b.setAttribute('aria-selected',vyb?'true':'false');
b.tabIndex=vyb?0:-1;
if(vyb&&fokus)b.focus();
});
Object.keys(panely).forEach(k=>{panely[k].hidden=k!==id});
zobrazIdObrazovky();
}
/* Šipkami mezi kartami, jak se od role tablist čeká. */
strip.addEventListener('keydown',ev=>{
const i=karty.findIndex(k=>k.id===_detailTab);
let ni=-1;
if(ev.key==='ArrowRight')ni=(i+1)%karty.length;
else if(ev.key==='ArrowLeft')ni=(i-1+karty.length)%karty.length;
else if(ev.key==='Home')ni=0;
else if(ev.key==='End')ni=karty.length-1;
if(ni<0)return;
ev.preventDefault();prepni(karty[ni].id,true);
});
return w;
}

/* Collect comments from entities connected to the given one (outgoing relations, incoming relations, wiki-links) */
function collectNeighborComments(entity){
const grouped=new Map();/* id -> {entity, relationLabels:Set, comments:[]} */
function addGroup(other,label){
if(!other||other.archived||other.id===entity.id)return;
if(!other.comments||!other.comments.length)return;
let g=grouped.get(other.id);
if(!g){g={entity:other,relationLabels:new Set(),comments:other.comments};grouped.set(other.id,g)}
if(label)g.relationLabels.add(label);
}
/* Outgoing: entity's relations */
(entity.relations||[]).forEach(r=>{const tgt=findEntity(r.targetId);if(!tgt)return;const rt=findRT(r.relationTypeId);addGroup(tgt,rt?rt.name:t('detailRelations'))});
/* Outgoing: entity's attribute-of-type-relation values */
const defs=getAllAttrDefsForEntity(entity);
defs.forEach(def=>{
if(def.type!=='relation')return;
const v=entity.attributes&&entity.attributes[def.id];
if(v==null||v==='')return;
const ids=Array.isArray(v)?v:[v];
ids.forEach(id=>{const tgt=findEntity(id);if(!tgt)return;addGroup(tgt,(def.scopeLabel?def.scopeLabel+' / ':'')+def.name)});
});
/* Incoming: backlinks */
getRelsTo(entity.id).forEach(b=>{
const src=findEntity(b.sourceId);if(!src)return;
let label;
if(b.kind==='attribute')label=(b.scopeLabel?b.scopeLabel+' / ':'')+b.attrName;
else if(b.kind==='wikilink')label='[['+b.attrName+']]';
else{const rt=findRT(b.relationTypeId);label=rt?(rt.inverseName||rt.name):'?'}
addGroup(src,label+' ←');
});
/* Sort groups by number of comments desc */
const out=Array.from(grouped.values()).map(g=>({entity:g.entity,relationLabels:Array.from(g.relationLabels),comments:g.comments}));
out.sort((a,b)=>b.comments.length-a.comments.length||(getTitle(a.entity)||'').localeCompare(getTitle(b.entity)||''));
return out;
}

function buildOutlineNode(entity,visited,depth,isRoot){
const node=document.createElement('div');node.className='out-n';node.setAttribute('role','treeitem');
const out=getLinksFrom(entity);
const back=getRelsTo(entity.id);
const hasChildren=(out.length+back.length)>0;
const hdr=document.createElement('div');hdr.className='out-h';
/* Sbalené i v kořeni — strom vazeb nechce vidět každý, kdo otevře detail.
   Potomci se staví až při rozbalení (`buildChildren`), takže detail navíc
   nemusí procházet vazby, které nikdo neuvidí. */
let opened=false;
const tog=document.createElement('button');tog.type='button';tog.className='out-tog';tog.setAttribute('aria-label',t('toggle'));
tog.textContent=hasChildren?(opened?'▾':'▸'):'·';
if(!hasChildren)tog.disabled=true;
hdr.appendChild(tog);
const lnk=document.createElement('a');lnk.className='out-l';lnk.href='#entity/'+entity.id;
const ti=document.createElement('span');ti.className='out-ti';appendEntityLabel(ti,entity);lnk.appendChild(ti);
const tl=getTypeLabel(entity);
if(tl){const sp=document.createElement('span');sp.className='out-tl';sp.textContent=' ('+tl+')';lnk.appendChild(sp)}
if(isRoot)lnk.style.fontWeight='600';
hdr.appendChild(lnk);
const ct=document.createElement('span');ct.className='out-c';
if(hasChildren)ct.textContent=' ['+out.length+'→ '+back.length+'←]';
hdr.appendChild(ct);
node.appendChild(hdr);
const body=document.createElement('div');body.className='out-b';body.setAttribute('role','group');
let built=false;
const buildChildren=()=>{
if(built)return;built=true;
const childWrap=document.createElement('div');
if(out.length){
const og={};out.forEach(r=>{
const k=r.kind==='attribute'?'a:'+r.attrId:r.kind==='wikilink'?'w:'+(r.attrId||r.attrName):'r:'+(r.relationTypeId||'_');
og[k]=og[k]||{kind:r.kind,attrName:r.attrName,scopeLabel:r.scopeLabel,relationTypeId:r.relationTypeId,items:[]};
og[k].items.push(r);
});
Object.keys(og).forEach(k=>{
const info=og[k];const grp=document.createElement('div');grp.className='out-g';
const lbl=document.createElement('div');lbl.className='out-gl';
/* Popisky jako u zpětných odkazů, jen opačným směrem. */
if(info.kind==='attribute')lbl.textContent=(info.scopeLabel?info.scopeLabel+' / ':'')+info.attrName+' →';
else if(info.kind==='wikilink')lbl.textContent='[['+info.attrName+']] '+(info.scopeLabel?'('+info.scopeLabel+') ':'')+'→';
else{const rt=findRT(info.relationTypeId);lbl.textContent=(rt?rt.name:t('detailRelations'))+' →'}
grp.appendChild(lbl);
serazPodleNazvu(info.items,r=>{const q=findEntity(r.targetId);return q?getTitle(q):r.targetId}).forEach(r=>{const tgt=findEntity(r.targetId);if(!tgt)return;
if(visited.has(tgt.id)){const cn=document.createElement('div');cn.className='out-loop';cn.textContent='↻ '+getTitle(tgt)+' ('+t('outlineCycle')+')';grp.appendChild(cn);return}
grp.appendChild(buildOutlineNode(tgt,new Set([...visited,tgt.id]),depth+1,false))});
childWrap.appendChild(grp);
});
}
if(back.length){
const bg={};back.forEach(r=>{const k=r.relationTypeId||'_';bg[k]=bg[k]||[];bg[k].push(r)});
Object.keys(bg).forEach(k=>{
const rt=findRT(k);const grp=document.createElement('div');grp.className='out-g';
const lbl=document.createElement('div');lbl.className='out-gl';lbl.textContent='← '+(rt?(rt.inverseName||rt.name):t('detailBacklinks'));grp.appendChild(lbl);
serazPodleNazvu(bg[k],r=>{const q=findEntity(r.sourceId);return q?getTitle(q):r.sourceId}).forEach(r=>{const src=findEntity(r.sourceId);if(!src)return;
if(visited.has(src.id)){const cn=document.createElement('div');cn.className='out-loop';cn.textContent='↻ '+getTitle(src)+' ('+t('outlineCycle')+')';grp.appendChild(cn);return}
grp.appendChild(buildOutlineNode(src,new Set([...visited,src.id]),depth+1,false))});
childWrap.appendChild(grp);
});
}
body.appendChild(childWrap);
};
if(opened)buildChildren();
body.style.display=opened?'block':'none';
node.appendChild(body);
tog.addEventListener('click',()=>{
if(!hasChildren)return;
opened=!opened;
tog.textContent=opened?'▾':'▸';
node.setAttribute('aria-expanded',opened?'true':'false');
if(opened)buildChildren();
body.style.display=opened?'block':'none';
});
node.setAttribute('aria-expanded',opened?'true':'false');
return node;
}

/* Odkaz na seznam všech entit s tímhle tagem. Adresa #tag/<soustava>/<tag>
   je sdílitelná — filtr se z ní nastaví i po načtení stránky. */
function tagHash(tagSetId,tag){return'#tag/'+encodeURIComponent(tagSetId)+'/'+encodeURIComponent(tag)}
/* Dvojice soustava+tag jako jeden řetězec — do <option>, do klíčů a do map. */
function tagKlic(tagSetId,tag){return tagSetId+'\u0001'+tag}
function tagZKlice(v){const i=String(v||'').indexOf('\u0001');return i<0?{tagSetId:'',tag:''}:{tagSetId:v.slice(0,i),tag:v.slice(i+1)}}
function tagChip(tagSetId,tag){
if(!tagSetId){const s=document.createElement('span');s.className='tag-chip';s.textContent=tag;return s}
const a=document.createElement('a');a.className='tag-chip';a.href=tagHash(tagSetId,tag);
a.textContent=tag;a.title=t('tagLinkHint');return a;
}
/* Hodnoty tagového atributu jako odznáčky, v pořadí soustavy. */
function renderTagChips(tagSetId,v){
const w=document.createElement('span');w.className='tag-chips';
const ts=tagSetId?findTagSet(tagSetId):null;const ord=ts?(ts.tags||[]):[];
const arr=tagValueArr(v).slice().sort(porovnejNazvy);
arr.forEach(tg=>{const ch=tagChip(tagSetId,tg);if(ord.length&&ord.indexOf(tg)<0){ch.classList.add('tag-chip-x');ch.title=t('tagNotInSet')}w.appendChild(ch)});
return w;
}
function renderAttrVal(a,v,e){
if(v==null||v===''||(Array.isArray(v)&&!v.length)){const s=document.createElement('span');s.className='aempty';s.textContent=t('notSet');return s}
switch(a.type){
case'text':return document.createTextNode(String(v));
case'textarea':{const d=document.createElement('div');d.className='md';d.innerHTML=renderMD(String(v));return d}
case'date':return document.createTextNode(fmtDate(v));
case'url':{const x=document.createElement('a');x.href=v;x.textContent=v;x.target='_blank';x.rel='noopener noreferrer';return x}
case'select':return document.createTextNode(String(v));
case'yesno':return document.createTextNode(v?t('yes'):t('no'));
case'number':return document.createTextNode(String(v));

   v nich nikdy není, takže je při úklidu vynecháme, ať nepřijdeme o tag. */
const tagoveId=new Set();
[].concat(state.data.entityTypes||[],state.data.aspects||[]).forEach(o=>(o.attributes||[]).forEach(a=>{if(a.type==='tags')tagoveId.add(a.id)}));

function refreshChoices(){
chSel.innerHTML='';
const tf=tfSel.value;const tx=(txIn.value||'').toLowerCase().trim();
const exc=opts.excludeIds||[];
/* Track filter reasons for diagnostic */
const reasons={archived:0,excluded:0,wrongType:0,inboxOnly:0,inboxFiltered:0,alreadySelected:0,textMissed:0,passed:0};
let list=state.data.entities.filter(e=>{
if(e.archived){reasons.archived++;return false}
if(exc.includes(e.id)){reasons.excluded++;return false}
if(opts.allowedTypes&&opts.allowedTypes.length&&e.typeId&&!opts.allowedTypes.includes(e.typeId)){reasons.wrongType++;return false}
if(tf==='__none__'){if(e.typeId){reasons.inboxFiltered++;return false}}
else if(tf){if(e.typeId!==tf){if(!e.typeId)reasons.inboxOnly++;else reasons.wrongType++;return false}}
if(opts.mode==='multi'&&sel.includes(e.id)){reasons.alreadySelected++;return false}
if(opts.mode==='single'&&sel&&e.id===sel){reasons.alreadySelected++;return false}
if(tx){const hay=(getTitle(e)+' '+getSnip(e)).toLowerCase();if(!hay.includes(tx)){reasons.textMissed++;return false}}
reasons.passed++;return true;
});
list=serazPodleNazvu(list,getTitle);
const MAX=100;const total=list.length;if(total>MAX)list=list.slice(0,MAX);
hint.innerHTML='';
if(!list.length){const o=document.createElement('option');o.disabled=true;o.textContent=t('noChoices');chSel.appendChild(o)}
else{list.forEach(c=>{const o=document.createElement('option');o.value=c.id;const ty=c.typeId?findType(c.typeId):null;o.textContent=(ty&&ty.icon?ty.icon+' ':'')+getTitle(c)+(ty?' ['+ty.name+']':(c.inInbox?' [📥]':''));chSel.appendChild(o)})}
/* Debug log to on-page debug console */
dbg('Selector ['+lid+']: allowed='+JSON.stringify(opts.allowedTypes||null)+' locked='+(opts.lockedType||'-')+' tf='+(tf||'-')+' tx='+(tx||'-')+' exc='+exc.length+' → '+list.length+' results (rejected: archived='+reasons.archived+', excluded='+reasons.excluded+', wrongType='+reasons.wrongType+', inboxNoType='+reasons.inboxOnly+', filteredOutInbox='+reasons.inboxFiltered+', alreadySelected='+reasons.alreadySelected+', textMissed='+reasons.textMissed+')');
/* Detailed empty-list diagnostic */
let typeForCreate=null;
if(opts.lockedType)typeForCreate=findType(opts.lockedType);
else if(tf&&tf!=='__none__')typeForCreate=findType(tf);
else if(opts.allowedTypes&&opts.allowedTypes.length===1)typeForCreate=findType(opts.allowedTypes[0]);
if(!list.length){
const di=document.createElement('div');di.style.fontSize='.85rem';di.style.color='var(--mu)';di.style.marginTop='.3rem';di.style.lineHeight='1.4';
const lines=[];
if(typeForCreate){
const tn=typeForCreate.name;
const allOfType=state.data.entities.filter(x=>x.typeId===typeForCreate.id);
const activeOfType=allOfType.filter(x=>!x.archived);
const archOfType=allOfType.filter(x=>x.archived);
const inboxNoType=state.data.entities.filter(x=>!x.typeId&&!x.archived&&x.inInbox).length;
lines.push('<strong>'+t('selectorEmptyTitle',{type:tn})+'</strong>');
lines.push(t('selectorDiagOfType',{n:activeOfType.length,type:tn}));
if(reasons.excluded>0)lines.push('• '+t('selectorDiagExcluded',{n:reasons.excluded}));
if(reasons.alreadySelected>0)lines.push('• '+t('selectorDiagAlreadySelected',{n:reasons.alreadySelected}));
if(reasons.textMissed>0)lines.push('• '+t('selectorDiagTextMissed',{n:reasons.textMissed,q:tx}));
if(archOfType.length>0)lines.push('• '+t('selectorDiagArchived',{n:archOfType.length,type:tn}));
if(inboxNoType>0)lines.push('• '+t('selectorDiagInboxNoType',{n:inboxNoType,type:tn}));
if(activeOfType.length===0&&inboxNoType===0)lines.push('• '+t('selectorDiagNoEntities',{type:tn}));
}else{
lines.push(t('selectorDiagNoFilter',{n:state.data.entities.length}));
if(reasons.excluded>0)lines.push('• '+t('selectorDiagExcluded',{n:reasons.excluded}));
if(reasons.textMissed>0)lines.push('• '+t('selectorDiagTextMissed',{n:reasons.textMissed,q:tx}));
}
di.innerHTML=lines.join('<br>');hint.appendChild(di);
}
if(typeForCreate){
const tn=typeForCreate.name;
const cb=document.createElement('button');cb.type='button';cb.className='btn btn-sm';cb.style.marginTop='.4rem';cb.textContent='＋ '+t('selectorCreateNew',{type:tn});
cb.addEventListener('click',()=>{
const nm=prompt(t('selectorCreateNew',{type:tn})+':',(txIn.value||'').trim());

function buildField(e,a){
const f=document.createElement('div');f.className='fld';
const lid='at-'+a.id;
/* Atribut bez názvu by dal pole bez jména — pro odečítač je to slepá ulička. */

const lab=document.createElement('label');lab.htmlFor=lid;lab.textContent=nazev+(a.required?' *':'');f.appendChild(lab);
const cur=e.attributes&&e.attributes[a.id];
const sv=v=>{e.attributes=e.attributes||{};if(v===''||v==null)delete e.attributes[a.id];else e.attributes[a.id]=v};
buildFieldInput(f,a,cur,sv,lid);
/* Vazba, ano/ne a prázdný výběr nevyrábí jeden ovládací prvek s tímhle id —
   visící „for" by pole nechal úplně bez jména. Jméno pak nese sama skupina. */
if(!f.querySelector('[id="'+lid+'"]'))lab.removeAttribute('for');
return f;
}
function buildFieldInput(f,a,cur,sv,lid){

case'textarea':{const ta=document.createElement('textarea');ta.id=lid;ta.value=cur||'';ta.addEventListener('input',()=>sv(ta.value));f.appendChild(ta);const h=document.createElement('small');h.className='fhint';h.textContent='Markdown + CriticMarkup';f.appendChild(h);break}
case'date':{const i=document.createElement('input');i.type='date';i.id=lid;i.value=cur||'';i.addEventListener('input',()=>sv(i.value));f.appendChild(i);break}
case'url':{const i=document.createElement('input');i.type='url';i.id=lid;i.value=cur||'';i.addEventListener('input',()=>sv(i.value));f.appendChild(i);break}
case'number':{const i=document.createElement('input');i.type='number';i.id=lid;i.value=cur!=null?cur:'';i.addEventListener('input',()=>sv(i.value===''?'':Number(i.value)));f.appendChild(i);break}
case'select':{const vals=attrSelectValues(a);if(!vals.length){const s=document.createElement('select');s.id=lid;s.disabled=true;s.className='aempty';const o0=document.createElement('option');o0.textContent=t('selectListEmpty');s.appendChild(o0);f.appendChild(s)}else{const sel=document.createElement('select');sel.id=lid;const e0=document.createElement('option');e0.value='';e0.textContent='— '+t('none')+' —';sel.appendChild(e0);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(cur===v)o.selected=true;sel.appendChild(o)});sel.addEventListener('change',()=>sv(sel.value));f.appendChild(sel)}break}
case'yesno':{const w=document.createElement('div');w.setAttribute('role','radiogroup');w.setAttribute('aria-label',(a.name&&String(a.name).trim())?a.name:t('attrNoName'));w.style.display='flex';w.style.gap='1rem';['yes','no','none'].forEach(v=>{const id=lid+'-'+v;const lab=document.createElement('label');lab.style.display='inline-flex';lab.style.gap='.3rem';lab.style.alignItems='center';const r=document.createElement('input');r.type='radio';r.name=lid;r.id=id;r.checked=(v==='yes'&&cur===true)||(v==='no'&&cur===false)||(v==='none'&&cur==null);r.addEventListener('change',()=>sv(v==='yes'?true:v==='no'?false:''));lab.appendChild(r);const sp=document.createElement('span');sp.textContent=v==='yes'?t('yes'):v==='no'?t('no'):'—';lab.appendChild(sp);w.appendChild(lab)});f.appendChild(w);break}
case'tags':{f.appendChild(buildTagEditor(a,cur,sv,lid));break}
case'relation':{
const tt=a.targetType;const multi=!!a.multi;
const allowedTypes=(tt&&tt!=='any')?[tt]:null;
const exc=[state.view.edit?state.view.edit.id:''];
const es=buildEntitySelector({mode:multi?'multi':'single',value:cur,allowedTypes:allowedTypes,lockedType:(tt&&tt!=='any')?tt:null,excludeIds:exc,lid:lid,label:(a.name&&String(a.name).trim())?a.name:t('attrNoName'),onChange:v=>sv(v===''||(Array.isArray(v)&&!v.length)?'':v)});
f.appendChild(es);
break;
}
}
}

/* Editace tagového atributu. Sbalené ukazuje shrnutí („Barvy: Červená, Zelená"),
   po rozbalení zaškrtávátka pro celou soustavu a políčko na rychlé přidání tagu —
   ten se přidá rovnou do soustavy, takže ho hned uvidí i ostatní atributy. */
function buildTagEditor(a,cur,sv,lid){
const box=document.createElement('details');box.className='tag-ed';
const sum=document.createElement('summary');sum.id=lid;
const nazev=(a.name&&String(a.name).trim())?a.name:t('attrNoName');
box.appendChild(sum);
const telo=document.createElement('div');telo.className='tag-ed-b';box.appendChild(telo);
let vybrane=tagValueArr(cur);

function shrnuti(){
sum.textContent=nazev+': '+(vybrane.length?vybrane.slice().sort(porovnejNazvy).join(', '):t('tagNothing'));
}
function uloz(){
/* Pořadí drží soustava, ne pořadí klikání — jinak by se hodnota měnila i tehdy,
   když uživatel jen zaškrtl a odškrtl totéž. */
const poradi=attrTagValues(a);
vybrane=poradi.filter(x=>vybrane.indexOf(x)>=0).concat(vybrane.filter(x=>poradi.indexOf(x)<0));
sv(vybrane.length?vybrane.slice():'');
shrnuti();
}
function prekresli(){
telo.textContent='';
const ts=findTagSet(a.tagSetId);
if(!ts){const p=document.createElement('p');p.className='fhint';p.textContent=t('tagSetNone');telo.appendChild(p);return}
const vsechny=attrTagValues(a);
/* Tag, který v soustavě není (třeba po přejmenování), se nesmí tiše ztratit. */
const navic=vybrane.filter(x=>vsechny.indexOf(x)<0);
const seznam=document.createElement('div');seznam.className='tag-ed-list';
seznam.setAttribute('role','group');seznam.setAttribute('aria-label',nazev);
vsechny.concat(navic).forEach(tg=>{
const lab=document.createElement('label');
const cb=document.createElement('input');cb.type='checkbox';cb.checked=vybrane.indexOf(tg)>=0;
cb.addEventListener('change',()=>{
if(cb.checked){if(vybrane.indexOf(tg)<0)vybrane.push(tg)}
else vybrane=vybrane.filter(x=>x!==tg);
uloz();
});
lab.appendChild(cb);
const sp=document.createElement('span');sp.textContent=tg+(navic.indexOf(tg)>=0?' ⚠':'');
if(navic.indexOf(tg)>=0)lab.title=t('tagNotInSet');
lab.appendChild(sp);seznam.appendChild(lab);
});
if(!vsechny.length&&!navic.length){const p=document.createElement('p');p.className='fhint';p.textContent=t('tagSetEmpty');telo.appendChild(p)}
telo.appendChild(seznam);
const pridat=document.createElement('div');pridat.className='tag-ed-add';
const inp=document.createElement('input');inp.type='text';inp.placeholder=t('tagAddNew');inp.setAttribute('aria-label',t('tagAddNew')+' — '+(ts.name||''));
const btn=document.createElement('button');btn.type='button';btn.className='btn btn-sm';btn.textContent='＋ '+t('tagAdd');
const pridej=()=>{
const v=inp.value.trim();
if(!v)return;
ts.tags=ts.tags||[];
if(ts.tags.indexOf(v)>=0&&vybrane.indexOf(v)>=0){toast(t('tagExists'));return}
if(ts.tags.indexOf(v)<0)ts.tags.push(v);
if(vybrane.indexOf(v)<0)vybrane.push(v);
inp.value='';setDirty(true);uloz();prekresli();
toast(t('tagAdded',{tag:v,set:ts.name||''}));
const znovu=telo.querySelector('.tag-ed-add input');if(znovu)znovu.focus();
};
btn.addEventListener('click',pridej);
inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();pridej()}});
pridat.appendChild(inp);pridat.appendChild(btn);telo.appendChild(pridat);
}
shrnuti();prekresli();
return box;
}

/* BULK ACTIONS */
function bulkSelectedEntities(){
const ids=Array.from(state.bulk.selected);
return ids.map(id=>findEntity(id)).filter(Boolean);
}

function runBulkAction(actionId){
const ents=bulkSelectedEntities();
if(!ents.length){toast(t('bulkNoSelection'));return}
switch(actionId){
case'changeType':bulkChangeType(ents);break;
case'addAspect':bulkAddAspect(ents);break;
case'removeAspect':bulkRemoveAspect(ents);break;
case'setAttr':bulkSetAttr(ents,false);break;
case'clearAttr':bulkSetAttr(ents,true);break;
case'addRelation':bulkAddRelation(ents);break;
case'merge':bulkMerge(ents);break;
case'export':openExportHub(ents);break;



case'ai':openAiDialog(ents);break;
case'toInbox':bulkSimple(ents,e=>{e.inInbox=true});break;
case'fromInbox':bulkSimple(ents,e=>{e.inInbox=false});break;
case'archive':bulkArchive(ents);break;
case'restore':bulkSimple(ents,e=>{e.archived=false});break;
case'delete':bulkDelete(ents);break;
}
}

function bulkFinish(n,msgKey,extra){
state.bulk.selected.clear();state.bulk.actionId='';
setDirty(true);
toast(t(msgKey,Object.assign({n:n},extra||{})));
closeDialog();render();
}

function bulkSimple(ents,fn){

}

{label:t('cancel'),action:closeDialog},
{label:t('bulkRun'),primary:true,action:()=>{
const newId=sel.value||null;const now=new Date().toISOString();let kept=0,changed=0;

const newType=newId?findType(newId):null;
const oldByName={};if(oldType)oldType.attributes.forEach(a=>{const k=(a.name||'').trim().toLowerCase();if(k)oldByName[k]=a});
const oldAttrsById={};if(oldType)oldType.attributes.forEach(a=>{oldAttrsById[a.id]=a});
const newAttrs={};

});

/* =============================================================
   GRAPHML — entity jako uzly, vazby jako hrany.
   Pro Gephi, yEd, Cytoscape. Rozsah i volby sdílí s PlantUML.
   ============================================================= */
function buildGraphml(entities,opts){
const L=[];
const nodes=new Map();/* id → entita */
entities.forEach(e=>nodes.set(e.id,{e:e,ext:false}));
const relEdges=[];const attrEdges=[];
const wantExternal=!!opts.includeExternal;
const addTarget=id=>{
if(nodes.has(id))return true;
if(!wantExternal)return false;
const e=findEntity(id);if(!e)return false;
nodes.set(id,{e:e,ext:true});return true;
};
entities.forEach(e=>{
(e.relations||[]).forEach(r=>{
if(!addTarget(r.targetId))return;
const rt=findRT(r.relationTypeId);
relEdges.push({from:e.id,to:r.targetId,name:rt?rt.name:'',inv:rt?(rt.inverseName||''):'',src:'vazba'});
});
if(opts.includeAttrRel){
getAllAttrDefsForEntity(e).forEach(def=>{
if(def.type!=='relation')return;
const v=e.attributes&&e.attributes[def.id];
if(v==null||v==='')return;
(Array.isArray(v)?v:[v]).forEach(id=>{if(addTarget(id))attrEdges.push({from:e.id,to:id,name:def.name||'',inv:'',src:'atribut'})});
});
}
});
/* Klíče atributů — id musí být jedinečné, popisek smí být lidský. */
const attrKeys=[];const attrKeyId=new Map();
if(opts.includeAttrs){
nodes.forEach(({e,ext})=>{
if(ext)return;
getAllAttrDefsForEntity(e).forEach(def=>{
if(def.type==='relation')return;
if(!def.name||!String(def.name).trim())return;
if(attrKeyId.has(def.id))return;
const kid='na'+(attrKeys.length+1);
attrKeyId.set(def.id,kid);
attrKeys.push({id:kid,label:(def.scopeLabel?def.scopeLabel+' / ':'')+(def.name||''),type:graphmlType(def)});
});
});
}
L.push('<?xml version="1.0" encoding="UTF-8"?>');
L.push('<graphml xmlns="http://graphml.graphdrawing.org/xmlns" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://graphml.graphdrawing.org/xmlns http://graphml.graphdrawing.org/xmlns/1.0/graphml.xsd">');
const key=(id,forWhat,name,type)=>L.push('  <key id="'+id+'" for="'+forWhat+'" attr.name="'+xmlEsc(name)+'" attr.type="'+type+'"/>');
key('n_label','node','label','string');
key('n_typ','node',t('type'),'string');
key('n_aspekty','node',t('detailAspects'),'string');
key('n_inbox','node','inbox','boolean');
key('n_externi','node','externí','boolean');
attrKeys.forEach(k=>key(k.id,'node',k.label,k.type));
key('e_label','edge','label','string');
key('e_opacny','edge',t('modelDocInverse'),'string');
key('e_zdroj','edge',t('graphmlEdgeSource'),'string');
L.push('  <graph id="G" edgedefault="directed">');
nodes.forEach(({e,ext},id)=>{
L.push('    <node id="'+xmlEsc(id)+'">');
L.push('      <data key="n_label">'+xmlEsc(getTitle(e))+'</data>');
const ty=e.typeId?findType(e.typeId):null;
if(ty)L.push('      <data key="n_typ">'+xmlEsc(ty.name)+'</data>');
const asp=(e.aspects||[]).map(aid=>{const a=findAspect(aid);return a?a.name:null}).filter(Boolean);
if(asp.length)L.push('      <data key="n_aspekty">'+xmlEsc(asp.join('; '))+'</data>');
if(e.inInbox)L.push('      <data key="n_inbox">true</data>');
if(ext)L.push('      <data key="n_externi">true</data>');
if(opts.includeAttrs&&!ext){
getAllAttrDefsForEntity(e).forEach(def=>{
const kid=attrKeyId.get(def.id);if(!kid)return;
const v=e.attributes&&e.attributes[def.id];
if(v==null||v==='')return;
L.push('      <data key="'+kid+'">'+xmlEsc(graphmlValue(def,v))+'</data>');
});
}
L.push('    </node>');
});
let n=0;
relEdges.concat(attrEdges).forEach(ed=>{
n++;
L.push('    <edge id="hrana'+n+'" source="'+xmlEsc(ed.from)+'" target="'+xmlEsc(ed.to)+'">');
if(ed.name)L.push('      <data key="e_label">'+xmlEsc(ed.name)+'</data>');
if(ed.inv)L.push('      <data key="e_opacny">'+xmlEsc(ed.inv)+'</data>');
L.push('      <data key="e_zdroj">'+ed.src+'</data>');
L.push('    </edge>');
});
L.push('  </graph>');
L.push('</graphml>');
return L.join('\n')+'\n';
}
function graphmlType(def){
if(def.type==='number')return'double';
if(def.type==='yesno')return'boolean';
return'string';
}
function graphmlValue(def,v){
if(def.type==='yesno')return v?'true':'false';
if(def.type==='number')return String(v);
return String(fmtAttrForPuml(def,v));
}

function collectPumlEntities(scope,preselected){
if(scope==='selection'&&preselected)return preselected.slice();
if(scope==='view')return getList();
if(scope==='all')return state.data.entities.filter(e=>!e.archived);
if(scope.indexOf('type:')===0){const tid=scope.slice(5);return state.data.entities.filter(e=>e.typeId===tid&&!e.archived)}
if(scope.indexOf('aspect:')===0){const aid=scope.slice(7);return state.data.entities.filter(e=>(e.aspects||[]).indexOf(aid)>=0&&!e.archived)}
