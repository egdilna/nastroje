const box=document.createElement('div');box.style.maxHeight='18rem';box.style.overflow='auto';
plan.types.forEach(grp=>{
const h=document.createElement('h4');h.style.margin='.6rem 0 .3rem';
h.textContent=(grp.ty?(grp.ty.icon?grp.ty.icon+' ':'')+grp.ty.name:t('jsonUntyped'));box.appendChild(h);
const tbl=document.createElement('table');tbl.className='jsonk-t';
const mkRow=(label,okey,cur,sub)=>{
const tr=document.createElement('tr');
const td1=document.createElement('td');td1.textContent=label;
if(sub){const s=document.createElement('span');s.style.color='var(--mu)';s.style.fontSize='.8rem';s.textContent=' '+sub;td1.appendChild(s)}
tr.appendChild(td1);
const td2=document.createElement('td');
const inp=document.createElement('input');inp.type='text';inp.value=cur;inp.spellcheck=false;
inp.setAttribute('aria-label',t('jsonKeyCol')+': '+label);
inp.addEventListener('change',()=>{
const v=jsonSlug(inp.value,cfg.keyStyle);
if(v)cfg.keyOverrides[okey]=v;else delete cfg.keyOverrides[okey];
renderJsonWiz();
});
td2.appendChild(inp);tr.appendChild(td2);
tbl.appendChild(tr);
};
if(grp.ty)mkRow(t('jsonCollection'),'ty:'+grp.ty.id,grp.key,null);
grp.props.forEach(p=>mkRow(p.attr.name,'at:'+p.attr.id,p.key,p.source==='aspect'?'◎ '+p.aspect.name:null));
grp.rels.forEach(r=>mkRow(r.rt.name,'rt:'+r.rt.id,r.key,'↔'));
box.appendChild(tbl);
});
body.appendChild(box);
if(plan.warnings.length){
const wl=document.createElement('ul');wl.style.color='var(--wn)';wl.style.fontSize='.85rem';
plan.warnings.slice(0,6).forEach(x=>{const li=document.createElement('li');li.textContent=x;wl.appendChild(li)});
body.appendChild(wl);
}
jsonWizCheck(body,t('jsonSaveKeys'),cfg.persistKeys,v=>{cfg.persistKeys=v},t('jsonSaveKeysHint'));
jsonWizNav(buttons,null);
}

/* Krok 3 — obsah */
function jsonWizStep3(body,buttons){
const cfg=jsonWiz.cfg;
const f=jsonWizFld(t('jsonRelMode'));
const s=document.createElement('select');
[['ref',t('jsonRelModeRef')],['id',t('jsonRelModeId')],['embed',t('jsonRelModeEmbed')]].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(cfg.relMode===v)o.selected=true;s.appendChild(o)});
s.addEventListener('change',()=>{cfg.relMode=s.value});
f.appendChild(s);body.appendChild(f);
const box=document.createElement('div');box.style.marginTop='.6rem';
jsonWizCheck(box,t('jsonInclCustom'),cfg.includeCustom,v=>{cfg.includeCustom=v},t('jsonInclCustomHint'));
jsonWizCheck(box,t('jsonInclComments'),cfg.includeComments,v=>{cfg.includeComments=v});
jsonWizCheck(box,t('jsonInclObjects'),cfg.includeObjects,v=>{cfg.includeObjects=v});
jsonWizCheck(box,t('jsonAllAttrs'),cfg.allAttrs,v=>{cfg.allAttrs=v},t('jsonAllAttrsHint'));
jsonWizCheck(box,t('jsonInclEmpty'),cfg.includeEmpty,v=>{cfg.includeEmpty=v},t('jsonInclEmptyHint'));
jsonWizCheck(box,t('jsonSplitFiles'),cfg.splitFiles,v=>{cfg.splitFiles=v},t('jsonSplitFilesHint'));
body.appendChild(box);
const ff=jsonWizFld(t('jsonFormat'));
const fs2=document.createElement('select');
[['json','JSON + JSON Schema'],['xml','XML + XSD'],['both',t('jsonFormatBoth')]].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(cfg.format===v)o.selected=true;fs2.appendChild(o)});
fs2.addEventListener('change',()=>{cfg.format=fs2.value});
ff.appendChild(fs2);
const fh=document.createElement('small');fh.className='fhint';fh.textContent=t('jsonFormatHint');ff.appendChild(fh);
body.appendChild(ff);
jsonWizNav(buttons,null);
}

/* Krok 4 — náhled, kontrola, stažení */
function jsonWizStep4(body,buttons){
const cfg=jsonWiz.cfg;
const res=runJsonExport(cfg,jsonWiz.preset);
jsonWiz.res=res;
const sum=document.createElement('p');
sum.textContent=t('jsonSummary',{typu:res.plan.types.length,entit:res.plan.types.reduce((a,g)=>a+g.ents.length,0)});
body.appendChild(sum);
const vd=document.createElement('p');
vd.style.fontWeight='600';
vd.style.color=res.errors.length?'var(--dg)':'var(--ok)';
vd.textContent=(res.errors.length?'✗ ':'✓ ')+(res.errors.length?t('jsonValidFail',{n:res.errors.length}):t('jsonValidOk'));
body.appendChild(vd);
if(res.errors.length){
const ul=document.createElement('ul');ul.style.fontSize='.85rem';
res.errors.slice(0,8).forEach(e=>{const li=document.createElement('li');li.textContent=e.path+' — '+e.msg;ul.appendChild(li)});
body.appendChild(ul);
}
if(res.plan.warnings.length){
const h=document.createElement('h4');h.textContent=t('jsonWarnings')+' ('+res.plan.warnings.length+')';h.style.margin='.6rem 0 .2rem';body.appendChild(h);
const ul=document.createElement('ul');ul.style.fontSize='.85rem';ul.style.color='var(--mu)';
res.plan.warnings.slice(0,8).forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.appendChild(li)});
body.appendChild(ul);
}
const ph=document.createElement('h4');ph.textContent=t('jsonPreview');ph.style.margin='.7rem 0 .2rem';body.appendChild(ph);
const pre=document.createElement('pre');pre.className='jsonk-pre';
const txt=JSON.stringify(res.data,null,2);
pre.textContent=txt.length>4000?txt.slice(0,4000)+'\n…':txt;
body.appendChild(pre);
const sh=document.createElement('h4');sh.textContent='schema.json';sh.style.margin='.7rem 0 .2rem';body.appendChild(sh);
const spre=document.createElement('pre');spre.className='jsonk-pre';
const stxt=JSON.stringify(res.schema,null,2);
spre.textContent=stxt.length>3000?stxt.slice(0,3000)+'\n…':stxt;
body.appendChild(spre);
if(res.xml){
[['data.xml',res.xml],['schema.xsd',res.xsd]].forEach(([nm,txt])=>{
const h=document.createElement('h4');h.textContent=nm;h.style.margin='.7rem 0 .2rem';body.appendChild(h);
const pr=document.createElement('pre');pr.className='jsonk-pre';
pr.textContent=txt.length>3000?txt.slice(0,3000)+'\n…':txt;body.appendChild(pr);
});
}

buttons.push({label:'← '+t('back'),action:()=>{jsonWiz.step=3;renderJsonWiz()}});
buttons.push({label:t('jsonProfileSave'),action:()=>{
const nm=prompt(t('jsonProfileName'),state.data.projectName||'JSON');
if(!nm||!nm.trim())return;
const store=Object.assign({},cfg);
state.data.jsonExports=state.data.jsonExports||[];
state.data.jsonExports.push({id:uid('jx'),name:nm.trim(),cfg:store});
setDirty(true);toast(t('jsonProfileSaved',{name:nm.trim()}));
}});
buttons.push({label:'⤓ '+t('jsonDownload'),primary:true,action:()=>{
if(cfg.persistKeys){const n=persistJsonKeys(res.plan,cfg);if(n)toast(t('jsonKeysSaved',{n:n}))}
downloadJsonExportZip(res,cfg);
closeDialog();
}});
}

/* INIT + EVENTS */
function init(){
if('serviceWorker' in navigator){
navigator.serviceWorker.getRegistrations().then(regs=>{
if(regs.length){
dbg('Cleaning up stale Service Worker(s)…');
return Promise.all(regs.map(r=>r.unregister())).then(()=>{
if('caches' in window){return caches.keys().then(ns=>Promise.all(ns.map(n=>caches.delete(n))))}
}).then(()=>{location.reload()});
}
bootstrap();
}).catch(bootstrap);
}else{bootstrap()}
}
/* =============================================================
   STANDALONE WINDOW
   Open an entity in a new browser window, minimal chrome.
   Data handoff via localStorage; live sync via BroadcastChannel.
   ============================================================= */

const SK_HANDOFF_PREFIX='dkm-handoff-';
const ORIGIN_ID=Math.random().toString(36).slice(2)+Date.now().toString(36);
let bcSync=null;

function openEntityStandalone(entity){
if(!entity)return;
const key=SK_HANDOFF_PREFIX+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
try{localStorage.setItem(key,JSON.stringify({data:state.data,ts:Date.now()}))}catch(e){dbg('Standalone handoff save failed: '+e.message,true);toast(t('standaloneHandoffFailed'));return}
const url=new URL(location.href);
url.hash='#entity/'+entity.id;
url.searchParams.set('h',key);
url.searchParams.set('standalone','1');
const w=window.open(url.toString(),'_blank','width=1000,height=800,menubar=no,toolbar=no,location=yes');
if(!w){toast(t('standalonePopupBlocked'));try{localStorage.removeItem(key)}catch(e){}return}
w.focus();
toast(t('standaloneOpened'));
}

function initBroadcastSync(){
if(typeof BroadcastChannel==='undefined')return;
try{bcSync=new BroadcastChannel('dkm-sync');
bcSync.onmessage=ev=>{
if(!ev.data||ev.data.from===ORIGIN_ID)return;
if(ev.data.type==='data-updated'&&ev.data.data){
if(state.view.name==='edit'||state.view.name==='new'){showSyncBanner();return}
state.data=mergeEmpty(ev.data.data);snapshotBaseline();state.dirty=false;setDirty(false);render();
}
if(ev.data.type==='request-sync'){bcSync.postMessage({type:'data-updated',data:state.data,from:ORIGIN_ID})}
};
}catch(e){dbg('BroadcastChannel init failed: '+e.message,true)}
}
function broadcastDataChange(){if(bcSync)try{bcSync.postMessage({type:'data-updated',data:state.data,from:ORIGIN_ID})}catch(e){}}
function requestInitSync(){if(bcSync)try{bcSync.postMessage({type:'request-sync',from:ORIGIN_ID})}catch(e){}}

function showSyncBanner(){
if(document.getElementById('sync-banner'))return;
const b=document.createElement('div');b.id='sync-banner';b.className='sync-banner';
const msg=document.createElement('span');msg.textContent=t('syncOtherWindowChanged');b.appendChild(msg);
const btn=document.createElement('button');btn.type='button';btn.className='btn btn-sm';btn.textContent=t('syncApply');
btn.addEventListener('click',()=>{requestInitSync();b.remove()});
b.appendChild(btn);
const dismiss=document.createElement('button');dismiss.type='button';dismiss.className='btn btn-sm';dismiss.textContent='×';dismiss.setAttribute('aria-label',t('close'));
dismiss.addEventListener('click',()=>b.remove());
b.appendChild(dismiss);
document.body.appendChild(b);
}

function isStandalone(){try{return new URLSearchParams(location.search).get('standalone')==='1'}catch(e){return false}}

function consumeHandoff(){
try{
const key=new URLSearchParams(location.search).get('h');
if(!key||key.indexOf(SK_HANDOFF_PREFIX)!==0)return false;
const raw=localStorage.getItem(key);if(!raw)return false;
const parsed=JSON.parse(raw);if(!parsed||!parsed.data||!Array.isArray(parsed.data.entities))return false;
state.data=mergeEmpty(parsed.data);state.dirty=false;
try{localStorage.removeItem(key)}catch(e){}
return true;
}catch(e){dbg('Handoff consume failed: '+e.message,true);return false}
}

/* =============================================================
   END STANDALONE
   ============================================================= */

function bootstrap(){
const handoffApplied=consumeHandoff();
if(!handoffApplied)loadLS();
snapshotBaseline();
state.view=Object.assign({name:'list',tab:'inbox',entityId:null,settingsTab:'project',settingsItemId:null,edit:null,typeId:null},parseHash());
if(state.showDebug)document.getElementById('dbg').hidden=false;
if(isStandalone())document.body.classList.add('standalone-mode');
initBroadcastSync();
setupEvents();
/* Bez adresy se otevře záložka označená jako výchozí, jinak první v liště.
   Musí to být až po setupEvents — `navigateTo` počítá s hotovým `hashchange`. */
const zVychozi=(!location.hash&&!isStandalone())?vychoziZalozka():null;
if(zVychozi)otevriZalozku(zVychozi);else render();
if(!handoffApplied&&!isStandalone())autoLoadFromUrlParams();
if(isStandalone())requestInitSync();
}
function setupEvents(){
document.getElementById('b-load').addEventListener('click',()=>{document.getElementById('fin').click()});
document.getElementById('ind').addEventListener('click',openDiffDialog);
document.getElementById('b-clip-in').addEventListener('click',loadProjectFromClipboard);
document.getElementById('b-clip-out').addEventListener('click',copyProjectToClipboard);
document.getElementById('fin').addEventListener('change',ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;loadFile(f);ev.target.value=''});
document.getElementById('b-save').addEventListener('click',smartSave);
document.getElementById('b-exp').addEventListener('click',()=>openExportHub(bulkSelectedEntities()));
document.getElementById('b-imp').addEventListener('click',openImportTSVDialog);
document.getElementById('b-cmdp').addEventListener('click',openCommandPalette);
document.getElementById('b-set').addEventListener('click',()=>navigateTo({name:'settings',settingsTab:state.view.settingsTab||'project'}));
initCustomizeMenu();
document.addEventListener('pointerdown',primeAudio,{once:true});
document.addEventListener('keydown',primeAudio,{once:true});
document.getElementById('dbg-x').addEventListener('click',()=>{state.showDebug=false;localStorage.setItem(SK_DBG,'false');document.getElementById('dbg').hidden=true});
document.getElementById('dbg-clr').addEventListener('click',()=>{document.getElementById('dbg-c').innerHTML=''});
document.addEventListener('keydown',ev=>{
const tg=ev.target;
const isInput=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
const dlg=document.getElementById('dlg');
const dlgOpen=dlg&&(dlg.hasAttribute('open')||dlg.open);
/* Ctrl/Cmd shortcuts work everywhere */
if((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&!ev.altKey&&ctrlKlavesa(ev,'o')){ev.preventDefault();loadProjectFromClipboard();return}
if((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&!ev.altKey&&ctrlKlavesa(ev,'s')){ev.preventDefault();copyProjectToClipboard();return}
/* Ctrl+P necháváme prohlížeči na tisk — paleta je na Ctrl+Shift+P a na F1.
   Nad otevřeným dialogem se neotevírá: aplikace má jen jeden `<dialog>` a příkaz
   z palety by ho rozbil. */
if((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&!ev.altKey&&ctrlKlavesa(ev,'p')){if(dlgOpen)return;ev.preventDefault();openCommandPalette();return}
if(ev.key==='F1'){if(dlgOpen)return;ev.preventDefault();
if(ev.shiftKey)navigateTo({name:'settings',settingsTab:'help'});
else openCommandPalette();
return}
if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&!ev.shiftKey&&ctrlKlavesa(ev,'t')){ev.preventDefault();addPanel();return}
if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&!ev.shiftKey&&ctrlKlavesa(ev,'w')){if(state.panels&&state.panels.length>1){ev.preventDefault();closePanel(state.activePanel)}return}
if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&!ev.shiftKey&&ctrlKlavesa(ev,'s')){ev.preventDefault();smartSave();return}
if((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&!ev.altKey&&ctrlKlavesa(ev,'f')){ev.preventDefault();if(state.view.name==='list'){state.filters.attrFilters=[];state.view.advFilterOpen=false;render()}return}
if((ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&!ev.altKey&&ctrlKlavesa(ev,'f')){ev.preventDefault();if(state.view.name!=='list')navigateTo({name:'list',tab:'all'});state.view.advFilterOpen=true;render();setTimeout(()=>{const sel=document.querySelectorAll('.advf-attr');if(!sel.length){state.filters.attrFilters=(state.filters.attrFilters||[]).concat([{scope:'system',scopeId:null,attrId:'name',op:'contains',value:''}]);render();setTimeout(()=>{const s2=document.querySelectorAll('.advf-attr');if(s2.length)s2[0].focus()},30);return}sel[0].focus()},50);return}
if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&ctrlKlavesa(ev,'k')){ev.preventDefault();focusSearch();return}
/* Alt-zkratky. Dřív visely na `accesskey` u tlačítek, takže platily jen tam,
   kde zrovna to tlačítko bylo — na detailu, v nastavení ani v Inboxu ne.
   Teď jsou na jednom místě a fungují všude (Firefox je bere jako Alt+Shift,
   proto se nekouká na shift). */
if(ev.altKey&&!ev.ctrlKey&&!ev.metaKey&&!dlgOpen){
const ak=altZnak(ev);
if(ak>='1'&&ak<='9'){
const zs=viditelneZalozky().filter(z=>z.kind!=='sep');
const z=zs[Number(ak)-1];
if(z&&zalozkaCilOk(z)){ev.preventDefault();otevriZalozku(z);return}
}
switch(ak){
case'l':ev.preventDefault();document.getElementById('fin').click();return;
case's':ev.preventDefault();smartSave();return;
case'n':ev.preventDefault();novaEntitaZkratka();return;
case'a':ev.preventDefault();navigateTo({name:'list',tab:'all'});return;
case'b':ev.preventDefault();goBackSkipEdits();return;
case'r':{if(state.view.name!=='detail'||!state.view.entityId)break;
const ent=findEntity(state.view.entityId);
if(ent&&!ent.archived){ev.preventDefault();openAddRelDialog(ent,null)}
break}
case'u':if(state.view.name==='edit'){ev.preventDefault();commitEdit()}break;
}
}
/* Escape works everywhere */
if(ev.key==='Escape'){if(dlgOpen){closeDialog();return}if(state.bulk.active&&state.view.name==='list'){state.bulk.active=false;state.bulk.selected.clear();state.bulk.actionId='';render();return}if(state.view.name==='detail'||state.view.name==='edit'||state.view.name==='new'||state.view.name==='settings'){if(history.length>1)history.back();else navigateTo({name:'list',tab:'inbox'})}return}
/* Letter shortcuts only when not typing and no dialog open */
if(isInput||dlgOpen)return;
if(ev.altKey||ev.ctrlKey||ev.metaKey)return;
const k=ev.key.toLowerCase();
switch(k){
case's':ev.preventDefault();smartSave();break;
case'i':ev.preventDefault();navigateTo({name:'list',tab:'inbox'});break;
case'q':ev.preventDefault();focusQuickAdd();break;
case'n':ev.preventDefault();novaEntitaZkratka();break;
case'a':ev.preventDefault();navigateTo({name:'list',tab:'all'});break;
case'e':if(state.view.name==='detail'&&state.view.entityId){ev.preventDefault();navigateTo({name:'edit',entityId:state.view.entityId})}break;
case'v':if(state.view.name==='list'){ev.preventDefault();state.bulk.active=!state.bulk.active;if(!state.bulk.active){state.bulk.selected.clear();state.bulk.actionId=''}render()}break;
case'r':if(state.view.name==='detail'&&state.view.entityId){const ent=findEntity(state.view.entityId);if(ent&&!ent.archived){ev.preventDefault();openAddRelDialog(ent,null)}}break;
case'c':if(state.view.name==='detail'){ev.preventDefault();fokusNovyKomentar()}break;
case'u':if(state.view.name==='edit'){ev.preventDefault();commitEdit()}break;
case'f':ev.preventDefault();focusSearch();break;
case'/':ev.preventDefault();focusSearch();break;
}
});
window.addEventListener('beforeunload',ev=>{if(state.dirty&&!state.autosave){ev.preventDefault();ev.returnValue=''}});
}
init();


</script>
