}

function pumlEscape(s){return String(s||'').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ')}
function pumlAlias(idx){return 'E'+idx}
function pumlStereotype(ty){return ty?ty.name.replace(/[^A-Za-z0-9_\u00C0-\u017F]+/g,'_'):null}

function buildPlantuml(entities,opts){
const lines=[];
lines.push('@startuml');
lines.push('/* Generated by DKM — '+new Date().toISOString().slice(0,10)+' */');
lines.push('skinparam shadowing false');
lines.push('skinparam roundcorner 6');
if(opts.style==='class'){lines.push('skinparam class {\n  BackgroundColor #F8F9FA\n  BorderColor #6C757D\n  ArrowColor #6C757D\n}')}
if(opts.style==='component'){lines.push('skinparam component {\n  BackgroundColor #F8F9FA\n  BorderColor #6C757D\n}')}
lines.push('');
const idToAlias=new Map();entities.forEach((e,i)=>idToAlias.set(e.id,pumlAlias(i)));
/* Add external targets if needed */
if(opts.includeExternal){
const externals=new Set();
entities.forEach(e=>{
(e.relations||[]).forEach(r=>{if(!idToAlias.has(r.targetId)&&findEntity(r.targetId))externals.add(r.targetId)});
if(opts.includeAttrRel&&e.attributes){getAllAttrDefsForEntity(e).forEach(def=>{if(def.type!=='relation')return;const v=e.attributes[def.id];if(v==null||v==='')return;const ids=Array.isArray(v)?v:[v];ids.forEach(id=>{if(!idToAlias.has(id)&&findEntity(id))externals.add(id)})})}
});
const startIdx=entities.length;let j=0;externals.forEach(id=>{idToAlias.set(id,'X'+j);j++})}
/* Render entities */
entities.forEach(e=>{
const alias=idToAlias.get(e.id);
const ty=e.typeId?findType(e.typeId):null;
const label=pumlEscape(getTitle(e));
const st=pumlStereotype(ty);
if(opts.style==='class'){
const stTag=st?' <<'+st+'>>':'';
if(opts.includeAttrs){
const attrLines=[];
if(ty)ty.attributes.forEach(a=>{const v=e.attributes&&e.attributes[a.id];if(v==null||v==='')return;if(a.type==='relation')return;attrLines.push('  '+pumlEscape(a.name)+': '+pumlEscape(fmtAttrForPuml(a,v)))});
(e.aspects||[]).forEach(aid=>{const asp=findAspect(aid);if(!asp)return;(asp.attributes||[]).forEach(a=>{const v=e.attributes&&e.attributes[a.id];if(v==null||v==='')return;if(a.type==='relation')return;attrLines.push('  ~'+pumlEscape(a.name)+': '+pumlEscape(fmtAttrForPuml(a,v)))})});
if(attrLines.length){lines.push('class "'+label+'" as '+alias+stTag+' {');attrLines.forEach(l=>lines.push(l));lines.push('}')}
else lines.push('class "'+label+'" as '+alias+stTag);
}else lines.push('class "'+label+'" as '+alias+stTag);
}
else if(opts.style==='component'){lines.push('component "'+label+'" as '+alias+(st?' <<'+st+'>>':''))}
else if(opts.style==='usecase'){lines.push('usecase "'+label+'" as '+alias+(st?' <<'+st+'>>':''))}
});
/* External nodes rendered as plain */
if(opts.includeExternal){
idToAlias.forEach((alias,id)=>{if(alias.charAt(0)!=='X')return;const e=findEntity(id);if(!e)return;const label=pumlEscape(getTitle(e));
const kw=opts.style==='class'?'class':opts.style==='component'?'component':'usecase';
lines.push(kw+' "'+label+'" as '+alias+' <<external>> #EEE');
})}
lines.push('');
/* Render relations */
const seen=new Set();
entities.forEach(e=>{
const from=idToAlias.get(e.id);if(!from)return;
(e.relations||[]).forEach(r=>{
const tgt=idToAlias.get(r.targetId);if(!tgt)return;
const rt=findRT(r.relationTypeId);const label=rt?rt.name:'';
const key=from+'|'+tgt+'|'+label;if(seen.has(key))return;seen.add(key);
lines.push(from+' --> '+tgt+(label?' : '+pumlEscape(label):''));
});
if(opts.includeAttrRel&&e.attributes){
getAllAttrDefsForEntity(e).forEach(def=>{
if(def.type!=='relation')return;
const v=e.attributes[def.id];if(v==null||v==='')return;
const ids=Array.isArray(v)?v:[v];
ids.forEach(id=>{const tgt=idToAlias.get(id);if(!tgt)return;const key=from+'|'+tgt+'|attr:'+def.id;if(seen.has(key))return;seen.add(key);
lines.push(from+' ..> '+tgt+' : '+pumlEscape(def.name));
});
});
}
});
lines.push('');lines.push('@enduml');
return lines.join('\n');
}

function fmtAttrForPuml(a,v){
if(a.type==='date')return fmtDate(v);
if(a.type==='tags')return tagValueArr(v).slice().sort(porovnejNazvy).join(', ');
if(a.type==='yesno')return v?t('yes'):t('no');
if(a.type==='relation'){const ids=Array.isArray(v)?v:[v];return ids.map(id=>{const e=findEntity(id);return e?getTitle(e):id}).sort(porovnejNazvy).join(', ')}
if(a.type==='textarea')return String(v||'').replace(/[\r\n]+/g,' ').slice(0,60)+(String(v||'').length>60?'…':'');
return String(v==null?'':v).slice(0,80);
}

function doMerge(ents,targetId,strategy,after){
const target=ents.find(e=>e.id===targetId);
if(!target){toast(t('bulkMergeTargetMissing'));return}
const others=ents.filter(e=>e.id!==targetId);
if(!others.length){closeDialog();return}
const removedIds=new Set(others.map(e=>e.id));
/* 1) Move attributes from others into target with conflict strategy */
others.forEach(o=>{
Object.keys(o.attributes||{}).forEach(k=>{
const ov=o.attributes[k];if(ov==null||ov==='')return;
const cur=target.attributes&&target.attributes[k];
if(cur==null||cur===''){target.attributes=target.attributes||{};target.attributes[k]=ov;return}
if(strategy==='overwrite'){target.attributes[k]=ov;return}
if(strategy==='concat'){
if(Array.isArray(cur)||Array.isArray(ov)){const a=Array.isArray(cur)?cur:[cur];const b=Array.isArray(ov)?ov:[ov];target.attributes[k]=Array.from(new Set(a.concat(b)))}
else if(typeof cur==='string'&&typeof ov==='string'){target.attributes[k]=cur+'\n\n'+ov}
/* Else keep target */
}
/* 'keep' strategy: no action */
});
});
/* 2) Union aspects */
const aspSet=new Set(target.aspects||[]);
others.forEach(o=>(o.aspects||[]).forEach(a=>aspSet.add(a)));
target.aspects=Array.from(aspSet);
/* 3) Union custom attributes (by name) */
const caMap=new Map();(target.customAttributes||[]).forEach(ca=>caMap.set((ca.name||'').toLowerCase(),ca));
others.forEach(o=>(o.customAttributes||[]).forEach(ca=>{const k=(ca.name||'').toLowerCase();if(caMap.has(k)){const t2=caMap.get(k);if(strategy==='overwrite')t2.value=ca.value;else if(strategy==='concat'&&typeof t2.value==='string'&&typeof ca.value==='string')t2.value=t2.value+'\n\n'+ca.value}else{caMap.set(k,ca)}}));
target.customAttributes=Array.from(caMap.values());
/* 4) Move relations from others to target, dedupe */
const seen=new Set();(target.relations||[]).forEach(r=>seen.add((r.relationTypeId||'')+':'+r.targetId));
others.forEach(o=>(o.relations||[]).forEach(r=>{
if(removedIds.has(r.targetId))return;/* skip self-refs to be-deleted */
const k=(r.relationTypeId||'')+':'+r.targetId;if(seen.has(k))return;
seen.add(k);target.relations=target.relations||[];target.relations.push({id:uid('r'),relationTypeId:r.relationTypeId,targetId:r.targetId});
}));
/* 5) Redirect inbound relations from other entities to point at target */
state.data.entities.forEach(x=>{
if(x.id===target.id||removedIds.has(x.id))return;
if(x.relations){const seenX=new Set();const kept=[];x.relations.forEach(r=>{const newTgt=removedIds.has(r.targetId)?target.id:r.targetId;if(newTgt===x.id)return;/* skip self-loop */const key=(r.relationTypeId||'')+':'+newTgt;if(seenX.has(key))return;seenX.add(key);kept.push({id:r.id,relationTypeId:r.relationTypeId,targetId:newTgt})});x.relations=kept}
/* Attribute-relation redirects */
if(x.attributes){
getAllAttrDefsForEntity(x).forEach(def=>{
if(def.type!=='relation')return;
const v=x.attributes[def.id];if(v==null||v==='')return;
if(Array.isArray(v)){const set=new Set();v.forEach(id=>set.add(removedIds.has(id)?target.id:id));set.delete(x.id);x.attributes[def.id]=Array.from(set)}
else{const newV=removedIds.has(v)?target.id:v;x.attributes[def.id]=newV===x.id?'':newV}
});
}
});
/* 6) Delete the others */
state.data.entities=state.data.entities.filter(e=>!removedIds.has(e.id));
/* 7) Update target timestamp; navigate to it */
target.updatedAt=new Date().toISOString();
state.bulk.selected.clear();state.bulk.actionId='';state.bulk.active=false;
setDirty(true);closeDialog();
toast(t('bulkMergeDone',{n:others.length}));
/* Odjinud než ze seznamu se hodí zůstat, kde uživatel byl. */
if(after)after();else navigateTo({name:'detail',entityId:target.id});
}

function expandSelection(ids,scope){
const set=new Set(ids);
if(scope==='selected')return set;
const all=state.data.entities;
const byId=new Map();all.forEach(e=>byId.set(e.id,e));
const addNeighbors=(id)=>{
const e=byId.get(id);if(!e)return;
(e.relations||[]).forEach(r=>{if(byId.has(r.targetId))set.add(r.targetId)});
all.forEach(other=>{if(other.id===id)return;(other.relations||[]).forEach(r=>{if(r.targetId===id)set.add(other.id)})});
};
if(scope==='neighbors'){Array.from(ids).forEach(addNeighbors);return set}
if(scope==='component'){
const q=Array.from(ids);
while(q.length){const id=q.shift();const before=set.size;addNeighbors(id);if(set.size>before){set.forEach(x=>{if(q.indexOf(x)<0&&ids.indexOf(x)<0)q.push(x)})}}
return set;
}
return set;
}

function parsePackage(text){

if(obj.format!=='dkmpkg')return{ok:false,error:'Wrong format (expected dkmpkg)'};
if(!obj.model||!Array.isArray(obj.entities))return{ok:false,error:'Missing model or entities'};
obj.model.entityTypes=obj.model.entityTypes||[];
obj.model.aspects=obj.model.aspects||[];
obj.model.relationTypes=obj.model.relationTypes||[];
obj.model.selectLists=obj.model.selectLists||[];
obj.model.tagSets=obj.model.tagSets||[];
return{ok:true,pkg:obj};
}

/* Co se u kolidující entity liší proti tomu, co už v projektu je.
   Porovnává se podle názvů — mapování atributů je věc průvodce, tohle
   má jen dát uživateli podklad k rozhodnutí. */
function pkgConflictDiff(srcE,tgt){
const diff=[];
if(String(srcE.name||'').trim()!==String(tgt.name||'').trim())diff.push(t('entityName'));
const sTy=srcE.typeId?null:null;
const defs=getAllAttrDefsForEntity(tgt);
const byName=new Map();defs.forEach(d=>{if(d.name)byName.set(String(d.name).trim().toLowerCase(),d)});
Object.keys(srcE.attributes||{}).forEach(aid=>{
const sv=srcE.attributes[aid];
if(sv==null||sv==='')return;
/* Zdrojový atribut najdi podle názvu v balíčku. */
let sName='';
(pkg_findAttrName(srcE,aid)||[]).forEach(x=>{sName=x});
if(!sName)return;
const d=byName.get(sName.trim().toLowerCase());
if(!d){diff.push(sName);return}
const tv=tgt.attributes&&tgt.attributes[d.id];
if(JSON.stringify(tv==null?'':tv)!==JSON.stringify(sv))diff.push(sName);
});
if((srcE.relations||[]).length!==(tgt.relations||[]).length)diff.push(t('detailRelations'));
return diff;
}
let _pkgAttrNames=null;
function pkg_findAttrName(srcE,aid){
if(!_pkgAttrNames)return null;
const n=_pkgAttrNames.get(aid);
return n?[n]:null;
}
/* opts: {mode:'easy'|'detailed', byName:bool}
   Easy průvodce krok s konflikty vůbec neukazuje, takže tam musí být výchozí
   akce ta, kterou uživatel čeká: data z balíčku vyhrávají. */
function findEntityConflicts(pkg,opts){
opts=opts||{};
const easy=opts.mode==='easy';
const cur=new Map();state.data.entities.forEach(e=>cur.set(e.id,e));
/* Názvy atributů z modelu balíčku — kvůli porovnání podle názvu. */
_pkgAttrNames=new Map();
(pkg.model.entityTypes||[]).forEach(ty=>(ty.attributes||[]).forEach(a=>_pkgAttrNames.set(a.id,a.name||'')));
(pkg.model.aspects||[]).forEach(as=>(as.attributes||[]).forEach(a=>_pkgAttrNames.set(a.id,a.name||'')));
/* Párování podle názvu — jen v pokročilém režimu, pro balíčky z jiného projektu,
   kde si ID neodpovídají. Nejednoznačné názvy se přeskakují. */
let byName=null;
if(opts.byName){
byName=new Map();const kolize=new Set();
state.data.entities.forEach(e=>{
if(e.archived)return;
const k=dupeKey(getTitle(e),'loose');
if(!k)return;
if(byName.has(k))kolize.add(k);else byName.set(k,e);
});
kolize.forEach(k=>byName.delete(k));
}
const out=[];
/* Cíl, který si už vzala shoda podle ID, nesmí sebrat ještě shoda podle názvu. */
const zabrano=new Set();
pkg.entities.forEach(e=>{if(cur.has(e.id))zabrano.add(e.id)});
pkg.entities.forEach(e=>{
let tgt=cur.get(e.id);
let podleNazvu=false;
if(!tgt&&byName){
const k=dupeKey(getTitle(e),'loose');
const kand=k?byName.get(k):null;
if(kand&&!zabrano.has(kand.id)){tgt=kand;podleNazvu=true;zabrano.add(kand.id)}
}
if(!tgt)return;
const diff=pkgConflictDiff(e,tgt);
/* Beze změny se nemá co importovat; jinak doplnit, nikdy ne duplikovat. */
const akce=easy?(diff.length?'overwrite':'skip'):(diff.length?'merge':'skip');
out.push({srcId:e.id,tgtId:tgt.id,name:getTitle(e),diff:diff,same:diff.length===0,byName:podleNazvu,action:akce});
});
return out;
}

function simulateImport(pkg,mapping,conflicts){
const sim={newTypes:0,newAspects:0,newRT:0,newSL:0,newAttrs:0,reuseTypes:0,reuseAspects:0,entitiesNew:0,entitiesOverwrite:0,entitiesMerged:0,entitiesSkipped:0,relKept:0,relDropped:0,attrsDropped:0,warnings:[]};
Object.values(mapping.entityTypes).forEach(m=>{if(m.action==='create')sim.newTypes++;else if(m.action==='reuse')sim.reuseTypes++});
Object.values(mapping.aspects).forEach(m=>{if(m.action==='create')sim.newAspects++;else if(m.action==='reuse')sim.reuseAspects++});
Object.values(mapping.relationTypes).forEach(m=>{if(m.action==='create')sim.newRT++});
Object.values(mapping.selectLists).forEach(m=>{if(m.action==='create')sim.newSL++});
/* Attribute creation count */
pkg.model.entityTypes.forEach(srcTy=>{const m=mapping.entityTypes[srcTy.id];if(m.action==='reuse'){srcTy.attributes.forEach(a=>{if(m.attrMap[a.id]==='__new__')sim.newAttrs++})}});
pkg.model.aspects.forEach(srcAs=>{const m=mapping.aspects[srcAs.id];if(m.action==='reuse'){srcAs.attributes.forEach(a=>{if(m.attrMap[a.id]==='__new__')sim.newAttrs++})}});
const confMap={};conflicts.forEach(c=>confMap[c.srcId]=c);
pkg.entities.forEach(e=>{
const tyMap=e.typeId?mapping.entityTypes[e.typeId]:null;
if(tyMap&&tyMap.action==='skip'){sim.entitiesSkipped++;return}
const ca=(confMap[e.id]||{}).action;
if(ca==='skip'){sim.entitiesSkipped++;return}
if(ca==='overwrite')sim.entitiesOverwrite++;else if(ca==='merge')sim.entitiesMerged++;else sim.entitiesNew++;
/* relations */
(e.relations||[]).forEach(r=>{
const rtMap=mapping.relationTypes[r.relationTypeId];
if(!rtMap||rtMap.action==='skip'){sim.relDropped++;return}
sim.relKept++;
});
/* attribute drops */
if(e.typeId&&tyMap&&tyMap.action==='reuse'){Object.keys(e.attributes||{}).forEach(aid=>{
/* aid might be a type attr or aspect attr */
let mapped=tyMap.attrMap&&tyMap.attrMap[aid];
if(!mapped){(e.aspects||[]).forEach(asid=>{const am=mapping.aspects[asid];if(am&&am.action==='reuse'&&am.attrMap&&am.attrMap[aid])mapped=am.attrMap[aid]});if(!mapped){(e.aspects||[]).forEach(asid=>{const am=mapping.aspects[asid];if(am&&am.action==='create')mapped='__keep__'})}}
if(mapped==='__skip__')sim.attrsDropped++;
})}
});
/* Sanity warnings */
pkg.model.relationTypes.forEach(srcRt=>{const m=mapping.relationTypes[srcRt.id];if(m.action==='reuse'){const tgt=findRT(m.targetId);if(tgt&&srcRt.scope&&tgt.scope&&srcRt.scope!==tgt.scope)sim.warnings.push(t('pkgWarnRTScope',{src:srcRt.name,a:srcRt.scope,b:tgt.scope}))}});
return sim;
}

/* ----- Apply ----- */

function applyImport(pkg,mapping,conflicts,opts){
const now=new Date().toISOString();
const log={added:0,overwritten:0,merged:0,skipped:0,relKept:0,relDropped:0,attrsKept:0,attrsDropped:0,newTypes:0,newAspects:0,newRT:0,newSL:0,newTS:0,newAttrs:0};

/* 1) Select lists first (so attribute defs can reference them) */
const slIdMap={};
pkg.model.selectLists.forEach(srcSl=>{
const m=mapping.selectLists[srcSl.id];if(!m||m.action==='skip')return;
const srcVals=(srcSl.values||srcSl.options||[]).slice();
if(m.action==='create'){const ns={id:uid('l'),name:srcSl.name,values:srcVals};state.data.selectLists=state.data.selectLists||[];state.data.selectLists.push(ns);slIdMap[srcSl.id]=ns.id;log.newSL++}
else if(m.action==='merge'){const tgt=(state.data.selectLists||[]).find(x=>x.id===m.targetId);if(tgt){tgt.values=tgt.values||[];const have=new Set(tgt.values);srcVals.forEach(o=>{if(!have.has(o)){have.add(o);tgt.values.push(o)}});slIdMap[srcSl.id]=tgt.id}}
});

/* 1b) Soustavy tagů — musí být dřív než atributy, které na ně ukazují. */
const tsIdMap={};
(pkg.model.tagSets||[]).forEach(srcTs=>{
const m=mapping.tagSets&&mapping.tagSets[srcTs.id];if(!m||m.action==='skip')return;
const srcTags=(srcTs.tags||[]).slice();
if(m.action==='create'){const nt={id:uid('ts'),name:srcTs.name,tags:srcTags};state.data.tagSets=state.data.tagSets||[];state.data.tagSets.push(nt);tsIdMap[srcTs.id]=nt.id;log.newTS++}
else if(m.action==='merge'){const tgt=(state.data.tagSets||[]).find(x=>x.id===m.targetId);if(tgt){tgt.tags=tgt.tags||[];const have=new Set(tgt.tags);srcTags.forEach(o=>{if(!have.has(o)){have.add(o);tgt.tags.push(o)}});tsIdMap[srcTs.id]=tgt.id}}
});

/* 2) Relation types */
const rtIdMap={};
pkg.model.relationTypes.forEach(srcRt=>{
const m=mapping.relationTypes[srcRt.id];if(!m||m.action==='skip')return;
if(m.action==='create'){const nrt={id:uid('rt'),name:srcRt.name,inverseName:srcRt.inverseName||srcRt.name,scope:srcRt.scope||'universal',fromTypes:[],toTypes:[]};state.data.relationTypes.push(nrt);rtIdMap[srcRt.id]=nrt.id;log.newRT++}
else if(m.action==='reuse')rtIdMap[srcRt.id]=m.targetId;
});

/* 3) Entity types */
const tyIdMap={};
const attrIdMapByTy={};
pkg.model.entityTypes.forEach(srcTy=>{
const m=mapping.entityTypes[srcTy.id];if(!m||m.action==='skip')return;
if(m.action==='create'){
const nty={id:uid('ty'),name:srcTy.name,icon:srcTy.icon||'',attributes:[]};
const attrMap={};
srcTy.attributes.forEach(sa=>{
const na={id:uid('a'),name:sa.name,type:sa.type};
applyPkgAttrList(na,sa,slIdMap,tsIdMap);
if(sa.type==='relation'){if(sa.multi)na.multi=sa.multi;if(sa.relTypes)na.relTypes=sa.relTypes.slice()}
nty.attributes.push(na);attrMap[sa.id]=na.id;
});
state.data.entityTypes.push(nty);tyIdMap[srcTy.id]=nty.id;attrIdMapByTy[srcTy.id]=attrMap;log.newTypes++;
}else if(m.action==='reuse'){
tyIdMap[srcTy.id]=m.targetId;
const tgt=findType(m.targetId);
const attrMap={};
srcTy.attributes.forEach(sa=>{
const mapped=m.attrMap[sa.id];
if(mapped==='__skip__')return;
if(mapped==='__new__'){const na={id:uid('a'),name:sa.name,type:sa.type};applyPkgAttrList(na,sa,slIdMap,tsIdMap);tgt.attributes.push(na);attrMap[sa.id]=na.id;log.newAttrs++}
else attrMap[sa.id]=mapped;
});
attrIdMapByTy[srcTy.id]=attrMap;
}
});

/* 4) Aspects */
const aspIdMap={};
const attrIdMapByAsp={};
pkg.model.aspects.forEach(srcAs=>{
const m=mapping.aspects[srcAs.id];if(!m||m.action==='skip')return;
if(m.action==='create'){
const nas={id:uid('asp'),name:srcAs.name,attributes:[]};
const attrMap={};
srcAs.attributes.forEach(sa=>{const na={id:uid('a'),name:sa.name,type:sa.type};applyPkgAttrList(na,sa,slIdMap,tsIdMap);nas.attributes.push(na);attrMap[sa.id]=na.id});
state.data.aspects.push(nas);aspIdMap[srcAs.id]=nas.id;attrIdMapByAsp[srcAs.id]=attrMap;log.newAspects++;
}else if(m.action==='reuse'){
aspIdMap[srcAs.id]=m.targetId;
const tgt=findAspect(m.targetId);
const attrMap={};
srcAs.attributes.forEach(sa=>{
const mapped=m.attrMap[sa.id];
if(mapped==='__skip__')return;
if(mapped==='__new__'){const na={id:uid('a'),name:sa.name,type:sa.type};applyPkgAttrList(na,sa,slIdMap,tsIdMap);tgt.attributes.push(na);attrMap[sa.id]=na.id;log.newAttrs++}
else attrMap[sa.id]=mapped;
});
attrIdMapByAsp[srcAs.id]=attrMap;
}
});

/* Vlastní atributy si nesou vazbu na číselník i na soustavu tagů přímo v sobě.
   Po importu musí ukazovat na to, co v cílovém projektu opravdu vzniklo. */
function premapVlastniAtribut(ca){
if(ca.listId&&slIdMap[ca.listId])ca.listId=slIdMap[ca.listId];
if(ca.tagSetId&&tsIdMap[ca.tagSetId])ca.tagSetId=tsIdMap[ca.tagSetId];
return ca;
}

/* 5) Entities - first pass (create entities with new IDs, basic fields) */
const confMap={};conflicts.forEach(c=>confMap[c.srcId]=c);
const entIdMap={};
const overwriteEnts=new Set();
const mergeEnts=new Set();
pkg.entities.forEach(srcE=>{
const tyMap=srcE.typeId?mapping.entityTypes[srcE.typeId]:null;
if(tyMap&&tyMap.action==='skip'){log.skipped++;return}
const conf=confMap[srcE.id];
const ca=conf&&conf.action;
/* Při párování podle názvu má cíl jiné ID než zdroj. */
const confTgt=(conf&&conf.tgtId)?findEntity(conf.tgtId):null;
let target;
if(ca==='skip'){log.skipped++;return}
let merging=false;
if(ca==='overwrite'){target=confTgt||findEntity(srcE.id);if(!target){target={id:srcE.id,createdAt:now};state.data.entities.push(target)}entIdMap[srcE.id]=target.id;overwriteEnts.add(target.id);log.overwritten++}
else if(ca==='merge'&&(confTgt||findEntity(srcE.id))){target=confTgt||findEntity(srcE.id);entIdMap[srcE.id]=target.id;merging=true;mergeEnts.add(target.id);log.merged++}
else{const newId=ca==='newId'||findEntity(srcE.id)?uid('e'):srcE.id;target={id:newId,createdAt:srcE.createdAt||now};state.data.entities.push(target);entIdMap[srcE.id]=newId;log.added++}
if(merging){
/* Sloučení nikdy nepřepisuje vyplněné — jen doplňuje, co v projektu chybí. */
if(!String(target.name||'').trim())target.name=srcE.name;
if(!target.typeId&&srcE.typeId)target.typeId=tyIdMap[srcE.typeId]||null;
const aspSet=new Set(target.aspects||[]);
(srcE.aspects||[]).forEach(a=>{const m=aspIdMap[a];if(m)aspSet.add(m)});
target.aspects=Array.from(aspSet);
const caByName=new Map();(target.customAttributes||[]).forEach(x=>caByName.set((x.name||'').trim().toLowerCase(),x));
(srcE.customAttributes||[]).forEach(x=>{const k=(x.name||'').trim().toLowerCase();if(k&&!caByName.has(k)){target.customAttributes=target.customAttributes||[];const c2=premapVlastniAtribut(JSON.parse(JSON.stringify(x)));caByName.set(k,c2);target.customAttributes.push(c2)}});
}else{
target.name=srcE.name;
target.typeId=srcE.typeId?(tyIdMap[srcE.typeId]||null):null;
target.inInbox=!!srcE.inInbox;
target.archived=!!srcE.archived;
target.aspects=(srcE.aspects||[]).map(a=>aspIdMap[a]).filter(Boolean);
target.customAttributes=(srcE.customAttributes||[]).map(ca=>premapVlastniAtribut(JSON.parse(JSON.stringify(ca))));
}
/* attributes */
const newAttrs={};
Object.keys(srcE.attributes||{}).forEach(aid=>{
let mapped=null;
if(srcE.typeId&&attrIdMapByTy[srcE.typeId]&&attrIdMapByTy[srcE.typeId][aid])mapped=attrIdMapByTy[srcE.typeId][aid];
if(!mapped){(srcE.aspects||[]).forEach(asid=>{if(attrIdMapByAsp[asid]&&attrIdMapByAsp[asid][aid])mapped=attrIdMapByAsp[asid][aid]})}
if(mapped){newAttrs[mapped]=srcE.attributes[aid];log.attrsKept++}else log.attrsDropped++;
});
if(merging){
target.attributes=target.attributes||{};
Object.keys(newAttrs).forEach(k=>{
const cur=target.attributes[k];
const prazdne=cur==null||cur===''||(Array.isArray(cur)&&!cur.length);
if(prazdne)target.attributes[k]=newAttrs[k];
});
target.relations=target.relations||[];/* stávající vazby zůstávají, druhý průchod doplní */
}else{
target.attributes=newAttrs;
target.relations=[];/* fill in 2nd pass */
}
target.updatedAt=now;
});

/* 6) Second pass — relations + relation-typed attribute values (map entity refs) */
pkg.entities.forEach(srcE=>{
const newId=entIdMap[srcE.id];if(!newId)return;
const target=findEntity(newId);if(!target)return;
const mam=new Set((target.relations||[]).map(r=>(r.relationTypeId||'')+':'+r.targetId));
(srcE.relations||[]).forEach(r=>{
const newRTId=rtIdMap[r.relationTypeId];if(!newRTId){log.relDropped++;return}
const newTargetId=entIdMap[r.targetId];if(!newTargetId){log.relDropped++;return}
const k=newRTId+':'+newTargetId;
if(mam.has(k))return;/* při sloučení nezakládej tutéž vazbu podruhé */
mam.add(k);
target.relations.push({id:uid('r'),relationTypeId:newRTId,targetId:newTargetId});
log.relKept++;
});
/* Remap relation-typed attribute values */
Object.keys(target.attributes||{}).forEach(aid=>{
const allAttrs=getAllAttrs(target);const def=allAttrs.find(x=>x.attr.id===aid);if(!def||def.attr.type!=='relation')return;
const v=target.attributes[aid];
if(Array.isArray(v))target.attributes[aid]=v.map(id=>entIdMap[id]||id).filter(id=>findEntity(id));
else if(v)target.attributes[aid]=entIdMap[v]||(findEntity(v)?v:'');
});
});

/* 7) Make new types/aspects visible as tabs if requested */
if(opts.showAsTabs){
state.data.settings=state.data.settings||{};
state.data.settings.tabs=zalozky();
const tb=state.data.settings.tabs;
pkg.model.entityTypes.forEach(srcTy=>{const m=mapping.entityTypes[srcTy.id];if(!m||m.action!=='create')return;
const nid=tyIdMap[srcTy.id];
if(nid&&!tb.some(z=>z.kind==='type'&&(z.typeIds||[]).indexOf(nid)>=0))tb.push(novaZalozka('type',{typeIds:[nid]}));});
pkg.model.aspects.forEach(srcAs=>{const m=mapping.aspects[srcAs.id];if(!m||m.action!=='create')return;
const nid=aspIdMap[srcAs.id];
if(nid&&!tb.some(z=>z.kind==='aspect'&&z.aspectId===nid))tb.push(novaZalozka('aspect',{aspectId:nid}));});
}

setDirty(true);
dbg('Package import done: '+JSON.stringify(log));
return log;
}

   Formats: copy MD, copy formatted (rich HTML), download MD, download DOCX, print/PDF

function openExportDialog(entity){
if(!entity)return;
/* Build default selection (everything on) */
const sel={
title:true,typeBadge:true,typeIcon:true,aspectBadges:true,statusBadges:true,
typeAttrs:{},aspectAttrs:{},customAttrs:true,
relationsOut:true,relationsIn:true,
comments:true,neighborComments:false,
metaId:false,metaTypeId:false,metaCreatedAt:true,metaUpdatedAt:true
};
if(entity.typeId){const ty=findType(entity.typeId);if(ty)(ty.attributes||[]).forEach(a=>{sel.typeAttrs[a.id]=true})}
(entity.aspects||[]).forEach(aid=>{const asp=findAspect(aid);if(!asp)return;sel.aspectAttrs[aid]={};(asp.attributes||[]).forEach(a=>{sel.aspectAttrs[aid][a.id]=true})});

const body=document.createElement('div');body.className='exp-dlg';

/* Section: Header */
function fieldset(legendText){const fs=document.createElement('fieldset');const lg=document.createElement('legend');lg.textContent=legendText;fs.appendChild(lg);return fs}
function cb(key,label,parent,checked){
const l=document.createElement('label');l.style.display='flex';l.style.gap='.4rem';l.style.alignItems='center';l.style.marginBottom='.2rem';l.style.cursor='pointer';
const i=document.createElement('input');i.type='checkbox';i.checked=checked;
i.addEventListener('change',()=>{const p=key.split('.');let obj=sel;for(let k=0;k<p.length-1;k++)obj=obj[p[k]];obj[p[p.length-1]]=i.checked});
l.appendChild(i);const s=document.createElement('span');s.textContent=label;l.appendChild(s);parent.appendChild(l);return i;
}

const fsHead=fieldset(t('expSecHeader'));

function countBacklinks(id){let n=0;state.data.entities.forEach(o=>{if(o.id===id)return;(o.relations||[]).forEach(r=>{if(r.targetId===id)n++})});return n}
function collectBacklinks(id){
const out=[];
getRelsTo(id).forEach(r=>{
const src=findEntity(r.sourceId);if(!src||src.archived)return;
let label;
if(r.kind==='attribute')label=(r.scopeLabel?r.scopeLabel+' / ':'')+r.attrName;
else{const rt=findRT(r.relationTypeId);label=rt?(rt.inverseName||rt.name):'?'}
out.push({from:src,relTypeName:label});
});
return out;
}

/* Build the abstract export model from entity+selection */
function buildExportModel(entity,sel){
const ty=entity.typeId?findType(entity.typeId):null;
const m={
title:sel.title?getTitle(entity):'',
typeIcon:sel.typeIcon&&ty&&ty.icon?ty.icon:'',
typeBadge:sel.typeBadge&&ty?ty.name:'',
aspectBadges:[],
statusBadges:[],
typeAttrs:[],
aspectAttrs:[],
customAttrs:[],
relationsOut:[],
relationsIn:[],
comments:[],
neighborComments:[],
meta:{},
};
if(sel.aspectBadges)(entity.aspects||[]).forEach(aid=>{const asp=findAspect(aid);if(asp)m.aspectBadges.push(asp.name)});
if(sel.statusBadges){if(entity.inInbox)m.statusBadges.push('📥 '+t('tabInbox'));if(entity.archived)m.statusBadges.push('📦 '+t('tabArchive'))}

if(ty)(ty.attributes||[]).forEach(a=>{
if(!sel.typeAttrs[a.id])return;
const v=entity.attributes&&entity.attributes[a.id];
if(v==null||v===''||(Array.isArray(v)&&!v.length))return;
m.typeAttrs.push({attr:a,value:v});
});
(entity.aspects||[]).forEach(aid=>{
const asp=findAspect(aid);if(!asp)return;
const grp={aspect:asp,items:[]};
(asp.attributes||[]).forEach(a=>{
if(!sel.aspectAttrs[aid]||!sel.aspectAttrs[aid][a.id])return;
const v=entity.attributes&&entity.attributes[a.id];
if(v==null||v===''||(Array.isArray(v)&&!v.length))return;
grp.items.push({attr:a,value:v});
});
if(grp.items.length)m.aspectAttrs.push(grp);
});
if(sel.customAttrs)(entity.customAttributes||[]).forEach(ca=>{if(ca.value==null||ca.value==='')return;m.customAttrs.push(ca)});

if(sel.relationsOut){
const byType=new Map();
(entity.relations||[]).forEach(r=>{
const rt=findRT(r.relationTypeId);const tgt=findEntity(r.targetId);if(!tgt||tgt.archived)return;
const k=rt?rt.name:'?';if(!byType.has(k))byType.set(k,{name:k,items:[]});
byType.get(k).items.push(tgt);
});
byType.forEach(g=>m.relationsOut.push(g));
}
if(sel.relationsIn){
const back=collectBacklinks(entity.id);
const byType=new Map();
back.forEach(b=>{const k=b.relTypeName;if(!byType.has(k))byType.set(k,{name:k,items:[]});byType.get(k).items.push(b.from)});
byType.forEach(g=>m.relationsIn.push(g));
}

if(sel.comments){
(entity.comments||[]).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).forEach(c=>m.comments.push(c));
}
if(sel.neighborComments){
collectNeighborComments(entity).forEach(grp=>{
m.neighborComments.push({entity:grp.entity,relationLabels:grp.relationLabels,comments:grp.comments.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))});
});
}

if(sel.metaTypeId&&ty)m.meta.type=ty.name;
if(sel.metaCreatedAt&&entity.createdAt)m.meta.createdAt=entity.createdAt;
if(sel.metaUpdatedAt&&entity.updatedAt)m.meta.updatedAt=entity.updatedAt;
if(sel.metaId)m.meta.id=entity.id;
return m;
}

/* ---------- Markdown renderer ---------- */

function renderExportMd(m){
const lines=[];
if(m.title){lines.push('# '+m.title);lines.push('')}
const badges=[];
if(m.typeBadge)badges.push('**'+m.typeBadge+'**');
m.statusBadges.forEach(b=>badges.push(b));
m.aspectBadges.forEach(b=>badges.push(b));
if(badges.length){lines.push(badges.join(' · '));lines.push('')}

/* Emit attribute: inline paragraph for scalars, bold label + block for textarea */
function emitAttr(attr,value){
if(attr.type==='textarea'){
lines.push('**'+attr.name+'**');lines.push('');
lines.push(String(value||''));lines.push('');
}else{
lines.push('**'+attr.name+':** '+mdAttrValue(attr,value));lines.push('');
}
}

if(m.typeAttrs.length){
const typeName=m.typeBadge||t('detailAttributes');
lines.push('## '+t('detailAttributesOf')+' '+typeName);lines.push('');
m.typeAttrs.forEach(({attr,value})=>emitAttr(attr,value));
}
m.aspectAttrs.forEach(grp=>{
lines.push('## '+t('detailAspect')+': '+grp.aspect.name);lines.push('');
grp.items.forEach(({attr,value})=>emitAttr(attr,value));
});
if(m.customAttrs.length){
lines.push('## '+t('customAttrs'));lines.push('');
m.customAttrs.forEach(ca=>emitAttr({name:ca.name||'',type:ca.type||'text'},ca.value));
}
if(m.relationsOut.length){
lines.push('## '+t('detailRelations'));lines.push('');
m.relationsOut.forEach(g=>{
g.items.forEach(e=>{const ty=e.typeId?findType(e.typeId):null;lines.push('- **'+g.name+':** '+getTitle(e)+(ty?' ('+ty.name+')':''))});
});
lines.push('');
}
if(m.relationsIn.length){
lines.push('## '+t('detailBacklinks'));lines.push('');
m.relationsIn.forEach(g=>{
g.items.forEach(e=>{const ty=e.typeId?findType(e.typeId):null;lines.push('- **'+g.name+':** '+getTitle(e)+(ty?' ('+ty.name+')':''))});
});
lines.push('');
}
if(m.comments&&m.comments.length){
lines.push('## '+t('detailComments'));lines.push('');
m.comments.forEach(c=>{
lines.push('**'+(c.author||t('commentAnonymous'))+'** — '+fmtDate(c.createdAt,true)+(c.editedAt?' _('+t('commentEdited')+')_':''));
lines.push('');
lines.push(c.content||'');
lines.push('');
});
}
if(m.neighborComments&&m.neighborComments.length){
lines.push('## '+t('detailNeighborComments'));lines.push('');
m.neighborComments.forEach(grp=>{
const ty=grp.entity.typeId?findType(grp.entity.typeId):null;
lines.push('### '+getTitle(grp.entity)+(ty?' ('+ty.name+')':''));
const labels=(grp.relationLabels||[]).slice(0,2);
if(labels.length)lines.push('*'+labels.join(', ')+'*');
lines.push('');
grp.comments.forEach(c=>{
lines.push('**'+(c.author||t('commentAnonymous'))+'** — '+fmtDate(c.createdAt,true)+(c.editedAt?' _('+t('commentEdited')+')_':''));
lines.push('');
lines.push(c.content||'');
lines.push('');
});
});
}
if(Object.keys(m.meta).length){
lines.push('---');lines.push('');
if(m.meta.type)lines.push('- '+t('sysType')+': '+m.meta.type);
if(m.meta.createdAt)lines.push('- '+t('created')+': '+fmtDate(m.meta.createdAt,true));
if(m.meta.updatedAt)lines.push('- '+t('updated')+': '+fmtDate(m.meta.updatedAt,true));
if(m.meta.id)lines.push('- ID: `'+m.meta.id+'`');
}
return lines.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

function mdAttrValue(attr,value){
if(attr.type==='yesno')return value?t('yes'):t('no');
if(attr.type==='tags')return tagValueArr(value).slice().sort(porovnejNazvy).join(', ');
if(attr.type==='date')return fmtDate(value);
if(attr.type==='url')return value?('<'+value+'>'):'';
if(attr.type==='relation'){
const ids=Array.isArray(value)?value:[value];
return ids.map(id=>{const e=findEntity(id);if(!e)return id;const ty=e.typeId?findType(e.typeId):null;return getTitle(e)+(ty?' ('+ty.name+')':'')}).sort(porovnejNazvy).join(', ');
}
if(attr.type==='textarea')return String(value||'');
return String(value==null?'':value);
}

/* Shift ATX headings (`# ` … `###### `) inside a Markdown block by N levels down, capped at 6 */
function shiftMdHeadings(text,offset){
if(!offset)return text;
return String(text||'').replace(/^(#{1,6})(?=\s)/gm,m=>{const n=Math.min(6,m.length+offset);return '#'.repeat(n)});
}

function htmlAttrValue(attr,value){
if(attr.type==='yesno')return value?esc(t('yes')):esc(t('no'));
if(attr.type==='tags')return tagValueArr(value).slice().sort(porovnejNazvy).map(x=>esc(x)).join(', ');
if(attr.type==='date')return esc(fmtDate(value));
if(attr.type==='url'){const u=String(value||'');return u?'<a href="'+esc(u)+'">'+esc(u)+'</a>':''}
if(attr.type==='relation'){const ids=Array.isArray(value)?value:[value];return ids.map(id=>{const e=findEntity(id);if(!e)return esc(id);const ty=e.typeId?findType(e.typeId):null;return esc(getTitle(e))+(ty?' <span class="exp-mu">('+esc(ty.name)+')</span>':'')}).sort(porovnejNazvy).join(', ')}
if(attr.type==='textarea'){return renderMdBlock(String(value||''))}
return esc(String(value==null?'':value));
}

/* Basic markdown → HTML for textarea attributes (bold, italic, code, links, lists) */
function renderMdBlock(text){
if(!text)return '';
let s=esc(text);
/* Code blocks first */
s=s.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c.replace(/^\n/,'').replace(/\n$/,'')+'</code></pre>');
/* Inline code */
s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
/* Bold, italic, strikethrough */
s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
/* Links */
s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
/* Headings */
s=s.replace(/^### (.+)$/gm,'<h4>$1</h4>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/^# (.+)$/gm,'<h2>$1</h2>');
/* CriticMarkup */
s=s.replace(/\{\+\+(.+?)\+\+\}/g,'<ins>$1</ins>');
s=s.replace(/\{--(.+?)--\}/g,'<del>$1</del>');
s=s.replace(/\{==(.+?)==\}/g,'<mark>$1</mark>');
s=s.replace(/\{&gt;&gt;(.+?)&lt;&lt;\}/g,'<span class="exp-cm">💬 $1</span>');
s=s.replace(/\{~~(.+?)~&gt;(.+?)~~\}/g,'<del>$1</del><ins>$2</ins>');
/* Paragraphs & line breaks */
const paras=s.split(/\n{2,}/).map(p=>{
p=p.trim();if(!p)return '';
if(p.match(/^<(h[1-6]|pre|ul|ol|blockquote)/))return p;
/* Unordered list */
if(p.match(/^([-*+]\s)/m)){const items=p.split(/\n/).filter(l=>l.match(/^([-*+]\s)/)).map(l=>'<li>'+l.replace(/^[-*+]\s/,'')+'</li>').join('');return '<ul>'+items+'</ul>'}
/* Ordered list */
if(p.match(/^\d+\.\s/m)){const items=p.split(/\n/).filter(l=>l.match(/^\d+\.\s/)).map(l=>'<li>'+l.replace(/^\d+\.\s/,'')+'</li>').join('');return '<ol>'+items+'</ol>'}
return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
});
return paras.join('\n');
}

/* ---------- Actions ---------- */

function copyExportMd(entity,sel){
const md=renderExportMd(buildExportModel(entity,sel));
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(md).then(()=>toast(t('expCopiedMd')),err=>{dbg('Copy MD failed: '+err.message);openTextFallback(md,t('expCopyMd'))});
}else openTextFallback(md,t('expCopyMd'));
}

function copyExportFormatted(entity,sel){
const model=buildExportModel(entity,sel);
const html=renderExportHtml(model,entity);
const md=renderExportMd(model);
const fullHtml='<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.4">'+html+'</div>';
if(navigator.clipboard&&window.ClipboardItem){
try{
const item=new ClipboardItem({'text/html':new Blob([fullHtml],{type:'text/html'}),'text/plain':new Blob([md],{type:'text/plain'})});
navigator.clipboard.write([item]).then(()=>toast(t('expCopiedFormatted')),err=>{dbg('Copy formatted failed: '+err.message);openTextFallback(md,t('expCopyFormatted'))});
return;
}catch(e){dbg('ClipboardItem failed: '+e.message)}
}
/* Fallback: just copy MD */
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(md).then(()=>toast(t('expCopiedMd')),()=>openTextFallback(md,t('expCopyFormatted')));
else openTextFallback(md,t('expCopyFormatted'));
}

function openTextFallback(text,title){

/* ---------- DOCX (self-contained, no CDN, no library) ---------- */

function escapeXml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}
function parseInlineForDocx(text) {
  const runs = [];
  let i = 0;
  function pushPlain(t, opts) {
    if (!t) return;
    runs.push(Object.assign({ text: t }, opts || {}));
  }
  while (i < text.length) {
    let m = text.slice(i).match(/^\[([^\]]+)\]\(([^)]+)\)/);
    if (m) { pushPlain(m[1], { link: m[2] }); i += m[0].length; continue; }
    m = text.slice(i).match(/^`([^`]+)`/);
    if (m) { pushPlain(m[1], { code: true }); i += m[0].length; continue; }
    m = text.slice(i).match(/^\*\*([^*]+)\*\*/);
    if (m) {
      const inner = parseInlineForDocx(m[1]);
      inner.forEach(r => runs.push(Object.assign({}, r, { bold: true })));
      i += m[0].length; continue;
    }
    m = text.slice(i).match(/^\*([^*]+)\*/);
    if (m) {
      const inner = parseInlineForDocx(m[1]);
      inner.forEach(r => runs.push(Object.assign({}, r, { italic: true })));
      i += m[0].length; continue;
    }
    m = text.slice(i).match(/^\{\+\+([^}]+)\+\+\}/);
    if (m) { pushPlain(m[1], { revInsert: true }); i += m[0].length; continue; }
    m = text.slice(i).match(/^\{~~([\s\S]+?)~>([\s\S]+?)~~\}/);
    if (m) { pushPlain(m[1], { revDelete: true }); pushPlain(m[2], { revInsert: true }); i += m[0].length; continue; }
    m = text.slice(i).match(/^\{--([^}]+)--\}/);
    if (m) { pushPlain(m[1], { revDelete: true }); i += m[0].length; continue; }
    m = text.slice(i).match(/^\{==([^}]+)==\}/);
    if (m) { pushPlain(m[1], { highlight: true }); i += m[0].length; continue; }
    m = text.slice(i).match(/^\{>>([^<]+)<<\}/);
    if (m) { pushPlain(m[1], { revComment: true }); i += m[0].length; continue; }
    m = text.slice(i).match(/^\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/);
    if (m) { pushPlain(m[2] || m[1], { italic: true }); i += m[0].length; continue; }
    m = text.slice(i).match(/^(https?:\/\/[^\s<>"',;)]+)/);
    if (m) { pushPlain(m[1], { link: m[1] }); i += m[0].length; continue; }
    pushPlain(text[i]);
    i++;
  }
  const merged = [];
  runs.forEach(r => {
    const last = merged[merged.length - 1];
    if (last && last.bold === r.bold && last.italic === r.italic && last.code === r.code &&
        last.underline === r.underline && last.strike === r.strike &&
        last.highlight === r.highlight && last.link === r.link &&
        last.revInsert === r.revInsert && last.revDelete === r.revDelete && last.revComment === r.revComment) {
      last.text += r.text;
    } else {
      merged.push(Object.assign({}, r));
    }
  });
  return merged;
}
function runsToParagraphXml(runs, opts) {
  opts = opts || {};
  const pPr = [];
  if (opts.style) pPr.push('<w:pStyle w:val="' + escapeXml(opts.style) + '"/>');
  if (opts.numId !== undefined) {
    pPr.push('<w:numPr><w:ilvl w:val="0"/><w:numId w:val="' + opts.numId + '"/></w:numPr>');
  }
  const pPrXml = pPr.length ? '<w:pPr>' + pPr.join('') + '</w:pPr>' : '';
  let runsXml = '';
  const _hyperlinkRels = opts._hyperlinkRels || [];
  // Globální counter pro revision IDs (sdílený přes všechny paragrafy v dokumentu)
  if (typeof window !== 'undefined') {
    if (window._docxRevIdCounter === undefined) window._docxRevIdCounter = 0;
  }
  function nextRevId() {
    if (typeof window !== 'undefined') {
      window._docxRevIdCounter = (window._docxRevIdCounter || 0) + 1;
      return window._docxRevIdCounter;
    }
    return 1;
  }
  const revAuthor = 'PIM CriticMarkup';
  const revDate = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  runs.forEach(r => {
    // CriticMarkup komentář – vložíme jako MS Word comment přes inline "💬 [text]" v poznámkové barvě
    // (skutečný DOCX comment vyžaduje samostatné comments.xml + references – přidáme později)
    if (r.revComment) {
      const rPr = '<w:rPr><w:i/><w:color w:val="C28A2E"/><w:shd w:val="clear" w:color="auto" w:fill="FFFBE0"/></w:rPr>';
      const t = '<w:t xml:space="preserve">[💬 ' + escapeXml(r.text) + ']</w:t>';
      runsXml += '<w:r>' + rPr + t + '</w:r>';
      return;
    }
    const rPr = [];
    if (r.bold) rPr.push('<w:b/>');
    if (r.italic) rPr.push('<w:i/>');
    if (r.underline) rPr.push('<w:u w:val="single"/>');
    if (r.strike) rPr.push('<w:strike/>');
    if (r.code) rPr.push('<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/><w:shd w:val="clear" w:color="auto" w:fill="EEEEEE"/>');
    if (r.highlight) rPr.push('<w:highlight w:val="yellow"/>');
    if (r.link) rPr.push('<w:rStyle w:val="Hyperlink"/>');
    const rPrXml = rPr.length ? '<w:rPr>' + rPr.join('') + '</w:rPr>' : '';
    // Word revize: <w:ins> pro vložení, <w:del> pro smazání. Mazaný text používá <w:delText> místo <w:t>.
    if (r.revInsert) {
      const id = nextRevId();
      const t = '<w:t xml:space="preserve">' + escapeXml(r.text) + '</w:t>';
      const runXml = '<w:r>' + rPrXml + t + '</w:r>';
      runsXml += '<w:ins w:id="' + id + '" w:author="' + escapeXml(revAuthor) + '" w:date="' + revDate + '">' + runXml + '</w:ins>';
      return;
    }
    if (r.revDelete) {
      const id = nextRevId();
      const t = '<w:delText xml:space="preserve">' + escapeXml(r.text) + '</w:delText>';
      const runXml = '<w:r>' + rPrXml + t + '</w:r>';
      runsXml += '<w:del w:id="' + id + '" w:author="' + escapeXml(revAuthor) + '" w:date="' + revDate + '">' + runXml + '</w:del>';
      return;
    }
    const t = '<w:t xml:space="preserve">' + escapeXml(r.text) + '</w:t>';
    const runXml = '<w:r>' + rPrXml + t + '</w:r>';
    if (r.link) {
      const relId = 'hL' + _hyperlinkRels.length;
      _hyperlinkRels.push({ id: relId, target: r.link });
      runsXml += '<w:hyperlink r:id="' + relId + '">' + runXml + '</w:hyperlink>';
    } else {
      runsXml += runXml;
    }
  });
  return '<w:p>' + pPrXml + runsXml + '</w:p>';
}
function renderMarkdownTableToDocx(lines, paras, hyperlinkRels) {
  // lines = ['| h1 | h2 |', '| --- | --- |', '| c1 | c2 |', ...]
  function parseRow(s) {
    let t = s.trim();
    if (t.startsWith('|')) t = t.slice(1);
    if (t.endsWith('|')) t = t.slice(0, -1);
    const cells = [];
    let cur = '';
    for (let k = 0; k < t.length; k++) {
      if (t[k] === '\\' && t[k + 1] === '|') { cur += '|'; k++; continue; }
      if (t[k] === '|') { cells.push(cur.trim()); cur = ''; continue; }
      cur += t[k];
    }
    cells.push(cur.trim());
    return cells;
  }
  const headers = parseRow(lines[0]);
  const dataRows = lines.slice(2).map(parseRow);
  const colCount = headers.length;
  if (colCount === 0) return;

  // Sestavit DOCX tabulku
  let xml = '<w:tbl>';
  // Vlastnosti tabulky – šířka 100% v dxa, border všude
  xml += '<w:tblPr>' +
    '<w:tblW w:w="5000" w:type="pct"/>' +
    '<w:tblBorders>' +
      '<w:top w:val="single" w:sz="4" w:space="0" w:color="888888"/>' +
      '<w:left w:val="single" w:sz="4" w:space="0" w:color="888888"/>' +
      '<w:bottom w:val="single" w:sz="4" w:space="0" w:color="888888"/>' +
      '<w:right w:val="single" w:sz="4" w:space="0" w:color="888888"/>' +
      '<w:insideH w:val="single" w:sz="4" w:space="0" w:color="888888"/>' +
      '<w:insideV w:val="single" w:sz="4" w:space="0" w:color="888888"/>' +
    '</w:tblBorders>' +
    '<w:tblLayout w:type="autofit"/>' +
  '</w:tblPr>';
  // Definice gridu (rovnoměrné rozdělení)
  xml += '<w:tblGrid>' + headers.map(() => '<w:gridCol w:w="1"/>').join('') + '</w:tblGrid>';

  function cellXml(text, isHeader) {
    const runs = parseInlineForDocx(text);
    const shading = isHeader ? '<w:shd w:val="clear" w:color="auto" w:fill="EEEEEE"/>' : '';
    // Vytvořit paragraph (přepoužít runsToParagraphXml, ale potřebujeme jen para uvnitř <w:tc>)
    // runsToParagraphXml vrací <w:p>...</w:p> včetně pPr, použijeme přímo.
    const para = runsToParagraphXml(
      isHeader ? runs.map(r => Object.assign({}, r, { bold: true })) : runs,
      { _hyperlinkRels: hyperlinkRels }
    );
    return '<w:tc>' +
      '<w:tcPr>' + shading + '</w:tcPr>' +
      para +
    '</w:tc>';
  }

  // Hlavička
  xml += '<w:tr><w:trPr><w:tblHeader/></w:trPr>';
  headers.forEach(h => { xml += cellXml(h, true); });
  xml += '</w:tr>';
  // Datové řádky
  dataRows.forEach(row => {
    xml += '<w:tr>';
    for (let i = 0; i < colCount; i++) {
      xml += cellXml(row[i] || '', false);
    }
    xml += '</w:tr>';
  });
  xml += '</w:tbl>';
  // Po tabulce přidat prázdný odstavec, jinak Word slévá další odstavec s tabulkou
  paras.push(xml);
  paras.push('<w:p/>');
}
function renderMarkdownBlocksToDocx(text, paras, hyperlinkRels, imageMap) {
  imageMap = imageMap || {};

    codeBlocks.push(c);
    return '\u0000CB' + (codeBlocks.length - 1) + '\u0000';
  });
  const blocks = text.split(/\n{2,}/);
  blocks.forEach(block => {
    block = block.replace(/\n+$/, '');

    const imgMatch = block.match(/^!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)$/);
    if (imgMatch) {
      const alt = imgMatch[1] || 'Obrázek';
      const url = imgMatch[2];
      const info = imageMap[url];
      if (info) {
        // EMU: 914400 na palec, 96 DPI → px * 9525. Omez šířku na ~600 px (stránka).
        const maxW = 600;
        let w = info.w || maxW, h = info.h || 400;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const emuW = w * 9525, emuH = h * 9525;

          docxImageDrawingXml(info.relId, info.imgId, emuW, emuH, alt) + '</w:p>');
        return;
      }
      // Obrázek se nepodařilo stáhnout → fallback odkaz
      paras.push(runsToParagraphXml([{ text: alt + ' (' + url + ')' }], { _hyperlinkRels: hyperlinkRels }));
      return;
    }
    const cm = block.match(/^\u0000CB(\d+)\u0000$/);
    if (cm) {
      const code = codeBlocks[Number(cm[1])];
      code.split('\n').forEach(line => {
        paras.push(runsToParagraphXml([{ text: line, code: true }], { _hyperlinkRels: hyperlinkRels }));
      });
      return;
    }
    // === Markdown TABULKA ===
    // Detekce: alespoň 2 řádky, druhý je separator (| --- | :---: |)
    const blockLines = block.split('\n');
    if (blockLines.length >= 2 &&
        /^\s*\|.*\|\s*$/.test(blockLines[0]) &&
        /^\s*\|[\s:|\-]+\|\s*$/.test(blockLines[1])) {
      // Všechny další řádky musí být také tabulkové
      const allRows = blockLines.every(l => /^\s*\|.*\|\s*$/.test(l));
      if (allRows) {
        renderMarkdownTableToDocx(blockLines, paras, hyperlinkRels);
        return;
      }
    }
    const h = block.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      const lvl = h[1].length;
      const runs = parseInlineForDocx(h[2]);
      paras.push(runsToParagraphXml(runs, { style: 'Heading' + lvl, _hyperlinkRels: hyperlinkRels }));
      return;
    }
    if (/^---+$/.test(block.trim())) {
      paras.push('<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="auto"/></w:pBdr></w:pPr></w:p>');
      return;
    }
    const lines = block.split('\n');
    if (lines.every(l => /^>\s?/.test(l))) {
      const innerText = lines.map(l => l.replace(/^>\s?/, '')).join(' ');
      const runs = parseInlineForDocx(innerText);
      paras.push(runsToParagraphXml(runs, { style: 'Quote', _hyperlinkRels: hyperlinkRels }));
      return;
    }
    if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
      lines.forEach(l => {
        const tm = l.match(/^(\s*[-*]\s+)\[([ xX])\]\s*(.*)$/);
        let textL, prefix = '';
        if (tm) {
          prefix = tm[2] === ' ' ? '☐ ' : '☑ ';
          textL = tm[3];
        } else {
          textL = l.replace(/^\s*[-*]\s+/, '');
        }
        const runs = parseInlineForDocx(prefix + textL);
        paras.push(runsToParagraphXml(runs, { numId: 1, _hyperlinkRels: hyperlinkRels }));
      });
      return;
    }
    if (lines.every(l => /^\s*\d+\.\s+/.test(l))) {
      lines.forEach(l => {
        const runs = parseInlineForDocx(l.replace(/^\s*\d+\.\s+/, ''));
        paras.push(runsToParagraphXml(runs, { numId: 2, _hyperlinkRels: hyperlinkRels }));
      });
      return;
    }
    const runs = parseInlineForDocx(block.replace(/\n/g, ' '));
    paras.push(runsToParagraphXml(runs, { _hyperlinkRels: hyperlinkRels }));
  });

    '<w:abstractNum w:abstractNumId="1"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum>' +
    '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>' +
    '<w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num>' +
    '</w:numbering>';
  let relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>';
  hyperlinkRels.forEach(h => {
    relsXml += '<Relationship Id="' + h.id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + escapeXml(h.target) + '" TargetMode="External"/>';
  });
  // Obrázky (embedded PNG)
  Object.keys(imageMap).forEach(url => {
    const info = imageMap[url];
    if (info && info.relId && info.fileName) {
      relsXml += '<Relationship Id="' + info.relId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/' + info.fileName + '"/>';
    }
  });
  relsXml += '</Relationships>';
  const rootRelsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';
  const contentTypesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Default Extension="png" ContentType="image/png"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>' +
    '</Types>';
  const zipFiles = [
    { name: '[Content_Types].xml', data: contentTypesXml },
    { name: '_rels/.rels', data: rootRelsXml },
    { name: 'word/_rels/document.xml.rels', data: relsXml },
    { name: 'word/document.xml', data: documentXml },
    { name: 'word/styles.xml', data: stylesXml },
    { name: 'word/numbering.xml', data: numberingXml }
  ];
  Object.keys(imageMap).forEach(url => {
    const info = imageMap[url];
    if (info && info.fileName && info.bytes) {
      zipFiles.push({ name: 'word/media/' + info.fileName, data: info.bytes });
    }
  });
  return makeZip(zipFiles);
}

function makeZip(files) {
  const encoder = new TextEncoder();
  const fileBlobs = [];
  const centralDir = [];
  let offset = 0;
  const crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = (c >>> 8) ^ crcTable[(c ^ bytes[i]) & 0xFF];
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  files.forEach(f => {
    const nameBytes = encoder.encode(f.name);
    const dataBytes = typeof f.data === 'string' ? encoder.encode(f.data) : f.data;
    const crc = crc32(dataBytes);
    const size = dataBytes.length;
    const lfh = new Uint8Array(30 + nameBytes.length);
    const lfhView = new DataView(lfh.buffer);
    lfhView.setUint32(0, 0x04034b50, true);
    lfhView.setUint16(4, 20, true);
    lfhView.setUint16(6, 0, true);
    lfhView.setUint16(8, 0, true);
    lfhView.setUint16(10, 0, true);
    lfhView.setUint16(12, 0, true);
    lfhView.setUint32(14, crc, true);
    lfhView.setUint32(18, size, true);
    lfhView.setUint32(22, size, true);
    lfhView.setUint16(26, nameBytes.length, true);
    lfhView.setUint16(28, 0, true);
    lfh.set(nameBytes, 30);
    fileBlobs.push(lfh);
    fileBlobs.push(dataBytes);
    const cdh = new Uint8Array(46 + nameBytes.length);
    const cdhView = new DataView(cdh.buffer);
    cdhView.setUint32(0, 0x02014b50, true);
    cdhView.setUint16(4, 20, true);
    cdhView.setUint16(6, 20, true);
    cdhView.setUint16(8, 0, true);
    cdhView.setUint16(10, 0, true);
    cdhView.setUint16(12, 0, true);
    cdhView.setUint16(14, 0, true);
    cdhView.setUint32(16, crc, true);
    cdhView.setUint32(20, size, true);
    cdhView.setUint32(24, size, true);
    cdhView.setUint16(28, nameBytes.length, true);
    cdhView.setUint16(30, 0, true);
    cdhView.setUint16(32, 0, true);
    cdhView.setUint16(34, 0, true);
    cdhView.setUint16(36, 0, true);
    cdhView.setUint32(38, 0, true);
    cdhView.setUint32(42, offset, true);
    cdh.set(nameBytes, 46);
    centralDir.push(cdh);
    offset += lfh.length + dataBytes.length;
  });
  const cdSize = centralDir.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const eocdView = new DataView(eocd.buffer);
  eocdView.setUint32(0, 0x06054b50, true);
  eocdView.setUint16(4, 0, true);
  eocdView.setUint16(6, 0, true);
  eocdView.setUint16(8, files.length, true);
  eocdView.setUint16(10, files.length, true);
  eocdView.setUint32(12, cdSize, true);
  eocdView.setUint32(16, offset, true);
  eocdView.setUint16(20, 0, true);
  return new Blob([...fileBlobs, ...centralDir, eocd], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

/* ============================================================
   DKM-specific: build DOCX from export model
   Uses PIM's markdown+CriticMarkup engine for real formatting.
   ============================================================ */

/* Vysází jeden model entity do odstavců DOCX. Sdílené hromadným i jednotlivým exportem.
   `off` posune úrovně nadpisů, aby při titulku dokumentu zůstal jediný Heading1. */
function emitEntityDocxParas(model,paras,hyperlinkRels,off){
const hd=n=>'Heading'+Math.min(6,n+(off||0));
function emitPara(runs,opts){paras.push(runsToParagraphXml(runs,Object.assign({_hyperlinkRels:hyperlinkRels},opts||{})))}
function emitBlock(md){renderMarkdownBlocksToDocx(String(md||''),paras,hyperlinkRels,{})}
function inlineRuns(text){return parseInlineForDocx(String(text||''))}

/* Title */
if(model.title)emitPara(inlineRuns(model.title),{style:hd(1)});

/* Badges */
const badges=[];
if(model.typeBadge)badges.push(model.typeBadge);
model.statusBadges.forEach(b=>badges.push(b));
model.aspectBadges.forEach(b=>badges.push(b));
if(badges.length)emitPara([{text:badges.join('  ·  '),italic:true}]);

function scalarValueStr(attr,value){
if(attr.type==='yesno')return value?t('yes'):t('no');
if(attr.type==='tags')return tagValueArr(value).slice().sort(porovnejNazvy).join(', ');
if(attr.type==='date')return fmtDate(value);
if(attr.type==='relation'){const ids=Array.isArray(value)?value:[value];return ids.map(id=>{const e=findEntity(id);if(!e)return id;const ty=e.typeId?findType(e.typeId):null;return getTitle(e)+(ty?' ('+ty.name+')':'')}).sort(porovnejNazvy).join(', ')}
if(attr.type==='url')return String(value||'');
return String(value==null?'':value);
}
function emitAttr(attr,value){
if(attr.type==='textarea'){
emitPara([{text:attr.name,bold:true}]);
emitBlock(String(value||''));
}else{
const label={text:attr.name+': ',bold:true};
const valueStr=scalarValueStr(attr,value);
const rest=inlineRuns(valueStr);
emitPara([label].concat(rest));
}
}

/* Type attributes */
if(model.typeAttrs.length){
const typeName=model.typeBadge||t('detailAttributes');
emitPara(inlineRuns(t('detailAttributesOf')+' '+typeName),{style:hd(2)});
model.typeAttrs.forEach(({attr,value})=>emitAttr(attr,value));
}
/* Aspect attributes */
model.aspectAttrs.forEach(grp=>{
emitPara(inlineRuns(t('detailAspect')+': '+grp.aspect.name),{style:hd(2)});
grp.items.forEach(({attr,value})=>emitAttr(attr,value));
});
/* Custom attributes */
if(model.customAttrs.length){
emitPara(inlineRuns(t('customAttrs')),{style:hd(2)});
model.customAttrs.forEach(ca=>emitAttr({name:ca.name||'',type:ca.type||'text'},ca.value));
}
/* Relations */
if(model.relationsOut.length){
emitPara(inlineRuns(t('detailRelations')),{style:hd(2)});
model.relationsOut.forEach(g=>{
g.items.forEach(e=>{const ty=e.typeId?findType(e.typeId):null;const label={text:g.name+': ',bold:true};const val={text:getTitle(e)+(ty?' ('+ty.name+')':'')};emitPara([label,val],{numId:1})});
});
}
/* Backlinks */
if(model.relationsIn.length){
emitPara(inlineRuns(t('detailBacklinks')),{style:hd(2)});
model.relationsIn.forEach(g=>{
g.items.forEach(e=>{const ty=e.typeId?findType(e.typeId):null;const label={text:g.name+': ',bold:true};const val={text:getTitle(e)+(ty?' ('+ty.name+')':'')};emitPara([label,val],{numId:1})});
});
}
/* Own comments */
if(model.comments&&model.comments.length){
emitPara(inlineRuns(t('detailComments')),{style:hd(2)});
model.comments.forEach(c=>{
emitPara([{text:(c.author||t('commentAnonymous'))+' — '+fmtDate(c.createdAt,true)+(c.editedAt?' ('+t('commentEdited')+')':''),italic:true}]);
emitBlock(String(c.content||''));
});
}
/* Neighbor comments */
if(model.neighborComments&&model.neighborComments.length){
emitPara(inlineRuns(t('detailNeighborComments')),{style:hd(2)});
model.neighborComments.forEach(grp=>{
const ty=grp.entity.typeId?findType(grp.entity.typeId):null;
emitPara(inlineRuns(getTitle(grp.entity)+(ty?' ('+ty.name+')':'')),{style:hd(3)});
const labels=(grp.relationLabels||[]).slice(0,2);
if(labels.length)emitPara([{text:labels.join(', '),italic:true}]);
grp.comments.forEach(c=>{
emitPara([{text:(c.author||t('commentAnonymous'))+' — '+fmtDate(c.createdAt,true)+(c.editedAt?' ('+t('commentEdited')+')':''),italic:true}]);
emitBlock(String(c.content||''));
});
});
}
/* Meta */
if(Object.keys(model.meta).length){
paras.push('<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="auto"/></w:pBdr></w:pPr></w:p>');
if(model.meta.type)emitPara([{text:t('sysType')+': ',bold:true},{text:model.meta.type}]);
if(model.meta.createdAt)emitPara([{text:t('created')+': ',bold:true},{text:fmtDate(model.meta.createdAt,true)}]);
if(model.meta.updatedAt)emitPara([{text:t('updated')+': ',bold:true},{text:fmtDate(model.meta.updatedAt,true)}]);
if(model.meta.id)emitPara([{text:'ID: ',bold:true},{text:model.meta.id,code:true}]);
}

}

function downloadExportDocx(entity,sel){return downloadExportDocxMulti([entity],sel,null)}

/* Jeden dokument z několika entit — mezi ně vkládá zalomení stránky. */
function downloadExportDocxMulti(entities,sel,docTitle){
try{
toast(t('expBuildingDocx'));
if(typeof window!=='undefined')window._docxRevIdCounter=0;
const paras=[];const hyperlinkRels=[];
if(docTitle)paras.push(runsToParagraphXml(parseInlineForDocx(String(docTitle)),{_hyperlinkRels:hyperlinkRels,style:'Heading1'}));
entities.forEach((e,i)=>{
if(i>0)paras.push('<w:p><w:r><w:br w:type="page"/></w:r></w:p>');
emitEntityDocxParas(buildExportModel(e,sel),paras,hyperlinkRels,docTitle?1:0);
});
const blob=buildDocxFile(paras.join(''),hyperlinkRels,{});
const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
a.download=(entities.length===1?safeFilename(docTitle||getTitle(entities[0])):bulkExportFilename(docTitle,entities))+'.docx';
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
toast(t('expDownloadedDocx'));
}catch(err){
dbg('DOCX build failed: '+err.message+' | '+err.stack,true);
toast(t('expDocxFailed')+': '+err.message);
}
}

function openCommandPalette(){
if(document.getElementById('cmdp'))return;
const overlay=document.createElement('div');overlay.id='cmdp';overlay.dataset.scr='dlgcmdpal';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label',t('cmdPalette'));
const box=document.createElement('div');box.className='cmdp-box';
const input=document.createElement('input');input.type='text';input.id='cmdp-in';input.className='cmdp-in';input.autocomplete='off';input.spellcheck=false;input.placeholder=t('cmdPalettePlaceholder');input.setAttribute('role','combobox');input.setAttribute('aria-expanded','true');input.setAttribute('aria-controls','cmdp-list');input.setAttribute('aria-autocomplete','list');
const list=document.createElement('ul');list.id='cmdp-list';list.className='cmdp-list';list.setAttribute('role','listbox');
const hint=document.createElement('div');hint.className='cmdp-hint';hint.textContent=t('cmdPaletteHint');
const hid=document.createElement('span');hid.className='scrid';hid.style.marginLeft='.6rem';hid.textContent='#dlgcmdpal';hid.setAttribute('aria-label',t('scrIdLabel')+': dlgcmdpal');hint.appendChild(hid);
box.appendChild(input);box.appendChild(list);box.appendChild(hint);
overlay.appendChild(box);document.body.appendChild(overlay);
let selectedIndex=0;
let candidates=[];
function close(){overlay.remove();document.removeEventListener('keydown',keyHandler,true)}
function updateSelectedAttr(){Array.from(list.children).forEach((li,i)=>{li.setAttribute('aria-selected',i===selectedIndex?'true':'false');if(i===selectedIndex&&li.scrollIntoView)li.scrollIntoView({block:'nearest'})});input.setAttribute('aria-activedescendant',list.children[selectedIndex]?list.children[selectedIndex].id:'')}
function renderList(){
list.innerHTML='';
candidates.forEach((c,i)=>{
const li=document.createElement('li');li.id='cmdp-o-'+i;li.setAttribute('role','option');li.className='cmdp-item';
const ic=document.createElement('span');ic.className='cmdp-ic';ic.setAttribute('aria-hidden','true');ic.textContent=c.icon||'';li.appendChild(ic);
const lb=document.createElement('span');lb.className='cmdp-lb';lb.textContent=c.label;li.appendChild(lb);
if(c.sublabel){const sl=document.createElement('span');sl.className='cmdp-sl';sl.textContent=c.sublabel;li.appendChild(sl)}
if(c.kbd){const kb=document.createElement('span');kb.className='cmdp-kbd';kb.textContent=c.kbd;li.appendChild(kb)}
li.addEventListener('click',()=>{run(i)});
list.appendChild(li);
});
selectedIndex=Math.min(selectedIndex,Math.max(0,candidates.length-1));
updateSelectedAttr();
}
function run(i){const c=candidates[i];if(!c)return;close();try{c.action()}catch(e){dbg('Cmd palette action failed: '+e.message,true)}}
function refresh(){candidates=fuzzyMatchCandidates(input.value,collectPaletteCandidates());renderList()}
function keyHandler(ev){
if(!document.getElementById('cmdp'))return;
if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();close();return}
if(ev.key==='ArrowDown'){ev.preventDefault();ev.stopPropagation();if(candidates.length){selectedIndex=(selectedIndex+1)%candidates.length;updateSelectedAttr()};return}
if(ev.key==='ArrowUp'){ev.preventDefault();ev.stopPropagation();if(candidates.length){selectedIndex=(selectedIndex-1+candidates.length)%candidates.length;updateSelectedAttr()};return}
if(ev.key==='Home'){ev.preventDefault();ev.stopPropagation();selectedIndex=0;updateSelectedAttr();return}
if(ev.key==='End'){ev.preventDefault();ev.stopPropagation();selectedIndex=Math.max(0,candidates.length-1);updateSelectedAttr();return}
if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();run(selectedIndex);return}
}
input.addEventListener('input',refresh);
document.addEventListener('keydown',keyHandler,true);
overlay.addEventListener('click',ev=>{if(ev.target===overlay)close()});
refresh();
setTimeout(()=>input.focus(),20);
}

/* Fuzzy match: all words of query must be substring of label+sublabel (case-insensitive). Score = shorter label wins ties */
function fuzzyMatchCandidates(query,all){
const q=(query||'').trim().toLowerCase();
if(!q){
/* Empty query: show recent nav history first, then a mix */
const hist=(state.navHistory||[]).slice().reverse();
const seenIds=new Set();
const priority=[];
hist.forEach(h=>{if(h.kind==='entity'&&!seenIds.has(h.id)){seenIds.add(h.id);const c=all.find(x=>x.entityId===h.id);if(c)priority.push(c)}});
const rest=all.filter(c=>!c.entityId||!seenIds.has(c.entityId));
return priority.concat(rest).slice(0,60);
}
const words=q.split(/\s+/).filter(Boolean);
const scored=[];
all.forEach(c=>{
const hay=((c.label||'')+' '+(c.sublabel||'')).toLowerCase();
if(!words.every(w=>hay.indexOf(w)>=0))return;
let score=0;
if(c.label.toLowerCase().indexOf(q)===0)score+=100;/* startsWith bonus */
if(c.label.toLowerCase()===q)score+=200;/* exact match */
score-=c.label.length;/* shorter wins */
scored.push({c:c,s:score});
});
scored.sort((a,b)=>b.s-a.s);
return scored.slice(0,60).map(x=>x.c);
}

/* =============================================================
   NABÍDKA WIKI ODKAZŮ PŘI ULOŽENÍ
   Při uložení entity se ve víceřádkových (Markdown) atributech hledají
   názvy jiných entit zapsané prostým textem a nabídnou se k převodu
   na wiki odkaz [[Název]]. Rozhoduje vždy uživatel — nic se nemění samo.
   ============================================================= */

const WIKI_MIN_NAME_LEN=3;   /* kratší názvy by trefovaly půlku textu */

function wikiSuggestEnabled(){return localStorage.getItem(SK_WIKISUGGEST)!=='false'}
function setWikiSuggestEnabled(v){try{localStorage.setItem(SK_WIKISUGGEST,v?'true':'false')}catch(e){dbg('Wiki suggest pref save failed: '+e.message,true)}}

/* Úseky, do kterých se nesmí sahat: existující wiki odkazy, kód, markdown odkazy a URL.
   Bez toho by se odkazovalo uvnitř `kódu` nebo se rozbil [text](url). */
function wikiProtectedRanges(text){
const out=[];
const pats=[/```[\s\S]*?```/g,/`[^`\n]*`/g,/\[\[[^\]\n]*\]\]/g,/!?\[[^\]\n]*\]\([^)\n]*\)/g,/<[^>\n]+>/g,/https?:\/\/\S+/g];
pats.forEach(re=>{let m;while((m=re.exec(text))!==null){out.push([m.index,m.index+m[0].length]);if(m[0]==='')re.lastIndex++}});
return out;
}
function wikiIsWordChar(ch){return !!ch&&/[\p{L}\p{N}_]/u.test(ch)}

/* Výskyty názvu v textu jako samostatného slova, mimo chráněné úseky a mimo už zabrané rozsahy. */
function wikiFindOccurrences(text,lowerText,name,protectedR,taken){
const needle=name.toLowerCase();
const out=[];
let from=0;
for(;;){
const i=lowerText.indexOf(needle,from);
if(i<0)break;
from=i+1;
const j=i+needle.length;
if(wikiIsWordChar(text[i-1])||wikiIsWordChar(text[j]))continue;
if(protectedR.some(([a,b])=>i<b&&j>a))continue;
if(taken.some(([a,b])=>i<b&&j>a))continue;
out.push({start:i,end:j,text:text.slice(i,j)});
}
return out;
}

/* Pole entity, která přicházejí v úvahu: víceřádkové atributy z typu, aspektů i vlastní. */
function wikiTextareaFields(e){
const out=[];
getAllAttrDefsForEntity(e).forEach(def=>{
if(def.type!=='textarea')return;
const v=e.attributes&&e.attributes[def.id];
if(typeof v!=='string'||!v.trim())return;
out.push({key:'attr:'+def.id,label:def.name,scope:def.scopeLabel,get:()=>e.attributes[def.id],set:v2=>{e.attributes[def.id]=v2}});
});
(e.customAttributes||[]).forEach(ca=>{
if(ca.type!=='textarea')return;
if(typeof ca.value!=='string'||!ca.value.trim())return;
out.push({key:'cattr:'+ca.id,label:ca.name||t('attributeName'),scope:'* '+t('customAttributes'),get:()=>ca.value,set:v2=>{ca.value=v2}});
});
return out;
}

/* Kandidáti na odkaz: pro každé pole seznam nalezených entit i s výskyty.
   Delší názvy mají přednost, aby „Rodné číslo“ nepřebilo obecnější „Číslo“. */
function findWikiCandidates(e){
const fields=wikiTextareaFields(e);
if(!fields.length)return[];
const names=state.data.entities
.filter(x=>x.id!==e.id&&!x.archived&&(getTitle(x)||'').trim().length>=WIKI_MIN_NAME_LEN)
.map(x=>({ent:x,name:getTitle(x).trim()}))
.sort((a,b)=>b.name.length-a.name.length);
const out=[];
fields.forEach(f=>{
const text=f.get();
const lower=text.toLowerCase();
const prot=wikiProtectedRanges(text);
const taken=[];
const rows=[];
names.forEach(({ent,name})=>{
const occ=wikiFindOccurrences(text,lower,name,prot,taken);
if(!occ.length)return;
occ.forEach(o=>taken.push([o.start,o.end]));
rows.push({entity:ent,name:name,occurrences:occ});
});
if(rows.length)out.push({field:f,rows:rows});
});
return out;
}

/* Vloží [[…]] kolem vybraných výskytů. Nahrazuje se odzadu, jinak by se posunuly indexy.
   Původní psaní se zachová — wiki odkaz se stejně dohledává bez ohledu na velikost písmen. */
function applyWikiCandidates(groups,selected){
let n=0;
groups.forEach(g=>{
const picks=[];
g.rows.forEach(r=>{if(selected.has(g.field.key+'|'+r.entity.id))picks.push(...r.occurrences)});
if(!picks.length)return;
picks.sort((a,b)=>b.start-a.start);
let text=g.field.get();
picks.forEach(o=>{text=text.slice(0,o.start)+'[['+o.text+']]'+text.slice(o.end);n++});
g.field.set(text);
});
return n;
}

/* Krátký výřez okolo prvního výskytu, ať je vidět kontext. */
function wikiSnippetEl(field,occ){
const text=field.get();
const from=Math.max(0,occ.start-40),to=Math.min(text.length,occ.end+40);
const wrap=document.createElement('div');wrap.className='wikis-snip';
const pre=(from>0?'…':'')+text.slice(from,occ.start).replace(/\s+/g,' ');
const post=text.slice(occ.end,to).replace(/\s+/g,' ')+(to<text.length?'…':'');
wrap.appendChild(document.createTextNode(pre));
const mk=document.createElement('mark');mk.textContent=occ.text;wrap.appendChild(mk);
wrap.appendChild(document.createTextNode(post));
return wrap;
}

/* =============================================================
   EXPORT VÍCE ENTIT DO JEDNOHO DOKUMENTU
   Stejné formáty jako u jedné entity (MD, formátované kopírování,
   DOCX, tisk), jen se modely entit poskládají za sebe. Výběr obsahu
   je společný: atributy se nabízejí po typech a aspektech, které se
   ve výběru skutečně vyskytly, a protože jsou id atributů jedinečná,
   projde stejná struktura `sel` beze změny do buildExportModel().
   ============================================================= */

/* „1 entita / 2 entity / 5 entit" — samotné „{n} entit" by u dvojky až čtyřky znělo špatně. */
function entityCountLabel(n){
if(state.language!=='cs')return n+' '+(n===1?'entity':'entities');
if(n===1)return '1 entita';
if(n>=2&&n<=4)return n+' entity';
return n+' entit';
}

/* Pořadí podle toho, jak jsou entity zobrazené v seznamu — ne podle pořadí klikání. */
function bulkExportOrdered(ents){
const chosen=new Set(ents.map(e=>e.id));
const ordered=getList().filter(e=>chosen.has(e.id));
const seen=new Set(ordered.map(e=>e.id));
/* Co v aktuálním seznamu není (jiná záložka, filtr), připojíme na konec v zadaném pořadí. */
ents.forEach(e=>{if(!seen.has(e.id)){ordered.push(e);seen.add(e.id)}});
return ordered;
}

/* Typy a aspekty, které se ve výběru vyskytly — jen ty mají smysl nabízet. */
function bulkExportScopes(ents){
const types=[],aspects=[];
const tSeen=new Set(),aSeen=new Set();
ents.forEach(e=>{
if(e.typeId&&!tSeen.has(e.typeId)){const ty=findType(e.typeId);if(ty){tSeen.add(ty.id);types.push({type:ty,count:0})}}
(e.aspects||[]).forEach(aid=>{if(aSeen.has(aid))return;const asp=findAspect(aid);if(asp){aSeen.add(aid);aspects.push({aspect:asp,count:0})}});
});
types.forEach(x=>x.count=ents.filter(e=>e.typeId===x.type.id).length);
aspects.forEach(x=>x.count=ents.filter(e=>(e.aspects||[]).includes(x.aspect.id)).length);
return{types:types,aspects:aspects,untyped:ents.filter(e=>!e.typeId).length};
}

function renderBulkExportMd(ents,sel,docTitle){
const parts=[];
if(docTitle)parts.push('# '+docTitle+'\n');
/* Nadpisy entit se posunou o úroveň níž, aby zůstala jediná H1 dokumentu. */
const shift=docTitle?1:0;
/* V Markdownu je H1 každé entity dost silný předěl a vlastní --- by se tlouklo
   s čarou nad metadaty. Oddělovač si nechává jen HTML (hr) a DOCX (zalomení stránky). */
ents.forEach(e=>parts.push(shiftMdHeadings(renderExportMd(buildExportModel(e,sel)),shift)));
return parts.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}
/* Posune <hN> o úroveň níž — stejný důvod jako u Markdownu a DOCX. */
function shiftHtmlHeadings(html,off){
if(!off)return html;
return String(html).replace(/<(\/?)h([1-6])\b/g,(m,slash,n)=>'<'+slash+'h'+Math.min(6,Number(n)+off));
}
function renderBulkExportHtml(ents,sel,docTitle){
const parts=[];
if(docTitle)parts.push('<div class="exp-doc"><h1>'+esc(docTitle)+'</h1></div>');
ents.forEach((e,i)=>{
if(i>0)parts.push('<hr class="exp-sep">');
parts.push(shiftHtmlHeadings(renderExportHtml(buildExportModel(e,sel),e),docTitle?1:0));
});
return parts.join('\n');
}
function bulkExportFilename(docTitle,ents){
return safeFilename(docTitle||state.data.projectName||'dkm')+'-'+ents.length;
}
function copyBulkExportMd(ents,sel,docTitle){

if(navigator.clipboard&&window.ClipboardItem){
try{

navigator.clipboard.write([item]).then(()=>toast(t('expCopiedFormatted')),err=>{dbg('Copy formatted failed: '+err.message);openTextFallback(md,t('expCopyFormatted'))});

/* =============================================================
   AI ASISTENT
   Poskytovatel, klíč a model žijí jen v prohlížeči (jako GitHub token) —
   nikdy v datech projektu, nikdy v logu. Kontext pro model se skládá
   ze stejného výběru a stejného Markdown rendereru jako export, takže
   uživatel posílá přesně to, co by si vyexportoval.
   ============================================================= */

const AI_PROVIDERS={
gemini:{
label:'Google Gemini',
defaultModel:'gemini-3.7-flash',
docs:'https://aistudio.google.com/apikey',
/* Seznam modelů se tahá z API, ať nezáleží na tom, co bylo aktuální v době psaní kódu. */
listModels(key){
return fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key))
.then(aiJsonOrThrow)
.then(j=>(j.models||[])
.filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0)
.map(m=>String(m.name||'').replace(/^models\//,''))
.filter(Boolean)
.sort());
},
/* history: [{role:'user'|'assistant', text}] */
send(key,model,systemText,history){
const body={contents:history.map(h=>({role:h.role==='assistant'?'model':'user',parts:[{text:h.text}]}))};
if(systemText)body.systemInstruction={parts:[{text:systemText}]};
return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),
{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
.then(aiJsonOrThrow)
.then(j=>{
const blocked=j.promptFeedback&&j.promptFeedback.blockReason;
if(blocked)throw new Error(t('aiErrBlocked',{reason:blocked}));
const cand=(j.candidates||[])[0];
if(!cand)throw new Error(t('aiErrNoAnswer'));
const txt=((cand.content&&cand.content.parts)||[]).map(p=>p.text||'').join('').trim();
if(!txt){
const fr=cand.finishReason||'?';
throw new Error(t('aiErrNoAnswer')+' ('+fr+')');
}
return txt;
});
}
}
};

/* Odpověď API na chybu nese JSON s popisem — ten je pro uživatele užitečnější než holý stav. */
function aiJsonOrThrow(res){
return res.json().catch(()=>null).then(j=>{
if(res.ok)return j;
const msg=j&&j.error&&j.error.message?j.error.message:('HTTP '+res.status);
if(res.status===400||res.status===403)throw new Error(t('aiErrKey')+' '+msg);
if(res.status===404)throw new Error(t('aiErrModel')+' '+msg);
if(res.status===429)throw new Error(t('aiErrQuota')+' '+msg);
throw new Error(msg);
},()=>{throw new Error(t('aiErrNetwork'))});
}

function aiProviderId(){const v=localStorage.getItem(SK_AIPROVIDER)||'gemini';return AI_PROVIDERS[v]?v:'gemini'}
function aiProvider(){return AI_PROVIDERS[aiProviderId()]}
function aiKey(){return localStorage.getItem(SK_AIKEY)||''}
function aiSetKey(v){if(v)localStorage.setItem(SK_AIKEY,v);else localStorage.removeItem(SK_AIKEY)}
function aiModel(){return localStorage.getItem(SK_AIMODEL)||aiProvider().defaultModel}
function aiSetModel(v){if(v)localStorage.setItem(SK_AIMODEL,v);else localStorage.removeItem(SK_AIMODEL)}
function aiConfigured(){return !!aiKey()}

/* Jediné místo, kudy chodí požadavky — hlídá klíč a drží klíč mimo log. */
function aiSend(systemText,history){
const key=aiKey();
if(!key)return Promise.reject(new Error(t('aiErrNoKey')));
const p=aiProvider();const model=aiModel();
dbg('AI request: '+aiProviderId()+' / '+model+' ('+history.length+' zpráv, kontext '+(systemText?systemText.length:0)+' zn.)');
return p.send(key,model,systemText,history);
}

/* Název pro entitu v Inboxu — první nadpis nebo první řádek odpovědi. */
function aiSuggestName(text){
const lines=String(text||'').split('\n').map(l=>l.trim()).filter(Boolean);
for(const l of lines){
const h=/^#{1,6}\s+(.+)$/.exec(l);
if(h)return h[1].trim().slice(0,80);
}
return (lines[0]||'').replace(/^[*_>\-\s]+/,'').slice(0,80)||t('untitled');
}
