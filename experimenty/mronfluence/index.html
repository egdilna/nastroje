function createPage(spaceId,parentId){
  if(!state.spaces.length){ createSpace(); return; }
  const spOpts=state.spaces.map(s=>'<option value="'+s.id+'"'+(s.id===spaceId?" selected":"")+'>'+esc(s.name)+'</option>').join("");
  dialog("Nová stránka",
    '<label for="pgTitle">Název</label><input id="pgTitle" required>'+
    '<label for="pgType">Typ obsahu</label><select id="pgType">'+
      '<option value="page">Stránka</option><option value="livedoc">Živý dokument</option>'+
      '<option value="database">Databáze</option><option value="whiteboard">Tabule</option></select>'+
    '<label for="pgSpace">Prostor</label><select id="pgSpace">'+spOpts+'</select>',
    dlg=>{
      const title=dlg.querySelector("#pgTitle").value.trim(); if(!title)return;
      const type=dlg.querySelector("#pgType").value;
      const sid=dlg.querySelector("#pgSpace").value;
      const p=newPage(type,sid,parentId); p.title=title;
      state.pages[p.id]=p; space(sid).pages.push(p.id);
      if(parentId){ page(parentId).children.push(p.id); }
      runRules("page-created",p);
      logActivity("created",p.id);
      log("Vytvořena stránka „"+title+"“ ("+typeLabel(type)+")");
      openPage(p.id);
      if(type==="page"||type==="livedoc"){ state.editing=true; render(); }
    });
}
function deletePage(id){
  const p=page(id); if(!p)return;
  if(p.children.length){ dialog("Nelze smazat","<p>Stránka má podstránky. Nejdřív je přesuňte nebo smažte.</p>",null); return; }
  dialog("Smazat stránku","<p>Opravdu smazat „"+esc(p.title)+"“? Akci nelze vrátit.</p>",()=>{
    const sp=space(p.spaceId); sp.pages=sp.pages.filter(x=>x!==id);
    if(p.parentId){ const par=page(p.parentId); if(par)par.children=par.children.filter(x=>x!==id); }
    delete state.pages[id];
    state.current = sp.pages[0]||null;
    log("Smazána stránka „"+p.title+"“"); announce("Stránka smazána"); render();
  });
}

/* ================================================================
   PŘÍLOHY — patří PROSTORU (jeden soubor, víc míst), s verzemi.
   Model: sp.attachments = [{ id, name, versions:[{v,ts,type,size,data,author}] }]
   Aktuální verze = poslední ve versions.
   ================================================================ */
function ensureSpaceAtt(sp){ if(sp && !sp.attachments) sp.attachments=[]; return sp?sp.attachments:[]; }
function spaceAtts(spaceId){ const sp=space(spaceId); return sp?ensureSpaceAtt(sp):[]; }
function findAtt(spaceId,name){ return spaceAtts(spaceId).find(a=>a.name.toLowerCase()===String(name||"").toLowerCase()); }
function attCurrent(a){ return a && a.versions[a.versions.length-1]; }

function readFileAsData(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>res(String(rd.result));
    rd.onerror=()=>rej(new Error("Soubor se nepodařilo načíst."));
    rd.readAsDataURL(f);
  });
}

/* nahrání souboru do prostoru; když název existuje → nová VERZE */
function uploadToSpace(spaceId, onDone){
  const inp=document.createElement("input"); inp.type="file";
  inp.style.position="absolute"; inp.style.left="-9999px"; document.body.appendChild(inp);
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0]; if(!f){ inp.remove(); return; }
    if(f.size>5*1024*1024){ dialog("Příloha je moc velká","<p>Limit je 5 MB, aby projekt zůstal přenosný přes schránku. Soubor „"+esc(f.name)+"“ má "+fmtBytes(f.size)+".</p>",null); inp.remove(); return; }
    let data; try{ data=await readFileAsData(f); }catch(e){ dialog("Chyba","<p>"+esc(e.message)+"</p>",null); inp.remove(); return; }
    // nabídni jméno (předvyplněné názvem souboru)
    dialog("Pojmenovat přílohu",
      '<label for="atName">Název přílohy</label><input id="atName" value="'+esc(f.name)+'">'+
      '<div style="font-size:.8rem;color:var(--ink-faint);margin-top:.3em">Stejný název jako existující příloha přidá novou verzi.</div>',
      d=>{
        const name=d.querySelector("#atName").value.trim()||f.name;
        const sp=space(spaceId); ensureSpaceAtt(sp);
        let a=findAtt(spaceId,name);
        const u=currentUser();
        if(a){ a.versions.push({v:a.versions.length+1,ts:now(),type:f.type,size:f.size,data,author:u.name});
          log("Nová verze přílohy „"+name+"“ (v"+a.versions.length+")"); announce("Přidána verze přílohy"); }
        else { a={id:uid("att"),name,versions:[{v:1,ts:now(),type:f.type,size:f.size,data,author:u.name}]}; sp.attachments.push(a);
          log("Nahrána příloha „"+name+"“"); announce("Příloha nahrána"); }
        logActivity("attached",null,name);
        inp.remove();
        if(onDone) onDone(a);
        render();
      });
  });
  inp.click();
}

function openAttachmentVersions(spaceId,attId){
  const a=spaceAtts(spaceId).find(x=>x.id===attId); if(!a)return;
  const rows=a.versions.slice().reverse().map(v=>
    '<li>v'+v.v+' — '+fmtDate(v.ts)+' · '+fmtBytes(v.size)+' · '+esc(v.author||"")+

function restoreAttVersion(spaceId,attId,vn){
  const a=spaceAtts(spaceId).find(x=>x.id===attId); if(!a)return;
  const old=a.versions.find(x=>x.v===vn); if(!old)return;
  a.versions.push({v:a.versions.length+1,ts:now(),type:old.type,size:old.size,data:old.data,author:currentUser().name});
  log("Obnovena verze v"+vn+" přílohy „"+a.name+"“ jako nová verze"); announce("Verze obnovena");
  const d=document.querySelector("dialog[open]"); if(d)d.close(); render();
}

/* výběr existující přílohy z libovolného prostoru → vloží makro (jedna příloha, víc míst) */
function pickAttachmentFrom(pg){
  const all=[];
  state.spaces.forEach(sp=>{ ensureSpaceAtt(sp).forEach(a=>all.push({sp,a})); });
  if(!all.length){ dialog("Žádné přílohy","<p>Zatím nemáte žádné nahrané přílohy. Nejdřív nějakou nahrajte.</p>",null); return; }
  const opts=all.map((x,i)=>'<option value="'+i+'">'+esc(x.sp.name)+' / '+esc(x.a.name)+' (v'+attCurrent(x.a).v+')</option>').join("");

      insertAttachmentMacro(ref);

function runRules(trigger,p){
  state.rules.forEach(r=>{
    if(r.trigger!==trigger)return;
    if(r.action==="addlabel"&&p){ if(!p.labels.includes(r.value)){ p.labels.push(r.value); log("Automatizace: přidán štítek „"+r.value+"“"); } }
    if(r.action==="setstatus"&&p){ p.status=r.value; log("Automatizace: stav → "+statusLabel(r.value)); }
  });
}
function openAutomation(){
  let list=state.rules.length? state.rules.map((r,i)=>
    '<div class="autorule"><span class="ar-when">KDYŽ</span> '+ruleTriggerLabel(r.trigger)+', <span class="ar-when">PAK</span> '+ruleActionLabel(r)+
    ' <button class="btn btn-sm" data-delrule="'+i+'">×</button></div>').join("")
    : '<p class="empty">Zatím žádná pravidla.</p>';
  dialog("Automatizace",
    list+
    '<hr><label for="arTrig">Spouštěč</label><select id="arTrig"><option value="page-created">Vznikne stránka</option><option value="page-published">Publikuje se stránka</option></select>'+
    '<label for="arAct">Akce</label><select id="arAct"><option value="addlabel">Přidat štítek</option><option value="setstatus">Nastavit stav</option></select>'+
    '<label for="arVal">Hodnota</label><input id="arVal" placeholder="štítek nebo draft/published/archived">',
    dlg=>{
      const t=dlg.querySelector("#arTrig").value, a=dlg.querySelector("#arAct").value, v=dlg.querySelector("#arVal").value.trim();
      if(!v)return; state.rules.push({trigger:t,action:a,value:v});
      log("Nové pravidlo automatizace"); render();
    });
}
function ruleTriggerLabel(t){ return {"page-created":"vznikne stránka","page-published":"publikuje se stránka"}[t]||t; }
function ruleActionLabel(r){ return r.action==="addlabel"?'přidej štítek „'+esc(r.value)+'“':'nastav stav „'+esc(statusLabel(r.value))+'“'; }

   ================================================================ */
let searchState={q:"",type:"",author:"",space:"",label:"",status:"",since:"",sort:"relevance"};
function doSearch(q){
  if(q!==undefined){ searchState.q=String(q).trim(); }
  state.view="search"; state.current=null; state.editing=false;
  renderSearch();
  document.getElementById("main").focus();
}
function renderSearch(){
  const q=searchState.q.toLowerCase();
  let res=Object.values(state.pages).map(p=>{
    let score=0; const t=(p.title||"").toLowerCase(), b=(p.body||"").toLowerCase();
    if(!q){ score=1; }
    else { if(t.includes(q))score+=10; if(b.includes(q))score+=3; if(p.labels.some(l=>l.toLowerCase().includes(q)))score+=5; }
    return {p,score};
  }).filter(r=>r.score>0);
  // filtry
  const f=searchState;
  if(f.type) res=res.filter(r=>r.p.type===f.type);
  if(f.author) res=res.filter(r=>r.p.creator===f.author||r.p.lastEditor===f.author||(r.p.comments||[]).some(c=>c.author===f.author));
  if(f.space) res=res.filter(r=>r.p.spaceId===f.space);
  if(f.label) res=res.filter(r=>r.p.labels.some(l=>l.toLowerCase()===f.label.toLowerCase()));
  if(f.status) res=res.filter(r=>r.p.status===f.status);
  if(f.since){ const cutoff=new Date(f.since).getTime(); res=res.filter(r=>new Date(r.p.updated).getTime()>=cutoff); }
  // řazení
  if(f.sort==="relevance") res.sort((a,b)=>b.score-a.score||b.p.updated.localeCompare(a.p.updated));
  else if(f.sort==="updated") res.sort((a,b)=>b.p.updated.localeCompare(a.p.updated));
  else if(f.sort==="created") res.sort((a,b)=>b.p.created.localeCompare(a.p.created));
  else if(f.sort==="title") res.sort((a,b)=>(a.p.title||"").localeCompare(b.p.title||"","cs"));
  else if(f.sort==="versions") res.sort((a,b)=>b.p.versions.length-a.p.versions.length);

  // panel filtrů
  const users=allUsers();
  let h='<h1 class="page-title">Hledání a filtry</h1>';
  h+='<div class="filter-panel"><h3>Filtry</h3><div class="filter-row">';
  h+='<label>Text<input id="fQ" value="'+esc(searchState.q)+'" placeholder="hledaný výraz"></label>';
  h+='<label>Typ<select id="fType"><option value="">vše</option>'+["page","livedoc","database","whiteboard"].map(t=>'<option value="'+t+'"'+(f.type===t?" selected":"")+'>'+typeLabel(t)+'</option>').join("")+'</select></label>';
  h+='<label>Autor / přispěvatel<select id="fAuthor"><option value="">kdokoli</option>'+users.map(u=>'<option value="'+esc(u.name)+'"'+(f.author===u.name?" selected":"")+'>'+esc(u.name)+'</option>').join("")+'</select></label>';
  h+='<label>Prostor<select id="fSpace"><option value="">všechny</option>'+state.spaces.map(s=>'<option value="'+s.id+'"'+(f.space===s.id?" selected":"")+'>'+esc(s.name)+'</option>').join("")+'</select></label>';
  h+='<label>Štítek<input id="fLabel" value="'+esc(f.label)+'" placeholder="štítek"></label>';
  h+='<label>Stav<select id="fStatus"><option value="">vše</option>'+["draft","published","archived"].map(s=>'<option value="'+s+'"'+(f.status===s?" selected":"")+'>'+statusLabel(s)+'</option>').join("")+'</select></label>';
  h+='<label>Upraveno od<input type="date" id="fSince" value="'+esc(f.since)+'"></label>';
  h+='<label>Řadit<select id="fSort">'+[["relevance","relevance"],["updated","nejnovější úprava"],["created","nejnovější vznik"],["title","název A→Z"],["versions","počet verzí"]].map(o=>'<option value="'+o[0]+'"'+(f.sort===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>';
  h+='</div><div style="margin-top:.5em"><button class="btn btn-primary btn-sm" id="applyFilters">Použít</button> <button class="btn btn-sm" id="clearFilters">Vymazat filtry</button></div></div>';

  h+='<p style="color:var(--ink-soft)">'+res.length+' výsledků</p>';
  if(!res.length) h+='<p class="empty">Nic neodpovídá. Zkuste uvolnit filtry.</p>';
  else{ h+='<div class="content"><ul class="home-list wide">';
    res.forEach(r=>{ const sp=space(r.p.spaceId); const snippet=q?makeSnippet(r.p.body,q):"";
      const icon={page:"📄",livedoc:"📝",database:"🗂️",whiteboard:"🖊️"}[r.p.type]||"📄";
      h+='<li style="flex-direction:column;align-items:flex-start"><div><span aria-hidden="true">'+icon+'</span> <button data-goto="'+r.p.id+'"><strong>'+esc(r.p.title||"(bez názvu)")+'</strong></button> '+
         '<span class="att-ver">'+esc(sp?sp.name:"")+' · '+statusLabel(r.p.status)+' · '+userChip(r.p.lastEditor,r.p.lastEditorInitials)+' '+relTime(r.p.updated)+'</span></div>'+
         (snippet?'<div style="font-size:.88em;color:var(--ink-soft)">'+snippet+'</div>':'')+'</li>';
    });
    h+='</ul></div>';
  }
  document.getElementById("mainView").innerHTML=h;
  document.getElementById("contextCol").innerHTML="";
  renderNav(); bindContentEvents();
  // navázat filtry
  const rd=id=>document.getElementById(id);
  const apply=()=>{ searchState.q=rd("fQ").value.trim(); searchState.type=rd("fType").value; searchState.author=rd("fAuthor").value; searchState.space=rd("fSpace").value; searchState.label=rd("fLabel").value.trim(); searchState.status=rd("fStatus").value; searchState.since=rd("fSince").value; searchState.sort=rd("fSort").value; renderSearch(); };
  const ap=rd("applyFilters"); if(ap) ap.onclick=apply;
  const cl=rd("clearFilters"); if(cl) cl.onclick=()=>{ searchState={q:searchState.q,type:"",author:"",space:"",label:"",status:"",since:"",sort:"relevance"}; renderSearch(); };
  ["fType","fAuthor","fSpace","fStatus","fSort"].forEach(id=>{ const el=rd(id); if(el) el.onchange=apply; });
  announce(res.length+" výsledků");
}
function makeSnippet(body,q){
  const b=(body||""); const idx=b.toLowerCase().indexOf(q);
  if(idx<0)return "";
  const start=Math.max(0,idx-30), end=Math.min(b.length,idx+q.length+40);
  return (start>0?"…":"")+esc(b.slice(start,idx))+"<mark>"+esc(b.slice(idx,idx+q.length))+"</mark>"+esc(b.slice(idx+q.length,end))+(end<b.length?"…":"");
}

    '<label for="exFmt">Formát</label><select id="exFmt"><option value="md">Markdown</option><option value="html">HTML</option><option value="json">JSON (záloha)</option></select>',
    dlg=>{
      const what=dlg.querySelector("#exWhat").value, fmt=dlg.querySelector("#exFmt").value;
      let pages=[];
      if(what==="page"&&state.current)pages=[page(state.current)];
      else if(what==="space"&&state.current)pages=space(page(state.current).spaceId).pages.map(page);
      else pages=Object.values(state.pages);
      let content="",name="mronfluence",mime="text/plain";
      if(fmt==="md"){ content=pages.map(toMarkdown).join("\n\n---\n\n"); name+=".md"; mime="text/markdown"; }
      else if(fmt==="html"){ content='<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><title>Export</title></head><body>'+
        pages.map(p=>'<article>'+renderContent(toMarkdown(p),p)+'</article><hr>').join("")+'</body></html>'; name+=".html"; mime="text/html"; }
      else { content=JSON.stringify({spaces:state.spaces,pages:state.pages,rules:state.rules,seq:state.seq},null,2); name+=".json"; mime="application/json"; }
      downloadFile(name,content,mime);
      log("Export: "+what+" jako "+fmt); announce("Export připraven ke stažení");
    });
}
function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function openImport(){
  dialog("Import",
    '<label for="imFmt">Zdroj</label><select id="imFmt"><option value="md">Markdown (nová stránka)</option><option value="json">JSON záloha (nahradí vše)</option></select>'+
    '<label for="imText">Vložte obsah</label><textarea id="imText" rows="10" style="font-family:var(--mono)"></textarea>'+
    (state.spaces.length?'<label for="imSpace">Prostor (pro Markdown)</label><select id="imSpace">'+state.spaces.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("")+'</select>':''),
    dlg=>{
      const fmt=dlg.querySelector("#imFmt").value, txt=dlg.querySelector("#imText").value;
      if(!txt.trim())return;
      if(fmt==="json"){ try{ const d=JSON.parse(txt); state.spaces=d.spaces||[]; state.pages=d.pages||{}; state.rules=d.rules||[]; state.seq=d.seq||1; state.current=null; log("Import JSON zálohy hotov"); render(); }catch(e){ dialog("Chyba","<p>Neplatný JSON: "+esc(e.message)+"</p>",null); } return; }
      // markdown
      let sid=dlg.querySelector("#imSpace")?dlg.querySelector("#imSpace").value:null;
      if(!sid){ const sp={id:uid("space"),key:"IMP",name:"Import",pages:[]}; state.spaces.push(sp); sid=sp.id; }
      const titleM=txt.match(/^#\s+(.*)/m);
      const p=newPage("page",sid); p.title=titleM?titleM[1].trim():"Importovaná stránka";
      p.body=txt.replace(/^#\s+.*\n?/,"").trim();
      state.pages[p.id]=p; space(sid).pages.push(p.id);
      log("Import Markdownu → „"+p.title+"“"); openPage(p.id);
    });
}

function viewVersion(p,n){
  const v=p.versions.find(x=>x.n===n); if(!v)return;
  dialog("Verze v"+n+" — "+fmtDate(v.ts),
    '<div class="content" style="max-height:50vh;overflow:auto">'+renderContent(v.body,p)+'</div>'+
    '<button type="button" class="btn" id="restoreVer" style="margin-top:.6em">Obnovit tuto verzi</button>',
    null);
  setTimeout(()=>{ const rb=document.getElementById("restoreVer"); if(rb) rb.onclick=()=>{
    saveVersion(p,"před obnovením v"+n); p.body=v.body; p.title=v.title; touch(p);
    document.querySelector("dialog[open]").close();
    log("Obnovena verze v"+n); render();
  }; },0);
}
function showDiff(p){
  if(p.versions.length<2)return;
  const a=p.versions[p.versions.length-2].body.split("\n");
  const b=p.versions[p.versions.length-1].body.split("\n");
  const setB=new Set(b), setA=new Set(a);
  let h='<div class="diff-wrap">';
  const all=[]; let ia=0,ib=0;
  // jednoduchý řádkový diff
  b.forEach(line=>{ if(!setA.has(line)) all.push(['add',line]); else all.push(['ctx',line]); });
  a.forEach(line=>{ if(!setB.has(line)) all.push(['del',line]); });
  all.forEach(([t,l])=>{
    const cls=t==="add"?"diff-line-add":t==="del"?"diff-line-del":"diff-line-ctx";
    const pre=t==="add"?"+ ":t==="del"?"- ":"  ";
    h+='<div class="'+cls+'">'+esc(pre+l)+'</div>';
  });
  h+='</div>';
  dialog("Porovnání v"+(p.versions.length-1)+" → v"+p.versions.length, h, null);
}

function insertAtCursor(text){
  const ta=document.getElementById("edBody"); if(!ta)return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const sel=ta.value.slice(s,e);
  let ins=text;
  if(text==="**"||text==="*"||text==="`"){ ins=text+(sel||"text")+text; }
  ta.value=ta.value.slice(0,s)+ins+ta.value.slice(e);
  ta.dispatchEvent(new Event("input")); ta.focus();
  ta.selectionStart=s+ins.length; ta.selectionEnd=s+ins.length;
}

function otevritNapovedu(karta){
  const stary=document.getElementById("napovedaDlg"); if(stary) stary.close();
  const navrat=document.activeElement;
  const dlg=document.createElement("dialog");
  dlg.id="napovedaDlg"; dlg.className="napoveda-dlg"; dlg.setAttribute("aria-labelledby","napNadpis");
  const karty=[["zkratky","Zkratky",napovedaZkratkyHtml()],["syntaxe","Syntaxe",napovedaSyntaxeHtml()]];
  dlg.innerHTML='<div class="dlg-head nap-head"><span id="napNadpis">Nápověda</span><button type="button" class="btn btn-sm" id="napZavrit">Zavřít</button></div>'+
    '<div class="tabs-nav nap-karty" role="tablist" aria-label="Části nápovědy">'+
    karty.map(k=>'<button type="button" role="tab" class="tab-btn" id="napT-'+k[0]+'" aria-controls="napP-'+k[0]+'" data-napkarta="'+k[0]+'">'+k[1]+'</button>').join("")+'</div>'+
    karty.map(k=>'<div role="tabpanel" class="dlg-body nap-panel" id="napP-'+k[0]+'" aria-labelledby="napT-'+k[0]+'" tabindex="0">'+k[2]+'</div>').join("");
  document.body.appendChild(dlg);
  const prepnout=(id,fokus)=>{
    karty.forEach(k=>{ const on=k[0]===id;
      const t=dlg.querySelector("#napT-"+k[0]); t.setAttribute("aria-selected",on); t.tabIndex=on?0:-1;
      dlg.querySelector("#napP-"+k[0]).hidden=!on; });
    if(fokus) dlg.querySelector("#napT-"+id).focus();
  };
  dlg.querySelectorAll("[data-napkarta]").forEach(b=>b.addEventListener("click",()=>prepnout(b.dataset.napkarta,true)));
  dlg.querySelector("#napZavrit").onclick=()=>dlg.close();
  const filtr=dlg.querySelector("#napFiltr");
  filtr.addEventListener("input",()=>{
    const slova=bezDiakritiky(filtr.value).split(/\s+/).filter(Boolean);
    let n=0;
    dlg.querySelectorAll(".nap-sek").forEach(s=>{ const ok=slova.every(w=>s.dataset.napHledat.includes(w)); s.hidden=!ok; if(ok)n++; });
    // skryj nadpisy skupin, pod kterými nic nezbylo
    dlg.querySelectorAll(".nap-skupina").forEach(g=>{ let el=g.nextElementSibling, vid=false;
      while(el&&!el.classList.contains("nap-skupina")){ if(!el.hidden)vid=true; el=el.nextElementSibling; }
      g.hidden=!vid; });
    dlg.querySelector("#napPocet").textContent=slova.length?(n?"Nalezeno: "+n:"Nic nenalezeno"):"";
  });
  dlg.addEventListener("close",()=>{ dlg.remove(); if(navrat&&navrat.focus&&document.contains(navrat)) navrat.focus(); });
  dlg.showModal();
  prepnout(karta==="syntaxe"?"syntaxe":"zkratky",true);
}

/* ================================================================
   PALETA MAKER — „/“ v editoru i tlačítko Makra
   Modální <dialog>: pole role=combobox (fokus zůstává v něm) a seznam
   role=listbox se skupinami; aktuální položka přes aria-activedescendant.
   ================================================================ */
let paleta=null; // {dlg, ta, start, konec, polozky, sel, vlozeno}
function syntaxeMakra(m){
  const klic=(m.insert.match(/^\{([a-z]+)/)||[])[1];
  if(!klic) return null;
  for(const sk of SYNTAXE) for(const s of sk.polozky) if(s.makro===klic) return s;
  return null;
}
function otevritPaletu(ta,start,konec){
  if(paleta) return;
  const dlg=document.createElement("dialog");
  dlg.className="paleta-dlg"; dlg.setAttribute("aria-labelledby","paletaNadpis");
  dlg.innerHTML='<div class="dlg-head" id="paletaNadpis">Vložit makro</div>'+
    '<div class="dlg-body">'+
    '<label for="paletaFiltr">Hledat makro</label>'+
    '<input id="paletaFiltr" type="text" role="combobox" aria-expanded="true" aria-controls="paletaSeznam" aria-autocomplete="list" aria-describedby="paletaPocet" autocomplete="off" spellcheck="false">'+
    '<p class="paleta-pocet" id="paletaPocet" aria-live="polite"></p>'+
    '<div class="paleta-seznam" id="paletaSeznam" role="listbox" aria-label="Makra"></div>'+
    '<div class="paleta-syntaxe" id="paletaSyntaxe"></div>'+
    '<p class="paleta-tip">Šipky vybírají, Enter vloží, Esc zavře. Celá syntaxe: F1.</p></div>';
  document.body.appendChild(dlg);
  paleta={dlg,ta,start,konec,polozky:[],sel:0,vlozeno:false};
  const vstup=dlg.querySelector("#paletaFiltr");
  vstup.addEventListener("input",()=>{ paleta.sel=0; filtrujPaletu(vstup.value); });
  vstup.addEventListener("keydown",e=>{
    const n=paleta.polozky.length;
    const posun={ArrowDown:1,ArrowUp:-1,PageDown:10,PageUp:-10}[e.key];
    if(posun!==undefined){ e.preventDefault(); if(n){ paleta.sel=Math.max(0,Math.min(n-1,paleta.sel+posun)); vykresliVyber(); } }
    else if((e.key==="Home"||e.key==="End")&&n&&!vstup.value){ e.preventDefault(); paleta.sel=e.key==="Home"?0:n-1; vykresliVyber(); }
    else if(e.key==="Enter"){ e.preventDefault(); if(n) vlozitZPalety(paleta.polozky[paleta.sel]); }
  });
  const seznam=dlg.querySelector("#paletaSeznam");
  seznam.addEventListener("mousedown",e=>e.preventDefault()); // fokus zůstane v poli
  seznam.addEventListener("click",e=>{ const o=e.target.closest("[data-pal]"); if(o) vlozitZPalety(MACRO_CATALOG[+o.dataset.pal]); });
  dlg.addEventListener("close",()=>{
    const p=paleta; paleta=null; dlg.remove();
    if(p&&!p.vlozeno&&document.contains(p.ta)){ p.ta.focus(); p.ta.selectionStart=p.ta.selectionEnd=p.konec; }
  });
  dlg.showModal();
  filtrujPaletu("");
  vstup.focus();
}
function filtrujPaletu(dotaz){
  const slova=bezDiakritiky(dotaz).split(/\s+/).filter(Boolean);
  const shoda=m=>{ const t=bezDiakritiky(m.label+" "+m.key+" "+m.desc+" "+m.group+" "+m.insert); return slova.every(w=>t.includes(w)); };
  let pol=MACRO_CATALOG.filter(shoda);
  // přesná shoda začátku zkratky má přednost (napsané „/ukol“ trefí Úkol)
  if(slova.length===1){ const w=slova[0]; pol=pol.filter(m=>m.key.startsWith(w)).concat(pol.filter(m=>!m.key.startsWith(w))); }
  paleta.polozky=pol;
  const seznam=paleta.dlg.querySelector("#paletaSeznam");
  if(!pol.length){
    seznam.innerHTML='<div class="paleta-prazdno" role="presentation">Žádné makro neodpovídá.</div>';
  } else {
    // skupiny v pořadí prvního výskytu
    const skupiny=[]; pol.forEach(m=>{ let g=skupiny.find(x=>x.nazev===m.group); if(!g){ g={nazev:m.group,pol:[]}; skupiny.push(g); } g.pol.push(m); });
    paleta.polozky=[].concat(...skupiny.map(g=>g.pol));
    let i=0;
    seznam.innerHTML=skupiny.map((g,gi)=>'<div role="group" aria-labelledby="palG'+gi+'"><div class="slash-group" id="palG'+gi+'" role="presentation">'+esc(g.nazev)+'</div>'+
      g.pol.map(m=>'<div role="option" class="slash-item" id="palO'+(i++)+'" data-pal="'+MACRO_CATALOG.indexOf(m)+'" aria-selected="false"><span>'+esc(m.label)+'</span><span class="si-key">/'+esc(m.key)+'</span><span class="si-desc">'+esc(m.desc)+'</span></div>').join("")+'</div>').join("");
  }
  paleta.dlg.querySelector("#paletaPocet").textContent=pol.length?("Nalezeno maker: "+pol.length):"Žádné makro neodpovídá";
  vykresliVyber();
}
function vykresliVyber(){
  const dlg=paleta.dlg, vstup=dlg.querySelector("#paletaFiltr");
  dlg.querySelectorAll('[role="option"]').forEach((o,i)=>{ const on=i===paleta.sel; o.setAttribute("aria-selected",on); o.classList.toggle("active",on); if(on) o.scrollIntoView({block:"nearest"}); });
  const m=paleta.polozky[paleta.sel];
  if(m){ vstup.setAttribute("aria-activedescendant","palO"+paleta.sel); } else vstup.removeAttribute("aria-activedescendant");
  const s=m&&syntaxeMakra(m), box=dlg.querySelector("#paletaSyntaxe");
  box.innerHTML = m ? '<div><strong>Vloží:</strong> <code>'+esc(m.insert.split("\n")[0])+(m.insert.includes("\n")?" …":"")+'</code></div>'+
    (s&&s.parametry? '<div><strong>Parametry:</strong> '+s.parametry.map(p=>'<code>'+esc(p[0])+'</code>').join(", ")+'</div>' : '') : '';
}
function vlozitZPalety(m){
  if(!paleta||!m) return;
  const {ta,start,konec}=paleta;
  paleta.vlozeno=true; paleta.dlg.close();
  ta.value=ta.value.slice(0,start)+m.insert+ta.value.slice(konec);
  ta.dispatchEvent(new Event("input")); ta.focus();
  // zástupný text rovnou označ, ať jde přepsat; jinak kurzor za vložený text
  const z=m.vyber?m.insert.indexOf(m.vyber):-1;
  if(z>=0){ ta.selectionStart=start+z; ta.selectionEnd=start+z+m.vyber.length; }
  else ta.selectionStart=ta.selectionEnd=start+m.insert.length;
  announce("Vloženo: "+m.label);
  // speciál: {attachment} bez názvu → hned nabídni nahrání
  if(m.insert==="{attachment}"){ const pg=page(state.current); if(pg) uploadToSpace(pg.spaceId,(a)=>{ replaceLastAttachmentToken(a.name); }); }
}
function setupSlashMenu(ta){
  // „/“ na začátku slova (začátek textu, mezera nebo nový řádek před ním)
  ta.addEventListener("input",e=>{
    if(e.inputType!=="insertText"||e.data!=="/") return;
    const pos=ta.selectionStart;
    const pred=pos>=2?ta.value.charAt(pos-2):"";
    if(pos>=1 && (pred===""||/\s/.test(pred))) otevritPaletu(ta,pos-1,pos);
  });
}
function replaceLastAttachmentToken(name){
  const ta=document.getElementById("edBody"); if(!ta)return;
  // nahraď první prázdné {attachment} makrem s názvem
  ta.value=ta.value.replace(/\{attachment\}/,"{attachment:"+name+"}");
  ta.dispatchEvent(new Event("input"));
}

/* ---- inline komentář z editoru (přístupná cesta: tlačítko + dialog) ---- */
function editorInlineComment(){
  const ta=document.getElementById("edBody"); if(!ta)return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const sel=ta.value.slice(s,e).trim();
  if(!sel){ dialog("Označte text","<p>Nejdřív v editoru označte text, ke kterému chcete komentář, pak klikněte na Komentář.</p>",null); return; }
  const p=page(state.current); if(!p)return;
  dialog("Inline komentář k označenému textu",
    '<div class="comment-quote">„'+esc(sel)+'“</div><label for="edCmt">Komentář</label><textarea id="edCmt" rows="3"></textarea>',
    d=>{
      const v=d.querySelector("#edCmt").value.trim(); if(!v)return;
      const cid=uid("c");
      p.comments.push({id:cid,ts:now(),text:v,inline:true,resolved:false,quote:ta.value.slice(s,e),author:currentUser().name,authorInitials:currentUser().initials});
      // vlož kotvu přímo do textu editoru
      ta.value=ta.value.slice(0,s)+"{{cmnt:"+cid+"|"+ta.value.slice(s,e)+"}}"+ta.value.slice(e);
      ta.dispatchEvent(new Event("input"));
      log("Přidán inline komentář z editoru"); announce("Komentář přidán");
    });
}

/* databáze — řádky a sloupce */
function dbAddCol(p){
  dialog("Nový sloupec",
    '<label for=\"colN\">Název</label><input id=\"colN\" required>'+
    '<label for=\"colK\">Typ</label><select id=\"colK\"><option value=\"text\">Text</option><option value=\"number\">Číslo</option><option value=\"date\">Datum</option><option value=\"select\">Výběr</option><option value=\"status\">Stav</option><option value=\"link\">Odkaz na stránku</option></select>',
    dlg=>{ const name=dlg.querySelector("#colN").value.trim(); if(!name)return;
      p.db.columns.push({id:uid("col"),name,kind:dlg.querySelector("#colK").value}); render(); });
}
function dbRowForm(p,row){
  return p.db.columns.map(c=>{
    const val=row?esc(row[c.id]||""):"";
    if(c.kind==="link"){ return '<label>'+esc(c.name)+'</label><select data-col=\"'+c.id+'\"><option value=\"\">—</option>'+Object.values(state.pages).map(x=>'<option value=\"'+x.id+'\"'+(row&&row[c.id]===x.id?" selected":"")+'>'+esc(x.title)+'</option>').join("")+'</select>'; }
    const type=c.kind==="number"?"number":c.kind==="date"?"date":"text";
    return '<label>'+esc(c.name)+'</label><input type=\"'+type+'\" data-col=\"'+c.id+'\" value=\"'+val+'\">';
  }).join("");
}
function dbAddRow(p){
  dialog("Nový záznam",dbRowForm(p,null),dlg=>{
    const row={_id:uid("row")}; dlg.querySelectorAll("[data-col]").forEach(f=>row[f.dataset.col]=f.value);
    p.db.rows.push(row); render();
  });
}
function dbEditRow(p,rid){
  const row=p.db.rows.find(r=>r._id===rid); if(!row)return;
  dialog("Upravit záznam",dbRowForm(p,row),dlg=>{
    dlg.querySelectorAll("[data-col]").forEach(f=>row[f.dataset.col]=f.value); render();
  });
}

/* keyboard aktivace inline komentáře (přístupnost) */
document.addEventListener("keydown",e=>{

/* editor save tlačítka + edit tlačítko (delegace na id) */
document.addEventListener("click",e=>{
  if(e.target.id==="btnEdit"){ state.editing=true; render(); }
  if(e.target.id==="btnCancelEdit"){ state.editing=false; render(); }
  // tlačítko Makra → paleta (bez lomítka, vkládá na kurzor)
  if(e.target.closest("#btnMacroMenu")){ const ta=document.getElementById("edBody"); if(ta) otevritPaletu(ta,ta.selectionStart,ta.selectionEnd); return; }
  // odkaz do nápovědy
  const nap=e.target.closest("[data-napoveda]");
  if(nap){ otevritNapovedu(nap.dataset.napoveda); return; }
  if(e.target.closest("#btnEdComment")){ editorInlineComment(); return; }
  if(e.target.id==="btnSaveDraft"||e.target.id==="btnPublish"){
    const p=page(state.current);
    const nt=document.getElementById("edTitle").value.trim();
    const nb=document.getElementById("edBody").value;
    const publishing=e.target.id==="btnPublish";
    const finish=(verComment)=>{
      if(publishing||p.status==="published"){ saveVersion(p, verComment||(publishing?"publikováno":"uloženo")); }
      p.title=nt||p.title; p.body=nb; touch(p);
      if(publishing){ p.status="published"; runRules("page-published",p); logActivity("published",p.id,verComment); }
      else logActivity("edited",p.id,verComment);
      state.editing=false; log((publishing?"Publikováno":"Uložen koncept")+" „"+p.title+"“");
      announce(publishing?"Publikováno":"Uloženo"); render();
    };
    if(publishing){
      dialog("Co jste změnili?","<label for=\"verC\">Komentář k verzi (nepovinné)</label><input id=\"verC\" placeholder=\"např. Doplněny kontakty\">",d=>{ finish(d.querySelector("#verC").value.trim()); });
      // umožni publikovat i bez komentáře (prázdný Enter přes potvrzení dialogu)
    } else finish("");
  }
});

/* ================================================================
   CELÝ PROJEKT — serializace, soubor, schránka
   ================================================================ */
function serializeProject(){
  return JSON.stringify({
    app:"MRonfluence", version:1, saved:now(),
    spaces:state.spaces, pages:state.pages, rules:state.rules,
    user:state.user, identities:state.identities,
    views:state.views, activity:state.activity, notifications:state.notifications, seq:state.seq
  },null,2);
}
function loadProjectData(data){
  if(!data||typeof data!=="object") throw new Error("Neplatná data projektu.");
  if(!Array.isArray(data.spaces)||typeof data.pages!=="object") throw new Error("Chybí prostory nebo stránky.");
  state.spaces=data.spaces||[];
  state.pages=data.pages||{};
  state.rules=data.rules||[];
  state.user=data.user||{name:"Já",initials:"JÁ"};
  state.identities=data.identities||[];
  state.views=data.views||[];
  state.activity=data.activity||[];
  state.notifications=data.notifications||[];
  // migrace starších stránek (doplnění nových polí)
  Object.values(state.pages).forEach(p=>{
    if(!p.creator){ p.creator=p.author||"Já"; p.creatorInitials=p.authorInitials||initials(p.creator); }
    if(!p.lastEditor){ p.lastEditor=p.creator; p.lastEditorInitials=p.creatorInitials; }
    if(!p.owner){ p.owner=p.creator; p.ownerInitials=p.creatorInitials; }
    if(!p.watchers) p.watchers=[p.creator];
    if(p.savedForLater===undefined) p.savedForLater=false;
  });
  state.spaces.forEach(sp=>{ if(!sp.attachments) sp.attachments=[]; });
  state.seq=data.seq||1;
  state.current=null; state.editing=false;
  refreshUserButton(); render();
}
function parseAndLoad(text){
  const data=JSON.parse(text); // vyhodí SyntaxError, chytáme u volajícího
  loadProjectData(data);
}

/* --- uložit projekt do souboru (accesskey S) --- */
function saveProjectToFile(){
  const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  downloadFile("mronfluence-projekt-"+stamp+".json", serializeProject(), "application/json");
  log("Projekt uložen do souboru"); announce("Projekt uložen do souboru ke stažení");
}

/* --- načíst projekt ze souboru (accesskey O) --- */
function loadProjectFromFile(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.style.position="absolute"; inp.style.left="-9999px";
  document.body.appendChild(inp);
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; if(!f){ inp.remove(); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      try{ parseAndLoad(String(rd.result)); log("Projekt načten ze souboru „"+f.name+"“"); announce("Projekt načten ze souboru"); }
      catch(err){ dialog("Načtení selhalo","<p>Soubor se nepodařilo načíst: "+esc(err.message)+"</p>",null); log("Chyba načtení souboru: "+err.message); }
      inp.remove();
    };
    rd.onerror=()=>{ dialog("Načtení selhalo","<p>Soubor se nepodařilo přečíst.</p>",null); inp.remove(); };
    rd.readAsText(f);
  });
  inp.click();
}

/* --- kopírovat celý projekt do schránky (Ctrl+Shift+S) --- */
async function copyProjectToClipboard(){
  const json=serializeProject();
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(json);
      log("Projekt zkopírován do schránky"); announce("Celý projekt zkopírován do schránky");
      return;
    }
    throw new Error("Clipboard API není dostupné.");
  }catch(err){
    // fallback: dialog s předvyplněnou textarea k ručnímu zkopírování
    log("Schránka nedostupná, fallback: "+err.message);
    const dlg=dialog("Zkopírovat projekt ručně",
      '<p>Automatické zkopírování neprošlo. Označte text (Ctrl+A) a zkopírujte (Ctrl+C).</p>'+
      '<textarea id="copyArea" rows="10" style="font-family:var(--mono)" readonly>'+esc(json)+'</textarea>',
      null);
    setTimeout(()=>{ const ta=dlg.querySelector("#copyArea"); if(ta){ ta.focus(); ta.select(); } },0);
    announce("Projekt připraven ke zkopírování z textového pole");
  }
}

/* --- načíst projekt ze schránky (Ctrl+Shift+O) --- */
async function pasteProjectFromClipboard(){
  try{
    if(navigator.clipboard && navigator.clipboard.readText){
      const text=await navigator.clipboard.readText();
      if(!text||!text.trim()) throw new Error("Schránka je prázdná.");
      try{ parseAndLoad(text); log("Projekt načten ze schránky"); announce("Projekt načten ze schránky"); }
      catch(perr){ throw new Error("Obsah schránky není platný projekt: "+perr.message); }
      return;
    }
    throw new Error("Clipboard API pro čtení není dostupné.");
  }catch(err){
    // fallback: dialog s textarea, kam uživatel vloží JSON a potvrdí
    log("Čtení schránky nedostupné, fallback: "+err.message);
    clipboardPasteFallback(err.message);
  }
}
function clipboardPasteFallback(reason){
  const dlg=dialog("Vložit projekt ze schránky",
    '<p>Vložte JSON projektu (Ctrl+V) do pole a potvrďte. Nahradí celý stávající projekt.</p>'+
    (reason?'<p style="color:var(--ink-faint);font-size:.85rem">Důvod fallbacku: '+esc(reason)+'</p>':'')+
    '<textarea id="pasteArea" rows="10" style="font-family:var(--mono)" placeholder="Sem vložte JSON projektu…"></textarea>',
    d=>{
      const text=d.querySelector("#pasteArea").value;
      try{ parseAndLoad(text); log("Projekt načten ze schránky (fallback)"); announce("Projekt načten"); }
      catch(err){ dialog("Načtení selhalo","<p>Vložený text není platný projekt: "+esc(err.message)+"</p>",null); }
    });
  setTimeout(()=>{ const ta=dlg.querySelector("#pasteArea"); if(ta) ta.focus(); },0);
}

/* klávesové zkratky pro schránku: Ctrl+Shift+S kopírovat, Ctrl+Shift+O načíst */
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==="s"){ e.preventDefault(); copyProjectToClipboard(); }
    else if(k==="o"){ e.preventDefault(); pasteProjectFromClipboard(); }
  }
});

document.getElementById("btnUser").onclick=openUserSettings;

/* F1 = nápověda (v editoru rovnou karta Syntaxe) */
document.addEventListener("keydown",e=>{
  if(e.key==="F1"){ e.preventDefault(); otevritNapovedu(state.editing?"syntaxe":"zkratky"); }
});

/* záložky v obsahu (:::tabs): šipky vlevo/vpravo, Home, End */
document.addEventListener("keydown",e=>{
  const t=e.target.closest&&e.target.closest('[role="tab"]'); if(!t)return;
  const list=t.closest('[role="tablist"]'); if(!list)return;
  const tabs=[...list.querySelectorAll('[role="tab"]')], i=tabs.indexOf(t);
  const cil={ArrowRight:(i+1)%tabs.length,ArrowLeft:(i-1+tabs.length)%tabs.length,Home:0,End:tabs.length-1}[e.key];
  if(cil===undefined)return;
  e.preventDefault(); tabs[cil].click(); tabs[cil].focus();
});
document.getElementById("btnHome").onclick=()=>goView("home");
document.getElementById("btnHomeNav").onclick=()=>goView("home");
document.getElementById("btnFavorites").onclick=()=>goView("favorites");
document.getElementById("btnPeople").onclick=()=>goView("people");

/* ---- notifikace ---- */
function refreshNotifBadge(){
  const u=currentUser();
  const n=state.notifications.filter(x=>x.forUser===u.name && !x.read).length;
  const badge=document.getElementById("notifCount"); if(!badge)return;
  if(n>0){ badge.hidden=false; badge.textContent=n; } else badge.hidden=true;
}
function openNotifications(){
  const u=currentUser();
  const mine=state.notifications.filter(x=>x.forUser===u.name);
  let body = mine.length
    ? mine.slice(0,40).map(x=>'<div class="notif-item'+(x.read?"":" unread")+'">'+avatarHtml(x.actor)+' '+esc(x.text)+(x.pageId?' <button class="btn btn-sm" data-goto="'+x.pageId+'">Otevřít</button>':'')+'<span class="att-ver">'+relTime(x.ts)+'</span></div>').join("")
    : '<p class="empty">Žádná upozornění. Sledujte stránky tlačítkem „Sledovat“ a uvidíte tu změny od ostatních identit.</p>';
  dialog("Upozornění pro "+esc(u.name), body+(mine.length?'<div style="margin-top:.6em"><button type="button" class="btn" id="markRead">Označit vše jako přečtené</button></div>':''), null);
  setTimeout(()=>{ const b=document.getElementById("markRead"); if(b) b.onclick=()=>{ state.notifications.forEach(x=>{ if(x.forUser===u.name) x.read=true; }); refreshNotifBadge(); const d=document.querySelector("dialog[open]"); if(d)d.close(); }; },0);
}
