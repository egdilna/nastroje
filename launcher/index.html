<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Rámeček</title>
<style>
  :root{
    --lista:#1d2330;
    --text:#e8ecf3;
    --tlum:#9aa6bb;
    --ram:#39435a;
    --aktiv:#3b82f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    height:100dvh;
    display:flex;
    flex-direction:column;
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:#000;
    color:var(--text);
    overflow:hidden;
  }

  header{
    flex:0 0 auto;
    background:var(--lista);
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:6px 8px;
    padding-top:calc(6px + env(safe-area-inset-top));
    padding-left:calc(8px + env(safe-area-inset-left));
    padding-right:calc(8px + env(safe-area-inset-right));
  }
  .radek{display:flex;align-items:center;gap:6px;min-width:0}
  .nazev{
    margin:0;
    font-size:16px;
    font-weight:700;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .nazev[hidden]{display:none}
  .cas{
    margin:0;
    font-size:12px;
    color:var(--tlum);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cas:empty{display:none}

  button{
    font:inherit;
    font-size:13px;
    line-height:1;
    padding:8px 10px;
    min-height:38px;
    border:1px solid var(--ram);
    border-radius:8px;
    background:#262e3d;
    color:var(--text);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
  }
  button:hover{background:#313b4e}
  button:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px}
  .ikona{font-size:17px;padding:8px 11px;flex:0 0 auto}
  .ikona[hidden]{display:none}

  [role="tablist"]{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    gap:4px;
    overflow-x:auto;
  }
  [role="tab"]{
    font:inherit;font-size:13px;
    padding:8px 12px;min-height:38px;
    border:1px solid var(--ram);
    border-radius:8px;
    background:transparent;
    color:var(--tlum);
    cursor:pointer;
    white-space:nowrap;
  }
  [role="tab"][aria-selected="true"]{
    background:var(--aktiv);
    border-color:var(--aktiv);
    color:#fff;
    font-weight:600;
  }

  main{flex:1 1 auto;min-height:0;background:#fff}
  .panel{height:100%;width:100%;display:flex;flex-direction:column}
  .panel[hidden]{display:none}
  iframe{flex:1 1 auto;width:100%;height:100%;border:0;background:#fff;display:block}

  .hlaseni{
    flex:0 0 auto;
    background:#4a1f22;
    color:#ffd7da;
    font-size:13px;
    padding:8px 10px;
    margin:0;
  }
  .hlaseni[hidden]{display:none}
  .skryte{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  dialog{
    border:1px solid var(--ram);
    border-radius:12px;
    background:var(--lista);
    color:var(--text);
    padding:16px;
    width:min(96vw,680px);
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{margin:0 0 8px;font-size:16px}
  dialog p{margin:0 0 10px;font-size:13px;color:var(--tlum)}
  label{display:block;font-size:13px;margin:10px 0 4px}
  input[type=text],textarea{
    width:100%;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:#131824;
    color:#e8ecf3;
    border:1px solid var(--ram);
    border-radius:8px;
    padding:10px;
  }
  textarea{min-height:190px;resize:vertical}
  .vpravo{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <p class="nazev" id="nadpis"></p>
  <div class="radek">
    <button type="button" id="btnZnovu" class="ikona" title="Znovu načíst" aria-label="Znovu načíst">🔄</button>
    <div role="tablist" id="tablist" aria-label="Záložky"></div>
    <button type="button" id="btnEditor" class="ikona" title="Upravit záložky" aria-label="Upravit záložky" hidden>✏️</button>
  </div>
  <p class="cas" id="cas"></p>
</header>

<p class="hlaseni" id="hlaseni" hidden></p>
<p class="skryte" id="stav" aria-live="polite"></p>

<main id="scena"></main>

<dialog id="dlg">
  <h2>Nastavení rámečku</h2>
  <p>Uložením vznikne nový soubor <strong>index.html</strong> se zapsaným názvem a záložkami, který nahrajete na server.</p>
  <label for="txtNazev">Název v záhlaví</label>
  <input type="text" id="txtNazev" spellcheck="false">
  <label for="txt">Záložky – jeden řádek ve tvaru <strong>Název | URL</strong>, řádky s <strong>#</strong> na začátku se ignorují</label>
  <textarea id="txt" spellcheck="false"></textarea>
  <div class="vpravo">
    <button type="button" id="btnZavrit">Zavřít</button>
    <button type="button" id="btnVyzkouset">Vyzkoušet bez uložení</button>
    <button type="button" id="btnUlozit">Uložit soubor</button>
  </div>
</dialog>

<script>
/* ZALOZKY-ZACATEK */
var NAZEV = "Moje rychlé nástroje";
var ZABUDOVANE = [
  { nazev: "PIM", url: "https://nastroje.egdilna.cz/pim/?id=bWljaGFscmFkYWN6L01vamVkYXRhL21pY2hhbHJhZGEucGlt" },
  { nazev: "MRonenote", url: "https://michalrada.cz/experimenty/mronenote" },
  { nazev: "Outliner", url: "https://nastroje.egdilna.cz/outliner" },
  { nazev: "PlantUML", url: "https://nastroje.egdilna.cz/plantuml" },
  { nazev: "MRonfluence", url: "https://michalrada.cz/experimenty/mronfluence" }
];
/* ZALOZKY-KONEC */

(function () {
  "use strict";

  var KLIC_AKTIVNI = "ramecek.aktivni";
  var CEKANI_MS = 12000;
  var TIK_MS = 60000;

  var scena = document.getElementById("scena");
  var tablist = document.getElementById("tablist");
  var nadpis = document.getElementById("nadpis");
  var cas = document.getElementById("cas");
  var hlaseni = document.getElementById("hlaseni");
  var stav = document.getElementById("stav");
  var dlg = document.getElementById("dlg");
  var txt = document.getElementById("txt");
  var txtNazev = document.getElementById("txtNazev");
  var btnEditor = document.getElementById("btnEditor");

  var nazev = NAZEV;
  var zalozky = ZABUDOVANE.slice();
  var aktivni = 0;
  var hlidace = {};
  var nacteno = {};

  var lzeEditovat = false;
  try { lzeEditovat = new URLSearchParams(location.search).has("edit"); }
  catch (e) { lzeEditovat = location.search.indexOf("edit") !== -1; }
  btnEditor.hidden = !lzeEditovat;

  function rekni(text) { stav.textContent = text; }
  function chyba(text) { hlaseni.textContent = text; hlaseni.hidden = !text; }

  /* Doba od načtení: do 80 minut v minutách, do 30 hodin v hodinách, dál ve dnech. */
  function jakDavno(kdy) {
    var s = Math.floor((Date.now() - kdy) / 1000);
    if (s < 60) return "Načteno právě teď";
    var min = Math.floor(s / 60);
    if (min < 80) return "Načteno před " + min + (min === 1 ? " minutou" : " minutami");
    var hod = Math.floor(s / 3600);
    if (hod < 30) return "Načteno před " + hod + (hod === 1 ? " hodinou" : " hodinami");
    var dny = Math.floor(s / 86400);
    return "Načteno před " + dny + (dny === 1 ? " dnem" : " dny");
  }

  function dvojcifr(n) { return (n < 10 ? "0" : "") + n; }

  function ukazCas() {
    var kdy = nacteno[aktivni];
    if (!zalozky.length) { cas.textContent = ""; cas.removeAttribute("title"); return; }
    if (!kdy) { cas.textContent = "Načítám…"; cas.removeAttribute("title"); return; }
    var d = new Date(kdy);
    cas.textContent = jakDavno(kdy);
    cas.title = "Načteno " + d.getDate() + ". " + (d.getMonth() + 1) + ". " + d.getFullYear() +
      " v " + d.getHours() + ":" + dvojcifr(d.getMinutes());
  }

  function zTextu(text) {
    var out = [];
    text.split(/\r?\n/).forEach(function (radek) {
      var r = radek.trim();
      if (!r || r.charAt(0) === "#") return;
      var i = r.indexOf("|");
      var jmeno = "", url = r;
      if (i !== -1) { jmeno = r.slice(0, i).trim(); url = r.slice(i + 1).trim(); }
      if (!url) return;
      if (!jmeno) {
        try { jmeno = new URL(url, location.href).hostname; }
        catch (e) { jmeno = "Záložka " + (out.length + 1); }
      }
      out.push({ nazev: jmeno, url: url });
    });
    return out;
  }
  function doTextu(pole) {
    return pole.map(function (z) { return z.nazev + " | " + z.url; }).join("\n");
  }

  function zrusHlidac(i) { if (hlidace[i]) { clearTimeout(hlidace[i]); delete hlidace[i]; } }
  function nastavHlidac(i, z) {
    zrusHlidac(i);
    hlidace[i] = setTimeout(function () {
      if (i !== aktivni) return;
      if (location.protocol === "https:" && z.url.slice(0, 5) === "http:") {
        chyba("Záložka „" + z.nazev + "“ vede na nešifrované http, které se do stránky na https nevloží. Použijte adresu s https.");
      } else {
        chyba("Stránka „" + z.nazev + "“ se v rámu nenačetla. Server ji nejspíš zakazuje vkládat do rámu (X-Frame-Options nebo CSP frame-ancestors), případně přesměrovává na http.");
      }
    }, CEKANI_MS);
  }

  function postavRam(i) {
    var z = zalozky[i];
    var panel = document.createElement("div");
    panel.className = "panel";
    panel.id = "panel-" + i;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", "tab-" + i);
    panel.hidden = true;

    var ram = document.createElement("iframe");
    ram.title = z.nazev;
    ram.setAttribute("allow", "clipboard-read; clipboard-write; fullscreen; geolocation; camera; microphone; autoplay");
    ram.setAttribute("allowfullscreen", "");
    ram.addEventListener("load", function () {
      if (ram.src === "about:blank") return;
      zrusHlidac(i);
      nacteno[i] = Date.now();
      if (i === aktivni) { chyba(""); ukazCas(); }
    });
    ram.src = z.url;

    panel.appendChild(ram);
    scena.appendChild(panel);
    nastavHlidac(i, z);
    return panel;
  }
  function panelPro(i) { return document.getElementById("panel-" + i) || postavRam(i); }

  function prepni(i) {
    if (!zalozky.length) return;
    aktivni = i;
    chyba("");
    Array.prototype.forEach.call(scena.children, function (p) { p.hidden = true; });
    panelPro(i).hidden = false;
    Array.prototype.forEach.call(tablist.children, function (t, n) {
      t.setAttribute("aria-selected", n === i ? "true" : "false");
      t.tabIndex = n === i ? 0 : -1;
    });
    ukazCas();
    try { localStorage.setItem(KLIC_AKTIVNI, String(i)); } catch (e) {}
  }

  function postavVse() {
    nadpis.textContent = nazev;
    nadpis.hidden = !nazev;
    document.title = nazev || "Rámeček";

    tablist.textContent = "";
    Array.prototype.slice.call(scena.children).forEach(function (p) { p.remove(); });
    Object.keys(hlidace).forEach(zrusHlidac);
    nacteno = {};
    chyba("");

    zalozky.forEach(function (z, i) {
      var t = document.createElement("button");
      t.type = "button";
      t.id = "tab-" + i;
      t.setAttribute("role", "tab");
      t.setAttribute("aria-controls", "panel-" + i);
      t.setAttribute("aria-selected", "false");
      t.tabIndex = -1;
      t.textContent = z.nazev;
      t.addEventListener("click", function () { prepni(i); });
      tablist.appendChild(t);
    });

    if (!zalozky.length) {
      ukazCas();
      chyba(lzeEditovat
        ? "Není nastavena žádná záložka. Tlačítkem tužky vložte adresu."
        : "Není nastavena žádná záložka. Doplňte k adrese parametr ?edit a nastavte je.");
      return;
    }

    var ulozeny = 0;
    try { ulozeny = parseInt(localStorage.getItem(KLIC_AKTIVNI) || "0", 10); } catch (e) {}
    if (isNaN(ulozeny) || ulozeny < 0 || ulozeny >= zalozky.length) ulozeny = 0;
    prepni(ulozeny);
  }

  document.getElementById("btnZnovu").addEventListener("click", function () {
    if (!zalozky.length) return;
    var z = zalozky[aktivni];
    var ram = panelPro(aktivni).querySelector("iframe");
    chyba("");
    delete nacteno[aktivni];
    ukazCas();
    ram.src = "about:blank";
    setTimeout(function () { ram.src = z.url; }, 50);
    nastavHlidac(aktivni, z);
    rekni("Načítám znovu.");
  });

  btnEditor.addEventListener("click", function () {
    txtNazev.value = nazev;
    txt.value = doTextu(zalozky);
    dlg.showModal();
  });
  document.getElementById("btnZavrit").addEventListener("click", function () { dlg.close(); });

  document.getElementById("btnVyzkouset").addEventListener("click", function () {
    nazev = txtNazev.value.trim();
    zalozky = zTextu(txt.value);
    try { localStorage.setItem(KLIC_AKTIVNI, "0"); } catch (e) {}
    postavVse();
    dlg.close();
    rekni("Nastavení použito jen v tomto okně.");
  });

  document.getElementById("btnUlozit").addEventListener("click", function () {
    var novyNazev = txtNazev.value.trim();
    var nove = zTextu(txt.value);
    fetch(location.href, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (zdroj) {
        var a = zdroj.indexOf("/* ZALOZKY-ZACATEK */");
        var b = zdroj.indexOf("/* ZALOZKY-KONEC */");
        if (a === -1 || b === -1 || b < a) throw new Error("znacky");
        var blok = "/* ZALOZKY-ZACATEK */\nvar NAZEV = " + JSON.stringify(novyNazev) + ";\nvar ZABUDOVANE = [\n" +
          nove.map(function (z) {
            return "  { nazev: " + JSON.stringify(z.nazev) + ", url: " + JSON.stringify(z.url) + " }";
          }).join(",\n") +
          "\n];\n";
        stahni(zdroj.slice(0, a) + blok + zdroj.slice(b));
        dlg.close();
        rekni("Soubor vytvořen ke stažení.");
      })
      .catch(function () {
        dlg.close();
        chyba("Soubor nelze sestavit ze zdroje — stránka je nejspíš otevřená z disku místo ze serveru. Zkopírujte si obsah editoru a přepište NAZEV a ZABUDOVANE ručně.");
      });
  });

  function stahni(obsah) {
    var blob = new Blob([obsah], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "index.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  tablist.addEventListener("keydown", function (e) {
    var pocet = zalozky.length;
    if (!pocet) return;
    var novy = null;
    if (e.key === "ArrowRight") novy = (aktivni + 1) % pocet;
    else if (e.key === "ArrowLeft") novy = (aktivni - 1 + pocet) % pocet;
    else if (e.key === "Home") novy = 0;
    else if (e.key === "End") novy = pocet - 1;
    if (novy === null) return;
    e.preventDefault();
    prepni(novy);
    tablist.children[novy].focus();
  });

  setInterval(ukazCas, TIK_MS);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) ukazCas();
  });

  postavVse();
})();
</script>
</body>
</html>
