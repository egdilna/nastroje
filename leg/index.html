      casti.push(el("h2", null, "V komentářích — " + pocetSlov(kom.length, "výsledek", "výsledky", "výsledků")),
        el("ol", {class: "seznam"}, kom.map(k => el("li", {class: "vysledek-hledani"},
          el("p", null, el("a", {href: adresa({pohled: "ust", predpis: k.predpis, ust: k.klic}) + "#k-" + k.id}, citaceUstanoveni(W.predpisy[k.predpis], k.predpis, {c: k.citace}))),
          el("p", null, ukazka(k.text, normText(k.text, bez), slova))))));
    }
    const pozn = [];
    for (const id of ids){
      if (!W.predpisy[id] || !W.predpisy[id].poznamka) continue;
      let t;
      try { t = await nactiPoznamku(id); } catch (e){ continue; }
      const nt = normText(t, bez);
      if (slova.every(s => nt.indexOf(s) >= 0)) pozn.push([id, t, nt]);
    }
    if (pozn.length){
      celkem += pozn.length;
      casti.push(el("h2", null, "V poznámkách k předpisům — " + pocetSlov(pozn.length, "výsledek", "výsledky", "výsledků")),
        el("ol", {class: "seznam"}, pozn.map(([id, t, nt]) => el("li", {class: "vysledek-hledani"},
          el("p", null, el("a", {href: adresa({pohled: "poznamka", predpis: id})}, "Poznámka k předpisu " + kratkyNazev(W.predpisy[id], id))),
          el("p", null, ukazka(t, nt, slova))))));
    }
  }
  vysledky.append(el("p", {class: "tichy"}, celkem ? "Nalezeno " + pocetSlov(celkem, "výsledek", "výsledky", "výsledků") + (celkem >= MAX ? " (zobrazeno prvních " + MAX + ")" : "") + "." : "Nic nenalezeno."), ...casti);
  return out;
};
/* Ukázka textu kolem prvního nálezu, s vyznačením všech hledaných slov. */
function ukazka(text, nt, slova){
  const OKNO = 90;
  let prvni = Math.min(...slova.map(s => nt.indexOf(s)).filter(i => i >= 0));
  if (!isFinite(prvni)) prvni = 0;
  const zac = Math.max(0, prvni - OKNO), kon = Math.min(text.length, prvni + OKNO * 2);
  const usek = text.slice(zac, kon), nusek = nt.slice(zac, kon);
  const znacky = [];
  for (const s of slova){ let i = -1; while ((i = nusek.indexOf(s, i + 1)) >= 0) znacky.push([i, i + s.length]); }
  znacky.sort((a, b) => a[0] - b[0]);
  const frag = document.createDocumentFragment();
  if (zac > 0) frag.append("… ");
  let pos = 0;
  for (const [a, b] of znacky){ if (a < pos) continue; frag.append(usek.slice(pos, a), el("mark", null, usek.slice(a, b))); pos = b; }
  frag.append(usek.slice(pos));
  if (kon < text.length) frag.append(" …");
  return frag;
}

/* ---------- Nastavení ---------- */
async function pohledNastaveni(){
  drobecky([["Přehled", {}], ["Nastavení", null]]);
  const out = [nadpis("Nastavení úložiště")];
  out.push(el("p", null, "Pracovní prostor je složka v GitHub repozitáři. V ní je soubor " + SOUBOR_WS + " s oblastmi, skupinami a vyznačeními a složka predpisy se staženými zněními (každé znění v samostatných menších souborech). Každé uložení je commit."));
  out.push(el("p", null, "V tomto prohlížeči zůstává jen token a adresa úložiště. Token se nikam jinam neposílá a do odkazů se nedostane. Adresu úložiště lze předat i odkazem — parametry repo, slozka a případně vetev."));
  const repo = el("input", {type: "text", autocomplete: "off", spellcheck: "false"}); repo.value = cfg.repo;
  const vetev = el("input", {type: "text", autocomplete: "off", spellcheck: "false"}); vetev.value = cfg.vetev || "main";
  const slozka = el("input", {type: "text", autocomplete: "off", spellcheck: "false"}); slozka.value = cfg.slozka;
  const token = el("input", {type: "password", autocomplete: "off", spellcheck: "false"}); token.value = cfg.token;
  const stav = el("p", {class: "tichy"});
  out.push(el("form", {onsubmit: async e => {
    e.preventDefault();
    const zmenaUloziste = repo.value.trim() !== cfg.repo || (vetev.value.trim() || "main") !== cfg.vetev || normSlozka(slozka.value) !== cfg.slozka;
    cfg.repo = repo.value.trim(); cfg.vetev = vetev.value.trim() || "main"; cfg.slozka = normSlozka(slozka.value); cfg.token = token.value.trim();
    if (!maUloziste()){ stav.textContent = "Repozitář zadejte ve tvaru vlastník/název."; repo.focus(); return; }
    ulozCfg();
    stav.textContent = "Uloženo. Načítám pracovní prostor…";
    if (zmenaUloziste || !wsNacteno) await nactiWorkspace();
    oznam("Nastavení uloženo");
    prejit({pohled: "prehled"});
  }},
    pole("Repozitář", repo, "Ve tvaru vlastník/název, například egdilna/legislativa."),
    pole("Větev", vetev),
    pole("Složka pracovního prostoru", slozka, "Cesta ke složce v repozitáři. Prázdné pole znamená kořen repozitáře."),
    pole("GitHub token (osobní přístupový token)", token, "Stačí token s právem zápisu obsahu do daného repozitáře. U veřejného repozitáře jde pracovní prostor číst i bez tokenu, ukládat ale ne."),
    el("button", {type: "submit"}, "Uložit nastavení a načíst"), stav));
  if (W){
    out.push(el("h2", null, "Pracovní prostor"));
    const n = el("input", {type: "text", autocomplete: "off"}); n.value = W.nazev || "";
    out.push(el("form", {onsubmit: e => { e.preventDefault(); if (!n.value.trim()) return; W.nazev = n.value.trim(); zmeneno(); oznam("Název uložen"); vykreslitMenu(); }},
      pole("Název pracovního prostoru", n), el("button", {type: "submit"}, "Přejmenovat")));
  }
  if (maUloziste()){
    out.push(el("h2", null, "Historie pracovního prostoru"));
    const box = el("div");
    out.push(el("p", null, "Každé uložení je commit souboru " + SOUBOR_WS + ". Starší verzi můžete obnovit — staženým předpisům se tím nic nestane."),
      el("p", null, el("button", {type: "button", class: "druhe", onclick: () => historie(box)}, "Zobrazit historii")), box);
    out.push(el("p", null, el("button", {type: "button", class: "druhe", onclick: async () => { await nactiWorkspace(); oznam("Pracovní prostor znovu načten"); prejit({pohled: "prehled"}); }}, "Znovu načíst pracovní prostor z GitHubu")));
  }
  out.push(el("h2", null, "O aplikaci"));
  out.push(el("p", null, "Legislativní prohlížeč " + APP_VERZE + ". Data předpisů pocházejí z otevřených dat e-Sbírky (Ministerstvo vnitra, licence CC BY 4.0) a stahují se jen pro předpisy, které si zařadíte do knihovny."));
  return out;
}
async function historie(box){
  box.replaceChildren(zprava("Načítám historii…"));
  try {
    const seznam = await gh("commits?path=" + encodeURIComponent(cestaWs(SOUBOR_WS)) + "&sha=" + encodeURIComponent(cfg.vetev || "main") + "&per_page=30", {cache: "no-store"});
    if (!seznam.length){ box.replaceChildren(zprava("Soubor zatím nemá žádnou historii.")); return; }
    box.replaceChildren(el("ol", {class: "seznam"}, seznam.map(c => el("li", null,
      casCz(c.commit.committer.date) + " — " + (c.commit.message || "").split("\n")[0] + " ",
      el("button", {type: "button", class: "druhe", onclick: async () => {
        if (!confirm("Obnovit pracovní prostor do stavu z " + casCz(c.commit.committer.date) + "? Novější změny vyznačení a oblastí se tím přepíšou (v historii zůstanou).")) return;
        try {
          const text = await ghCist(cestaWs(SOUBOR_WS), {ref: c.sha, cache: "no-store"});
          W = normalizovatWs(JSON.parse(text)); wsNacteno = true; cacheZneni.clear();
          if (await ulozWorkspace([], "Obnovení pracovního prostoru z verze " + c.sha.slice(0, 7))){ oznam("Verze obnovena"); prejit({pohled: "prehled"}); }
        } catch (e){ box.prepend(zprava("Obnovení selhalo: " + e.message, "chyba")); }
      }}, "Obnovit tuto verzi")))));
  } catch (e){ box.replaceChildren(zprava("Historii nelze načíst: " + e.message, "chyba")); }
}
