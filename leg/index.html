<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legislativní prohlížeč</title>
<style>
/* ==================== BARVY A ZÁKLAD ==================== */
:root{
  --pozadi:#ffffff; --text:#1b1b1b; --tlumeny:#555b66; --linka:#c9ced6;
  --odkaz:#0b4fb3; --odkaz-navstiveny:#5b2ca0; --zvyrazneni:#fff3b0; --znacka:#a14a00;
  --plocha:#f3f5f8; --tlacitko:#0b4fb3; --tlacitko-text:#ffffff; --chyba:#a40e0e; --ok:#1e6b2a;
  --fokus:#d35400;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --pozadi:#15171a; --text:#ececec; --tlumeny:#a7adb7; --linka:#3a3f47;
    --odkaz:#8ab8ff; --odkaz-navstiveny:#c6a7ff; --zvyrazneni:#4a4200; --znacka:#ffb36b;
    --plocha:#1f2328; --tlacitko:#8ab8ff; --tlacitko-text:#0e1116; --chyba:#ff8a8a; --ok:#7fd88f;
    --fokus:#ffb36b;
  }
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--pozadi);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
a{color:var(--odkaz)} a:visited{color:var(--odkaz-navstiveny)}
:focus-visible{outline:3px solid var(--fokus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.preskocit{position:absolute;left:-9999px}
.preskocit:focus{left:8px;top:8px;background:var(--pozadi);padding:6px 10px;z-index:10}
.hlavicka,.drobecky,main,footer{max-width:62rem;margin:0 auto;padding:0 1rem}
.hlavicka{border-bottom:1px solid var(--linka);padding-top:.5rem;padding-bottom:.5rem}
.aplikace{margin:0;font-weight:600;color:var(--tlumeny)}
.menu{list-style:none;margin:.3rem 0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem 1.2rem}
.stav-ulozeni{margin:.2rem 0 0;color:var(--tlumeny);font-size:.92rem}
.stav-ulozeni.chyba{color:var(--chyba);font-weight:600}
.drobecky ol{list-style:none;margin:.6rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.2rem}
.drobecky li+li::before{content:"›";margin:0 .4rem;color:var(--tlumeny)}
main{padding-bottom:3rem}
h1{font-size:1.6rem;line-height:1.25;margin:1rem 0 .6rem}
h2{font-size:1.3rem;margin:1.6rem 0 .5rem}
h3{font-size:1.15rem;margin:1.3rem 0 .4rem}
h4,h5,h6{font-size:1.05rem;margin:1.1rem 0 .3rem}
.tichy{color:var(--tlumeny)}
.chyba-text{color:var(--chyba);font-weight:600}
.ok-text{color:var(--ok)}
button,.tlacitko{font:inherit;cursor:pointer;border:1px solid var(--tlacitko);background:var(--tlacitko);
  color:var(--tlacitko-text);border-radius:6px;padding:.35rem .8rem;margin:.15rem .3rem .15rem 0}
button.druhe{background:transparent;color:var(--tlacitko)}
button[disabled]{opacity:.55;cursor:not-allowed}
input[type=text],input[type=password],input[type=search],select,textarea{font:inherit;color:inherit;
  background:var(--pozadi);border:1px solid var(--linka);border-radius:6px;padding:.35rem .5rem;max-width:100%}
textarea{width:100%;min-height:6rem}
label{display:inline-block;margin:.2rem 0}
.pole{margin:.6rem 0}
.pole>label{display:block;font-weight:600}
.pole input[type=text],.pole input[type=password],.pole input[type=search],.pole select{width:min(100%,32rem)}
fieldset{border:1px solid var(--linka);border-radius:8px;margin:.8rem 0;padding:.4rem .9rem .7rem}
legend{font-weight:600;padding:0 .3rem}
.radek-volby{display:block}
details{margin:.6rem 0}
summary{cursor:pointer;font-weight:600}
.panel{background:var(--plocha);border-radius:8px;padding:.6rem 1rem;margin:.8rem 0}
.seznam{padding-left:1.3rem}
.seznam>li{margin:.35rem 0}
.akce{margin:.4rem 0}
progress{width:min(100%,32rem);height:1rem}
footer{border-top:1px solid var(--linka);padding-top:.5rem;padding-bottom:2rem;color:var(--tlumeny);font-size:.9rem}
#ladeni-seznam{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;max-height:none}

/* ==================== TEXT PŘEDPISU ==================== */
.predpis-text{margin-top:1rem}
.predpis-text section{margin:0}
.predpis-text .uvod{font-style:italic}
.predpis-text .odstavec{margin:.5rem 0}
.predpis-text .odstavec>p,.predpis-text li>p{margin:.25rem 0}
.predpis-text ol.pismena,.predpis-text ol.body{list-style:none;margin:.2rem 0 .4rem;padding-left:1.6rem}
.predpis-text ol.body{padding-left:1.4rem}
.predpis-text .pokracovani{margin:.3rem 0}
.predpis-text .nadpis-pod{font-weight:600;margin:.4rem 0}
.predpis-text blockquote{margin:.4rem 0 .4rem 1rem;padding-left:.8rem;border-left:3px solid var(--linka)}
.predpis-text .podpis{margin:.2rem 0}
.predpis-text .ppc{font-size:.95rem}
.oznaceni{font-weight:600;text-decoration:none}
a.oznaceni{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.znacka{color:var(--znacka);font-weight:700;margin:0 .25rem}
.zvyrazneno{background:var(--zvyrazneni);border-radius:4px;padding:0 .25rem}
.tabulka{overflow-x:auto;margin:.5rem 0}
.tabulka table{border-collapse:collapse}
.tabulka td,.tabulka th{border:1px solid var(--linka);padding:.25rem .45rem;vertical-align:top}
.obsah-predpisu ul{list-style:none;padding-left:1.1rem;margin:.1rem 0}
.obsah-predpisu>ul{padding-left:0}
.vyznaceni-polozka{border-top:1px solid var(--linka);padding:.5rem 0}
.vyznaceni-polozka blockquote{margin:.3rem 0 .3rem .8rem;padding-left:.7rem;border-left:3px solid var(--linka);white-space:pre-wrap}
.poznamka{white-space:pre-wrap;background:var(--plocha);border-radius:6px;padding:.3rem .6rem}
mark{background:var(--zvyrazneni);color:inherit}
.vysledek-hledani{margin:.5rem 0}
.vysledek-hledani p{margin:.15rem 0}
</style>
</head>
<body>
<a class="preskocit" href="#obsah">Přeskočit na obsah</a>
<header class="hlavicka">
  <p class="aplikace">Legislativní prohlížeč<span id="ws-nazev"></span></p>
  <nav aria-label="Hlavní nabídka">
    <ul class="menu" id="menu"></ul>
  </nav>
  <p id="stav-ulozeni" class="stav-ulozeni"></p>
</header>
<nav class="drobecky" id="drobecky" aria-label="Drobečková navigace"></nav>
<main id="obsah" tabindex="-1"></main>
<div id="oznameni" class="vh" role="status" aria-live="polite"></div>
<footer>
  <p>legprohlizec · data <a href="https://e-sbirka.gov.cz/">e-Sbírka</a> (Ministerstvo vnitra, CC BY 4.0) · <a href="https://github.com/egdilna/nastroje/issues">Hlášení chyb</a></p>
  <details id="ladeni">
    <summary>Ladicí výpis</summary>
    <p><button type="button" class="druhe" id="ladeni-vymazat">Vymazat výpis</button>
       <button type="button" class="druhe" id="ladeni-kopirovat">Zkopírovat výpis</button></p>
    <ol id="ladeni-seznam"></ol>
  </details>
</footer>
<script>
"use strict";
/* =====================================================================
   legprohlizec — personalizovaná práce s legislativou nad daty e-Sbírky
   Jednosouborová aplikace. Data: veřejný SPARQL endpoint e-Sbírky (bez klíče,
   čtení metodou GET kvůli CORS). Úložiště: složka v GitHub repozitáři.
   Podrobnosti k architektuře jsou v leg/CLAUDE.md.
   ===================================================================== */
const APP_VERZE = "1.0.0";

/* ==================== POMOCNÉ ==================== */
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, atributy, ...deti){
  const e = document.createElement(tag);
  if (atributy) for (const [k, v] of Object.entries(atributy)){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  pridatDeti(e, deti);
  return e;
}
function pridatDeti(e, deti){
  for (const d of deti){
    if (d === null || d === undefined || d === false) continue;
    if (Array.isArray(d)) pridatDeti(e, d);
    else if (d instanceof Node) e.append(d);
    else e.append(document.createTextNode(String(d)));
  }
}
const vh = t => el("span", {class: "vh"}, t);
function oznam(t){
  const o = $("#oznameni");
  o.textContent = "";
  setTimeout(() => { o.textContent = t; }, 60);
}
function log(t, data){
  const s = $("#ladeni-seznam");
  const cas = new Date().toLocaleTimeString("cs-CZ");
  s.append(el("li", null, cas + " " + t + (data !== undefined ? " — " + (typeof data === "string" ? data : JSON.stringify(data)) : "")));
  while (s.children.length > 400) s.firstChild.remove();
}
function dnesIso(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function datumCz(iso){
  if (!iso || iso === "0000-00-00") return "znění při vyhlášení";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? (+m[3]) + ". " + (+m[2]) + ". " + m[1] : iso;
}
function casCz(iso){
  try { return new Date(iso).toLocaleString("cs-CZ", {day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit"}); }
  catch (e){ return iso; }
}
function pocetSlov(n, jeden, dva, pet){
  const a = Math.abs(n);
  return n + " " + (a === 1 ? jeden : (a >= 2 && a <= 4) ? dva : pet);
}
function novyId(predpona){ return predpona + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
/* Bez diakritiky a malými písmeny — znak po znaku, aby délka zůstala stejná
   a pozice nálezu šla promítnout zpět do původního textu. */
function normZnak(z){
  const r = z.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  return r.length === 1 ? r : z.toLowerCase().charAt(0) || z;
}
function normText(s, bezDiakritiky){
  if (!bezDiakritiky) return Array.from(s, z => { const l = z.toLowerCase(); return l.length === 1 ? l : z; }).join("");
  return Array.from(s, normZnak).join("");
}
async function kopirovat(text, popis){
  try {
    await navigator.clipboard.writeText(text);
  } catch (e){
    const t = el("textarea", {class: "vh"}); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); } catch (e2){ log("Kopírování selhalo", e2.message); oznam("Kopírování se nepodařilo"); t.remove(); return; }
    t.remove();
  }
  oznam("Zkopírováno: " + popis);
}

/* ==================== STAV ULOŽENÍ ==================== */
function stavUlozeni(t, chyba){
  const p = $("#stav-ulozeni");
  p.textContent = t || "";
  p.classList.toggle("chyba", !!chyba);
}

/* ==================== KONFIGURACE ==================== */
/* V prohlížeči zůstává jen přístup k repozitáři (token, repozitář, větev, složka).
   Token se nikdy nedostane do URL, do repozitáře ani do ladicího výpisu. */
const KLIC_CFG = "legprohlizec-nastaveni-v1";
const cfg = {token: "", repo: "", vetev: "main", slozka: ""};
let cfgZUrl = false;
function normSlozka(s){ return String(s || "").trim().replace(/^\/+/, "").replace(/\/+$/, ""); }
function nactiCfg(){
  try {
    const u = JSON.parse(localStorage.getItem(KLIC_CFG) || "{}");
    cfg.token = u.token || ""; cfg.repo = u.repo || ""; cfg.vetev = u.vetev || "main"; cfg.slozka = normSlozka(u.slozka);
  } catch (e){ log("Uložené nastavení se nepodařilo přečíst", e.message); }
  const q = new URLSearchParams(location.search);
  if (q.get("repo")){ cfg.repo = q.get("repo").trim(); cfgZUrl = true; }
  if (q.get("vetev")){ cfg.vetev = q.get("vetev").trim(); cfgZUrl = true; }
  if (q.has("slozka")){ cfg.slozka = normSlozka(q.get("slozka")); cfgZUrl = true; }
  if (cfgZUrl) log("Úložiště převzato z adresy", cfg.repo + " / " + (cfg.slozka || "(kořen)"));
}
function ulozCfg(){
  try { localStorage.setItem(KLIC_CFG, JSON.stringify({token: cfg.token, repo: cfg.repo, vetev: cfg.vetev, slozka: cfg.slozka})); }
  catch (e){ log("Nastavení nelze uložit do prohlížeče", e.message); }
}
const cestaWs = rel => (cfg.slozka ? cfg.slozka + "/" : "") + rel;
const maUloziste = () => /^[^/\s]+\/[^/\s]+$/.test(cfg.repo);

/* ==================== GITHUB ==================== */
/* Čtení jde přes Contents API s hlavičkou raw (soubory až do 100 MB, bez base64).
   Kdyby raw selhal, záloha čte JSON a obsah nad 1 MB dotáhne z Git Data API podle SHA.
   Zápis je vždy commit poskládaný z Git Data API (strom s více soubory naráz),
   takže stažení předpisu i úprava workspace jsou jeden konzistentní commit. */
async function gh(cesta, volby){
  volby = volby || {};
  const hl = Object.assign({Accept: "application/vnd.github+json"}, volby.headers || {});
  if (cfg.token) hl.Authorization = "Bearer " + cfg.token;
  const r = await fetch("https://api.github.com/repos/" + cfg.repo + "/" + cesta,
    {method: volby.method || "GET", headers: hl, body: volby.body, cache: volby.cache || "default"});
  if (!r.ok){
    const t = await r.text().catch(() => "");
    const e = new Error("GitHub " + r.status + ": " + t.slice(0, 200));
    e.status = r.status; throw e;
  }
  return volby.text ? r.text() : r.json();
}
function cestaUrl(p){ return p.split("/").map(encodeURIComponent).join("/"); }
function base64DoTextu(b){
  const s = atob(String(b).replace(/\s+/g, "")), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return new TextDecoder().decode(u);
}
async function ghCist(cesta, volby){
  volby = volby || {};
  const ref = volby.ref || cfg.vetev || "main";
  const adresa = "contents/" + cestaUrl(cesta) + "?ref=" + encodeURIComponent(ref);
  try {
    return await gh(adresa, {text: true, cache: volby.cache, headers: {Accept: "application/vnd.github.raw"}});
  } catch (e){
    if (e.status === 404) return null;
    log("Čtení raw selhalo, zkouším zálohu přes JSON a blob", cesta + ": " + e.message);
    const sr = await gh(adresa, {cache: volby.cache});
    if (sr.content && sr.encoding === "base64") return base64DoTextu(sr.content);
    const blob = await gh("git/blobs/" + sr.sha);
    if (blob.encoding !== "base64") throw new Error("nečekané kódování blobu: " + blob.encoding);
    return base64DoTextu(blob.content);
  }
}
const GH_DAVKA = 3500000; /* bajtů obsahu na jeden commit — velké stahování se rozdělí */
async function ghCommit(soubory, zprava){
  if (!cfg.token) throw new Error("Chybí GitHub token — bez něj nelze ukládat. Zadejte ho v Nastavení.");
  const davky = [];
  let davka = [], velikost = 0;
  for (const s of soubory){
    const v = s.text ? s.text.length * 1.3 : 100;
    if (davka.length && velikost + v > GH_DAVKA){ davky.push(davka); davka = []; velikost = 0; }
    davka.push(s); velikost += v;
  }
  if (davka.length) davky.push(davka);
  for (let i = 0; i < davky.length; i++){
    const z = davky.length > 1 ? zprava + " (" + (i + 1) + "/" + davky.length + ")" : zprava;
    await ghCommitDavka(davky[i], z);
  }
}
async function ghCommitDavka(soubory, zprava, pokus){
  const vetev = cfg.vetev || "main";
  const ref = await gh("git/ref/heads/" + encodeURIComponent(vetev), {cache: "no-store"});
  const rodic = ref.object.sha;
  const rodicCommit = await gh("git/commits/" + rodic);
  const strom = await gh("git/trees", {method: "POST", body: JSON.stringify({
    base_tree: rodicCommit.tree.sha,
    tree: soubory.map(s => s.smazat
      ? {path: s.cesta, mode: "100644", type: "blob", sha: null}
      : {path: s.cesta, mode: "100644", type: "blob", content: s.text})
  })});
  const commit = await gh("git/commits", {method: "POST", body: JSON.stringify({message: zprava, tree: strom.sha, parents: [rodic]})});
  try {
    await gh("git/refs/heads/" + encodeURIComponent(vetev), {method: "PATCH", body: JSON.stringify({sha: commit.sha})});
  } catch (e){
    /* mezitím přibyl jiný commit — jednou zopakovat nad novým stavem větve */
    if (!pokus && (e.status === 422 || e.status === 409)){ log("Větev se mezitím změnila, opakuji commit"); return ghCommitDavka(soubory, zprava, 1); }
    throw e;
  }
  log("Commit uložen", zprava);
}

/* ==================== WORKSPACE ==================== */
const SOUBOR_WS = "legprohlizec.json";
let W = null;              /* stav workspace */
let wsNacteno = false;     /* pojistka: dokud nevíme, co v souboru je, nic neukládáme */
let wsChybi = false;       /* soubor v repozitáři zatím neexistuje */
let wsChyba = "";
let wsCasovac = null, wsBezi = false, wsCeka = false, wsNeulozeno = false;
let posledniUlozeni = null;

function prazdnyWorkspace(nazev){
  return {format: "legprohlizec", verze: 1, nazev: nazev, zalozeno: new Date().toISOString(),
    oblasti: [], predpisy: {}, skupiny: [], vyznaceni: []};
}
function normalizovatWs(d){
  const w = Object.assign(prazdnyWorkspace(""), d || {});
  if (!Array.isArray(w.oblasti)) w.oblasti = [];
  if (!w.predpisy || typeof w.predpisy !== "object") w.predpisy = {};
  if (!Array.isArray(w.skupiny)) w.skupiny = [];
  if (!Array.isArray(w.vyznaceni)) w.vyznaceni = [];
  w.oblasti.forEach(o => { if (!Array.isArray(o.predpisy)) o.predpisy = []; });
  for (const p of Object.values(w.predpisy)) if (!p.zneni) p.zneni = {};
  w.vyznaceni.forEach(v => { if (!Array.isArray(v.skupiny)) v.skupiny = []; });
  return w;
}
async function nactiWorkspace(){
  W = null; wsNacteno = false; wsChybi = false; wsChyba = "";
  cacheZneni.clear();
  if (!maUloziste()){ stavUlozeni("Není nastavené úložiště."); return; }
  stavUlozeni("Načítám pracovní prostor z GitHubu…");
  try {
    const text = await ghCist(cestaWs(SOUBOR_WS), {cache: "no-store"});
    if (text === null){
      wsChybi = true; wsNacteno = true;   /* soubor ještě není — není co ztratit */
      stavUlozeni("Pracovní prostor v této složce zatím neexistuje.");
      log("Workspace neexistuje", cestaWs(SOUBOR_WS));
      return;
    }
    let d;
    try { d = JSON.parse(text); }
    catch (e){ throw new Error("soubor " + SOUBOR_WS + " není platný JSON (" + e.message + "). Starší verzi najdete v Nastavení v historii."); }
    W = normalizovatWs(d);
    wsNacteno = true;
    stavUlozeni("Načteno z GitHubu.");
    log("Workspace načten", Object.keys(W.predpisy).length + " předpisů");
  } catch (e){
    wsChyba = e.message;
    stavUlozeni("Pracovní prostor se nepodařilo načíst — ukládání je zastavené, aby se data nepřepsala. " + e.message, true);
    log("Chyba načtení workspace", e.message);
  }
}
function textWorkspace(){ return JSON.stringify(W, null, 1); }
/* Drobná změna (vyznačení, poznámka, oblast) — uloží se se zpožděním. */
function zmeneno(){
  wsNeulozeno = true;
  stavUlozeni("Neuložené změny — ukládám za chvíli…");
  clearTimeout(wsCasovac);
  wsCasovac = setTimeout(() => { ulozWorkspace([], "Úprava pracovního prostoru"); }, 1500);
}
async function ulozWorkspace(dalsiSoubory, zprava){
  clearTimeout(wsCasovac);
  if (!W) return false;
  if (!wsNacteno){
    stavUlozeni("Neuloženo — obsah repozitáře se nepodařilo načíst, uložení by ho přepsalo.", true);
    return false;
  }
  if (!cfg.token){
    stavUlozeni("Neuloženo — chybí GitHub token. Zadejte ho v Nastavení.", true);
    return false;
  }
  if (wsBezi){ wsCeka = true; if (dalsiSoubory && dalsiSoubory.length) await cekatNaUlozeni(); else return false; }
  wsBezi = true;
  stavUlozeni("Ukládám do GitHubu…");
  try {
    await ghCommit((dalsiSoubory || []).concat([{cesta: cestaWs(SOUBOR_WS), text: textWorkspace()}]), zprava || "Úprava pracovního prostoru");
    wsNeulozeno = false; wsChybi = false; posledniUlozeni = new Date();
    stavUlozeni("Uloženo do GitHubu v " + posledniUlozeni.toLocaleTimeString("cs-CZ", {hour: "2-digit", minute: "2-digit"}) + ".");
    return true;
  } catch (e){

/* ==================== SPARQL E-SBÍRKY ==================== */
/* Dotazy jdou výhradně metodou GET — jen na ni server posílá hlavičky CORS.
   Před serverem je bezpečnostní filtr, který odmítá některé texty dotazu (403);
   proto se ve filtrech nepoužívají IRI položek číselníku typů fragmentů
   (např. …/položka/Prefix_Title) — typ se filtruje až v aplikaci. */
const SPARQL = "https://opendata.eselpoint.gov.cz/sparql";
const ESB = "https://opendata.eselpoint.gov.cz/esel-esb/";
const ELI = ESB + "eli/";
const PFX = "PREFIX e: <https://slovník.gov.cz/datový/sbírka/pojem/> ";
const aktIri = id => ELI + "cz/sb/" + id;
const zneniIri = (id, datum) => aktIri(id) + "/" + datum;

async function sparql(dotaz){
  const adresa = SPARQL + "?query=" + encodeURIComponent(PFX + dotaz);
  let posledni;
  for (let pokus = 0; pokus < 3; pokus++){
    try {
      const r = await fetch(adresa, {headers: {Accept: "application/sparql-results+json"}});
      if (r.status === 403){ throw Object.assign(new Error("Server e-Sbírky dotaz odmítl (403) — zasáhl jeho bezpečnostní filtr."), {konec: true}); }
      if (!r.ok) throw new Error("Server e-Sbírky odpověděl chybou " + r.status);
      const d = await r.json();
      return d.results.bindings.map(b => { const o = {}; for (const k in b) o[k] = b[k].value; return o; });
    } catch (e){
      posledni = e;
      if (e.konec) throw e;
      log("Dotaz na e-Sbírku selhal, zkusím znovu", e.message);
      await new Promise(r => setTimeout(r, 1200 * (pokus + 1)));
    }
  }
  throw posledni;
}
const EP = "https://slovník.gov.cz/datový/sbírka/pojem/";
/* Předpis: citace a seznam znění (data účinnosti). */
async function esbMeta(id){
  const r = await sparql("SELECT ?p ?o WHERE { <" + aktIri(id) + "> ?p ?o }");
  if (!r.length) return {existuje: false};
  const m = {existuje: true, zneni: [], citace: "", posledni: "", vyhlasene: ""};
  for (const x of r){
    const p = x.p.replace(EP, "");
    if (p === "citace-právního-aktu") m.citace = x.o;
    else if (p === "má-znění"){ const d = x.o.split("/").pop(); if (m.zneni.indexOf(d) < 0) m.zneni.push(d); }
    else if (p === "má-poslední-znění") m.posledni = x.o.split("/").pop();
    else if (p === "má-vyhlášené-znění") m.vyhlasene = x.o.split("/").pop();
  }
  m.zneni.sort();
  return m;
}
/* Hlavička předpisu (číslo, druh, datum, název) z fragmentů pod „prefix“. */
async function esbHlavicka(id, datum){
  const z = zneniIri(id, datum);
  const r = await sparql("SELECT ?typ ?t WHERE { ?f e:má-předka <" + z + "/dokument/prefix> ; e:obsahuje-fragment ?x . ?x e:má-typ-fragmentu ?typ ; e:text-fragmentu ?t }");
  const h = {cislo: "", typ: "", datum: "", nazev: ""};
  for (const x of r){
    const t = x.typ.split("/").pop(), text = prostyText(x.t);
    if (t === "Prefix_Number") h.cislo = text;
    else if (t === "Prefix_Type") h.typ = text;
    else if (t === "Prefix_Date") h.datum = text.replace(/,\s*$/, "");
    else if (t === "Prefix_Title") h.nazev = text;
  }
  return h;
}
/* Celé znění: všechny fragmenty v pořadí dokumentu, po stránkách. */
async function esbFragmenty(id, datum, prubeh){
  const z = zneniIri(id, datum), zaklad = z + "/dokument";
  const STRANKA = 2500;
  const vse = [], videno = new Set();
  for (let offset = 0; ; offset += STRANKA){
    if (prubeh) prubeh("Stahuji text znění " + datumCz(datum) + " — " + vse.length + " částí textu…");
    const r = await sparql("SELECT ?f ?p ?c ?o ?typ ?t WHERE { <" + z + "> e:má-fragment-znění ?f . "
      + "?f e:pořadí-fragmentu-znění-právního-aktu ?o ; e:obsahuje-fragment ?x . "
      + "OPTIONAL { ?f e:má-předka ?p } OPTIONAL { ?f e:citace-označení-fragmentu-znění-právního-aktu ?c } "
      + "OPTIONAL { ?x e:má-typ-fragmentu ?typ } OPTIONAL { ?x e:text-fragmentu ?t } } ORDER BY ?o ?f LIMIT " + STRANKA + " OFFSET " + offset);
    for (const x of r){
      if (videno.has(x.f)) continue;
      videno.add(x.f);
      const klic = x.f === zaklad ? "" : x.f.startsWith(zaklad + "/") ? x.f.slice(zaklad.length + 1) : x.f;
      const rodic = !x.p ? null : x.p === zaklad ? "" : x.p.startsWith(zaklad + "/") ? x.p.slice(zaklad.length + 1) : null;
      vse.push({o: x.o, f: [klic, rodic, (x.typ || "").split("/").pop(), x.c || "", x.t || ""]});
    }
    if (r.length < STRANKA) break;
  }
  vse.sort((a, b) => a.o < b.o ? -1 : a.o > b.o ? 1 : 0);
  return vse.map(v => v.f);
}
/* Cíle odkazů z textu (data-odkaz-id) — po dávkách přes VALUES. */
async function esbOdkazy(idcka, prubeh){
  const mapa = {};
  const DAVKA = 250;
  for (let i = 0; i < idcka.length; i += DAVKA){
    if (prubeh) prubeh("Dohledávám cíle odkazů — " + Math.min(i + DAVKA, idcka.length) + " z " + idcka.length + "…");
    const d = idcka.slice(i, i + DAVKA).map(x => "od:" + x).join(" ");
    const r = await sparql("PREFIX od: <" + ESB + "právní-akt-odkaz/> SELECT ?o ?cil ?cit WHERE { VALUES ?o { " + d + " } ?o e:má-cíl ?cil . OPTIONAL { ?o e:citace-cíle-odkazu ?cit } }");
    for (const x of r){
      const idOdk = x.o.split("/").pop();
      mapa[idOdk] = [x.cil.startsWith(ELI) ? x.cil.slice(ELI.length) : x.cil, x.cit ? prostyText(x.cit) : ""];
    }
  }
  return mapa;
}
/* Které znění je aktuální a která budoucí. */
function rozdelZneni(data){
  const dnes = dnesIso();
  const skutecna = data.filter(d => d !== "0000-00-00").sort();
  if (!skutecna.length) return {aktualni: data.indexOf("0000-00-00") >= 0 ? "0000-00-00" : null, budouci: []};
  const minula = skutecna.filter(d => d <= dnes);
  const aktualni = minula.length ? minula[minula.length - 1] : skutecna[0];
  return {aktualni, budouci: skutecna.filter(d => d > dnes && d !== aktualni)};
}

/* ==================== PŘEDPISY — IDENTIFIKACE ==================== */
/* „110/2019“, „110/2019 Sb.“, „zákon č. 110/2019 Sb.“, ELI nebo adresa e-Sbírky → „2019/110“ */
function rozpoznatPredpis(vstup){
  const s = String(vstup || "").trim();
  let m = /(?:eli\/cz\/sb|e-sbirka\.gov\.cz\/sb)\/(\d{4})\/(\d+)/i.exec(s);
  if (m) return m[1] + "/" + (+m[2]);
  m = /(?:^|\D)(\d{1,4})\s*\/\s*(\d{4})(?:\D|$)/.exec(s);
  if (m) return m[2] + "/" + (+m[1]);
  m = /^(\d{4})\/(\d{1,4})$/.exec(s);
  if (m) return m[1] + "/" + (+m[2]);
  return null;
}
const citacePredpisuZId = id => { const [r, c] = id.split("/"); return c + "/" + r + " Sb."; };
const slozkaPredpisu = id => "predpisy/" + id.replace("/", "-");
const SKLONOVANI = {
  "ZÁKON": ["Zákon", "zákona"], "ÚSTAVNÍ ZÁKON": ["Ústavní zákon", "ústavního zákona"],
  "NAŘÍZENÍ VLÁDY": ["Nařízení vlády", "nařízení vlády"], "NAŘÍZENÍ": ["Nařízení", "nařízení"],
  "VYHLÁŠKA": ["Vyhláška", "vyhlášky"], "SDĚLENÍ": ["Sdělení", "sdělení"], "NÁLEZ": ["Nález", "nálezu"],
  "ROZHODNUTÍ": ["Rozhodnutí", "rozhodnutí"], "USNESENÍ": ["Usnesení", "usnesení"],
  "OPATŘENÍ": ["Opatření", "opatření"], "ZÁKONNÉ OPATŘENÍ SENÁTU": ["Zákonné opatření Senátu", "zákonného opatření Senátu"],
  "DEKRET": ["Dekret", "dekretu"], "VYHLÁŠENÍ": ["Vyhlášení", "vyhlášení"]
};
function druhPredpisu(P, padGenitiv){
  const t = String((P && P.typ) || "").toUpperCase().replace(/\s+/g, " ").trim();
  const s = SKLONOVANI[t];
  if (s) return s[padGenitiv ? 1 : 0];
  if (t) { const l = t.toLowerCase(); return padGenitiv ? l : l.charAt(0).toUpperCase() + l.slice(1); }
  return padGenitiv ? "předpisu" : "Předpis";
}
function nazevPredpisu(P, id){
  const cit = (P && P.citace) || citacePredpisuZId(id);
  const zaklad = druhPredpisu(P) + " č. " + cit;
  return P && P.nazev ? zaklad + ", " + P.nazev : zaklad;
}
const kratkyNazev = (P, id) => druhPredpisu(P) + " č. " + ((P && P.citace) || citacePredpisuZId(id));
function citaceUstanoveni(P, id, f){
  const c = f && f.c ? f.c : "";
  return (c ? c + " " : "") + druhPredpisu(P, true) + " č. " + ((P && P.citace) || citacePredpisuZId(id));
}

/* ==================== ZNĚNÍ — ULOŽENÍ A NAČTENÍ ==================== */
/* Každé znění je samostatná sada souborů predpisy/<rok>-<číslo>/<datum>-<n>.json,
   žádný soubor nepřesáhne zhruba 600 kB (požadavek: nic velkého). */
const MEZ_CASTI = 600000;
function rozdelitNaCasti(id, datum, fragmenty, odkazy){
  const casti = [];
  let akt = [], velikost = 0;
  const enc = new TextEncoder();
  for (const f of fragmenty){
    const v = enc.encode(JSON.stringify(f)).length + 1;
    if (akt.length && velikost + v > MEZ_CASTI){ casti.push(akt); akt = []; velikost = 0; }
    akt.push(f); velikost += v;
  }
  if (akt.length || !casti.length) casti.push(akt);
  return casti.map((frag, i) => {
    const odk = {};
    for (const f of frag) for (const m of f[4].matchAll(/data-odkaz-id="(\d+)"/g)) if (odkazy[m[1]]) odk[m[1]] = odkazy[m[1]];
    return {
      cesta: slozkaPredpisu(id) + "/" + datum + "-" + (i + 1) + ".json",
      obsah: {format: "legprohlizec-zneni", verze: 1, predpis: id, zneni: datum, cast: i + 1, casti: casti.length, fragmenty: frag, odkazy: odk}
    };
  });
}
const cacheZneni = new Map();
const STRUKTURA = new Set(["Cast", "Hlava", "Dil", "Oddil", "Pododdil", "Paragraf", "Clanek", "Priloha", "Pododdil_Ab"]);
const SEZNAMOVE = new Set(["Pismeno_Lb", "Bod_Dd"]);
function sestavModel(id, datum, fragmenty, odkazy){
  const frag = fragmenty.map((x, i) => ({k: x[0], p: x[1], typ: x[2], c: x[3], t: x[4], i}));
  const mapa = new Map(), deti = new Map();
  for (const f of frag) mapa.set(f.k, f);
  for (const f of frag){
    if (f.k === "") continue;
    const r = f.p !== null && mapa.has(f.p) ? f.p : "";
    f.p = r;
    if (!deti.has(r)) deti.set(r, []);
    deti.get(r).push(f);
  }
  const citovatelne = frag.filter(f => f.c && f.k);
  return {id, datum, frag, mapa, deti, odkazy: odkazy || {}, citovatelne, prosty: new Map()};
}
async function nactiZneni(id, datum){
  const klic = id + "|" + datum;
  if (cacheZneni.has(klic)) return cacheZneni.get(klic);
  const P = W.predpisy[id], z = P && P.zneni[datum];
  if (!z) throw new Error("Znění " + datumCz(datum) + " není stažené.");
  const fragmenty = [], odkazy = {};
  for (const s of z.soubory){
    const text = await ghCist(cestaWs(s));
    if (text === null) throw new Error("V repozitáři chybí soubor " + s + ". Předpis stáhněte znovu (tlačítko Znovu stáhnout).");
    const d = JSON.parse(text);
    fragmenty.push(...d.fragmenty);
    Object.assign(odkazy, d.odkazy || {});
  }
  const m = sestavModel(id, datum, fragmenty, odkazy);
  cacheZneni.set(klic, m);
  return m;
}
function stazenaZneni(P){ return Object.keys(P.zneni || {}).sort(); }
/* Aktuální = nejnovější stažené znění účinné k dnešku; jinak nejstarší stažené. */
function aktualniDatum(P){
  const s = stazenaZneni(P), dnes = dnesIso();
  const minula = s.filter(d => d !== "0000-00-00" && d <= dnes);
  if (minula.length) return minula[minula.length - 1];
  const bud = s.filter(d => d !== "0000-00-00");
  if (bud.length) return bud[0];
  return s[0] || null;
}
function popisZneni(P, d){
  const akt = aktualniDatum(P);
  if (d === "0000-00-00") return "znění při vyhlášení";
  if (d === akt) return "aktuální znění účinné od " + datumCz(d);
  if (d > dnesIso()) return "budoucí znění účinné od " + datumCz(d);
  return "dřívější znění účinné od " + datumCz(d);
}

/* ==================== STAHOVÁNÍ PŘEDPISU ==================== */
async function stahnoutPredpis(id, volby, prubeh){
  volby = volby || {};
  prubeh = prubeh || (() => {});
  prubeh("Zjišťuji údaje o předpisu " + citacePredpisuZId(id) + "…");
  const meta = await esbMeta(id);
  if (!meta.existuje) throw new Error("Předpis " + citacePredpisuZId(id) + " v e-Sbírce není.");
  const rz = rozdelZneni(meta.zneni.length ? meta.zneni : [meta.vyhlasene || "0000-00-00"]);
  if (!rz.aktualni) throw new Error("Předpis nemá žádné znění ke stažení.");
  const P = W.predpisy[id] || {pridano: new Date().toISOString(), zneni: {}};
  P.budouci = volby.budouci !== undefined ? !!volby.budouci : !!P.budouci;
  const hl = await esbHlavicka(id, rz.aktualni);
  P.citace = meta.citace || citacePredpisuZId(id);
  P.typ = hl.typ || P.typ || "";
  P.nazev = hl.nazev || P.nazev || "";
  P.datumVydani = hl.datum || P.datumVydani || "";
  P.vzdalenaZneni = meta.zneni;
  P.zkontrolovano = new Date().toISOString();
  const cilova = [rz.aktualni].concat(P.budouci ? rz.budouci : []);
  const soubory = [];
  const nova = [];
  for (const d of cilova){
    if (P.zneni[d] && !volby.znovu) continue;
    const frag = await esbFragmenty(id, d, prubeh);
    const idcka = new Set();
    for (const f of frag) for (const m of f[4].matchAll(/data-odkaz-id="(\d+)"/g)) idcka.add(m[1]);
    const odkazy = idcka.size ? await esbOdkazy(Array.from(idcka), prubeh) : {};
    const casti = rozdelitNaCasti(id, d, frag, odkazy);
    const stare = (P.zneni[d] && P.zneni[d].soubory) || [];
    const nove = casti.map(c => c.cesta);
    for (const c of casti) soubory.push({cesta: cestaWs(c.cesta), text: JSON.stringify(c.obsah)});
    for (const s of stare) if (nove.indexOf(s) < 0) soubory.push({cesta: cestaWs(s), smazat: true});
    P.zneni[d] = {soubory: nove, pocet: frag.length, stazeno: new Date().toISOString()};
    cacheZneni.set(id + "|" + d, sestavModel(id, d, frag, odkazy));
    nova.push(d);
  }
  W.predpisy[id] = P;
  for (const oid of volby.oblasti || []){
    const o = W.oblasti.find(x => x.id === oid);
    if (o && o.predpisy.indexOf(id) < 0) o.predpisy.push(id);
  }
  prubeh("Ukládám do GitHubu…");
  const ok = await ulozWorkspace(soubory, (nova.length ? "Stažen předpis " : "Aktualizace předpisu ") + P.citace + (nova.length ? " (" + nova.map(datumCz).join(", ") + ")" : ""));
  if (!ok) throw new Error("Data předpisu se nepodařilo uložit do GitHubu — podrobnosti jsou ve stavovém řádku nahoře.");
  return {P, nova, rz};
}

/* ==================== TEXT — SANITIZACE A ODKAZY ==================== */
/* Text fragmentu je HTML z e-Sbírky. Nikdy se nevkládá přímo: projde whitelistem,
   <var> se mění na označení ustanovení a odkazy (data-odkaz-id) se převádějí
   na odkazy aplikace podle mapy cílů uložené u znění. */
const POVOLENE = new Set(["sup", "sub", "br", "b", "strong", "i", "em", "u", "table", "thead", "tbody", "tfoot", "tr", "td", "th", "p", "ul", "ol", "li", "caption"]);
const sablona = document.createElement("template");
function prostyText(html){
  if (!html) return "";
  sablona.innerHTML = String(html).replace(/<br\s*\/?>/gi, " ");
  /* tabulka: každý řádek na samostatný řádek textu, neprázdné buňky oddělené svislítkem */
  for (const tr of Array.from(sablona.content.querySelectorAll("tr"))){
    const bunky = Array.from(tr.children).map(b => b.textContent.replace(/\s+/g, " ").trim()).filter(Boolean);
    tr.replaceWith(document.createTextNode("\n" + bunky.join(" | ") + "\n"));
  }
  return sablona.content.textContent.replace(/[ \t\u00a0]+/g, " ").replace(/ *\n */g, "\n").replace(/\n{2,}/g, "\n").trim();
}
function textFragmentu(model, f){
  if (!model.prosty.has(f.k)) model.prosty.set(f.k, prostyText(f.t));
  return model.prosty.get(f.k);
}
function prevestHtml(html, ctx, zpracujVar){
  sablona.innerHTML = String(html || "");
  const vystup = document.createDocumentFragment();
  let prvniVar = true;
  const projdi = (uzel, cil) => {
    for (const n of Array.from(uzel.childNodes)){
      if (n.nodeType === 3){ cil.append(document.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.nodeName.toLowerCase();
      if (tag === "var"){
        const text = n.textContent;
        if (prvniVar && zpracujVar){ prvniVar = false; cil.append(zpracujVar(text)); }
        else cil.append(el("span", {class: "oznaceni"}, text));
        continue;
      }
      if (tag === "a"){ cil.append(prevestOdkaz(n, ctx)); continue; }
      if (tag === "script" || tag === "style") continue;
      if (POVOLENE.has(tag)){
        const kopie = document.createElement(tag);
        if (tag === "td" || tag === "th"){
          for (const a of ["colspan", "rowspan"]) if (n.getAttribute(a)) kopie.setAttribute(a, n.getAttribute(a));
        }
        projdi(n, kopie);
        cil.append(kopie);
      } else projdi(n, cil);
    }
  };
  projdi(sablona.content, vystup);
  return vystup;
}
function cilOdkazu(idOdk, ctx){
  const zaznam = ctx && ctx.model && ctx.model.odkazy[idOdk];
  if (!zaznam) return null;
  const cil = zaznam[0];
  let m = /^cz\/sb\/(\d{4})\/(\d+)\/[\d-]+\/dokument\/?(.*)$/.exec(cil);
  if (m) return {druh: "sb", predpis: m[1] + "/" + m[2], klic: m[3] || "", citace: zaznam[1]};
  m = /^eu\/(\d{4})\/(\d+)/.exec(cil);
  if (m) return {druh: "eu", rok: m[1], cislo: m[2], citace: zaznam[1]};
  return null;
}
function prevestOdkaz(a, ctx){
  const text = a.textContent;
  const idOdk = a.getAttribute("data-odkaz-id");
  const cil = idOdk ? cilOdkazu(idOdk, ctx) : null;
  if (cil && cil.druh === "sb"){
    const vKnihovne = !!W.predpisy[cil.predpis];
    let href;
    if (ctx.vPredpisu && cil.predpis === ctx.model.id && (cil.klic === "" || ctx.model.mapa.has(cil.klic)))
      href = cil.klic ? "#" + idFragmentu(cil.klic) : "#obsah";
    else if (cil.klic && vKnihovne)
      href = adresa({pohled: "ust", predpis: cil.predpis, ust: cil.klic});
    else href = adresa({pohled: "predpis", predpis: cil.predpis, ust: cil.klic || null});
    const a2 = el("a", {href, class: "odkaz-predpis"}, text);
    if (!vKnihovne) a2.append(vh(" (předpis " + citacePredpisuZId(cil.predpis) + " není v knihovně)"));
    return a2;
  }
  const venku = a.getAttribute("data-orig-href") || (/^https?:\/\//.test(a.getAttribute("href") || "") ? a.getAttribute("href") : null);
  if (venku) return el("a", {href: venku, target: "_blank", rel: "noopener noreferrer"}, text, vh(" (otevře se v nové kartě)"));
  return el("span", null, text);
}
const idFragmentu = k => "u-" + (k || "dokument").replace(/[^A-Za-z0-9_-]/g, "-");

function vyznaceniPredpisu(id){ return W.vyznaceni.filter(v => v.predpis === id); }

/* ==================== VYKRESLENÍ PŘEDPISU ==================== */
function oznaceniFragmentu(f){
  const m = /<var>([\s\S]*?)<\/var>/.exec(f.t || "");
  return m ? prostyText(m[1]) : f.c;
}
function titulekStruktury(model, f){
  const d = model.deti.get(f.k) || [];
  const n = d.find(x => x.typ === "Nadpis_pod");
  return n ? prostyText(n.t) : "";
}
/* Úroveň nadpisu: H1 je název předpisu, struktura začíná od H2. */
function vykreslitStrom(model, korenKlic, ctx){
  const kontejner = document.createDocumentFragment();
  vykreslitDeti(model, korenKlic, kontejner, ctx.uroven || 2, ctx);
  return kontejner;
}
function vykreslitDeti(model, klic, cil, uroven, ctx){
  const deti = model.deti.get(klic) || [];
  let seznam = null, seznamTyp = "";
  for (let i = 0; i < deti.length; i++){
    const f = deti[i];
    if (SEZNAMOVE.has(f.typ)){
      if (!seznam || seznamTyp !== f.typ){
        seznam = el("ol", {class: f.typ === "Bod_Dd" ? "body" : "pismena"});
        seznamTyp = f.typ;
        cil.append(seznam);
      }
      const li = el("li", {id: idFragmentu(f.k)});
      vykreslitObsahUzlu(model, f, li, uroven, ctx);
      seznam.append(li);
      continue;
    }
    seznam = null;
    vykreslitUzel(model, f, cil, uroven, ctx, deti);
  }
}
function vykreslitUzel(model, f, cil, uroven, ctx, sourozenci){
  const typ = f.typ;
  if (typ === "Virtual_Prefix" || typ.startsWith("Prefix_")) return;
  if (typ === "Virtual_PPC"){
    if (!(model.deti.get(f.k) || []).length) return;
    const s = el("section", {id: idFragmentu(f.k), "aria-labelledby": idFragmentu(f.k) + "-n"},
      el("h" + Math.min(6, ctx.uroven || 2), {id: idFragmentu(f.k) + "-n"}, "Poznámky pod čarou"));
    vykreslitDeti(model, f.k, s, uroven + 1, ctx);
    cil.append(s);
    return;
  }
  if (typ.startsWith("Virtual_")){ vykreslitDeti(model, f.k, cil, uroven, ctx); return; }
  if (STRUKTURA.has(typ)){
    const sekce = el("section", {id: idFragmentu(f.k)});
    const titulek = titulekStruktury(model, f);
    const h = el("h" + Math.min(6, uroven), null);
    h.append(prevestHtml(f.t, ctx, text => oznaceni(model, f, text, ctx)));
    if (!f.t) h.append(oznaceni(model, f, f.c || "", ctx));
    if (titulek) h.append(" ", el("span", {class: "titulek"}, titulek));
    if (ctx.zvyraznit === f.k) h.classList.add("zvyrazneno");
    sekce.append(h);
    const d = model.deti.get(f.k) || [];
    const prvniNadpis = d.find(x => x.typ === "Nadpis_pod");
    const zbytek = el("div");
    for (const x of d) if (x === prvniNadpis) x._spotrebovan = true;
    vykreslitDeti(model, f.k, zbytek, uroven + 1, ctx);
    for (const x of d) delete x._spotrebovan;
    sekce.append(...zbytek.childNodes);
    cil.append(sekce);
    return;
  }
  if (f._spotrebovan) return;
  if (typ === "Nadpis_nad"){
    const dalsiStruktura = sourozenci && sourozenci.slice(sourozenci.indexOf(f) + 1).find(x => STRUKTURA.has(x.typ));
    cil.append(el(dalsiStruktura ? "h" + Math.min(6, uroven) : "p", {id: idFragmentu(f.k), class: "nadpis-nad"}, prostyText(f.t)));
    return;
  }
  if (typ === "Nadpis_pod"){ cil.append(el("p", {id: idFragmentu(f.k), class: "nadpis-pod"}, prostyText(f.t))); return; }
  if (typ === "Tabulka"){
    const d = el("div", {class: "tabulka", id: idFragmentu(f.k)});
    d.append(prevestHtml(f.t, ctx));
    cil.append(d);
    vykreslitDeti(model, f.k, cil, uroven, ctx);
    return;
  }
  if (typ === "Block_Citace"){
    const b = el("blockquote", {id: idFragmentu(f.k)});
    vykreslitDeti(model, f.k, b, uroven, ctx);
    cil.append(b);
    return;
  }
  let obal;
  if (typ === "Odstavec_Dc") obal = el("div", {class: "odstavec", id: idFragmentu(f.k)});
  else obal = el("div", {class: "blok " + (typ === "Prefix" ? "uvod" : typ === "Postfix" ? "podpis" : typ === "PPC" ? "ppc" : typ === "Pokracovani_Text" ? "pokracovani" : ""), id: idFragmentu(f.k)});
  vykreslitObsahUzlu(model, f, obal, uroven, ctx);
  cil.append(obal);
}
function vykreslitObsahUzlu(model, f, obal, uroven, ctx){
  if (f.t){
    const p = el("p");
    p.append(prevestHtml(f.t, ctx, text => oznaceni(model, f, text, ctx)));
    if (ctx.zvyraznit === f.k) p.classList.add("zvyrazneno");
    obal.append(p);
  }
  vykreslitDeti(model, f.k, obal, uroven, ctx);
}
/* Označení ustanovení („(1)“, „a)“, „§ 5“) je odkaz na detail ustanovení.
   Přístupný název nese celou citaci a informaci o vyznačení. */
function oznaceni(model, f, text, ctx){
  if (!f.c || !f.k || ctx.bezOdkazu) return el("span", {class: "oznaceni"}, text);
  const v = ctx.vyznaceni && ctx.vyznaceni.get(f.k);
  /* přístupný název začíná viditelným textem (WCAG 2.5.3); citace se přidá jen tam, kde nese informaci navíc */
  const citaceNavic = !STRUKTURA.has(f.typ) && normCitace(f.c) !== normCitace(text) ? " – " + f.c : "";
  const popis = text + citaceNavic + (v ? ", vyznačeno: " + nazvySkupin(v) + (v.poznamka ? ", s poznámkou" : "") : "");
  const frag = document.createDocumentFragment();
  frag.append(el("a", {class: "oznaceni", href: adresa({pohled: "ust", predpis: model.id, ust: f.k, zneni: ctx.zneniVUrl || null}), "aria-label": popis}, text));
  if (v) frag.append(el("span", {class: "znacka", "aria-hidden": "true", title: "Vyznačeno"}, v.poznamka ? "★✎" : "★"));
  return frag;
}
function obsahPredpisu(model){
  const vytvor = klic => {
    const ul = el("ul");
    for (const f of model.deti.get(klic) || []){
      if (f.typ.startsWith("Virtual_")){ const vnor = vytvor(f.k); if (vnor) ul.append(...vnor.childNodes); continue; }
      if (!STRUKTURA.has(f.typ)) continue;
      const t = titulekStruktury(model, f);
      const li = el("li", null, el("a", {href: "#" + idFragmentu(f.k)}, oznaceniFragmentu(f) + (t ? " " + t : "")));
      const vnor = vytvor(f.k);
      if (vnor) li.append(vnor);
      ul.append(li);
    }
    return ul.childNodes.length ? ul : null;
  };
  return vytvor("");
}

/* ==================== TEXT USTANOVENÍ PRO KOPÍROVÁNÍ ==================== */
function textStromu(model, klic, odsazeni){
  odsazeni = odsazeni || "";
  const f = model.mapa.get(klic);
  const radky = [];
  if (f && f.t && !f.typ.startsWith("Virtual_")){
    let t = textFragmentu(model, f);
    if (STRUKTURA.has(f.typ)){ const tit = titulekStruktury(model, f); if (tit) t += " " + tit; }
    radky.push(odsazeni + t);
  }
  for (const d of model.deti.get(klic) || []){
    if (f && STRUKTURA.has(f.typ) && d.typ === "Nadpis_pod" && titulekStruktury(model, f) === prostyText(d.t)) continue;
    radky.push(textStromu(model, d.k, (f && f.t) ? odsazeni + "  " : odsazeni));
  }
  return radky.filter(Boolean).join("\n");
}
function predkove(model, klic){
  const r = [];
  let f = model.mapa.get(klic);
  while (f && f.k !== ""){
    f = model.mapa.get(f.p);
    if (f && f.k !== "" && !f.typ.startsWith("Virtual_")) r.unshift(f);
  }
  return r;
}
/* Nejbližší ustanovení s citací (pro výsledky hledání u fragmentů bez označení). */
function citovatelnyPredek(model, f){
  let x = f;
  while (x && !(x.c && x.k)) x = model.mapa.get(x.p);
  return x || null;
}
function adresaAbsolutni(par){ return new URL(adresa(par), location.href).href; }
function adresaESbirky(id, datum, klic){
  const [r, c] = id.split("/");
  let u = "https://e-sbirka.gov.cz/sb/" + r + "/" + c + (datum && datum !== "0000-00-00" ? "/" + datum : "");
  if (klic && klic.startsWith("norma/")){
    const kotva = klic.split("/").filter(s => /^(par|odst|pism|bod|cl)_/.test(s)).join("-");
    if (kotva) u += "#" + kotva;
  }
  return u;
}
function formatyKopirovani(P, id, model, f){
  const cit = citaceUstanoveni(P, id, f);
  const text = textStromu(model, f.k);
  const odkaz = adresaAbsolutni({pohled: "ust", predpis: id, ust: f.k});
  const zneni = model.datum === "0000-00-00" ? "ve znění při vyhlášení" : "ve znění účinném od " + datumCz(model.datum);
  return [
    ["Citace", cit],
    ["Text ustanovení", text],
    ["Citace a text", cit + "\n" + text],
    ["Citace, znění a text", cit + ", " + zneni + "\n" + text],
    ["Markdown s odkazem", "[" + cit + "](" + odkaz + ")\n\n> " + text.split("\n").join("\n> ")],
    ["Odkaz do aplikace", odkaz],
    ["Odkaz do e-Sbírky", adresaESbirky(id, model.datum, f.k)]
  ];
}

/* ==================== NAVIGACE A ADRESY ==================== */
/* Každý pohled i entita má vlastní adresu. Úložiště (repo, větev, složka) je v adrese
   vždy, takže odkaz zvenku otevře správný pracovní prostor. Token v adrese nikdy není. */
const POHLEDY = ["prehled", "oblast", "predpis", "ust", "vyznacena", "skupina", "hledat", "pridat", "nastaveni"];
function adresa(par){
  const q = new URLSearchParams();
  if (cfg.repo) q.set("repo", cfg.repo);
  if (cfg.vetev && cfg.vetev !== "main") q.set("vetev", cfg.vetev);
  if (cfg.slozka) q.set("slozka", cfg.slozka);
  for (const [k, v] of Object.entries(par || {})){
    if (v === null || v === undefined || v === "") continue;
    if (k === "pohled" && v === "prehled") continue;
    q.set(k, v);
  }
  const s = q.toString().replace(/%2F/g, "/");
  return location.pathname + (s ? "?" + s : "");
}
function parametry(){
  const q = new URLSearchParams(location.search);
  const p = {};
  for (const k of ["pohled", "oblast", "predpis", "ust", "zneni", "skupina", "q", "rozsah", "diakritika", "poznamky"]) if (q.get(k) !== null) p[k] = q.get(k);
  if (!p.pohled || POHLEDY.indexOf(p.pohled) < 0){
    p.pohled = p.ust && p.predpis ? "ust" : p.predpis ? "predpis" : p.skupina ? "skupina" : p.oblast ? "oblast" : p.q ? "hledat" : "prehled";
  }
  return p;
}
function prejit(par, volby){
  const u = adresa(par);
  if (volby && volby.nahradit) history.replaceState(null, "", u); else history.pushState(null, "", u);
  vykreslit({fokus: true});
}
document.addEventListener("click", e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest("a[href]");
  if (!a || a.target) return;
  const u = new URL(a.href, location.href);
  if (u.origin !== location.origin || u.pathname !== location.pathname) return;
  if (u.search === location.search && u.hash){ return; } /* kotva v rámci stránky — necháme prohlížeči */
  e.preventDefault();
  if (wsNeulozeno) ulozWorkspace([], "Úprava pracovního prostoru");
  history.pushState(null, "", u.pathname + u.search + u.hash);
  vykreslit({fokus: true});
});

let vykreslovani = 0;

  try {

      el("p", null, el("a", {href: adresa({pohled: "prehled"})}, "Zpět na přehled"))];
  }
  if (cislo !== vykreslovani) return;
  vykreslitMenu();
  main.replaceChildren(...[].concat(obsah));
  const h1 = main.querySelector("h1");

      if (!cil.hasAttribute("tabindex")) cil.setAttribute("tabindex", "-1");
      cil.scrollIntoView(); cil.focus({preventScroll: true}); return;
    }
  }
  if (volby.fokus && h1){ window.scrollTo(0, 0); h1.focus(); }
}

function normCitace(s){
  return normText(String(s || ""), true).replace(/pism\.?/g, "pism").replace(/odst\.?/g, "odst").replace(/cl\.?/g, "cl")
    .replace(/§/g, "par").replace(/[\s.,)]+/g, "");
}
function najitUstanoveni(model, dotaz){
  const n = normCitace(dotaz);
  if (!n) return null;
  const s = n.startsWith("par") || n.startsWith("cl") || n.startsWith("cast") || n.startsWith("hlava") ? n : "par" + n;

/* Ukázka textu kolem prvního nálezu, s vyznačením všech hledaných slov. */
function ukazka(text, nt, slova){
  const OKNO = 90;
  let prvni = Math.min(...slova.map(s => nt.indexOf(s)).filter(i => i >= 0));
  if (!isFinite(prvni)) prvni = 0;
  const zac = Math.max(0, prvni - OKNO), kon = Math.min(text.length, prvni + OKNO * 2);
  const usek = text.slice(zac, kon), nusek = nt.slice(zac, kon);
  const znacky = [];
  for (const s of slova){ let i = -1; while ((i = nusek.indexOf(s, i + 1)) >= 0) znacky.push([i, i + s.length]); }
  znacky.sort((a, b) => a[0] - b[0]);
  const frag = document.createDocumentFragment();
  if (zac > 0) frag.append("… ");
  let pos = 0;
  for (const [a, b] of znacky){ if (a < pos) continue; frag.append(usek.slice(pos, a), el("mark", null, usek.slice(a, b))); pos = b; }
  frag.append(usek.slice(pos));
  if (kon < text.length) frag.append(" …");
  return frag;
}

  out.push(el("p", null, "Pracovní prostor je složka v GitHub repozitáři. V ní je soubor " + SOUBOR_WS + " s oblastmi, skupinami a vyznačeními a složka predpisy se staženými zněními (každé znění v samostatných menších souborech). Každé uložení je commit."));
  out.push(el("p", null, "V tomto prohlížeči zůstává jen token a adresa úložiště. Token se nikam jinam neposílá a do odkazů se nedostane. Adresu úložiště lze předat i odkazem — parametry repo, slozka a případně vetev."));
  const repo = el("input", {type: "text", autocomplete: "off", spellcheck: "false"}); repo.value = cfg.repo;
  const vetev = el("input", {type: "text", autocomplete: "off", spellcheck: "false"}); vetev.value = cfg.vetev || "main";
  const slozka = el("input", {type: "text", autocomplete: "off", spellcheck: "false"}); slozka.value = cfg.slozka;
  const token = el("input", {type: "password", autocomplete: "off", spellcheck: "false"}); token.value = cfg.token;
  const stav = el("p", {class: "tichy"});
  out.push(el("form", {onsubmit: async e => {
    e.preventDefault();
    const zmenaUloziste = repo.value.trim() !== cfg.repo || (vetev.value.trim() || "main") !== cfg.vetev || normSlozka(slozka.value) !== cfg.slozka;
    cfg.repo = repo.value.trim(); cfg.vetev = vetev.value.trim() || "main"; cfg.slozka = normSlozka(slozka.value); cfg.token = token.value.trim();
    if (!maUloziste()){ stav.textContent = "Repozitář zadejte ve tvaru vlastník/název."; repo.focus(); return; }
    ulozCfg();
    stav.textContent = "Uloženo. Načítám pracovní prostor…";
    if (zmenaUloziste || !wsNacteno) await nactiWorkspace();
    oznam("Nastavení uloženo");
    prejit({pohled: "prehled"});
  }},
    pole("Repozitář", repo, "Ve tvaru vlastník/název, například egdilna/legislativa."),
    pole("Větev", vetev),
    pole("Složka pracovního prostoru", slozka, "Cesta ke složce v repozitáři. Prázdné pole znamená kořen repozitáře."),
    pole("GitHub token (osobní přístupový token)", token, "Stačí token s právem zápisu obsahu do daného repozitáře. U veřejného repozitáře jde pracovní prostor číst i bez tokenu, ukládat ale ne."),
    el("button", {type: "submit"}, "Uložit nastavení a načíst"), stav));
  if (W){
    out.push(el("h2", null, "Pracovní prostor"));
    const n = el("input", {type: "text", autocomplete: "off"}); n.value = W.nazev || "";
    out.push(el("form", {onsubmit: e => { e.preventDefault(); if (!n.value.trim()) return; W.nazev = n.value.trim(); zmeneno(); oznam("Název uložen"); vykreslitMenu(); }},
      pole("Název pracovního prostoru", n), el("button", {type: "submit"}, "Přejmenovat")));
  }
  if (maUloziste()){
    out.push(el("h2", null, "Historie pracovního prostoru"));
    const box = el("div");
    out.push(el("p", null, "Každé uložení je commit souboru " + SOUBOR_WS + ". Starší verzi můžete obnovit — staženým předpisům se tím nic nestane."),
      el("p", null, el("button", {type: "button", class: "druhe", onclick: () => historie(box)}, "Zobrazit historii")), box);
    out.push(el("p", null, el("button", {type: "button", class: "druhe", onclick: async () => { await nactiWorkspace(); oznam("Pracovní prostor znovu načten"); prejit({pohled: "prehled"}); }}, "Znovu načíst pracovní prostor z GitHubu")));
  }
  out.push(el("h2", null, "O aplikaci"));
  out.push(el("p", null, "Legislativní prohlížeč " + APP_VERZE + ". Data předpisů pocházejí z otevřených dat e-Sbírky (Ministerstvo vnitra, licence CC BY 4.0) a stahují se jen pro předpisy, které si zařadíte do knihovny."));
  return out;
}
async function historie(box){
  box.replaceChildren(zprava("Načítám historii…"));
  try {
    const seznam = await gh("commits?path=" + encodeURIComponent(cestaWs(SOUBOR_WS)) + "&sha=" + encodeURIComponent(cfg.vetev || "main") + "&per_page=30", {cache: "no-store"});
    if (!seznam.length){ box.replaceChildren(zprava("Soubor zatím nemá žádnou historii.")); return; }
    box.replaceChildren(el("ol", {class: "seznam"}, seznam.map(c => el("li", null,
      casCz(c.commit.committer.date) + " — " + (c.commit.message || "").split("\n")[0] + " ",
      el("button", {type: "button", class: "druhe", onclick: async () => {
        if (!confirm("Obnovit pracovní prostor do stavu z " + casCz(c.commit.committer.date) + "? Novější změny vyznačení a oblastí se tím přepíšou (v historii zůstanou).")) return;
        try {
          const text = await ghCist(cestaWs(SOUBOR_WS), {ref: c.sha, cache: "no-store"});
          W = normalizovatWs(JSON.parse(text)); wsNacteno = true; cacheZneni.clear();
          if (await ulozWorkspace([], "Obnovení pracovního prostoru z verze " + c.sha.slice(0, 7))){ oznam("Verze obnovena"); prejit({pohled: "prehled"}); }
        } catch (e){ box.prepend(zprava("Obnovení selhalo: " + e.message, "chyba")); }
      }}, "Obnovit tuto verzi")))));
  } catch (e){ box.replaceChildren(zprava("Historii nelze načíst: " + e.message, "chyba")); }
}

$("#ladeni-vymazat").addEventListener("click", () => { $("#ladeni-seznam").replaceChildren(); oznam("Výpis vymazán"); });
$("#ladeni-kopirovat").addEventListener("click", () => kopirovat(Array.from($("#ladeni-seznam").children).map(li => li.textContent).join("\n"), "ladicí výpis"));
async function start(){
  log("Legislativní prohlížeč " + APP_VERZE);
  nactiCfg();
  if (maUloziste()) await nactiWorkspace();
  else stavUlozeni("Není nastavené úložiště.");
  await vykreslit({fokus: false});
}
start();
