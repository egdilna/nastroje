<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legislativní prohlížeč</title>
<style>
/* ==================== BARVY A ZÁKLAD ==================== */
:root{
  --pozadi:#ffffff; --text:#1b1b1b; --tlumeny:#555b66; --linka:#c9ced6;
  --odkaz:#0b4fb3; --odkaz-navstiveny:#5b2ca0; --zvyrazneni:#fff3b0; --znacka:#a14a00;
  --plocha:#f3f5f8; --tlacitko:#0b4fb3; --tlacitko-text:#ffffff; --chyba:#a40e0e; --ok:#1e6b2a;
  --fokus:#d35400;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --pozadi:#15171a; --text:#ececec; --tlumeny:#a7adb7; --linka:#3a3f47;
    --odkaz:#8ab8ff; --odkaz-navstiveny:#c6a7ff; --zvyrazneni:#4a4200; --znacka:#ffb36b;
    --plocha:#1f2328; --tlacitko:#8ab8ff; --tlacitko-text:#0e1116; --chyba:#ff8a8a; --ok:#7fd88f;
    --fokus:#ffb36b;
  }
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;background:var(--pozadi);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
a{color:var(--odkaz)} a:visited{color:var(--odkaz-navstiveny)}
:focus-visible{outline:3px solid var(--fokus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.preskocit{position:absolute;left:-9999px}
.preskocit:focus{left:8px;top:8px;background:var(--pozadi);padding:6px 10px;z-index:10}
.hlavicka,.drobecky,main,footer{max-width:62rem;margin:0 auto;padding:0 1rem}
.hlavicka{border-bottom:1px solid var(--linka);padding-top:.5rem;padding-bottom:.5rem}
.aplikace{margin:0;font-weight:600;color:var(--tlumeny)}
.menu{list-style:none;margin:.3rem 0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem 1.2rem}
.stav-ulozeni{margin:.2rem 0 0;color:var(--tlumeny);font-size:.92rem}
.stav-ulozeni.chyba{color:var(--chyba);font-weight:600}
.drobecky ol{list-style:none;margin:.6rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.2rem}
.drobecky li+li::before{content:"›";margin:0 .4rem;color:var(--tlumeny)}
main{padding-bottom:3rem}
h1{font-size:1.6rem;line-height:1.25;margin:1rem 0 .6rem}
h2{font-size:1.3rem;margin:1.6rem 0 .5rem}
h3{font-size:1.15rem;margin:1.3rem 0 .4rem}
h4,h5,h6{font-size:1.05rem;margin:1.1rem 0 .3rem}
.tichy{color:var(--tlumeny)}
.chyba-text{color:var(--chyba);font-weight:600}
.ok-text{color:var(--ok)}
button,.tlacitko{font:inherit;cursor:pointer;border:1px solid var(--tlacitko);background:var(--tlacitko);
  color:var(--tlacitko-text);border-radius:6px;padding:.35rem .8rem;margin:.15rem .3rem .15rem 0}

input[type=text],input[type=password],input[type=search],select,textarea{font:inherit;color:inherit;
  background:var(--pozadi);border:1px solid var(--linka);border-radius:6px;padding:.35rem .5rem;max-width:100%}

label{display:inline-block;margin:.2rem 0}
.pole{margin:.6rem 0}
.pole>label{display:block;font-weight:600}
.pole input[type=text],.pole input[type=password],.pole input[type=search],.pole select{width:min(100%,32rem)}

.radek-volby{display:block}

#ladeni-seznam{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;max-height:none}

/* ==================== TEXT PŘEDPISU ==================== */
.predpis-text{margin-top:1rem}

.predpis-text .uvod{font-style:italic}

.predpis-text .odstavec>p,.predpis-text li>p{margin:.25rem 0}
.predpis-text ol.pismena,.predpis-text ol.body{list-style:none;margin:.2rem 0 .4rem;padding-left:1.6rem}
.predpis-text ol.body{padding-left:1.4rem}

.znacka{color:var(--znacka);font-weight:700;margin:0 .25rem}

.vyznaceni-polozka{border-top:1px solid var(--linka);padding:.5rem 0}

.vysledek-hledani p{margin:.15rem 0}

<body>
<a class="preskocit" href="#obsah">Přeskočit na obsah</a>
<header class="hlavicka">
  <p class="aplikace">Legislativní prohlížeč<span id="ws-nazev"></span></p>
  <nav aria-label="Hlavní nabídka">
    <ul class="menu" id="menu"></ul>
  </nav>
  <p id="stav-ulozeni" class="stav-ulozeni"></p>
</header>
<nav class="drobecky" id="drobecky" aria-label="Drobečková navigace"></nav>
<main id="obsah" tabindex="-1"></main>
<div id="oznameni" class="vh" role="status" aria-live="polite"></div>
<footer>
  <p>legprohlizec · data <a href="https://e-sbirka.gov.cz/">e-Sbírka</a> (Ministerstvo vnitra, CC BY 4.0) · <a href="https://github.com/egdilna/nastroje/issues">Hlášení chyb</a></p>
  <details id="ladeni">
    <summary>Ladicí výpis</summary>
    <p><button type="button" class="druhe" id="ladeni-vymazat">Vymazat výpis</button>
       <button type="button" class="druhe" id="ladeni-kopirovat">Zkopírovat výpis</button></p>
    <ol id="ladeni-seznam"></ol>
  </details>
</footer>
<script>
"use strict";
/* =====================================================================
   legprohlizec — personalizovaná práce s legislativou nad daty e-Sbírky
   Jednosouborová aplikace. Data: veřejný SPARQL endpoint e-Sbírky (bez klíče,
   čtení metodou GET kvůli CORS). Úložiště: složka v GitHub repozitáři.
   Podrobnosti k architektuře jsou v leg/CLAUDE.md.
   ===================================================================== */
const APP_VERZE = "1.10.0";

/* ==================== POMOCNÉ ==================== */
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, atributy, ...deti){
  const e = document.createElement(tag);
  if (atributy) for (const [k, v] of Object.entries(atributy)){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  pridatDeti(e, deti);
  return e;
}
function pridatDeti(e, deti){
  for (const d of deti){
    if (d === null || d === undefined || d === false) continue;
    if (Array.isArray(d)) pridatDeti(e, d);
    else if (d instanceof Node) e.append(d);
    else e.append(document.createTextNode(String(d)));
  }
}
const vh = t => el("span", {class: "vh"}, t);
function oznam(t){
  const o = $("#oznameni");
  o.textContent = "";
  setTimeout(() => { o.textContent = t; }, 60);
}
function log(t, data){
  const s = $("#ladeni-seznam");
  const cas = new Date().toLocaleTimeString("cs-CZ");
  s.append(el("li", null, cas + " " + t + (data !== undefined ? " — " + (typeof data === "string" ? data : JSON.stringify(data)) : "")));
  while (s.children.length > 400) s.firstChild.remove();
}
function dnesIso(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function datumCz(iso){
  if (!iso || iso === "0000-00-00") return "znění při vyhlášení";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? (+m[3]) + ". " + (+m[2]) + ". " + m[1] : iso;
}
function casCz(iso){
  try { return new Date(iso).toLocaleString("cs-CZ", {day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit"}); }
  catch (e){ return iso; }
}
function pocetSlov(n, jeden, dva, pet){
  const a = Math.abs(n);
  return n + " " + (a === 1 ? jeden : (a >= 2 && a <= 4) ? dva : pet);
}
function novyId(predpona){ return predpona + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
/* Bez diakritiky a malými písmeny — znak po znaku, aby délka zůstala stejná
   a pozice nálezu šla promítnout zpět do původního textu. */
function normZnak(z){
  const r = z.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  return r.length === 1 ? r : z.toLowerCase().charAt(0) || z;
}
function normText(s, bezDiakritiky){
  if (!bezDiakritiky) return Array.from(s, z => { const l = z.toLowerCase(); return l.length === 1 ? l : z; }).join("");
  return Array.from(s, normZnak).join("");
}
async function kopirovat(text, popis){
  try {
    await navigator.clipboard.writeText(text);
  } catch (e){
    const t = el("textarea", {class: "vh"}); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); } catch (e2){ log("Kopírování selhalo", e2.message); oznam("Kopírování se nepodařilo"); t.remove(); return; }
    t.remove();
  }
  oznam("Zkopírováno: " + popis);
}

/* ==================== STAV ULOŽENÍ ==================== */
function stavUlozeni(t, chyba){
  const p = $("#stav-ulozeni");
  p.textContent = t || "";
  p.classList.toggle("chyba", !!chyba);
}

/* ==================== KONFIGURACE ==================== */
/* V prohlížeči zůstává jen přístup k repozitáři (token, repozitář, větev, složka).
   Token se nikdy nedostane do URL, do repozitáře ani do ladicího výpisu. */
const KLIC_CFG = "legprohlizec-nastaveni-v1";
const cfg = {token: "", repo: "", vetev: "main", slozka: ""};
let cfgZUrl = false;
function normSlozka(s){ return String(s || "").trim().replace(/^\/+/, "").replace(/\/+$/, ""); }
function nactiCfg(){
  try {
    const u = JSON.parse(localStorage.getItem(KLIC_CFG) || "{}");
    cfg.token = u.token || ""; cfg.repo = u.repo || ""; cfg.vetev = u.vetev || "main"; cfg.slozka = normSlozka(u.slozka);
  } catch (e){ log("Uložené nastavení se nepodařilo přečíst", e.message); }
  const q = new URLSearchParams(location.search);
  if (q.get("repo")){ cfg.repo = q.get("repo").trim(); cfgZUrl = true; }
  if (q.get("vetev")){ cfg.vetev = q.get("vetev").trim(); cfgZUrl = true; }
  if (q.has("slozka")){ cfg.slozka = normSlozka(q.get("slozka")); cfgZUrl = true; }
  if (cfgZUrl) log("Úložiště převzato z adresy", cfg.repo + " / " + (cfg.slozka || "(kořen)"));
}
function ulozCfg(){
  try { localStorage.setItem(KLIC_CFG, JSON.stringify({token: cfg.token, repo: cfg.repo, vetev: cfg.vetev, slozka: cfg.slozka})); }
  catch (e){ log("Nastavení nelze uložit do prohlížeče", e.message); }
}
const cestaWs = rel => (cfg.slozka ? cfg.slozka + "/" : "") + rel;
const maUloziste = () => /^[^/\s]+\/[^/\s]+$/.test(cfg.repo);

/* ==================== GITHUB ==================== */
/* Čtení jde přes Contents API s hlavičkou raw (soubory až do 100 MB, bez base64).
   Kdyby raw selhal, záloha čte JSON a obsah nad 1 MB dotáhne z Git Data API podle SHA.
   Zápis je vždy commit poskládaný z Git Data API (strom s více soubory naráz),
   takže stažení předpisu i úprava workspace jsou jeden konzistentní commit. */
async function gh(cesta, volby){
  volby = volby || {};
  const hl = Object.assign({Accept: "application/vnd.github+json"}, volby.headers || {});
  if (cfg.token) hl.Authorization = "Bearer " + cfg.token;
  const r = await fetch("https://api.github.com/repos/" + (volby.repo || cfg.repo) + "/" + cesta,
    {method: volby.method || "GET", headers: hl, body: volby.body, cache: volby.cache || "default"});
  if (!r.ok){
    const t = await r.text().catch(() => "");
    const e = new Error("GitHub " + r.status + ": " + t.slice(0, 200));
    e.status = r.status; throw e;
  }
  return volby.text ? r.text() : r.json();
}
function cestaUrl(p){ return p.split("/").map(encodeURIComponent).join("/"); }
function base64DoTextu(b){
  const s = atob(String(b).replace(/\s+/g, "")), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return new TextDecoder().decode(u);
}
async function ghCist(cesta, volby){
  volby = volby || {};
  const ref = volby.ref || volby.vetev || cfg.vetev || "main";
  const adresa = "contents/" + cestaUrl(cesta) + "?ref=" + encodeURIComponent(ref);
  try {
    return await gh(adresa, {repo: volby.repo, text: true, cache: volby.cache, headers: {Accept: "application/vnd.github.raw"}});
  } catch (e){
    if (e.status === 404) return null;
    log("Čtení raw selhalo, zkouším zálohu přes JSON a blob", cesta + ": " + e.message);
    const sr = await gh(adresa, {repo: volby.repo, cache: volby.cache});
    if (sr.content && sr.encoding === "base64") return base64DoTextu(sr.content);
    const blob = await gh("git/blobs/" + sr.sha, {repo: volby.repo});
    if (blob.encoding !== "base64") throw new Error("nečekané kódování blobu: " + blob.encoding);
    return base64DoTextu(blob.content);
  }
}
const GH_DAVKA = 3500000; /* bajtů obsahu na jeden commit — velké stahování se rozdělí */
async function ghCommit(soubory, zprava){
  if (!cfg.token) throw new Error("Chybí GitHub token — bez něj nelze ukládat. Zadejte ho v Nastavení.");
  const davky = [];
  let davka = [], velikost = 0;
  for (const s of soubory){
    const v = s.text ? s.text.length * 1.3 : 100;
    if (davka.length && velikost + v > GH_DAVKA){ davky.push(davka); davka = []; velikost = 0; }
    davka.push(s); velikost += v;
  }
  if (davka.length) davky.push(davka);
  for (let i = 0; i < davky.length; i++){
    const z = davky.length > 1 ? zprava + " (" + (i + 1) + "/" + davky.length + ")" : zprava;
    await ghCommitDavka(davky[i], z);
  }
}
async function ghCommitDavka(soubory, zprava, pokus){
  const vetev = cfg.vetev || "main";
  const ref = await gh("git/ref/heads/" + encodeURIComponent(vetev), {cache: "no-store"});
  const rodic = ref.object.sha;
  const rodicCommit = await gh("git/commits/" + rodic);
  const strom = await gh("git/trees", {method: "POST", body: JSON.stringify({
    base_tree: rodicCommit.tree.sha,
    tree: soubory.map(s => s.smazat
      ? {path: s.cesta, mode: "100644", type: "blob", sha: null}
      : {path: s.cesta, mode: "100644", type: "blob", content: s.text})
  })});
  const commit = await gh("git/commits", {method: "POST", body: JSON.stringify({message: zprava, tree: strom.sha, parents: [rodic]})});
  try {
    await gh("git/refs/heads/" + encodeURIComponent(vetev), {method: "PATCH", body: JSON.stringify({sha: commit.sha})});
  } catch (e){
    /* mezitím přibyl jiný commit — jednou zopakovat nad novým stavem větve */
    if (!pokus && (e.status === 422 || e.status === 409)){ log("Větev se mezitím změnila, opakuji commit"); return ghCommitDavka(soubory, zprava, 1); }
    throw e;
  }
  log("Commit uložen", zprava);
}

/* ==================== WORKSPACE ==================== */
const SOUBOR_WS = "legprohlizec.json";
let W = null;              /* stav workspace */
let wsNacteno = false;     /* pojistka: dokud nevíme, co v souboru je, nic neukládáme */
let wsChybi = false;       /* soubor v repozitáři zatím neexistuje */
let wsChyba = "";
let wsCasovac = null, wsBezi = false, wsCeka = false, wsNeulozeno = false;
let posledniUlozeni = null;

function prazdnyWorkspace(nazev){
  return {format: "legprohlizec", verze: 1, nazev: nazev, zalozeno: new Date().toISOString(),
    oblasti: [], predpisy: {}, skupiny: [], vyznaceni: [], skupinyKomentaru: [], komentare: [], stitky: [], stitkyUstanoveni: []};
}
function normalizovatWs(d){
  const w = Object.assign(prazdnyWorkspace(""), d || {});
  if (!Array.isArray(w.oblasti)) w.oblasti = [];
  if (!w.predpisy || typeof w.predpisy !== "object") w.predpisy = {};
  if (!Array.isArray(w.skupiny)) w.skupiny = [];
  if (!Array.isArray(w.vyznaceni)) w.vyznaceni = [];
  if (!Array.isArray(w.skupinyKomentaru)) w.skupinyKomentaru = [];
  if (!Array.isArray(w.komentare)) w.komentare = [];
  w.komentare.forEach(k => { if (!Array.isArray(k.skupiny)) k.skupiny = []; });
  if (!Array.isArray(w.stitky)) w.stitky = [];
  if (!Array.isArray(w.stitkyUstanoveni)) w.stitkyUstanoveni = [];
  w.stitkyUstanoveni = w.stitkyUstanoveni.filter(z => z && Array.isArray(z.stitky) && z.stitky.length);
  for (const P of Object.values(w.predpisy)) if (!Array.isArray(P.stitky)) P.stitky = [];
  /* štítky vždy malými písmeny; starší štítky se převedou a shodné se sloučí */
  const slouceni = {}, podleNazvu = new Map();
  w.stitky = w.stitky.filter(t => {
    t.nazev = String(t.nazev || "").trim().toLowerCase();
    const d = podleNazvu.get(t.nazev);
    if (d){ slouceni[t.id] = d.id; if (!d.popis && t.popis) d.popis = t.popis; return false; }
    podleNazvu.set(t.nazev, t);
    return true;
  });
  if (Object.keys(slouceni).length){
    const preved = ids => Array.from(new Set(ids.map(i => slouceni[i] || i)));
    for (const P of Object.values(w.predpisy)) P.stitky = preved(P.stitky);
    w.stitkyUstanoveni.forEach(z => { z.stitky = preved(z.stitky); });
  }
  w.oblasti.forEach(o => { if (!Array.isArray(o.predpisy)) o.predpisy = []; });
  for (const p of Object.values(w.predpisy)) if (!p.zneni) p.zneni = {};
  w.vyznaceni.forEach(v => { if (!Array.isArray(v.skupiny)) v.skupiny = []; });
  return w;
}
async function nactiWorkspace(){
  W = null; wsNacteno = false; wsChybi = false; wsChyba = "";
  cacheZneni.clear();
  cachePoznamek.clear();
  if (!maUloziste()){ stavUlozeni("Není nastavené úložiště."); return; }
  stavUlozeni("Načítám pracovní prostor z GitHubu…");
  try {
    const text = await ghCist(cestaWs(SOUBOR_WS), {cache: "no-store"});
    if (text === null){
      wsChybi = true; wsNacteno = true;   /* soubor ještě není — není co ztratit */
      stavUlozeni("Pracovní prostor v této složce zatím neexistuje.");
      log("Workspace neexistuje", cestaWs(SOUBOR_WS));
      return;
    }
    let d;
    try { d = JSON.parse(text); }
    catch (e){ throw new Error("soubor " + SOUBOR_WS + " není platný JSON (" + e.message + "). Starší verzi najdete v Nastavení v historii."); }
    W = normalizovatWs(d);
    wsNacteno = true;
    stavUlozeni("Načteno z GitHubu.");
    log("Workspace načten", Object.keys(W.predpisy).length + " předpisů");
  } catch (e){
    wsChyba = e.message;
    stavUlozeni("Pracovní prostor se nepodařilo načíst — ukládání je zastavené, aby se data nepřepsala. " + e.message, true);
    log("Chyba načtení workspace", e.message);
  }
}
function textWorkspace(){ return JSON.stringify(W, null, 1); }
/* Drobná změna (vyznačení, poznámka, oblast) — uloží se se zpožděním. */
function zmeneno(){
  wsNeulozeno = true;
  stavUlozeni("Neuložené změny — ukládám za chvíli…");
  clearTimeout(wsCasovac);
  wsCasovac = setTimeout(() => { ulozWorkspace([], "Úprava pracovního prostoru"); }, 1500);
}
async function ulozWorkspace(dalsiSoubory, zprava){
  clearTimeout(wsCasovac);
  if (!W) return false;
  if (!wsNacteno){
    stavUlozeni("Neuloženo — obsah repozitáře se nepodařilo načíst, uložení by ho přepsalo.", true);
    return false;
  }
  if (!cfg.token){
    stavUlozeni("Neuloženo — chybí GitHub token. Zadejte ho v Nastavení.", true);
    return false;
  }
  if (wsBezi){ wsCeka = true; if (dalsiSoubory && dalsiSoubory.length) await cekatNaUlozeni(); else return false; }
  wsBezi = true;
  stavUlozeni("Ukládám do GitHubu…");
  try {
    await ghCommit((dalsiSoubory || []).concat([{cesta: cestaWs(SOUBOR_WS), text: textWorkspace()}]), zprava || "Úprava pracovního prostoru");
    wsNeulozeno = false; wsChybi = false; posledniUlozeni = new Date();
    stavUlozeni("Uloženo do GitHubu v " + posledniUlozeni.toLocaleTimeString("cs-CZ", {hour: "2-digit", minute: "2-digit"}) + ".");
    return true;
  } catch (e){
    stavUlozeni("Uložení do GitHubu selhalo: " + e.message, true);
    log("Chyba uložení", e.message);
    return false;
  } finally {
    wsBezi = false;
    if (wsCeka){ wsCeka = false; if (wsNeulozeno) setTimeout(() => ulozWorkspace([], "Úprava pracovního prostoru"), 300); }
  }
}
function cekatNaUlozeni(){
  return new Promise(res => { const t = setInterval(() => { if (!wsBezi){ clearInterval(t); res(); } }, 200); });
}
window.addEventListener("beforeunload", e => { if (wsNeulozeno || jeRozepsano()){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && wsNeulozeno) ulozWorkspace([], "Úprava pracovního prostoru"); });

/* ==================== SPARQL E-SBÍRKY ==================== */
/* Dotazy jdou výhradně metodou GET — jen na ni server posílá hlavičky CORS.
   Před serverem je bezpečnostní filtr, který odmítá některé texty dotazu (403);
   proto se ve filtrech nepoužívají IRI položek číselníku typů fragmentů
   (např. …/položka/Prefix_Title) — typ se filtruje až v aplikaci. */
const SPARQL = "https://opendata.eselpoint.gov.cz/sparql";
const ESB = "https://opendata.eselpoint.gov.cz/esel-esb/";
const ELI = ESB + "eli/";
const PFX = "PREFIX e: <https://slovník.gov.cz/datový/sbírka/pojem/> ";
const aktIri = id => ELI + "cz/sb/" + id;
const zneniIri = (id, datum) => aktIri(id) + "/" + datum;

async function sparql(dotaz){
  const adresa = SPARQL + "?query=" + encodeURIComponent(PFX + dotaz);
  let posledni;
  for (let pokus = 0; pokus < 3; pokus++){
    try {
      const r = await fetch(adresa, {headers: {Accept: "application/sparql-results+json"}});
      if (r.status === 403){ throw Object.assign(new Error("Server e-Sbírky dotaz odmítl (403) — zasáhl jeho bezpečnostní filtr."), {konec: true}); }
      if (!r.ok) throw new Error("Server e-Sbírky odpověděl chybou " + r.status);
      const d = await r.json();
      return d.results.bindings.map(b => { const o = {}; for (const k in b) o[k] = b[k].value; return o; });
    } catch (e){
      posledni = e;
      if (e.konec) throw e;
      log("Dotaz na e-Sbírku selhal, zkusím znovu", e.message);
      await new Promise(r => setTimeout(r, 1200 * (pokus + 1)));
    }
  }
  throw posledni;
}
const EP = "https://slovník.gov.cz/datový/sbírka/pojem/";
/* Předpis: citace a seznam znění (data účinnosti). */
async function esbMeta(id){
  const r = await sparql("SELECT ?p ?o WHERE { <" + aktIri(id) + "> ?p ?o }");
  if (!r.length) return {existuje: false};
  const m = {existuje: true, zneni: [], citace: "", posledni: "", vyhlasene: ""};
  for (const x of r){
    const p = x.p.replace(EP, "");
    if (p === "citace-právního-aktu") m.citace = x.o;
    else if (p === "má-znění"){ const d = x.o.split("/").pop(); if (m.zneni.indexOf(d) < 0) m.zneni.push(d); }
    else if (p === "má-poslední-znění") m.posledni = x.o.split("/").pop();
    else if (p === "má-vyhlášené-znění") m.vyhlasene = x.o.split("/").pop();
  }
  m.zneni.sort();
  return m;
}
/* Hlavička předpisu (číslo, druh, datum, název) z fragmentů pod „prefix“. */
async function esbHlavicka(id, datum){
  const z = zneniIri(id, datum);
  const r = await sparql("SELECT ?typ ?t WHERE { ?f e:má-předka <" + z + "/dokument/prefix> ; e:obsahuje-fragment ?x . ?x e:má-typ-fragmentu ?typ ; e:text-fragmentu ?t }");
  const h = {cislo: "", typ: "", datum: "", nazev: ""};
  for (const x of r){
    const t = x.typ.split("/").pop(), text = prostyText(x.t);
    if (t === "Prefix_Number") h.cislo = text;
    else if (t === "Prefix_Type") h.typ = text;
    else if (t === "Prefix_Date") h.datum = text.replace(/,\s*$/, "");
    else if (t === "Prefix_Title") h.nazev = text;
  }
  return h;
}
/* Celé znění: všechny fragmenty v pořadí dokumentu, po stránkách. */
async function esbFragmenty(id, datum, prubeh){
  const z = zneniIri(id, datum), zaklad = z + "/dokument";
  const STRANKA = 2500;
  const vse = [], videno = new Set();
  for (let offset = 0; ; offset += STRANKA){
    if (prubeh) prubeh("Stahuji text znění " + datumCz(datum) + " — " + vse.length + " částí textu…");
    const r = await sparql("SELECT ?f ?p ?c ?o ?typ ?t WHERE { <" + z + "> e:má-fragment-znění ?f . "
      + "?f e:pořadí-fragmentu-znění-právního-aktu ?o ; e:obsahuje-fragment ?x . "
      + "OPTIONAL { ?f e:má-předka ?p } OPTIONAL { ?f e:citace-označení-fragmentu-znění-právního-aktu ?c } "
      + "OPTIONAL { ?x e:má-typ-fragmentu ?typ } OPTIONAL { ?x e:text-fragmentu ?t } } ORDER BY ?o ?f LIMIT " + STRANKA + " OFFSET " + offset);
    for (const x of r){
      if (videno.has(x.f)) continue;
      videno.add(x.f);
      const klic = x.f === zaklad ? "" : x.f.startsWith(zaklad + "/") ? x.f.slice(zaklad.length + 1) : x.f;
      const rodic = !x.p ? null : x.p === zaklad ? "" : x.p.startsWith(zaklad + "/") ? x.p.slice(zaklad.length + 1) : null;
      vse.push({o: x.o, f: [klic, rodic, (x.typ || "").split("/").pop(), x.c || "", x.t || ""]});
    }
    if (r.length < STRANKA) break;
  }
  vse.sort((a, b) => a.o < b.o ? -1 : a.o > b.o ? 1 : 0);
  return vse.map(v => v.f);
}
/* Cíle odkazů z textu (data-odkaz-id) — po dávkách přes VALUES. */
async function esbOdkazy(idcka, prubeh){
  const mapa = {};
  const DAVKA = 250;
  for (let i = 0; i < idcka.length; i += DAVKA){
    if (prubeh) prubeh("Dohledávám cíle odkazů — " + Math.min(i + DAVKA, idcka.length) + " z " + idcka.length + "…");
    const d = idcka.slice(i, i + DAVKA).map(x => "od:" + x).join(" ");
    const r = await sparql("PREFIX od: <" + ESB + "právní-akt-odkaz/> SELECT ?o ?cil ?cit WHERE { VALUES ?o { " + d + " } ?o e:má-cíl ?cil . OPTIONAL { ?o e:citace-cíle-odkazu ?cit } }");
    for (const x of r){
      const idOdk = x.o.split("/").pop();
      mapa[idOdk] = [x.cil.startsWith(ELI) ? x.cil.slice(ELI.length) : x.cil, x.cit ? prostyText(x.cit) : ""];
    }
  }
  return mapa;
}
/* Které znění je aktuální a která budoucí. */
function rozdelZneni(data){
  const dnes = dnesIso();
  const skutecna = data.filter(d => d !== "0000-00-00").sort();
  if (!skutecna.length) return {aktualni: data.indexOf("0000-00-00") >= 0 ? "0000-00-00" : null, budouci: []};
  const minula = skutecna.filter(d => d <= dnes);
  const aktualni = minula.length ? minula[minula.length - 1] : skutecna[0];
  return {aktualni, budouci: skutecna.filter(d => d > dnes && d !== aktualni)};
}

/* ==================== PŘEDPISY — IDENTIFIKACE ==================== */
/* „110/2019“, „110/2019 Sb.“, „zákon č. 110/2019 Sb.“, ELI nebo adresa e-Sbírky → „2019/110“ */
function rozpoznatPredpis(vstup){
  const s = String(vstup || "").trim();
  let m = /(?:eli\/cz\/sb|e-sbirka\.gov\.cz\/sb)\/(\d{4})\/(\d+)/i.exec(s);
  if (m) return m[1] + "/" + (+m[2]);
  m = /(?:^|\D)(\d{1,4})\s*\/\s*(\d{4})(?:\D|$)/.exec(s);
  if (m) return m[2] + "/" + (+m[1]);
  m = /^(\d{4})\/(\d{1,4})$/.exec(s);
  if (m) return m[1] + "/" + (+m[2]);
  return null;
}
const citacePredpisuZId = id => { const [r, c] = id.split("/"); return c + "/" + r + " Sb."; };
const slozkaPredpisu = id => "predpisy/" + id.replace("/", "-");
const SKLONOVANI = {
  "ZÁKON": ["Zákon", "zákona"], "ÚSTAVNÍ ZÁKON": ["Ústavní zákon", "ústavního zákona"],
  "NAŘÍZENÍ VLÁDY": ["Nařízení vlády", "nařízení vlády"], "NAŘÍZENÍ": ["Nařízení", "nařízení"],
  "VYHLÁŠKA": ["Vyhláška", "vyhlášky"], "SDĚLENÍ": ["Sdělení", "sdělení"], "NÁLEZ": ["Nález", "nálezu"],
  "ROZHODNUTÍ": ["Rozhodnutí", "rozhodnutí"], "USNESENÍ": ["Usnesení", "usnesení"],
  "OPATŘENÍ": ["Opatření", "opatření"], "ZÁKONNÉ OPATŘENÍ SENÁTU": ["Zákonné opatření Senátu", "zákonného opatření Senátu"],
  "DEKRET": ["Dekret", "dekretu"], "VYHLÁŠENÍ": ["Vyhlášení", "vyhlášení"]
};
function druhPredpisu(P, padGenitiv){
  const t = String((P && P.typ) || "").toUpperCase().replace(/\s+/g, " ").trim();
  const s = SKLONOVANI[t];
  if (s) return s[padGenitiv ? 1 : 0];
  if (t) { const l = t.toLowerCase(); return padGenitiv ? l : l.charAt(0).toUpperCase() + l.slice(1); }
  return padGenitiv ? "předpisu" : "Předpis";
}
function nazevPredpisu(P, id){
  const cit = (P && P.citace) || citacePredpisuZId(id);
  const zaklad = druhPredpisu(P) + " č. " + cit;
  return P && P.nazev ? zaklad + ", " + P.nazev : zaklad;
}
const kratkyNazev = (P, id) => druhPredpisu(P) + " č. " + ((P && P.citace) || citacePredpisuZId(id));
function citaceUstanoveni(P, id, f){
  const c = f && f.c ? f.c : "";
  return (c ? c + " " : "") + druhPredpisu(P, true) + " č. " + ((P && P.citace) || citacePredpisuZId(id));
}

/* ==================== ZNĚNÍ — ULOŽENÍ A NAČTENÍ ==================== */
/* Každé znění je samostatná sada souborů predpisy/<rok>-<číslo>/<datum>-<n>.json,
   žádný soubor nepřesáhne zhruba 600 kB (požadavek: nic velkého). */
const MEZ_CASTI = 600000;
function rozdelitNaCasti(id, datum, fragmenty, odkazy){
  const casti = [];
  let akt = [], velikost = 0;
  const enc = new TextEncoder();
  for (const f of fragmenty){
    const v = enc.encode(JSON.stringify(f)).length + 1;
    if (akt.length && velikost + v > MEZ_CASTI){ casti.push(akt); akt = []; velikost = 0; }
    akt.push(f); velikost += v;
  }
  if (akt.length || !casti.length) casti.push(akt);
  return casti.map((frag, i) => {
    const odk = {};
    for (const f of frag) for (const m of f[4].matchAll(/data-odkaz-id="(\d+)"/g)) if (odkazy[m[1]]) odk[m[1]] = odkazy[m[1]];
    return {
      cesta: slozkaPredpisu(id) + "/" + datum + "-" + (i + 1) + ".json",
      obsah: {format: "legprohlizec-zneni", verze: 1, predpis: id, zneni: datum, cast: i + 1, casti: casti.length, fragmenty: frag, odkazy: odk}
    };
  });
}
const cacheZneni = new Map();
const STRUKTURA = new Set(["Cast", "Hlava", "Dil", "Oddil", "Pododdil", "Paragraf", "Clanek", "Priloha", "Pododdil_Ab"]);
const SEZNAMOVE = new Set(["Pismeno_Lb", "Bod_Dd"]);
function sestavModel(id, datum, fragmenty, odkazy){
  const frag = fragmenty.map((x, i) => ({k: x[0], p: x[1], typ: x[2], c: x[3], t: x[4], i}));
  const mapa = new Map(), deti = new Map();
  for (const f of frag) mapa.set(f.k, f);
  for (const f of frag){
    if (f.k === "") continue;
    const r = f.p !== null && mapa.has(f.p) ? f.p : "";
    f.p = r;
    if (!deti.has(r)) deti.set(r, []);
    deti.get(r).push(f);
  }
  const citovatelne = frag.filter(f => f.c && f.k);
  return {id, datum, frag, mapa, deti, odkazy: odkazy || {}, citovatelne, prosty: new Map()};
}
async function nactiZneni(id, datum){
  const klic = id + "|" + datum;
  if (cacheZneni.has(klic)) return cacheZneni.get(klic);
  const P = W.predpisy[id], z = P && P.zneni[datum];
  if (!z) throw new Error("Znění " + datumCz(datum) + " není stažené.");
  const fragmenty = [], odkazy = {};
  for (const s of z.soubory){
    const text = await ghCist(cestaWs(s));
    if (text === null) throw new Error("V repozitáři chybí soubor " + s + ". Předpis stáhněte znovu (tlačítko Znovu stáhnout).");
    const d = JSON.parse(text);
    fragmenty.push(...d.fragmenty);
    Object.assign(odkazy, d.odkazy || {});
  }
  const m = sestavModel(id, datum, fragmenty, odkazy);
  cacheZneni.set(klic, m);
  return m;
}
function stazenaZneni(P){ return Object.keys(P.zneni || {}).sort(); }
/* Aktuální = nejnovější stažené znění účinné k dnešku; jinak nejstarší stažené. */
function aktualniDatum(P){
  const s = stazenaZneni(P), dnes = dnesIso();
  const minula = s.filter(d => d !== "0000-00-00" && d <= dnes);
  if (minula.length) return minula[minula.length - 1];
  const bud = s.filter(d => d !== "0000-00-00");
  if (bud.length) return bud[0];
  return s[0] || null;
}
function popisZneni(P, d){
  const akt = aktualniDatum(P);
  if (d === "0000-00-00") return "znění při vyhlášení";
  if (d === akt) return "aktuální znění účinné od " + datumCz(d);
  if (d > dnesIso()) return "budoucí znění účinné od " + datumCz(d);
  return "dřívější znění účinné od " + datumCz(d);
}

/* ==================== STAHOVÁNÍ PŘEDPISU ==================== */
async function stahnoutPredpis(id, volby, prubeh){
  volby = volby || {};
  prubeh = prubeh || (() => {});
  prubeh("Zjišťuji údaje o předpisu " + citacePredpisuZId(id) + "…");
  const meta = await esbMeta(id);
  if (!meta.existuje) throw new Error("Předpis " + citacePredpisuZId(id) + " v e-Sbírce není.");
  const rz = rozdelZneni(meta.zneni.length ? meta.zneni : [meta.vyhlasene || "0000-00-00"]);
  if (!rz.aktualni) throw new Error("Předpis nemá žádné znění ke stažení.");
  const P = W.predpisy[id] || {pridano: new Date().toISOString(), zneni: {}, stitky: []};
  P.budouci = volby.budouci !== undefined ? !!volby.budouci : !!P.budouci;
  const hl = await esbHlavicka(id, rz.aktualni);
  P.citace = meta.citace || citacePredpisuZId(id);
  P.typ = hl.typ || P.typ || "";
  P.nazev = hl.nazev || P.nazev || "";
  P.datumVydani = hl.datum || P.datumVydani || "";
  P.vzdalenaZneni = meta.zneni;
  P.zkontrolovano = new Date().toISOString();
  const cilova = [rz.aktualni].concat(P.budouci ? rz.budouci : []);
  const soubory = [];
  const nova = [];
  for (const d of cilova){
    if (P.zneni[d] && !volby.znovu) continue;
    const frag = await esbFragmenty(id, d, prubeh);
    const idcka = new Set();
    for (const f of frag) for (const m of f[4].matchAll(/data-odkaz-id="(\d+)"/g)) idcka.add(m[1]);
    const odkazy = idcka.size ? await esbOdkazy(Array.from(idcka), prubeh) : {};
    const casti = rozdelitNaCasti(id, d, frag, odkazy);
    const stare = (P.zneni[d] && P.zneni[d].soubory) || [];
    const nove = casti.map(c => c.cesta);
    for (const c of casti) soubory.push({cesta: cestaWs(c.cesta), text: JSON.stringify(c.obsah)});
    for (const s of stare) if (nove.indexOf(s) < 0) soubory.push({cesta: cestaWs(s), smazat: true});
    P.zneni[d] = {soubory: nove, pocet: frag.length, stazeno: new Date().toISOString()};
    cacheZneni.set(id + "|" + d, sestavModel(id, d, frag, odkazy));
    nova.push(d);
  }
  if (Array.isArray(volby.stitky)) P.stitky = Array.from(new Set(volby.stitky));
  W.predpisy[id] = P;
  for (const oid of volby.oblasti || []){
    const o = W.oblasti.find(x => x.id === oid);
    if (o && o.predpisy.indexOf(id) < 0) o.predpisy.push(id);
  }
  prubeh("Ukládám do GitHubu…");
  const ok = await ulozWorkspace(soubory, (nova.length ? "Stažen předpis " : "Aktualizace předpisu ") + P.citace + (nova.length ? " (" + nova.map(datumCz).join(", ") + ")" : ""));
  if (!ok) throw new Error("Data předpisu se nepodařilo uložit do GitHubu — podrobnosti jsou ve stavovém řádku nahoře.");
  return {P, nova, rz};
}

/* ==================== TEXT — SANITIZACE A ODKAZY ==================== */
/* Text fragmentu je HTML z e-Sbírky. Nikdy se nevkládá přímo: projde whitelistem,
   <var> se mění na označení ustanovení a odkazy (data-odkaz-id) se převádějí
   na odkazy aplikace podle mapy cílů uložené u znění. */
const POVOLENE = new Set(["sup", "sub", "br", "b", "strong", "i", "em", "u", "table", "thead", "tbody", "tfoot", "tr", "td", "th", "p", "ul", "ol", "li", "caption"]);
const sablona = document.createElement("template");
function prostyText(html){
  if (!html) return "";
  sablona.innerHTML = String(html).replace(/<br\s*\/?>/gi, " ");
  /* tabulka: každý řádek na samostatný řádek textu, neprázdné buňky oddělené svislítkem */
  for (const tr of Array.from(sablona.content.querySelectorAll("tr"))){
    const bunky = Array.from(tr.children).map(b => b.textContent.replace(/\s+/g, " ").trim()).filter(Boolean);
    tr.replaceWith(document.createTextNode("\n" + bunky.join(" | ") + "\n"));
  }
  return sablona.content.textContent.replace(/[ \t\u00a0]+/g, " ").replace(/ *\n */g, "\n").replace(/\n{2,}/g, "\n").trim();
}
function textFragmentu(model, f){
  if (!model.prosty.has(f.k)) model.prosty.set(f.k, prostyText(f.t));
  return model.prosty.get(f.k);
}
function prevestHtml(html, ctx, zpracujVar){
  sablona.innerHTML = String(html || "");
  const vystup = document.createDocumentFragment();
  let prvniVar = true;
  const projdi = (uzel, cil) => {
    for (const n of Array.from(uzel.childNodes)){
      if (n.nodeType === 3){ cil.append(document.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.nodeName.toLowerCase();
      if (tag === "var"){
        const text = n.textContent;
        if (prvniVar && zpracujVar){ prvniVar = false; cil.append(zpracujVar(text)); }
        else cil.append(el("span", {class: "oznaceni"}, text));
        continue;
      }
      if (tag === "a"){ cil.append(prevestOdkaz(n, ctx)); continue; }
      if (tag === "script" || tag === "style") continue;
      if (POVOLENE.has(tag)){
        const kopie = document.createElement(tag);
        if (tag === "td" || tag === "th"){
          for (const a of ["colspan", "rowspan"]) if (n.getAttribute(a)) kopie.setAttribute(a, n.getAttribute(a));
        }
        projdi(n, kopie);
        cil.append(kopie);
      } else projdi(n, cil);
    }
  };
  projdi(sablona.content, vystup);
  return vystup;
}
function cilOdkazu(idOdk, ctx){
  const zaznam = ctx && ctx.model && ctx.model.odkazy[idOdk];
  if (!zaznam) return null;
  const cil = zaznam[0];
  let m = /^cz\/sb\/(\d{4})\/(\d+)\/[\d-]+\/dokument\/?(.*)$/.exec(cil);
  if (m) return {druh: "sb", predpis: m[1] + "/" + m[2], klic: m[3] || "", citace: zaznam[1]};
  m = /^eu\/(\d{4})\/(\d+)/.exec(cil);
  if (m) return {druh: "eu", rok: m[1], cislo: m[2], citace: zaznam[1]};
  return null;
}
function prevestOdkaz(a, ctx){

  const idOdk = a.getAttribute("data-odkaz-id");
  const cil = idOdk ? cilOdkazu(idOdk, ctx) : null;

      href = cil.klic ? "#" + idFragmentu(cil.klic) : "#obsah";
    else if (cil.klic && vKnihovne)
      href = adresa({pohled: "ust", predpis: cil.predpis, ust: cil.klic});
    else href = adresa({pohled: "predpis", predpis: cil.predpis, ust: cil.klic || null});
    const a2 = el("a", {href, class: "odkaz-predpis"}, text);

  if (venku) return el("a", {href: venku, target: "_blank", rel: "noopener noreferrer"}, text, vh(" (otevře se v nové kartě)"));
  return el("span", null, text);

/* ==================== MARKDOWN ==================== */
/* Vlastní malý renderer pro poznámky k předpisům a komentáře. Staví DOM přes el(),
   žádné HTML z obsahu se nevkládá. „#“ se mapuje na úroveň nadpisu podle místa
   na stránce (urovenNadpisu), aby osnova nadpisů zůstala souvislá. */
function markdownDom(src, urovenNadpisu){
  const zaklad = urovenNadpisu || 3;
  const radky = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  const vystup = document.createDocumentFragment();
  const jeSeznam = x => /^\s*([-*+]|\d{1,9}[.)])\s+/.test(x);
  const jeOddelovac = x => /^\s*([-*_])(\s*\1){2,}\s*$/.test(x);
  const jeZvlastni = x => /^\s*(#{1,6}\s|>|```|~~~)/.test(x) || jeSeznam(x) || jeOddelovac(x);
  let i = 0, m;
  while (i < radky.length){
    const x = radky[i];
    if (!x.trim()){ i++; continue; }
    if ((m = /^\s*(```|~~~)/.exec(x))){
      const kod = [];
      i++;
      while (i < radky.length && !radky[i].trim().startsWith(m[1])){ kod.push(radky[i]); i++; }
      i++;
      vystup.append(el("pre", null, el("code", null, kod.join("\n"))));
      continue;
    }
    if ((m = /^\s*(#{1,6})\s+(.*?)\s*#*\s*$/.exec(x))){
      vystup.append(el("h" + Math.min(6, zaklad + m[1].length - 1), null, mdRadek(m[2])));
      i++; continue;
    }
    if (jeOddelovac(x)){ vystup.append(el("hr")); i++; continue; }
    if (/^\s*>/.test(x)){
      const citace = [];
      while (i < radky.length && /^\s*>/.test(radky[i])){ citace.push(radky[i].replace(/^\s*>\s?/, "")); i++; }
      vystup.append(el("blockquote", null, markdownDom(citace.join("\n"), zaklad)));
      continue;
    }
    if (jeSeznam(x)){
      const polozky = [];
      while (i < radky.length){
        const y = radky[i];
        if ((m = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/.exec(y))){
          polozky.push({odsazeni: m[1].replace(/\t/g, "    ").length, cislovany: /\d/.test(m[2]), start: parseInt(m[2], 10), text: m[3]});
          i++;
        } else if (y.trim() && /^\s+/.test(y) && polozky.length){ polozky[polozky.length - 1].text += "\n" + y.trim(); i++; }
        else break;
      }
      vystup.append(mdSeznam(polozky));
      continue;
    }
    const odstavec = [];
    while (i < radky.length && radky[i].trim() && !(odstavec.length && jeZvlastni(radky[i]))){ odstavec.push(radky[i].trim()); i++; }
    const pr = el("p");
    odstavec.forEach((t, j) => { if (j) pr.append(el("br")); pr.append(mdRadek(t)); });
    vystup.append(pr);
  }
  return vystup;
}
function mdSeznam(polozky){
  const koren = document.createDocumentFragment();
  const zasobnik = [];
  for (const pol of polozky){
    while (zasobnik.length && pol.odsazeni < zasobnik[zasobnik.length - 1].odsazeni) zasobnik.pop();
    let vrchol = zasobnik[zasobnik.length - 1];
    if (vrchol && vrchol.odsazeni === pol.odsazeni && vrchol.cislovany !== pol.cislovany){
      zasobnik.pop();
      const sez = el(pol.cislovany ? "ol" : "ul");
      vrchol.rodic.append(sez);
      vrchol = {odsazeni: pol.odsazeni, seznam: sez, cislovany: pol.cislovany, rodic: vrchol.rodic};
      zasobnik.push(vrchol);
    } else if (!vrchol || pol.odsazeni > vrchol.odsazeni){
      const rodic = vrchol ? (vrchol.seznam.lastElementChild || vrchol.seznam) : koren;
      const sez = el(pol.cislovany ? "ol" : "ul", pol.cislovany && pol.start > 1 ? {start: String(pol.start)} : null);
      rodic.append(sez);
      vrchol = {odsazeni: pol.odsazeni, seznam: sez, cislovany: pol.cislovany, rodic};
      zasobnik.push(vrchol);
    }
    const li = el("li");
    pol.text.split("\n").forEach((t, j) => { if (j) li.append(el("br")); li.append(mdRadek(t)); });
    vrchol.seznam.append(li);
  }
  return koren;
}
const MD_RADEK = /(`+)([\s\S]+?)\1|\*\*([\s\S]+?)\*\*|__([\s\S]+?)__|\*([^*\s][^*]*?)\*|(?<![\p{L}\p{N}])_([^_\s][^_]*?)_(?![\p{L}\p{N}])|~~([\s\S]+?)~~|\[([^\]]+)\]\(([^)\s]+)\)|(https?:\/\/[^\s<>]+[^\s<>.,;:!?)"'„“])/gu;
function mdRadek(text){
  const frag = document.createDocumentFragment();
  const re = new RegExp(MD_RADEK.source, "gu");
  let pos = 0, m;
  while ((m = re.exec(text))){
    if (m.index > pos) frag.append(text.slice(pos, m.index));
    if (m[1]) frag.append(el("code", null, m[2]));
    else if (m[3] !== undefined) frag.append(el("strong", null, mdRadek(m[3])));
    else if (m[4] !== undefined) frag.append(el("strong", null, mdRadek(m[4])));
    else if (m[5] !== undefined) frag.append(el("em", null, mdRadek(m[5])));
    else if (m[6] !== undefined) frag.append(el("em", null, mdRadek(m[6])));
    else if (m[7] !== undefined) frag.append(el("del", null, mdRadek(m[7])));
    else if (m[8] !== undefined) frag.append(mdOdkaz(m[9], mdRadek(m[8])));
    else if (m[10]) frag.append(mdOdkaz(m[10], m[10]));
    pos = re.lastIndex;
  }
  if (pos < text.length) frag.append(text.slice(pos));
  return frag;
}
function mdOdkaz(url, obsah){
  if (/^(https?:|mailto:)/i.test(url)){
    try { const u = new URL(url, location.href); if (u.origin === location.origin && u.pathname === location.pathname) return el("a", {href: u.pathname + u.search + u.hash}, obsah); } catch (e){}
    return el("a", {href: url, target: "_blank", rel: "noopener noreferrer"}, obsah, vh(" (otevře se v nové kartě)"));
  }
  if (/^[?#/]/.test(url)) return el("a", {href: url}, obsah);
  return el("span", null, obsah);
}

/* ==================== POZNÁMKA K PŘEDPISU ==================== */
/* Markdown v samostatném souboru predpisy/<rok>-<číslo>/poznamka.md; ve workspace
   je jen odkaz na soubor a čas úpravy (P.poznamka). */
const cestaPoznamky = id => slozkaPredpisu(id) + "/poznamka.md";
const cachePoznamek = new Map();
async function nactiPoznamku(id){
  const P = W.predpisy[id];
  if (!P || !P.poznamka) return "";
  if (cachePoznamek.has(id)) return cachePoznamek.get(id);
  const t = await ghCist(cestaWs(P.poznamka.soubor || cestaPoznamky(id)), {cache: "no-store"});
  const text = t === null ? "" : t;
  cachePoznamek.set(id, text);
  return text;
}
async function poznamkaDom(id, uroven){
  try {
    const t = await nactiPoznamku(id);
    return el("div", {class: "markdown"}, t.trim() ? markdownDom(t, uroven) : zprava("Poznámka je prázdná."));
  } catch (e){ return zprava("Poznámku se nepodařilo načíst: " + e.message, "chyba"); }
}
async function ulozitPoznamku(id, text){
  const P = W.predpisy[id];
  const prazdna = !text.trim();
  const predtim = P.poznamka || null;
  if (prazdna && !predtim) return true;
  const soubor = (predtim && predtim.soubor) || cestaPoznamky(id);
  P.poznamka = prazdna ? null : {soubor, upraveno: new Date().toISOString()};
  const ok = await ulozWorkspace([prazdna ? {cesta: cestaWs(soubor), smazat: true} : {cesta: cestaWs(soubor), text}],
    (prazdna ? "Smazána poznámka k předpisu " : "Poznámka k předpisu ") + P.citace);
  if (ok) cachePoznamek.set(id, prazdna ? "" : text); else P.poznamka = predtim;
  return ok;
}

/* ==================== ŠTÍTKY ==================== */
/* Jeden slovník štítků W.stitky pro předpisy (P.stitky) i ustanovení
   (W.stitkyUstanoveni: {predpis, klic, citace, zneni, textUst, stitky[], upraveno}). */
/* Štítky jsou vždy malými písmeny a všude se řadí podle české abecedy (ch za h). */
const ceskeRazeni = new Intl.Collator("cs", {sensitivity: "base", numeric: true});
const razeneStitky = () => W.stitky.slice().sort((a, b) => ceskeRazeni.compare(a.nazev, b.nazev));
const stitekPodleId = id => W.stitky.find(s => s.id === id);
function nazvyStitku(ids){ return (ids || []).map(stitekPodleId).filter(Boolean).map(s => s.nazev).sort(ceskeRazeni.compare).join(", "); }
function zajistitStitek(nazev){
  const n = String(nazev || "").trim().toLowerCase();
  if (!n) return null;
  let s = W.stitky.find(x => x.nazev.toLowerCase() === n.toLowerCase());
  if (!s){ s = {id: novyId("t"), nazev: n, popis: ""}; W.stitky.push(s); }
  return s.id;
}
function zaznamStitkuUst(id, klic){ return W.stitkyUstanoveni.find(x => x.predpis === id && x.klic === klic) || null; }
function stitkyUst(id, klic){ const z = zaznamStitkuUst(id, klic); return z ? z.stitky.slice() : []; }
function nastavStitkyUst(id, klic, udaje, stitky){
  let z = zaznamStitkuUst(id, klic);
  const unik = Array.from(new Set((stitky || []).filter(Boolean)));
  if (!unik.length){ if (z) W.stitkyUstanoveni = W.stitkyUstanoveni.filter(x => x !== z); return; }
  if (!z){ z = {predpis: id, klic, citace: "", zneni: "", textUst: "", stitky: []}; W.stitkyUstanoveni.push(z); }
  udaje = udaje || {};
  Object.assign(z, {citace: udaje.citace || z.citace, zneni: udaje.zneni || z.zneni, textUst: udaje.textUst || z.textUst, stitky: unik, upraveno: new Date().toISOString()});
}
function mapaStitkuUst(id){
  const m = new Map();
  for (const z of W.stitkyUstanoveni) if (z.predpis === id) m.set(z.klic, z.stitky);
  return m;
}
function odkazyStitku(ids){
  const st = (ids || []).map(stitekPodleId).filter(Boolean).sort((a, b) => ceskeRazeni.compare(a.nazev, b.nazev));
  if (!st.length) return document.createTextNode("žádné");
  const frag = document.createDocumentFragment();
  st.forEach((x, i) => { if (i) frag.append(", "); frag.append(el("a", {href: adresa({pohled: "stitek", stitek: x.id})}, x.nazev)); });
  return frag;
}
/* Zaškrtávací výběr štítků s polem pro nové (oddělené čárkou). Nové štítky se založí až při hodnota(). */
function vyberStitku(vybrane, legenda){

/* ==================== HROMADNÉ ÚPRAVY ==================== */
/* Zaškrtávátka v přehledech + jedna akce pro všechny vybrané položky.
   druh: "predpis" (klíč = id předpisu), "vyz" (id vyznačení), "kom" (id komentáře),
   "ust" (klíč "předpis|klíč ustanovení"). */
const HROMADNE_AKCE = {
  predpis: [["pridat-stitek", "Přidat štítek"], ["odebrat-stitek", "Odebrat štítek"], ["do-oblasti", "Zařadit do oblasti"], ["z-oblasti", "Vyřadit z oblasti"]],
  vyz: [["do-skupiny", "Přidat do skupiny vyznačení"], ["ze-skupiny", "Odebrat ze skupiny vyznačení"], ["pridat-stitek", "Přidat štítek ustanovení"], ["odebrat-stitek", "Odebrat štítek ustanovení"], ["smazat", "Zrušit vyznačení"]],
  kom: [["do-skupiny", "Přidat do skupiny komentářů"], ["ze-skupiny", "Odebrat ze skupiny komentářů"], ["pridat-stitek", "Přidat štítek ustanovení"], ["odebrat-stitek", "Odebrat štítek ustanovení"], ["smazat", "Smazat komentáře"]],
  ust: [["pridat-stitek", "Přidat štítek"], ["odebrat-stitek", "Odebrat štítek"]]
};
function cileAkce(druh, akce){
  if (akce === "pridat-stitek" || akce === "odebrat-stitek")
    return {seznam: razeneStitky(), novy: akce === "pridat-stitek" ? "nový štítek" : null, zalozit: zajistitStitek};
  if (akce === "do-oblasti" || akce === "z-oblasti") return {seznam: W.oblasti, novy: null};
  if (akce === "do-skupiny" || akce === "ze-skupiny"){
    const sez = druh === "vyz" ? W.skupiny : W.skupinyKomentaru;
    return {seznam: sez, novy: akce === "do-skupiny" ? "nová skupina" : null, zalozit: n => {
      let x = sez.find(y => y.nazev.toLowerCase() === n.toLowerCase());
      if (!x){ x = {id: novyId(druh === "vyz" ? "s" : "sk"), nazev: n, popis: ""}; sez.push(x); }
      return x.id;
    }};
  }
  return null;
}
function provestHromadne(druh, akce, klice, cilId){
  let n = 0;
  const pridatDo = (pole_, x) => { if (pole_.indexOf(x) < 0) pole_.push(x); };
  for (const klic of klice){
    if (druh === "predpis"){
      const P = W.predpisy[klic];
      if (!P) continue;
      if (!Array.isArray(P.stitky)) P.stitky = [];
      if (akce === "pridat-stitek") pridatDo(P.stitky, cilId);
      else if (akce === "odebrat-stitek") P.stitky = P.stitky.filter(x => x !== cilId);
      else {
        const o = W.oblasti.find(x => x.id === cilId);
        if (!o) continue;
        if (akce === "do-oblasti") pridatDo(o.predpisy, klic); else o.predpisy = o.predpisy.filter(x => x !== klic);
      }
      n++; continue;
    }
    let predpis, klicUst, udaje, polozka = null;
    if (druh === "vyz" || druh === "kom"){
      polozka = (druh === "vyz" ? W.vyznaceni : W.komentare).find(x => x.id === klic);
      if (!polozka) continue;
      predpis = polozka.predpis; klicUst = polozka.klic;
      udaje = {citace: polozka.citace, zneni: polozka.zneni, textUst: druh === "vyz" ? polozka.text : polozka.textUst};
    } else {
      const i = klic.indexOf("|");
      predpis = klic.slice(0, i); klicUst = klic.slice(i + 1);
      udaje = null;
    }
    if (akce === "pridat-stitek") nastavStitkyUst(predpis, klicUst, udaje, stitkyUst(predpis, klicUst).concat([cilId]));
    else if (akce === "odebrat-stitek") nastavStitkyUst(predpis, klicUst, udaje, stitkyUst(predpis, klicUst).filter(x => x !== cilId));
    else if (akce === "do-skupiny") pridatDo(polozka.skupiny, cilId);
    else if (akce === "ze-skupiny") polozka.skupiny = polozka.skupiny.filter(x => x !== cilId);
    else if (akce === "smazat"){
      if (druh === "vyz") W.vyznaceni = W.vyznaceni.filter(x => x !== polozka);
      else W.komentare = W.komentare.filter(x => x !== polozka);
    }
    n++;
  }
  return n;
}
/* Hromadné úpravy jsou standardně skryté: zaškrtávátka u položek i panel akcí se ukážou

function vykreslitStrom(model, korenKlic, ctx){

function vykreslitDeti(model, klic, cil, uroven, ctx){

    vykreslitUzel(model, f, cil, uroven, ctx, deti);

function vykreslitUzel(model, f, cil, uroven, ctx, sourozenci){
  const typ = f.typ;
  if (typ === "Virtual_Prefix" || typ.startsWith("Prefix_")) return;
  if (typ === "Virtual_PPC"){
    if (!(model.deti.get(f.k) || []).length) return;
    const s = el("section", {id: idFragmentu(f.k), "aria-labelledby": idFragmentu(f.k) + "-n"},
      el("h" + Math.min(6, ctx.uroven || 2), {id: idFragmentu(f.k) + "-n"}, "Poznámky pod čarou"));
    vykreslitDeti(model, f.k, s, uroven + 1, ctx);
    cil.append(s);
    return;
  }
  if (typ.startsWith("Virtual_")){ vykreslitDeti(model, f.k, cil, uroven, ctx); return; }
  if (STRUKTURA.has(typ)){
    const sekce = el("section", {id: idFragmentu(f.k)});
    const titulek = titulekStruktury(model, f);
    const h = el("h" + Math.min(6, uroven), null);
    h.append(prevestHtml(f.t, ctx, text => oznaceni(model, f, text, ctx)));
    if (!f.t) h.append(oznaceni(model, f, f.c || "", ctx));
    if (titulek) h.append(" ", el("span", {class: "titulek"}, titulek));
    if (ctx.zvyraznit === f.k) h.classList.add("zvyrazneno");
    sekce.append(h);
    const d = model.deti.get(f.k) || [];
    const prvniNadpis = d.find(x => x.typ === "Nadpis_pod");
    const zbytek = el("div");
    for (const x of d) if (x === prvniNadpis) x._spotrebovan = true;
    vykreslitDeti(model, f.k, zbytek, uroven + 1, ctx);
    for (const x of d) delete x._spotrebovan;
    sekce.append(...zbytek.childNodes);
    pripojitKomentareCteni(ctx, f, sekce);
    cil.append(sekce);
    return;
  }
  if (f._spotrebovan) return;
  if (typ === "Nadpis_nad"){
    const dalsiStruktura = sourozenci && sourozenci.slice(sourozenci.indexOf(f) + 1).find(x => STRUKTURA.has(x.typ));
    cil.append(el(dalsiStruktura ? "h" + Math.min(6, uroven) : "p", {id: idFragmentu(f.k), class: "nadpis-nad"}, prostyText(f.t)));
    return;
  }
  if (typ === "Nadpis_pod"){ cil.append(el("p", {id: idFragmentu(f.k), class: "nadpis-pod"}, prostyText(f.t))); return; }
  if (typ === "Tabulka"){
    const d = el("div", {class: "tabulka", id: idFragmentu(f.k)});
    d.append(prevestHtml(f.t, ctx));
    cil.append(d);
    vykreslitDeti(model, f.k, cil, uroven, ctx);
    return;
  }
  if (typ === "Block_Citace"){
    const b = el("blockquote", {id: idFragmentu(f.k)});
    vykreslitDeti(model, f.k, b, uroven, ctx);
    cil.append(b);
    return;
  }
  let obal;
  if (typ === "Odstavec_Dc") obal = el("div", {class: "odstavec", id: idFragmentu(f.k)});
  else obal = el("div", {class: "blok " + (typ === "Prefix" ? "uvod" : typ === "Postfix" ? "podpis" : typ === "PPC" ? "ppc" : typ === "Pokracovani_Text" ? "pokracovani" : ""), id: idFragmentu(f.k)});
  vykreslitObsahUzlu(model, f, obal, uroven, ctx);
  cil.append(obal);
}
function vykreslitObsahUzlu(model, f, obal, uroven, ctx){
  if (f.t){
    const p = el("p");
    p.append(prevestHtml(f.t, ctx, text => oznaceni(model, f, text, ctx)));
    if (ctx.zvyraznit === f.k) p.classList.add("zvyrazneno");
    obal.append(p);

  vykreslitDeti(model, f.k, obal, uroven, ctx);
  pripojitKomentareCteni(ctx, f, obal);

/* Komentáře přímo v textu (čtecí pohled, komentované a výkladové znění): pod celým

function pripojitKomentareCteni(ctx, f, cil){

/* Označení ustanovení („(1)“, „a)“, „§ 5“) je odkaz na detail ustanovení.
   Přístupný název nese celou citaci a informaci o vyznačení. */
function oznaceni(model, f, text, ctx){
  if (!f.c || !f.k || ctx.bezOdkazu) return el("span", {class: "oznaceni"}, text);
  const v = ctx.vyznaceni && ctx.vyznaceni.get(f.k);
  /* přístupný název začíná viditelným textem (WCAG 2.5.3); citace se přidá jen tam, kde nese informaci navíc */
  const nk = ctx.komentare ? (ctx.komentare.get(f.k) || 0) : 0;
  const stU = ctx.stitky ? (ctx.stitky.get(f.k) || []) : [];
  const citaceNavic = !STRUKTURA.has(f.typ) && normCitace(f.c) !== normCitace(text) ? " – " + f.c : "";
  const popis = text + citaceNavic + (v ? ", vyznačeno: " + nazvySkupin(v) + (v.poznamka ? ", s poznámkou" : "") : "") + (nk ? ", " + pocetKomentaru(nk) : "") + (stU.length ? ", štítky: " + nazvyStitku(stU) : "");
  const frag = document.createDocumentFragment();
  frag.append(el("a", {class: "oznaceni", href: adresa({pohled: "ust", predpis: model.id, ust: f.k, zneni: ctx.zneniVUrl || null}), "aria-label": popis}, text));
  if (v) frag.append(el("span", {class: "znacka", "aria-hidden": "true", title: "Vyznačeno"}, v.poznamka ? "★✎" : "★"));
  if (nk) frag.append(el("span", {class: "znacka", "aria-hidden": "true", title: pocetKomentaru(nk)}, "💬" + nk));
  if (stU.length) frag.append(el("span", {class: "znacka", "aria-hidden": "true", title: "Štítky: " + nazvyStitku(stU)}, "🏷"));
  return frag;
}
/* Filtr předpisu: nalezené ustanovení se zobrazí celé (i s písmeny a body), nad ním
   celá cesta nadřazených částí, hlav, paragrafů a odstavců jako kontext. Shoda
   v nadpisu paragrafu nebo článku ukáže celý paragraf. */
function filtrPredpisu(model, dotaz, bezDiakritiky, povolene){
  const slova = normText(dotaz || "", bezDiakritiky).split(/\s+/).filter(Boolean);
  if (!slova.length && !povolene) return null;
  const mnozina = new Set(), jednotky = new Set();
  const podstrom = k => { mnozina.add(k); for (const d of model.deti.get(k) || []) podstrom(d.k); };
  const predkove = f => { let x = f; while (x){ mnozina.add(x.k); if (x.k === "") break; x = model.mapa.get(x.p); } };
  const pridat = jednotka => {
    /* už je zobrazené jako součást dříve nalezeného ustanovení — nepočítat znovu */
    let x = jednotka;
    while (x){ if (jednotky.has(x.k)) return; if (x.k === "") break; x = model.mapa.get(x.p); }
    jednotky.add(jednotka.k);
    podstrom(jednotka.k);
    predkove(jednotka);
  };
  const vPovolenych = f => { let x = f; while (x){ if (povolene.has(x.k)) return true; if (x.k === "") break; x = model.mapa.get(x.p); } return false; };
  if (!slova.length){
    for (const f of model.frag) if (f.k && povolene.has(f.k)) pridat(f);
  } else for (const f of model.frag){
    if (!f.t || f.k === "" || f.typ.startsWith("Prefix") || f.typ.startsWith("Virtual_") || STRUKTURA.has(f.typ)) continue;
    if (povolene && !vPovolenych(f)) continue;
    const nt = normText(textFragmentu(model, f), bezDiakritiky);
    if (!slova.every(sl => nt.indexOf(sl) >= 0)) continue;
    let jednotka = f;
    if (f.typ === "Nadpis_pod"){ const rod = model.mapa.get(f.p); if (rod && (rod.typ === "Paragraf" || rod.typ === "Clanek")) jednotka = rod; }
    pridat(jednotka);
  }
  mnozina.add("");
  return {slova, mnozina, pocet: jednotky.size};
}
function zvyraznitSlova(koren, slova, bezDiakritiky){
  const chodec = document.createTreeWalker(koren, NodeFilter.SHOW_TEXT);
  const uzly = [];
  while (chodec.nextNode()) uzly.push(chodec.currentNode);
  for (const u of uzly){
    if (u.parentNode && u.parentNode.closest && u.parentNode.closest(".vh")) continue;
    const t = u.nodeValue, nt = normText(t, bezDiakritiky);
    if (nt.length !== t.length) continue;
    const znacky = [];
    for (const sl of slova){ let i = -1; while ((i = nt.indexOf(sl, i + 1)) >= 0) znacky.push([i, i + sl.length]); }
    if (!znacky.length) continue;
    znacky.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment();
    let pos = 0;
    for (const [a, b] of znacky){ if (a < pos) continue; frag.append(t.slice(pos, a), el("mark", null, t.slice(a, b))); pos = b; }
    frag.append(t.slice(pos));
    u.replaceWith(frag);
  }
}
function obsahPredpisu(model, mnozina){
  const vytvor = klic => {
    const ul = el("ul");
    for (const f of model.deti.get(klic) || []){
      if (f.typ.startsWith("Virtual_")){ const vnor = vytvor(f.k); if (vnor) ul.append(...vnor.childNodes); continue; }
      if (!STRUKTURA.has(f.typ) || (mnozina && !mnozina.has(f.k))) continue;
      const t = titulekStruktury(model, f);
      const li = el("li", null, el("a", {href: "#" + idFragmentu(f.k)}, oznaceniFragmentu(f) + (t ? " " + t : "")));
      const vnor = vytvor(f.k);
      if (vnor) li.append(vnor);
      ul.append(li);
    }
    return ul.childNodes.length ? ul : null;
  };
  return vytvor("");
}

/* ==================== TEXT USTANOVENÍ PRO KOPÍROVÁNÍ ==================== */
function textStromu(model, klic, odsazeni){
  odsazeni = odsazeni || "";
  const f = model.mapa.get(klic);
  const radky = [];
  if (f && f.t && !f.typ.startsWith("Virtual_")){
    let t = textFragmentu(model, f);
    if (STRUKTURA.has(f.typ)){ const tit = titulekStruktury(model, f); if (tit) t += " " + tit; }
    radky.push(odsazeni + t);
  }
  for (const d of model.deti.get(klic) || []){
    if (f && STRUKTURA.has(f.typ) && d.typ === "Nadpis_pod" && titulekStruktury(model, f) === prostyText(d.t)) continue;
    radky.push(textStromu(model, d.k, (f && f.t) ? odsazeni + "  " : odsazeni));
  }
  return radky.filter(Boolean).join("\n");
}
function predkove(model, klic){
  const r = [];
  let f = model.mapa.get(klic);
  while (f && f.k !== ""){
    f = model.mapa.get(f.p);
    if (f && f.k !== "" && !f.typ.startsWith("Virtual_")) r.unshift(f);
  }
  return r;
}
/* Složené ustanovení: u písmena nebo bodu se text skládá z návětí nadřazených
   odstavců, písmen a bodů, z ustanovení samotného (i s jeho podřízenými) a ze společné
   části za výčtem (Pokracovani_Text) — přesně tak, jak se ustanovení čte. */
function slozeniUstanoveni(model, f){
  if (!f || STRUKTURA.has(f.typ)) return null;
  const predci = predkove(model, f.k);
  let i = predci.length - 1;
  while (i >= 0 && !STRUKTURA.has(predci[i].typ)) i--;
  const cesta = predci.slice(i + 1).filter(x => x.t);
  if (!cesta.length) return null;
  const koren = i >= 0 ? predci[i] : cesta[0];
  const mnozina = new Set();
  const podstrom = k => { mnozina.add(k); for (const d of model.deti.get(k) || []) podstrom(d.k); };
  for (const x of predci.slice(i + 1)){
    mnozina.add(x.k);
    for (const d of model.deti.get(x.k) || []) if (d.typ === "Pokracovani_Text") podstrom(d.k);
  }
  podstrom(f.k);
  return {koren, cesta, mnozina};
}
function slozenyText(model, klic){
  const f = model.mapa.get(klic);
  if (!f) return "";
  const sl = slozeniUstanoveni(model, f);
  if (!sl) return textStromu(model, klic);
  const radky = sl.cesta.map((x, i) => "  ".repeat(i) + textFragmentu(model, x));
  radky.push(textStromu(model, klic, "  ".repeat(sl.cesta.length)));
  for (let i = sl.cesta.length - 1; i >= 0; i--)
    for (const d of model.deti.get(sl.cesta[i].k) || []) if (d.typ === "Pokracovani_Text") radky.push(textStromu(model, d.k, "  ".repeat(i)));
  return radky.filter(Boolean).join("\n");
}
/* Nejbližší ustanovení s citací (pro výsledky hledání u fragmentů bez označení). */
function citovatelnyPredek(model, f){
  let x = f;
  while (x && !(x.c && x.k)) x = model.mapa.get(x.p);
  return x || null;
}
function adresaAbsolutni(par){ return new URL(adresa(par), location.href).href; }
function adresaESbirky(id, datum, klic){
  const [r, c] = id.split("/");
  let u = "https://e-sbirka.gov.cz/sb/" + r + "/" + c + (datum && datum !== "0000-00-00" ? "/" + datum : "");
  if (klic && klic.startsWith("norma/")){
    const kotva = klic.split("/").filter(s => /^(par|odst|pism|bod|cl)_/.test(s)).join("-");
    if (kotva) u += "#" + kotva;
  }
  return u;
}
function formatyKopirovani(P, id, model, f){
  const cit = citaceUstanoveni(P, id, f);
  const text = slozenyText(model, f.k);
  const odkaz = adresaAbsolutni({pohled: "ust", predpis: id, ust: f.k});
  const vysledek = [
    ["Citace", cit],

    ["Citace a text", cit + "\n" + text],
    ["Markdown s odkazem", "[" + cit + "](" + odkaz + ")\n\n> " + text.split("\n").join("\n> ")],
    ["Odkaz do aplikace", odkaz],

  if (kom.length) vysledek.splice(3, 0, ["Citace, text a komentáře", cit + "\n" + text + "\n\nKomentáře:\n" + textKomentareProKopii(kom)]);
  return vysledek;
}

/* ==================== NAVIGACE A ADRESY ==================== */
/* Každý pohled i entita má vlastní adresu. Úložiště (repo, větev, složka) je v adrese
   vždy, takže odkaz zvenku otevře správný pracovní prostor. Token v adrese nikdy není. */
const POHLEDY = ["komentare", "poznamka", "prenos", "stitky", "stitek", "prehled", "oblast", "predpis", "ust", "vyznacena", "skupina", "hledat", "pridat", "nastaveni"];
function adresa(par){
  const q = new URLSearchParams();
  if (cfg.repo) q.set("repo", cfg.repo);
  if (cfg.vetev && cfg.vetev !== "main") q.set("vetev", cfg.vetev);
  if (cfg.slozka) q.set("slozka", cfg.slozka);
  for (const [k, v] of Object.entries(par || {})){
    if (v === null || v === undefined || v === "") continue;
    if (k === "pohled" && v === "prehled") continue;
    q.set(k, v);
  }
  const s = q.toString().replace(/%2F/g, "/");
  return location.pathname + (s ? "?" + s : "");
}
function parametry(){

    /* odkazy z textu ustanovení (včetně návětí) */
    const sl = slozeniUstanoveni(m, f);
    const klice = sl ? Array.from(sl.mnozina) : (() => { const r = []; const pod = k => { r.push(k); for (const d of m.deti.get(k) || []) pod(d.k); }; pod(klic); return r; })();
    const cile = new Set();
    for (const k of klice){
      const fr = m.mapa.get(k);
      if (!fr || !fr.t) continue;
      for (const a of String(fr.t).matchAll(/<a\b([^>]*)>/g)){
        const idOdk = (/data-odkaz-id="(\d+)"/.exec(a[1]) || [])[1];
        const celex = (/data-(?:celexid|id_celex)="([^"]+)"/i.exec(a[1]) || [])[1];
        const c = idOdk ? cilOdkazu(idOdk, {model: m}) : null;
        if (c && c.druh === "sb"){
          if (c.predpis === idp && c.klic === klic) continue;
          cile.add(c.klic ? "ust|" + c.predpis + "|" + c.klic : "pp|" + c.predpis);
        } else if (celexNaEu(celex)) cile.add("eu|" + celex);
        else if (c && c.druh === "eu") cile.add("eurc|" + c.rok + "|" + c.cislo);
      }
    }
    const vazby = [];
    for (const c of cile){
      const x = c.split("|");
      let tid;
      if (x[0] === "ust") tid = await entitaUstanoveni(x[1], x.slice(2).join("|"), null, false);
      else if (x[0] === "pp") tid = await entitaPredpisu(x[1]);
      else if (x[0] === "eu") tid = entitaEu(celexNaEu(x[1]));
      else tid = entitaEu({rok: x[1], cislo: x[2], druh: "Předpis", celex: ""});
      if (tid && tid !== eid) vazby.push({id: "r_" + eid + "_" + tid, relationTypeId: DKM_VAZBA.id, targetId: tid});
    }
    if (vazby.length) e.relations = vazby;
    const kom = komentareUstanoveni(idp, klic);
    if (kom.length) e.comments = kom.map(k => bezPrazdnych({id: "c_" + k.id, content: k.text, createdAt: k.vytvoreno, editedAt: k.upraveno !== k.vytvoreno ? k.upraveno : ""}));
    return eid;
  };
  for (let n = 0; n < polozky.length; n++){
    const pol = polozky[n];
    prubeh("Připravuji ustanovení " + (n + 1) + " z " + polozky.length + "…");
    await entitaUstanoveni(pol.predpis, pol.klic, pol, true);
  }
  return {format: "dkmpkg", version: 1, exportedFrom: "Legislativní prohlížeč " + APP_VERZE, exportedAt: ted,
    description: titul + " — " + pocetSlov(polozky.length, "ustanovení", "ustanovení", "ustanovení") + " a související předpisy a odkazovaná ustanovení",
    model: {entityTypes: [DKM_PREDPIS, DKM_USTANOVENI], aspects: [], relationTypes: [DKM_VAZBA], selectLists: DKM_SEZNAMY, tagSets: []},
    entities: Array.from(entity.values())};
}

/* ---------- Přenos dat mezi úložišti ---------- */
/* Balíček je JSON s vybranou částí pracovního prostoru: oblasti, skupiny, vyznačení,
   komentáře a poznámky k předpisům. Texty předpisů v něm nejsou — při importu se
   chybějící předpisy stáhnou z e-Sbírky, takže balíček zůstane malý. */
const FORMAT_BALIKU = "legprohlizec-balik";
function sestavitBalik(ws, zdroj){
  const predpisy = {};
  for (const [id, P] of Object.entries(ws.predpisy)) predpisy[id] = {citace: P.citace, typ: P.typ, nazev: P.nazev, budouci: !!P.budouci, popis: P.popis || "", cteniKomentare: P.cteniKomentare || [], stitky: P.stitky || [], maPoznamku: !!P.poznamka, soubor: P.poznamka ? P.poznamka.soubor : null};
  return {format: FORMAT_BALIKU, verze: 1, vytvoreno: new Date().toISOString(), zdroj,
    predpisy, oblasti: ws.oblasti, skupiny: ws.skupiny, skupinyKomentaru: ws.skupinyKomentaru || [],
    vyznaceni: ws.vyznaceni, komentare: ws.komentare || [], poznamky: {}, stitky: ws.stitky || [], stitkyUstanoveni: ws.stitkyUstanoveni || []};
}
function normalizovatBalik(d){
  if (!d || typeof d !== "object") throw new Error("Nejde o balíček Legislativního prohlížeče.");
  if (d.format === "legprohlizec") return sestavitBalik(normalizovatWs(d), {nazev: d.nazev || ""});
  if (d.format !== FORMAT_BALIKU) throw new Error("Nejde o balíček Legislativního prohlížeče (chybí označení formátu).");
  const b = Object.assign({predpisy: {}, oblasti: [], skupiny: [], skupinyKomentaru: [], vyznaceni: [], komentare: [], poznamky: {}, stitky: [], stitkyUstanoveni: []}, d);
  for (const k of ["oblasti", "skupiny", "skupinyKomentaru", "vyznaceni", "komentare", "stitky", "stitkyUstanoveni"]) if (!Array.isArray(b[k])) b[k] = [];
  b.oblasti.forEach(o => { if (!Array.isArray(o.predpisy)) o.predpisy = []; });
  b.vyznaceni.forEach(v => { if (!Array.isArray(v.skupiny)) v.skupiny = []; });
  b.komentare.forEach(k => { if (!Array.isArray(k.skupiny)) k.skupiny = []; });
  return b;
}
async function filtrovatBalik(b, v, nactiPozn){
  const ids = v.predpisy;
  const r = {format: FORMAT_BALIKU, verze: 1, vytvoreno: new Date().toISOString(), zdroj: b.zdroj,
    predpisy: {}, oblasti: [], skupiny: [], skupinyKomentaru: [], vyznaceni: [], komentare: [], poznamky: {}, stitky: [], stitkyUstanoveni: []};
  for (const id of ids) if (b.predpisy[id]) r.predpisy[id] = Object.assign({}, b.predpisy[id]);
  r.oblasti = b.oblasti.filter(o => v.oblasti.has(o.id)).map(o => Object.assign({}, o, {predpisy: o.predpisy.filter(x => ids.has(x))}));
  r.skupiny = b.skupiny.filter(s => v.skupiny.has(s.id)).map(s => Object.assign({}, s));
  r.skupinyKomentaru = b.skupinyKomentaru.filter(s => v.skupinyKom.has(s.id)).map(s => Object.assign({}, s));
  const sk = new Set(r.skupiny.map(s => s.id)), skk = new Set(r.skupinyKomentaru.map(s => s.id));
  /* rezim: "vse" = vše u vybraných předpisů, "skupiny" = jen z vybraných skupin (volitelně i bez skupiny), "zadne" */
  const bratPolozku = (x, rezim, skupiny, iBez) => rezim === "vse" || (rezim === "skupiny" && (x.skupiny.some(s => skupiny.has(s)) || (iBez && !x.skupiny.length)));
  const rezimVyz = v.vyz === true ? "vse" : v.vyz || "zadne", rezimKom = v.kom === true ? "vse" : v.kom || "zadne";
  r.vyznaceni = b.vyznaceni.filter(x => ids.has(x.predpis) && bratPolozku(x, rezimVyz, sk, v.vyzBez)).map(x => Object.assign({}, x, {skupiny: x.skupiny.filter(s => sk.has(s))}));
  r.komentare = b.komentare.filter(x => ids.has(x.predpis) && bratPolozku(x, rezimKom, skk, v.komBez)).map(x => Object.assign({}, x, {skupiny: x.skupiny.filter(s => skk.has(s))}));
  if (v.pozn) for (const id of ids){
    if (b.poznamky[id] !== undefined) r.poznamky[id] = b.poznamky[id];
    else if (b.predpisy[id] && b.predpisy[id].maPoznamku && nactiPozn){
      const t = await nactiPozn(id, b.predpisy[id]);
      if (t && t.trim()) r.poznamky[id] = t;
    }
  }
  if (v.stitky){
    r.stitkyUstanoveni = (b.stitkyUstanoveni || []).filter(z => ids.has(z.predpis)).map(z => Object.assign({}, z, {stitky: z.stitky.slice()}));
    const pouzite = new Set();
    for (const P of Object.values(r.predpisy)) (P.stitky || []).forEach(x => pouzite.add(x));
    r.stitkyUstanoveni.forEach(z => z.stitky.forEach(x => pouzite.add(x)));
    r.stitky = (b.stitky || []).filter(x => pouzite.has(x.id)).map(x => Object.assign({}, x));
  } else for (const P of Object.values(r.predpisy)) P.stitky = [];
  for (const P of Object.values(r.predpisy)){ P.maPoznamku = false; delete P.soubor; }
  for (const id of Object.keys(r.poznamky)) r.predpisy[id].maPoznamku = true;
  return r;
}
function popisBaliku(b){
  return pocetSlov(Object.keys(b.predpisy).length, "předpis", "předpisy", "předpisů") + ", " + pocetSlov(b.oblasti.length, "oblast", "oblasti", "oblastí") + ", "
    + pocetSlov(b.skupiny.length, "skupina vyznačení", "skupiny vyznačení", "skupin vyznačení") + ", " + pocetSlov(b.skupinyKomentaru.length, "skupina komentářů", "skupiny komentářů", "skupin komentářů") + ", "
    + pocetSlov(b.vyznaceni.length, "vyznačení", "vyznačení", "vyznačení") + ", " + pocetKomentaru(b.komentare.length) + ", "
    + pocetSlov(Object.keys(b.predpisy).filter(id => b.poznamky[id] !== undefined || b.predpisy[id].maPoznamku).length, "poznámka k předpisu", "poznámky k předpisům", "poznámek k předpisům") + ", " + pocetSlov((b.stitky || []).length, "štítek", "štítky", "štítků");
}

  const ss = skupinaVoleb("Skupiny vyznačení", b.skupiny, s => s.nazev, s => oznacPredpisy(b.vyznaceni.filter(v => v.skupiny.indexOf(s.id) >= 0).map(v => v.predpis), "se skupinou " + s.nazev));
  const sk = skupinaVoleb("Skupiny komentářů", b.skupinyKomentaru, s => s.nazev, s => oznacPredpisy(b.komentare.filter(k => k.skupiny.indexOf(s.id) >= 0).map(k => k.predpis), "se skupinou " + s.nazev));

  const vybrane = s => new Set(s.volby.filter(c => c.checked).map(c => c.value));

}
function prazdnyVyber(v){ return !v.predpisy.size && !v.oblasti.size && !v.skupiny.size && !v.skupinyKom.size; }

async function importovatBalik(b, politika, prubeh){
  const st = {oblasti: 0, skupiny: 0, predpisy: 0, vyz: 0, kom: 0, pozn: 0, chyby: []};
  const najdi = (seznam, x) => seznam.find(y => y.id === x.id) || seznam.find(y => String(y.nazev).trim().toLowerCase() === String(x.nazev).trim().toLowerCase());
  const sloucitText = (stary, novy) => {
    stary = stary || ""; novy = novy || "";
    if (politika === "prepsat") return novy.trim() ? novy : stary;
    if (politika === "ponechat" || !novy.trim() || stary.trim() === novy.trim()) return stary.trim() ? stary : novy;
    return stary.trim() ? stary.replace(/\s+$/, "") + "\n\n---\n\n" + novy.trim() + "\n" : novy;
  };
  const prevzitSkupiny = (zdroj, cil, predpona) => {
    const mapa = {};
    for (const s of zdroj){
      let c = najdi(cil, s);
      if (!c){ c = {id: s.id || novyId(predpona), nazev: s.nazev, popis: s.popis || ""}; cil.push(c); st.skupiny++; }
      else c.popis = sloucitText(c.popis, s.popis);
      mapa[s.id] = c.id;
    }
    return mapa;
  };
  const mapaOblasti = {};
  for (const o of b.oblasti){
    let c = najdi(W.oblasti, o);
    if (!c){ c = {id: o.id || novyId("o"), nazev: o.nazev, popis: o.popis || "", predpisy: []}; W.oblasti.push(c); st.oblasti++; }
    else c.popis = sloucitText(c.popis, o.popis);
    mapaOblasti[o.id] = c.id;
  }
  const mapaSk = prevzitSkupiny(b.skupiny, W.skupiny, "s");
  const mapaSkK = prevzitSkupiny(b.skupinyKomentaru, W.skupinyKomentaru, "sk");
  const mapaSt = prevzitSkupiny((b.stitky || []).map(x => Object.assign({}, x, {nazev: String(x.nazev || "").trim().toLowerCase()})), W.stitky, "t");
  const neuspesne = new Set();
  for (const id of Object.keys(b.predpisy)){
    const oblasti = b.oblasti.filter(o => o.predpisy.indexOf(id) >= 0).map(o => mapaOblasti[o.id]);
    if (W.predpisy[id]){
      for (const oid of oblasti){ const o = W.oblasti.find(x => x.id === oid); if (o && o.predpisy.indexOf(id) < 0) o.predpisy.push(id); }
      continue;
    }
    try { await stahnoutPredpis(id, {oblasti, budouci: !!b.predpisy[id].budouci}, prubeh); st.predpisy++; }
    catch (e){ neuspesne.add(id); st.chyby.push((b.predpisy[id].citace || citacePredpisuZId(id)) + " — " + e.message); }
  }
  for (const [id, Pb] of Object.entries(b.predpisy)){
    const P = W.predpisy[id];
    if (!P || neuspesne.has(id)) continue;
    if (Pb.popis && (politika === "prepsat" || !P.popis)) P.popis = Pb.popis;
    const nove = (Pb.stitky || []).map(x => mapaSt[x]).filter(Boolean);
    if (!Array.isArray(P.stitky)) P.stitky = [];
    if (politika === "prepsat" && nove.length) P.stitky = nove;
    else if (politika !== "ponechat" || !P.stitky.length) nove.forEach(x => { if (P.stitky.indexOf(x) < 0) P.stitky.push(x); });
  }
  for (const z of b.stitkyUstanoveni || []){
    if (neuspesne.has(z.predpis) || !W.predpisy[z.predpis]) continue;
    const nove = z.stitky.map(x => mapaSt[x]).filter(Boolean);
    const stare = stitkyUst(z.predpis, z.klic);
    const vysl = politika === "prepsat" ? nove : (politika === "ponechat" && stare.length) ? stare : stare.concat(nove);
    nastavStitkyUst(z.predpis, z.klic, {citace: z.citace, zneni: z.zneni, textUst: z.textUst}, vysl);
  }
  prubeh("Převádím vyznačení a komentáře…");
  for (const v of b.vyznaceni){
    if (neuspesne.has(v.predpis) || !W.predpisy[v.predpis]) continue;
    const skupiny = v.skupiny.map(s => mapaSk[s]).filter(Boolean);
    const c = W.vyznaceni.find(x => x.predpis === v.predpis && x.klic === v.klic);
    if (!c){ W.vyznaceni.push(Object.assign({}, v, {id: W.vyznaceni.some(x => x.id === v.id) ? novyId("v") : v.id, skupiny})); st.vyz++; }
    else if (politika === "prepsat"){ Object.assign(c, v, {id: c.id, skupiny}); st.vyz++; }
    else if (politika === "slouc"){
      skupiny.forEach(s => { if (c.skupiny.indexOf(s) < 0) c.skupiny.push(s); });
      c.poznamka = sloucitText(c.poznamka, v.poznamka); c.upraveno = new Date().toISOString(); st.vyz++;
    }
  }
  for (const k of b.komentare){
    if (neuspesne.has(k.predpis) || !W.predpisy[k.predpis]) continue;
    const skupiny = k.skupiny.map(s => mapaSkK[s]).filter(Boolean);
    const c = W.komentare.find(x => x.id === k.id);
    if (!c){ W.komentare.push(Object.assign({}, k, {skupiny})); st.kom++; }
    else if (politika === "prepsat"){ Object.assign(c, k, {skupiny}); st.kom++; }
    else if (politika === "slouc"){
      skupiny.forEach(s => { if (c.skupiny.indexOf(s) < 0) c.skupiny.push(s); });
      if ((k.upraveno || "") > (c.upraveno || "")){ c.text = k.text; c.upraveno = k.upraveno; }
      st.kom++;
    }
  }
  const soubory = [];
  for (const [id, text] of Object.entries(b.poznamky)){
    const P = W.predpisy[id];
    if (!P || neuspesne.has(id)) continue;
    let stary = "";
    try { stary = await nactiPoznamku(id); } catch (e){ st.chyby.push("poznámka k " + P.citace + " — stávající nejde načíst, nepřevzata"); continue; }
    const novy = sloucitText(stary, text);
    if (novy === stary) continue;
    const soubor = (P.poznamka && P.poznamka.soubor) || cestaPoznamky(id);
    P.poznamka = {soubor, upraveno: new Date().toISOString()};
    soubory.push({cesta: cestaWs(soubor), text: novy});
    cachePoznamek.set(id, novy);
    st.pozn++;
  }
  prubeh("Ukládám do GitHubu…");
  const ok = await ulozWorkspace(soubory, "Import dat" + (b.zdroj && b.zdroj.nazev ? " z pracovního prostoru " + b.zdroj.nazev : ""));
  if (!ok) throw new Error("výsledek importu se nepodařilo uložit — podrobnosti jsou ve stavovém řádku nahoře. Načtěte pracovní prostor znovu a import zopakujte.");
  return st;
}

    if (kom.length){
