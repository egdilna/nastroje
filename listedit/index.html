<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List editor</title>
<style>
:root {
  --pozadi: #f6f7fb;
  --plocha: #ffffff;
  --text: #1d2130;
  --tlumeny: #5b6275;
  --okraj: #d5d9e4;
  --akcent: #3949ab;
  --akcent-text: #ffffff;
  --akcent-svetly: #e8eaf6;
  --nebezpeci: #b3261e;
  --fokus: #ff9800;
  --cara: #c5cae9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --pozadi: #14161d;
    --plocha: #1d2029;
    --text: #e6e8ef;
    --tlumeny: #a3a9ba;
    --okraj: #3a3f4d;
    --akcent: #9fa8ff;
    --akcent-text: #10121a;
    --akcent-svetly: #262a3d;
    --nebezpeci: #ff8a80;
    --fokus: #ffb74d;
    --cara: #3c4366;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--pozadi);
  color: var(--text);
}
[hidden] { display: none !important; }
.preskocit { position: absolute; left: -9999px; }
.preskocit:focus { left: 8px; top: 8px; z-index: 10; background: var(--plocha); padding: 6px 10px; }
header {
  background: var(--plocha);
  border-bottom: 1px solid var(--okraj);
  padding: 10px 16px;
  position: sticky;
  top: 0;
  z-index: 5;
}
.hlavicka { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
h1 { font-size: 1.25rem; margin: 0; }
.lista { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.lista .oddel { width: 1px; height: 24px; background: var(--okraj); margin: 0 4px; }
button, select {
  font: inherit;
  font-size: 0.9rem;
  color: var(--text);
  background: var(--plocha);
  border: 1px solid var(--okraj);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover { background: var(--akcent-svetly); }
button.hlavni { background: var(--akcent); color: var(--akcent-text); border-color: var(--akcent); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px; }
label.prepinac { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.drobky {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  background: var(--akcent-svetly); border-radius: 8px; padding: 6px 10px; margin-bottom: 12px;
}
.drobky button { background: transparent; border: none; color: var(--akcent); text-decoration: underline; padding: 2px 4px; }
.drobky .aktualni { font-weight: 600; }
.prazdno {
  background: var(--plocha); border: 2px dashed var(--okraj); border-radius: 10px;
  padding: 24px; text-align: center; color: var(--tlumeny);
}
ul.seznam { list-style: none; margin: 0; padding: 0; }
ul.seznam ul.seznam { margin-left: 22px; border-left: 2px solid var(--cara); padding-left: 6px; }
.radek {
  display: flex; align-items: center; gap: 6px;
  padding: 2px 4px; border-radius: 6px; min-height: 34px;
}
.radek:hover, .radek:focus-within { background: var(--akcent-svetly); }
.radek.vybrany { background: var(--akcent-svetly); box-shadow: inset 3px 0 0 var(--akcent); }
.sbal {
  width: 26px; height: 26px; padding: 0; flex: none;
  border: none; background: transparent; color: var(--tlumeny); font-size: 0.8rem;
}
.sbal.bez { display: inline-block; }
.cislo { color: var(--akcent); font-variant-numeric: tabular-nums; white-space: pre; font-weight: 600; flex: none; }
.text {
  flex: 1; min-width: 0; word-break: break-word; cursor: text;
  padding: 3px 4px; border-radius: 4px;
}
.text.prazdny { color: var(--tlumeny); font-style: italic; }
.radek input.editace {
  flex: 1; min-width: 0; font: inherit; color: var(--text);
  background: var(--plocha); border: 1px solid var(--akcent); border-radius: 4px; padding: 2px 4px;
}
.akce { display: flex; gap: 2px; flex: none; }
.akce button { padding: 2px 7px; font-size: 0.85rem; }
.akce button.odkaz {
  border: none; background: transparent; color: var(--akcent);
  text-decoration: underline; padding: 2px 5px;
}
.akce button.smazat { color: var(--nebezpeci); }
.pocet { font-size: 0.75rem; color: var(--tlumeny); flex: none; }
#stav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--plocha); border-top: 1px solid var(--okraj);
  padding: 4px 16px; font-size: 0.85rem; color: var(--tlumeny);
}
main { padding-bottom: 60px; }
dialog {
  border: 1px solid var(--okraj); border-radius: 10px; background: var(--plocha); color: var(--text);
  width: min(720px, calc(100vw - 32px)); padding: 16px;
}
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h2 { margin: 0 0 8px; font-size: 1.1rem; }
dialog textarea {
  width: 100%; min-height: 260px; font: 14px/1.4 ui-monospace, Consolas, monospace;
  color: var(--text); background: var(--pozadi); border: 1px solid var(--okraj); border-radius: 6px; padding: 8px;
  tab-size: 4;
}
dialog .tlacitka { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 10px; }
dialog p { margin: 4px 0 8px; color: var(--tlumeny); font-size: 0.9rem; }
.napoveda { font-size: 0.85rem; color: var(--tlumeny); margin-top: 16px; }
.napoveda kbd {
  font: 0.8rem ui-monospace, monospace; border: 1px solid var(--okraj);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--plocha);
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 640px) {
  .akce button.odkaz { padding: 2px 3px; }
  ul.seznam ul.seznam { margin-left: 10px; }
}
</style>
</head>
<body>
<a class="preskocit" href="#obsah" data-t="preskocit">Přeskočit na seznam</a>
<header>
  <div class="hlavicka">
    <h1 data-t="nazev">List editor</h1>
    <label class="prepinac"><span data-t="jazyk">Jazyk</span>
      <select id="jazyk">
        <option value="cs">Čeština</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
  <div class="lista" role="toolbar" id="nastroje" data-ta="lista">
    <button class="hlavni" id="btnVlozit" data-t="vlozit">Vložit seznam…</button>
    <button id="btnPridat" data-t="pridat">Přidat položku</button>
    <span class="oddel" aria-hidden="true"></span>
    <button id="btnKopTab" data-t="kopTab">Kopírovat jako text (tabulátory)</button>
    <button id="btnKopMd" data-t="kopMd">Kopírovat jako Markdown</button>
    <button id="btnKopCis" data-t="kopCis">Kopírovat jako číslovaný</button>
    <button id="btnKopHier" data-t="kopHier">Kopírovat s čísly 1.2.1</button>
    <span class="oddel" aria-hidden="true"></span>
    <label class="prepinac"><input type="checkbox" id="chkCisla"> <span data-t="cisla">Čísla hierarchie</span></label>
    <button id="btnSbalit" data-t="sbalitVse">Sbalit vše</button>
    <button id="btnRozbalit" data-t="rozbalitVse">Rozbalit vše</button>
    <span class="oddel" aria-hidden="true"></span>
    <button id="btnZpet" data-t="zpet">Zpět</button>
    <button id="btnZnovu" data-t="znovu">Znovu</button>
    <button id="btnSmazatVse" data-t="smazatVse">Vymazat seznam</button>
  </div>
</header>

<main id="obsah" tabindex="-1">
  <nav id="drobky" class="drobky" hidden data-ta="drobky"></nav>
  <div id="strom"></div>
  <div class="napoveda" id="napoveda"></div>
</main>

<div id="stav" role="status" aria-live="polite"></div>

<dialog id="dlgVlozit" aria-labelledby="dlgVlozitNadpis">
  <h2 id="dlgVlozitNadpis" data-t="vlozitNadpis">Vložit seznam</h2>
  <p data-t="vlozitPopis">Vložte text, odsazený tabulátory nebo mezerami, případně Markdown seznam (- položka, * položka, 1. položka) nebo číslování 1.2.1.</p>
  <label for="vstup" class="sr" data-t="vlozitNadpis">Vložit seznam</label>
  <textarea id="vstup" spellcheck="false"></textarea>
  <div class="tlacitka">
    <button id="btnSchranka" data-t="zeSchranky">Načíst ze schránky</button>
    <button id="btnPripojit" data-t="pripojit">Připojit na konec</button>
    <button id="btnNahradit" class="hlavni" data-t="nahradit">Nahradit seznam</button>
    <button id="btnZavrit" data-t="zavrit">Zavřít</button>
  </div>
</dialog>

<script>

// ---------- Texty ----------

    celyZobrazen: "Zobrazen celý seznam.",
    uroven: n => "úroveň " + n,
    pocetPolozek: n => "Položek: " + n,
    napoveda: "<b>Při úpravě:</b> <kbd>Enter</kbd> nová položka · <kbd>Shift</kbd>+<kbd>Enter</kbd> zbytek textu do nové položky · <kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> na začátku textu odsadí / předsadí · <kbd>Backspace</kbd> v prázdné položce ji smaže · <kbd>↑</kbd> <kbd>↓</kbd> přechod na sousední položku · <kbd>Esc</kbd> zrušit. <b>V seznamu:</b> <kbd>/</kbd> skok do seznamu · <kbd>↑</kbd> <kbd>↓</kbd> výběr položky · <kbd>.</kbd> / <kbd>,</kbd> rozbalit / sbalit (i <kbd>→</kbd> <kbd>←</kbd>) · <kbd>E</kbd>, <kbd>Enter</kbd>, <kbd>F2</kbd> upravit · <kbd>W</kbd> / <kbd>S</kbd> posun nahoru / dolů · <kbd>D</kbd> / <kbd>A</kbd> odsadit / předsadit (i <kbd>Alt</kbd>+šipky) · <kbd>J</kbd> sloučit s předchozí · <kbd>Delete</kbd> smazat · <kbd>H</kbd> jen tato · <kbd>Insert</kbd> nová položka · <kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> zpět / znovu."
  },
  en: {
    nazev: "List editor",
    jazyk: "Language",

    kopChyba: "Could not write to the clipboard.",
    vlozeno: n => "Items pasted: " + n + ".",
    nicKVlozeni: "The pasted text contains no items.",
    schrankaChyba: "Could not read the clipboard — paste the text into the field manually (Ctrl+V).",

    smazanoPodr: n => "Item deleted with its children (" + n + ").",

    zopakovano: "Redone.",
    hoistuto: t => "Showing only “" + t + "”.",
    celyZobrazen: "Showing the whole list.",
    uroven: n => "level " + n,
    pocetPolozek: n => "Items: " + n,
    napoveda: "<b>While editing:</b> <kbd>Enter</kbd> new item · <kbd>Shift</kbd>+<kbd>Enter</kbd> rest of the text into a new item · <kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> at the start of the text indents / outdents · <kbd>Backspace</kbd> in an empty item deletes it · <kbd>↑</kbd> <kbd>↓</kbd> go to the neighbouring item · <kbd>Esc</kbd> cancel. <b>In the list:</b> <kbd>/</kbd> jump to the list · <kbd>↑</kbd> <kbd>↓</kbd> select item · <kbd>.</kbd> / <kbd>,</kbd> expand / collapse (also <kbd>→</kbd> <kbd>←</kbd>) · <kbd>E</kbd>, <kbd>Enter</kbd>, <kbd>F2</kbd> edit · <kbd>W</kbd> / <kbd>S</kbd> move up / down · <kbd>D</kbd> / <kbd>A</kbd> indent / outdent (also <kbd>Alt</kbd>+arrows) · <kbd>J</kbd> merge with previous · <kbd>Delete</kbd> delete · <kbd>H</kbd> only this · <kbd>Insert</kbd> new item · <kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> undo / redo."

const KLIC_DATA = "listedit-data";
const KLIC_NASTAVENI = "listedit-nastaveni";

let jazyk = "cs";
let koren = { id: "koren", text: "", deti: [] };
let hoistId = null;         // id položky, na kterou je pohled zúžen
let vybranyId = null;       // položka s fokusem
let editaceId = null;       // položka právě v editaci
let editaceNova = false;    // editovaná položka vznikla právě teď (Esc ji zase smaže)
let zobrazitCisla = false;
let historie = [];
let budoucnost = [];
let citacId = 1;

const $ = id => document.getElementById(id);
const T = (klic, ...arg) => {
  const h = TEXTY[jazyk][klic];
  return typeof h === "function" ? h(...arg) : h;
};

function noveId() { return "p" + (citacId++) + "-" + Math.random().toString(36).slice(2, 6); }
function novaPolozka(text) { return { id: noveId(), text: text || "", deti: [], sbaleno: false }; }

// ---------- Ukládání (jen localStorage tohoto prohlížeče) ----------
function ulozit() {
  try {
    localStorage.setItem(KLIC_DATA, JSON.stringify({ deti: koren.deti, hoistId }));
  } catch (e) { /* plné úložiště nebo soukromé okno — editor běží dál */ }
}
function ulozitNastaveni() {
  try { localStorage.setItem(KLIC_NASTAVENI, JSON.stringify({ jazyk, zobrazitCisla })); } catch (e) {}
}
function nacist() {
  try {
    const n = JSON.parse(localStorage.getItem(KLIC_NASTAVENI) || "null");
    if (n) { jazyk = TEXTY[n.jazyk] ? n.jazyk : jazyk; zobrazitCisla = !!n.zobrazitCisla; }
    else jazyk = (navigator.language || "cs").toLowerCase().startsWith("cs") ? "cs" : "en";
  } catch (e) {}
  try {
    const d = JSON.parse(localStorage.getItem(KLIC_DATA) || "null");
    if (d && Array.isArray(d.deti)) {
      koren.deti = opravStrom(d.deti);
      hoistId = d.hoistId && najdi(d.hoistId) ? d.hoistId : null;
    }
  } catch (e) {}
}
function opravStrom(pole) {
  return pole.filter(p => p && typeof p === "object").map(p => ({
    id: typeof p.id === "string" ? p.id : noveId(),
    text: String(p.text ?? ""),
    deti: opravStrom(Array.isArray(p.deti) ? p.deti : []),
    sbaleno: !!p.sbaleno
  }));
}

// ---------- Historie ----------
function snimek() { return JSON.stringify({ deti: koren.deti, hoistId }); }
function zapamatuj() {
  historie.push(snimek());
  if (historie.length > 200) historie.shift();
  budoucnost = [];
}
function obnov(s) {
  const d = JSON.parse(s);
  koren.deti = d.deti;
  hoistId = d.hoistId && najdi(d.hoistId) ? d.hoistId : null;
  if (vybranyId && !najdi(vybranyId)) vybranyId = null;
}
function zpet() {
  if (!historie.length) return;
  ukoncitEditaci(true);
  budoucnost.push(snimek());
  obnov(historie.pop());
  zmena(T("vraceno"));
}
function znovu() {
  if (!budoucnost.length) return;
  ukoncitEditaci(true);
  historie.push(snimek());
  obnov(budoucnost.pop());
  zmena(T("zopakovano"));
}

// ---------- Strom ----------
function najdi(id, uzel = koren, rodic = null) {
  for (let i = 0; i < uzel.deti.length; i++) {
    const p = uzel.deti[i];
    if (p.id === id) return { polozka: p, rodic: uzel, index: i };
    const r = najdi(id, p);
    if (r) return r;
  }
  return null;
}
function cesta(id) {
  // pole předků od kořene po položku včetně
  const vysl = [];
  (function hledej(uzel) {
    for (const p of uzel.deti) {
      vysl.push(p);
      if (p.id === id || hledej(p)) return true;
      vysl.pop();
    }
    return false;
  })(koren);
  return vysl;
}
function pocetPotomku(p) { return p.deti.reduce((s, d) => s + 1 + pocetPotomku(d), 0); }
function koreniPohledu() { return hoistId ? najdi(hoistId).polozka : koren; }

// viditelné položky v pořadí zobrazení
function viditelne() {
  const vysl = [];
  const projdi = p => { vysl.push(p); if (!p.sbaleno) p.deti.forEach(projdi); };
  if (hoistId) projdi(najdi(hoistId).polozka);
  else koren.deti.forEach(projdi);
  return vysl;
}

// čísla podle hierarchie (vždy podle celého seznamu)
function cislaHierarchie() {
  const mapa = new Map();
  const projdi = (uzel, pred) => uzel.deti.forEach((p, i) => {
    const c = pred.concat(i + 1);
    mapa.set(p.id, c);
    projdi(p, c);
  });
  projdi(koren, []);
  return mapa;
}

// ---------- Operace ----------
function posun(id, smer) {
  const n = najdi(id);
  if (!n) return false;
  const cil = n.index + smer;
  if (cil < 0 || cil >= n.rodic.deti.length) return false;
  if (hoistId === id) return false;
  zapamatuj();
  n.rodic.deti.splice(n.index, 1);
  n.rodic.deti.splice(cil, 0, n.polozka);
  return true;
}
function odsad(id) {
  const n = najdi(id);
  if (!n || n.index === 0 || hoistId === id) return false;
  zapamatuj();
  const predchozi = n.rodic.deti[n.index - 1];
  n.rodic.deti.splice(n.index, 1);
  predchozi.deti.push(n.polozka);
  predchozi.sbaleno = false;
  return true;
}
function predsad(id) {
  const n = najdi(id);
  if (!n || n.rodic === koren || hoistId === id) return false;
  // při zúženém pohledu nesmí položka vypadnout ven z pohledu
  if (hoistId && n.rodic.id === hoistId) return false;
  const nadrazeny = najdi(n.rodic.id);
  zapamatuj();
  // následující sourozenci se stanou dětmi předsazené položky (jako v outlinerech)
  const nasledujici = n.rodic.deti.splice(n.index);
  nasledujici.shift();
  n.polozka.deti.push(...nasledujici);
  nadrazeny.rodic.deti.splice(nadrazeny.index + 1, 0, n.polozka);
  return true;
}
function smaz(id, potvrzeno) {
  const n = najdi(id);
  if (!n) return;
  const pocet = pocetPotomku(n.polozka);
  if (pocet && !potvrzeno && !confirm(T("potvrdSmazat", pocet))) return;
  const vid = viditelne();
  const poz = vid.findIndex(p => p.id === id);
  zapamatuj();
  n.rodic.deti.splice(n.index, 1);
  if (hoistId && !najdi(hoistId)) hoistId = null;
  if (hoistId === id) hoistId = null;
  const zbyle = viditelne();
  const dalsi = vid.slice(poz + 1).find(p => zbyle.includes(p)) || vid.slice(0, poz).reverse().find(p => zbyle.includes(p));
  vybranyId = dalsi ? dalsi.id : null;
  zmena(pocet ? T("smazanoPodr", pocet) : T("smazano"));
}
// vloží novou položku za danou: má-li rozbalené děti, stane se jejím prvním dítětem
function vlozZa(id, text) {
  const p = novaPolozka(text);
  const n = id ? najdi(id) : null;
  if (!n) {
    const k = koreniPohledu();
    k.deti.push(p);
    k.sbaleno = false;
  } else if ((n.polozka.deti.length && !n.polozka.sbaleno) || hoistId === id) {
    n.polozka.deti.unshift(p);
    n.polozka.sbaleno = false;
  } else {
    n.rodic.deti.splice(n.index + 1, 0, p);
  }
  return p;
}

// ---------- Rozbor vloženého textu ----------
const RE_ODRAZKA = /^([-*+•–·▪◦‣])\s+/;
const RE_CISLO = /^(?:\d+[.)]|[a-zA-Z]\))\s+/;  // „1. text“, „1) text“, „a) text“
const RE_VICE_CISLO = /^(\d+(?:\.\d+)+)\.?\s+/;
const RE_HIER_CISLO = /^(\d+(?:\.\d+)*)\.?\s+/;

function rozeberText(text) {
  const radky = text.replace(/\r\n?/g, "\n").split("\n").filter(r => r.trim());
  const polozky = radky.map(r => {
    let sirka = 0, i = 0;
    for (; i < r.length; i++) {
      if (r[i] === " " || r[i] === "\u00a0") sirka += 1;
      else if (r[i] === "\t") sirka += 4 - (sirka % 4);
      else break;
    }
    return { sirka, text: r.slice(i).trimEnd() };
  });
  if (!polozky.length) return [];
  // bez odsazení a s čísly typu 1.2.1 → úroveň určí číslo
  const podleCisel = polozky.every(p => p.sirka === 0) && polozky.some(p => RE_VICE_CISLO.test(p.text));
  const zasobnik = [];
  const vysl = [];
  for (const p of polozky) {
    let t = p.text, uroven;
    const v = podleCisel && t.match(RE_HIER_CISLO);
    if (v) {
      uroven = v[1].split(".").length - 1;
      t = t.slice(v[0].length);
    } else {
      if (RE_ODRAZKA.test(t)) t = t.replace(RE_ODRAZKA, "").replace(/^\[[ xX]\]\s+/, ""); // i úkolové zaškrtávátko
      else t = t.replace(RE_CISLO, "");
      if (podleCisel) uroven = vysl.length ? vysl[vysl.length - 1].uroven + 1 : 0; // řádek bez čísla patří pod předchozí
      else {
        while (zasobnik.length && zasobnik[zasobnik.length - 1] > p.sirka) zasobnik.pop();
        if (!zasobnik.length || zasobnik[zasobnik.length - 1] < p.sirka) zasobnik.push(p.sirka);
        uroven = zasobnik.length - 1;
      }
    }
    vysl.push({ uroven, text: t });
  }
  // sestavení stromu; úroveň může skočit nanejvýš o jednu hlouběji
  const kmen = { deti: [] };
  const cestaUzlu = [kmen];
  for (const v of vysl) {
    const u = Math.min(v.uroven, cestaUzlu.length - 1);
    cestaUzlu.length = u + 1;
    const p = novaPolozka(v.text);
    cestaUzlu[u].deti.push(p);
    cestaUzlu.push(p);
  }
  return kmen.deti;
}

// ---------- Výstupy ----------
function vystupTab() {
  const r = [];
  const projdi = (p, u) => { r.push("\t".repeat(u) + p.text); p.deti.forEach(d => projdi(d, u + 1)); };
  koren.deti.forEach(p => projdi(p, 0));
  return r.join("\n");
}
function vystupMd() {
  const r = [];
  const projdi = (p, u) => { r.push("  ".repeat(u) + "- " + p.text); p.deti.forEach(d => projdi(d, u + 1)); };
  koren.deti.forEach(p => projdi(p, 0));
  return r.join("\n");
}
function vystupCislovany() {
  // Markdown číslovaný seznam; vnoření o šířku značky nadřízeného
  const r = [];
  const projdi = (uzel, odsazeni) => uzel.deti.forEach((p, i) => {
    const znacka = (i + 1) + ". ";
    r.push(odsazeni + znacka + p.text);
    projdi(p, odsazeni + " ".repeat(znacka.length));
  });
  projdi(koren, "");
  return r.join("\n");
}
function vystupHierarchie() {
  const r = [];
  const projdi = (uzel, pred, u) => uzel.deti.forEach((p, i) => {
    const c = pred.concat(i + 1);
    r.push("\t".repeat(u) + c.join(".") + " " + p.text);
    projdi(p, c, u + 1);
  });
  projdi(koren, [], 0);
  return r.join("\n");
}
async function kopiruj(text) {
  try {
    await navigator.clipboard.writeText(text);
    hlaseni(T("zkopirovano"));
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    hlaseni(ok ? T("zkopirovano") : T("kopChyba"));
  }
}

// ---------- Vykreslení ----------
function hlaseni(t) { $("stav").textContent = t || T("pocetPolozek", pocetPotomku(koren)); }

function zmena(zprava) {
  ulozit();
  vykresli();
  hlaseni(zprava);
}

function vykresli() {
  const strom = $("strom");
  const cisla = zobrazitCisla ? cislaHierarchie() : null;
  strom.textContent = "";
  vykresliDrobky();
  const pohled = hoistId ? [najdi(hoistId).polozka] : koren.deti;
  if (!pohled.length) {
    const d = document.createElement("div");
    d.className = "prazdno";
    d.textContent = T("prazdno");
    strom.appendChild(d);
    vybranyId = null;
  } else {
    const hloubkaZaklad = hoistId ? cesta(hoistId).length : 1;
    strom.appendChild(vykresliUroven(pohled, cisla, hloubkaZaklad, true));
  }
  if (vybranyId && !viditelne().some(p => p.id === vybranyId)) vybranyId = null;
  $("btnZpet").disabled = !historie.length;
  $("btnZnovu").disabled = !budoucnost.length;
  obnovFokus();
}

function vykresliUroven(polozky, cisla, hloubka, horni) {
  const ul = document.createElement("ul");
  ul.className = "seznam";
  if (horni) ul.setAttribute("aria-label", T("nazev"));
  polozky.forEach((p, i) => {
    const li = document.createElement("li");
    li.dataset.id = p.id;
    const radek = document.createElement("div");
    radek.className = "radek" + (p.id === vybranyId ? " vybrany" : "");
    radek.dataset.id = p.id;

    const vybrany = p.id === vybranyId;
    // ovládací prvky jsou v tabulátorovém pořadí jen u vybrané položky (putující tabindex)
    if (p.deti.length) {
      const sbal = document.createElement("button");
      sbal.className = "sbal";
      sbal.dataset.akce = "sbal";
      sbal.tabIndex = vybrany ? 0 : -1;
      sbal.textContent = p.sbaleno ? "▶" : "▼";
      sbal.setAttribute("aria-expanded", String(!p.sbaleno));
      sbal.setAttribute("aria-label", T("podrizene"));
      sbal.title = p.sbaleno ? T("rozbalitPopis") : T("sbalitPopis");
      radek.appendChild(sbal);
    } else {
      const mezera = document.createElement("span");
      mezera.className = "sbal bez";
      radek.appendChild(mezera);
    }

    if (cisla) {
      const c = document.createElement("span");
      c.className = "cislo";
      c.textContent = cisla.get(p.id).join(" ");
      radek.appendChild(c);
    }

    if (p.id === editaceId) {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "editace";
      inp.value = p.text;
      inp.setAttribute("aria-label", T("editacePopis") + ", " + T("uroven", hloubka));
      inp.dataset.id = p.id;
      radek.appendChild(inp);
    } else {
      const t = document.createElement("span");
      t.className = "text" + (p.text ? "" : " prazdny");
      t.textContent = p.text || T("prazdnaPolozka");
      t.dataset.akce = "upravit";
      t.dataset.id = p.id;
      t.id = "t-" + p.id;
      t.tabIndex = vybrany ? 0 : -1;
      // fokus je na samotném textu; úroveň a stav větve se přečtou jako popis
      const popis = document.createElement("span");
      popis.className = "sr";
      popis.id = "d-" + p.id;
      popis.textContent = T("uroven", hloubka) +
        (p.deti.length ? ", " + T("podrizenych", p.deti.length) + ", " + (p.sbaleno ? T("sbaleno") : T("rozbaleno")) : "");
      popis.setAttribute("aria-hidden", "true"); // v procházení stránkou nese úroveň samotný seznam
      t.setAttribute("aria-describedby", popis.id);
      radek.appendChild(t);
      radek.appendChild(popis);
    }

    if (p.sbaleno && p.deti.length) {
      const poc = document.createElement("span");
      poc.className = "pocet";
      poc.textContent = "(" + T("podrizenych", pocetPotomku(p)) + ")";
      radek.appendChild(poc);
    }

    const akce = document.createElement("span");
    akce.className = "akce";
    akce.setAttribute("role", "group");
    akce.setAttribute("aria-label", T("nastrojePolozky"));
    const tl = (akceId, text, popis, trida) => {
      const b = document.createElement("button");
      b.dataset.akce = akceId;
      b.textContent = text;
      b.title = popis;
      b.setAttribute("aria-label", popis);
      b.tabIndex = vybrany ? 0 : -1;
      if (trida) b.className = trida;
      akce.appendChild(b);
    };
    tl("upravit", T("upravit"), T("upravitPopis"));
    tl("smazat", T("smazat"), T("smazatPopis"), "smazat");
    tl("nahoru", T("nahoru"), T("nahoruPopis"), "odkaz");
    tl("dolu", T("dolu"), T("doluPopis"), "odkaz");
    tl("doprava", T("doprava"), T("dopravaPopis"), "odkaz");
    tl("doleva", T("doleva"), T("dolevaPopis"), "odkaz");
    tl("sloucit", T("sloucit"), T("sloucitPopis"), "odkaz");
    tl("hoist", T("hoist"), T("hoistPopis"), "odkaz");
    radek.appendChild(akce);

    li.appendChild(radek);
    if (p.deti.length && !p.sbaleno) li.appendChild(vykresliUroven(p.deti, cisla, hloubka + 1, false));
    ul.appendChild(li);
  });
  return ul;
}

function vykresliDrobky() {
  const nav = $("drobky");
  nav.textContent = "";
  nav.setAttribute("aria-label", T("drobky"));
  if (!hoistId) { nav.hidden = true; return; }
  nav.hidden = false;
  const b = document.createElement("button");
  b.textContent = T("celySeznam");
  b.addEventListener("click", () => hoistNa(null));
  nav.appendChild(b);
  const c = cesta(hoistId);
  c.forEach((p, i) => {
    const sip = document.createElement("span");
    sip.textContent = "›";
    sip.setAttribute("aria-hidden", "true");
    nav.appendChild(sip);
    if (i === c.length - 1) {
      const s = document.createElement("span");
      s.className = "aktualni";
      s.textContent = p.text || T("prazdnaPolozka");
      s.setAttribute("aria-current", "location");
      nav.appendChild(s);
    } else {
      const x = document.createElement("button");
      x.textContent = p.text || T("prazdnaPolozka");
      x.addEventListener("click", () => hoistNa(p.id));
      nav.appendChild(x);
    }
  });
}

function obnovFokus() {
  if (editaceId) {
    const inp = document.querySelector("input.editace");
    if (inp) {
      inp.focus();
      const poz = obnovFokus.kurzor ?? inp.value.length;
      inp.setSelectionRange(poz, poz);
      obnovFokus.kurzor = null;
    }
    return;
  }
  if (!vybranyId) {
    const prvni = viditelne()[0];
    if (prvni) {
      nastavTabulator(prvni.id);
    }
    return;
  }
  const t = document.querySelector(`.text[data-id="${vybranyId}"]`);
  if (t && obnovFokus.chciFokus) t.focus();
  obnovFokus.chciFokus = false;
}

// do tabulátorového pořadí patří jen text a tlačítka jednoho řádku
function nastavTabulator(id) {
  document.querySelectorAll(".radek").forEach(r => {
    const je = r.dataset.id === id;
    r.querySelectorAll(".text, button").forEach(el => { el.tabIndex = je ? 0 : -1; });
  });
}
function vyber(id, sFokusem = true) {
  vybranyId = id;
  document.querySelectorAll(".radek").forEach(r => r.classList.toggle("vybrany", r.dataset.id === id));
  nastavTabulator(id);
  if (sFokusem) {
    const t = document.querySelector(`.text[data-id="${id}"]`);
    if (t) t.focus();
  }
}

// ---------- Editace ----------
function zacitEditaci(id, kurzor, nova) {
  if (editaceId && editaceId !== id) ukoncitEditaci(false);
  editaceId = id;
  editaceNova = !!nova;
  vybranyId = id;
  obnovFokus.kurzor = kurzor;
  vykresli();
}
// uloží (nebo zahodí) text z editačního pole; nevykresluje
function ukoncitEditaci(zrusit) {
  if (!editaceId) return;
  const inp = document.querySelector("input.editace");
  const n = najdi(editaceId);
  const id = editaceId;
  editaceId = null;
  if (!n || !inp) return;
  if (zrusit) {
    if (editaceNova && !n.polozka.text) {
      n.rodic.deti.splice(n.index, 1);
      historie.pop(); // vytvoření prázdné položky nebylo potřeba
      vybranyId = n.index > 0 ? n.rodic.deti[n.index - 1].id : (n.rodic.id !== "koren" ? n.rodic.id : null);
    }
    return;
  }
  if (inp.value !== n.polozka.text) {
    if (!editaceNova) zapamatuj();
    n.polozka.text = inp.value;
  }
  vybranyId = id;
  ulozit();
}

function klavesaVEditaci(e) {
  const inp = e.target;
  const id = inp.dataset.id;
  const zacatek = inp.selectionStart === 0 && inp.selectionEnd === 0;
  if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    ukoncitEditaci(false);
    zapamatuj();
    const p = vlozZa(id, "");
    ulozit();
    zacitEditaci(p.id, 0, true);
  } else if (e.key === "Enter" && e.shiftKey) {
    e.preventDefault();
    const poz = inp.selectionStart;
    const zbytek = inp.value.slice(inp.selectionEnd);
    inp.value = inp.value.slice(0, poz).trimEnd();
    ukoncitEditaci(false);
    zapamatuj();
    const p = vlozZa(id, zbytek.trimStart());
    ulozit();
    zacitEditaci(p.id, 0, false);
  } else if (e.key === "Tab" && zacatek) {
    e.preventDefault();
    const kurzor = 0;
    ukoncitEditaci(false);
    const ok = e.shiftKey ? predsad(id) : odsad(id);
    ulozit();
    hlaseni(ok ? T(e.shiftKey ? "predsazeno" : "odsazeno") : T("nelze"));
    zacitEditaci(id, kurzor, false);
  } else if (e.key === "Escape") {
    e.preventDefault();
    ukoncitEditaci(true);
    obnovFokus.chciFokus = true;
    vykresli();
  } else if (e.key === "Backspace" && inp.value === "") {
    e.preventDefault();
    const vid = viditelne();
    const poz = vid.findIndex(p => p.id === id);
    const n = najdi(id);
    if (n.polozka.deti.length) return;
    editaceId = null;
    zapamatuj();
    n.rodic.deti.splice(n.index, 1);
    ulozit();
    const predchozi = vid[poz - 1];
    if (predchozi) zacitEditaci(predchozi.id, null, false);
    else { vybranyId = null; vykresli(); }
  } else if ((e.key === "ArrowUp" || e.key === "ArrowDown") && !e.altKey && !e.shiftKey) {
    e.preventDefault();
    const vid = viditelne();
    const poz = vid.findIndex(p => p.id === id);
    const cil = vid[poz + (e.key === "ArrowUp" ? -1 : 1)];
    if (cil) { ukoncitEditaci(false); zacitEditaci(cil.id, null, false); }
  } else if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {
    // vlastní zpět v poli, pokud je co vracet v textu, nech prohlížeči
    if (inp.value === najdi(id).polozka.text) { e.preventDefault(); e.shiftKey ? znovu() : zpet(); }
  }
}

function vlozeniDoEditace(e) {
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text || !/\n/.test(text.trim())) return; // jednořádkový text vloží prohlížeč sám
  e.preventDefault();
  const inp = e.target;
  const id = inp.dataset.id;
  const nove = rozeberText(text);
  if (!nove.length) return;
  const bylPrazdny = inp.value.trim() === "";
  ukoncitEditaci(false);
  zapamatuj();
  const n = najdi(id);
  if (bylPrazdny) {
    n.rodic.deti.splice(n.index, 1, ...nove);
  } else {
    n.rodic.deti.splice(n.index + 1, 0, ...nove);
  }
  vybranyId = nove[nove.length - 1].id;
  obnovFokus.chciFokus = true;
  zmena(T("vlozeno", nove.reduce((s, p) => s + 1 + pocetPotomku(p), 0)));
}

// ---------- Akce nad položkou ----------
function provedAkci(akce, id) {
  const n = najdi(id);
  if (!n) return;
  let ok;
  switch (akce) {
    case "upravit": zacitEditaci(id, null, false); return;
    case "smazat": obnovFokus.chciFokus = true; smaz(id); return;
    case "nahoru": ok = posun(id, -1); break;
    case "dolu": ok = posun(id, 1); break;
    case "doprava": ok = odsad(id); break;
    case "doleva": ok = predsad(id); break;
    case "sloucit": ok = sloucit(id); if (ok) id = ok; break;
    case "hoist": hoistNa(hoistId === id ? null : id); return;
    case "sbal":
      if (!n.polozka.deti.length) return;
      n.polozka.sbaleno = !n.polozka.sbaleno;
      vybranyId = id;
      obnovFokus.chciFokus = true;
      zmena(n.polozka.sbaleno ? T("sbalitPopis") : T("rozbalitPopis"));
      return;
  }
  vybranyId = id;
  obnovFokus.chciFokus = true;
  zmena(ok ? (akce === "doprava" ? T("odsazeno") : akce === "doleva" ? T("predsazeno") : akce === "sloucit" ? T("slouceno") : T("presunuto")) : T("nelze"));
}

// připojí text položky k předchozí viditelné položce; vrátí id té předchozí
function sloucit(id) {
  const vid = viditelne();
  const poz = vid.findIndex(p => p.id === id);
  const cil = vid[poz - 1];
  if (!cil || hoistId === id) return false;
  const n = najdi(id);
  zapamatuj();
  const p = n.polozka;
  cil.text = [cil.text.trimEnd(), p.text.trimStart()].filter(Boolean).join(" ");
  n.rodic.deti.splice(n.index, 1);
  // podřízené přejdou pod sloučenou položku; u nadřazené na místo, kde byla sloučená
  if (n.rodic === cil) cil.deti.splice(n.index, 0, ...p.deti);
  else { cil.deti.push(...p.deti); cil.sbaleno = false; }
  return cil.id;
}

function hoistNa(id) {
  ukoncitEditaci(false);
  hoistId = id;
  if (id) {
    const n = najdi(id);
    n.polozka.sbaleno = false;
    vybranyId = id;
  }
  obnovFokus.chciFokus = true;
  zmena(id ? T("hoistuto", najdi(id).polozka.text || T("prazdnaPolozka")) : T("celyZobrazen"));
}

function klavesaNaRadku(e) {
  const id = e.target.dataset.id;
  const vid = viditelne();
  const poz = vid.findIndex(p => p.id === id);
  const n = najdi(id);
  if (e.ctrlKey || e.metaKey) return;
  const pismeno = { e: "upravit", w: "nahoru", s: "dolu", d: "doprava", a: "doleva", j: "sloucit", h: "hoist" }[e.key.toLowerCase()];
  if (pismeno && !e.altKey) { e.preventDefault(); provedAkci(pismeno, id); return; }
  if (e.key === "." || e.key === ",") {
    e.preventDefault();
    if (n.polozka.deti.length && n.polozka.sbaleno === (e.key === ".")) provedAkci("sbal", id);
    return;
  }
  if (e.altKey && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    e.preventDefault();
    provedAkci({ ArrowUp: "nahoru", ArrowDown: "dolu", ArrowLeft: "doleva", ArrowRight: "doprava" }[e.key], id);
    return;
  }
  switch (e.key) {
    case "ArrowDown": e.preventDefault(); if (vid[poz + 1]) vyber(vid[poz + 1].id); break;
    case "ArrowUp": e.preventDefault(); if (vid[poz - 1]) vyber(vid[poz - 1].id); break;
    case "Home": e.preventDefault(); vyber(vid[0].id); break;
    case "End": e.preventDefault(); vyber(vid[vid.length - 1].id); break;
    case "ArrowRight":
      e.preventDefault();
      if (n.polozka.deti.length && n.polozka.sbaleno) provedAkci("sbal", id);
      else if (n.polozka.deti.length) vyber(n.polozka.deti[0].id);
      break;
    case "ArrowLeft":
      e.preventDefault();
      if (n.polozka.deti.length && !n.polozka.sbaleno) provedAkci("sbal", id);
      else if (n.rodic !== koren && (!hoistId || id !== hoistId)) vyber(n.rodic.id);
      break;
    case "Enter": case "F2": e.preventDefault(); zacitEditaci(id, null, false); break;
    case "Delete": e.preventDefault(); provedAkci("smazat", id); break;
    case "Insert": e.preventDefault(); zapamatuj(); { const p = vlozZa(id, ""); ulozit(); zacitEditaci(p.id, 0, true); } break;
  }
}

// ---------- Vkládací dialog ----------
function vlozitSeznam(nahradit) {
  const nove = rozeberText($("vstup").value);
  if (!nove.length) { hlaseni(T("nicKVlozeni")); return; }
  ukoncitEditaci(false);
  zapamatuj();
  if (nahradit) { koren.deti = nove; hoistId = null; }
  else koreniPohledu().deti.push(...nove);
  vybranyId = nove[0].id;
  $("dlgVlozit").close();
  obnovFokus.chciFokus = true;
  zmena(T("vlozeno", nove.reduce((s, p) => s + 1 + pocetPotomku(p), 0)));
}
function otevritVlozeni(text) {
  $("vstup").value = text || "";
  $("dlgVlozit").showModal();
  $("vstup").focus();
}

// ---------- Jazyk ----------
function prelozit() {
  document.documentElement.lang = jazyk;
  document.title = T("nazev");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T(el.dataset.t); });
  document.querySelectorAll("[data-ta]").forEach(el => { el.setAttribute("aria-label", T(el.dataset.ta)); });
  $("napoveda").innerHTML = T("napoveda");
  $("jazyk").value = jazyk;
}

// ---------- Napojení ----------
$("strom").addEventListener("click", e => {
  const radek = e.target.closest(".radek");
  if (!radek) return;
  const id = radek.dataset.id;
  const akceEl = e.target.closest("[data-akce]");
  if (e.target.closest("input.editace")) return;
  if (akceEl) {
    if (editaceId && editaceId !== id) ukoncitEditaci(false);
    provedAkci(akceEl.dataset.akce, id);
  } else {
    if (editaceId) { ukoncitEditaci(false); vybranyId = id; obnovFokus.chciFokus = true; vykresli(); }
    else vyber(id);
  }
});
$("strom").addEventListener("keydown", e => {
  if (e.target.matches("input.editace")) klavesaVEditaci(e);
  else if (e.target.classList.contains("text")) klavesaNaRadku(e);
}, true);
$("strom").addEventListener("paste", e => { if (e.target.matches("input.editace")) vlozeniDoEditace(e); });
$("strom").addEventListener("focusout", e => {
  if (!e.target.matches("input.editace")) return;
  // fokus odešel mimo pole (Tab, klik jinam) → uložit
  setTimeout(() => {
    if (editaceId && !document.activeElement?.matches("input.editace")) {
      ukoncitEditaci(false);
      vykresli();
    }
  }, 0);
});
$("strom").addEventListener("focusin", e => {
  const r = e.target.closest(".radek");
  if (r && !e.target.matches("input.editace") && r.dataset.id !== vybranyId) vyber(r.dataset.id, false);
});

$("btnVlozit").addEventListener("click", () => otevritVlozeni(""));
$("btnPridat").addEventListener("click", () => {
  ukoncitEditaci(false);
  zapamatuj();
  const k = koreniPohledu();
  const p = novaPolozka("");
  k.deti.push(p);
  k.sbaleno = false;
  ulozit();
  zacitEditaci(p.id, 0, true);
});
$("btnKopTab").addEventListener("click", () => kopiruj(vystupTab()));
$("btnKopMd").addEventListener("click", () => kopiruj(vystupMd()));
$("btnKopCis").addEventListener("click", () => kopiruj(vystupCislovany()));
$("btnKopHier").addEventListener("click", () => kopiruj(vystupHierarchie()));
$("chkCisla").addEventListener("change", e => { zobrazitCisla = e.target.checked; ulozitNastaveni(); ukoncitEditaci(false); vykresli(); });
const nastavSbaleni = hodnota => {
  ukoncitEditaci(false);
  const projdi = p => { if (p.deti.length) p.sbaleno = hodnota; p.deti.forEach(projdi); };
  koreniPohledu().deti.forEach(projdi);
  if (hoistId) koreniPohledu().sbaleno = false;
  zmena(hodnota ? T("sbalitVse") : T("rozbalitVse"));
};
$("btnSbalit").addEventListener("click", () => nastavSbaleni(true));
$("btnRozbalit").addEventListener("click", () => nastavSbaleni(false));
$("btnZpet").addEventListener("click", zpet);
$("btnZnovu").addEventListener("click", znovu);
$("btnSmazatVse").addEventListener("click", () => {
  if (!koren.deti.length || !confirm(T("potvrdSmazatVse"))) return;
  ukoncitEditaci(true);
  zapamatuj();
  koren.deti = [];
  hoistId = null;
  vybranyId = null;
  zmena(T("vymazano"));
});
$("btnSchranka").addEventListener("click", async () => {
  try { $("vstup").value = await navigator.clipboard.readText(); $("vstup").focus(); }
  catch (e) { hlaseni(T("schrankaChyba")); $("vstup").focus(); }
});
$("btnPripojit").addEventListener("click", () => vlozitSeznam(false));
$("btnNahradit").addEventListener("click", () => vlozitSeznam(!!koren.deti.length));
$("btnZavrit").addEventListener("click", () => $("dlgVlozit").close());
$("vstup").addEventListener("keydown", e => {
  // Tab v poli vkládá tabulátor (odsazení), ne přechod fokusu; Ctrl+Enter vloží
  if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey) {
    e.preventDefault();
    const ta = e.target, z = ta.selectionStart;
    ta.setRangeText("\t", z, ta.selectionEnd, "end");
  } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    vlozitSeznam(!!koren.deti.length);
  }
});
$("jazyk").addEventListener("change", e => { jazyk = e.target.value; ulozitNastaveni(); prelozit(); vykresli(); hlaseni(); });

// Ctrl+V mimo editaci → vložit víceřádkový seznam rovnou; Ctrl+Z / Ctrl+Y
document.addEventListener("paste", e => {
  if (e.target.closest("input, textarea, dialog")) return;
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  e.preventDefault();
  const nove = rozeberText(text);
  if (!nove.length) { hlaseni(T("nicKVlozeni")); return; }
  zapamatuj();
  const vid = vybranyId ? najdi(vybranyId) : null;
  if (vid) vid.rodic.deti.splice(vid.index + 1, 0, ...nove);
  else koreniPohledu().deti.push(...nove);
  vybranyId = nove[0].id;
  obnovFokus.chciFokus = true;
  zmena(T("vlozeno", nove.reduce((s, p) => s + 1 + pocetPotomku(p), 0)));
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, dialog")) return;
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    // skok do seznamu na vybranou (jinak první) položku
    const vid = viditelne();
    if (!vid.length) return;
    e.preventDefault();
    vyber(vid.some(p => p.id === vybranyId) ? vybranyId : vid[0].id);
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    if (e.key === "z" || e.key === "Z") { e.preventDefault(); obnovFokus.chciFokus = true; e.shiftKey ? znovu() : zpet(); }
    else if (e.key === "y" || e.key === "Y") { e.preventDefault(); obnovFokus.chciFokus = true; znovu(); }
  }
});

nacist();
$("chkCisla").checked = zobrazitCisla;
prelozit();
vykresli();
hlaseni();
</script>
