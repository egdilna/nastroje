<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archiv</title>
<style>
:root{
  --room:#3d4b52; --room-2:#2c383e;
  --wood:#a8763e; --wood-dark:#7c5527; --wood-light:#c2914f;
  --metal:#8d9599; --metal-2:#6e7679; --metal-3:#aeb5b8;
  --ink:#1d2225; --paper:#f3efe4; --label:#fbf8ee;
  --focus:#ffd23f; --chrome:#e8e4d8; --muted:#a9b2b7;
  --warn:#ffb3a0; --ok:#8be0a8;
  --mono:"Courier New",ui-monospace,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--chrome);
  background:radial-gradient(ellipse at 50% 0%,var(--room) 0%,var(--room-2) 70%);
  background-attachment:fixed;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ---------- chrome ---------- */
header{padding:12px 20px 10px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.2)}
.brand{font-family:var(--mono);letter-spacing:.22em;text-transform:uppercase;font-size:12px;opacity:.7}
.hdr-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
nav.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14px}
nav.crumbs button{font:inherit;color:inherit;background:none;border:0;padding:4px 6px;border-radius:4px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.28)}
nav.crumbs button:hover{background:rgba(255,255,255,.08)}
nav.crumbs .sep{opacity:.4}
nav.crumbs .here{opacity:.95;font-weight:600;padding:4px 6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools label{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}

main{flex:1;padding:22px 20px 40px;display:flex;flex-direction:column;align-items:center}
.stage{width:100%;max-width:1080px}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
h2{font-size:16px;margin:26px 0 10px;font-weight:600}
h3{font-size:14px;margin:0 0 6px;font-weight:600}
.hint{font-size:13px;opacity:.62;margin:0 0 18px}
.muted{opacity:.62}

footer{padding:9px 20px;font-size:12px;opacity:.6;border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.24);text-align:center;font-family:var(--mono)}
kbd{font-family:var(--mono);border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:0 4px}

.status{font-size:13px;padding:7px 12px;border-left:4px solid rgba(255,255,255,.25);background:rgba(0,0,0,.22);border-radius:0 4px 4px 0;margin:0 0 16px}
.status.err{border-left-color:var(--warn);color:var(--warn)}
.status.ok{border-left-color:var(--ok)}
.status:empty{display:none}

/* ---------- tlačítka a formuláře ---------- */
button.b{
  font:inherit;font-size:14px;padding:7px 12px;border-radius:5px;cursor:pointer;
  background:rgba(255,255,255,.1);color:var(--chrome);border:1px solid rgba(255,255,255,.28);
  margin:0 6px 6px 0;
}
button.b:hover{background:rgba(255,255,255,.18)}
button.b.primary{background:#d9ac16;color:#241f05;border-color:#c39c12;font-weight:600}
button.b.danger{border-color:rgba(255,150,130,.5);color:#ffcfc4}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.b.small{font-size:12.5px;padding:4px 8px}
a.b{font:inherit;font-size:14px;padding:7px 12px;border-radius:5px;display:inline-block;
  text-decoration:none;background:rgba(255,255,255,.1);color:var(--chrome);
  border:1px solid rgba(255,255,255,.28);margin:0 6px 6px 0}
a.b:hover{background:rgba(255,255,255,.18)}
a.b:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sheet-actions a.b{background:rgba(0,0,0,.08);color:#22262a;border-color:rgba(0,0,0,.35)}
.sheet-actions a.b:hover{background:rgba(0,0,0,.16)}
.bar{margin:0 0 18px}

fieldset{border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:14px 16px;margin:0 0 18px;background:rgba(0,0,0,.18)}
legend{padding:0 6px;font-weight:600;font-size:14px}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:13.5px}
input[type=text],input[type=password],input[type=search],textarea,select{
  width:100%;padding:7px 8px;border-radius:4px;font:inherit;font-size:14px;
  background:rgba(255,255,255,.94);color:#1b1f22;border:1px solid rgba(0,0,0,.35);
}
textarea{min-height:70px;resize:vertical}
input[type=file]{font:inherit;font-size:13px}
.fhint{font-size:12.5px;opacity:.6;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}

pre#log{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:10px;max-height:24rem;overflow:auto;font-size:12.5px;font-family:var(--mono)}

/* ---------- společné pro položky ---------- */
[data-item]{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;display:block;position:relative;border-radius:3px;width:100%;text-align:left}
[data-item]:focus{outline:none}
[data-item]:focus-visible .surface,[data-item].kbfocus .surface{outline:3px solid var(--focus);outline-offset:3px}
.surface{transition:transform .16s ease}
[data-item]:hover .surface{transform:translateY(-3px)}
button.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.crumbs button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.tiles{list-style:none;margin:0;padding:0;display:grid;gap:24px}
.tiles.cabs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tiles.fold{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tiles.docs{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.tiles li{margin:0}
.spravabtns{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}

/* ---------- kartotéční skříně ---------- */
.cabinet{
  width:100%;height:228px;border-radius:6px 6px 3px 3px;position:relative;overflow:hidden;
  background:linear-gradient(100deg,var(--metal-3) 0%,var(--metal) 38%,var(--metal-2) 100%);
  box-shadow:0 14px 22px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.5);
  padding:8px 8px 12px;display:flex;flex-direction:column;gap:7px;
}
.cab-plate{
  color:var(--ink);font-family:var(--mono);font-size:12.5px;text-transform:uppercase;
  letter-spacing:.05em;text-align:center;padding:6px 4px;border:1px solid rgba(0,0,0,.3);
  border-radius:2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);line-height:1.25;
  background:var(--label);
}
.drawer{flex:1;background:linear-gradient(180deg,#9aa2a6,#7d858a);border-radius:2px;border-top:1px solid rgba(255,255,255,.55);box-shadow:0 2px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;position:relative}
.drawer::after{content:"";width:44%;height:9px;border-radius:5px;background:linear-gradient(180deg,#dfe3e5,#8f979b);box-shadow:0 1px 2px rgba(0,0,0,.45)}
.cab-count{position:absolute;right:10px;bottom:9px;font-family:var(--mono);font-size:11px;color:#20262a;opacity:.7}

/* ---------- regál ---------- */
.rack{background:linear-gradient(180deg,var(--wood-light),var(--wood) 40%,var(--wood-dark));padding:16px;border-radius:5px;box-shadow:0 18px 30px rgba(0,0,0,.45), inset 0 0 0 3px rgba(0,0,0,.15)}
.shelf{position:relative;padding:0 10px 14px}
.shelf + .shelf{margin-top:8px}
.shelf-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin:0 0 4px 2px}
.shelf-name{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#3a2711;opacity:.8;margin:0}
.shelf-head button.b{background:rgba(0,0,0,.22);border-color:rgba(0,0,0,.3);color:#2b1d08;margin:0}
.shelf-head button.b:hover{background:rgba(0,0,0,.32)}
.shelf-row{display:flex;align-items:flex-end;gap:5px;min-height:186px;padding:0 6px 0 10px;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0) 26%);overflow-x:auto;list-style:none;margin:0}
.shelf-row li{margin:0}
.shelf-board{height:12px;border-radius:2px;background:linear-gradient(180deg,#d7a660,var(--wood-dark));box-shadow:0 5px 8px rgba(0,0,0,.4)}
.shelf-empty{font-family:var(--mono);font-size:12px;color:#3a2711;opacity:.75;align-self:center;padding:0 8px}
.binder{width:44px;border-radius:2px 4px 4px 2px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 7px rgba(0,0,0,.4), inset -6px 0 10px rgba(0,0,0,.25), inset 2px 0 0 rgba(255,255,255,.25);padding:14px 0}
.binder::before,.binder::after{content:"";position:absolute;left:5px;right:5px;height:5px;background:linear-gradient(180deg,#e9edef,#9aa1a5);border-radius:1px;opacity:.85}
.binder::before{top:9px}
.binder::after{bottom:9px}
.binder-label{background:var(--label);color:var(--ink);border:1px solid rgba(0,0,0,.25);writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:8px 3px;max-height:96px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.binder-tools{display:flex;flex-direction:column;gap:3px;margin-top:6px;align-items:center}
.binder-tools button.b{margin:0;font-size:11px;padding:2px 5px}

/* ---------- desky ---------- */
.folder{position:relative;min-height:152px;border-radius:2px 6px 4px 4px;box-shadow:0 8px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.12);padding:26px 12px 12px;color:#2a2a24}
.folder-tab{position:absolute;top:-13px;left:0;height:15px;border-radius:4px 8px 0 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.folder-name{font-family:var(--mono);font-size:13px;line-height:1.35;font-weight:700;border-bottom:1px dashed rgba(0,0,0,.28);padding-bottom:6px}
.folder-meta{font-family:var(--mono);font-size:11px;opacity:.65;margin-top:8px}

/* ---------- dokumenty ---------- */
.doc{background:var(--paper);color:#22262a;min-height:152px;border-radius:2px;box-shadow:0 8px 14px rgba(0,0,0,.35);padding:14px 12px;position:relative;overflow:hidden}
.doc::before{content:"";position:absolute;top:0;right:0;border-width:0 22px 22px 0;border-style:solid;border-color:transparent var(--room-2) transparent transparent;opacity:.32}
.doc-icon{font-size:22px;line-height:1}
.doc-name{font-family:var(--mono);font-size:12.5px;margin-top:10px;font-weight:700;line-height:1.35;word-break:break-word}
.doc-meta{font-family:var(--mono);font-size:11px;opacity:.62;margin-top:6px;word-break:break-all}
.doc.odkaz{background:linear-gradient(150deg,#eef3f8 0%,var(--paper) 55%)}
.doc.odkaz::after{content:"";position:absolute;left:-14px;top:12px;width:34px;height:12px;
  border:2px solid #9aa7b3;border-radius:8px;transform:rotate(-38deg);opacity:.75}
.sheet a.url{color:#0b4f9e;word-break:break-all}
.doc-flag{font-family:var(--mono);font-size:11px;margin-top:6px;color:#7a2408;font-weight:700}

/* ---------- detail souboru ---------- */
.sheet{background:var(--paper);color:#22262a;border-radius:3px;box-shadow:0 12px 22px rgba(0,0,0,.4);padding:22px 22px 18px;position:relative;overflow:hidden;max-width:640px}
.sheet::before{content:"";position:absolute;top:0;right:0;border-width:0 34px 34px 0;border-style:solid;border-color:transparent var(--room-2) transparent transparent;opacity:.3}
.sheet h1{font-family:var(--mono);font-size:17px;margin:0 0 4px;word-break:break-word}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:14px 0 0;font-size:13.5px}
.sheet dt{font-weight:700;opacity:.6}
.sheet dd{margin:0;font-family:var(--mono)}
.sheet .popis{margin:10px 0 0;font-size:14px;line-height:1.5}
.sheet-actions{margin-top:18px;border-top:1px dashed rgba(0,0,0,.3);padding-top:14px}
.sheet-actions button.b{background:rgba(0,0,0,.08);color:#22262a;border-color:rgba(0,0,0,.35)}
.sheet-actions button.b:hover{background:rgba(0,0,0,.16)}
.sheet-actions button.b.danger{color:#7a2408;border-color:rgba(122,36,8,.5)}
.sheet-actions label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;margin:0 0 10px}
.sheet .chyba{color:#7a2408;font-weight:700;font-size:13px;margin:10px 0 0}

/* ---------- nesrovnalosti a volné listy ---------- */
.tray{border:1px solid rgba(255,179,160,.55);border-left-width:5px;border-radius:5px;padding:12px 16px;margin:26px 0 0;background:rgba(0,0,0,.2)}
.tray h2{margin:0 0 6px;color:var(--warn)}
.tray ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.tray li{border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:9px 12px;background:rgba(0,0,0,.18)}
.tray .nm{font-family:var(--mono);font-size:13.5px;font-weight:700}
.tray .mt{font-size:12.5px;opacity:.65;margin:2px 0 6px}

/* ---------- hledání ---------- */
.vysledky{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.vysledky li{margin:0}
.res{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:10px 13px}
.res .nm{font-family:var(--mono);font-size:14px;font-weight:700}
.res .cesta{font-size:12.5px;opacity:.65;margin-top:3px}
.res .pop{font-size:13px;margin-top:5px;opacity:.85}

/* ---------- štítky ---------- */
.stitky{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.stitky.radek{flex-wrap:nowrap;overflow:hidden}
.stitek{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:11px;
  line-height:1.6;padding:1px 8px 1px 6px;border-radius:3px 9px 9px 3px;
  border:1px solid rgba(0,0,0,.28);box-shadow:0 1px 2px rgba(0,0,0,.25);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.stitek::before{content:"";width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.4);flex:none}
.stitek.vic{background:rgba(255,255,255,.16);color:var(--chrome);border-color:rgba(255,255,255,.3);box-shadow:none}
.stitky.tmave .stitek.vic{background:rgba(0,0,0,.1);color:#2a2a24;border-color:rgba(0,0,0,.28)}
.stitek.vic::before{display:none}
button.stitek{cursor:pointer;font-family:var(--sans);font-size:11px;margin:0}
.stitek-volba{display:inline-flex;align-items:center;gap:6px;margin:0 14px 9px 0;font-weight:400;cursor:pointer}
.stitek-volba input{width:auto;margin:0}
.stitek-radek{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.stitek-radek:first-of-type{border-top:0}
.pasky{position:absolute;left:5px;right:5px;bottom:18px;display:flex;gap:2px;height:5px}
.pasek{flex:1;border-radius:1px;box-shadow:0 1px 1px rgba(0,0,0,.3)}

/* ---------- lepicí papírky ---------- */
.postit-list{display:flex;flex-wrap:wrap;gap:16px;margin:18px 0 0;padding:0;list-style:none}
.postit{width:160px;min-height:120px;padding:18px 13px 13px;position:relative;color:#2a2a24;
  box-shadow:2px 5px 9px rgba(0,0,0,.3);font-size:13.5px;line-height:1.45}
.postit:nth-child(odd){transform:rotate(-1.4deg)}
.postit:nth-child(even){transform:rotate(1.2deg)}
.postit .pas{position:absolute;left:0;right:0;top:0;height:11px;opacity:.6}
.postit .txt{display:block;white-space:pre-wrap;word-break:break-word}
.postit .kdy{display:block;margin-top:10px;font-family:var(--mono);font-size:10.5px;opacity:.55}
.postit .nastroje{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px}
.postit button.b{background:rgba(0,0,0,.09);color:#2a2a24;border-color:rgba(0,0,0,.32);
  font-size:11px;padding:2px 7px;margin:0}
.postit button.b:hover{background:rgba(0,0,0,.17)}
.postit button.b.danger{color:#7a2408;border-color:rgba(122,36,8,.45)}
.doc-postit{position:absolute;right:9px;bottom:9px;width:21px;height:21px;border-radius:1px;
  box-shadow:1px 2px 4px rgba(0,0,0,.32);transform:rotate(-7deg)}

.badge-num{display:inline-block;min-width:17px;padding:0 4px;margin-left:6px;border-radius:9px;
  background:#c9503a;color:#fff;font-size:11px;line-height:17px;text-align:center}

/* ---------- náhled obsahu ---------- */
.nahled{background:var(--paper);color:#22262a;border-radius:3px;box-shadow:0 12px 22px rgba(0,0,0,.4);
  padding:24px 26px;margin:22px 0 0;max-width:760px;overflow:hidden}
.nahled > h2{margin:0 0 14px;font-size:13px;font-family:var(--mono);text-transform:uppercase;
  letter-spacing:.16em;opacity:.55;border-bottom:1px dashed rgba(0,0,0,.25);padding-bottom:8px}
.md{font-size:15px;line-height:1.6}
.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.4em 0 .5em;font-weight:700}
.md h3{font-size:1.35em;border-bottom:1px solid rgba(0,0,0,.18);padding-bottom:.2em}
.md h4{font-size:1.15em}
.md h5{font-size:1em}
.md h6{font-size:.92em;opacity:.75}
.md > *:first-child{margin-top:0}
.md p{margin:0 0 1em}
.md ul,.md ol{margin:0 0 1em;padding-left:1.6em}
.md li{margin:.25em 0}
.md li > ul,.md li > ol{margin:.3em 0}
.md li.ukol{list-style:none;margin-left:-1.35em}
.md li.ukol > input{margin-right:.45em}
.md blockquote{margin:0 0 1em;padding:.3em 0 .3em 1em;border-left:4px solid rgba(0,0,0,.25);
  color:#3c4147;font-style:italic}
.md pre{background:rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.15);border-radius:4px;
  padding:12px 14px;overflow-x:auto;margin:0 0 1em}
.md pre code{font-family:var(--mono);font-size:13px;background:none;padding:0;border:0}
.md code{font-family:var(--mono);font-size:.9em;background:rgba(0,0,0,.08);
  border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:.05em .35em}
.md a{color:#0b4f9e}
.md hr{border:0;border-top:1px solid rgba(0,0,0,.25);margin:1.6em 0}
.md img{max-width:100%;height:auto;border-radius:2px}
.md table{border-collapse:collapse;margin:0 0 1em;width:100%;font-size:.94em}
.md th,.md td{border:1px solid rgba(0,0,0,.22);padding:.4em .6em;text-align:left}
.md th{background:rgba(0,0,0,.06);font-weight:700}
.md td.vpravo,.md th.vpravo{text-align:right}
.md td.stred,.md th.stred{text-align:center}
.md ins{background:#d6f0d2;text-decoration:none;border-bottom:2px solid #4a9a45;padding:0 .1em}
.md del{background:#f6d6d2;color:#7a2408;padding:0 .1em}
.md mark{background:#ffe98a;padding:0 .15em}
.md .cm-pozn{display:inline-block;background:#fdf07a;border:1px solid #d9c34a;border-radius:3px;
  padding:.05em .45em;font-size:.88em;box-shadow:1px 1px 2px rgba(0,0,0,.18)}
.nahled-media{display:block;max-width:100%;border-radius:2px}
img.nahled-media{max-height:70vh;margin:0 auto}
video.nahled-media{max-height:70vh;background:#000}
audio.nahled-media{width:100%}
.nahled-chyba{color:#7a2408;font-size:13.5px;margin:0}
.nahled button.b{background:rgba(0,0,0,.08);color:#22262a;border-color:rgba(0,0,0,.35)}
.nahled button.b:hover{background:rgba(0,0,0,.16)}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.cabinet{height:190px}}
</style>
</head>
<body>

<header>
  <div class="brand">Archiv</div>
  <div class="hdr-row">
    <nav class="crumbs" id="crumbs" aria-label="Cesta v archivu"></nav>
    <div class="tools">
      <label><input type="checkbox" id="sprava"> Správa</label>
      <button type="button" class="b" id="btn-obnovit">Obnovit</button>
      <button type="button" class="b" id="btn-hledat">Hledat</button>
      <button type="button" class="b" id="btn-nastaveni" aria-label="Nastavení a ladicí výpis">&#9881;</button>
    </div>
  </div>
</header>

<main>
  <div class="stage">
    <div class="status" id="stav" role="status" aria-live="polite"></div>
    <div id="stage"></div>

/* ================= pomocné ================= */

function el(id){ return document.getElementById(id); }

var logText = "";
function log(text){
  logText += "[" + new Date().toLocaleTimeString("cs-CZ") + "] " + text + "\n";
  var p = el("log");
  if (p){ p.textContent = logText; p.scrollTop = p.scrollHeight; }

function stav(text, typ){

function oznam(text){
  var l = el("live");
  l.textContent = "";
  setTimeout(function(){ l.textContent = text; }, 60);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

function velikost(b){
  if (b === null || b === undefined) return "neznámá";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1).replace(".",",") + " kB";
  return (b/1048576).toFixed(1).replace(".",",") + " MB";
}

function datum(iso){
  if (!iso) return "neuvedeno";
  var d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString("cs-CZ");
}

function pripona(nazev){
  var i = nazev.lastIndexOf(".");
  return i > 0 ? nazev.slice(i+1).toLowerCase() : "";
}
function mime(nazev){ return MIME[pripona(nazev)] || "application/octet-stream"; }
function textovy(nazev){
  return /^(txt|md|markdown|csv|tsv|json|xml|html|htm|css|js|mjs|yml|yaml|ini|cfg|conf|log|sql|py|sh|bat|svg|rst|adoc|tex)$/
    .test(pripona(nazev));
}

var IKONY = {
  dok:{ ikona:"\uD83D\uDCC4", nazev:"textový dokument", ext:/^(txt|md|markdown|rtf|odt|docx|doc|rst|adoc|tex)$/ },
  tab:{ ikona:"\u25A6",       nazev:"tabulka",          ext:/^(csv|tsv|xlsx|xls|ods)$/ },
  obr:{ ikona:"\uD83D\uDDBC", nazev:"obrázek",          ext:/^(png|jpg|jpeg|gif|svg|webp|bmp|tif|tiff)$/ },
  pdf:{ ikona:"\uD83D\uDCD5", nazev:"PDF",              ext:/^(pdf)$/ },
  dat:{ ikona:"\uD83D\uDDC2", nazev:"datový záznam",    ext:/^(json|xml|yml|yaml|sql|jsondb|puml|opml)$/ },
  bal:{ ikona:"\uD83D\uDCE6", nazev:"balíček",          ext:/^(zip|gz|tar|7z|rar)$/ },
  kod:{ ikona:"\u2328",       nazev:"zdrojový kód",     ext:/^(js|mjs|py|sh|bat|css|html|htm|php|java|ts)$/ },
  pre:{ ikona:"\uD83D\uDCFD", nazev:"prezentace",       ext:/^(pptx|ppt|odp)$/ }
};
function jeOdkaz(f){ return !!f && f.type === "odkaz"; }

var TYP_ODKAZ = { ikona:"\uD83D\uDD17", nazev:"odkaz na web" };

function typZaznamu(f){ return jeOdkaz(f) ? TYP_ODKAZ : typSouboru(f.name); }

function platnaUrl(u){
  return /^https?:\/\//i.test(String(u || "").trim());
}

function hostZUrl(u){
  try{ return new URL(u).host; }catch(e){ return String(u || ""); }
}

function typSouboru(nazev){
  var e = pripona(nazev);
  for (var k in IKONY){ if (IKONY[k].ext.test(e)) return IKONY[k]; }
  return { ikona:"\uD83D\uDCCE", nazev:"soubor" };
}

function pluralCz(n, a, b, c){ return n === 1 ? a : (n >= 2 && n <= 4 ? b : c); }
function pocetSlov(n, zaklad){
  if (zaklad === "sanon")  return n + " " + pluralCz(n,"šanon","šanony","šanonů");
  if (zaklad === "police") return n + " " + pluralCz(n,"police","police","polic");
  if (zaklad === "desky")  return n + " " + pluralCz(n,"desky","desky","desek");
  return n + " " + pluralCz(n,"soubor","soubory","souborů");
}

function hash(s){
  var h = 0;
  for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) & 0x7fffffff; }
  return h;
}

function normCesta(s){
  return String(s || "").trim().replace(/^\/+|\/+$/g,"").replace(/\/{2,}/g,"/");
}
function casti(c){ c = normCesta(c); return c ? c.split("/") : []; }
function hloubka(c){ return casti(c).length; }
function posledni(c){ var u = casti(c); return u.length ? u[u.length-1] : ""; }
function rodic(c){ var u = casti(c); u.pop(); return u.join("/"); }

/* base64 */
function bytesNaBase64(bytes){
  var bin = "", chunk = 0x8000;
  for (var i=0;i<bytes.length;i+=chunk){ bin += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function base64NaBytes(b64){
  var bin = atob(String(b64).replace(/\s+/g,""));
  var out = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function textNaBase64(t){ return bytesNaBase64(new TextEncoder().encode(t)); }

function doB64url(text){
  return textNaBase64(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function zB64url(s){
  var t = String(s).replace(/-/g, "+").replace(/_/g, "/");
  while (t.length % 4) t += "=";
  return new TextDecoder().decode(base64NaBytes(t));
}

/* ================= konfigurace ================= */

function normSlozka(s){ return String(s || "").trim().replace(/^\/+/,"").replace(/\/+$/,""); }

function nactiCfg(){
  try{
    var u = JSON.parse(localStorage.getItem(KLIC) || "{}");
    cfg.repo = u.repo || ""; cfg.vetev = u.vetev || "";
    cfg.slozka = u.slozka || ""; cfg.token = u.token || "";
  }catch(e){ log("Uložené nastavení se nepodařilo přečíst: " + e.message); }

  var q = new URL(location.href).searchParams, zUrl = false;

  var a = q.get("a");
  if (a){
    try{
      var v = JSON.parse(zB64url(a));
      if (v && typeof v === "object"){
        if (v.r){ cfg.repo = String(v.r).trim(); zUrl = true; }
        if (v.b){ cfg.vetev = String(v.b).trim(); zUrl = true; }
        if (typeof v.f === "string"){ cfg.slozka = normSlozka(v.f); zUrl = true; }
        if (v.c) cilZUrl = { cesta: normCesta(v.c) };
        if (v.n) cilZUrl = { nazev: String(v.n) };
      }
    }catch(e){ log("Parametr adresy se nepodařilo přečíst: " + e.message); }
  }

  /* starší tvar adresy zůstává funkční */
  if (q.get("repo")){ cfg.repo = q.get("repo").trim(); zUrl = true; }
  if (q.get("branch")){ cfg.vetev = q.get("branch").trim(); zUrl = true; }
  if (q.get("vetev")){ cfg.vetev = q.get("vetev").trim(); zUrl = true; }
  if (q.get("folder") !== null){ cfg.slozka = normSlozka(q.get("folder")); zUrl = true; }
  if (q.get("slozka") !== null){ cfg.slozka = normSlozka(q.get("slozka")); zUrl = true; }
  if (zUrl) log("Nastavení bylo částečně převzato z adresy.");
}

function cilOffline(){
  try{
    var a = new URL(location.href).searchParams.get("a");
    if (!a) return;
    var v = JSON.parse(zB64url(a));
    if (v && v.n) cilZUrl = { nazev: String(v.n) };
    else if (v && v.c) cilZUrl = { cesta: normCesta(v.c) };
  }catch(e){ log("Parametr adresy se nepodařilo přečíst: " + e.message); }
}

/* Otevře entitu, na kterou míří adresa. */
function otevriCilZUrl(){
  if (!cilZUrl) return false;
  var c = cilZUrl;
  cilZUrl = null;
  if (c.nazev){
    if (najdi(c.nazev)){ pohled = { typ:"soubor", cesta:"", nazev:c.nazev }; return true; }
    stav("Položka " + c.nazev + " v tomto archivu není.", "err");
    return false;
  }
  if (c.cesta){
    var cil = c.cesta;
    if (!najdiUzel(cil)){
      stav("Umístění " + cil + " v tomto archivu není.", "err");
      return false;
    }
    if (hloubka(cil) === 2) cil = rodic(cil);
    pohled = { typ:"uroven", cesta:cil, nazev:"" };
    return true;
  }
  return false;
}

function ulozCfgZFormulare(){
  cfg.repo = el("cfg-repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");
  cfg.vetev = el("cfg-vetev").value.trim();
  cfg.slozka = normSlozka(el("cfg-slozka").value);
  cfg.token = el("cfg-token").value.trim();
  try{
    localStorage.setItem(KLIC, JSON.stringify(cfg));
    stav("Nastavení uloženo.", "ok");
  }catch(e){ stav("Nastavení se nepodařilo uložit: " + e.message, "err"); }
  el("cfg-odkaz").value = sestavOdkaz();
  nastavTitulek();
}

/* Adresa archivu, volitelně i s konkrétní entitou. Token v ní nikdy není. */
function sestavOdkaz(sPohledem){
  var d = {};
  if (!OFFLINE){
    if (cfg.repo) d.r = cfg.repo;
    if (cfg.vetev) d.b = cfg.vetev;
    if (cfg.slozka) d.f = cfg.slozka;
  }
  if (sPohledem){
    var p = (pohled.typ === "hledani" || pohled.typ === "nastaveni") ? (predchozi || pohled) : pohled;
    if (p.typ === "soubor" && p.nazev) d.n = p.nazev;
    else if (p.cesta) d.c = normCesta(p.cesta);
  }
  var z = location.origin + location.pathname;
  var klicu = 0, k;
  for (k in d){ if (Object.prototype.hasOwnProperty.call(d, k)) klicu++; }
  return klicu ? (z + "?a=" + doB64url(JSON.stringify(d))) : z;
}

/* Adresní řádek vždy ukazuje na to, co je právě otevřené. */
function zapisAdresu(){
  try{ history.replaceState(null, "", sestavOdkaz(true)); }
  catch(e){ /* například u file:// to prohlížeč nedovolí */ }
}

function nazevArchivu(){
  if (metadata && metadata.title) return metadata.title;
  return "Archiv";
}

function nastavTitulek(){
  var n = nazevArchivu();
  document.title = OFFLINE ? (n + " (offline kopie)") : n;
  var br = document.querySelector(".brand");
  if (br) br.textContent = OFFLINE ? (n + " \u00b7 offline kopie") : n;
}

function ulozNazev(){
  if (!kontrola(true)) return;
  if (!metadata){ stav("Nejprve načtěte nebo založte folder.json.", "err"); return; }
  var puvodni = metadata.title;
  metadata.title = el("cfg-nazev").value.trim();
  ulozMetadata("Změna názvu archivu").then(function(){
    stav("Název archivu byl uložen.", "ok");
    nastavTitulek();
    oznam("Název uložen");
  }).catch(function(e){
    metadata.title = puvodni;
    stav("Uložení názvu se nezdařilo: " + e.message, "err");
  });
}

/* ================= GitHub API ================= */

function cestaKSouboru(nazev){ return cfg.slozka ? cfg.slozka + "/" + nazev : nazev; }
function encCesta(nazev){ return cestaKSouboru(nazev).split("/").map(encodeURIComponent).join("/"); }
function refParam(){ return cfg.vetev ? "?ref=" + encodeURIComponent(cfg.vetev) : ""; }

function api(cesta, volby){
  volby = volby || {};
  var h = { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" };
  if (cfg.token) h["Authorization"] = "Bearer " + cfg.token;
  if (volby.body) h["Content-Type"] = "application/json";
  return fetch("https://api.github.com" + cesta, {
    method: volby.method || "GET", headers: h,
    body: volby.body ? JSON.stringify(volby.body) : undefined
  }).then(function(r){
    return r.text().then(function(t){
      var data = null;
      try{ data = t ? JSON.parse(t) : null; }catch(e){ data = null; }
      if (!r.ok){
        var chyba = new Error((data && data.message) ? data.message : ("HTTP " + r.status));
        chyba.status = r.status;
        throw chyba;
      }
      return data;
    });
  });
}

function kontrola(potrebaToken){
  if (!cfg.repo){ stav("Není vyplněn repozitář. Doplňte jej v nastavení.", "err"); return false; }
  if (potrebaToken && !cfg.token){ stav("Pro zápis je potřeba přístupový token.", "err"); return false; }
  return true;
}

function ziskejSoubor(nazev){ return api("/repos/" + cfg.repo + "/contents/" + encCesta(nazev) + refParam()); }

function ulozSoubor(nazev, base64, zprava, sha){
  var telo = { message: zprava, content: base64 };
  if (cfg.vetev) telo.branch = cfg.vetev;
  if (sha) telo.sha = sha;
  return api("/repos/" + cfg.repo + "/contents/" + encCesta(nazev), { method:"PUT", body: telo });
}

/* ================= metadata ================= */

function nacti(zachovatPohled){
  if (!kontrola(false)){ vykresli(); return; }
  stav("Načítám archiv.");
  var url = "/repos/" + cfg.repo + "/contents/" +
            (cfg.slozka ? cfg.slozka.split("/").map(encodeURIComponent).join("/") : "") + refParam();

  api(url).then(function(p){
    shaMapa = {}; velikostiRepo = {};
    if (Array.isArray(p)){
      p.forEach(function(x){ if (x.type === "file"){ shaMapa[x.name] = x.sha; velikostiRepo[x.name] = x.size; } });
    }
    log("Ve složce nalezeno " + Object.keys(shaMapa).length + " souborů.");
    return ziskejSoubor("folder.json").then(function(d){
      metaSha = d.sha;
      metadata = JSON.parse(new TextDecoder().decode(base64NaBytes(d.content)));
      if (!metadata || !Array.isArray(metadata.files)) metadata = { files: [] };
      if (!Array.isArray(metadata.nodes)) metadata.nodes = [];
      if (!Array.isArray(metadata.tags)) metadata.tags = [];
      if (typeof metadata.title !== "string") metadata.title = "";
      doplnUzly();
      nacteno = true;
      if (!zachovatPohled) pohled = { typ:"kartoteky", cesta:"", nazev:"" };
      stav(cfg.token ? "Archiv načten." : "Archiv načten. Bez tokenu jej lze jen prohlížet.", "ok");
      otevriCilZUrl();
      vykresli();
    }).catch(function(e){
      if (e.status === 404){
        metadata = null; metaSha = null; nacteno = true;
        stav("Ve složce chybí folder.json.", "err");
        vykresli();
      } else throw e;
    });
  }).catch(function(e){
    nacteno = true;
    stav("Načtení se nezdařilo: " + e.message, "err");
    if (e.status === 404) log("Zkontrolujte repozitář, větev a cestu ke složce.");
    if (e.status === 401 || e.status === 403) log("Zkontrolujte platnost tokenu a jeho oprávnění.");
    vykresli();
  });
}

/* doplní chybějící uzly podle cest souborů (migrace starých dat) */
function doplnUzly(){
  var mam = {};
  metadata.nodes.forEach(function(u){ mam[normCesta(u.path)] = true; });
  var pridano = 0;
  metadata.files.forEach(function(f){
    var u = casti(f.folder);
    var akt = [];
    for (var i=0;i<u.length && i<4;i++){
      akt.push(u[i]);
      var c = akt.join("/");
      if (!mam[c]){
        mam[c] = true; pridano++;
        metadata.nodes.push({ path:c, color:autoBarva(c), description:"",
                              created:new Date().toISOString(), updated:new Date().toISOString() });
      }
    }
  });
  if (pridano) log("Doplněno " + pridano + " uzlů struktury podle cest souborů.");
}

function autoBarva(cesta){
  var h = hloubka(cesta);
  if (h === 2) return "";
  var n = posledni(cesta);
  if (h === 4) return BARVY6[hash(n) % BARVY6.length].id;
  return BARVY12[hash(n) % BARVY12.length].id;
}

function zalozMetadata(){
  if (!kontrola(true)) return;
  if (!confirm("Založit nový soubor folder.json ve zvolené složce?")) return;
  var prazdne = { version:1, folder:cfg.slozka, title:"", tags:[], nodes:[], files:[] };
  ulozSoubor("folder.json", textNaBase64(JSON.stringify(prazdne, null, 2)), "Založení folder.json", metaSha || undefined)
    .then(function(){ stav("folder.json byl založen.", "ok"); nacti(); })
    .catch(function(e){ stav("Založení se nezdařilo: " + e.message, "err"); });
}

function ulozMetadata(zprava){
  metadata.version = 1;
  metadata.folder = cfg.slozka;
  metadata.updated = new Date().toISOString();
  return ulozSoubor("folder.json", textNaBase64(JSON.stringify(metadata, null, 2)), zprava, metaSha)
    .then(function(d){ metaSha = d.content.sha; return d; });
}

function najdi(nazev){
  if (!metadata) return null;
  for (var i=0;i<metadata.files.length;i++){ if (metadata.files[i].name === nazev) return metadata.files[i]; }
  return null;
}

/* ================= dotazy nad strukturou ================= */

function uzly(){ return (metadata && metadata.nodes) ? metadata.nodes : []; }

function najdiUzel(cesta){
  cesta = normCesta(cesta);
  var s = uzly();
  for (var i=0;i<s.length;i++){ if (normCesta(s[i].path) === cesta) return s[i]; }
  return null;
}

function potomci(cesta){
  cesta = normCesta(cesta);
  var h = hloubka(cesta) + 1;
  return uzly().filter(function(u){
    var p = normCesta(u.path);
    return hloubka(p) === h && rodic(p) === cesta;
  }).sort(function(a,b){ return posledni(a.path).localeCompare(posledni(b.path), "cs"); });
}

function souboryV(cesta, vcetnePodrizenych){
  cesta = normCesta(cesta);
  if (!metadata) return [];
  return metadata.files.filter(function(f){
    var c = normCesta(f.folder);
    if (vcetnePodrizenych) return cesta === "" ? true : (c === cesta || c.indexOf(cesta + "/") === 0);
    return c === cesta;
  }).sort(function(a,b){ return a.name.localeCompare(b.name, "cs"); });
}

function pocetPod(cesta, h){
  cesta = normCesta(cesta);
  return uzly().filter(function(u){
    var p = normCesta(u.path);
    return hloubka(p) === h && (cesta === "" ? true : p.indexOf(cesta + "/") === 0);
  }).length;
}

/* Umístění po úrovních. Police se vypisuje jen tehdy, když v ní položka leží přímo. */
function popisUmisteni(cesta){
  var u = casti(cesta);
  if (!u.length) return "volně v archivu";
  var out = [];
  for (var i = 0; i < u.length; i++){
    if (i === 1 && i !== u.length - 1) continue;
    out.push((UROVNE[i] || "podsložka") + " " + u[i]);
  }
  return out.join(" \u00b7 ");
}

function barvaUzlu(cesta){
  var u = najdiUzel(cesta);
  var id = u && u.color ? u.color : autoBarva(cesta);
  var sada = hloubka(cesta) === 4 ? BARVY6 : BARVY12;
  for (var i=0;i<sada.length;i++){ if (sada[i].id === id) return sada[i]; }
  return sada[0];
}

function stitkySeznam(){ return (metadata && Array.isArray(metadata.tags)) ? metadata.tags : []; }

function najdiStitek(id){
  var s = stitkySeznam();
  for (var i=0;i<s.length;i++){ if (s[i].id === id) return s[i]; }
  return null;
}

function stitkyObj(ids){
  if (!Array.isArray(ids)) return [];
  return ids.map(najdiStitek).filter(function(x){ return !!x; });
}

function barvaZ12(id){
  for (var i=0;i<BARVY12.length;i++){ if (BARVY12[i].id === id) return BARVY12[i]; }
  return BARVY12[0];
}

function postitBarva(id){
  for (var i=0;i<BARVYPOSTIT.length;i++){ if (BARVYPOSTIT[i].id === id) return BARVYPOSTIT[i]; }
  return BARVYPOSTIT[0];
}

/* max = kolik štítků nejvýš vypsat (0 = všechny) */
function stitkyHtml(ids, max, tmave){
  var s = stitkyObj(ids);
  if (!s.length) return "";
  var zobraz = (max && s.length > max) ? s.slice(0, max) : s;
  var h = '<span class="stitky' + (max ? " radek" : "") + (tmave ? " tmave" : "") + '" aria-hidden="true">';
  zobraz.forEach(function(t){
    var b = barvaZ12(t.color);
    h += '<span class="stitek" style="background:' + b.css + ';color:' + kontrastniText(b.css) + '">' +
         esc(t.name) + '</span>';
  });
  if (max && s.length > max) h += '<span class="stitek vic">+' + (s.length - max) + '</span>';
  return h + '</span>';
}

function stitkyPasky(ids){
  var s = stitkyObj(ids).slice(0, 4);
  if (!s.length) return "";
  var h = '<span class="pasky" aria-hidden="true">';
  s.forEach(function(t){ h += '<span class="pasek" style="background:' + barvaZ12(t.color).css + '"></span>'; });
  return h + '</span>';
}

function stitkyText(ids){
  var s = stitkyObj(ids);
  if (!s.length) return "";
  return ", " + pluralCz(s.length, "štítek", "štítky", "štítků") + " " +
         s.map(function(t){ return t.name + " " + barvaZ12(t.color).nazev; }).join(", ");
}

function poznamkyPole(f){ return Array.isArray(f.notes) ? f.notes : []; }

function novyId(pref){
  return pref + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1679616).toString(36);
}

function osireleSoubory(){
  if (!metadata) return [];
  var evid = {};
  metadata.files.forEach(function(f){ if (!jeOdkaz(f)) evid[f.name] = true; });
  return Object.keys(shaMapa).filter(function(n){ return n !== "folder.json" && !evid[n]; })
    .sort(function(a,b){ return a.localeCompare(b,"cs"); });
}

function hlubokeSoubory(){
  if (!metadata) return [];
  return metadata.files.filter(function(f){ return hloubka(f.folder) > 4; });
}

/* ================= vykreslení ================= */

function mkPolozka(trida, vnitrek, popisek){
  var b = document.createElement("button");
  b.type = "button"; b.dataset.item = "";
  b.setAttribute("aria-label", popisek);
  b.innerHTML = '<span class="surface ' + trida + '">' + vnitrek + '</span>';
  return b;
}

function tlacitko(text, trida, akce, popisek){
  var b = document.createElement("button");
  b.type = "button";
  b.className = "b" + (trida ? " " + trida : "");
  b.textContent = text;
  if (popisek) b.setAttribute("aria-label", popisek);
  b.addEventListener("click", akce);
  return b;
}

function jeSprava(){ var c = el("sprava"); return !!c && c.checked; }

function vykresli(zamerit){
  var s = el("stage");
  s.textContent = "";
  polozky = [];
  uklidBlobUrly();

  if (pohled.typ === "nastaveni" && !nastaveniDostupne()){
    pohled = predchozi || { typ:"kartoteky", cesta:"", nazev:"" };
    predchozi = null;
  }

  if (pohled.typ === "nastaveni"){ vykresliNastaveni(s); }
  else if (pohled.typ === "hledani"){ vykresliHledani(s); }
  else if (!cfg.repo && !OFFLINE){ vykresliUvod(s); }
  else if (!metadata){ if (nacteno) vykresliChybiMeta(s); else vykresliNacitani(s); }
  else if (pohled.typ === "soubor"){ vykresliSoubor(s); }
  else {
    var h = hloubka(pohled.cesta);
    if (h === 0) vykresliKartoteky(s);
    else if (h === 1) vykresliSkrin(s);
    else if (h === 3) vykresliSanon(s);
    else if (h === 4) vykresliDesky(s);
    else { pohled = { typ:"kartoteky", cesta:"", nazev:"" }; vykresliKartoteky(s); }
  }

  polozky = Array.prototype.slice.call(s.querySelectorAll("[data-item]"));
  polozky.forEach(function(x,i){ x.tabIndex = i === 0 ? 0 : -1; });
  aktualni = 0;
  vykresliDrobky();
  aktualizujKolecko();
  nastavTitulek();
  zapisAdresu();
  if (typeof zamerit === "number" && polozky[zamerit]) zamer(zamerit);
}

function nastaveniDostupne(){
  if (OFFLINE) return false;
  if (!cfg.repo) return true;   /* bez nastaveného archivu se jinam nedostane */
  return jeSprava();
}

function aktualizujKolecko(){
  var b = el("btn-nastaveni");
  if (!b) return;
  b.hidden = !nastaveniDostupne();
  var n = osireleSoubory().length + hlubokeSoubory().length;
  b.innerHTML = "\u2699" + (n ? '<span class="badge-num">' + n + "</span>" : "");
  b.setAttribute("aria-label", n
    ? ("Nastavení a údržba, " + n + " " + pluralCz(n,"nesrovnalost","nesrovnalosti","nesrovnalostí"))
    : "Nastavení a údržba");
}

function nadpis(rodicElem, text, popis){
  var h = document.createElement("h1");
  h.textContent = text;
  rodicElem.appendChild(h);
  var p = document.createElement("p");
  p.className = "hint";
  p.textContent = popis || "";
  rodicElem.appendChild(p);
}

function vykresliUvod(s){
  nadpis(s, "Archiv", "Archiv zatím není připojen k žádnému repozitáři.");
  var f = document.createElement("p");
  f.appendChild(tlacitko("Otevřít nastavení", "primary", function(){ prejdiNastaveni(); }));
  s.appendChild(f);
}

function vykresliNacitani(s){
  nadpis(s, "Archiv", "Načítám obsah archivu.");
}

function vykresliChybiMeta(s){
  nadpis(s, "Archiv", "Ve zvolené složce chybí soubor folder.json s metadaty.");
  var p = document.createElement("p");
  p.appendChild(tlacitko("Založit folder.json", "primary", zalozMetadata));
  p.appendChild(tlacitko("Otevřít nastavení", "", function(){ prejdiNastaveni(); }));
  s.appendChild(p);
}

/* ---- úroveň 0: kartotéky ---- */
function vykresliKartoteky(s){
  var k = potomci("");
  nadpis(s, "Kartotéky", k.length ? "Vyberte kartotéku a otevřete ji." : "");

  if (jeSprava()){
    var bar = document.createElement("div");
    bar.className = "bar";
    bar.appendChild(tlacitko("Nová kartotéka", "primary", function(){ otevriEditUzel("novy", "", ""); }));
    bar.appendChild(tlacitko("Nový soubor", "", function(){ otevriNovySoubor(""); },
      "Nový soubor volně v archivu, mimo kartotéky"));
    bar.appendChild(tlacitko("Nový odkaz", "", function(){ otevriEditOdkazu(null, ""); },
      "Nový odkaz na web volně v archivu"));
    s.appendChild(bar);
  }

  if (!k.length){
    var p = document.createElement("p");
    p.className = "muted";
    p.textContent = jeSprava()
      ? "Archiv je prázdný. Založte první kartotéku."
      : "Archiv je prázdný. Zapněte Správu a založte první kartotéku.";
    s.appendChild(p);
  }else{
    var ul = document.createElement("ul");
    ul.className = "tiles cabs";
    ul.setAttribute("aria-label", "Kartotéční skříně");
    k.forEach(function(u){
      var cesta = normCesta(u.path), nazev = posledni(cesta);
      var b = barvaUzlu(cesta);
      var polic = pocetPod(cesta, 2), sanonu = pocetPod(cesta, 3);
      var soub = souboryV(cesta, true).length;
      var li = document.createElement("li");
      var t = mkPolozka("cabinet",
        '<span class="cab-plate" style="background:' + b.css + ';color:' + kontrastniText(b.css) + '">' + esc(nazev) + '</span>' +
        stitkyHtml(u.tags, 3) +
        '<span class="drawer"></span><span class="drawer"></span><span class="drawer"></span>' +
        '<span class="cab-count">' + soub + '</span>',
        "Kartotéka " + nazev + ", štítek " + b.nazev + ". " + pocetSlov(polic,"police") + ", " +
        pocetSlov(sanonu,"sanon") + ", " + pocetSlov(soub,"soubor") + stitkyText(u.tags) +
        ". Otevřete klávesou Enter.");
      t.addEventListener("click", function(){ prejdi(cesta); });
      li.appendChild(t);
      if (jeSprava()) li.appendChild(spravaUzlu(cesta));
      ul.appendChild(li);
    });
    s.appendChild(ul);
  }

  vykresliVolneListy(s, "");
}

/* ---- úroveň 1: skříň s policemi a šanony ---- */
function vykresliSkrin(s){
  var cesta = normCesta(pohled.cesta);
  var police = potomci(cesta);
  nadpis(s, posledni(cesta), "Regál s policemi. Na policích stojí šanony.");

  if (jeSprava()){
    var bar = document.createElement("div");
    bar.className = "bar";
    bar.appendChild(tlacitko("Nová police", "primary", function(){ otevriEditUzel("novy", cesta, ""); }));
    bar.appendChild(tlacitko("Upravit kartotéku", "", function(){ otevriEditUzel("uprava", "", cesta); }));
    bar.appendChild(tlacitko("Nový soubor", "", function(){ otevriNovySoubor(cesta); },
      "Nový soubor přímo v kartotéce " + posledni(cesta)));
    bar.appendChild(tlacitko("Nový odkaz", "", function(){ otevriEditOdkazu(null, cesta); },
      "Nový odkaz na web přímo v kartotéce " + posledni(cesta)));
    s.appendChild(bar);
  }

  if (!police.length){
    var p = document.createElement("p");
    p.className = "muted";
    p.textContent = "Skříň nemá žádnou polici.";
    s.appendChild(p);
  }else{
    var rack = document.createElement("div");
    rack.className = "rack";
    police.forEach(function(pu){
      var pc = normCesta(pu.path), pnazev = posledni(pc);
      var sanony = potomci(pc);
      var shelf = document.createElement("div");
      shelf.className = "shelf";

      var head = document.createElement("div");
      head.className = "shelf-head";
      var hn = document.createElement("h2");
      hn.className = "shelf-name";
      hn.textContent = pnazev;
      head.appendChild(hn);
      if (jeSprava()){
        head.appendChild(tlacitko("+ Šanon", "small", function(){ otevriEditUzel("novy", pc, ""); },
          "Nový šanon do police " + pnazev));
        head.appendChild(tlacitko("+ Soubor", "small", function(){ otevriNovySoubor(pc); },
          "Nový soubor přímo na polici " + pnazev));
        head.appendChild(tlacitko("+ Odkaz", "small", function(){ otevriEditOdkazu(null, pc); },
          "Nový odkaz na web přímo na polici " + pnazev));
        head.appendChild(tlacitko("Upravit", "small", function(){ otevriEditUzel("uprava", rodic(pc), pc); },
          "Upravit polici " + pnazev));
        head.appendChild(tlacitko("Smazat", "small danger", function(){ smazUzel(pc); },
          "Smazat polici " + pnazev));
      }
      shelf.appendChild(head);

      var row = document.createElement("ul");
      row.className = "shelf-row";
      row.setAttribute("aria-label", "Police " + pnazev + ", " + pocetSlov(sanony.length,"sanon"));

      if (!sanony.length){
        var pr = document.createElement("li");
        pr.className = "shelf-empty";
        pr.textContent = "Prázdná police";
        row.appendChild(pr);
      }
      sanony.forEach(function(su){
        var sc = normCesta(su.path), snazev = posledni(sc);
        var b = barvaUzlu(sc);
        var desek = potomci(sc).length, soub = souboryV(sc, true).length;
        var vyska = 150 + (hash(snazev) % 26);
        var li = document.createElement("li");
        var t = mkPolozka("binder",
          '<span class="binder-label">' + esc(snazev) + '</span>' + stitkyPasky(su.tags),
          "Šanon " + snazev + ", barva " + b.nazev + ", police " + pnazev + ". " +
          pocetSlov(desek,"desky") + ", " + pocetSlov(soub,"soubor") + stitkyText(su.tags) +
          ". Otevřete klávesou Enter.");
        var sf = t.querySelector(".surface");
        sf.style.background = "linear-gradient(90deg," + b.css + "," + ztmav(b.css, 18) + ")";
        sf.style.height = vyska + "px";
        t.addEventListener("click", function(){ prejdi(sc); });
        li.appendChild(t);
        if (jeSprava()){
          var tools = document.createElement("div");
          tools.className = "binder-tools";
          tools.appendChild(tlacitko("Upravit", "small", function(){ otevriEditUzel("uprava", pc, sc); },
            "Upravit šanon " + snazev));
          tools.appendChild(tlacitko("Smazat", "small danger", function(){ smazUzel(sc); },
            "Smazat šanon " + snazev));
          li.appendChild(tools);
        }
        row.appendChild(li);
      });
      shelf.appendChild(row);

      var board = document.createElement("div");
      board.className = "shelf-board";
      shelf.appendChild(board);
      rack.appendChild(shelf);
    });
    s.appendChild(rack);
  }

  vykresliVolneListy(s, cesta);
  police.forEach(function(pu){ vykresliVolneListy(s, normCesta(pu.path)); });
}

    bar.appendChild(tlacitko("Upravit šanon", "", function(){ otevriEditUzel("uprava", rodic(cesta), cesta); }));
    bar.appendChild(tlacitko("Nový soubor", "", function(){ otevriNovySoubor(cesta); },
      "Nový soubor přímo v šanonu " + posledni(cesta)));
    bar.appendChild(tlacitko("Nový odkaz", "", function(){ otevriEditOdkazu(null, cesta); },
      "Nový odkaz na web přímo v šanonu " + posledni(cesta)));

        pocetSlov(soub,"soubor") + stitkyText(du.tags) + ". Otevřete klávesou Enter.");
      t.querySelector(".surface").style.background = db.css;
      t.addEventListener("click", function(){ prejdi(dc); });

/* ---- úroveň 4: desky se soubory ---- */
function vykresliDesky(s){
  var cesta = normCesta(pohled.cesta);
  var b = barvaUzlu(cesta);
  var soubory = souboryV(cesta, false);
  nadpis(s, posledni(cesta), "Desky, barva " + b.nazev + ", " + pocetSlov(soubory.length,"soubor") + ".");

  if (jeSprava()){
    var bar = document.createElement("div");
    bar.className = "bar";
    bar.appendChild(tlacitko("Nový soubor", "primary", function(){ otevriNovySoubor(cesta); }));
    bar.appendChild(tlacitko("Nový odkaz", "", function(){ otevriEditOdkazu(null, cesta); },
      "Nový odkaz na web do desek " + posledni(cesta)));
    bar.appendChild(tlacitko("Upravit desky", "", function(){ otevriEditUzel("uprava", rodic(cesta), cesta); }));
    s.appendChild(bar);
  }

  if (!soubory.length){
    var p = document.createElement("p");

    soubory.forEach(function(f){ ul.appendChild(dlazdiceSouboru(f, posledni(cesta))); });
    s.appendChild(ul);
  }
}

function dlazdiceSouboru(f, kdeNazev){
  var odkaz = jeOdkaz(f);
  var t = typZaznamu(f);
  var chybi = !odkaz && !Object.prototype.hasOwnProperty.call(shaMapa, f.name);
  var pozn = poznamkyPole(f);
  var popisek = odkaz ? hostZUrl(f.url) : (t.nazev + " \u00b7 verze " + (f.version || 1));
  var li = document.createElement("li");
  var b = mkPolozka("doc" + (odkaz ? " odkaz" : ""),
    '<span class="doc-icon" aria-hidden="true">' + t.ikona + '</span>' +
    '<span class="doc-name">' + esc(f.name) + '</span>' +
    '<span class="doc-meta">' + esc(popisek) + '</span>' +
    stitkyHtml(f.tags, 0, true) +
    (f.locked ? '<span class="doc-flag">uzamčeno</span>' : '') +
    (chybi ? '<span class="doc-flag">chybí v repozitáři</span>' : '') +
    (pozn.length ? '<span class="doc-postit" style="background:' + postitBarva(pozn[0].color).css + '"></span>' : ''),
    (odkaz ? ("Odkaz na web " + f.name + ", adresa " + hostZUrl(f.url))
           : ("Soubor " + f.name + ", typ " + t.nazev + ", verze " + (f.version || 1))) +
    (kdeNazev ? ", desky " + kdeNazev : "") + stitkyText(f.tags) +
    (pozn.length ? ", " + pozn.length + " " + pluralCz(pozn.length,"poznámka","poznámky","poznámek") : "") +
    (f.locked ? ", uzamčeno" : "") + (chybi ? ", chybí v repozitáři" : "") +
    ". Otevřete klávesou Enter.");
  b.addEventListener("click", function(){ prejdiSoubor(f.name); });
  li.appendChild(b);
  return li;
}

/* ---- detail souboru ---- */
function vykresliSoubor(s){
  var f = najdi(pohled.nazev);
  if (!f){ pohled = { typ:"kartoteky", cesta:"", nazev:"" }; vykresliKartoteky(s); return; }
  var zamek = !!f.locked;

  if (jeOdkaz(f)){ vykresliOdkaz(s, f, zamek); return; }

  var t = typSouboru(f.name);
  var chybi = !Object.prototype.hasOwnProperty.call(shaMapa, f.name);
  var vel = velikostiRepo[f.name];

  var box = document.createElement("div");
  box.className = "sheet";
  box.innerHTML =
    '<h1>' + esc(f.name) + '</h1>' +
    '<p class="muted" style="font-family:var(--mono);font-size:12.5px;margin:0">' + esc(t.nazev) +
      (zamek ? ' &middot; uzamčeno' : '') + '</p>' +
    '<p class="popis">' + (f.description ? esc(f.description) : '<em>Bez popisu.</em>') + '</p>' +
    (chybi ? '<p class="chyba">' + (OFFLINE
        ? "Tento soubor není součástí offline kopie."

function kontrastniText(hex){
  var n = parseInt(hex.slice(1), 16);
  var jas = ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114) / 1000;
  return jas > 150 ? "#1d2225" : "#f6f3ea";
}
function ztmav(hex, pct){
  var n = parseInt(hex.slice(1), 16);
  function f(v){ return Math.max(0, Math.min(255, Math.round(v - v*pct/100))); }
  return "rgb(" + f(n>>16) + "," + f((n>>8)&255) + "," + f(n&255) + ")";
}

/* ================= drobečková navigace ================= */

function vykresliDrobky(){
  var c = el("crumbs");
  c.textContent = "";
  var kroky = [];

  if (pohled.typ === "nastaveni"){ kroky = [{t:"Archiv", c:null}, {t:"Nastavení", c:false}]; }
  else if (pohled.typ === "hledani"){ kroky = [{t:"Archiv", c:null}, {t:"Hledání", c:false}]; }
  else if (pohled.typ === "soubor"){
    var f = najdi(pohled.nazev);
    kroky.push({t:"Kartotéky", c:""});
    if (f){
      var u = casti(f.folder);
      var akt = [];
      for (var i=0;i<u.length && i<4;i++){
        akt.push(u[i]);
        kroky.push({t:u[i], c:akt.join("/")});
      }
    }
    kroky.push({t:pohled.nazev, c:false});
  }else{
    kroky.push({t:"Kartotéky", c: pohled.cesta ? "" : false});
    var uu = casti(pohled.cesta), aktc = [];
    for (var j=0;j<uu.length;j++){
      aktc.push(uu[j]);
      kroky.push({t:uu[j], c: j === uu.length-1 ? false : aktc.join("/")});
    }
  }

  kroky.forEach(function(k, i){
    if (i){
      var sep = document.createElement("span");
      sep.className = "sep"; sep.textContent = "\u203A";
      sep.setAttribute("aria-hidden","true");
      c.appendChild(sep);
    }
    if (k.c === false){
      var cur = document.createElement("span");
      cur.className = "here"; cur.setAttribute("aria-current","true");
      cur.textContent = k.t;
      c.appendChild(cur);
    }else{
      var b = document.createElement("button");
      b.type = "button"; b.textContent = k.t;
      b.setAttribute("aria-label", "Zpět na " + k.t);
      var cil = k.c;
      b.addEventListener("click", function(){
        if (cil === null) prejdi("");
        else prejdi(cil);
      });
      c.appendChild(b);
    }
  });
}

/* ================= navigace ================= */

function prejdi(cesta){
  var h = hloubka(cesta);
  if (h === 2){ cesta = rodic(cesta); }   // police nemá vlastní obrazovku
  pohled = { typ:"uroven", cesta: normCesta(cesta), nazev:"" };
  editace = null;
  vykresli(0);
  oznam(pohled.cesta ? posledni(pohled.cesta) : "Kartotéky");
}

function prejdiSoubor(nazev){
  pohled = { typ:"soubor", cesta:"", nazev:nazev };
  editace = null;
  vykresli();
  oznam("Soubor " + nazev);
  var h = el("stage").querySelector("h1");
  if (h){ h.setAttribute("tabindex","-1"); h.focus(); }
}

function prejdiNastaveni(){
  if (pohled.typ !== "nastaveni") predchozi = JSON.parse(JSON.stringify(pohled));
  pohled = { typ:"nastaveni", cesta:"", nazev:"" };
  vykresli();
  oznam("Nastavení");
}

function prejdiHledani(){
  if (pohled.typ !== "hledani") predchozi = JSON.parse(JSON.stringify(pohled));
  pohled = { typ:"hledani", cesta:"", nazev:"" };
  vykresli();
  var i = el("q");
  if (i) i.focus();
  oznam("Hledání");
}

function zpet(){
  if (pohled.typ === "nastaveni" || pohled.typ === "hledani"){
    pohled = predchozi || { typ:"kartoteky", cesta:"", nazev:"" };
    predchozi = null;
    vykresli(0);
    oznam(pohled.cesta ? posledni(pohled.cesta) : "Kartotéky");
    return;
  }
  if (pohled.typ === "soubor"){
    var f = najdi(pohled.nazev);
    prejdi(f ? normCesta(f.folder) : "");
    return;
  }
  if (!pohled.cesta){ oznam("Jste na nejvyšší úrovni, kartotéky."); return; }
  var cil = rodic(pohled.cesta);
  if (hloubka(cil) === 2) cil = rodic(cil);
  prejdi(cil);
}

/* ================= klávesnice ================= */

function zamer(i){
  if (!polozky.length) return;
  i = Math.max(0, Math.min(polozky.length-1, i));
  if (polozky[aktualni]){ polozky[aktualni].classList.remove("kbfocus"); polozky[aktualni].tabIndex = -1; }
  aktualni = i;
  polozky[i].tabIndex = 0;
  polozky[i].focus();
  polozky[i].classList.add("kbfocus");
}

function rady(){
  var mapa = [];
  polozky.forEach(function(x, i){
    var top = Math.round(x.getBoundingClientRect().top / 10);
    var r = null;
    for (var k=0;k<mapa.length;k++){ if (mapa[k].top === top){ r = mapa[k]; break; } }
    if (!r){ r = { top: top, idx: [] }; mapa.push(r); }
    r.idx.push(i);
  });
  mapa.sort(function(a,b){ return a.top - b.top; });
  return mapa.map(function(x){ return x.idx; });
}

function posun(smer){
  var R = rady();
  if (!R.length) return;
  var r = -1;
  for (var i=0;i<R.length;i++){ if (R[i].indexOf(aktualni) >= 0){ r = i; break; } }
  if (r < 0) return;
  var poz = R[r].indexOf(aktualni);
  if (smer === "vlevo") zamer(R[r][Math.max(0, poz-1)]);
  else if (smer === "vpravo") zamer(R[r][Math.min(R[r].length-1, poz+1)]);
  else {
    var nr = smer === "nahoru" ? r-1 : r+1;
    if (nr < 0 || nr >= R.length) return;
    zamer(R[nr][Math.min(poz, R[nr].length-1)]);
  }
}

document.addEventListener("keydown", function(e){
  var t = e.target;
  var vePoli = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");

  if (e.key === "Escape"){
    if (editace){ e.preventDefault(); zavriEdit(); return; }
    if (!vePoli || t.type === "search"){ e.preventDefault(); zpet(); }
    return;
  }
  if (vePoli) return;
  if (polozky.indexOf(document.activeElement) < 0) return;

  var R;
  if (e.key === "ArrowLeft"){ e.preventDefault(); posun("vlevo"); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); posun("vpravo"); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); posun("nahoru"); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); posun("dolu"); }
  else if (e.key === "Home"){
    e.preventDefault(); R = rady();
    for (var i=0;i<R.length;i++){ if (R[i].indexOf(aktualni) >= 0){ zamer(R[i][0]); break; } }
  }
  else if (e.key === "End"){
    e.preventDefault(); R = rady();
    for (var j=0;j<R.length;j++){ if (R[j].indexOf(aktualni) >= 0){ zamer(R[j][R[j].length-1]); break; } }
  }
  else if (e.key === "Backspace"){ e.preventDefault(); zpet(); }
});

el("stage").addEventListener("focusin", function(e){
  var i = polozky.indexOf(e.target);
  if (i > -1 && i !== aktualni){
    if (polozky[aktualni]) polozky[aktualni].classList.remove("kbfocus");
    aktualni = i;
  }
});

  f.appendChild(l);

  if (napoveda) i.setAttribute("aria-describedby", id + "-h");

  if (napoveda){
    var p = document.createElement("p");
    p.className = "fhint"; p.id = id + "-h"; p.textContent = napoveda;

  }
  return i;

function poleTextarea(f, id, popisek, hodnota){
  var l = document.createElement("label");
  l.className = "f"; l.setAttribute("for", id); l.textContent = popisek;
  f.appendChild(l);

function poleStitky(f, vybrane){
  var vsechny = stitkySeznam();
  var fs = document.createElement("fieldset");
  fs.style.margin = "16px 0 0";
  var lg = document.createElement("legend");
  lg.textContent = "Štítky";
  fs.appendChild(lg);
  if (!vsechny.length){
    var p = document.createElement("p");
    p.className = "fhint";
    p.textContent = "Zatím nejsou založené žádné štítky. Založíte je v nastavení pod ozubeným kolem.";
    fs.appendChild(p);
    f.appendChild(fs);
    return function(){ return Array.isArray(vybrane) ? vybrane.slice() : []; };
  }
  var boxy = [];
  vsechny.forEach(function(t){
    var c = barvaZ12(t.color);
    var l = document.createElement("label");
    l.className = "stitek-volba";
    var i = document.createElement("input");
    i.type = "checkbox"; i.value = t.id;
    i.setAttribute("aria-label", "Štítek " + t.name + ", barva " + c.nazev);
    if (Array.isArray(vybrane) && vybrane.indexOf(t.id) >= 0) i.checked = true;
    var sp = document.createElement("span");
    sp.className = "stitek";
    sp.style.background = c.css; sp.style.color = kontrastniText(c.css);
    sp.textContent = t.name;
    sp.setAttribute("aria-hidden","true");
    l.appendChild(i); l.appendChild(sp);
    fs.appendChild(l);
    boxy.push(i);
  });
  f.appendChild(fs);
  return function(){
    return boxy.filter(function(x){ return x.checked; }).map(function(x){ return x.value; });
  };
}

function poleBarva(f, id, popisek, sada, hodnota){
  var l = document.createElement("label");
  l.className = "f"; l.setAttribute("for", id); l.textContent = popisek;
  f.appendChild(l);
  var s = document.createElement("select");
  s.id = id;
  sada.forEach(function(b){
    var o = document.createElement("option");
    o.value = b.id; o.textContent = b.nazev;
    if (b.id === hodnota) o.selected = true;
    s.appendChild(o);
  });
  f.appendChild(s);
  return s;
}

/* --- uzel: nový / úprava --- */
function otevriEditUzel(rezim, rodicCesta, cesta){

  var s = el("stage");
  var uroven = rezim === "novy" ? hloubka(rodicCesta) + 1 : hloubka(cesta);
  var nazevUrovne = UROVNE[uroven-1];
  var u = rezim === "uprava" ? najdiUzel(cesta) : null;

  var f = panel(rezim === "novy" ? ("Nová položka: " + nazevUrovne) : ("Úprava: " + nazevUrovne));

    "Název nesmí obsahovat lomítko.");
  var iPopis = poleTextarea(f, "ed-popis", "Popis", u ? (u.description || "") : "");
  var iBarva = null;
  var dejStitky = null;
  if (uroven === 1) iBarva = poleBarva(f, "ed-barva", "Barva štítku", BARVY12, u ? u.color : "");
  else if (uroven === 3) iBarva = poleBarva(f, "ed-barva", "Barva šanonu", BARVY12, u ? u.color : "");
  else if (uroven === 4) iBarva = poleBarva(f, "ed-barva", "Barva desek", BARVY6, u ? u.color : "");

  var iRodic = null;
  if (rezim === "uprava" && uroven > 1){
    var moznosti = uzly().filter(function(x){ return hloubka(x.path) === uroven-1; })
      .map(function(x){ return normCesta(x.path); })
      .sort(function(a,b){ return a.localeCompare(b,"cs"); });
    var l = document.createElement("label");
    l.className = "f"; l.setAttribute("for","ed-rodic");
    l.textContent = "Umístění (" + UROVNE[uroven-2] + ")";

    iRodic.id = "ed-rodic";
    moznosti.forEach(function(m){
      var o = document.createElement("option");
      o.value = m; o.textContent = m;
      if (m === rodic(cesta)) o.selected = true;
      iRodic.appendChild(o);
    });
    f.appendChild(iRodic);
  }

  dejStitky = poleStitky(f, u ? u.tags : []);

  var akce = document.createElement("div");
  akce.style.marginTop = "16px";
  akce.appendChild(tlacitko("Uložit", "primary", function(){
    ulozUzel(rezim, rodicCesta, cesta, uroven, iNazev.value, iPopis.value,
             iBarva ? iBarva.value : "", iRodic ? iRodic.value : null, dejStitky());
  }));
  akce.appendChild(tlacitko("Zrušit", "", zavriEdit));
  f.appendChild(akce);

  s.insertBefore(f, s.firstChild);

function ulozUzel(rezim, rodicCesta, cesta, uroven, nazev, popis, barva, novyRodic, tagy){
  if (!kontrola(true)) return;
  nazev = String(nazev || "").trim();
  if (!nazev){ stav("Zadejte název.", "err"); el("ed-nazev").focus(); return; }
  if (nazev.indexOf("/") >= 0){ stav("Název nesmí obsahovat lomítko.", "err"); el("ed-nazev").focus(); return; }

  var cilovyRodic = rezim === "novy" ? normCesta(rodicCesta)
                                     : (novyRodic !== null ? normCesta(novyRodic) : rodic(cesta));
  var novaCesta = cilovyRodic ? cilovyRodic + "/" + nazev : nazev;

  if (rezim === "novy" || novaCesta !== normCesta(cesta)){
    if (najdiUzel(novaCesta)){ stav("Na tomto místě už položka s tímto názvem je.", "err"); return; }
  }

  var ted = new Date().toISOString();

  if (rezim === "novy"){
    metadata.nodes.push({ path:novaCesta, color:barva, description:popis, tags:tagy || [],
                          created:ted, updated:ted });
    ulozMetadata("Nová položka " + novaCesta).then(function(){
      stav(UROVNE[uroven-1] + " " + nazev + " byla založena.", "ok");
      editace = null;
      vykresli(0);
      oznam("Založeno: " + nazev);
    }).catch(function(e){
      metadata.nodes = metadata.nodes.filter(function(x){ return normCesta(x.path) !== novaCesta; });
      stav("Uložení se nezdařilo: " + e.message, "err");
    });
    return;
  }

  var stara = normCesta(cesta);
  var u = najdiUzel(stara);
  if (!u){ stav("Položka nebyla nalezena.", "err"); return; }
  u.description = popis;
  u.color = barva;
  u.tags = tagy || [];
  u.updated = ted;

  if (novaCesta !== stara){
    metadata.nodes.forEach(function(x){
      var p = normCesta(x.path);
      if (p === stara) x.path = novaCesta;
      else if (p.indexOf(stara + "/") === 0) x.path = novaCesta + p.slice(stara.length);
    });
    metadata.files.forEach(function(fx){
      var p = normCesta(fx.folder);
      if (p === stara) fx.folder = novaCesta;
      else if (p.indexOf(stara + "/") === 0) fx.folder = novaCesta + p.slice(stara.length);
    });
  }

  ulozMetadata("Úprava položky " + novaCesta).then(function(){
    stav(UROVNE[uroven-1] + " " + nazev + " byla upravena.", "ok");
    editace = null;
    if (pohled.typ === "uroven" && (normCesta(pohled.cesta) === stara ||
        normCesta(pohled.cesta).indexOf(stara + "/") === 0)){
      pohled.cesta = novaCesta + normCesta(pohled.cesta).slice(stara.length);
    }
    vykresli(0);
    oznam("Upraveno: " + nazev);
  }).catch(function(e){ stav("Uložení se nezdařilo: " + e.message, "err"); nacti(true); });
}

function smazUzel(cesta){
  if (!kontrola(true)) return;
  cesta = normCesta(cesta);
  var uroven = UROVNE[hloubka(cesta)-1];
  var deti = uzly().filter(function(x){ return normCesta(x.path).indexOf(cesta + "/") === 0; }).length;
  var soub = souboryV(cesta, true).length;
  if (deti || soub){
    stav("Nelze smazat: " + uroven + " " + posledni(cesta) + " není prázdná (" +
         deti + " podřízených položek, " + soub + " souborů).", "err");
    return;
  }
  if (!confirm("Opravdu smazat " + uroven + " " + posledni(cesta) + "?")) return;
  var zaloha = metadata.nodes.slice();
  metadata.nodes = metadata.nodes.filter(function(x){ return normCesta(x.path) !== cesta; });
  ulozMetadata("Smazání položky " + cesta).then(function(){
    stav(uroven + " " + posledni(cesta) + " byla smazána.", "ok");
    vykresli(0);
  }).catch(function(e){
    metadata.nodes = zaloha;
    stav("Smazání se nezdařilo: " + e.message, "err");
  });
}

function ulozOdkaz(puvodni, nazev, url, popis, tagy, cesta){
  if (!kontrola(true)) return;
  nazev = String(nazev || "").trim();
  url = String(url || "").trim();
  popis = String(popis || "").trim();

  if (!nazev){ stav("Zadejte název odkazu.", "err"); el("od-nazev").focus(); return; }
  if (nazev.indexOf("/") >= 0){ stav("Název nesmí obsahovat lomítko.", "err"); el("od-nazev").focus(); return; }
  if (nazev === "folder.json"){ stav("Název folder.json je vyhrazen pro metadata.", "err"); return; }
  if (!platnaUrl(url)){
    stav("Adresa musí začínat http:// nebo https://.", "err");
    el("od-url").focus();
    return;
  }
  if (!metadata){ stav("Nejprve načtěte nebo založte folder.json.", "err"); return; }
  var jiny = najdi(nazev);
  if (jiny && jiny.name !== puvodni){ stav("Položka s tímto názvem už v archivu je.", "err"); return; }

  var ted = new Date().toISOString();
  var zaloha = metadata.files.map(function(x){ return x; });

  if (puvodni){
    var z = najdi(puvodni);
    if (!z) return;
    z.name = nazev; z.url = url; z.description = popis;
    z.tags = tagy || []; z.updated = ted;
  }else{
    metadata.files.push({
      name:nazev, type:"odkaz", url:url, description:popis, folder:normCesta(cesta),
      tags:tagy || [], notes:[], created:ted, updated:ted
    });
  }

  ulozMetadata((puvodni ? "Úprava odkazu " : "Nový odkaz ") + nazev).then(function(){
    stav("Odkaz " + nazev + " byl uložen.", "ok");
    editace = null;
    if (pohled.typ === "soubor" && pohled.nazev === puvodni) pohled.nazev = nazev;
    vykresli(0);
    oznam("Odkaz uložen");
  }).catch(function(e){
    metadata.files = zaloha;
    stav("Uložení se nezdařilo: " + e.message, "err");
    nacti(true);
  });
}

function ulozStitek(id, nazev, barva){
  if (!kontrola(true)) return;
  nazev = String(nazev || "").trim();
  if (!nazev){ stav("Zadejte název štítku.", "err"); el("st-nazev").focus(); return; }
  if (!metadata) return;
  if (!Array.isArray(metadata.tags)) metadata.tags = [];
  var kolize = metadata.tags.filter(function(t){
    return t.id !== id && t.name.toLowerCase() === nazev.toLowerCase();
  }).length;
  if (kolize){ stav("Štítek s tímto názvem už existuje.", "err"); return; }

  var zaloha = metadata.tags.map(function(t){ return { id:t.id, name:t.name, color:t.color }; });
  if (id){
    metadata.tags.forEach(function(t){ if (t.id === id){ t.name = nazev; t.color = barva; } });
  }else{
    metadata.tags.push({ id: novyId("st"), name:nazev, color:barva });
  }
  ulozMetadata((id ? "Úprava" : "Založení") + " štítku " + nazev).then(function(){
    stav("Štítek " + nazev + " byl uložen.", "ok");
    editace = null;
    vykresli();
    oznam("Štítek uložen");
  }).catch(function(e){
    metadata.tags = zaloha;
    stav("Uložení se nezdařilo: " + e.message, "err");

}

function smazStitek(id){
  if (!kontrola(true)) return;
  var t = najdiStitek(id);
  if (!t) return;
  var kde = 0;
  uzly().forEach(function(u){ if (Array.isArray(u.tags) && u.tags.indexOf(id) >= 0) kde++; });
  metadata.files.forEach(function(f){ if (Array.isArray(f.tags) && f.tags.indexOf(id) >= 0) kde++; });
  if (!confirm("Smazat štítek " + t.name + "?" +
      (kde ? " Odlepí se z " + kde + " " + pluralCz(kde,"položky","položek","položek") + "." : ""))) return;

  var zalohaTags = metadata.tags.slice();
  metadata.tags = metadata.tags.filter(function(x){ return x.id !== id; });
  uzly().forEach(function(u){
    if (Array.isArray(u.tags)) u.tags = u.tags.filter(function(x){ return x !== id; });
  });
  metadata.files.forEach(function(f){
    if (Array.isArray(f.tags)) f.tags = f.tags.filter(function(x){ return x !== id; });
  });
  filtrStitky = filtrStitky.filter(function(x){ return x !== id; });
  ulozMetadata("Smazání štítku " + t.name).then(function(){
    stav("Štítek " + t.name + " byl smazán.", "ok");
    vykresli();
  }).catch(function(e){
    metadata.tags = zalohaTags;
    stav("Smazání se nezdařilo: " + e.message, "err");
    nacti(true);
  });
}

      moznosti.push({ hodnota:c, popis: c + " (" + UROVNE[hloubka(c)-1] + ")" });

function presunSoubor(nazev, cil){
