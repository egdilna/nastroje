<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archiv – prototyp rozhraní</title>
<style>
:root{
  --room:#3d4b52;
  --room-2:#2c383e;
  --wood:#a8763e;
  --wood-dark:#7c5527;
  --wood-light:#c2914f;
  --metal:#8d9599;
  --metal-2:#6e7679;
  --metal-3:#aeb5b8;
  --ink:#1d2225;
  --paper:#f3efe4;
  --label:#fbf8ee;
  --focus:#ffd23f;
  --chrome:#e8e4d8;
  --mono:"Courier New",ui-monospace,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--chrome);
  background:radial-gradient(ellipse at 50% 0%,var(--room) 0%,var(--room-2) 70%);
  display:flex;flex-direction:column;min-height:100vh;
}

/* ---------- chrome ---------- */
header{
  padding:14px 20px 10px;border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.18);
}
.brand{font-family:var(--mono);letter-spacing:.22em;text-transform:uppercase;font-size:12px;opacity:.7}
nav.crumbs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
nav.crumbs button{
  font:inherit;color:inherit;background:none;border:0;padding:4px 8px;border-radius:4px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.25);
}
nav.crumbs button:hover{background:rgba(255,255,255,.08)}
nav.crumbs .sep{opacity:.4}
nav.crumbs .here{opacity:.95;font-weight:600;padding:4px 8px}

main{flex:1;padding:26px 20px 40px;display:flex;flex-direction:column;align-items:center}
.stage{width:100%;max-width:1080px}
h1{font-size:20px;margin:0 0 4px;font-weight:600;letter-spacing:.01em}
.hint{font-size:13px;opacity:.6;margin:0 0 22px}

footer{
  padding:10px 20px;font-size:12.5px;opacity:.65;border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.22);text-align:center;font-family:var(--mono);
}
kbd{font-family:var(--mono);border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:0 4px}

/* ---------- společné pro položky ---------- */
[data-item]{
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;
  display:block;position:relative;border-radius:3px;
}
[data-item]:focus{outline:none}
[data-item]:focus-visible .surface,
[data-item].kbfocus .surface{
  outline:3px solid var(--focus);outline-offset:3px;
}
.surface{transition:transform .16s ease, filter .16s ease}
[data-item]:hover .surface{transform:translateY(-3px)}

/* ---------- ÚROVEŇ 1: kartotéční skříně ---------- */
.cabinets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px}
.cabinet{
  width:100%;height:230px;border-radius:6px 6px 3px 3px;position:relative;overflow:hidden;
  background:linear-gradient(100deg,var(--metal-3) 0%,var(--metal) 38%,var(--metal-2) 100%);
  box-shadow:0 14px 22px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.5);
  padding:8px 8px 12px;display:flex;flex-direction:column;gap:7px;
}
.cab-plate{
  background:var(--label);color:var(--ink);font-family:var(--mono);font-size:12.5px;
  text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:6px 4px;
  border:1px solid #b9b19c;border-radius:2px;box-shadow:inset 0 0 0 2px #fff;
  line-height:1.25;
}
.drawer{
  flex:1;background:linear-gradient(180deg,#9aa2a6,#7d858a);border-radius:2px;
  border-top:1px solid rgba(255,255,255,.55);box-shadow:0 2px 4px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.drawer::after{
  content:"";width:44%;height:9px;border-radius:5px;
  background:linear-gradient(180deg,#dfe3e5,#8f979b);box-shadow:0 1px 2px rgba(0,0,0,.45);
}
.cab-count{
  position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:11px;
  color:#20262a;opacity:.65;
}

/* ---------- ÚROVEŇ 2: regál s policemi ---------- */
.rack{
  background:linear-gradient(180deg,var(--wood-light),var(--wood) 40%,var(--wood-dark));
  padding:16px;border-radius:5px;box-shadow:0 18px 30px rgba(0,0,0,.45), inset 0 0 0 3px rgba(0,0,0,.15);
}
.shelf{position:relative;padding:0 10px 14px}
.shelf + .shelf{margin-top:6px}
.shelf-name{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:#3a2711;opacity:.75;margin:0 0 4px 2px;
}
.shelf-row{
  display:flex;align-items:flex-end;gap:5px;min-height:186px;padding:0 6px 0 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0) 26%);
}
.shelf-board{
  height:12px;border-radius:2px;
  background:linear-gradient(180deg,#d7a660,var(--wood-dark));
  box-shadow:0 5px 8px rgba(0,0,0,.4);
}
.binder{
  width:44px;border-radius:2px 4px 4px 2px;position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:2px 3px 7px rgba(0,0,0,.4), inset -6px 0 10px rgba(0,0,0,.25), inset 2px 0 0 rgba(255,255,255,.25);
  padding:14px 0;
}
.binder::before,.binder::after{
  content:"";position:absolute;left:5px;right:5px;height:5px;
  background:linear-gradient(180deg,#e9edef,#9aa1a5);border-radius:1px;opacity:.85;
}
.binder::before{top:9px}
.binder::after{bottom:9px}
.binder-label{
  background:var(--label);color:var(--ink);border:1px solid rgba(0,0,0,.25);
  writing-mode:vertical-rl;text-orientation:mixed;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;
  padding:8px 3px;max-height:112px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}

/* ---------- ÚROVEŇ 3: desky ---------- */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
.folder{
  position:relative;height:132px;border-radius:2px 6px 4px 4px;
  box-shadow:0 8px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.12);
  padding:26px 12px 12px;color:#2a2a24;
}
.folder-tab{
  position:absolute;top:-13px;left:0;height:15px;min-width:52%;max-width:78%;
  border-radius:4px 8px 0 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
}
.folder-name{
  font-family:var(--mono);font-size:13px;line-height:1.35;font-weight:700;
  border-bottom:1px dashed rgba(0,0,0,.28);padding-bottom:6px;
}
.folder-meta{font-family:var(--mono);font-size:11px;opacity:.6;margin-top:8px}

/* ---------- ÚROVEŇ 4: dokumenty ---------- */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.doc{
  background:var(--paper);color:#22262a;height:150px;border-radius:2px;
  box-shadow:0 8px 14px rgba(0,0,0,.35);padding:14px 12px;text-align:left;position:relative;overflow:hidden;
}
.doc::before{
  content:"";position:absolute;top:0;right:0;border-width:0 22px 22px 0;border-style:solid;
  border-color:transparent var(--room-2) transparent transparent;opacity:.35;
}
.doc-icon{font-size:22px;line-height:1}
.doc-name{font-family:var(--mono);font-size:12.5px;margin-top:10px;font-weight:700;line-height:1.35}
.doc-meta{font-family:var(--mono);font-size:11px;opacity:.6;position:absolute;bottom:12px;left:12px}

.empty{font-family:var(--mono);font-size:13px;opacity:.7;padding:30px 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  .shelf-row{overflow-x:auto}
  .cabinet{height:190px}
}
</style>
</head>
<body>

<header>
  <div class="brand">Archiv · prototyp</div>
  <nav class="crumbs" id="crumbs" aria-label="Cesta v archivu"></nav>
</header>

<main>
  <div class="stage">
    <h1 id="viewTitle">Kartotéky</h1>
    <p class="hint" id="viewHint"></p>
    <div id="stage"></div>
  </div>
</main>

<footer>
  <kbd>šipky</kbd> pohyb · <kbd>Enter</kbd> otevřít · <kbd>Esc</kbd> zpět · <kbd>Home</kbd>/<kbd>End</kbd> okraj řady
</footer>

<div class="sr-only" role="status" aria-live="polite" id="live"></div>

<script>
/* ====== barvy ====== */
const BINDER_COLORS = {
  cervena:   {label:"červená",      css:"#b32222"},
  oranzova:  {label:"oranžová",     css:"#d1641b"},
  zluta:     {label:"žlutá",        css:"#d9ac16"},
  zelena:    {label:"zelená",       css:"#3f8b3f"},
  tmavezelena:{label:"tmavě zelená",css:"#22553a"},
  tyrkysova: {label:"tyrkysová",    css:"#1f8a8f"},
  modra:     {label:"modrá",        css:"#245fa6"},
  tmavemodra:{label:"tmavě modrá",  css:"#1b3163"},
  fialova:   {label:"fialová",      css:"#6b3d9e"},
  ruzova:    {label:"růžová",       css:"#b73a72"},
  hneda:     {label:"hnědá",        css:"#6f4a2c"},
  cerna:     {label:"černá",        css:"#26292c"}
};
const FOLDER_COLORS = {
  slama:    {label:"slámová",       css:"#f0e3ae", tab:"#e6d493"},
  bledemodra:{label:"bledě modrá",  css:"#cfe0ef", tab:"#b8d1e6"},
  mata:     {label:"mátová",        css:"#cfe8d5", tab:"#b6dcc0"},
  pudrova:  {label:"pudrová",       css:"#f2d5d8", tab:"#e7bfc4"},
  broskvova:{label:"broskvová",     css:"#f7ddc2", tab:"#eecaa6"},
  levandule:{label:"levandulová",   css:"#ddd6ee", tab:"#c9bfe4"}
};
const DOC_TYPES = {
  dokument:{label:"textový dokument", icon:"📄"},
  tabulka: {label:"tabulka",          icon:"▦"},
  sken:    {label:"skenovaný obraz",  icon:"🖼"},
  pdf:     {label:"PDF",              icon:"📕"},
  zaznam:  {label:"datový záznam",    icon:"🗂"}
};

/* ====== ukázková data ====== */
const d=(n,t,s)=>({name:n,type:t,size:s});
const DATA=[
 {name:"Legislativa", shelves:[
   {name:"Police 1 – zákony", binders:[
     {name:"Zákon o právu na digitální služby", color:"modra", folders:[
       {name:"Znění a novely", color:"slama", docs:[d("12-2020 úplné znění","dokument","148 kB"),d("Novela 2024 – sněmovní tisk","pdf","2,1 MB"),d("Srovnávací tabulka","tabulka","64 kB")]},
       {name:"Důvodové zprávy", color:"bledemodra", docs:[d("Důvodová zpráva 2019","pdf","880 kB"),d("Vypořádání připomínek","tabulka","210 kB")]},
       {name:"Stanoviska", color:"mata", docs:[d("Stanovisko legislativní rady","dokument","72 kB")]}
     ]},
     {name:"Zákon o kybernetické bezpečnosti", color:"tmavemodra", folders:[
       {name:"Vyhláška 409/2025", color:"pudrova", docs:[d("Text vyhlášky","pdf","1,4 MB"),d("Přehled požadavků","tabulka","320 kB"),d("Mapování na NIS2","tabulka","190 kB")]},
       {name:"Metodiky NÚKIB", color:"levandule", docs:[d("Metodika řízení aktiv","pdf","760 kB")]}
     ]},
     {name:"Archivní zákon", color:"hneda", folders:[
       {name:"NSESSS v4", color:"slama", docs:[d("Národní standard","pdf","3,2 MB"),d("Testovací scénáře","tabulka","410 kB")]}
     ]},
     {name:"Správní řád", color:"cerna", folders:[
       {name:"Výklady", color:"broskvova", docs:[d("Doručování do datové schránky","dokument","96 kB")]}
     ]}
   ]},
   {name:"Police 2 – prováděcí předpisy", binders:[
     {name:"Vyhlášky MV", color:"zelena", folders:[
       {name:"Spisová služba", color:"mata", docs:[d("Vyhláška 259/2012","pdf","540 kB")]},
       {name:"Datové schránky", color:"bledemodra", docs:[d("Provozní řád ISDS","pdf","1,1 MB"),d("Formáty výstupů","tabulka","88 kB")]}
     ]},
     {name:"Nařízení EU", color:"tyrkysova", folders:[
       {name:"eIDAS 2", color:"levandule", docs:[d("Konsolidované znění","pdf","4,6 MB"),d("Peněženka – požadavky","dokument","230 kB")]},
       {name:"Data Act", color:"slama", docs:[d("Dopadová analýza","dokument","310 kB")]}
     ]}
   ]}
 ]},
 {name:"Projekty", shelves:[
   {name:"Police 1 – běžící", binders:[
     {name:"Portál občana", color:"cervena", folders:[
       {name:"Architektura", color:"bledemodra", docs:[d("Cílový model ArchiMate","dokument","520 kB"),d("Katalog služeb","tabulka","150 kB")]},
       {name:"Zadávací dokumentace", color:"pudrova", docs:[d("Technická specifikace","pdf","2,8 MB"),d("Harmonogram","tabulka","74 kB")]},
       {name:"Zápisy z jednání", color:"slama", docs:[d("Zápis 2026-03-11","dokument","41 kB"),d("Zápis 2026-04-02","dokument","38 kB")]}
     ]},
     {name:"Registr práv a povinností", color:"oranzova", folders:[
       {name:"Datový katalog", color:"mata", docs:[d("Číselníky OFN","zaznam","1,9 MB"),d("Slovník pojmů","zaznam","640 kB")]},
       {name:"Rozhraní", color:"levandule", docs:[d("Popis API","dokument","180 kB")]}
     ]},
     {name:"eSSL migrace", color:"zluta", folders:[
       {name:"Testovací protokoly", color:"broskvova", docs:[d("Protokol 01 – příjem","tabulka","96 kB"),d("Protokol 02 – výpravna","tabulka","102 kB"),d("Souhrn zjištění","dokument","58 kB")]}
     ]},
     {name:"Datová kvalita", color:"fialova", folders:[
       {name:"Pravidla validace", color:"bledemodra", docs:[d("Sada pravidel","zaznam","310 kB")]}
     ]}
   ]},
   {name:"Police 2 – uzavřené", binders:[
     {name:"Digitální technická mapa", color:"ruzova", folders:[
       {name:"Závěrečná zpráva", color:"slama", docs:[d("Zpráva o realizaci","pdf","3,4 MB"),d("Fotodokumentace","sken","12 MB")]}
     ]},
     {name:"Archiv 2019–2022", color:"tmavezelena", folders:[
       {name:"Smlouvy", color:"pudrova", docs:[d("Rámcová smlouva","sken","6,2 MB")]},
       {name:"Fakturace", color:"broskvova", docs:[d("Přehled plnění","tabulka","220 kB")]}
     ]}
   ]}
 ]},
 {name:"Výuka a přednášky", shelves:[
   {name:"Police 1 – kurzy", binders:[
     {name:"eGovernment – úvod", color:"tyrkysova", folders:[
       {name:"Prezentace", color:"levandule", docs:[d("Blok 1 – základy","pdf","5,1 MB"),d("Blok 2 – registry","pdf","4,4 MB")]},
       {name:"Zadání cvičení", color:"mata", docs:[d("Případová studie","dokument","120 kB")]}
     ]},
     {name:"Datová architektura", color:"modra", folders:[
       {name:"Modely", color:"bledemodra", docs:[d("Konceptuální model","zaznam","410 kB")]}
     ]},
     {name:"Umělá inteligence ve VS", color:"fialova", folders:[
       {name:"Podklady", color:"slama", docs:[d("Osnova kurzu","dokument","64 kB"),d("Doporučená četba","dokument","28 kB")]}
     ]}
   ]}
 ]},
 {name:"Krizové řízení", shelves:[
   {name:"Police 1 – dokumentace", binders:[
     {name:"Havarijní plány", color:"cervena", folders:[
       {name:"Plán vyrozumění", color:"pudrova", docs:[d("Schéma svolání","dokument","88 kB"),d("Kontaktní matice","tabulka","54 kB")]},
       {name:"Mapové podklady", color:"mata", docs:[d("Zóny ohrožení","sken","9,8 MB")]}
     ]},
     {name:"Cvičení a nácviky", color:"oranzova", folders:[
       {name:"Scénáře", color:"broskvova", docs:[d("Scénář povodeň","dokument","140 kB"),d("Scénář výpadek IT","dokument","112 kB")]},
       {name:"Vyhodnocení", color:"slama", docs:[d("Zpráva z cvičení 2025","pdf","1,7 MB")]}
     ]},
     {name:"Předpisy a metodiky", color:"tmavemodra", folders:[
       {name:"Metodiky HZS", color:"levandule", docs:[d("Typová činnost","pdf","2,3 MB")]}
     ]}
   ]}
 ]}
];

/* ====== stav ====== */
let path=[];            // [ci, si?, bi?, fi?]  – viz level
const stage=document.getElementById('stage');
const crumbs=document.getElementById('crumbs');
const live=document.getElementById('live');
const titleEl=document.getElementById('viewTitle');
const hintEl=document.getElementById('viewHint');
let items=[], cur=0;

const cabinet=()=>DATA[path[0]];
const binder =()=>cabinet().shelves[path[1]].binders[path[2]];
const folder =()=>binder().folders[path[3]];
const plural=(n,a,b,c)=>n===1?a:(n>=2&&n<=4?b:c);

/* ====== vykreslení ====== */
function render(focusIndex){
  stage.innerHTML=''; items=[];
  const lvl=path.length;
  if(lvl===0) renderCabinets();
  else if(lvl===1) renderShelves();
  else if(lvl===3) renderFolders();
  else renderDocs();

  items=[...stage.querySelectorAll('[data-item]')];
  items.forEach((el,i)=>el.tabIndex=(i===0?0:-1));
  cur=0;
  renderCrumbs();
  if(typeof focusIndex==='number' && items[focusIndex]) focusItem(focusIndex,false);
  else if(items[0]) items[0].focus({preventScroll:true});
}

function mkItem(cls,html,aria){
  const b=document.createElement('button');
  b.type='button'; b.dataset.item='';
  b.setAttribute('aria-label',aria);
  b.innerHTML=`<span class="surface ${cls}">${html}</span>`;
  return b;
}

function renderCabinets(){
  titleEl.textContent='Kartotéky';
  hintEl.textContent='Vyberte kartotéční skříň a otevřete ji.';
  const wrap=document.createElement('div'); wrap.className='cabinets';
  wrap.setAttribute('role','group'); wrap.setAttribute('aria-label','Kartotéční skříně');
  DATA.forEach((c,i)=>{
    const binders=c.shelves.reduce((s,sh)=>s+sh.binders.length,0);
    const el=mkItem('cabinet',
      `<span class="cab-plate">${c.name}</span>
       <span class="drawer"></span><span class="drawer"></span><span class="drawer"></span>
       <span class="cab-count">${binders}</span>`,
      `Kartotéční skříň ${c.name}. ${c.shelves.length} ${plural(c.shelves.length,'police','police','polic')}, `+
      `${binders} ${plural(binders,'šanon','šanony','šanonů')}. Otevřete klávesou Enter.`);
    el.onclick=()=>{path=[i];render();announce(`Otevřena skříň ${c.name}.`);};
    wrap.appendChild(el);
  });
  stage.appendChild(wrap);
}

function renderShelves(){
  const c=cabinet();
  titleEl.textContent=c.name;
  hintEl.textContent='Regál s policemi. Na policích stojí šanony – vyberte jeden.';
  const rack=document.createElement('div'); rack.className='rack';
  c.shelves.forEach((sh,si)=>{
    const shelf=document.createElement('div'); shelf.className='shelf';
    shelf.setAttribute('role','group'); shelf.setAttribute('aria-label',`${sh.name}, ${sh.binders.length} ${plural(sh.binders.length,'šanon','šanony','šanonů')}`);
    const h=document.createElement('div'); h.className='shelf-name'; h.textContent=sh.name;
    const row=document.createElement('div'); row.className='shelf-row';
    sh.binders.forEach((b,bi)=>{
      const col=BINDER_COLORS[b.color];
      const docs=b.folders.reduce((s,f)=>s+f.docs.length,0);
      const height=150+((bi*17)%26);
      const el=mkItem('binder',`<span class="binder-label">${b.name}</span>`,
        `Šanon ${b.name}, barva ${col.label}, ${sh.name}. `+
        `${b.folders.length} ${plural(b.folders.length,'desky','desky','desek')}, ${docs} ${plural(docs,'dokument','dokumenty','dokumentů')}. Otevřete klávesou Enter.`);
      const s=el.querySelector('.surface');
      s.style.background=`linear-gradient(90deg,${col.css},${shade(col.css,-18)})`;
      s.style.height=height+'px';
      el.onclick=()=>{path=[path[0],si,bi];render();announce(`Otevřen šanon ${b.name}, barva ${col.label}.`);};
      row.appendChild(el);
    });
    const board=document.createElement('div'); board.className='shelf-board';
    shelf.append(h,row,board); rack.appendChild(shelf);
  });
  stage.appendChild(rack);
}

function renderFolders(){
  const b=binder(), col=BINDER_COLORS[b.color];
  titleEl.textContent=b.name;
  hintEl.textContent=`Šanon, barva ${col.label} · ${b.folders.length} ${plural(b.folders.length,'desky','desky','desek')}`;
  const wrap=document.createElement('div'); wrap.className='folders';
  wrap.setAttribute('role','group'); wrap.setAttribute('aria-label',`Desky v šanonu ${b.name}`);
  b.folders.forEach((f,fi)=>{
    const c=FOLDER_COLORS[f.color];
    const el=mkItem('folder',
      `<span class="folder-tab" style="background:${c.tab}"></span>
       <span class="folder-name">${f.name}</span>
       <span class="folder-meta">${f.docs.length} ${plural(f.docs.length,'dokument','dokumenty','dokumentů')}</span>`,
      `Desky ${f.name}, barva ${c.label}, v šanonu ${b.name}. `+
      `${f.docs.length} ${plural(f.docs.length,'dokument','dokumenty','dokumentů')}. Otevřete klávesou Enter.`);
    el.querySelector('.surface').style.background=c.css;
    el.onclick=()=>{path=[path[0],path[1],path[2],fi];render();announce(`Otevřeny desky ${f.name}, barva ${c.label}.`);};
    wrap.appendChild(el);
  });
  stage.appendChild(wrap);
}

function renderDocs(){
  const f=folder(), c=FOLDER_COLORS[f.color];
  titleEl.textContent=f.name;
  hintEl.textContent=`Desky, barva ${c.label} · obsah`;
  if(!f.docs.length){
    const e=document.createElement('p'); e.className='empty'; e.textContent='Desky jsou prázdné. Vložte první dokument.';
    stage.appendChild(e); return;
  }
  const wrap=document.createElement('div'); wrap.className='docs';
  wrap.setAttribute('role','group'); wrap.setAttribute('aria-label',`Dokumenty v deskách ${f.name}`);
  f.docs.forEach(doc=>{
    const t=DOC_TYPES[doc.type];
    const el=mkItem('doc',
      `<span class="doc-icon" aria-hidden="true">${t.icon}</span>
       <span class="doc-name">${doc.name}</span>
       <span class="doc-meta">${t.label} · ${doc.size}</span>`,
      `Dokument ${doc.name}, typ ${t.label}, velikost ${doc.size}, v deskách ${f.name}.`);
    el.onclick=()=>announce(`Náhled dokumentu ${doc.name} zatím není v prototypu k dispozici.`);
    wrap.appendChild(el);
  });
  stage.appendChild(wrap);
}

function renderCrumbs(){
  crumbs.innerHTML='';
  const steps=[{t:'Kartotéky',len:0}];
  if(path.length>=1) steps.push({t:cabinet().name,len:1});
  if(path.length>=3) steps.push({t:binder().name,len:3});
  if(path.length>=4) steps.push({t:folder().name,len:4});
  steps.forEach((s,i)=>{
    if(i) {const sep=document.createElement('span');sep.className='sep';sep.textContent='›';sep.setAttribute('aria-hidden','true');crumbs.appendChild(sep);}
    if(i===steps.length-1){
      const cu=document.createElement('span'); cu.className='here'; cu.setAttribute('aria-current','true'); cu.textContent=s.t;
      crumbs.appendChild(cu);
    }else{
      const b=document.createElement('button'); b.type='button'; b.textContent=s.t;
      b.setAttribute('aria-label',`Zpět na ${s.t}`);
      b.onclick=()=>{path=path.slice(0,s.len);render();announce(`${s.t}.`);};
      crumbs.appendChild(b);
    }
  });
}

/* ====== navigace klávesnicí ====== */
function focusItem(i,scroll=true){
  if(!items.length) return;
  i=Math.max(0,Math.min(items.length-1,i));
  items[cur]?.classList.remove('kbfocus');
  items[cur]&&(items[cur].tabIndex=-1);
  cur=i; items[cur].tabIndex=0;
  items[cur].focus({preventScroll:!scroll});
  items[cur].classList.add('kbfocus');
}
function rows(){
  const map=new Map();
  items.forEach((el,i)=>{
    const top=Math.round(el.getBoundingClientRect().top/10);
    if(!map.has(top)) map.set(top,[]);
    map.get(top).push(i);
  });
  return [...map.entries()].sort((a,b)=>a[0]-b[0]).map(e=>e[1]);
}
function move(dir){
  const R=rows();
  const r=R.findIndex(row=>row.includes(cur));
  const posInRow=R[r].indexOf(cur);
  if(dir==='left') focusItem(R[r][Math.max(0,posInRow-1)]);
  else if(dir==='right') focusItem(R[r][Math.min(R[r].length-1,posInRow+1)]);
  else{
    const nr=dir==='up'?r-1:r+1;
    if(nr<0||nr>=R.length) return;
    focusItem(R[nr][Math.min(posInRow,R[nr].length-1)]);
  }
}
function goBack(){
  if(path.length===0){announce('Jste na nejvyšší úrovni, kartotéky.');return;}
  const last=path.length===1?path[0]:(path.length===3?path[2]:path[3]);
  path=path.length===4?path.slice(0,3):(path.length===3?path.slice(0,1):[]);
  render(path.length===1?undefined:last);
  announce(titleEl.textContent+'.');
}
function announce(msg){live.textContent=''; setTimeout(()=>live.textContent=msg,60);}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();goBack();return;}
  if(!items.includes(document.activeElement)) return;
  const k=e.key;
  if(k==='ArrowLeft'){e.preventDefault();move('left');}
  else if(k==='ArrowRight'){e.preventDefault();move('right');}
  else if(k==='ArrowUp'){e.preventDefault();move('up');}
  else if(k==='ArrowDown'){e.preventDefault();move('down');}
  else if(k==='Home'){e.preventDefault();const R=rows();focusItem(R[R.findIndex(r=>r.includes(cur))][0]);}
  else if(k==='End'){e.preventDefault();const R=rows();const r=R[R.findIndex(x=>x.includes(cur))];focusItem(r[r.length-1]);}
  else if(k==='Backspace'){e.preventDefault();goBack();}
});
stage.addEventListener('focusin',e=>{
  const i=items.indexOf(e.target);
  if(i>-1&&i!==cur){items[cur]?.classList.remove('kbfocus');cur=i;}
});

/* pomocná: ztmavení barvy */
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);
  const f=(v)=>Math.max(0,Math.min(255,Math.round(v+v*pct/100)));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;
}

render();
</script>
