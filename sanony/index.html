/* ================= akce nad soubory ================= */

function zamceno(nazev){
  var z = najdi(nazev);
  if (z && z.locked){ stav("Soubor " + nazev + " je uzamčen. Nejprve jej odemkněte.", "err"); return true; }
  return false;
}

function stahnout(nazev){
  if (!kontrola(false)) return;
  if (jeOdkaz(najdi(nazev))){ stav("Odkaz na web nelze stáhnout.", "err"); return; }
  stav("Stahuji " + nazev + ".");
  ziskejSoubor(nazev).then(function(d){
    if (!d.content) throw new Error("Soubor je příliš velký pro přímé stažení přes API.");
    var blob = new Blob([base64NaBytes(d.content)], { type: mime(nazev) });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nazev;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
    stav("Soubor " + nazev + " byl stažen.", "ok");
  }).catch(function(e){ stav("Stažení se nezdařilo: " + e.message, "err"); });
}

function nahrat(nazev){
  if (!kontrola(true)) return;
  if (jeOdkaz(najdi(nazev))){ stav("K odkazu na web nelze nahrát soubor.", "err"); return; }
  if (zamceno(nazev)) return;
  var vstup = document.createElement("input");
  vstup.type = "file";
  vstup.addEventListener("change", function(){
    var soubor = vstup.files && vstup.files[0];
    if (!soubor) return;
    if (soubor.name !== nazev) log("Vybraný soubor " + soubor.name + " se uloží jako " + nazev + ".");
    stav("Nahrávám novou verzi " + nazev + ".");
    var c = new FileReader();
    c.onload = function(){ odesliVerzi(nazev, bytesNaBase64(new Uint8Array(c.result)), "z místního souboru " + soubor.name); };
    c.onerror = function(){ stav("Soubor se nepodařilo přečíst.", "err"); };
    c.readAsArrayBuffer(soubor);
  });
  vstup.click();
}

function kopirovat(nazev){
  if (!kontrola(false)) return;
  if (jeOdkaz(najdi(nazev))){ stav("Odkaz na web nemá obsah ke zkopírování.", "err"); return; }
  if (!textovy(nazev)){ stav("Do schránky lze zkopírovat pouze textový soubor.", "err"); return; }
  ziskejSoubor(nazev).then(function(d){
    var text = new TextDecoder().decode(base64NaBytes(d.content));
    return navigator.clipboard.writeText(text).then(function(){
      stav("Obsah souboru " + nazev + " byl zkopírován.", "ok");
    });
  }).catch(function(e){ stav("Kopírování se nezdařilo: " + e.message, "err"); });
}

function vlozit(nazev){
  if (!kontrola(true)) return;
  if (jeOdkaz(najdi(nazev))){ stav("Do odkazu na web nelze vložit obsah.", "err"); return; }
  if (zamceno(nazev)) return;
  if (!textovy(nazev)){ stav("Ze schránky lze vložit pouze textový obsah.", "err"); return; }
  navigator.clipboard.readText().then(function(text){
    if (!confirm("Nahradit obsah souboru " + nazev + " textem ze schránky (" + text.length + " znaků)?")) return;
    odesliVerzi(nazev, textNaBase64(text), "z obsahu schránky");
  }).catch(function(e){
    stav("Ze schránky se nepodařilo číst: " + e.message, "err");
  });
}

function odesliVerzi(nazev, base64, zdroj){
  var z = najdi(nazev);
  if (z && z.locked){ stav("Soubor " + nazev + " je uzamčen.", "err"); return; }
  var nova = (z && z.version ? z.version : 0) + 1;

  ziskejSoubor(nazev).catch(function(e){
    if (e.status === 404) return null;
    throw e;
  }).then(function(existujici){
    return ulozSoubor(nazev, base64, "Nová verze " + nazev + " (v" + nova + ") " + zdroj,
                      existujici ? existujici.sha : undefined);
  }).then(function(d){
    shaMapa[nazev] = d.content.sha;
    velikostiRepo[nazev] = d.content.size;
    if (z){ z.version = nova; z.updated = new Date().toISOString(); z.size = d.content.size; }
    else {
      metadata = metadata || { nodes:[], files:[] };
      metadata.files.push({ name:nazev, description:"", folder:"", version:nova,
                            created:new Date().toISOString(), updated:new Date().toISOString(),
                            size:d.content.size });
    }
    return ulozMetadata("Aktualizace metadat po uložení " + nazev);
  }).then(function(){
    stav("Uložena verze " + nova + " souboru " + nazev + ".", "ok");
    oznam("Uložena verze " + nova);
    vykresli();
  }).catch(function(e){ stav("Uložení se nezdařilo: " + e.message, "err"); });
}

function prepniZamek(nazev, zamknout, box){
  if (!kontrola(true)){ if (box) box.checked = !zamknout; return; }
  var z = najdi(nazev);
  if (!z){ if (box) box.checked = !zamknout; return; }
  var puvodni = !!z.locked;
  if (zamknout) z.locked = true; else delete z.locked;
  z.updated = new Date().toISOString();
  ulozMetadata((zamknout ? "Uzamčení " : "Odemčení ") + nazev).then(function(){
    stav("Soubor " + nazev + (zamknout ? " byl uzamčen." : " byl odemčen."), "ok");
    vykresli();
  }).catch(function(e){
    if (zamknout) delete z.locked; else z.locked = puvodni;
    if (box) box.checked = puvodni;
    stav("Změna zámku se nezdařila: " + e.message, "err");
  });
}

function smazat(nazev){
  if (!kontrola(true)) return;
  if (zamceno(nazev)) return;
  var odkaz = jeOdkaz(najdi(nazev));
  if (!confirm(odkaz
      ? ("Opravdu odstranit odkaz " + nazev + "? Akci nelze vzít zpět.")
      : ("Opravdu odstranit soubor " + nazev + " z repozitáře i z metadat? Akci nelze vzít zpět."))) return;
  stav("Odstraňuji " + nazev + ".");
  var telo = { message: "Odstranění souboru " + nazev, sha: shaMapa[nazev] };
  if (cfg.vetev) telo.branch = cfg.vetev;

  var krok = (shaMapa[nazev] && !odkaz)
    ? api("/repos/" + cfg.repo + "/contents/" + encCesta(nazev), { method:"DELETE", body: telo })
    : Promise.resolve(null);

  krok.then(function(){
    if (!metadata) return null;
    var pred = metadata.files.length;
    metadata.files = metadata.files.filter(function(f){ return f.name !== nazev; });
    if (metadata.files.length === pred) return null;
    return ulozMetadata("Odstranění " + nazev + " z metadat");
  }).then(function(){
    stav((odkaz ? "Odkaz " : "Soubor ") + nazev + " byl odstraněn.", "ok");
    delete shaMapa[nazev];
    if (pohled.typ === "soubor" && pohled.nazev === nazev) zpet();
    else vykresli();
  }).catch(function(e){ stav("Odstranění se nezdařilo: " + e.message, "err"); });
}

function otevriZarazeni(nazev){
  if (!kontrola(true)) return;
  if (!metadata || najdi(nazev)) return;
  if (editace) vykresli();
  editace = { rezim:"zarazeni", nazev:nazev };
  var s = el("stage");
  var f = panel("Zařadit soubor " + nazev + " do archivu");
  var pi = document.createElement("p");
  pi.className = "fhint";
  pi.style.margin = "0 0 12px";
  pi.textContent = "Soubor v repozitáři leží, ale folder.json o něm neví. " +
    "Vyberte, kam v archivu patří; samotný soubor se nikam nepřesouvá.";
  f.appendChild(pi);

  var iCil = poleUmisteni(f, "za-cil", "Kam soubor uložit", posledniCil || "");
  var iPopis = poleTextarea(f, "za-popis", "Popis", "");
  var dejStitky = poleStitky(f, []);

  var akce = document.createElement("div");
  akce.style.marginTop = "16px";
  akce.appendChild(tlacitko("Zařadit", "primary", function(){
    zaradSoubor(nazev, iCil.value, iPopis.value, dejStitky());
  }));
  akce.appendChild(tlacitko("Zrušit", "", zavriEdit));
  f.appendChild(akce);
  s.insertBefore(f, s.firstChild);
  polozky = [];
  iCil.focus();
}

function zaradSoubor(nazev, cil, popis, tagy){
  if (!kontrola(true)) return;
  if (!metadata || najdi(nazev)) return;
  var ted = new Date().toISOString();
  metadata.files.push({
    name:nazev, description:String(popis || "").trim(), folder:normCesta(cil), version:1,
    tags:tagy || [], notes:[], created:ted, updated:ted,
    size: velikostiRepo[nazev]
  });
  posledniCil = normCesta(cil);
  ulozMetadata("Zařazení " + nazev + " do archivu").then(function(){
    stav("Soubor " + nazev + " byl zařazen do archivu: " + popisUmisteni(cil) + ".", "ok");
    editace = null;
    vykresli();
    oznam("Zařazeno: " + popisUmisteni(cil));
  }).catch(function(e){
    metadata.files = metadata.files.filter(function(f){ return f.name !== nazev; });
    stav("Zařazení se nezdařilo: " + e.message, "err");
  });
}

function vytvorNovy(nazev, popis, slozka, vstup, tagy){
  if (!kontrola(true)) return;
  nazev = String(nazev || "").trim();
  popis = String(popis || "").trim();

  var soubor = vstup && vstup.files && vstup.files[0];
  if (!nazev && soubor) nazev = soubor.name;

  if (!nazev){
    stav("Zadejte název souboru včetně přípony, nebo vyberte soubor a název se převezme z něj.", "err");
    el("ns-nazev").focus();
    return;
  }
  if (/[\\/]/.test(nazev)){ stav("Název nesmí obsahovat lomítka.", "err"); el("ns-nazev").focus(); return; }
  if (nazev === "folder.json"){ stav("Název folder.json je vyhrazen pro metadata.", "err"); return; }
  if (nazev.indexOf(".") <= 0){ if (!confirm("Název neobsahuje příponu. Pokračovat?")) return; }
  if (!metadata){ stav("Nejprve načtěte nebo založte folder.json.", "err"); return; }
  if (najdi(nazev)){ stav("Položka s tímto názvem je již v archivu evidována.", "err"); return; }

  function dokonci(base64, zdroj){
    ziskejSoubor(nazev).catch(function(e){
      if (e.status === 404) return null;
      throw e;
    }).then(function(existujici){
      if (existujici && !confirm("Soubor " + nazev + " už v repozitáři existuje. Přepsat jej?"))
        throw new Error("Zrušeno uživatelem.");
      return ulozSoubor(nazev, base64, "Vytvoření souboru " + nazev + " " + zdroj,
                        existujici ? existujici.sha : undefined);
    }).then(function(d){
      shaMapa[nazev] = d.content.sha;
      velikostiRepo[nazev] = d.content.size;
      metadata.files.push({
        name:nazev, description:popis, folder:slozka, version:1, tags:tagy || [], notes:[],
        created:new Date().toISOString(), updated:new Date().toISOString(),
        size:d.content.size
      });
      return ulozMetadata("Zápis metadat pro " + nazev);
    }).then(function(){
      stav("Soubor " + nazev + " byl vytvořen.", "ok");
      oznam("Vytvořeno: " + nazev);
      editace = null;
      vykresli(0);
    }).catch(function(e){ stav("Vytvoření se nezdařilo: " + e.message, "err"); });
  }

  stav("Vytvářím soubor " + nazev + ".");
  if (soubor){
    var c = new FileReader();
    c.onload = function(){ dokonci(bytesNaBase64(new Uint8Array(c.result)), "z místního souboru " + soubor.name); };
    c.onerror = function(){ stav("Vybraný soubor se nepodařilo přečíst.", "err"); };
    c.readAsArrayBuffer(soubor);
  }else{
    dokonci("", "jako prázdný soubor");
  }
}

/* ================= Markdown ================= */

/* Knihovny se stahují až ve chvíli, kdy je opravdu potřeba náhled markdownu.
   Adresy míří na neměnnou verzi a jsou zajištěné otiskem (integrity), takže
   podvržený obsah prohlížeč odmítne spustit. */
var MD_KNIHOVNY = [
  { nazev:"marked",
    url:"https://cdn.jsdelivr.net/npm/marked@18.0.10/lib/marked.umd.js",
    otisk:"sha384-JD1I1oSYdjlw8850MjNFhpmRtgBZ97SjJYg9IJUE1RxR3DgG8oo4R43qLGMkd99t",
    hotovo:function(){ return typeof window.marked !== "undefined"; } },
  { nazev:"DOMPurify",
    url:"https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js",
    otisk:"sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t",
    hotovo:function(){ return typeof window.DOMPurify !== "undefined"; } }
];

var mdPriprava = null;

function nactiSkript(k){
  if (k.hotovo()) return Promise.resolve();
  return new Promise(function(hotovoOk, chyba){
    var dokonceno = false;
    function konec(fn, arg){
      if (dokonceno) return;
      dokonceno = true;
      fn(arg);
    }
    var s = document.createElement("script");
    s.src = k.url;
    s.integrity = k.otisk;
    s.crossOrigin = "anonymous";
    s.async = true;
    s.onload = function(){
      if (k.hotovo()) konec(hotovoOk);
      else konec(chyba, new Error("knihovna " + k.nazev + " se nenačetla"));
    };
    s.onerror = function(){
      konec(chyba, new Error("knihovnu " + k.nazev + " se nepodařilo stáhnout"));
    };
    /* Kdyby prohlížeč neohlásil ani úspěch, ani chybu, ať náhled nezůstane viset. */
    setTimeout(function(){
      konec(chyba, new Error("knihovna " + k.nazev + " se nenačetla včas"));
    }, 15000);
    document.head.appendChild(s);
  });
}

function zajistiMarkdown(){
  if (mdPriprava) return mdPriprava;
  mdPriprava = MD_KNIHOVNY.reduce(function(retez, k){
    return retez.then(function(){ return nactiSkript(k); });
  }, Promise.resolve()).then(function(){
    nastavCriticMarkup();
    log("Knihovny pro markdown byly načteny.");
  }).catch(function(e){
    mdPriprava = null;
    throw e;
  });
  return mdPriprava;
}

/* CriticMarkup jako rozšíření lexeru, takže se neuplatní uvnitř bloků kódu. */
var criticNastaven = false;
function nastavCriticMarkup(){
  if (criticNastaven) return;
  criticNastaven = true;

  function jednoduche(nazev, zacatek, re, znacka, popis){
    return {
      name: nazev, level: "inline",
      start: function(src){ return src.indexOf(zacatek); },
      tokenizer: function(src){
        var m = re.exec(src);
        if (!m) return;
        return { type: nazev, raw: m[0], deti: this.lexer.inlineTokens(m[1]) };
      },
      renderer: function(t){
        return "<" + znacka + ' data-cm="' + popis + '">' +
               this.parser.parseInline(t.deti) + "</" + znacka + ">";
      }
    };
  }

  window.marked.use({
    gfm: true,
    breaks: false,
    extensions: [
      {
        name: "cmZmena", level: "inline",
        start: function(src){ return src.indexOf("{~~"); },
        tokenizer: function(src){
          var m = /^\{~~([\s\S]*?)~>([\s\S]*?)~~\}/.exec(src);
          if (!m) return;
          return { type:"cmZmena", raw:m[0],
                   stare: this.lexer.inlineTokens(m[1]),
                   nove: this.lexer.inlineTokens(m[2]) };
        },
        renderer: function(t){
          return '<del data-cm="smazáno">' + this.parser.parseInline(t.stare) + "</del>" +
                 '<ins data-cm="vloženo">' + this.parser.parseInline(t.nove) + "</ins>";
        }
      },
      jednoduche("cmVlozeno",   "{++", /^\{\+\+([\s\S]*?)\+\+\}/, "ins",  "vloženo"),
      jednoduche("cmSmazano",   "{--", /^\{--([\s\S]*?)--\}/,     "del",  "smazáno"),
      jednoduche("cmZvyrazneno","{==", /^\{==([\s\S]*?)==\}/,     "mark", "zvýrazněno"),
      {
        name: "cmPoznamka", level: "inline",
        start: function(src){ return src.indexOf("{>>"); },
        tokenizer: function(src){
          var m = /^\{>>([\s\S]*?)<<\}/.exec(src);
          if (!m) return;
          return { type:"cmPoznamka", raw:m[0], deti: this.lexer.inlineTokens(m[1]) };
        },
        renderer: function(t){
          return '<span class="cm-pozn" data-cm="poznámka">' +
                 this.parser.parseInline(t.deti) + "</span>";
        }
      }
    ]
  });
}

function mdSkryty(text){
  var s = document.createElement("span");
  s.className = "sr-only";
  s.textContent = text;
  return s;
}

/* Vykreslení markdownu do zadaného prvku. */
function markdownDoDom(text, rodic){
  var html = window.marked.parse(String(text));
  /* Sanitizace vrací rovnou uzly, nikoli řetězec, takže se nikde nepoužije innerHTML. */
  var zlomek = window.DOMPurify.sanitize(html, {
    RETURN_DOM_FRAGMENT: true,
    FORBID_TAGS: ["style", "form", "iframe", "object", "embed"],
    FORBID_ATTR: ["style"]
  });
  upravNahled(zlomek);
  rodic.appendChild(zlomek);
}

/* Doladění hotového stromu: hloubka nadpisů, popisy změn, odkazy a obrázky. */
function upravNahled(koren){
  var i;

  /* Nadpisy o dvě úrovně níž, aby navazovaly na nadpis stránky. */
  var nadpisy = koren.querySelectorAll("h1,h2,h3,h4,h5,h6");
  for (i = nadpisy.length - 1; i >= 0; i--){
    var st = nadpisy[i];
    var nova = Math.min(6, parseInt(st.tagName.charAt(1), 10) + 2);
    var novy = document.createElement("h" + nova);
    while (st.firstChild) novy.appendChild(st.firstChild);
    if (st.parentNode) st.parentNode.replaceChild(novy, st);
  }

  /* CriticMarkup: doplnit popis pro odečítač. */
  var zmeny = koren.querySelectorAll("[data-cm]");
  for (i = 0; i < zmeny.length; i++){
    zmeny[i].insertBefore(mdSkryty(zmeny[i].getAttribute("data-cm") + ": "), zmeny[i].firstChild);
  }

  /* Bloky kódu popsat. */
  var kody = koren.querySelectorAll("pre");
  for (i = 0; i < kody.length; i++){
    var kod = kody[i].querySelector("code");
    var jazyk = kod && kod.className ? /language-([^\s]+)/.exec(kod.className) : null;
    kody[i].setAttribute("aria-label", jazyk ? ("Blok kódu, jazyk " + jazyk[1]) : "Blok kódu");
  }

  /* Externí odkazy do nového okna. */
  var odkazy = koren.querySelectorAll("a[href]");
  for (i = 0; i < odkazy.length; i++){
    if (/^https?:/i.test(odkazy[i].getAttribute("href"))){
      odkazy[i].target = "_blank";
      odkazy[i].rel = "noopener noreferrer";
    }
  }

  /* Obrázky odkazující na soubor v archivu. */
  var obrazky = koren.querySelectorAll("img[src]");
  for (i = 0; i < obrazky.length; i++) mdZdroj(obrazky[i]);
}

function mdZdroj(img){
  var src = img.getAttribute("src") || "";
  if (/^(https?:|data:|blob:)/i.test(src)) return;
  var jmeno = src.split("/").pop();
  try{ jmeno = decodeURIComponent(jmeno); }catch(e){ /* ponecháme jak je */ }
  var zaznam = najdi(jmeno);
  if (!zaznam || jeOdkaz(zaznam)){
    img.removeAttribute("src");
    img.alt = (img.alt ? img.alt + " " : "") + "(obrázek " + jmeno + " v archivu není)";
    return;
  }
  if (OFFLINE){ img.src = odkazSouboru(jmeno); return; }
  img.removeAttribute("src");
  stahniBytes(jmeno).then(function(b){
    img.src = novyBlobUrl(b, mime(jmeno));
  }).catch(function(){
    img.alt = (img.alt ? img.alt + " " : "") + "(obrázek " + jmeno + " se nepodařilo načíst)";
  });
}

/* ================= náhled obsahu ================= */

var blobUrly = [];
function novyBlobUrl(bytes, typ){
  var u = URL.createObjectURL(new Blob([bytes], { type: typ }));
  blobUrly.push(u);
  return u;
}
function uklidBlobUrly(){
  blobUrly.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  blobUrly = [];
}

var NAHLED = [
  { typ:"md",    ext:/^(md|markdown|mdown|mkd|mkdn)$/,                        popis:"Markdown" },
  { typ:"obraz", ext:/^(png|jpg|jpeg|gif|webp|svg|bmp|avif)$/,                popis:"Obrázek" },
  { typ:"zvuk",  ext:/^(mp3|wav|ogg|oga|m4a|aac|flac|opus)$/,                 popis:"Zvuk" },
  { typ:"video", ext:/^(mp4|webm|ogv|m4v|mov)$/,                              popis:"Video" }
];

function nahledTyp(f){
  if (jeOdkaz(f)) return null;
  var e = pripona(f.name);
  for (var i = 0; i < NAHLED.length; i++){ if (NAHLED[i].ext.test(e)) return NAHLED[i]; }
  return null;
}

/* Obsah souboru: offline z rozbalené složky, online z GitHubu. */
function nactiObsah(nazev){
  if (OFFLINE){
    return fetch(odkazSouboru(nazev)).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function(ab){ return new Uint8Array(ab); });
  }
  return stahniBytes(nazev);
}

function vykresliNahled(rodic, f){
  var t = nahledTyp(f);
  if (!t) return;
  if (!OFFLINE && !Object.prototype.hasOwnProperty.call(shaMapa, f.name)) return;

  var sekce = document.createElement("section");
  sekce.className = "nahled";
  var h2 = document.createElement("h2");
  h2.textContent = "Náhled";
  sekce.appendChild(h2);

  var telo = document.createElement("div");
  sekce.appendChild(telo);
  rodic.appendChild(sekce);

  var vel = velikostiRepo[f.name] !== undefined ? velikostiRepo[f.name] : f.size;
  var velky = (typeof vel === "number") && vel > 2097152;

  /* Zvuk a video se v offline kopii berou přímo ze složky, prohlížeč si je dotáhne sám. */
  if (OFFLINE && (t.typ === "zvuk" || t.typ === "video")){
    telo.appendChild(prehravac(t.typ, odkazSouboru(f.name), f.name));
    return;
  }
  if (OFFLINE && t.typ === "obraz"){
    telo.appendChild(obrazek(odkazSouboru(f.name), f.name));
    return;
  }

  if (t.typ === "zvuk" || t.typ === "video" || velky){
    var info = document.createElement("p");
    info.className = "fhint";
    info.style.margin = "0 0 10px";
    info.textContent = t.popis + ", velikost " + velikost(vel) + ". Načte se až na vyžádání.";
    telo.appendChild(info);
    telo.appendChild(tlacitko("Zobrazit náhled", "", function(){
      telo.textContent = "";
      nactiDoNahledu(telo, f, t);
    }, "Zobrazit náhled souboru " + f.name));
    return;
  }

  nactiDoNahledu(telo, f, t);
}

function nactiDoNahledu(telo, f, t){
  var cekej = document.createElement("p");
  cekej.className = "fhint";
  cekej.style.margin = "0";
  cekej.textContent = "Načítám náhled.";
  telo.appendChild(cekej);

  nactiObsah(f.name).then(function(bytes){
    if (t.typ !== "md"){
      telo.textContent = "";
      var url = novyBlobUrl(bytes, mime(f.name));
      if (t.typ === "obraz") telo.appendChild(obrazek(url, f.name));
      else telo.appendChild(prehravac(t.typ, url, f.name));
      return;
    }
    var zdroj = new TextDecoder().decode(bytes);
    return zajistiMarkdown().then(function(){
      telo.textContent = "";
      var box = document.createElement("div");
      box.className = "md";
      markdownDoDom(zdroj, box);
      telo.appendChild(box);
    }).catch(function(e){
      /* Bez knihoven se text aspoň ukáže tak, jak je. */
      telo.textContent = "";
      var pozn = document.createElement("p");
      pozn.className = "nahled-chyba";
      pozn.textContent = "Formátovaný náhled není k dispozici (" + e.message +
        "). Následuje nezpracovaný zdroj.";
      telo.appendChild(pozn);
      var pre = document.createElement("pre");
      var code = document.createElement("code");
      code.textContent = zdroj;
      pre.appendChild(code);
      telo.appendChild(pre);
    });
  }).catch(function(e){
    telo.textContent = "";
    var ch = document.createElement("p");
    ch.className = "nahled-chyba";

      (OFFLINE ? " Náhled markdownu vyžaduje, aby kopie běžela na webovém serveru." : "");
    telo.appendChild(ch);
  });
}

/* ================= offline kopie (ZIP) ================= */

function odkazSouboru(nazev){ return "soubory/" + encodeURIComponent(nazev); }

var CRC_TAB = null;
function crcTab(){
  if (CRC_TAB) return CRC_TAB;
  var t = new Uint32Array(256);
  for (var n=0;n<256;n++){
    var c = n;
    for (var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  CRC_TAB = t;
  return t;
}
function crc32(bytes){
  var t = crcTab(), c = 0xFFFFFFFF;
  for (var i=0;i<bytes.length;i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function u16(v){ return [v & 255, (v >>> 8) & 255]; }
function u32(v){ return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
function dosCas(d){
  return {
    cas: ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((Math.floor(d.getSeconds()/2)) & 31),
    dat: (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth()+1) & 15) << 5) | (d.getDate() & 31)
  };
}

function ctiProud(rs){
  var reader = rs.getReader(), kusy = [], delka = 0;
  function krok(){
    return reader.read().then(function(r){
      if (r.done){
        var out = new Uint8Array(delka), o = 0;
        kusy.forEach(function(k){ out.set(k, o); o += k.length; });
        return out;
      }
      kusy.push(r.value);
      delka += r.value.length;
      return krok();
    });
  }
  return krok();
}

/* Deflate přes CompressionStream, jinak uložení bez komprese. */
function komprimuj(bytes){
  if (typeof CompressionStream === "undefined" || !bytes.length)
    return Promise.resolve({ method:0, data:bytes });
  try{
    var cs = new CompressionStream("deflate-raw");
    var w = cs.writable.getWriter();
    w.write(bytes);
    w.close();
    return ctiProud(cs.readable).then(function(out){
      return out.length < bytes.length ? { method:8, data:out } : { method:0, data:bytes };
    }).catch(function(){ return { method:0, data:bytes }; });
  }catch(e){
    return Promise.resolve({ method:0, data:bytes });
  }
}

function zipVytvor(polozky){
  var d = new Date(), t = dosCas(d);
  var enc = new TextEncoder();
  var casti = [], centralni = [], offset = 0, i = 0;

  function dalsi(){
    if (i >= polozky.length) return Promise.resolve();
    var pol = polozky[i++];
    var jmeno = enc.encode(pol.name);
    var crc = crc32(pol.data);
    return komprimuj(pol.data).then(function(k){
      var lokal = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(k.method),
        u16(t.cas), u16(t.dat), u32(crc), u32(k.data.length), u32(pol.data.length),
        u16(jmeno.length), u16(0));
      casti.push(new Uint8Array(lokal), jmeno, k.data);
      centralni.push({ jmeno:jmeno, crc:crc, method:k.method,
                       komp:k.data.length, puvod:pol.data.length, offset:offset });
      offset += lokal.length + jmeno.length + k.data.length;
      return dalsi();
    });
  }

  return dalsi().then(function(){
    var zacatekCD = offset, cdDelka = 0;
    centralni.forEach(function(c){
      var hl = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(c.method),
        u16(t.cas), u16(t.dat), u32(c.crc), u32(c.komp), u32(c.puvod),
        u16(c.jmeno.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset));
      casti.push(new Uint8Array(hl), c.jmeno);
      cdDelka += hl.length + c.jmeno.length;
    });
    var konec = [].concat(u32(0x06054b50), u16(0), u16(0), u16(centralni.length),
      u16(centralni.length), u32(cdDelka), u32(zacatekCD), u16(0));
    casti.push(new Uint8Array(konec));
    return new Blob(casti, { type:"application/zip" });
  });
}

/* Obsah souboru z GitHubu; nad 1 MB přes Git Blob API. */
function stahniBytes(nazev){
  return ziskejSoubor(nazev).then(function(d){
    if (d.content) return base64NaBytes(d.content);
    if (d.sha){
      return api("/repos/" + cfg.repo + "/git/blobs/" + d.sha).then(function(b){
        if (!b || !b.content) throw new Error("obsah nelze načíst");
        return base64NaBytes(b.content);
      });
    }
    throw new Error("obsah nelze načíst");
  });
}

function offlineIndex(seznam){
  var data = {
    nazev: nazevArchivu(),
    repo: cfg.repo,
    vetev: cfg.vetev,
    vytvoreno: new Date().toISOString(),
    metadata: metadata,
    soubory: seznam.map(function(f){
      return { name: f.name, size: (velikostiRepo[f.name] !== undefined ? velikostiRepo[f.name] : f.size) };
    })
  };
  var json = JSON.stringify(data).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
  return "<!DOCTYPE html>\n<html lang=\"cs\">\n<head>\n" + SNIMEK_HEAD + "\n</head>\n<body>\n" +
         "<script>window.ARCHIV_OFFLINE = " + json + ";<\/script>\n" +
         SNIMEK_BODY + "\n</body>\n</html>\n";
}

function exportZip(){
  if (!kontrola(false)) return;
  if (!metadata){ stav("Není co exportovat.", "err"); return; }

  var seznam = metadata.files.filter(function(f){
    return !jeOdkaz(f) && Object.prototype.hasOwnProperty.call(shaMapa, f.name);
  });
  var pocetOdkazu = metadata.files.filter(jeOdkaz).length;
  var chybi = metadata.files.length - seznam.length - pocetOdkazu;
  var polozky = [], i = 0;
  var tl = el("btn-zip");
  if (tl) tl.disabled = true;
  stav("Připravuji offline kopii, " + pocetSlov(seznam.length, "soubor") + ".");

  function dalsi(){
    if (i >= seznam.length) return Promise.resolve();
    var f = seznam[i];
    stav("Stahuji " + (i+1) + " z " + seznam.length + ": " + f.name + ".");
    return stahniBytes(f.name).then(function(b){
      polozky.push({ name: "soubory/" + f.name, data: b });
      i++;
      return dalsi();
    });
  }

  dalsi().then(function(){
    stav("Sestavuji ZIP.");
    var enc = new TextEncoder();
    polozky.unshift({ name:"index.html", data: enc.encode(offlineIndex(seznam)) });
    polozky.push({ name:"folder.json", data: enc.encode(JSON.stringify(metadata, null, 2)) });
    /* Aby GitHub Pages nepustilo na složku Jekyll a nevynechalo soubory
       začínající podtržítkem. Na jiných serverech soubor nevadí. */
    polozky.push({ name:".nojekyll", data: new Uint8Array(0) });
    return zipVytvor(polozky);
  }).then(function(blob){
    var zaklad = (metadata.title || cfg.slozka || cfg.repo).replace(/[^0-9A-Za-zÀ-ž_-]+/g, "-").replace(/^-+|-+$/g, "");
    var jmeno = "archiv-" + (zaklad || "kopie") + "-" + new Date().toISOString().slice(0,10) + ".zip";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = jmeno;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 8000);
    stav("Offline kopie byla uložena jako " + jmeno +
         (chybi ? ". " + chybi + " " + pluralCz(chybi,"soubor v repozitáři chybí a v kopii není",
            "soubory v repozitáři chybí a v kopii nejsou","souborů v repozitáři chybí a v kopii nejsou") : "."), "ok");
    oznam("Offline kopie uložena");
  }).catch(function(e){
    stav("Export se nezdařil: " + e.message, "err");
  }).then(function(){
    var t2 = el("btn-zip");
    if (t2) t2.disabled = false;
  });
}

function rezimOffline(){
  var c = el("sprava");
  if (c){
    var l = c.parentNode;
    if (l && l.parentNode) l.parentNode.removeChild(l);
  }
  ["btn-obnovit","btn-nastaveni"].forEach(function(id){
    var b = el(id);
    if (b && b.parentNode) b.parentNode.removeChild(b);
  });
}
