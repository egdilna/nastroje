<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIN Editor — Target Instruction Notation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .instruction-do { border-left: 4px solid #10b981; }
        .instruction-dont { border-left: 4px solid #ef4444; }
        .instruction-note { border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900" x-data="tinEditor()">

    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 text-white p-1.5 rounded-lg">
                    <i data-lucide="target" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight"><span x-text="t('appName')">TIN Editor</span> <span class="text-gray-400 font-normal text-sm">v1.0</span></h1>
            </div>
            <div class="flex gap-2 items-center flex-wrap justify-end">
                <div class="flex items-center rounded-md border border-gray-300 overflow-hidden text-xs font-semibold mr-1" :title="t('langSwitchTitle')">
                    <button @click="setUiLang('cs')" :class="uiLang === 'cs' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'" class="px-2 py-1.5" :aria-pressed="uiLang === 'cs'">CS</button>
                    <button @click="setUiLang('en')" :class="uiLang === 'en' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'" class="px-2 py-1.5 border-l border-gray-300" :aria-pressed="uiLang === 'en'">EN</button>
                </div>
                <label class="flex items-center gap-1.5 text-xs text-gray-600 select-none cursor-pointer mr-1" :title="t('minifyTitle')">
                    <input type="checkbox" x-model="minify" class="rounded border-gray-300">
                    <span x-text="t('minify')"></span>
                </label>
                <button @click="importJSON" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50" :title="t('importTitle')">
                    <i data-lucide="upload" class="w-4 h-4"></i> <span x-text="t('import')"></span>
                </button>
                <button @click="pasteJSON" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50" :title="t('pasteTitle')">
                    <i data-lucide="clipboard-paste" class="w-4 h-4"></i> <span x-text="t('paste')"></span>
                </button>
                <button @click="copyJSON" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50" :title="t('copyTitle')">
                    <i data-lucide="clipboard-copy" class="w-4 h-4"></i> <span x-text="t('copy')"></span>
                </button>
                <button @click="exportJSON" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 shadow-sm" :title="t('exportTitle')">
                    <i data-lucide="download" class="w-4 h-4"></i> <span x-text="t('export')"></span>
                </button>
                <button @click="openPrompt" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-white bg-emerald-600 rounded-md hover:bg-emerald-700 shadow-sm" :title="t('promptTitle')">
                    <i data-lucide="file-text" class="w-4 h-4"></i> <span x-text="t('prompt')"></span>
                </button>
                <a :href="'docs-' + uiLang + '.md'" target="_blank" rel="noopener" class="flex items-center px-2 py-2 text-gray-500 hover:text-indigo-600" :title="t('helpTitle')" :aria-label="t('helpTitle')">
                    <i data-lucide="circle-help" class="w-5 h-5"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 pb-32">
        
        <section class="bg-white p-6 rounded-xl shadow-sm border mb-8">
            <div class="flex items-center gap-2 mb-6 text-indigo-600">
                <i data-lucide="info" class="w-5 h-5"></i>
                <h2 class="text-lg font-bold text-gray-800" x-text="t('metadata')"></h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('fieldId')"></label>
                    <input type="text" x-model="tin.metadata.id" placeholder="cz.example.role-name" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('fieldName')"></label>
                    <input type="text" x-model="tin.metadata.name" :placeholder="t('namePlaceholder')" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('fieldLang')"></label>
                    <input type="text" x-model="tin.metadata.lang" placeholder="en-US" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('fieldVersion')"></label>
                    <input type="text" x-model="tin.metadata.version" placeholder="1.0.0" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border p-2">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('fieldPurpose')"></label>
                    <textarea x-model="tin.metadata.purpose" rows="2" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border p-2"></textarea>
                </div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm border mb-8">
            <div class="flex items-center gap-2 mb-6 text-indigo-600">
                <i data-lucide="map" class="w-5 h-5"></i>
                <h2 class="text-lg font-bold text-gray-800" x-text="t('context')"></h2>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('scope')"></label>
                    <input type="text" x-model="tin.context.scope" class="w-full border-gray-300 rounded-md shadow-sm border p-2 sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('outOfScope')"></label>
                    <input type="text" x-model="tin.context.out_of_scope" class="w-full border-gray-300 rounded-md shadow-sm border p-2 sm:text-sm">
                </div>
            </div>
        </section>

        <section class="mb-8">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2 text-indigo-600">
                    <i data-lucide="list-checks" class="w-5 h-5"></i>
                    <h2 class="text-lg font-bold text-gray-800" x-text="t('sections')"></h2>
                </div>
                <button @click="addSection(tin.sections)" class="text-sm bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-md hover:bg-indigo-100 font-medium" x-text="t('addTopSection')"></button>
            </div>

            <template x-for="(section, index) in tin.sections" :key="section.id">
                <div class="bg-white border rounded-xl mb-4 overflow-hidden shadow-sm">
                    <div class="bg-gray-50 px-4 py-3 border-b flex justify-between items-center">
                        <div class="flex items-center gap-4 flex-1">
                            <input type="text" x-model="section.title" :placeholder="t('sectionTitlePh')" class="font-bold bg-transparent border-none focus:ring-0 p-0 text-gray-800 w-1/3">
                            <input type="text" x-model="section.id" placeholder="section-id" class="text-xs font-mono text-gray-400 bg-transparent border-none focus:ring-0 p-0">
                        </div>
                        <button @click="removeSection(tin.sections, index)" class="text-red-400 hover:text-red-600" :title="t('deleteSection')">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <div class="p-4">
                        <div class="space-y-3 mb-4">
                            <template x-for="(inst, iIdx) in section.instructions" :key="iIdx">
                                <div :class="'flex gap-3 p-3 rounded-lg border ' + 'instruction-' + inst.type">
                                    <select x-model="inst.type" class="text-xs font-bold uppercase border-none bg-gray-100 rounded focus:ring-0">
                                        <option value="do" x-text="t('typeDo')"></option>
                                        <option value="dont" x-text="t('typeDont')"></option>
                                        <option value="note" x-text="t('typeNote')"></option>
                                    </select>
                                    <textarea x-model="inst.text" rows="1" class="flex-1 border-none focus:ring-0 text-sm p-0 bg-transparent" :placeholder="t('instructionPh')"></textarea>
                                    <button @click="section.instructions.splice(iIdx, 1)" class="text-gray-300 hover:text-red-500" :title="t('deleteInstruction')">
                                        <i data-lucide="x" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </template>
                        </div>
                        
                        <div class="flex gap-2">
                            <button @click="addInstruction(section)" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded hover:bg-gray-200" x-text="t('addInstruction')"></button>
                            <button @click="addArea(section)" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded hover:bg-gray-200" x-text="t('addArea')"></button>
                        </div>

                        <div x-show="section.areas && section.areas.length > 0" class="mt-4 ml-6 border-l-2 border-dashed pl-4 space-y-4">
                             <template x-for="(area, aIdx) in section.areas" :key="area.id">
                                <div class="bg-gray-50 border rounded-lg p-3">
                                    <div class="flex justify-between items-center mb-2">
                                        <input type="text" x-model="area.title" class="font-semibold text-sm bg-transparent border-none p-0 focus:ring-0" :placeholder="t('subTitlePh')">
                                        <button @click="section.areas.splice(aIdx, 1)" class="text-red-300 hover:text-red-500" :title="t('deleteArea')"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                                    </div>
                                    <template x-for="(ai, aiIdx) in area.instructions" :key="aiIdx">
                                        <div class="flex gap-2 mb-1">
                                            <div :class="'w-1 rounded ' + (ai.type=='do'?'bg-emerald-500':ai.type=='dont'?'bg-red-500':'bg-blue-500')"></div>
                                            <input type="text" x-model="ai.text" class="text-xs flex-1 border-none bg-white rounded px-1" placeholder="...">
                                        </div>
                                    </template>
                                    <button @click="addInstruction(area)" class="text-[10px] text-indigo-500 mt-1 uppercase font-bold" x-text="t('addStep')"></button>
                                </div>
                             </template>
                        </div>
                    </div>
                </div>
            </template>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm border mb-8">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2 text-indigo-600">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <h2 class="text-lg font-bold text-gray-800" x-text="t('files')"></h2>
                </div>
                <button @click="addFile()" class="text-sm bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-md hover:bg-indigo-100 font-medium" x-text="t('addFile')"></button>
            </div>
            <div class="space-y-4">
                <template x-for="(file, fIdx) in tin.files" :key="fIdx">
                    <div class="p-4 border rounded-lg relative bg-gray-50/50">
                        <button @click="tin.files.splice(fIdx, 1)" class="absolute top-4 right-4 text-gray-400 hover:text-red-500" :title="t('deleteFile')">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-gray-400" x-text="t('fileId')"></label>
                                <input type="text" x-model="file.id" class="w-full border-gray-200 rounded text-sm p-1">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-gray-400" x-text="t('fileUri')"></label>
                                <input type="text" x-model="file.uri" class="w-full border-gray-200 rounded text-sm p-1">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[10px] uppercase font-bold text-gray-400" x-text="t('fileUnderstand')"></label>
                                <input type="text" x-model="file.understand" :placeholder="t('fileUnderstandPh')" class="w-full border-gray-200 rounded text-sm p-1">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[10px] uppercase font-bold text-gray-400" x-text="t('fileUse')"></label>
                                <input type="text" x-model="file.use" :placeholder="t('fileUsePh')" class="w-full border-gray-200 rounded text-sm p-1">
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm border mb-8">
            <div class="flex items-center gap-2 mb-6 text-indigo-600">
                <i data-lucide="terminal" class="w-5 h-5"></i>
                <h2 class="text-lg font-bold text-gray-800" x-text="t('output')"></h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('outputDesc')"></label>
                    <textarea x-model="tin.output.description" rows="2" :placeholder="t('outputDescPh')" class="w-full border-gray-300 rounded-md shadow-sm border p-2 sm:text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" x-text="t('outputMime')"></label>
                    <input type="text" x-model="tin.output.language" placeholder="text/markdown" class="w-full border-gray-300 rounded-md shadow-sm border p-2 sm:text-sm">
                </div>
            </div>
        </section>

    </main>

    <div x-show="showPrompt" x-cloak @keydown.escape.window="showPrompt = false"
         class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] flex flex-col" @click.stop>
            <div class="flex items-center justify-between px-6 py-4 border-b">
                <div class="flex items-center gap-2 text-emerald-600">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <h3 class="text-lg font-bold text-gray-800" x-text="t('modalTitle')"></h3>
                </div>
                <button @click="showPrompt = false" class="text-gray-400 hover:text-gray-600" :title="t('close')">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex-1 overflow-auto p-6">
                <textarea x-model="generatedPrompt" readonly class="w-full h-96 font-mono text-xs border border-gray-200 rounded-md p-3 bg-gray-50"></textarea>
            </div>
            <div class="flex justify-end gap-2 px-6 py-4 border-t bg-gray-50 rounded-b-xl">
                <button @click="showPrompt = false" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50" x-text="t('close')"></button>
                <button @click="copyPrompt" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                    <i data-lucide="clipboard-copy" class="w-4 h-4"></i> <span x-text="t('copyToClipboard')"></span>
                </button>
                <button @click="downloadPrompt" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-emerald-600 rounded-md hover:bg-emerald-700 shadow-sm">
                    <i data-lucide="download" class="w-4 h-4"></i> <span x-text="t('downloadMd')"></span>
                </button>
            </div>
        </div>
    </div>

    <input type="file" id="importFile" class="hidden" @change="handleFileImport" accept=".json">

                clipboardNotJson: 'Obsah schránky není platný JSON.',
                promptCopied: 'Systémový prompt zkopírován do schránky.',
                loadedFromFile: 'TIN úspěšně načten!',
                fileParseError: 'Soubor JSON se nepodařilo načíst.',
                // Generovaný prompt
                pRole: 'Role',
                pUnnamed: '(bez názvu)',
                pId: 'id',
                pVersion: 'verze',
                pLang: 'jazyk',
                pScopeHeading: 'Rozsah a hranice',
                pInScope: 'V rozsahu:',
                pOutOfScope: 'Mimo rozsah:',
                pProhibitions: 'Výslovné zákazy:',
                pActiveRules: 'Aktivní pravidla',
                pNotesHeading: 'Kontext a poznámky',
                pAssumptions: 'Předpoklady:',
                pMaterials: 'Odkazované materiály',
                pWhatItIs: 'Co to je:',
                pHowToUse: 'Jak použít:',
                pWhereToLook: 'Kde hledat:',
                pWhatToIgnore: 'Co ignorovat:',
                pOutputFormat: 'Formát výstupu',
                pOutputLanguage: 'Jazyk výstupu:',
                pGeneratedFrom: 'Vygenerováno z TIN',
                pNoId: 'bez id'
            }
        };
        const TIN_KLIC_JAZYKA = 'tineditor.jazyk';

        function tinVychoziJazyk() {
            try {
                const ulozeny = localStorage.getItem(TIN_KLIC_JAZYKA);
                if (ulozeny && TIN_TEXTY[ulozeny]) return ulozeny;
            } catch (e) { /* úložiště nedostupné */ }
            const prohlizec = (navigator.language || '').toLowerCase();
            return (prohlizec.startsWith('cs') || prohlizec.startsWith('sk')) ? 'cs' : 'en';
        }

        function tinEditor() {
            return {
                tin: {
                    tin: "1.0",
                    metadata: {
                        id: "",
                        name: "",
                        lang: "en",
                        version: "1.0.0",
                        purpose: "",
                        type: "role"
                    },
                    context: {
                        scope: "",
                        out_of_scope: ""
                    },
                    sections: [],
                    files: [],
                    output: {
                        description: "",
                        language: "text/markdown"
                    }
                },

                uiLang: tinVychoziJazyk(),
                minify: false,
                showPrompt: false,
                generatedPrompt: "",

                // Text rozhraní v aktuálním jazyce (záloha: angličtina, pak samotný klíč)
                t(klic) {
                    const texty = TIN_TEXTY[this.uiLang] || TIN_TEXTY.en;
                    return texty[klic] !== undefined ? texty[klic] : (TIN_TEXTY.en[klic] !== undefined ? TIN_TEXTY.en[klic] : klic);
                },

                // Text promptu v jazyce obsahu TIN (metadata.lang); neznámý jazyk -> jazyk rozhraní
                pt(klic) {
                    const lang = String((this.tin.metadata && this.tin.metadata.lang) || '').toLowerCase();
                    const jazyk = lang.startsWith('cs') ? 'cs' : lang.startsWith('en') ? 'en' : this.uiLang;
                    const texty = TIN_TEXTY[jazyk] || TIN_TEXTY.en;
                    return texty[klic] !== undefined ? texty[klic] : TIN_TEXTY.en[klic];
                },

                setUiLang(jazyk) {
                    if (!TIN_TEXTY[jazyk]) return;
                    this.uiLang = jazyk;
                    try { localStorage.setItem(TIN_KLIC_JAZYKA, jazyk); } catch (e) { /* úložiště nedostupné */ }
                },

                applyUiLang() {
                    document.documentElement.lang = this.uiLang;
                    document.title = this.t('appTitle');
                },

                init() {
                    this.applyUiLang();
                    this.$watch('uiLang', () => this.applyUiLang());
                    // Nový TIN dostane jazyk obsahu podle jazyka rozhraní
                    this.tin.metadata.lang = this.uiLang;

                    // Start with one empty section
                    this.addSection(this.tin.sections);
                    lucide.createIcons();
                    
                    // Refresh icons after Alpine renders
                    this.$watch('tin', () => {
                        this.$nextTick(() => lucide.createIcons());
                    });
                },

                addSection(targetArray) {
                    const id = 'sec-' + Math.random().toString(36).substr(2, 5);
                    targetArray.push({
                        id: id,
                        title: '',
                        instructions: [],
                        areas: []
                    });
                },

                removeSection(targetArray, index) {
                    if (confirm(this.t('confirmDeleteSection'))) {
                        targetArray.splice(index, 1);
                    }
                },

                addInstruction(section) {
                    if (!section.instructions) section.instructions = [];
                    section.instructions.push({ type: 'do', text: '' });
                },

                addArea(section) {
                    if (!section.areas) section.areas = [];
                    this.addSection(section.areas);
                },

                addFile() {
                    this.tin.files.push({
                        id: 'file-' + (this.tin.files.length + 1),
                        uri: '',
                        understand: '',
                        use: ''
                    });
                },

                serialize() {
                    return this.minify
                        ? JSON.stringify(this.tin)
                        : JSON.stringify(this.tin, null, 2);
                },

                exportJSON() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(this.serialize());
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", (this.tin.metadata.id || "instruction") + ".tin.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                },

                async copyJSON() {
                    try {
                        await navigator.clipboard.writeText(this.serialize());
                        alert(this.minify
                            ? this.t('copiedMinified')
                            : this.t('copiedFormatted'));
                    } catch (err) {
                        alert(this.t('clipboardDenied'));
                    }
                },

                async pasteJSON() {
                    try {
                        const text = await navigator.clipboard.readText();
                        if (!text) { alert(this.t('clipboardEmpty')); return; }
                        const imported = JSON.parse(text);
                        this.tin = Object.assign({}, this.tin, imported);
                        alert(this.t('loadedFromClipboard'));
                    } catch (err) {
                        if (err instanceof SyntaxError) {
                            alert(this.t('clipboardNotJson'));
                        } else {
                            alert(this.t('clipboardDenied'));
                        }
                    }
                },

                openPrompt() {
                    this.generatedPrompt = this.generatePromptText();
                    this.showPrompt = true;
                    this.$nextTick(() => lucide.createIcons());
                },

                async copyPrompt() {
                    try {
                        await navigator.clipboard.writeText(this.generatedPrompt);
                        alert(this.t('promptCopied'));
                    } catch (err) {
                        alert(this.t('clipboardDenied'));
                    }
                },

                downloadPrompt() {
                    const dataStr = "data:text/markdown;charset=utf-8," + encodeURIComponent(this.generatedPrompt);
                    const a = document.createElement('a');
                    a.setAttribute("href", dataStr);
                    a.setAttribute("download", (this.tin.metadata.id || "instruction") + ".prompt.md");
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                },

                collectByType(sections, type, out) {
                    if (!sections) return out;
                    for (const s of sections) {
                        if (Array.isArray(s.instructions)) {
                            for (const i of s.instructions) {
                                if (i.type === type && i.text && i.text.trim()) {
                                    out.push(i.text.trim());
                                }
                            }
                        }
                        if (Array.isArray(s.areas)) this.collectByType(s.areas, type, out);
                    }
                    return out;
                },

                generatePromptText() {
                    const m = this.tin.metadata || {};
                    const c = this.tin.context || {};
                    const lines = [];
                    lines.push('# ' + this.pt('pRole') + ': ' + (m.name || this.pt('pUnnamed')));
                    lines.push('');
                    if (m.purpose) { lines.push(m.purpose); lines.push(''); }
                    const meta = [];
                    if (m.id) meta.push(this.pt('pId') + ': `' + m.id + '`');
                    if (m.version) meta.push(this.pt('pVersion') + ': ' + m.version);
                    if (m.lang) meta.push(this.pt('pLang') + ': ' + m.lang);
                    if (meta.length) { lines.push('*(' + meta.join(', ') + ')*'); lines.push(''); }

                    const donts = this.collectByType(this.tin.sections, 'dont', []);
                    if (c.scope || c.out_of_scope || donts.length) {
                        lines.push('## ' + this.pt('pScopeHeading'));
                        lines.push('');
                        if (c.scope) { lines.push('**' + this.pt('pInScope') + '** ' + c.scope); lines.push(''); }
                        if (c.out_of_scope) { lines.push('**' + this.pt('pOutOfScope') + '** ' + c.out_of_scope); lines.push(''); }
                        if (donts.length) {
                            lines.push('**' + this.pt('pProhibitions') + '**');
                            lines.push('');
                            donts.forEach(t => lines.push('- ' + t));
                            lines.push('');
                        }
                    }

                    const dos = this.collectByType(this.tin.sections, 'do', []);
                    if (dos.length) {
                        lines.push('## ' + this.pt('pActiveRules'));
                        lines.push('');
                        dos.forEach(t => lines.push('- ' + t));
                        lines.push('');
                    }

                    const notes = this.collectByType(this.tin.sections, 'note', []);
                    if (notes.length || c.assumptions) {
                        lines.push('## ' + this.pt('pNotesHeading'));
                        lines.push('');
                        if (c.assumptions) { lines.push('**' + this.pt('pAssumptions') + '** ' + c.assumptions); lines.push(''); }
                        notes.forEach(t => lines.push('- ' + t));
                        if (notes.length) lines.push('');
                    }

                    if (Array.isArray(this.tin.files) && this.tin.files.length) {
                        lines.push('## ' + this.pt('pMaterials'));
                        lines.push('');
                        this.tin.files.forEach(f => {
                            lines.push('### ' + (f.id || this.pt('pUnnamed')) + ': `' + (f.uri || '') + '`');
                            lines.push('');
                            if (f.understand) { lines.push('**' + this.pt('pWhatItIs') + '** ' + f.understand); lines.push(''); }
                            if (f.use) { lines.push('**' + this.pt('pHowToUse') + '** ' + f.use); lines.push(''); }
                            if (f.scope) { lines.push('**' + this.pt('pWhereToLook') + '** ' + f.scope); lines.push(''); }
                            if (f.ignore) { lines.push('**' + this.pt('pWhatToIgnore') + '** ' + f.ignore); lines.push(''); }
                        });
                    }

                    if (this.tin.output) {
                        lines.push('## ' + this.pt('pOutputFormat'));
                        lines.push('');
                        if (this.tin.output.description) { lines.push(this.tin.output.description); lines.push(''); }
                        if (this.tin.output.language) { lines.push('**' + this.pt('pOutputLanguage') + '** ' + this.tin.output.language); lines.push(''); }
                    }

                    lines.push('---');
                    lines.push('');
                    lines.push('*' + this.pt('pGeneratedFrom') + ' ' + (this.tin.tin || '?') + ' (' + (m.id || this.pt('pNoId')) + ', ' + this.pt('pVersion') + ' ' + (m.version || '?') + ').*');

                    return lines.join('\n');
                },

                importJSON() {
                    document.getElementById('importFile').click();
                },

                handleFileImport(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            // Basic merge to ensure reactivity and required structure
                            this.tin = Object.assign({}, this.tin, imported);
                            alert(this.t('loadedFromFile'));
                        } catch (err) {
                            alert(this.t('fileParseError'));
                        }
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
</body>
</html>
